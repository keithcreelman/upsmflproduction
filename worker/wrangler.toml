name = "upsmflproduction"
main = "src/index.js"
compatibility_date = "2026-02-02"

# Explicit CPU ceiling (was unset -> account default). The */5 auction poll has
# died mid-run twice during the live 2026-07-26 FAA with a captured
# "Worker exceeded CPU time limit." outcome nearby in the same window — its
# per-tick cost scales with total auction volume (bids/lots/narration
# coalescing), so it plausibly tips over a low default as the auction grows,
# even on ticks with nothing unusual in the code path. Raising this is
# purely additive and cannot make anything slower or riskier.
[limits]
cpu_ms = 30000

# Drop-tracker cron flags (Keith 2026-06-03: "All 3 — full auto"). Kept in
# version control — NOT dashboard secrets — so they can't silently vanish the
# way the Discord channels / GIPHY key did. The */5 scheduled handler reads
# these each tick:
#   DROP_TRACKER_ENABLED        → run /admin/drops/scan-and-record (detect+record)
#   DROP_TRACKER_AUTO_POST      → post each drop announcement to Discord
#   DROP_TRACKER_POST_MFL       → auto-write computed cap penalties to MFL
#   DROP_TRACKER_DISCORD_TARGET → "prod" (real drops channel) or "test"
# NOTE: the prod drops channel currently falls back to a hardcoded id
# (1059111651846131833) because DISCORD_DROPS_CHANNEL_ID is unset — re-add that
# secret if a different channel is wanted.
[vars]
# Rule Proposals v2 (2026-07-15). LIVE ships OFF — dark-launch: publishes DM
# only the commish + run in the test channel until he flips it in Kill Switches.
RULE_PROPOSALS_ENABLED = "1"
RULE_PROPOSALS_LIVE = "0"
RULE_PROPOSALS_AI_ENABLED = "1"
RULE_PROPOSALS_DRAFT_ENABLED = "1"
# OTB ("On the Block") announcements (Keith 2026-07-20). These were NEVER set,
# so every trade-bait save returned {posted:false, reason:"no_channel"} — no
# OTB announcement has ever reached Discord. The post is thread-based: the
# announcement lands in the channel and a discussion thread ("OTB · Team ·
# date") is created off it. LIVE_MODE=1 → the dedicated OTB channel.
OTB_CHANNEL_ID = "1277369023880757412"
OTB_TEST_CHANNEL_ID = "1089538054236160010"
OTB_LIVE_MODE = "1"

# Config-health pin (Keith 2026-07-20): these were read with hardcoded `|| "id"`
# fallbacks, so an unset var "worked" but silently — the exact class that broke
# GUILD_ID/RULES/OTB in prod. Pinning the current fallback values here makes them
# explicit + version-controlled (zero behavior change). LEAGUE_ID + the commish
# Discord ids likewise. Draft posts → transactions (Keith 2026-07-20); pinning
# DISCORD_DRAFT_CHANNEL_ID also resolves the split-brain (code had two fallbacks,
# 1059… vs 1498…, so draft posts landed in different channels by code path).
LEAGUE_ID = "74598"
COMMISH_DISCORD_USER_ID = "621530026831118346,1057654821638897715"
DISCORD_DRAFT_CHANNEL_ID = "1059111651846131833"
DISCORD_DRAFT_TEST_CHANNEL_ID = "1089538054236160010"
DISCORD_PICKS_THREAD_PARENT_CHANNEL_ID = "1059111651846131833"
DISCORD_REMINDER_CHANNEL_ID = "1087157907419840644"
DISCORD_DROPS_CHANNEL_ID = "1059111651846131833"
# Trade sentinel (2026-07-15): watch every pending offer, kill asset-moved
# offers, 14-day silent re-offer. ACT ships OFF — dry-run until the L=25625
# battery + Keith's prod self-test clear it.
TRADE_SENTINEL_ENABLED = "1"
TRADE_SENTINEL_ACT_ENABLED = "0"
TRADE_SENTINEL_ADOPT_NATIVE = "0"
TRADE_SENTINEL_TEST_FRANCHISES = ""
DROP_TRACKER_ENABLED = "1"
DROP_TRACKER_AUTO_POST = "1"
DROP_TRACKER_POST_MFL = "1"
DROP_TRACKER_DISCORD_TARGET = "prod"

# Trade-offer Discord DMs (worker/src/trade_dm.js). When a recipient gets a
# trade offer through our app (mobile builder OR desktop War Room), DM them the
# offer + buttons, then remind on the cadence below until it resolves.
#   TRADE_DM_ENABLED          "1" arms the feature; anything else = dark (kill switch).
#   TRADE_DM_TEST_FRANCHISES  CSV allowlist — a DM fires only if the TARGET franchise
#                             is listed. Empty = ALL owners (LIVE — go-live 2026-06-13).
#   TRADE_DM_EXPIRY_DAYS      MFL pending-trade lifetime. Cadence (creation-anchored):
#                             immediate · +48h · day 3 · day 4 · day 5 · day 6, then
#                             stop (the offer expires at day 7). "Think about it" →
#                             one courtesy reminder on day 4. Every reminder states
#                             the expiry.
TRADE_DM_ENABLED = "1"
TRADE_DM_TEST_FRANCHISES = ""
TRADE_DM_EXPIRY_DAYS = "7"

# 3-way trades (worker/src/trade_3way.js). ENABLED=1 arms the feature (DMs +
# acceptance). EXECUTE=1 = LIVE MFL writes (the commish runs the chained 2-party
# trades + applies any pre-trade extensions); 0 = DRY-RUN. TRADE_3WAY_TEST_FRANCHISES
# is the rollout allowlist (empty = all 12).
# GO-LIVE 2026-06-13 (Keith, explicit): EXECUTE=1 + allowlist open to everyone.
# MFL can't undo a completed trade — execution is ordered, verified between legs,
# and all-or-nothing with a critical commish alert on a partial failure.
TRADE_3WAY_ENABLED = "1"
TRADE_3WAY_EXECUTE = "1"
TRADE_3WAY_TEST_FRANCHISES = ""

# In-app mobile auction bidding (Phase 1). Default OFF: the mobile Bid/Nominate
# buttons fall back to MFL's O=43 deep-link until the commish flips this ON in the
# FO Kill Switches panel. ON = the worker submits MFL's auction form on the
# owner's behalf (fragile — flip OFF instantly if MFL's auction page changes).
AUCTION_INAPP_BID_ENABLED = "0"

# Per-auction "is it live" switches (commish flips in FO Kill Switches). Default
# OFF: the ERA/FAA tabs show a read-only eligible pool until the commish turns the
# auction on. ON = live board + (with AUCTION_INAPP_BID_ENABLED) in-app bidding.
AUCTION_ERA_ENABLED = "0"
AUCTION_FAA_ENABLED = "0"

# FAA auto-finalize (2026-07-16). When an FA-Auction lot closes MFL leaves the
# contract a $1K/0-year STUB. "1" arms the */5 auction poller to auto-write the
# real 1-year Vet-FAA contract at the won price (parity with ERA's Vet-ERA;
# owners still convert to 2/3-year via MYAC). DARK by default: unlike ERA — safe
# via its curated ups_era_pool INNER JOIN — the FAA path finalizes EVERY non-ERA
# won lot on PROD (processAuctionPoll runs against the real league), so it stays
# OFF until Keith flips it. The admin route /admin/auction/finalize-faa-contracts
# (+ its dry_run=1 preview) works regardless of this switch.
AUCTION_FAA_FINALIZE_ENABLED = "0"

# §F RULE 2 missed-nom fines default OFF (dark/test mode) — the flag was in
# FEATURE_FLAGS with no env default here, so its baseline lived only in code.
AUCTION_FAA_PENALTIES_ENABLED = "0"

# Nightly 9:30 PM ET FA-Auction daily report (worker/src/auction_nudge.js).
# When ON *and* AUCTION_FAA_ENABLED is on, the "30 1,2 * * *" cron posts the
# nomination scoreboard to the Auction Bidding channel (tagging only the owners
# who still owe) + a thread with open lots and the positions matrix. Dry-run any
# time via POST /admin/auction/run-nightly-nudge?APIKEY=…&force=1 (&live=1 sends).
#
# This "0" is only a DEFAULT. A D1 override (ups_settings key 'feature_flags',
# set from the FO panel) WINS — on 2026-07-14 the job fired while this said "0".
# To know whether it's armed, read the FO panel or GET /admin/commish-settings,
# never this file.
AUCTION_NIGHTLY_NUDGE_ENABLED = "0"

# Hourly drop → cap-penalty scan at :05 past each hour (RULE-WORKFLOW-004).
# The worker's scheduled() handler:
#   1. calls /admin/import-drop-penalties logic to post new cap penalties to MFL
#      (dedupes by scanning MFL's own salaryAdjustments for ups_drop_penalty
#      ledger keys — MFL is the canonical ledger, no separate KV needed)
#   2. for each newly posted penalty, POSTs a Discord Cap Penalty Announcement
#      to the Cap Penalties channel.
#   3. at 09:05 UTC, snapshots MFL public exports to R2 bucket (Phase 2
#      backup — see docs/BACKUP_STRATEGY.md).
[triggers]
# Three crons, isolated by job to avoid CPU-budget collisions (lesson from
# 2026-05-08 — three sweeps in parallel on */2 starved each other and the
# */2 ticks all returned "Exceeded CPU Limit"):
#
#   "5 * * * *"        — hourly: once-daily R2 snapshot at 09:05 UTC,
#                        Hall overdue-close sweep, cap-penalty drop scan
#                        (RULE-WORKFLOW-004), deadline reminders, taxi
#                        callup confirms, news warmer.
#   "*/2 * * * *"      — every 2 min: ONLY processPendingSummaries with
#                        LIMIT 1 — at most one Anthropic impact analysis
#                        per tick. Keeps post-lock verdict announcements
#                        snappy (~2-4 min lag) while staying under budget.
#   "5 0,12,18 * * *"  — 3× per day at 00:05, 12:05, 18:05 UTC. That's
#                        8 PM / 8 AM / 2 PM ET (EDT) and 7 PM / 7 AM /
#                        1 PM ET (EST). Avoids the 2 AM ET overnight tick
#                        entirely. Auto-nudge sweep runs here only.
#                        Code-level quiet-hours guard (10 PM – 6 AM ET)
#                        as belt-and-suspenders against DST drift.
#   "*/5 * * * *"      — every 5 min: auction-bid poll + drop-tracker
#                        scan/post. Both I/O-bound and cheap; drops can't
#                        occur during an active auction so they don't
#                        contend (Keith 2026-05-23).
#   "0 1,2,13,14 * * *" — FA-Auction reports, TWICE daily: 9 AM + 9 PM ET.
#                        Fires 4x UTC; the ET-hour gate (etHour===9 || ===21)
#                        keeps exactly 2 per day in BOTH DST regimes:
#                          EDT: 13:00→9 AM ✓  14:00→10 AM ✗  01:00→9 PM ✓  02:00→10 PM ✗
#                          EST: 13:00→8 AM ✗  14:00→9 AM ✓  01:00→8 PM ✗  02:00→9 PM ✓
#                        9 AM = yesterday's FINAL verdict; the only run that
#                        judges, counts a §F RULE 2 offense, or books a fine.
#                        9 PM = a WARNING about the day in progress (it cannot
#                        judge — the ET day hasn't closed). Dark unless
#                        AUCTION_NIGHTLY_NUDGE_ENABLED + AUCTION_FAA_ENABLED.
crons = ["5 * * * *", "*/2 * * * *", "5 0,12,18 * * *", "*/5 * * * *", "0 1,2,13,14 * * *"]

# Self service binding — lets scheduled() and other internal callers
# reach this worker's own admin endpoints via env.SELF.fetch(...) without
# tripping Cloudflare's workers.dev fetch-loop guard (error 1042) that
# blocks `fetch()` on a worker's own public URL.
[[services]]
binding = "SELF"
service = "upsmflproduction"

# R2 bucket for MFL data snapshots + DB backups.
# Access via `env.UPS_MFL_BACKUPS.put(key, body)` inside the Worker.
[[r2_buckets]]
binding = "UPS_MFL_BACKUPS"
bucket_name = "ups-mfl-backups"

# D1 database for Phase 3 — structured MFL data + corrections override
# layer. Worker reads via `env.UPS_MFL_DB.prepare(...).all()`.
# Migrations live in worker/migrations/ and are applied via
# `wrangler d1 migrations apply ups-mfl-db --remote` (or --local for dev).
[[d1_databases]]
binding = "UPS_MFL_DB"
database_name = "ups-mfl-db"
database_id = "8cfe1ddd-749e-476a-9c2c-a359410c6fc1"
migrations_dir = "migrations"

# Second binding to the SAME D1 database for the trade outbox.
# writeOutboxRow checks env.TWB_OUTBOX_DB || env.TWB_DB || env.DB; with
# this binding, outbox writes go to D1 (the table is created at
# runtime by ensureOutboxTable's CREATE TABLE IF NOT EXISTS — no
# separate migration needed). Previously the outbox fell back to the
# GitHub file backend, which shares env.GITHUB_PAT with the trade
# offers store and broke silently when the PAT expired (2026-05-24
# outage diagnosed by Keith 2026-05-28).
[[d1_databases]]
binding = "TWB_OUTBOX_DB"
database_name = "ups-mfl-db"
database_id = "8cfe1ddd-749e-476a-9c2c-a359410c6fc1"

# Bundle league_context_v1.md as a string at build time. Per Keith's
# directive (2026-05-04), this is the SOLE source of truth the AI explainer
# uses for league rules — other rulebook files (rules.json, canonical_rules.md)
# will be folded into league_context over time.
[[rules]]
type = "Text"
globs = ["**/league_context_v1.md"]
fallthrough = true
