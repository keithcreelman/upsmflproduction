name = "upsmflproduction"
main = "src/index.js"
compatibility_date = "2026-02-02"

# Drop-tracker cron flags (Keith 2026-06-03: "All 3 — full auto"). Kept in
# version control — NOT dashboard secrets — so they can't silently vanish the
# way the Discord channels / GIPHY key did. The */5 scheduled handler reads
# these each tick:
#   DROP_TRACKER_ENABLED        → run /admin/drops/scan-and-record (detect+record)
#   DROP_TRACKER_AUTO_POST      → post each drop announcement to Discord
#   DROP_TRACKER_POST_MFL       → auto-write computed cap penalties to MFL
#   DROP_TRACKER_DISCORD_TARGET → "prod" (real drops channel) or "test"
# NOTE: the prod drops channel currently falls back to a hardcoded id
# (1059111651846131833) because DISCORD_DROPS_CHANNEL_ID is unset — re-add that
# secret if a different channel is wanted.
[vars]
DROP_TRACKER_ENABLED = "1"
DROP_TRACKER_AUTO_POST = "1"
DROP_TRACKER_POST_MFL = "1"
DROP_TRACKER_DISCORD_TARGET = "prod"

# Trade-offer Discord DMs (worker/src/trade_dm.js). When a recipient gets a
# trade offer through our app (mobile builder OR desktop War Room), DM them the
# offer + buttons, then remind on a fixed cadence until it resolves.
#   TRADE_DM_ENABLED          "1" arms the feature; anything else = dark (kill switch).
#   TRADE_DM_TEST_FRANCHISES  CSV allowlist — a DM fires only if the TARGET franchise
#                             is listed. Empty = all owners (go-live). Currently the
#                             3-owner test set: LA Looks, Sex Manther, Real Deal Creel.
#   *_CAP_DAYS                anti-spam ceilings (thinking track / any offer).
TRADE_DM_ENABLED = "1"
TRADE_DM_TEST_FRANCHISES = "0001,0007,0008"
TRADE_DM_THINK_CAP_DAYS = "14"
TRADE_DM_HARD_AGE_CAP_DAYS = "21"

# Hourly drop → cap-penalty scan at :05 past each hour (RULE-WORKFLOW-004).
# The worker's scheduled() handler:
#   1. calls /admin/import-drop-penalties logic to post new cap penalties to MFL
#      (dedupes by scanning MFL's own salaryAdjustments for ups_drop_penalty
#      ledger keys — MFL is the canonical ledger, no separate KV needed)
#   2. for each newly posted penalty, POSTs a Discord Cap Penalty Announcement
#      to the Cap Penalties channel.
#   3. at 09:05 UTC, snapshots MFL public exports to R2 bucket (Phase 2
#      backup — see docs/BACKUP_STRATEGY.md).
[triggers]
# Three crons, isolated by job to avoid CPU-budget collisions (lesson from
# 2026-05-08 — three sweeps in parallel on */2 starved each other and the
# */2 ticks all returned "Exceeded CPU Limit"):
#
#   "5 * * * *"        — hourly: once-daily R2 snapshot at 09:05 UTC,
#                        Hall overdue-close sweep, cap-penalty drop scan
#                        (RULE-WORKFLOW-004), deadline reminders, taxi
#                        callup confirms, news warmer.
#   "*/2 * * * *"      — every 2 min: ONLY processPendingSummaries with
#                        LIMIT 1 — at most one Anthropic impact analysis
#                        per tick. Keeps post-lock verdict announcements
#                        snappy (~2-4 min lag) while staying under budget.
#   "5 0,12,18 * * *"  — 3× per day at 00:05, 12:05, 18:05 UTC. That's
#                        8 PM / 8 AM / 2 PM ET (EDT) and 7 PM / 7 AM /
#                        1 PM ET (EST). Avoids the 2 AM ET overnight tick
#                        entirely. Auto-nudge sweep runs here only.
#                        Code-level quiet-hours guard (10 PM – 6 AM ET)
#                        as belt-and-suspenders against DST drift.
#   "*/5 * * * *"      — every 5 min: auction-bid poll + drop-tracker
#                        scan/post. Both I/O-bound and cheap; drops can't
#                        occur during an active auction so they don't
#                        contend (Keith 2026-05-23).
crons = ["5 * * * *", "*/2 * * * *", "5 0,12,18 * * *", "*/5 * * * *"]

# Self service binding — lets scheduled() and other internal callers
# reach this worker's own admin endpoints via env.SELF.fetch(...) without
# tripping Cloudflare's workers.dev fetch-loop guard (error 1042) that
# blocks `fetch()` on a worker's own public URL.
[[services]]
binding = "SELF"
service = "upsmflproduction"

# R2 bucket for MFL data snapshots + DB backups.
# Access via `env.UPS_MFL_BACKUPS.put(key, body)` inside the Worker.
[[r2_buckets]]
binding = "UPS_MFL_BACKUPS"
bucket_name = "ups-mfl-backups"

# D1 database for Phase 3 — structured MFL data + corrections override
# layer. Worker reads via `env.UPS_MFL_DB.prepare(...).all()`.
# Migrations live in worker/migrations/ and are applied via
# `wrangler d1 migrations apply ups-mfl-db --remote` (or --local for dev).
[[d1_databases]]
binding = "UPS_MFL_DB"
database_name = "ups-mfl-db"
database_id = "8cfe1ddd-749e-476a-9c2c-a359410c6fc1"
migrations_dir = "migrations"

# Second binding to the SAME D1 database for the trade outbox.
# writeOutboxRow checks env.TWB_OUTBOX_DB || env.TWB_DB || env.DB; with
# this binding, outbox writes go to D1 (the table is created at
# runtime by ensureOutboxTable's CREATE TABLE IF NOT EXISTS — no
# separate migration needed). Previously the outbox fell back to the
# GitHub file backend, which shares env.GITHUB_PAT with the trade
# offers store and broke silently when the PAT expired (2026-05-24
# outage diagnosed by Keith 2026-05-28).
[[d1_databases]]
binding = "TWB_OUTBOX_DB"
database_name = "ups-mfl-db"
database_id = "8cfe1ddd-749e-476a-9c2c-a359410c6fc1"

# Bundle league_context_v1.md as a string at build time. Per Keith's
# directive (2026-05-04), this is the SOLE source of truth the AI explainer
# uses for league rules — other rulebook files (rules.json, canonical_rules.md)
# will be folded into league_context over time.
[[rules]]
type = "Text"
globs = ["**/league_context_v1.md"]
fallthrough = true
