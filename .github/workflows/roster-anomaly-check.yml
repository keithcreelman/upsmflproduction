name: Roster Anomaly Check

# J3 — daily drift safety net. Diffs the two most recent MFL snapshots and flags
# any roster/contract change with no matching MFL transaction. Flag-only: it
# never edits data.
#
# RED (fails the run, so the scheduled failure is the notification):
#   * unexplained roster moves
#   * CONTRACT REGRESSIONS — contract length / TCV destroyed with no
#     `Restructured` stamp. This is THE detection layer for the 2026-08-02
#     incident, where an automated sweep flattened 18 owner-built multi-year
#     contracts and nothing alerted; a human happened to notice a cap number.
#     Regressions are judged regardless of the transaction log on purpose — all
#     18 were auction winners, so "a transaction mentions this player" silently
#     excused every one of them.
# WARNING only: silent contract edits, and lost Restructured/Ext:/-FL/-BL
#   markers where the money survived.
#
# See docs/SCHEDULED_PIPELINE_AUDIT.md §4 + docs/DATA_AUTHORITY_MAP.md hotspot #0.

on:
  workflow_dispatch:
  schedule:
    - cron: "50 9 * * *" # after mfl-daily-snapshot (09:05) commits the day's pull

concurrency:
  group: roster-anomaly-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # the data-alert issue (BL-I03); nothing else is written

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diff latest two snapshots vs transactions
        run: |
          python pipelines/etl/scripts/check_roster_anomalies.py \
            --report "/tmp/roster_anomaly_report.json"

      - name: Upload anomaly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roster-anomaly-report
          path: /tmp/roster_anomaly_report.json
          if-no-files-found: ignore

      # BL-I03 (Keith 2026-11-22): one data-alert issue per job with counts, timestamps and run links,
      # plus a brief private Discord message (initial, a reminder every 48 h, one recovery). Discord stays
      # off until the repository variable ALERT_DISCORD_ENABLED is "1" and one target variable is set.
      # A failed Discord delivery turns this step red and is written on the issue.
      - name: Alert (data-alert issue + private Discord)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ALERT_DISCORD_ENABLED: ${{ vars.ALERT_DISCORD_ENABLED }}
          ALERT_DISCORD_USER_ID: ${{ secrets.ALERT_DISCORD_USER_ID }}
          ALERT_DISCORD_CHANNEL_ID: ${{ secrets.ALERT_DISCORD_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 pipelines/ops/job_alert.py --job roster-anomaly-check --status "$JOB_STATUS" \
            --run-url "$RUN_URL" \
            --affects "nightly roster and contract drift detection (silent drops, flattened contracts)"
