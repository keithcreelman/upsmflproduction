name: Safe offline tests

# Runs the whole approved offline test suite on every pull request:
#   node scripts/safe_tests/run.mjs
# The same command Claude, Codex and Keith run locally (docs/SAFE_TESTS.md).
#
# This job must never read production, write to MFL / D1 / Discord / GitHub,
# deploy, or call a paid API. So:
#   * it references no secrets; the GITHUB_TOKEN is read-only and is not
#     persisted into .git/config;
#   * it does not comment, label, merge, deploy or upload anything. The result
#     is the check's green/red status plus the job summary;
#   * the suite runs inside a network namespace whose only interface is
#     loopback, as the runner user with every supplementary group dropped (no
#     docker socket) and no-new-privs set (sudo cannot regain root to leave the
#     namespace). The runner refuses to start a test unless its own guards
#     prove external connections are blocked.
# pull_request (never pull_request_target): the job runs the PR's code with no
# secrets and a read-only token, the safe combination for a public repo.
# Actions are pinned to full commit SHAs (tag in the trailing comment).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safe-tests:
    name: Safe offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # some tests read older commits from git history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22" # node:sqlite needs 22.13+

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Public packages from PyPI, before the network is cut. Same pins as
      # nflverse-stats-refresh.yml; two nflverse fetcher tests import them.
      - name: Install Python test dependencies
        run: pip install --quiet nflreadpy==0.1.5 pandas pyarrow

      - name: Run the safe offline suite (loopback-only network namespace)
        run: |
          set -eu
          NODE_BIN="$(command -v node)"
          sudo unshare --net -- /bin/sh -eu -c '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --no-new-privs -- \
              env -i PATH="$3" HOME="$4" GITHUB_ACTIONS=true GITHUB_STEP_SUMMARY="$5" LANG=C.UTF-8 \
              "$6" scripts/safe_tests/run.mjs --expect-no-network
          ' sh "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$GITHUB_STEP_SUMMARY" "$NODE_BIN"
