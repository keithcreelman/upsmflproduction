name: Pre-drop contract audit (one-off, 2026-08-15)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g wrangler
      - name: dump pre_drop_* for 2026 drops
        working-directory: worker
        run: |
          wrangler d1 execute ups-mfl-db --remote --json --command \
            "SELECT player_id, player_name, penalty_basis, pre_drop_taxi, pre_drop_contract_status, pre_drop_salary, pre_drop_contract_year, pre_drop_contract_length, pre_drop_tcv, pre_drop_aav, earned_to_date, substr(COALESCE(pre_drop_contract_info,''),1,60) AS ci, snapshot_source FROM ups_drop_events WHERE season='2026' ORDER BY dropped_at_unix DESC LIMIT 40" \
            2>&1 | tee /tmp/pd.json
      - name: show
        run: python3 scripts/ci_show_predrop_audit.py /tmp/pd.json
