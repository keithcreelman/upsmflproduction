name: Drops catch-up scan (identify missed drops)

# Runs /admin/drops/scan-and-record over a wide lookback window to surface any
# drops that were missed while the drop-tracker cron was disabled. DRY-RUN by
# default — it only DETECTS + computes penalties (no D1 write, no Discord, no
# MFL). Type WRITE to actually record the detected drops to D1 (still no posting
# — Discord/MFL posting is a separate, explicitly-gated step).
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '30'
      mode:
        description: 'Type WRITE to record detected drops to D1 (otherwise dry-run / detect-only)'
        required: false
        default: 'dry-run'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: POST /admin/drops/scan-and-record
        env:
          KEY: ${{ secrets.COMMISH_API_KEY }}
          DAYS: ${{ github.event.inputs.days }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "WRITE" ]; then DRY=0; echo "WRITE mode — recording to D1 (no posting)"; else DRY=1; echo "DRY-RUN mode — detect only"; fi
          URL="https://upsmflproduction.keith-creelman.workers.dev/admin/drops/scan-and-record?L=74598&YEAR=2026&APIKEY=${KEY}"
          curl -s "$URL" -H "Content-Type: application/json" \
            --data "{\"season\":\"2026\",\"league_id\":\"74598\",\"days\":${DAYS},\"dry_run\":${DRY}}" \
            -o resp.json -w "HTTP %{http_code}\n"
          echo "----- detected drops -----"
          python3 - <<'PY'
          import json
          d = json.load(open('resp.json'))
          print("ok:", d.get("ok"), "| dry_run:", d.get("dry_run"), "| written_count:", d.get("written_count"))
          rows = d.get("written") or d.get("drops") or []
          for r in rows:
              print(f"  {r.get('player_name') or r.get('pid')} | fid={r.get('franchise_id') or r.get('fid')} "
                    f"| dropped={r.get('dropped_at_iso','')[:16]} | penalty=${r.get('penalty_amount',0)} "
                    f"| exempt={r.get('penalty_exempt')} {r.get('penalty_exempt_reason','')}")
          sk = d.get("skipped") or []
          if sk:
              print(f"  ({len(sk)} already-recorded/skipped)")
          PY
