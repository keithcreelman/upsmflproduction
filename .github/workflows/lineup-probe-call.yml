name: Lineup probe call (one-off, 2026-08-10)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.COMMISH_API_KEY }}
      WORKER: https://upsmflproduction.keith-creelman.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: '[ -n "$KEY" ] || { echo "::error::COMMISH_API_KEY not set"; exit 1; }'
      - name: fetch probe
        run: curl -sS "$WORKER/admin/lineup-probe?L=74598&FID=0008&APIKEY=$KEY" -o /tmp/probe.json
      - name: show probe
        run: python3 scripts/ci_show_lineup_probe.py /tmp/probe.json
