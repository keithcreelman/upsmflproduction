name: Leaderboard precompute — rebuild the CURRENT season

# The current season's leaderboard changes every time the nflverse ETL lands a
# week (nflverse-stats-refresh.yml), so unlike a completed season it has to be
# rebuilt rather than frozen once.
#
# ALL FIVE ALIASES, ONE RUN. That was not possible until 2026-08-27: the query
# compared src_players.player_id (TEXT) to player_id_crosswalk.mfl_player_id
# (INTEGER), which made SQLite apply numeric affinity to the TEXT side and
# silently lose the primary key, so latest_contract and current_team rescanned
# the whole season slice once per output row (PR #989). Measured per-alias cost
# on prod, before -> after, each verified output-identical against the stored
# board:
#
#     idp     4.8-6.2 M  ->  374,507
#     skill   2.2-2.4 M  ->  315,781
#     qb        ~0.50 M  ->  250,915
#     punter    ~0.40 M  ->  253,916
#     kicker    ~0.39 M  ->  247,812
#     ---------------------------------
#     all five   ~8.8 M  ->  ~1,443,000     = ~29% of the 5,000,000/day free tier
#
# So the whole loop now fits in a single run with room to spare, and idp — which
# used to be the entire daily budget by itself, hence its own scary note here —
# is no longer special.
#
# If a future change pushes this back over budget, the mechanism to spread it
# still exists: only_pos accepts one alias, and this workflow's `pos` input
# takes a comma-separated list.
#
# TRIGGER (2026-09-23 correction pass — replaces a fixed 90-minute-later cron):
# fires on `workflow_run` completion of nflverse-stats-refresh.yml — the ONLY
# thing that changes the answer during a season — rather than guessing how
# long that refresh takes. The fixed offset was measured wrong at least twice
# (Sep 2 and Sep 9 refresh failures both left a stale board with no
# error, because the rebuild ran on schedule regardless of whether the refresh
# it depended on had actually finished or even succeeded), and again on
# 2026-09-23, when the refresh's OWN cron fired 4h19m late the week before and
# was still running long into the day the incident that prompted this file was
# noticed — a 90-minute-later guess cannot track that. `workflow_run` instead
# fires exactly when the upstream job's run actually completes, success or
# not; the job-level `if` below refuses to build on anything but success.
#
# NO SCHEDULED FALLBACK, DELIBERATELY. A time-based cron alongside workflow_run
# would reintroduce exactly the two failure modes this change removes: fire
# BEFORE the refresh finishes (a premature rebuild reading data that has not
# landed yet — indistinguishable from the old bug) or fire redundantly AFTER
# (wasted D1 read budget, and a second build racing the concurrency group
# below). If nflverse-stats-refresh.yml's own schedule is ever disabled or
# stops firing, this workflow correctly does nothing either — there is nothing
# new to build — and that condition is already visible at
# /api/data-freshness (etl_runs.last_run_utc going stale) and via the new
# post-build validation step below, rather than needing a second cron to
# paper over it.
on:
  workflow_run:
    workflows: ["nflverse stats refresh (Player Stats / FPA / Pace / EPA / SoS / ADP crosswalk)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      season:
        description: "Season to rebuild (blank = current)"
        required: false
        default: ""
      pos:
        description: "Which alias to build"
        required: true
        default: "all"
        type: choice
        options: [skill, qb, kicker, punter, idp, all]

permissions:
  contents: read

# Prevents overlapping/duplicate rebuilds — a workflow_run trigger and a
# manual workflow_dispatch landing close together (or two refresh runs
# completing in quick succession) would otherwise race the same D1 rows.
# cancel-in-progress: false, matching nflverse-stats-refresh.yml's own
# group: a rebuild already writing D1 is left to finish; a second trigger
# queues behind it rather than cancelling and losing partial progress.
concurrency:
  group: leaderboard-current-season-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    # Never build on a failed or cancelled refresh. workflow_run fires on
    # EVERY completion of the watched workflow regardless of outcome — this
    # is the one gate that keeps a broken refresh from silently "rebuilding"
    # a board over unchanged (or worse, partially-written) source data.
    # workflow_dispatch carries no workflow_run conclusion at all, so it is
    # allowed unconditionally — manual runs are an explicit human decision,
    # not something this gate should second-guess.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.COMMISH_API_KEY }}
      IN_SEASON: ${{ github.event.inputs.season }}
      IN_POS: ${{ github.event.inputs.pos }}
    steps:
      - uses: actions/checkout@v4
      - run: '[ -n "$KEY" ] || { echo "::error::COMMISH_API_KEY not set"; exit 1; }'

      - name: Pick season and alias
        run: |
          SEASON="${IN_SEASON}"
          [ -n "$SEASON" ] || SEASON="$(date -u +%Y)"
          echo "SEASON=$SEASON" >> "$GITHUB_ENV"

          # workflow_run and a cron-less dispatch both send no pos input, so
          # it lands here empty and means "everything".
          POS="${IN_POS}"
          [ -n "$POS" ] || POS="all"
          echo "POS=$POS" >> "$GITHUB_ENV"
          echo "rebuilding season=$SEASON aliases=$POS (trigger: ${{ github.event_name }}${{ github.event_name == 'workflow_run' && format(', upstream conclusion: {0}', github.event.workflow_run.conclusion) || '' }})"

      - name: Build
        run: |
          RC=0
          # Comma-separated so Thursday's three cheap aliases share a run while
          # still being three separate builds — each is its own request, so one
          # failing does not abandon the others.
          IFS=',' read -ra ALIASES <<< "$POS"
          for A in "${ALIASES[@]}"; do
            echo "--- $A"
            curl -sS -X POST \
              "https://upsmflproduction.keith-creelman.workers.dev/admin/leaderboard-precompute/build?APIKEY=${KEY}&L=74598&YEAR=${SEASON}&season=${SEASON}" \
              -H 'Content-Type: application/json' \
              -d "{\"season\":${SEASON},\"only_pos\":\"${A}\"}" \
              -o "/tmp/pre-$A.json" || { echo "::error::curl failed for $A"; RC=1; continue; }
            python3 - "/tmp/pre-$A.json" <<'PY' || RC=1
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("  ok:", d.get("ok"), "season:", d.get("season"))
          for b in d.get("built") or []:
              print(f"    {b.get('pos'):<8} ok={b.get('ok')} rows={b.get('rows', 0)} {b.get('error','')}")
          bad = [b for b in (d.get("built") or []) if not b.get("ok")]
          if not d.get("ok") or bad:
              # A build that "succeeded" with zero rows, or that was served the
              # precompute it was about to overwrite, is a FAILURE. Both are
              # reported by the route rather than thrown, so they have to be
              # checked here or they pass silently and the board freezes.
              print(f"::error::build failed for {sys.argv[1]}")
              sys.exit(1)
          PY
          done
          exit $RC

      - name: Confirm the stamp actually moved
        run: |
          # The whole freshness contract is data_max_week. If it did not get
          # written, the read gate reports "stale" for the rest of the season
          # while every rebuild keeps reporting success — the exact failure
          # mode source_sha has had in this table since 0140.
          echo "Verify with:"
          echo "  npx wrangler d1 execute ups-mfl-db --remote --command \\"
          echo "    \"SELECT season,pos_alias,row_count,data_max_week,built_at_utc FROM nfl_leaderboard_precompute_meta WHERE season=${SEASON}\""

      # 2026-09-23 correction pass: the step above only ever printed a command
      # to run BY HAND — it asserted nothing, so a rebuild that quietly failed
      # to move the stamp (or a refresh that itself landed behind the real
      # world, the 2026-09-23 incident) reported success regardless. This step
      # actually calls the read route and fails the job honestly when the
      # board it just built is still behind the AUTHORITATIVE completed week
      # — reusing the exact same resolveAuthoritativeCompletedWeek() logic
      # the read route itself now applies (NO_CACHE=1 bypasses the edge cache
      # so this sees the just-written D1 state, not a pre-rebuild cached
      # response). This is a validation of the read path's OWN verdict, not a
      # second/competing definition of "complete."
      - name: Verify the leaderboard is not behind the authoritative week
        run: |
          RC=0
          if [ "$POS" = "all" ]; then
            ALIASES_TO_CHECK=(skill qb kicker punter idp)
          else
            IFS=',' read -ra ALIASES_TO_CHECK <<< "$POS"
          fi
          for P in "${ALIASES_TO_CHECK[@]}"; do
            echo "--- verifying $P"
            curl -sS "https://upsmflproduction.keith-creelman.workers.dev/api/advanced-stats-leaderboard?seasons=${SEASON}&pos=${P}&week_min=1&week_max=17&min_games=1&limit=1&NO_CACHE=1" \
              -o "/tmp/verify-$P.json" || { echo "::error::verify curl failed for $P"; RC=1; continue; }
            python3 - "/tmp/verify-$P.json" "$P" <<'PY' || RC=1
          import json, sys
          d = json.load(open(sys.argv[1]))
          pos = sys.argv[2]
          stale = d.get("stale")
          built = d.get("built_for_week")
          auth = d.get("authoritative_week")
          cur = d.get("current_week")
          print(f"  {pos}: stale={stale} built_for_week={built} authoritative_week={auth} current_week(D1)={cur}")
          if stale is None:
              # Not a current-season precompute response at all (season key
              # absent, or served the live/fail-open path) -- nothing to
              # verify here; the Build step above already checked ok/rows.
              print(f"  {pos}: no stale flag on the response -- skipping (not the current-season precompute path)")
          elif stale:
              print(f"::error::leaderboard for pos={pos} is still stale after rebuild "
                    f"(built_for_week={built}, authoritative_week={auth}, D1 current_week={cur})")
              sys.exit(1)
          PY
          done
          exit $RC
