name: Salary row probe call (one-off, 2026-08-10)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.COMMISH_API_KEY }}
      WORKER: https://upsmflproduction.keith-creelman.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: '[ -n "$KEY" ] || { echo "::error::COMMISH_API_KEY not set"; exit 1; }'
      - name: fetch salary row
        run: curl -sS "$WORKER/admin/salary-row-probe?L=74598&YEAR=2026&PID=15738&APIKEY=$KEY" -o /tmp/salrow.json
      - name: show salary row
        run: python3 scripts/ci_show_salary_row.py /tmp/salrow.json
