name: Revert Chris Rodriguez contract (one-off)

# Restores Chris Rodriguez (pid 16174, franchise 0008) from the test 2yr MYAC
# back to his ERA contract: 1yr Vet-ERA $3K. silence_discord so no announcement
# fires for the revert. Dry-run unless you type WRITE.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type WRITE to apply the revert (otherwise dry-run)'
        required: true
        default: 'dry-run'

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: POST /commish-contract-update (revert)
        env:
          KEY: ${{ secrets.COMMISH_API_KEY }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" = "WRITE" ]; then DRY=0; echo "WRITE mode"; else DRY=1; echo "DRY-RUN mode (type WRITE to apply)"; fi
          cat > payload.json <<JSON
          {
            "type": "MANUAL_CONTRACT_UPDATE",
            "submission_kind": "myac",
            "silence_discord": 1,
            "dry_run": ${DRY},
            "L": "74598", "YEAR": "2026", "league_id": "74598", "season": "2026",
            "player_id": "16174", "player_name": "Rodriguez, Chris", "position": "RB",
            "franchise_id": "0008", "franchise_name": "Real Deal Creel",
            "salary": 3000, "contract_year": 1, "contract_status": "Vet-ERA",
            "contract_info": "CL 1| TCV 3K| AAV 3K",
            "prior_salary": 3000, "prior_contract_year": 2, "prior_contract_status": "Vet-ERA",
            "prior_contract_info": "CL 2|TCV 6K|AAV 3K|Y1-3K, Y2-3K|GTD: 4.5K",
            "commish_override_flag": 1,
            "source": "worker-commish-contract-revert"
          }
          JSON
          echo "payload:"; cat payload.json
          URL="https://upsmflproduction.keith-creelman.workers.dev/commish-contract-update?L=74598&YEAR=2026&APIKEY=${KEY}"
          curl -s "$URL" -H "Content-Type: application/json" --data @payload.json -o resp.json -w "HTTP %{http_code}\n"
          python3 -c "import json;d=json.load(open('resp.json'));print(json.dumps({k:d[k] for k in d if k not in ('importAttempts','raw_payload_json')}, indent=1)[:1800])" || head -c 1000 resp.json
