name: Verify test-sync salaries (cookie-only import path)

# One-shot verification: mirrors prod salaries -> test league (L=25625) via
# POST /admin/test-sync/prod-salaries, which writes TYPE=salaries through the
# commissioner-cookie-only clean-form path (postMflImportFormForCookie). If it
# returns ok + verified, the salaries/contract-submit write path fires correctly.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: POST /admin/test-sync/prod-salaries
        env:
          KEY: ${{ secrets.COMMISH_API_KEY }}
        run: |
          URL="https://upsmflproduction.keith-creelman.workers.dev/admin/test-sync/prod-salaries?APIKEY=${KEY}"
          curl -s -X POST "$URL" -H "Content-Type: application/json" --data '{}' -o resp.json -w "HTTP %{http_code}\n"
          # show the result but never the cookie/key
          python3 -c "import json;d=json.load(open('resp.json'));print(json.dumps({k:d[k] for k in d if k not in ('details',)}, indent=1)[:1500])" || cat resp.json | head -c 800
