name: Cap-free decide — DRY RUN on one player
on:
  workflow_dispatch:
    inputs:
      player_id:
        description: "MFL player id"
        required: true
        default: "12801"
      decision:
        description: "approve or deny"
        required: true
        default: "approve"
        type: choice
        options: [approve, deny]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.COMMISH_API_KEY }}
      PID: ${{ github.event.inputs.player_id }}
      DEC: ${{ github.event.inputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - run: '[ -n "$KEY" ] || { echo "::error::COMMISH_API_KEY not set"; exit 1; }'
      - name: capfree-decide (dry_run — writes nothing)
        run: |
          curl -s -X POST "https://upsmflproduction.keith-creelman.workers.dev/admin/drops/capfree-decide?L=74598&YEAR=2026&APIKEY=${KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"player_id\":\"${PID}\",\"decision\":\"${DEC}\",\"dry_run\":true}" \
            -o /tmp/dec.json
          echo "bytes: $(wc -c < /tmp/dec.json)"
      - name: show
        run: python3 scripts/ci_show_capfree_decide.py /tmp/dec.json
