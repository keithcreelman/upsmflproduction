name: Yahoo fantasy sync

# Incremental refresh of the Yahoo league's mutable state — current rosters,
# standings, recent transactions, FAAB/waiver position, the current week's
# matchups, player status and newly completed weeks.
#
# ⚠️ SHIPS DARK. `write_target` defaults to `dry-run`, which builds every SQL
# statement and reports what it WOULD write without touching D1. That is
# deliberate: a scheduled workflow becomes live on its very next cron tick the
# moment it merges to main, and the first arming should not be unattended. To
# arm it, change the `default:` on write_target to `remote` in a separate,
# reviewable commit — or run it by hand with workflow_dispatch first.
#
# ⚠️ SCHEDULED WORKFLOWS ONLY FIRE FROM THE DEFAULT BRANCH. Verified
# empirically: 100/100 recent scheduled runs in this repo had headBranch=main.
# A `schedule:` block on a feature branch never fires, not once. That is why
# workflow_dispatch is also declared — it is the only way to test before merge,
# and dispatch can target any branch.
#
# ⚠️ YAHOO API ACCESS IS GATED. As of 2026 Yahoo requires an approved
# application (sports.yahoo.com/developer/access/). Until that approval lands
# and the YAHOO_* secrets are set, this workflow exits 2 at the credential
# guard, loudly, rather than pretending to have synced. See
# docs/yahoo_fantasy_ingestion.md.
#
# CADENCE. Tuesday 13:00 UTC is deliberately clear of the 09:05→09:55 UTC MFL
# snapshot chain (snapshot → config-sync → builders → anomaly-check →
# contract-reconcile), whose ordering is load-bearing, and lands after Monday
# Night Football has settled so a completed week is actually complete.
#
# EXIT CODES — this is a contract, not decoration:
#   0  synced, or a legitimate no-op that is logged loudly
#   1  input unreadable, expected data missing, or a read-back unconfirmed
#   2  authorization missing/expired — a human must re-consent
#   3  Yahoo is throttling; the run stopped cleanly and can resume
# Do NOT "fix" a red run by making it exit 0. An unreadable input is never an
# empty one — that conflation is the root cause behind every data-destruction
# incident recorded in this repo.

on:
  schedule:
    # 13:00 UTC Tue = 09:00 ET / 06:00 PT — after MNF settles, clear of the
    # 09:0x UTC MFL chain.
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      league_id:
        description: "Yahoo numeric league id"
        required: false
        default: "576919"
        type: string
      seasons:
        description: "Season filter, e.g. 2025 or 2019-2025. Blank = every discovered season."
        required: false
        type: string
      mode:
        description: "sync (incremental) or backfill (full history)"
        required: false
        default: sync
        type: choice
        options: [sync, backfill]
      write_target:
        description: "dry-run builds SQL without writing. remote writes to production D1."
        required: false
        default: dry-run
        type: choice
        options: [dry-run, remote]

concurrency:
  group: yahoo-fantasy-sync
  # NEVER cancel a data job mid-flight: a half-written batch is worse than a
  # late one, and every write here is idempotent so a queued run is harmless.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node is required even though the pipeline is pure Python: D1 writes
      # shell out to `npx wrangler d1 execute`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard — refuse to start without credentials
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${YAHOO_CLIENT_ID:-}" ]     || missing="$missing YAHOO_CLIENT_ID"
          [ -n "${YAHOO_CLIENT_SECRET:-}" ] || missing="$missing YAHOO_CLIENT_SECRET"
          [ -n "${YAHOO_REFRESH_TOKEN:-}" ] || missing="$missing YAHOO_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Yahoo API access requires an approved application first —"
            echo "see docs/yahoo_fantasy_ingestion.md. Once approved, authorize"
            echo "locally with 'npm run yahoo:auth' and add the refresh token as"
            echo "the YAHOO_REFRESH_TOKEN repository secret."
            exit 2
          fi
          if [ "${{ inputs.write_target || 'dry-run' }}" = "remote" ] && [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::write_target=remote needs CLOUDFLARE_API_TOKEN."
            exit 2
          fi
          echo "credential guard passed (names only — no values printed)"

      - name: Discover league-seasons
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.write_target || 'dry-run' }}"
          ARGS=""
          [ "$TARGET" = "remote" ] && ARGS="--target remote" || ARGS="--target remote --dry-run"
          python3 pipelines/fantasy/cli.py $ARGS \
            --raw-sink r2 \
            discover --league-id "${{ inputs.league_id || '576919' }}"

      - name: Sync
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_REDIRECT_URI: ${{ secrets.YAHOO_REDIRECT_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.write_target || 'dry-run' }}"
          MODE="${{ inputs.mode || 'sync' }}"
          SEASONS="${{ inputs.seasons || '' }}"
          ARGS=""
          [ "$TARGET" = "remote" ] && ARGS="--target remote" || ARGS="--target remote --dry-run"
          SEASON_ARG=""
          [ -n "$SEASONS" ] && SEASON_ARG="--seasons $SEASONS"
          python3 pipelines/fantasy/cli.py $ARGS \
            --raw-sink r2 \
            "$MODE" --league-id "${{ inputs.league_id || '576919' }}" $SEASON_ARG

      - name: Completeness report
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.write_target || 'dry-run' }}" != "remote" ]; then
            echo "dry-run: skipping the report (nothing was written to read back)"
            exit 0
          fi
          python3 pipelines/fantasy/cli.py --target remote report \
            --league-id "${{ inputs.league_id || '576919' }}"
