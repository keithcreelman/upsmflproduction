name: Pages — deploy site/ + apps/mfl_site/

# Deploys the site/ directory to GitHub Pages so hub iframes + embed
# loaders can load HTML/JS/CSS with correct content-type. Replaces
# jsDelivr as the primary CDN for production (see issue #88).
#
# Also copies apps/mfl_site/header_custom_v2.html + footer_custom_v2.html
# into the artifact root so MFL admin's "Hosted Header / Hosted Footer"
# include URLs can fetch them from Pages (they live outside site/ in
# the repo, but Pages serves a single artifact, so we copy at build time).
#
# Pages URLs:
#   https://keithcreelman.github.io/upsmflproduction/<path-inside-site>
#   https://keithcreelman.github.io/upsmflproduction/header_custom_v2.html
#   https://keithcreelman.github.io/upsmflproduction/footer_custom_v2.html
#
# Triggers: any push to main that touches site/ OR apps/mfl_site/ OR the
# workflow itself. Manual run via workflow_dispatch for ad-hoc redeploys.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/mfl_site/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy at a time. New deploys cancel
# in-flight runs (latest source wins).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact (site/ + apps/mfl_site/ headers)
        run: |
          mkdir -p _site
          cp -R site/. _site/
          # MFL admin's Hosted Header / Hosted Footer URLs fetch these
          # two files directly. Put them at the artifact root so they
          # serve as https://keithcreelman.github.io/upsmflproduction/header_custom_v2.html
          # and /footer_custom_v2.html.
          cp apps/mfl_site/header_custom_v2.html _site/
          cp apps/mfl_site/footer_custom_v2.html _site/
          echo "::group::artifact contents (top level)"
          ls -la _site | head -30
          echo "::endgroup::"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
