name: Health-summary live check (one-off, 2026-08-08)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.COMMISH_API_KEY }}
      WORKER: https://upsmflproduction.keith-creelman.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: '[ -n "$KEY" ] || { echo "::error::COMMISH_API_KEY not set"; exit 1; }'
      - name: fetch health-summary
        run: curl -sS "$WORKER/admin/health-summary?L=74598&APIKEY=$KEY" -o /tmp/hs.json
      - name: check flags_readable + FA flag values
        run: python3 scripts/ci_check_health_summary.py /tmp/hs.json
