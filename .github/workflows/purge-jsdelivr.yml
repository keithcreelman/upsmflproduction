name: Purge jsDelivr cache

# jsDelivr aggressively caches branch refs (@main) for up to ~12 hours.
# Pinning to specific SHAs sidesteps this, but the league's MFL HPM uses
# @main for convenience. This workflow purges jsDelivr's cache for every
# site/** path the league HPM modules might fetch — runs after a push to
# main when any cached file changes. Effect: production users see fresh
# code within ~30s of a merge instead of waiting hours for jsDelivr's TTL.
#
# Setup: no secrets needed. jsDelivr's purge endpoint is public:
#   POST https://purge.jsdelivr.net/  with {"path": ["/gh/.../file", ...]}
# Up to 500 paths per call. We enumerate the known cacheable files explicitly
# (vs walking the tree) so the workflow doesn't accidentally purge unrelated
# files like data CSVs.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/league_context_v1.md"
  workflow_dispatch: {}

concurrency:
  group: purge-jsdelivr
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge jsDelivr (per-file GETs)
        run: |
          # jsDelivr's batch POST endpoint requires auth and caps at 5 files
          # per minute for anonymous calls. The simpler GET endpoint has no
          # such limit — purge each file individually.
          # Anonymous rate limit on GET /purge is generous (~10/sec); we
          # purge ~15 files so we're well under.
          #
          # FILES TO PURGE — only the ones the league HPM modules actually
          # fetch. Adding more here is fine, but pruning prevents accidental
          # purge of files the HPM doesn't pull.
          FILES=(
            "site/loader.js"
            "site/hpm-draft-hub.html"
            "site/hpm-default.html"
            "site/hpm-ccc.html"
            "site/hpm-mcm.html"
            "site/hpm-myteam.html"
            "site/hpm-reports.html"
            "site/hpm-standings.html"
            "site/hpm-stats-workbench.html"
            "site/hpm-widget.html"
            "site/hpm-issue-report.html"
            "site/rookies/mfl_hpm_embed_loader.js"
            "site/rookies/rookie_draft_hub.html"
            "site/rookies/rookie_draft_hub.js"
            "site/rookies/rookie_draft_hub.css"
            "site/rookies/VERSION.json"
            "site/rookies/rookie_prospects_2026.json"
            "site/rookies/external_adp_2026.json"
            "site/rookies/franchise_assets_2026.json"
            "site/rookies/rookie_draft_hub_2026.json"
            "site/trades/mfl_hpm_embed_loader.js"
            "site/trades/trade_workbench.html"
            "site/trades/trade_workbench.js"
            "site/trades/trade_workbench.css"
            "site/rosters/mfl_hpm_embed_loader.js"
            "site/rosters/roster_workbench.html"
            "site/rosters/roster_workbench.js"
            "site/rosters/roster_workbench.css"
            "site/ccc/mfl_hpm_embed_loader.js"
            "site/ccc/ccc.js"
            "site/ccc/ccc.css"
            "site/standings/mfl_hpm_embed_loader.js"
            "site/reports/mfl_hpm_embed_loader.js"
            "site/acquisition/mfl_hpm_embed_loader.js"
            "site/team_operations/mfl_hpm_embed_loader.js"
            "site/stats_workbench/mfl_hpm_embed_loader.js"
          )
          echo "Purging ${#FILES[@]} files..."
          OK=0
          FAIL=0
          for f in "${FILES[@]}"; do
            CODE=$(curl -sS --max-time 12 -o /dev/null -w "%{http_code}" \
              "https://purge.jsdelivr.net/gh/keithcreelman/upsmflproduction@main/${f}")
            if [[ "$CODE" =~ ^(200|404)$ ]]; then
              OK=$((OK + 1))
            else
              FAIL=$((FAIL + 1))
              echo "  ${CODE}  ${f}"
            fi
          done
          echo "Done: ${OK} ok, ${FAIL} failed"
          # Don't fail the workflow on individual purge failures (jsDelivr
          # occasionally rate-limits). Cache will refresh on its own TTL.
          exit 0

      - name: Verify VERSION.json refreshed
        run: |
          sleep 5
          echo "VERSION.json after purge:"
          curl -sSL --max-time 10 \
            "https://cdn.jsdelivr.net/gh/keithcreelman/upsmflproduction@main/site/rookies/VERSION.json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'  {d[\"version\"]} · {d[\"label\"]}')"
