name: Fix contract vocab drift (single row)

# Repairs a non-canonical contractStatus CASING via MFL's salaries import.
# dry_run by default: apply requires choosing it explicitly.
#
# The row is re-read fresh inside the script and ALL FOUR attributes are
# echoed back, because MFL's salaries import BLANKS every attribute omitted
# (mfl_salaries_import_blanks_omitted_attributes — a contractInfo-only row
# wiped 3 live contracts). The script refuses on anything that is not a pure
# casing fix, so this workflow cannot be pointed at an arbitrary edit.

on:
  workflow_dispatch:
    inputs:
      player_id:
        description: "MFL player id"
        required: true
        default: "13592"
      mode:
        description: "dry_run = show the XML · apply = write to MFL"
        required: true
        default: "dry_run"
        type: choice
        options: [dry_run, apply]

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      MFL_COOKIE: ${{ secrets.MFL_COOKIE }}
      PID: ${{ github.event.inputs.player_id }}
      MODE: ${{ github.event.inputs.mode }}
      LEAGUE: "74598"
      SEASON: "2026"
    steps:
      - uses: actions/checkout@v4
      - run: '[ -n "$MFL_COOKIE" ] || { echo "::error::MFL_COOKIE not set"; exit 1; }'

      - name: plan (refuses on anything but a casing fix)
        run: python3 scripts/ci_fix_contract_vocab.py "$SEASON" "$PID"

      - name: apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          [ -s /tmp/vocab_fix.xml ] || { echo "no XML produced — nothing to apply"; exit 0; }
          case "$MFL_COOKIE" in *=*) COOKIE="$MFL_COOKIE" ;; *) COOKIE="MFL_USER_ID=$MFL_COOKIE" ;; esac
          echo "posting:"; cat /tmp/vocab_fix.xml
          curl -sS -X POST "https://www48.myfantasyleague.com/${SEASON}/import" \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (upsmflproduction-worker)" \
            -H "Content-Type: application/x-www-form-urlencoded;charset=UTF-8" \
            --data-urlencode "TYPE=salaries" \
            --data-urlencode "L=${LEAGUE}" \
            --data-urlencode "DATA@/tmp/vocab_fix.xml" \
            -o /tmp/import_resp.txt
          echo "response: $(cat /tmp/import_resp.txt | head -c 300)"

      - name: verify against a fresh read
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          sleep 3
          # A 200 from the import proves nothing — re-read and confirm.
          python3 - <<'PY'
          import json, os, sys, urllib.request
          season, pid = os.environ["SEASON"], os.environ["PID"]
          url = f"https://www48.myfantasyleague.com/{season}/export?TYPE=salaries&L={os.environ['LEAGUE']}&JSON=1"
          ps = json.load(urllib.request.urlopen(url, timeout=60))["salaries"]["leagueUnit"]["player"]
          row = next((p for p in ps if str(p.get("id")) == pid), None)
          if not row:
              print("::error::player vanished from the export after write"); sys.exit(1)
          print("AFTER:", json.dumps(row, indent=2))
          st = str(row.get("contractStatus", ""))
          # Money fields must be intact — the whole risk of this import.
          for k in ("salary", "contractYear", "contractInfo"):
              if not str(row.get(k, "")).strip():
                  print(f"::error::{k} is EMPTY after write — import blanked it"); sys.exit(1)
          import re
          CANON = re.compile(r"^(Rookie-(Draft|FAA|WW|MYM)|Vet-(FAA|ERA|WW|MYM|Ext1|Ext2))(-FL|-BL)?$|^Tag$")
          if not CANON.match(st):
              print(f"::error::contractStatus still non-canonical: {st!r}"); sys.exit(1)
          print(f"✅ VERIFIED: contractStatus={st!r}, money fields intact.")
          PY
