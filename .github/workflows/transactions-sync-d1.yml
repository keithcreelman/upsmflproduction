name: Transactions sync → D1 (manual)

# Manually trigger the MFL TYPE=transactions → ups_transactions ledger scan.
# (The */5 worker cron does this automatically; this is for testing / backfill.)
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season'
        required: false
        default: '2026'
      days:
        description: 'Lookback days'
        required: false
        default: '7'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST scan-and-record
        env:
          KEY: ${{ secrets.COMMISH_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          season = os.environ.get("SEASON") or "2026"
          days = int(os.environ.get("DAYS") or "7")
          url = f"https://upsmflproduction.keith-creelman.workers.dev/admin/transactions/scan-and-record?L=74598&YEAR={season}&APIKEY={os.environ['KEY']}"
          ua = "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
          body = json.dumps({"season": season, "league_id": "74598", "days": days}).encode()
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json", "User-Agent": ua}, method="POST")
          try:
              with urllib.request.urlopen(req) as r:
                  print("HTTP", r.status); print(r.read().decode()[:1500])
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode()[:1500]); raise
          PY
