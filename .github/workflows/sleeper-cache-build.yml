name: Sleeper cache — rebuild player facts

# /api/player-news used to fetch Sleeper's 14.6 MB player file and parse it on
# every request. That exceeds the Worker's CPU budget, the catch was fail-soft,
# and EVERY player reported sleeper_matched: 0 — no injury status, no depth chart,
# for anyone, silently. This does the work where there is no CPU ceiling.
#
# Matching (#1356): RotoWire / ESPN id candidates plus full name + team, accepted
# only with 2+ agreeing facts (ids, birthdate, name, team) — no single fact is
# trusted. Writes (#1356): changed rows only, never delete-and-reinsert (was
# 7,082 D1 rows written a day; measured ~650–840 after; the first run after the
# change rewrites ~5,000 once). See scripts/build_sleeper_cache.py.
#
# Injury and depth data changes daily in season, so this runs daily.

on:
  schedule:
    - cron: "20 10 * * *"    # after the 09:05 MFL snapshot
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = report matches only · apply = write to D1"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          FLAG="--dry-run"
          [ "${{ github.event.inputs.mode }}" = "apply" ] && FLAG="--apply"
          # scheduled runs always apply; a dry-run on a cron would do nothing
          [ "${{ github.event_name }}" = "schedule" ] && FLAG="--apply"
          python3 scripts/build_sleeper_cache.py $FLAG
