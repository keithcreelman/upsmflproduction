name: Lint site inline JS

# The Commish Settings page shipped broken for hours over ONE unescaped
# apostrophe in a tooltip:
#
#   '...told the league ahead of time they'd be out of pocket...'
#
# That is a SyntaxError, so the whole IIFE failed to parse, renderShell() never
# ran, and the page sat on "Loading…" forever. Nothing caught it: eslint lints
# .js files and never sees inline <script>, and the worker's deploy lint was
# green because worker/ was fine. site/*.html had no compiler pointed at it at
# all — prose inside a JS string is a code path, and it was going out unchecked.
#
# Cheap to run, and it only fails on a genuine parse error.

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**/*.html"
      - "site/**/*.js"
      - "scripts/check_inline_js.mjs"
      - ".github/workflows/lint-site-inline-js.yml"
  push:
    branches: [main]
    paths:
      - "site/**/*.html"
      - "site/**/*.js"

jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every inline <script> in site/
        run: node scripts/check_inline_js.mjs

      # The check above only sees INLINE script. Standalone site/**/*.js was
      # checked by nothing: the repo's only eslint.config.mjs covers worker/.
      # That gap matters more now, because the right fix for a prose-heavy page
      # is to move its logic OUT of inline <script> (see site/wire/), which
      # without this step would mean moving it out of all coverage.
      - name: Syntax-check standalone JS in site/
        run: |
          set -e
          count=0
          for f in $(git ls-files 'site/**/*.js' 'site/*.js'); do
            node --check "$f"
            count=$((count + 1))
          done
          echo "standalone-js: $count file(s) checked, 0 broken"
