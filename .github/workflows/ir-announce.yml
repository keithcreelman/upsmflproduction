name: IR announcement — dry run / post
on:
  workflow_dispatch:
    inputs:
      player_id:
        description: "MFL player id"
        required: true
        default: "17115"
      mode:
        description: "DRY = show the copy only. POST = actually announce."
        required: true
        default: "DRY"
        type: choice
        options: [DRY, POST]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.COMMISH_API_KEY }}
      PID: ${{ github.event.inputs.player_id }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - run: '[ -n "$KEY" ] || { echo "::error::COMMISH_API_KEY not set"; exit 1; }'
      - name: call
        run: |
          if [ "$MODE" = "POST" ]; then DRY=false; else DRY=true; fi
          curl -s -X POST "https://upsmflproduction.keith-creelman.workers.dev/admin/ir/announce?L=74598&YEAR=2026&APIKEY=${KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"player_id\":\"${PID}\",\"dry_run\":${DRY}}" -o /tmp/ir.json
          echo "bytes: $(wc -c < /tmp/ir.json)"
      - name: show
        run: python3 scripts/ci_show_ir_announce.py /tmp/ir.json
