name: Lineup ledger diagnostic (one-off, 2026-08-10)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install wrangler
        run: npm install -g wrangler
      - name: dump ups_lineup_submissions for this league
        working-directory: worker
        run: |
          wrangler d1 execute ups-mfl-db --remote --json --command \
            "SELECT season, league_id, fid, '[' || week || ']' AS week_bracketed, length(week) AS week_len, substr(starters_csv,1,60) AS starters_head, datetime(submitted_at_unix,'unixepoch') AS submitted_utc FROM ups_lineup_submissions ORDER BY submitted_at_unix DESC LIMIT 20" \
            2>&1 | tee /tmp/led.txt
