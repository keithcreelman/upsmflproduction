  body#body_lineup #lineup form {
    background-color: var(--ups-bg, #0b1220) !important;
  }
  body#body_lineup #lineup form table.report { display: table !important; }
  body#body_lineup #lineup form table.report > tbody { display: table-row-group !important; }
  body#body_lineup #lineup form table.report > tbody > tr { display: table-row !important; }
  body#body_lineup #lineup form table.report > tbody > tr > td,
  body#body_lineup #lineup form table.report > tbody > tr > th { display: table-cell !important; }
  /* THE ACTUAL CULPRIT (confirmed via computed styles: display:table, 649px tall,
     themed dark — only visibility was hidden): MFL hides the lineup <form> via
     visibility:hidden until its own reveal JS fires, which doesn't run on our
     themed page, so the fully-rendered table stays invisible while the non-form
     IR/Taxi tables show. Force the form + its contents visible. */
  body#body_lineup #lineup form,
  body#body_lineup #lineup form * {
    visibility: visible !important;
  }
</style>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  // ─── Phase C: Side-mount Player Picker Drawer (O=43) ───────────────────
  // Replaces MFL's inline picker on the auction nomination form with a
  // right-mounted slide-in drawer. Reads available players from the
  // already-rendered `.add-drop-player-row` elements (TOS-rendered) so
  // we don't reinvent MFL's available-FA filtering logic. On player click
  // we trigger the original "Add" button click → the existing form
  // wiring writes #sel_pid → user submits the form normally.
  //
  // Scoped strictly to body_options_43. Fail-soft: if .add-player-container
  // doesn't render, the drawer doesn't activate and MFL's inline picker
  // stays visible.
  (function () {
    if (!document.body || !/^body_options_43/.test(document.body.id || "")) {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
          if (/^body_options_43/.test(document.body.id || "")) initPickerDrawer();
        });
      }
      return;
    }
    initPickerDrawer();

    function initPickerDrawer() {
      // Wait for TOS to render its picker rows. Poll up to 20s.
      var attempts = 0;
      var maxAttempts = 40;  // 40 \u00D7 500ms = 20s
      var interval = setInterval(function () {
        attempts += 1;
        var container = document.querySelector(".add-player-container");
        var rowCount = container ? container.querySelectorAll(".add-drop-player-row").length : 0;
        if (rowCount > 0) {
          clearInterval(interval);
          mountDrawer();
        } else if (attempts >= maxAttempts) {
          clearInterval(interval);
          console.log("[ups-picker] TOS picker rows never rendered — drawer not mounted, MFL inline picker stays");
        }
      }, 500);
    }

    function mountDrawer() {
      // Build drawer DOM
      var backdrop = document.createElement("div");
      backdrop.className = "ups-picker-backdrop";

      var drawer = document.createElement("div");
      drawer.className = "ups-picker-drawer";
      drawer.innerHTML =
        '<div class="ups-picker-header">' +
          '<div class="ups-picker-header-row">' +
            '<h2 class="ups-picker-title">Select Player to Auction</h2>' +
            '<button type="button" class="ups-picker-close" aria-label="Close">\u00D7</button>' +
          '</div>' +
          '<input type="search" class="ups-picker-search" placeholder="Search by name\u2026" />' +
          '<div class="ups-picker-sort-row">' +
            '<label class="ups-picker-sort-label">Sort</label>' +
            '<select class="ups-picker-sort" data-sort>' +
              '<option value="name">Name</option>' +
              '<option value="points_rank">Points Rank</option>' +
              '<option value="proj_pts">Proj Points</option>' +
            '</select>' +
            '<label class="ups-picker-sort-label">Team</label>' +
            '<select class="ups-picker-sort" data-team>' +
              '<option value="">All teams</option>' +
            '</select>' +
          '</div>' +
          // Position chips are auto-populated from the union of player
          // positions seen in TOS row data. Filled by refreshPosChips
          // below. Initial state: just the "All" pill.
          '<div class="ups-picker-chips" data-chip-group="pos">' +
            '<button type="button" class="ups-picker-chip active" data-pos="ALL">All</button>' +
          '</div>' +
          '<div class="ups-picker-meta" data-meta="count">\u2026</div>' +
        '</div>' +
        '<div class="ups-picker-list" data-list></div>';

      document.body.appendChild(backdrop);
      document.body.appendChild(drawer);

      // Trigger button — placed at the top of the inline picker section so it
      // sits where the user expects "go pick a player" to be. Text shifts
      // between "no selection" and "currently selected" states (see
      // updateTriggerLabel below).
      var trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "ups-picker-trigger";
      // Initial content set by updateTriggerLabel() after the function is
      // defined below.
      trigger.innerHTML = '<span data-trigger-content>Loading\u2026</span>';

      var anchor = document.querySelector(".add-player-container");
      if (anchor && anchor.parentNode) {
        anchor.parentNode.insertBefore(trigger, anchor);
      }
      // Hide MFL's inline picker now that the drawer is mounted.
      document.body.classList.add("ups-picker-drawer-active");

      // Wire interactions
      var searchEl = drawer.querySelector(".ups-picker-search");
      var listEl = drawer.querySelector("[data-list]");
      var metaEl = drawer.querySelector('[data-meta="count"]');
      var triggerContentEl = trigger.querySelector("[data-trigger-content]");
      var chipsEl = drawer.querySelector('[data-chip-group="pos"]');

      var STATE = { search: "", pos: "ALL", sort: "name", team: "" };

      // Find MFL's currently-selected player row (if any). TOS marks
      // selected rows with .selected-player and the row carries
      // data-player-id; we mirror that into our drawer's state.
      function getSelectedPid() {
        var row = document.querySelector(
          ".add-player-container .add-drop-player-row.selected-player"
        );
        return row ? (row.getAttribute("data-player-id") || "") : "";
      }
      function findPlayerByPid(pid) {
        if (!pid) return null;
        var all = readPlayers();
        return all.find(function (p) { return p.player_id === String(pid); }) || null;
      }

      // Trigger label reflects current selection state. With nothing
      // selected the user sees "Select a player for nomination (N available)";
      // once a player is chosen the label flips to "✓ Selected: Player
      // Name — click to change".
      function updateTriggerLabel() {
        var pid = getSelectedPid();
        var players = readPlayers();
        if (pid) {
          var p = findPlayerByPid(pid);
          var label = p ? p.name : ("Player " + pid);
          triggerContentEl.innerHTML =
            '<span class="ups-picker-trigger-check">\u2713</span> ' +
            '<strong>' + escapeText(label) + '</strong>' +
            '<span class="ups-picker-trigger-change">— click to change</span>';
          trigger.classList.add("ups-picker-trigger-selected");
        } else {
          triggerContentEl.innerHTML =
            'Select a player for nomination ' +
            '<span class="ups-picker-trigger-count">(' + players.length + ' available)</span>';
          trigger.classList.remove("ups-picker-trigger-selected");
        }
      }

      function readPlayers() {
        // Read TOS-rendered rows.
        var rows = Array.from(document.querySelectorAll(".add-player-container .add-drop-player-row"));
        return rows.map(function (row) {
          var pid = row.getAttribute("data-player-id") || "";
          var posEl = row.querySelector(".player-pos");
          var pos = posEl ? (posEl.textContent || "").trim().toUpperCase() : "";
          var imgEl = row.querySelector(".player-img-wrapper img, img");
          var imgSrc = imgEl ? imgEl.src : "";
          var nameEl = row.querySelector(".player-info strong, .player-info b, .player-info");
          var name = nameEl ? (nameEl.textContent || "").trim() : "";
          var teamEl = row.querySelector(".player-info small");
          var teamMeta = teamEl ? (teamEl.textContent || "").trim() : "";
          // First token before " · " in the team-meta line is the NFL team
          // abbreviation (e.g. "MIN · Bye: 6 · Rank: 109"). Used for the
          // Team filter dropdown.
          var nflTeam = "";
          var firstTok = teamMeta.split(/\s*[\u00B7\u2022|]\s*/)[0];
          if (firstTok && /^[A-Z]{2,4}$/.test(firstTok.trim())) nflTeam = firstTok.trim();
          // Parse Points Rank from the team-meta string. TOS format:
          //   "MIN • Bye: 6 • Rank: 109"
          // Match permissively. PPG isn't surfaced by TOS in current row
          // layout (verified 2026-05-20 in Keith's drawer — only one
          // "Rank: N" appears); PPG sort removed accordingly.
          var pointsRank = null;
          var m;
          if ((m = /(?:^|[^a-z])(?:points\s*rank|rank|rk)\s*[:#]?\s*(\d+)/i.exec(teamMeta))) {
            pointsRank = parseInt(m[1], 10) || null;
          }
          // Extract projected points (if any) from the .player-wproj column.
          var projPts = null;
          var projEl = row.querySelector(".player-wproj");
          if (projEl) {
            var projText = (projEl.textContent || "").replace(/PROJ\s*PTS?/gi, "").trim();
            var projNum = parseFloat(projText.replace(/[^0-9.\-]/g, ""));
            if (!isNaN(projNum)) projPts = projNum;
          }
          // Find the "Add" button so we can trigger it on click
          var addBtn = Array.from(row.querySelectorAll("button")).find(function (b) {
            var t = (b.textContent || "").trim().toLowerCase();
            return t === "add" || t === "deselect";
          });
          return {
            player_id: pid,
            name: name || ("Player #" + pid),
            pos: pos,
            nfl_team: nflTeam,
            team_meta: teamMeta,
            img: imgSrc,
            points_rank: pointsRank,
            proj_pts: projPts,
            addBtnEl: addBtn,
            rowEl: row,
          };
        }).filter(function (p) { return p.player_id; });
      }

      // Position chips are auto-populated from the union of positions
      // present in TOS row data. Order: offensive (QB→RB→WR→TE→K→PN),
      // then IDP/defense (DL→LB→DB→S→CB→DT→DE), then anything else
      // alpha. Keeps "All" first.
      var POS_PREFERRED_ORDER = [
        "QB", "RB", "WR", "TE", "PK", "K", "PN", "P",
        "DL", "DT", "DE", "LB", "DB", "S", "CB",
      ];
      var _lastPosSig = "";
      function refreshPosChips(players) {
        if (!chipsEl) return;
        var seen = {};
        for (var i = 0; i < players.length; i += 1) {
          var pos = (players[i].pos || "").toUpperCase();
          if (!pos) continue;
          // Normalize MFL aliases
          if (pos === "PK") pos = "K";
          if (pos === "P") pos = "PN";
          if (!seen[pos]) seen[pos] = 0;
          seen[pos] += 1;
        }
        var posList = Object.keys(seen);
        posList.sort(function (a, b) {
          var ai = POS_PREFERRED_ORDER.indexOf(a);
          var bi = POS_PREFERRED_ORDER.indexOf(b);
          if (ai === -1 && bi === -1) return a.localeCompare(b);
          if (ai === -1) return 1;
          if (bi === -1) return -1;
          return ai - bi;
        });
        var sig = posList.join("|");
        if (sig === _lastPosSig) return;
        _lastPosSig = sig;
        var current = STATE.pos || "ALL";
        var html = '<button type="button" class="ups-picker-chip' +
          (current === "ALL" ? ' active' : '') + '" data-pos="ALL">All</button>';
        for (var k = 0; k < posList.length; k += 1) {
          var p = posList[k];
          var active = current === p ? ' active' : '';
          html += '<button type="button" class="ups-picker-chip' + active +
            '" data-pos="' + p + '">' + p + '</button>';
        }
        chipsEl.innerHTML = html;
      }

      // Within each position, rank players by overall points_rank
      // ascending. Stored on each player as p._pos_rank (1-indexed).
      // Players with no points_rank get a null _pos_rank — they sort
      // to the bottom of their position group.
      function computePositionRanks(players) {
        var byPos = {};
        for (var i = 0; i < players.length; i += 1) {
          var p = players[i];
          var pos = (p.pos || "").toUpperCase();
          if (!byPos[pos]) byPos[pos] = [];
          byPos[pos].push(p);
        }
        Object.keys(byPos).forEach(function (pos) {
          var group = byPos[pos];
          group.sort(function (a, b) {
            var ar = (a.points_rank == null) ? Infinity : a.points_rank;
            var br = (b.points_rank == null) ? Infinity : b.points_rank;
            return ar - br;
          });
          for (var j = 0; j < group.length; j += 1) {
            group[j]._pos_rank = (group[j].points_rank == null) ? null : (j + 1);
          }
        });
      }

      function renderList() {
        var players = readPlayers();
        // Repopulate Team dropdown + position chips when player set changes.
        refreshTeamDropdown(players);
        refreshPosChips(players);
        // Precompute position-relative ranks based on overall rank within
        // each position. Stored on each player as p._pos_rank (1-indexed).
        computePositionRanks(players);

        var selectedPid = getSelectedPid();
        var q = STATE.search.toLowerCase();
        var posFilter = STATE.pos;
        var teamFilter = STATE.team;
        var filtered = players.filter(function (p) {
          if (q && p.name.toLowerCase().indexOf(q) === -1) return false;
          if (posFilter !== "ALL" && p.pos !== posFilter) return false;
          if (teamFilter && p.nfl_team !== teamFilter) return false;
          return true;
        });
        // Selected player floats to top; then secondary sort per STATE.sort.
        var sortKey = STATE.sort || "name";
        filtered.sort(function (a, b) {
          if (a.player_id === selectedPid) return -1;
          if (b.player_id === selectedPid) return 1;
          if (sortKey === "points_rank") {
            var ar = (a.points_rank == null) ? Infinity : a.points_rank;
            var br = (b.points_rank == null) ? Infinity : b.points_rank;
            if (ar !== br) return ar - br;
            return a.name.localeCompare(b.name);
          }
          if (sortKey === "proj_pts") {
            var ax = (a.proj_pts == null) ? -Infinity : a.proj_pts;
            var bx = (b.proj_pts == null) ? -Infinity : b.proj_pts;
            if (ax !== bx) return bx - ax;
            return a.name.localeCompare(b.name);
          }
          // default: name A→Z
          return a.name.localeCompare(b.name);
        });

        if (metaEl) {
          var selBit = selectedPid ? " \u00B7 1 selected" : "";
          metaEl.textContent = filtered.length + " of " + players.length + " players" +
            (q ? ' matching "' + q + '"' : '') +
            (posFilter !== "ALL" ? " \u00B7 " + posFilter : "") +
            selBit;
        }

        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="ups-picker-empty">No players match the current filter.</div>';
          return;
        }

        listEl.innerHTML = filtered.map(function (p) {
          var isSelected = p.player_id === selectedPid;
          // Strip any "Rank: N" / "Rk: N" / "Points Rank: N" segment from the
          // team-meta line so we don't double up with the supmeta below.
          // Keep "TEAM · Bye: X".
          var teamMetaClean = (p.team_meta || "")
            .replace(/\s*[\u00B7\u2022|]\s*(?:points\s*rank|rank|rk)\s*[:#]?\s*\d+\s*/i, "")
            .replace(/\s*[\u00B7\u2022|]\s*$/, "")
            .trim();
          // Supplementary meta: ALWAYS shows the numbers. Two ranks:
          //   POS #X = the player's rank WITHIN their position (computed
          //            client-side from the row data — most useful when
          //            scouting a single position)
          //   Overall #N = TOS's pre-computed overall rank across all
          //                positions (same value regardless of sort)
          // Plus Proj points if available. All tooltips clarify meaning.
          var supMetaBits = [];
          if (p._pos_rank != null && p.pos) {
            supMetaBits.push(
              '<span title="Rank within ' + escapeAttr(p.pos) + ' by projected points">' +
                escapeText(p.pos) + ' <strong>#' + p._pos_rank + '</strong>' +
              '</span>'
            );
          }
          if (p.points_rank != null) {
            supMetaBits.push(
              '<span title="Overall projected-points rank across all positions (from MFL/TOS)">' +
                'Overall <strong>#' + p.points_rank + '</strong>' +
              '</span>'
            );
          }
          if (p.proj_pts != null) {
            supMetaBits.push(
              '<span title="Projected season points (from MFL/TOS)">' +
                'Proj <strong>' + p.proj_pts + '</strong>' +
              '</span>'
            );
          }
          var supMeta = supMetaBits.length > 0
            ? '<div class="ups-picker-row-supmeta">' + supMetaBits.join(" \u00B7 ") + '</div>'
            : '';
          return '<div class="ups-picker-row' + (isSelected ? ' ups-picker-row-selected' : '') +
              '" data-picker-pid="' + escapeAttr(p.player_id) + '">' +
            '<div class="ups-picker-row-pos">' + escapeText(p.pos || "—") + '</div>' +
            '<div class="ups-picker-row-img">' +
              (p.img ? '<img src="' + escapeAttr(p.img) + '" alt="" onerror="this.style.display=\'none\'">' : "") +
            '</div>' +
            '<div class="ups-picker-row-body">' +
              '<div class="ups-picker-row-name">' + escapeText(p.name) +
                (isSelected ? ' <span class="ups-picker-row-selected-badge">\u2713 Selected</span>' : '') +
              '</div>' +
              '<div class="ups-picker-row-meta">' + escapeText(teamMetaClean) + '</div>' +
              supMeta +
            '</div>' +
            '<button type="button" class="ups-picker-row-cta">' +
              (isSelected ? "Clear" : "Select") +
            '</button>' +
          '</div>';
        }).join("");
      }

      function escapeText(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function escapeAttr(s) {
        return escapeText(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      // Open / close drawer
      function openDrawer() {
        renderList();
        backdrop.classList.add("ups-picker-open");
        drawer.classList.add("ups-picker-open");
        setTimeout(function () {
          if (searchEl) searchEl.focus();
        }, 280);
      }
      function closeDrawer() {
        backdrop.classList.remove("ups-picker-open");
        drawer.classList.remove("ups-picker-open");
      }

      trigger.addEventListener("click", openDrawer);
      backdrop.addEventListener("click", closeDrawer);
      drawer.querySelector(".ups-picker-close").addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && drawer.classList.contains("ups-picker-open")) closeDrawer();
      });

      // Search (debounced)
      var searchDebounce;
      searchEl.addEventListener("input", function () {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(function () {
          STATE.search = searchEl.value || "";
          renderList();
        }, 150);
      });

      // Sort + Team dropdowns
      var sortEl = drawer.querySelector("[data-sort]");
      var teamEl = drawer.querySelector("[data-team]");
      if (sortEl) {
        sortEl.addEventListener("change", function () {
          STATE.sort = sortEl.value || "name";
          renderList();
        });
      }
      if (teamEl) {
        teamEl.addEventListener("change", function () {
          STATE.team = teamEl.value || "";
          renderList();
        });
      }

      // Populate the Team dropdown with the union of nfl_team values
      // present in the row data. Cheap (~32 entries); rebuilt on each
      // renderList so late TOS injections show up.
      var _lastTeamSig = "";
      function refreshTeamDropdown(players) {
        if (!teamEl) return;
        var teams = [];
        var seen = {};
        for (var i = 0; i < players.length; i += 1) {
          var t = players[i].nfl_team || "";
          if (t && !seen[t]) { seen[t] = 1; teams.push(t); }
        }
        teams.sort();
        var sig = teams.join("|");
        if (sig === _lastTeamSig) return;
        _lastTeamSig = sig;
        var current = teamEl.value;
        var html = '<option value="">All teams</option>';
        for (var j = 0; j < teams.length; j += 1) {
          var sel = teams[j] === current ? " selected" : "";
          html += '<option value="' + teams[j] + '"' + sel + '>' + teams[j] + '</option>';
        }
        teamEl.innerHTML = html;
      }

      // Position chips
      chipsEl.addEventListener("click", function (e) {
        var btn = e.target.closest(".ups-picker-chip");
        if (!btn) return;
        STATE.pos = btn.getAttribute("data-pos") || "ALL";
        chipsEl.querySelectorAll(".ups-picker-chip").forEach(function (c) {
          c.classList.toggle("active", c === btn);
        });
        renderList();
      });

      // Row click → atomic deselect-old + select-new.
      // User doesn't see "Deselect" mode — clicking any player simply
      // becomes the new selection. Clicking the currently-selected
      // player clears the selection (acts as "Clear").
      listEl.addEventListener("click", function (e) {
        var row = e.target.closest(".ups-picker-row");
        if (!row) return;
        var clickedPid = row.getAttribute("data-picker-pid");
        if (!clickedPid) return;

        var currentPid = getSelectedPid();

        // 1) Clear any existing selection first (if there is one, and it
        //    isn't the same row the user just clicked — that case is
        //    handled in step 2).
        if (currentPid && currentPid !== clickedPid) {
          var oldRow = document.querySelector(
            '.add-player-container .add-drop-player-row[data-player-id="' + cssAttrEscape(currentPid) + '"]'
          );
          if (oldRow) {
            var oldBtn = findRowButton(oldRow, /deselect|clear/i)
                       || findRowButton(oldRow, /add/i);  // fallback
            if (oldBtn) { try { oldBtn.click(); } catch (err) {} }
          }
        }

        // 2) If user clicked the currently-selected player, treat as
        //    "Clear" — TOS's Deselect button handles this.
        if (currentPid && currentPid === clickedPid) {
          var sameRow = document.querySelector(
            '.add-player-container .add-drop-player-row[data-player-id="' + cssAttrEscape(clickedPid) + '"]'
          );
          var clearBtn = sameRow ? findRowButton(sameRow, /deselect|clear/i) : null;
          if (clearBtn) { try { clearBtn.click(); } catch (err) {} }
          renderList();
          updateTriggerLabel();
          return;  // stay open so user can pick someone new
        }

        // 3) Select the new player.
        var newRow = document.querySelector(
          '.add-player-container .add-drop-player-row[data-player-id="' + cssAttrEscape(clickedPid) + '"]'
        );
        var addBtn = newRow ? findRowButton(newRow, /^\s*add\s*$/i) : null;
        if (addBtn) {
          try { addBtn.click(); }
          catch (err) { console.log("[ups-picker] add-button click threw:", err); }
        } else {
          // Fallback: set the hidden input directly. Selection state in
          // MFL may not reflect, but PLAYER_PICK is at least populated.
          var sel = document.getElementById("sel_pid");
          if (sel) sel.value = clickedPid;
        }
        // 4) Update UI state. Closing the drawer after a successful pick
        //    so the user can move to bid entry.
        renderList();
        updateTriggerLabel();
        closeDrawer();
      });

      function findRowButton(row, textRegex) {
        var buttons = Array.from(row.querySelectorAll("button"));
        return buttons.find(function (b) {
          return textRegex.test(String(b.textContent || "").trim());
        });
      }
      function cssAttrEscape(s) {
        return String(s || "").replace(/(["\\])/g, "\\$1");
      }

      // Re-render when MFL/TOS injects more rows later OR the .selected-player
      // class toggles (e.g., the user makes a selection some other way, or
      // initial state finishes loading).
      var anchor2 = document.querySelector(".add-player-container");
      if (anchor2 && window.MutationObserver) {
        var obs = new MutationObserver(function () {
          if (drawer.classList.contains("ups-picker-open")) renderList();
          updateTriggerLabel();
        });
        obs.observe(anchor2, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["class"],
        });
        setTimeout(function () { try { obs.disconnect(); } catch (e) {} }, 5 * 60 * 1000);
      }

      // Initial trigger label (will read selected state from MFL DOM)
      updateTriggerLabel();
    }
  })();
  } // UPS_BB_GATE_END
</script>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  // ─── Auction Bid (O=43) quick-bid buttons — Phase 4.3 ───────────────────
  // Inject +$1K / +$5K / +$10K buttons next to each bid input on MFL's
  // O=43 page. Reads the current high bid from the `onblur="validateBid(
  // this, NNNN)"` attribute MFL bakes into each input, then a button
  // click sets the input value to (current_high + delta).
  //
  // No "Match Proxy" — Keith opted out (proxy data isn't on the page
  // anyway unless viewer is the high bidder).
  // No "Max Affordable" yet — Keith wants that for FA Auction where the
  // $300K cap matters; ERA has no cap so delta-only buttons are enough.
  (function () {
    var BUILD = "2026-05-20.1";
    if (window.__ups_quickbid_o43_autoload === BUILD) return;
    window.__ups_quickbid_o43_autoload = BUILD;

    function onO43() {
      var bodyId = String((document.body && document.body.id) || "");
      return /^body_options_43/.test(bodyId);
    }

    function injectButtons() {
      if (!onO43()) return;
      // Each bid input is <input name="<playerId>" onblur="validateBid(this, NNNN)">
      var inputs = document.querySelectorAll('input[onblur*="validateBid"]');
      inputs.forEach(function (input) {
        if (input.dataset.upsQuickbid === "1") return; // already wired
        var onblur = String(input.getAttribute("onblur") || "");
        var m = onblur.match(/validateBid\(this\s*,\s*(\d+)/);
        var currentHigh = m ? Number(m[1]) : 0;
        if (!currentHigh) return; // skip the "Opening bid" input (current=0)
        input.dataset.upsQuickbid = "1";

        var wrap = document.createElement("span");
        wrap.style.cssText = "white-space:nowrap; display:inline-block; margin-left:4px;";
        [1000, 5000, 10000].forEach(function (delta) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ups-quickbid-btn";
          btn.textContent = "+$" + (delta / 1000) + "K";
          btn.title = "Set bid to current high ($" + currentHigh.toLocaleString() +
                      ") + $" + delta.toLocaleString();
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            // If user already typed something, increment from their value;
            // otherwise from current high.
            var existing = Number(String(input.value || "").replace(/[^\d]/g, "")) || currentHigh;
            // If existing < currentHigh (stale value), bump base to current high.
            if (existing < currentHigh) existing = currentHigh;
            input.value = String(existing + delta);
            // Trigger MFL's validation so it can re-check the bid is valid.
            try { input.dispatchEvent(new Event("blur", { bubbles: true })); } catch (_) {}
            input.focus();
          });
          wrap.appendChild(btn);
        });
        // Insert directly after the input (same TD cell).
        if (input.parentNode) input.parentNode.insertBefore(wrap, input.nextSibling);
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", injectButtons);
    } else {
      injectButtons();
    }
    // MFL doesn't reload the whole page when sorting / paginating —
    // the auction table can be re-rendered in place. Re-scan every
    // few seconds so any new bid inputs added dynamically get buttons.
    setInterval(injectButtons, 3000);
  })();
  } // UPS_BB_GATE_END
</script>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  // ─── UPS menu cleanup (header_custom_v2) ────────────────────────────────
  // Hide MFL menu items that UPS doesn't use OR has replaced with internal
  // hubs (Front Office, Player Stats, Trade War Room, Rookie Draft Hub,
  // Team Operations). The MFL menu is rendered server-side; we strip items
  // client-side once it's in the DOM. Pattern reuses href substring match
  // so we don't need to know MFL's <li> internals.
  //
  // Blacklist tokens (URL substrings that mark an item as removable):
  //   - trades            : trade_offer, trade_log, trade_bait, view_trade*,
  //                         options?O=05 (Trade Room)
  //   - rosters           : team_rosters, roster_filter, options?O=07,
  //                         options?O=03 (Player Rankings → CCC duplicate)
  //   - draft             : draft_results, draft_room, live_draft, auction,
  //                         rookie_draft, dispersal_draft
  // Kept (per user 2026-05-13):
  //   - Submit Lineup (lineup / setup_lineup) until Wave 4 ships our own
  //     lineup write-path.
  (function () {
    "use strict";
    var BAD_PATTERNS = [
      // Trades
      /\/trade_offer/i, /\/trade_log/i, /\/trade_bait/i, /\/view_trade/i,
      /\bO=05\b/i,
      // Rosters / standings duplicates that point to MFL native pages
      /\/team_rosters/i, /\/roster_filter/i,
      /\bO=07\b/i,
      // Draft (any flavor)
      /\/draft_results/i, /\/draft_room/i, /\/live_draft/i, /\/auction\b/i,
      /\/rookie_draft/i, /\/dispersal_draft/i, /\/draft_history/i
    ];

    function hrefIsBlacklisted(href) {
      if (!href) return false;
      for (var i = 0; i < BAD_PATTERNS.length; i++) {
        if (BAD_PATTERNS[i].test(href)) return true;
      }
      return false;
    }

    // Mobile keep-list (Keith 2026-06-10): on phones the hamburger drawer is
    // trimmed to a short "MFL Legacy Links" fallback — KEEP only Submit Lineup
    // (O=02) · Trade (O=05) · Add/Drop · IR (O=18) · Taxi (O=98) · Live Scoring
    // · Commissioner Setup · Logout; hide everything else (incl. prior-year
    // league homes, account/help/social bloat). Custom MESSAGE links never
    // count (those are the primary My Hub pages).
    function hrefIsLegacyKeep(href) {
      if (!href) return false;
      if (/MODULE=/i.test(href)) return false;
      if (/[?&]O=(?:02|05|18|98)\b/.test(href)) return true;
      if (/\/add_drop\b/.test(href)) return true;
      if (/\/ajax_ls\b/.test(href)) return true;
      if (/\/commissioner_setup\b/.test(href)) return true;
      if (/\/logout\b/.test(href)) return true;
      // Current-year league Home + MFL Dashboard (Keith 2026-06-11). Year is
      // taken from the path so prior-year homes (/2025/home/…) are NOT kept.
      var __y = (String(location.pathname).match(/\/(\d{4})\//) || [])[1] || "";
      if (__y && new RegExp("/" + __y + "/home/\\d+").test(href)) return true;
      if (__y && new RegExp("/" + __y + "/dash\\b").test(href)) return true;
      return false;
    }

    function scrubMenu() {
      // Reset our prior hides first so a viewport change re-evaluates cleanly.
      var prev = document.querySelectorAll('[data-ups-menu-hide]');
      for (var k = 0; k < prev.length; k++) { prev[k].style.removeProperty("display"); prev[k].removeAttribute("data-ups-menu-hide"); }

      // Keep-list trim on BOTH desktop and mobile (Keith 2026-06-11: "clean up
      // the menu items, keep only what's needed"). Hide any <li> with NO kept
      // link inside — covers leaf items AND entire dropdowns whose children are
      // all non-essential; a container holding a kept child stays visible so the
      // essentials are never orphaned. (Previously: keep-list on mobile only +
      // a duplicate-hiding blacklist on desktop. Now the same short legacy set
      // everywhere — hrefIsBlacklisted/BAD_PATTERNS above are now unused.)
      var menu = document.querySelector(".myfantasyleague_menu");
      if (!menu) return;
      var lis = menu.querySelectorAll("li");
      for (var i = 0; i < lis.length; i++) {
        var li = lis[i], keep = false, as = li.querySelectorAll("a[href]");
        for (var j = 0; j < as.length; j++) { if (hrefIsLegacyKeep(as[j].getAttribute("href"))) { keep = true; break; } }
        // Inline !important so the open-drawer "li{display:block!important}"
        // stacking rule in mobile_menu.js can't re-show a hidden item.
        if (!keep) { li.style.setProperty("display", "none", "important"); li.setAttribute("data-ups-menu-hide", "1"); }
      }
    }

    function runWithRetry() {
      scrubMenu();
      // MFL sometimes injects menu items late; re-scrub for a few cycles.
      var n = 0;
      var iv = setInterval(function () {
        scrubMenu();
        if (++n >= 6) clearInterval(iv);
      }, 400);
      window.addEventListener("resize", scrubMenu);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runWithRetry, { once: true });
    } else {
      runWithRetry();
    }
  })();
  } // UPS_BB_GATE_END
</script>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  /* ───────────────────────────────────────────────────────────────────────
   * UPS — O=43 ERA picker filter (Keith 2026-05-22)
   *
   * MFL's O=43 (Auction Bid) page renders an inline picker with every
   * available free agent — ~1,000 rows. During the Expired Rookie Auction
   * (ERA), nominations are restricted by canon (§A3) to the cut rookies
   * we snapshotted into ups_era_pool at the midnight-ET deadline.
   *
   * This IIFE:
   *   1. Gates on body[id^="body_options_43"]
   *   2. Fetches /api/auction/era-eligible (the seeded pool) and
   *      /api/auction/nomination-status (the era_window state)
   *   3. If ERA is OPEN, builds Set<player_id> from the response and
   *      hides every picker row whose player_id isn't in the set.
   *   4. Re-runs on MutationObserver — TOS's add-drop-player-row divs
   *      hydrate after initial DOM ready, so a one-shot scrub misses them.
   *
   * Bypass: append ?era_filter=off to the URL.
   *
   * Compatible with BOTH render paths:
   *   - TOS footer.js → <div class="add-drop-player-row" data-player-id="...">
   *   - MFL native → <table class="report"> rows with <input> / <button>
   *     referencing PLAYER_PICK and the PID in onclick handlers.
   * ───────────────────────────────────────────────────────────────────── */
  (function eraPickerFilter() {
    "use strict";

    // Body-id gate: O=43 is the only page where this matters.
    var bodyId = String(document.body && document.body.id || "").toLowerCase();
    if (!/^body_options_43/.test(bodyId)) return;

    // URL toggles:
    //   ?era_filter=off       — disable entirely (debug)
    //   ?era_filter=force_on  — force-treat ERA as open (test pre-window)
    var forceOn = false;
    try {
      var qs = new URLSearchParams(window.location.search);
      var qv = (qs.get("era_filter") || "").toLowerCase();
      if (qv === "off") {
        console.log("[era-picker-filter] disabled via ?era_filter=off");
        return;
      }
      forceOn = (qv === "force_on" || qv === "force");
      if (forceOn) console.log("[era-picker-filter] force_on — bypassing era_window.open gate");
    } catch (_) {}

    var WORKER_ORIGIN = "https://upsmflproduction.keith-creelman.workers.dev";
    var LEAGUE_ID = "74598";
    var SEASON = String(new Date().getUTCFullYear());

    // Pool state — populated on first fetch.
    var eraSet = null;           // Set<player_id_string>
    var eraWindowOpen = false;
    var fetchInProgress = false;
    var fetchedAt = 0;
    var FETCH_TTL_MS = 60 * 1000;

    // Extract player_id from a picker row. Tries multiple strategies because
    // TOS-rendered and MFL-native DOM look different.
    function extractPid(row) {
      if (!row) return "";
      // 1. Direct data-attribute (TOS sometimes)
      var d = row.getAttribute && (row.getAttribute("data-player-id") ||
        row.getAttribute("data-playerid") || row.getAttribute("data-pid"));
      if (d && /^\d+$/.test(d)) return d;
      // 2. Onclick handler containing PLAYER_PICK= or .value=NNN
      var clickAttr = "";
      var addBtn = row.querySelector && row.querySelector("button, a, input[type='submit']");
      if (addBtn) {
        clickAttr = addBtn.getAttribute("onclick") || addBtn.getAttribute("href") || "";
        var m = clickAttr.match(/(?:PLAYER_PICK|PLAYER_ID)[^0-9]*(\d{3,6})/i) ||
                clickAttr.match(/value\s*=\s*['"]?(\d{3,6})/i) ||
                clickAttr.match(/\b(\d{5,6})\b/);
        if (m) return m[1];
      }
      // 3. Any anchor with options?O=04&P=NNN (MFL player profile link)
      var profileLink = row.querySelector && row.querySelector("a[href*='O=04']");
      if (profileLink) {
        var href = profileLink.getAttribute("href") || "";
        var pm = href.match(/[?&]P=(\d{3,6})/);
        if (pm) return pm[1];
      }
      // 4. Image src with playerImages_80x107/12345.jpg pattern (TOS)
      var img = row.querySelector && row.querySelector("img[src*='playerImages']");
      if (img) {
        var sm = (img.getAttribute("src") || "").match(/playerImages[^/]*\/(\d{3,6})\b/);
        if (sm) return sm[1];
      }
      return "";
    }

    function ensureBanner(state) {
      var existing = document.getElementById("ups-era-picker-banner");
      if (state.hidden) {
        if (existing) existing.remove();
        return;
      }
      if (existing) {
        var inner = existing.querySelector(".inner");
        if (inner) inner.textContent = state.text;
        return;
      }
      var b = document.createElement("div");
      b.id = "ups-era-picker-banner";
      b.style.cssText =
        "background: #1a2845; color: #f0c465; border: 1px solid #f0c465; " +
        "border-radius: 6px; padding: 10px 14px; margin: 12px 0; " +
        "font-size: 13px; font-weight: 600; line-height: 1.5;";
      b.innerHTML = '<div class="inner">' + state.text + "</div>";
      // Try to insert ABOVE the AddDropForm so it reads naturally.
      var anchor = document.querySelector("form#AddDropForm");
      if (anchor && anchor.parentNode) {
        anchor.parentNode.insertBefore(b, anchor);
      } else {
        var fallback = document.querySelector(".add-player-container") || document.body;
        fallback.insertBefore(b, fallback.firstChild);
      }
    }

    // ── O=43 picker filter — data-layer approach (Keith 2026-05-25) ──
    //
    // PREVIOUS APPROACH (broken): tried to walk DOM rows + hide non-ERA
    // ones. Failed because O=43's picker is rendered by MFL's
    // /picker.js v2.06 widget at runtime. The HTML on initial load has
    // NO rows — picker.js reads `playerDatabaseObj["picker"]` (a global
    // array of ~1820 Player2 objects) and injects rows into `#picker`
    // by calling `update_picker()`. Our DOM walk fired before rows
    // existed, then again on observer mutations causing instability.
    //
    // CURRENT APPROACH: hook into the picker.js data layer directly.
    // MFL's update_picker() skips any row where `pp_playerDB[j].avail
    // < 1` (see /picker.js line ~46). So we just walk the global
    // playerDatabaseObj["picker"] array, mark non-ERA players as
    // avail = 0, then call update_picker("picker"). MFL's own
    // rendering handles the rest cleanly.
    var _applying = false;
    var _applyScheduled = false;
    var _pickerWaitAttempts = 0;

    function pickerDataReady() {
      return !!(window.playerDatabaseObj &&
                window.playerDatabaseObj.picker &&
                Array.isArray(window.playerDatabaseObj.picker) &&
                window.playerDatabaseObj.picker.length > 0);
    }

    function applyFilter() {
      if (_applying) return { reentry: true };
      _applying = true;
      try {
        if (!eraSet || !eraWindowOpen) {
          ensureBanner({
            hidden: false,
            text: "⏸ ERA filter idle — eraSet=" +
              (eraSet ? eraSet.size : "null") +
              " \u00B7 windowOpen=" + eraWindowOpen +
              " (cycle closed or pool not loaded)",
          });
          return { skipped: "filter_off" };
        }
        if (!pickerDataReady()) {
          ensureBanner({
            hidden: false,
            text: "⏳ ERA filter waiting for playerDatabaseObj.picker (MFL picker hasn't hydrated)",
          });
          return { skipped: "picker_data_not_ready" };
        }
        var pdb = window.playerDatabaseObj.picker;
        var kept = 0, hidden = 0;
        for (var j = 0; j < pdb.length; j += 1) {
          var p = pdb[j];
          if (!p) continue;
          var pid = String(p.id || "");
          if (eraSet.has(pid)) {
            p.avail = 1;
            kept += 1;
          } else {
            p.avail = 0;
            hidden += 1;
          }
        }
        // Re-render the picker via MFL's own function — but only if the
        // legacy <table id="picker"> element actually exists on this page.
        // O=43's nomination form doesn't render it (UI comes from the TOS
        // overlay + UPS drawer instead); calling update_picker there throws
        // "null is not an object (evaluating 'picker.innerHTML = content')"
        // inside MFL's own code. Silently skip — the data-layer filter
        // (avail flags above) is still applied, which is all we need for
        // any other surface that DOES use #picker.
        var renderError = "";
        var hasPickerEl = !!document.getElementById("picker");
        if (hasPickerEl) {
          if (typeof window.update_picker === "function") {
            try { window.update_picker("picker"); }
            catch (e) { renderError = String((e && e.message) || e).slice(0, 200); }
          } else {
            renderError = "window.update_picker not a function";
          }
        }

        // UPS-built picker drawer (Keith 2026-05-25 — discovered after
        // user screenshot showed `ups-picker-*` classes). The page has
        // THREE picker renderings:
        //   1. MFL native #picker table (data layer: avail flags)
        //   2. TOS footer.js .add-drop-player-row divs (DOM hide)
        //   3. UPS-injected drawer .ups-picker-row (DOM hide via
        //      data-picker-pid attribute — what user actually sees)
        // Walk all three and hide non-ERA rows.
        var upsKept = 0, upsHidden = 0;
        try {
          var upsRows = document.querySelectorAll(".ups-picker-row[data-picker-pid]");
          upsRows.forEach(function (row) {
            var pid = String(row.getAttribute("data-picker-pid") || "");
            if (!pid) return;
            if (eraSet.has(pid)) {
              if (row.style.display === "none") row.style.display = "";
              upsKept += 1;
            } else {
              if (row.style.display !== "none") row.style.display = "none";
              upsHidden += 1;
            }
          });
          // Update the drawer's count meta if present.
          var metaEl = document.querySelector('.ups-picker-meta[data-meta="count"]');
          if (metaEl && upsKept > 0) {
            metaEl.textContent = upsKept + " of " + eraSet.size +
              " eligible players \u00B7 ERA cycle";
          }
        } catch (_) {}

        // TOS overlay picker — theeohiostate's footer.js renders rows
        // with `.add-drop-player-row` divs. Hide non-ERA ones too so the
        // UPS picker's readPlayers() (which reads from these) sees only
        // 26 entries on its next re-render.
        var tosKept = 0, tosHidden = 0;
        try {
          var tosRows = document.querySelectorAll(".add-drop-player-row");
          tosRows.forEach(function (row) {
            // Pull player_id from data-attr, img src, or profile link.
            var pid = "";
            var d = row.getAttribute && (row.getAttribute("data-player-id") ||
              row.getAttribute("data-playerid") || row.getAttribute("data-pid"));
            if (d && /^\d+$/.test(d)) pid = d;
            if (!pid) {
              var img = row.querySelector && row.querySelector("img[src*='playerImages']");
              if (img) {
                var sm = (img.getAttribute("src") || "").match(/playerImages[^/]*\/(?:mfl_)?(\d{3,6})\b/);
                if (sm) pid = sm[1];
              }
            }
            if (!pid) {
              var prof = row.querySelector && row.querySelector("a[href*='O=04']");
              if (prof) {
                var hm = (prof.getAttribute("href") || "").match(/[?&]P=(\d{3,6})/);
                if (hm) pid = hm[1];
              }
            }
            if (!pid) return; // header / chrome row — leave alone
            if (eraSet.has(pid)) {
              if (row.style.display === "none") row.style.display = "";
              tosKept += 1;
            } else {
              if (row.style.display !== "none") row.style.display = "none";
              tosHidden += 1;
            }
          });
        } catch (_) {}
        // Update the drawer trigger button count too — it reads from
        // readPlayers() which walks all TOS rows. We can't override
        // readPlayers (it's local to the drawer IIFE), but we CAN
        // patch the visible count text on the trigger.
        try {
          var triggerCountEl = document.querySelector(".ups-picker-trigger-count");
          if (triggerCountEl && eraSet) {
            triggerCountEl.textContent = "(" + eraSet.size + " ERA-eligible)";
          }
        } catch (_) {}

        ensureBanner({
          hidden: false,
          text: "🔒 ERA Auction active — pool " + eraSet.size +
            " \u00B7 MFL " + kept + "/" + (kept + hidden) +
            " \u00B7 UPS drawer " + upsKept + "/" + (upsKept + upsHidden) +
            " \u00B7 TOS " + tosKept + "/" + (tosKept + tosHidden) +
            (renderError ? " \u00B7 render error: " + renderError : "") +
            " (?era_filter=off to bypass)",
        });
        return {
          kept: kept, hidden: hidden, total: pdb.length,
          ups_kept: upsKept, ups_hidden: upsHidden,
          tos_kept: tosKept, tos_hidden: tosHidden,
          renderError: renderError,
        };
      } finally {
        _applying = false;
      }
    }

    // Watch the TOS widget container — when user clicks a position chip
    // or searches, TOS re-renders the rows from scratch. We need to
    // re-apply our filter after each re-render. Scoped to the add-player-
    // container so we don't observe the whole body (avoids the earlier
    // infinite-loop bug).
    var _tosObserverAttached = false;
    var _tosScheduled = false;
    var _tosPollAttempts = 0;
    function attachPickerObservers() {
      if (_tosObserverAttached) return;
      var targets = [];

      // UPS-built drawer list — primary visible picker. Re-renders on
      // every search/chip/sort change. Must observe to catch new rows.
      var upsList = document.querySelector(".ups-picker-list");
      if (upsList) targets.push({ el: upsList, name: ".ups-picker-list" });

      // TOS overlay container — secondary picker that feeds UPS drawer's
      // readPlayers(). Hide TOS rows so the drawer's next render skips
      // non-ERA players.
      var tosContainer = document.querySelector(".add-player-container");
      if (!tosContainer) {
        var anyRow = document.querySelector("[class*='add-drop-player']");
        tosContainer = anyRow && anyRow.parentElement;
      }
      if (tosContainer) targets.push({ el: tosContainer, name: "add-player-container" });

      if (targets.length === 0) {
        // Neither picker rendered yet — poll up to 15s.
        if (++_tosPollAttempts > 30) {
          console.log("[era-picker-filter] no picker container after 15s");
          return;
        }
        setTimeout(attachPickerObservers, 500);
        return;
      }

      targets.forEach(function (t) {
        var mo = new MutationObserver(function () {
          if (_tosScheduled || _applying) return;
          _tosScheduled = true;
          (window.requestAnimationFrame || function (cb) { setTimeout(cb, 16); })(function () {
            _tosScheduled = false;
            applyFilter();
          });
        });
        mo.observe(t.el, { childList: true, subtree: true });
        console.log("[era-picker-filter] observer attached to", t.name,
          "— rows in DOM: .ups-picker-row=" + document.querySelectorAll(".ups-picker-row").length,
          ".add-drop-player-row=" + document.querySelectorAll(".add-drop-player-row").length);
      });
      _tosObserverAttached = true;
      // Re-apply filter right after attach.
      applyFilter();
    }

    // Backward-compat alias for existing callers.
    var attachTosObserver = attachPickerObservers;

    // Debounced wrapper — MutationObserver / re-render hooks call this,
    // not applyFilter directly. rAF collapses mutation bursts.
    function scheduleApply() {
      if (_applyScheduled || _applying) return;
      _applyScheduled = true;
      (window.requestAnimationFrame || function (cb) { setTimeout(cb, 16); })(function () {
        _applyScheduled = false;
        applyFilter();
      });
    }

    // Poll for playerDatabaseObj["picker"] to appear (picker.js may
    // run after our IIFE; load_picker_picker() executes inline at
    // page-load but timing relative to header_custom_v2.html script
    // isn't guaranteed). 20 retries × 250ms = 5s upper bound.
    function waitForPickerData(then) {
      if (pickerDataReady()) {
        then();
        return;
      }
      if (++_pickerWaitAttempts > 20) {
        console.log("[era-picker-filter] playerDatabaseObj.picker never appeared — picker not active on this page?");
        return;
      }
      setTimeout(function () { waitForPickerData(then); }, 250);
    }

    function loadPool(force) {
      var now = Date.now();
      if (!force && fetchedAt && now - fetchedAt < FETCH_TTL_MS) return Promise.resolve();
      if (fetchInProgress) return Promise.resolve();
      fetchInProgress = true;
      return Promise.all([
        fetch(WORKER_ORIGIN + "/api/auction/era-eligible?L=" + LEAGUE_ID + "&YEAR=" + SEASON, { credentials: "omit" })
          .then(function (r) { return r.json(); })
          .catch(function () { return null; }),
        fetch(WORKER_ORIGIN + "/api/auction/nomination-status?L=" + LEAGUE_ID + "&YEAR=" + SEASON, { credentials: "omit" })
          .then(function (r) { return r.json(); })
          .catch(function () { return null; }),
      ]).then(function (parts) {
        var eraResp = parts[0];
        var nomResp = parts[1];
        if (eraResp && Array.isArray(eraResp.players)) {
          eraSet = new Set(eraResp.players.map(function (p) { return String(p.player_id); }));
        }
        eraWindowOpen = forceOn || !!(nomResp && nomResp.era_window && nomResp.era_window.open);
        fetchedAt = Date.now();
        console.log("[era-picker-filter] pool=" + (eraSet ? eraSet.size : 0) +
          " window_open=" + eraWindowOpen);
        applyFilter();
      }).finally(function () {
        fetchInProgress = false;
      });
    }

    // Hook into MFL's update_picker so user-triggered re-renders
    // (search / position filter / sort clicks) re-apply our filter.
    // MFL's picker.js builds new rows from playerDatabaseObj — we've
    // already marked non-ERA avail=0 so update_picker skips them
    // naturally, but we wrap the function to ALSO re-mark in case
    // anything reset avail back to 1.
    function hookUpdatePicker() {
      if (typeof window.update_picker !== "function" || window.update_picker._upsEraWrapped) return;
      var orig = window.update_picker;
      var wrapper = function (picker_id) {
        if (picker_id === "picker" && eraSet && eraWindowOpen && pickerDataReady()) {
          var pdb = window.playerDatabaseObj.picker;
          for (var j = 0; j < pdb.length; j += 1) {
            var p = pdb[j];
            if (!p) continue;
            p.avail = eraSet.has(String(p.id || "")) ? 1 : 0;
          }
        }
        return orig.apply(this, arguments);
      };
      wrapper._upsEraWrapped = true;
      window.update_picker = wrapper;
      console.log("[era-picker-filter] update_picker hooked");
    }

    // Auto-preselect from URL — MFL doesn't honor PLAYER_ID query param
    // for O=43 (verified by probe — page renders picker mode regardless).
    // Workaround: read PLAYER_ID from URL after picker hydrates and call
    // MFL's own picker_select("picker", j, 0). Mirrors what happens when
    // a user clicks a row.
    function preselectFromUrl() {
      try {
        var qs = new URLSearchParams(window.location.search);
        var pid = String(qs.get("PLAYER_ID") || qs.get("P") || "").replace(/\D/g, "");
        if (!pid) return;

        // Preselect via TOS row's Add button (Keith 2026-05-25 — the
        // UPS drawer / TOS overlay watches TOS row state, not MFL's
        // picker_select hidden input). Programmatically clicking the
        // Add button propagates selection through the drawer's UI and
        // MFL's hidden inputs simultaneously.
        var attempts = 0;
        function tryClick() {
          var tosRow = document.querySelector(
            ".add-player-container .add-drop-player-row[data-player-id='" + pid + "']"
          );
          if (tosRow) {
            // Find the "Add" button on this row.
            var btns = Array.from(tosRow.querySelectorAll("button"));
            var addBtn = btns.find(function (b) {
              return /^\s*add\s*$/i.test(String(b.textContent || "").trim());
            });
            if (addBtn) {
              try {
                addBtn.click();
                console.log("[era-picker-filter] preselected pid=" + pid + " via TOS Add button");
                return;
              } catch (e) {
                console.log("[era-picker-filter] TOS Add click threw:", e && e.message);
              }
            } else {
              console.log("[era-picker-filter] TOS row found but no Add button (might already be selected)");
              return;
            }
          }
          // TOS rows may render after our IIFE. Poll up to 15s.
          if (++attempts <= 30) {
            setTimeout(tryClick, 500);
            return;
          }
          console.log("[era-picker-filter] TOS row for pid=" + pid + " never appeared — falling back to picker_select");
          // Fallback: MFL native picker_select (no visible effect on
          // drawer but at least sets MFL's hidden input).
          if (!pickerDataReady()) return;
          var pdb = window.playerDatabaseObj.picker;
          var targetIdx = -1;
          for (var j = 0; j < pdb.length; j += 1) {
            if (String(pdb[j] && pdb[j].id || "") === pid) { targetIdx = j; break; }
          }
          if (targetIdx >= 0 && typeof window.picker_select === "function") {
            try { window.picker_select("picker", targetIdx, 1); } catch (_) {}
          }
        }
        tryClick();
      } catch (_) {}
    }

    function init() {
      loadPool(true).then(function () {
        // Wait for picker data, then apply + hook + preselect.
        waitForPickerData(function () {
          var result = applyFilter();
          console.log("[era-picker-filter] applyFilter result:", JSON.stringify(result));
          hookUpdatePicker();
          preselectFromUrl();
          attachTosObserver();
          // Verify what's actually in the DOM after our re-render.
          var pickerEl = document.getElementById("picker");
          var rowCount = pickerEl ? pickerEl.querySelectorAll("tr").length : -1;
          var tosVisible = 0, tosTotal = 0;
          document.querySelectorAll(".add-drop-player-row").forEach(function (r) {
            tosTotal += 1;
            if (r.style.display !== "none") tosVisible += 1;
          });
          console.log("[era-picker-filter] post-render #picker tr count =", rowCount,
            "(expected ~26 if filter worked)");
          console.log("[era-picker-filter] post-render TOS rows visible/total =", tosVisible + "/" + tosTotal);
          console.log("[era-picker-filter] activated — pool=" + (eraSet ? eraSet.size : 0) +
            ", picker_size=" + (window.playerDatabaseObj.picker || []).length);
        });
      });
      // Refresh pool every TTL (handles open → close transition mid-page).
      setInterval(function () { loadPool(false); }, FETCH_TTL_MS);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init, { once: true });
    } else {
      init();
    }
  })();
  } // UPS_BB_GATE_END
</script>

<script>
/* ─── UPS NATIVE-PAGE SKIN GUARD (Keith 2026-08-03) ─────────────────────────
 * Keith: "remove any and all styling that is not a page we created or the home
 * page — keep the MFL base styling outside of our pages."
 *
 * OUR pages are the home page and the hubs we built, and every one of those
 * lives at /<year>/home/<league> (the hubs are ?MODULE=MESSAGE* on that same
 * path). Everything else — /options, /rosters, /standings, /player, /reports —
 * is stock MFL and should look like stock MFL.
 *
 * SCOPED TO THE TEST LEAGUE FOR NOW (Keith asked to trial it there first).
 * Flip TEST_ONLY to false to roll it out to the real league. Nothing happens
 * on any other league, so pasting this header into prod is a no-op change.
 *
 * WHAT IT DOES: disables our five inline stylesheets and hides the chrome we
 * inject (hero, hotlinks, footer, subnav, app-switch pill, dev banner) — which
 * has to be hidden as well as unstyled, or it would render as raw unstyled
 * markup once its CSS is gone.
 *
 * WHAT IT DELIBERATELY DOES NOT DO: touch link#custom. That is MFL's own
 * configured skin (light.css), and Keith's answer was explicit — keep the
 * league skin on native pages, drop only OUR styling. The opt-in Lite Mode
 * (ups_barebones) still disables light.css; that path is untouched.
 *
 * KNOWN INTERACTION: our CSS display:none's MFL's native menu on desktop, so
 * disabling it brings that menu back. That is the intended stock look — but if
 * it floats oddly, docs/mfl_native/barebones_mode.md has the pinning fix, and
 * its warning applies: do NOT set position:static or z-index on that bar, it
 * breaks MFL's own dropdowns.
 */
(function () {
  "use strict";
  var TEST_ONLY = true;
  var TEST_LEAGUE = "25625";
  var STYLE_IDS = ["ups-core-styles", "ups-marquee-style", "ups-theme-postload-overrides",
                   "ups-picker-drawer-style", "ups-tail-styles"];
  try {
    var u = new URL(window.location.href);
    var league = String(u.searchParams.get("L") || "").replace(/\D/g, "");
    if (!league) {
      var m = String(u.pathname || "").match(/\/home\/(\d+)(?:\/|$)/i);
      if (m) league = m[1];
    }
    if (!league) league = String(window.league_id || window.LEAGUE_ID || "").replace(/\D/g, "");
    if (TEST_ONLY && league !== TEST_LEAGUE) return;

    // Our pages = /home/<league>. Home itself and every MODULE hub share it.
    if (/\/home\/\d+/i.test(String(u.pathname || ""))) return;

    document.documentElement.setAttribute("data-ups-native-skin", "1");
    var hide = document.createElement("style");
    hide.id = "ups-native-skin-hide";
    hide.textContent = ".ups-hero-shell,.ups-hotlinks-shell,.ups-footer,#ups-switch-app-btn," +
                       "#upsDevBanner,.ups-teamops-subnav{display:none!important}";
    (document.head || document.documentElement).appendChild(hide);

    function strip() {
      for (var i = 0; i < STYLE_IDS.length; i++) {
        var el = document.getElementById(STYLE_IDS[i]);
        if (el && !el.disabled) el.disabled = true;
      }
    }
    strip();
    // Blocks further down the header parse after this runs, and a couple are
    // appended by script later still — re-run at each lifecycle point rather
    // than assuming a parse order.
    document.addEventListener("DOMContentLoaded", strip);
    window.addEventListener("load", strip);
    try {
      new MutationObserver(strip).observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}
    try { console.log("[UPS][native-skin] stock MFL styling on", u.pathname); } catch (e) {}
  } catch (e) {}
})();
</script>
