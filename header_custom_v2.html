<script>
  // ─── UPS BAREBONES GUARD — MUST BE THE FIRST SCRIPT BLOCK ───────────────
  // Per-user stock-MFL fallback (docs/mfl_native/barebones_mode.md). When ON,
  // every custom block below early-outs via its UPS_BB_GATE wrap and this
  // guard disables the skin + custom styles, hides custom homepage modules,
  // and injects the "Full Site" pill. Survivors: the stage-4 player modal
  // (contracts still readable/actionable from stock pages) and this guard.
  // Rescue tiers: ?ups_barebones=0 URL param; MFL-native logout?HIDE_CUST=1
  // strips EVERYTHING including this guard (restore with HIDE_CUST=0).
  (function () {
    var KEY = "ups_barebones_v1";
    var stored = null;
    try { stored = window.localStorage.getItem(KEY); } catch (e) {} // private mode → null → OFF
    var fromUrl = null;
    try {
      var u = new URL(window.location.href);
      var q = u.searchParams.get("ups_barebones");
      if (q === "1" || q === "0") fromUrl = q;
      if (fromUrl === null) {
        var hm = String(u.hash || "").match(/(?:^#|[#&])ups_barebones=(1|0)/);
        if (hm) fromUrl = hm[1];
      }
      if (fromUrl !== null) {
        try { window.localStorage.setItem(KEY, fromUrl); } catch (e) {}
        // Strip the param immediately — MFL must never see it on later requests.
        u.searchParams.delete("ups_barebones");
        u.hash = String(u.hash || "").replace(/(?:^#|[#&])ups_barebones=(?:1|0)/, "");
        try { window.history.replaceState(null, "", u.toString()); } catch (e) {}
      }
    } catch (e) {}
    var on = fromUrl !== null ? fromUrl === "1" : stored === "1";
    window.UPS_BAREBONES = on;

    // Shared setter — the pill, the subnav link, and the mobile drawer row all
    // call this. Defined in BOTH modes.
    window.UPS_BAREBONES_SET = function (next) {
      try { window.localStorage.setItem(KEY, next ? "1" : "0"); }
      catch (e) {
        alert("Storage unavailable — append ?ups_barebones=" + (next ? 1 : 0) + " to the URL instead.");
        return;
      }
      window.location.reload();
    };

    if (!on) {
      try { console.log("[UPS][barebones] guard v1 installed — OFF (full site)"); } catch (e) {}
      return;
    }

    document.documentElement.setAttribute("data-ups-barebones", "1");
    // Survivor #2: the rich player modal on native pages. The stage-4 default
    // block is typeof-guarded, so this early assignment wins; the bridge
    // re-checks the flag per click, so timing is never a race.
    window.UPS_USE_NATIVE_PLAYER_POPUP = true;

    // (a) Skin: stock look = MFL's own MFLBaseCSS (link#default). Disable only
    // TOS's light.css (link#custom) — both live in <head>, already parsed.
    try { var skin = document.getElementById("custom"); if (skin) skin.disabled = true; } catch (e) {}

    // (b) Style/link killer. MFL emits no inline <style> of its own
    // (mfl_page_html_inventory.md) — the pre-guard snapshot is future-proofing.
    // Everything custom that parses later is disabled within a microtask.
    var KEEP_IDS = { "upm-master-styles": 1, "ups-bb-style": 1 };
    var LINK_KILL = /mflscripts\.com|cdnjs\.cloudflare\.com|keithcreelman\.github\.io/i;
    var pre = [];
    try { pre = Array.prototype.slice.call(document.querySelectorAll("style")); } catch (e) {}
    function kill(n) {
      try {
        if (!n || !n.tagName) return;
        var t = n.tagName.toUpperCase();
        if (t === "STYLE") {
          if (!KEEP_IDS[n.id] && pre.indexOf(n) === -1) n.disabled = true;
        } else if (t === "LINK" && /stylesheet/i.test(n.rel || "") &&
                   (n.id === "custom" || LINK_KILL.test(n.href || ""))) {
          n.disabled = true;
        }
      } catch (e) {}
    }
    function sweep() {
      try { document.querySelectorAll("style,link").forEach(kill); } catch (e) {}
    }
    try {
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var add = muts[i].addedNodes;
          for (var j = 0; j < add.length; j++) kill(add[j]);
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}

    // (c) The one allowlisted style: hide static custom HTML (can't be
    // un-parsed, only hidden) — hero, hotlinks, custom footer, app-switch
    // pill, dev banner, subnav.
    try {
      var s = document.createElement("style");
      s.id = "ups-bb-style";
      s.textContent =
        ".ups-hero-shell,.ups-hotlinks-shell,.ups-footer,#ups-switch-app-btn," +
        "#upsDevBanner,.ups-teamops-subnav{display:none!important}" +
        // The native MFL menu (.myfantasyleague_menu) is display:none'd by the
        // custom CSS on desktop (Legacy Links dropdown replaces it). In
        // barebones that rule is disabled so the native bar returns; pinNative-
        // Menu() below moves it to the top of the page body so it can't float
        // down. (Never write that tag name in angle brackets here — MFL's save
        // validator substring-scans the raw text and rejects it even inside a
        // comment. See docs/mfl_native/barebones_mode.md.)
        //
        // DELIBERATELY MINIMAL (fixed 2026-07-17): the first version also set
        // `position:static` and `z-index:1` here, which BROKE MFL's own
        // dropdowns — the menu opened but vanished before you could reach an
        // item. Two causes: (1) z-index:1 makes the bar a STACKING CONTEXT, so
        // its absolutely-positioned submenu is trapped at level 1 and page
        // content paints over it; (2) position:static removes the anchor its
        // submenus position against. MFL's own MFLBaseCSS is still enabled in
        // barebones and already knows how to lay this menu out — so touch
        // nothing but the bottom margin, and never re-add position/z-index here.
        "[data-ups-barebones] .myfantasyleague_menu{margin:0 0 10px!important}" +
        // Belt-and-suspenders for the player modal: the modal overlay now sits at
        // z-index 2147483001 (was 10000, which the native menu painted over), but
        // also HIDE the native bar entirely while the modal is open so nothing
        // bleeds through. `.upm-overlay.open` exists only while the modal shows.
        "html[data-ups-barebones]:has(.upm-overlay.open) .myfantasyleague_menu{display:none!important}";
      (document.head || document.documentElement).appendChild(s);
    } catch (e) {}

    // (d) Hide custom homepage modules (ours carry github.io/worker embeds);
    // native HPMs — standings, Legacy Links, polls — are untouched.
    function hideCustomHpms() {
      try {
        document.querySelectorAll(".homepagemodule").forEach(function (box) {
          if (box.getAttribute("data-ups-bb-hidden")) return;
          if (box.querySelector(
            'iframe[src*="keithcreelman.github.io"],iframe[src*="upsmflproduction"],' +
            'script[src*="keithcreelman.github.io"],#cccMount,[id^="ups"][id*="Mount"]')) {
            box.setAttribute("data-ups-bb-hidden", "1");
            box.style.display = "none";
            box.querySelectorAll("iframe").forEach(function (fr) { try { fr.remove(); } catch (e) {} });
          }
        });
      } catch (e) {}
    }

    // (e) Survivor #1: the pill. Inline styles ONLY; anchored to document.body
    // ONLY — in barebones no custom DOM exists to anchor to.
    function injectPill() {
      try {
        if (!document.body || document.getElementById("ups-bb-pill")) return;
        var a = document.createElement("a");
        a.id = "ups-bb-pill";
        a.href = "#";
        a.textContent = "\u26a1 Full Site";
        a.setAttribute("aria-label", "Switch back to the full custom site");
        a.style.cssText =
          "position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));" +
          "z-index:2147483000;padding:10px 16px;min-height:24px;background:#16253a;color:#fff;" +
          "border:1px solid #5b8dff;border-radius:999px;font:700 13px/1.2 -apple-system," +
          "BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-decoration:none;" +
          "box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer";
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          window.UPS_BAREBONES_SET(false);
        });
        document.body.appendChild(a);
      } catch (e) {}
    }

    // Pin MFL's native menu to the TOP of the body. CSS position:static can't
    // fix a bar that "floats down" because it sits low in MFL's own markup — so
    // physically move the element up (in place, so its dropdown handlers
    // survive). Idempotent; retried because the menu can render after onReady.
    function pinNativeMenu() {
      try {
        var menu = document.querySelector(".myfantasyleague_menu");
        if (!menu || menu.getAttribute("data-ups-bb-pinned")) return;
        menu.setAttribute("data-ups-bb-pinned", "1");
        if (document.body && menu.parentNode && document.body.firstChild !== menu) {
          document.body.insertBefore(menu, document.body.firstChild);
        }
      } catch (e) {}
    }

    function onReady() {
      sweep();
      hideCustomHpms();
      injectPill();
      pinNativeMenu();
      // The menu often renders after DOMContentLoaded — catch late paints.
      try { setTimeout(pinNativeMenu, 400); setTimeout(pinNativeMenu, 1200); } catch (e) {}
      try {
        console.log("[UPS][barebones] ON — custom layer disabled; pill bottom-left; rescue: ?ups_barebones=0");
      } catch (e) {}
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", onReady);
    else onReady();
    injectPill(); // best-effort early too (body may already exist mid-parse)
  })();
</script>

<script>
  // ─── UPS RELEASE-SHA AUTO-RESOLVER (Keith 2026-07-18) ─────────────────────
  // Sets window.UPS_RELEASE_SHA to the LATEST main commit so every jsDelivr
  // embed (Commish Settings, Front Office v2, CCC, …) loads from an IMMUTABLE
  // @<sha> URL — always fresh — instead of @main, which jsDelivr caches for up
  // to ~12h (the "still seeing the old version after a merge" bug). Fully
  // automatic: reads the SHA from GitHub's API on each load (one lightweight
  // request; the ".sha" media type returns just the hash). A sessionStorage
  // seed makes the value available synchronously on a direct hub load so the
  // loaders never fall back to @main after the first visit; the fetch then
  // updates it to the newest commit for any embed opened later this session.
  // Fully guarded — any failure just leaves the previous behavior intact.
  (function () {
    try {
      var SK = "ups_release_sha_v1", c = "";
      try { c = sessionStorage.getItem(SK) || ""; } catch (e) {}
      if (/^[0-9a-f]{7,40}$/i.test(c)) window.UPS_RELEASE_SHA = c;
      fetch("https://api.github.com/repos/keithcreelman/upsmflproduction/commits/main", {
        headers: { Accept: "application/vnd.github.sha" }, cache: "no-store"
      }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (sha) {
        sha = String(sha || "").trim();
        if (/^[0-9a-f]{7,40}$/i.test(sha)) {
          window.UPS_RELEASE_SHA = sha;
          try { sessionStorage.setItem(SK, sha); } catch (e) {}
        }
      }).catch(function () {});
    } catch (e) {}
  })();
</script>

<script>
  // ─── UPS APP-VIEW BEACON (passive usage tracking, Keith 2026-07-18) ───────
  // One fire-and-forget page-load ping so the commish can see WHICH OWNERS open
  // the app (Lite Mode vs full custom site) — not just who takes an action.
  // navigator.sendBeacon → a "simple" text/plain POST: no CORS preflight, and it
  // survives the page unloading. Franchise comes from MFL's own window.FRANCHISE_ID
  // (blank/0000 on commish pages = an unattributed view). Never sends the auth
  // cookie. Fully wrapped so a failure here can never affect the page.
  (function () {
    var WORKER = "https://upsmflproduction.keith-creelman.workers.dev";
    function ping() {
      try {
        if (window.__UPS_VIEW_PINGED) return;
        window.__UPS_VIEW_PINGED = true;
        var fid = String(window.FRANCHISE_ID || window.franchise_id || "").replace(/\D/g, "");
        var lg = String(window.LEAGUE_ID || window.league_id || "").replace(/\D/g, "") || "74598";
        var surface = window.UPS_BAREBONES ? "lite-mode" : "mfl-custom";
        var body = JSON.stringify({ franchise_id: fid, league_id: lg, surface: surface, path: location.pathname });
        var url = WORKER + "/api/app-view";
        if (navigator.sendBeacon) {
          navigator.sendBeacon(url, new Blob([body], { type: "text/plain" }));
        } else {
          fetch(url, { method: "POST", body: body, credentials: "omit", keepalive: true }).catch(function () {});
        }
      } catch (e) {}
    }
    // Defer to load so MFL's inline FRANCHISE_ID/LEAGUE_ID globals are populated.
    if (document.readyState === "complete") setTimeout(ping, 0);
    else window.addEventListener("load", ping);
  })();
</script>

<script>
  // Legacy global safety guards (custom tabs removed; keep no-op shims to avoid hard crashes).
  (function () {
    function noop() {}
    var fakeTabsShim = {
      onReady: function (cb) {
        if (typeof cb === "function") {
          try { cb(); } catch (e) {}
        }
      },
      init: noop,
      mount: noop,
      destroy: noop
    };
    if (!window.MFL_customTabs_FakeTabs || typeof window.MFL_customTabs_FakeTabs !== "object") {
      window.MFL_customTabs_FakeTabs = fakeTabsShim;
    }
    if (!window.MFL_customTabs || typeof window.MFL_customTabs !== "object") {
      window.MFL_customTabs = window.MFL_customTabs_FakeTabs;
    }
    if (!window.customTabs || typeof window.customTabs !== "object") {
      window.customTabs = window.MFL_customTabs_FakeTabs;
    }
    if (!window.FakeTabs || typeof window.FakeTabs !== "object") {
      window.FakeTabs = window.MFL_customTabs_FakeTabs;
    }
    if (!window.MFLGlobalCache || typeof window.MFLGlobalCache !== "object") {
      window.MFLGlobalCache = {
        onReady: function (cb) {

            try { cb(); } catch (e) {}
          }
        },
        get: function () { return null; },
        set: noop,
        remove: noop
      };
    } else if (typeof window.MFLGlobalCache.onReady !== "function") {
      window.MFLGlobalCache.onReady = function (cb) {
        if (typeof cb === "function") {
          try { cb(); } catch (e) {}
        }
      };
    }
    if (!Array.isArray(window.reportNflByeWeeks_ar)) window.reportNflByeWeeks_ar = [];
    if (!Array.isArray(window.reportNflByeWeeksArray)) window.reportNflByeWeeksArray = window.reportNflByeWeeks_ar;
  })();

  // Hard redirect guard: never allow CCC message routes to stay on leaked dev league.
  (function () {
    try {
      var prodLeague = String(window.UPS_CCC_PROD_LEAGUE_ID == null ? "" : window.UPS_CCC_PROD_LEAGUE_ID).replace(/\D/g, "");
      var devLeague = String(window.UPS_DEV_LEAGUE_ID == null ? "" : window.UPS_DEV_LEAGUE_ID).replace(/\D/g, "");
      if (!prodLeague || !devLeague || prodLeague === devLeague) return;

      var u = new URL(window.location.href || "");
      var moduleName = String(u.searchParams.get("MODULE") || "").toUpperCase();
      if (moduleName !== "MESSAGE2") return;
      if (String(u.searchParams.get("UPS_ALLOW_DEV_CCC") || "") === "1") return;

      var m = String(u.pathname || "").match(/\/home\/(\d+)(?:\/|$)/i);
      var pathLeague = m && m[1] ? String(m[1]) : "";
      if (pathLeague !== devLeague) return;

      u.pathname = String(u.pathname || "").replace(/\/home\/\d+(?:\/|$)/i, "/home/" + prodLeague);
      window.location.replace(u.toString());
    } catch (e) {}
  })();

  // Normalize Contract Command Center deep-links: move ccc* params to hash so MFL doesn't validate them.
  (function () {
    var u = new URL(window.location.href || "");
    var hasCcc =
      u.searchParams.has("cccAction") ||
      u.searchParams.has("cccPlayer") ||
      u.searchParams.has("cccFranchise") ||
      u.searchParams.has("cccSeason") ||
      u.searchParams.has("cccYears");
    if (!hasCcc) return;
    var moduleName = (u.searchParams.get("MODULE") || "").toUpperCase();
    if (moduleName !== "MESSAGE2") return;

    var h = new URLSearchParams();
    ["cccAction", "cccPlayer", "cccFranchise", "cccSeason", "cccYears"].forEach(function (k) {
      var v = u.searchParams.get(k);
      if (v !== null && v !== undefined && v !== "") h.set(k, v);
    });

    u.search = "?MODULE=MESSAGE2";
    u.hash = h.toString();

    if (u.toString() !== window.location.href) {
      window.location.replace(u.toString());
    }
  })();

  // Option 05 trade-intent shim: send counter/trade-action flows to Trade War Room (MESSAGE6).
  (function () {
    function s(v) {
      return v == null ? "" : String(v).trim();
    }
    function isOptionParam(v, n) {
      var x = s(v).replace(/^0+/, "");
      return x === String(n);
    }
    function validOfferKey(v) {
      var digits = s(v).replace(/\D/g, "");
      if (!digits || digits === "0") return "";
      return digits;
    }
    function readLeagueId(u) {
      var q = s(u.searchParams.get("L"));
      if (q) return q.replace(/\D/g, "");
      var pathMatch = s(u.pathname).match(/\/home\/(\d+)(?:\/|$)/i);
      if (pathMatch && pathMatch[1]) return s(pathMatch[1]).replace(/\D/g, "");
      var g = s(window.league_id || window.LEAGUE_ID || "").replace(/\D/g, "");
      if (g) return g;
      try {
        var raw = s(document.cookie || "");
        if (raw) {
          var parts = raw.split(";");
          for (var i = 0; i < parts.length; i += 1) {
            var p = s(parts[i]);
            if (!p) continue;
            var eq = p.indexOf("=");
            var key = eq >= 0 ? s(p.slice(0, eq)) : p;
            var val = eq >= 0 ? s(p.slice(eq + 1)) : "";
            if (key === "MFL_LAST_LEAGUE_ID" && val) {
              var fromCookie = decodeURIComponent(val).replace(/\D/g, "");
              if (fromCookie) return fromCookie;
            }
          }
        }
      } catch (e) {}
      var fallback = s(window.UPS_CCC_PROD_LEAGUE_ID == null ? "" : window.UPS_CCC_PROD_LEAGUE_ID).replace(/\D/g, "");
      return fallback;
    }
    function readYear(u) {
      var q = s(u.searchParams.get("YEAR"));
      if (q) return q.replace(/\D/g, "");
      var m = s(u.pathname).match(/\/(\d{4})\//);
      if (m && m[1]) return s(m[1]);
      var g = s(window.year || window.YEAR || "").replace(/\D/g, "");
      if (g) return g;
      return String(new Date().getFullYear());
    }
    function getWarRoomUrl() {
      var u = null;
      try {
        u = new URL(window.location.href || "");
      } catch (e) {
        return window.location.href;
      }
      var league = readLeagueId(u);
      if (!league) return window.location.href;
      var year = readYear(u) || String(new Date().getFullYear());
      return (
        window.location.origin +
        "/" +
        encodeURIComponent(year) +
        "/home/" +
        encodeURIComponent(league) +
        "?MODULE=MESSAGE6=N"
      );
    }
    window.getWarRoomUrl = getWarRoomUrl;
    function extractOfferKeyFromUrl(u) {
      var keys = [
        "TRADEID", "tradeid", "TRADE_ID", "trade_id",
        "TID", "tid", "OFFERID", "offerid", "UID", "uid"
      ];
      var i;
      for (i = 0; i < keys.length; i += 1) {
        var v = s(u.searchParams.get(keys[i]));
        if (v) return validOfferKey(v);
      }
      return "";
    }
    function extractOfferKeyFromDom() {
      try {
        var els = document.querySelectorAll(
          'input[type="hidden"],input[name*="trade" i],input[name*="offer" i],a[href*="trade" i],a[href*="offer" i]'
        );
        var i;
        for (i = 0; i < els.length; i += 1) {
          var node = els[i];
          var raw =
            s(node.value) + " " +
            s(node.getAttribute("name")) + " " +
            s(node.getAttribute("id")) + " " +
            s(node.getAttribute("href"));
          var m = raw.match(/(?:tradeid|TRADEID|trade_id|offerid|OFFERID|tid|TID)[^0-9]*([0-9]+)/);
          if (m && m[1]) return validOfferKey(m[1]);
        }
        var html = s(document.documentElement && document.documentElement.innerHTML).slice(0, 500000);
        var m2 = html.match(/(?:tradeid|TRADEID|trade_id|offerid|OFFERID|tid|TID)[^0-9]{0,12}([0-9]+)/);
        return m2 && m2[1] ? validOfferKey(m2[1]) : "";
      } catch (e) {
        return "";
      }
    }
    function isWarRoomRoute(u, href, bodyId) {
      var mod = s(u.searchParams.get("MODULE")).toUpperCase();
      if (mod.indexOf("MESSAGE6") === 0) return true;
      if (/[?&]MODULE=MESSAGE6(?:=N)?(?:&|$)/i.test(href)) return true;
      if (bodyId === "body_options_06") return true;
      return false;
    }
    function hasTradeIntent(u, offerKeyFromUrl, offerKeyFromDom) {
      if (validOfferKey(u.searchParams.get("twb_load_offer"))) return true;
      if (s(u.searchParams.get("twb_mode")).toLowerCase() === "counter") return true;
      if (offerKeyFromUrl || offerKeyFromDom) return true;
      if (document.querySelector('form[action*="trade_offer" i] input[name*="TRADE_ID" i], form[action*="trade_offer" i] input[name*="tradeid" i], input[name="TRADE_ID"], input[name="trade_id"]')) {
        return true;
      }
      return false;
    }
    function runShim() {
      try {
        var u = new URL(window.location.href || "");
        var href = s(window.location.href).toLowerCase();
        var bodyId = s(document.body && document.body.id).toLowerCase();
        var optionVal =
          s(u.searchParams.get("O")) ||
          s(u.searchParams.get("o")) ||
          s(u.searchParams.get("OPTION")) ||
          s(u.searchParams.get("option"));

        if (isWarRoomRoute(u, href, bodyId)) {
          try {
            sessionStorage.removeItem("twb_counter_offer_id");
            sessionStorage.removeItem("twb_redirect_from_o5");
            sessionStorage.removeItem("twb_redirected_from_o5");
            sessionStorage.removeItem("twb_mode");
            sessionStorage.removeItem("twb_o5_redirect_guard");
          } catch (e) {}
          return;
        }

        var option5ByDom = bodyId === "body_options_05";
        var isOption5 =
          isOptionParam(optionVal, 5) ||
          /[?&](?:o|option)=0?5(?:&|$)/i.test(href) ||
          option5ByDom;
        if (!isOption5) return;
        if (s(u.searchParams.get("twb_allow_o05")) === "1") return;

        var offerKeyFromUrl = extractOfferKeyFromUrl(u);
        var offerKeyFromDom = extractOfferKeyFromDom();
        if (!hasTradeIntent(u, offerKeyFromUrl, offerKeyFromDom)) return;
        var offerKey = offerKeyFromUrl || offerKeyFromDom;

        var target = new URL(getWarRoomUrl(), window.location.href);
        if (offerKey) {
          target.searchParams.set("twb_load_offer", offerKey);
          target.searchParams.set("twb_mode", "counter");
        }

        var guardKey = "twb_o5_redirect_guard";
        var guardVal = "";
        try { guardVal = s(sessionStorage.getItem(guardKey)); } catch (e) {}
        var guardToken = offerKey || "NO_OFFER_KEY";
        if (guardVal === guardToken) {
          if (!offerKey) showFallbackBanner(target.toString());
          return;
        }
        try {
          sessionStorage.setItem(guardKey, guardToken);
          if (offerKey) sessionStorage.setItem("twb_counter_offer_id", offerKey);
          sessionStorage.setItem("twb_redirect_from_o5", offerKey || "");
          sessionStorage.setItem("twb_redirected_from_o5", offerKey || "");
          if (offerKey) sessionStorage.setItem("twb_mode", "counter");
        } catch (e) {}
        window.location.replace(target.toString());
      } catch (e) {}
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runShim, { once: true });
    } else {
      runShim();
    }
  })();

  // Debug helper: add `&UPS_DEBUG=1` to any URL to confirm which header build is loaded.
  (function () {
    try {
      var u = new URL(window.location.href);
      if (u.searchParams.get("UPS_DEBUG") !== "1") return;
    } catch (e) {
      return;
    }
    window.__UPS_DEBUG = true;
    document.addEventListener("DOMContentLoaded", function () {
      try {
        var el = document.createElement("div");
        el.id = "upsDebugBadge";
        el.textContent = "UPS header build: 2026.03.09.1";
        el.style.cssText =
          "position:fixed;right:10px;bottom:10px;z-index:999999;" +
          "padding:6px 10px;border-radius:999px;" +
          "background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.25);" +
          "color:#fff;font:700 12px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;";
        document.body.appendChild(el);
      } catch (e) {}
    });
  })();
</script>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  document.title = "UPS Salary Cap Dynasty League";

  /* Font size + theme persistence */
  window.increaseFont = true;
  (function () {
    try {
      var key = "fontSize_" + year + "_" + league_id;
      if (localStorage.hasOwnProperty(key)) {
        var setStyle = localStorage.getItem(key);
        if (setStyle && setStyle !== "undefined") {
          document.documentElement.setAttribute("style", setStyle);
        }
      }
    } catch (e) {}
  })();

  function setTheme(year, league_id, themeName) {
    if (typeof themeName !== "string") return;
    localStorage.setItem("theme_" + year + "_" + league_id, themeName);
    document.documentElement.className = themeName;
    try {
      var inferredMode = String(themeName || "").toLowerCase().indexOf("light") !== -1 ? "light" : "dark";
      if (typeof applyUPSMode === "function") {
        applyUPSMode(inferredMode, true);
      } else {
        document.documentElement.setAttribute("data-ups-mode", inferredMode);
      }
    } catch (e) {}
  }

  function upsThemeStorageKey() {
    var y = typeof year !== "undefined" ? year : "";
    var l = typeof league_id !== "undefined" ? league_id : "";
    return "ups_mode_" + y + "_" + l;
  }

  function normalizeUPSMode(mode) {
    return String(mode || "").toLowerCase() === "light" ? "light" : "dark";
  }

  function getUPSMode() {
    return normalizeUPSMode(document.documentElement.getAttribute("data-ups-mode") || "dark");
  }

  function applyUPSMode(mode, persist) {
    var nextMode = normalizeUPSMode(mode);
    document.documentElement.setAttribute("data-ups-mode", nextMode);
    document.documentElement.style.colorScheme = nextMode;
    window.UPS_THEME_MODE = nextMode;
    if (persist) {
      try {
        localStorage.setItem(upsThemeStorageKey(), nextMode);
      } catch (e) {}
    }
    try {
      document.dispatchEvent(new CustomEvent("ups-theme-change", { detail: { mode: nextMode } }));
    } catch (e) {}
  }

  window.setUPSMode = function (mode) {
    applyUPSMode(mode, true);
  };

  window.toggleUPSMode = function () {
    applyUPSMode(getUPSMode() === "dark" ? "light" : "dark", true);
  };

  (function () {
    var key = "theme_" + year + "_" + league_id;
    var storedTheme = localStorage.getItem(key) || "";
    if (storedTheme) {
      document.documentElement.className = storedTheme;
    } else {
      document.documentElement.removeAttribute("class");
    }

    var upsMode = "";
    try {
      upsMode = localStorage.getItem(upsThemeStorageKey()) || "";
    } catch (e) {}
    if (!upsMode && storedTheme.toLowerCase().indexOf("light") !== -1) {
      upsMode = "light";
    }
    applyUPSMode(upsMode || "dark", false);

    if (window.MutationObserver) {
      var htmlEl = document.documentElement;
      var lastClass = htmlEl.className || "";
      var htmlClassObs = new MutationObserver(function () {
        var nextClass = htmlEl.className || "";
        if (nextClass === lastClass) return;
        lastClass = nextClass;
        var inferred = nextClass.toLowerCase().indexOf("light") !== -1 ? "light" : "dark";
        if (inferred !== getUPSMode()) {
          applyUPSMode(inferred, false);
        }
      });
      htmlClassObs.observe(htmlEl, { attributes: true, attributeFilter: ["class"] });
    }
  })();
  } // UPS_BB_GATE_END
</script>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  (function () {
    function updateThemeToggleUi() {
      var mode = typeof window.getUPSMode === "function" ? window.getUPSMode() : "dark";
      var btn = document.getElementById("upsThemeToggle");
      if (!btn) return;
      var label = btn.querySelector(".ups-theme-toggle-label");
      if (label) label.textContent = mode === "dark" ? "Theme: Dark" : "Theme: Light";
      btn.setAttribute("aria-pressed", mode === "light" ? "true" : "false");
      btn.setAttribute("title", mode === "dark" ? "Switch to light mode" : "Switch to dark mode");
    }

    function initThemeToggle() {
      var btn = document.getElementById("upsThemeToggle");
      if (btn && !btn.dataset.wired) {
        btn.dataset.wired = "1";
        btn.addEventListener("click", function () {
          if (typeof window.toggleUPSMode === "function") {
            window.toggleUPSMode();
            return;
          }
          if (typeof window.getUPSMode === "function" && typeof window.setUPSMode === "function") {
            var next = window.getUPSMode() === "dark" ? "light" : "dark";
            window.setUPSMode(next);
          }
        });
      }
      updateThemeToggleUi();
    }

    function initOwnerActionsMenu() {
      var wrap = document.getElementById("upsOwnerActionsWrap");
      var btn = document.getElementById("upsOwnerActionsToggle");
      var menu = document.getElementById("upsOwnerActionsMenu");
      if (!wrap || !btn || !menu || btn.dataset.wired) return;
      btn.dataset.wired = "1";

      function setOpen(next) {
        var open = !!next;
        wrap.classList.toggle("is-open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) menu.removeAttribute("hidden");
        else menu.setAttribute("hidden", "");
      }

      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        setOpen(!wrap.classList.contains("is-open"));
      });

      menu.addEventListener("click", function () {
        setOpen(false);
      });

      document.addEventListener("click", function (e) {
        if (!wrap.contains(e.target)) setOpen(false);
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });

      window.addEventListener("resize", function () {
        if (window.innerWidth > 900) setOpen(false);
      });
    }

    document.addEventListener("ups-theme-change", function () {
      updateThemeToggleUi();
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        initThemeToggle();
        initOwnerActionsMenu();
      });
    } else {
      initThemeToggle();
      initOwnerActionsMenu();
    }
  })();
  } // UPS_BB_GATE_END
</script>

      if (!Array.isArray(rows)) return [];
      return rows

                : item && item.title_number !== undefined
                ? item.title_number

        .filter(function (item) {
          return item.year > 0 && item.franchise;

      return rows
        .map(function (item) {
          var iconRaw = String(item && item.icon || "");

      for (var j = 0; j < titleLeaders.length; j += 1) {
        leadersEl.appendChild(buildLeaderRow(titleLeaders[j]));
      }

      if (!raw || typeof raw !== "object") return null;
      var recent = normalizeRecentRows(raw.recent_winners || raw.recentWinners || []);
      var leaders = normalizeLeaderRows(raw.title_leaders || raw.titleLeaders || []);
      if (!recent.length || !leaders.length) return null;
      return { recent: recent, leaders: leaders };

          .then(function (res) {

          .then(function (json) {

    function recenterUpsShellNode(node) {
      if (!node || !node.getBoundingClientRect) return;
      try {
        // Reset before measuring so we don't compound previous offsets.
        node.style.removeProperty("transform");
      } catch (e) {}
      var rect = null;
      try {
        rect = node.getBoundingClientRect();
      } catch (e) {
        rect = null;
      }
      if (!rect || !Number.isFinite(rect.left) || !Number.isFinite(rect.right) || rect.width <= 0) return;
      var vw = 0;
      try {
        vw = Math.max(
          (document.documentElement && document.documentElement.clientWidth) || 0,
          window.innerWidth || 0
        );
      } catch (e) {
        vw = window.innerWidth || 0;
      }
      if (!vw) return;
      var leftGap = rect.left;
      var rightGap = vw - rect.right;
      var shift = (rightGap - leftGap) / 2;
      if (!Number.isFinite(shift)) return;
      if (Math.abs(shift) < 0.5) {

      node.style.setProperty("transform", "translateX(" + shift.toFixed(2) + "px)");

    window.__ups_fo_embed_autoload = FO_HEADER_BUILD;

    function safeStr(v) {

    function getCurrentLeagueId() {

  (function () {

    function safeUpper(v) { return String(v == null ? "" : v).trim().toUpperCase(); }

    function isTeamOpsContext() {

      try {

  // Hub, etc.) — each carrying a SHA-pinned loader stub that had to be
  // updated on every release. Routing through ONE container with the
  // header doing the dispatching means:
  //   1. MFL MESSAGE19 body stays empty forever (single comment line).
  //   2. Adding a new hub = add 1 line to the HUBS registry below.
  //   3. SHA bumps only touch the header, never any MESSAGE body.
  //
  // MESSAGE19 is used because MESSAGE20 is the league footer; MFL caps
  // custom messages at 20. Anything earlier (MESSAGE2 = old CCC link,
  // MESSAGE4 = Standings, etc.) is already in use.
  (function () {
    var BUILD = "2026-05-19.1";
    if (window.__ups_hub_container_autoload === BUILD) return;
    window.__ups_hub_container_autoload = BUILD;

    // Registry — add new hubs here. Each entry needs the mount id the
    // hub's embed loader looks for + the path (relative to repo root)
    // of the loader script.
    //
    // The path is resolved against jsDelivr at window.UPS_RELEASE_SHA so
    // the loader always matches the SHA the header itself was loaded
    // from. This keeps feature-branch testing working without requiring
    // a main merge or GitHub Pages publish — jsDelivr serves any commit
    // SHA on demand. (GitHub Pages only serves main, so loaders that
    // hardcode pages URLs 404 from feature branches.)
    var HUBS = {
      "auction-hub": {
        mountId: "auctionHubMount",
        loaderPath: "/site/auction/mfl_hpm_embed_loader.js"
      },
      "commish-settings": {
        mountId: "commishSettingsMount",
        loaderPath: "/site/commish/mfl_hpm_embed_loader.js"
      },
      "gameday": {
        mountId: "gameDayMount",
        loaderPath: "/site/gameday/mfl_hpm_embed_loader.js"
      }
      // Future:
      //   "front-office-v2": { mountId: "..." , loaderPath: "/site/rosters/v2/mfl_hpm_embed_loader.js" },
      //   "trade-war-room":  { mountId: "..." , loaderPath: "/site/trades/mfl_hpm_embed_loader.js" },
    };

    function resolveLoaderUrl(path) {
      var sha = String(window.UPS_RELEASE_SHA || "main").trim() || "main";
      return "https://cdn.jsdelivr.net/gh/keithcreelman/upsmflproduction@" +
        encodeURIComponent(sha) + path + "?v=" + encodeURIComponent(sha);
    }

    // The MFL MESSAGE slot reserved as the hub container. Change here +
    // in TABS (look for "MESSAGE19&hub=") if it ever has to move.
    var CONTAINER_MODULE = "MESSAGE19";

    function safeUpper(v) { return String(v == null ? "" : v).trim().toUpperCase(); }
    function safeLower(v) { return String(v == null ? "" : v).trim().toLowerCase(); }

    function readContext() {
      try {
        var u = new URL(window.location.href);
        return {
          module: safeUpper(u.searchParams.get("MODULE") || ""),
          hub: safeLower(u.searchParams.get("hub") || "")
        };
      } catch (e) { return { module: "", hub: "" }; }
    }

    function ensureMount(mountId) {
      var existing = document.getElementById(mountId);
      if (existing) return existing;
      var mount = document.createElement("div");
      mount.id = mountId;
      var anchor =
        document.querySelector(".ups-hotlinks-shell") ||
        document.getElementById("container-wrap") ||
        document.body;
      if (anchor && anchor.parentNode && anchor !== document.body) {
        anchor.parentNode.insertBefore(mount, anchor.nextSibling);
      } else {
        document.body.appendChild(mount);
      }
      return mount;
    }

    function showError(msg) {
      var mount = ensureMount("upsHubContainerError");
      mount.style.cssText = "padding:24px;margin:16px;color:#f88;background:#141a26;border:1px solid #2a3446;border-radius:8px;font-family:-apple-system,sans-serif;";
      mount.innerHTML = "<strong>UPS Hub Container</strong><br>" + msg;
    }

    function injectLoader(loaderPath) {
      var loaderUrl = resolveLoaderUrl(loaderPath);
      // Guard: don't double-inject if the user clicks between hubs
      // without a full page reload (browsers may keep the iframe alive).
      if (document.querySelector('script[data-ups-hub-loader="' + loaderPath + '"]')) return;
      var s = document.createElement("script");
      s.setAttribute("data-ups-hub-loader", loaderPath);
      s.src = loaderUrl;
      s.async = true;
      (document.body || document.documentElement).appendChild(s);
    }

    function bootIfApplicable() {
      var ctx = readContext();
      if (!/^MESSAGE19\b/.test(ctx.module)) return;
      if (!ctx.hub) {
        return showError("Missing <code>?hub=</code> parameter. Registered hubs: <code>" + Object.keys(HUBS).join("</code>, <code>") + "</code>.");
      }
      var entry = HUBS[ctx.hub];
      if (!entry) {
        return showError("Unknown hub: <code>" + ctx.hub.replace(/[<>&"]/g, "") + "</code>. Registered hubs: <code>" + Object.keys(HUBS).join("</code>, <code>") + "</code>.");
      }
      ensureMount(entry.mountId);
      injectLoader(entry.loaderPath);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootIfApplicable);
    } else {
      bootIfApplicable();
    }
  })();
  } // UPS_BB_GATE_END
</script>

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  // Team Ops persistent sub-nav.

  // Renders a 5-link strip (Overview / Front Office / Player Stats /
  // Trade War Room / Standings) on every "owner module" MFL page so
  // owners can jump between them without backing out to the home
  // page first. Active page is highlighted yellow.
  //
  // Scope: every league page that resolves a league id — the MESSAGE4/6/7/11/13

  // lineup, all_reports, standings, …) so "My Hub" is reachable from anywhere
  // (Keith 2026-06-17). Only bails when no league id is resolvable.
  (function () {
    var BUILD = "2026.05.15.1";
    if (window.__ups_teamops_subnav === BUILD) return;
    window.__ups_teamops_subnav = BUILD;

    function safeStr(v) { return v == null ? "" : String(v).trim(); }
    function safeUpper(v) { return safeStr(v).toUpperCase(); }

    function currentContext() {
      try {
        var u = new URL(window.location.href);
        var path = safeStr(u.pathname);
        var leagueId = "";
        var year = "";

        if (!leagueId) leagueId = safeStr(u.searchParams.get("L"));
        // Native pages (/2026/add_drop?L=…) carry the year in the path but not via
        // /home/; fall back to ?YEAR, then any /20xx/ path segment, then current.
        if (!year) year = safeStr(u.searchParams.get("YEAR"));
        if (!year) { var ym = path.match(/\/(20\d\d)\//); if (ym) year = ym[1]; }
        if (!year) year = String(new Date().getFullYear());
        var mod = safeUpper(u.searchParams.get("MODULE") || "");
        return { host: u.host, leagueId: leagueId, year: year, module: mod, isHomePath: /\/home\/\d+/.test(path) };
      } catch (e) { return { host: "", leagueId: "", year: "", module: "", isHomePath: false }; }
    }

    // jump back to My Hub from anywhere, not just the hub pages (Keith 2026-06-17).
    if (!ctx.leagueId) return;

    // Active-page detection. Bare home (no MODULE) → Overview.
    // MESSAGE6 may carry "=N" suffix; treat anything starting MESSAGE6

    // Overview only when on the bare home page (or MESSAGE11). On a native page
    // (no MODULE, not /home/) nothing is the active hub, so highlight nothing.
    if ((!ctx.module && ctx.isHomePath) || ctx.module === "MESSAGE11") activeId = "home";
    else if (/^MESSAGE7\b/.test(ctx.module)) activeId = "front-office";
    else if (/^MESSAGE13\b/.test(ctx.module)) activeId = "player-stats";
    else if (/^MESSAGE6\b/.test(ctx.module)) activeId = "trade-room";
    else if (/^MESSAGE4\b/.test(ctx.module)) activeId = "standings";
    else if (/^MESSAGE12\b/.test(ctx.module)) activeId = "rookie-hub";
    // Generic hub container — currently only auction-hub. When more hubs
    // route through MESSAGE19, switch on the `hub` query param value.
    // (MESSAGE20 is reserved for the footer.)
    else if (/^MESSAGE19\b/.test(ctx.module)) {
      try {
        var qhub = new URL(window.location.href).searchParams.get("hub") || "";

      { id: "auction-hub",  label: "Auction Hub",    module: "MESSAGE19&hub=auction-hub" },

      // Commish-only command center (moved here from the Legacy Links "Commish"

      { id: "commish-settings", label: "Commish Settings", module: "MESSAGE19&hub=commish-settings", commishOnly: true },

        { label: "Add/Drop",       href: buildMflPath("/add_drop") },

        { label: "Trade Block",    href: buildMflPath("/options?O=133") }
      ]},
      // "MFL Legacy Links" — native MFL pages, a BACKUP for when one of our

      // headers (Owner Actions / League / Account / Commish). URLs built

      { id: "legacy", label: "MFL Legacy Links",
        note: "Native MFL pages — a backup if one of the custom pages isn't loading.",
        groups: [
          { group: "Owner Actions", items: [
            { label: "Submit Lineup",      href: buildMflPath("/lineup") },

          { group: "League", items: [
            { label: "All Reports",        href: buildMflPath("/all_reports") },
            { label: "Transactions",       href: buildMflPath("/options?O=03") },
            { label: "Processed Waivers",  href: buildMflPath("/options?O=76") },
            { label: "Starting Lineups",   href: buildMflPath("/options?O=06") },
            { label: "Live Scoring",       href: buildMflPath("/ajax_ls") },
            { label: "Weekly Summary",     href: buildMflPath("/options?O=31") },
            { label: "Standings",          href: buildMflPath("/standings") }

          { group: "Account", items: [

          // Commish links moved to the "Commish Settings" hub (commishOnly nav tab).

    function closeAllMenus(except) {

      for (var i = 0; i < open.length; i += 1) {

          menu.appendChild(buildMenuLink(c));

      // Commish/owner identity toggle — a REAL MFL session switch via BECOME

      // (0008); owner team (0008) → Become Commissioner (0000). Shown only for

      if (upsCanToggleIdentity()) {

        var tog = document.createElement("a");
        tog.className = "ups-teamops-subnav-link ups-commish-toggle";
        tog.href = buildMflPath(asCommish ? "/logout?BECOME=0008" : "/logout?BECOME=0000");
        tog.textContent = asCommish ? "\uD83D\uDC64 Become Owner" : "\uD83D\uDEE0 Become Commish";

      if (typeof window.UPS_BAREBONES_SET === "function") {
        var lite = document.createElement("a");
        lite.className = "ups-teamops-subnav-link ups-lite-toggle";
        lite.href = "#";

        lite.addEventListener("click", function (ev) {

      }

  function scoreTable(table) {
    if (!table) return -1;

    var inputs = table.querySelectorAll("input, select, textarea").length;
    var labels = table.querySelectorAll("label").length;

  function bestInteractiveTable(root) {
    if (!root) return null;
    var tables = Array.prototype.slice.call(root.querySelectorAll("table"));
    if (!tables.length) return null;
    var best = null;
    var bestScore = -1;
    tables.forEach(function (t) {
      var s = scoreTable(t);
      if (s > bestScore) {
        bestScore = s;
        best = t;
      }
    });
    if (!(bestScore > 0 && best)) return null;
    var checkboxCount = best.querySelectorAll('input[type="checkbox"]').length;
    var inputCount = best.querySelectorAll("input, select, textarea").length;

  }

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  /*
   * Deep-link + roster/popup quick actions for Extension/Restructure.
   * This adds actionable buttons in O=07 rows and player popup cards.
   */
  (function () {
    var enableRosterContractActions = false;

    function safeStr(v) {
      return v === null || v === undefined ? "" : String(v).trim();
    }

    function pad4(fid) {
      var d = safeStr(fid).replace(/\D/g, "");
      return d ? d.padStart(4, "0").slice(-4) : "";
    }

    function parsePidFromHref(href) {
      try {
        var u = new URL(href, location.origin);
        return safeStr(u.searchParams.get("P"));
      } catch (e) {
        return "";
      }
    }

    function parseMoney(text) {
      var clean = safeStr(text).replace(/[^0-9.-]/g, "");
      var n = parseFloat(clean);
      return isNaN(n) ? 0 : n;
    }

    function getFidFromRow(row) {
      var table = row ? row.closest("table") : null;
      if (!table) return "";

      var cls = safeStr(table.className);
      var m = cls.match(/franchise_(\d{4})/);
      if (m) return pad4(m[1]);

      var capLink = table.querySelector("caption a[class*='franchise_']");
      if (capLink) {
        var capClass = safeStr(capLink.className);
        var m2 = capClass.match(/franchise_(\d{4})/);
        if (m2) return pad4(m2[1]);
      }
      return "";
    }

    function getActiveLeagueId() {
      var devLeague = String(window.UPS_DEV_LEAGUE_ID == null ? "" : window.UPS_DEV_LEAGUE_ID).replace(/\D/g, "");
      var prodLeague = String(window.UPS_CCC_PROD_LEAGUE_ID == null ? "" : window.UPS_CCC_PROD_LEAGUE_ID).replace(/\D/g, "");
      var pathLeague = "";
      var globalLeague = typeof league_id !== "undefined" && league_id ? safeStr(league_id) : "";
      var m = safeStr(window.location.pathname).match(/\/home\/(\d+)(?:\/|$)/i);
      if (m && m[1]) pathLeague = safeStr(m[1]);
      try {
        var u = new URL(window.location.href);
        var q = safeStr(u.searchParams.get("L"));
        if (q) return q;
      } catch (e) {}
      if (pathLeague) return pathLeague;
      if (globalLeague) return globalLeague;
      if (devLeague) return devLeague;
      return prodLeague || "";
    }

    function getActiveYear() {
      try {
        var u = new URL(window.location.href);
        var q = safeStr(u.searchParams.get("YEAR"));
        if (q) return q;
      } catch (e) {}
      var m = safeStr(window.location.pathname).match(/\/(\d{4})\//);
      if (m && m[1]) return safeStr(m[1]);
      if (typeof year !== "undefined" && year) return safeStr(year);
      return String(new Date().getFullYear());
    }

    function pendingActionKey() {
      return "ccc_pending_action_" + safeStr(getActiveYear()) + "_" + safeStr(getActiveLeagueId());
    }

    function savePendingAction(action, item) {
      try {
        var payload = {
          action: safeStr(action).toLowerCase(),
          playerId: safeStr(item && item.playerId),
          franchiseId: pad4(item && item.franchiseId),
          years: Math.max(1, Math.min(2, parseInt(item && item.years, 10) || 1)),
          ts: Date.now()
        };
        if (!payload.action || !payload.playerId) return;
        localStorage.setItem(pendingActionKey(), JSON.stringify(payload));
      } catch (e) {}
    }

    function getPendingAction() {
      try {
        var raw = localStorage.getItem(pendingActionKey());
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || !parsed.action || !parsed.playerId) return null;

        var ageMs = Date.now() - (parseInt(parsed.ts, 10) || 0);
        if (ageMs > 30 * 60 * 1000) {
          localStorage.removeItem(pendingActionKey());
          return null;
        }

        return {
          action: safeStr(parsed.action).toLowerCase(),
          playerId: safeStr(parsed.playerId),
          franchiseId: pad4(parsed.franchiseId),
          years: Math.max(1, Math.min(2, parseInt(parsed.years, 10) || 1))
        };
      } catch (e) {
        return null;
      }
    }

    function clearPendingAction() {
      try {
        localStorage.removeItem(pendingActionKey());
      } catch (e) {}
    }

    function buildActionUrl(action, item) {
      var activeYear = getActiveYear();
      var activeLeague = getActiveLeagueId();
      var payload = {
        cccAction: safeStr(action).toLowerCase(),
        cccPlayer: safeStr(item && item.playerId),
        cccFranchise: pad4(item && item.franchiseId),
        cccSeason: safeStr(activeYear),
        cccYears: Math.max(1, Math.min(2, parseInt(item && item.years, 10) || 1))
      };

      savePendingAction(action, item);

      var u = new URL(location.origin + "/" + activeYear + "/home/" + activeLeague);
      u.searchParams.set("MODULE", "MESSAGE2");

      var h = new URLSearchParams();
      if (payload.cccAction) h.set("cccAction", payload.cccAction);
      if (payload.cccPlayer) h.set("cccPlayer", payload.cccPlayer);
      if (payload.cccFranchise) h.set("cccFranchise", payload.cccFranchise);
      if (payload.cccSeason) h.set("cccSeason", payload.cccSeason);
      if (payload.cccAction === "extension") h.set("cccYears", safeStr(payload.cccYears));
      u.hash = h.toString();

      return u.toString();
    }

    function rookieLike(value) {
      var s = safeStr(value).toLowerCase();
      return s === "r" || s.indexOf("r-") === 0 || s.indexOf("rookie") !== -1;
    }

    function computeEligibility(contract) {
      var years = parseInt(contract.years, 10) || 0;
      var salary = parseMoney(contract.salary);
      var statusLower = safeStr(contract.status).toLowerCase();
      var infoLower = safeStr(contract.info).toLowerCase();
      var noFurtherExt =
        infoLower.indexOf("no further extensions") !== -1 ||
        infoLower.indexOf("not eligible for tag or extension") !== -1;
      var expiredRookie =
        infoLower.indexOf("expired rookie") !== -1 ||
        (rookieLike(contract.status) && years <= 0);

      return {
        extensionEligible: (years === 1 || expiredRookie) && !statusLower.includes("tag") && !noFurtherExt,
        restructureEligible: years >= 2 && years <= 3 && salary > 1000 && !rookieLike(contract.status)
      };
    }

    var rosterEligibilityByPid = new Map();

    function scanRosterEligibility() {
      if (document.body.id !== "body_options_07") return;

      var rows = Array.from(document.querySelectorAll("#body_options_07 tr"));
      rows.forEach(function (row) {
        var cell = row.querySelector("td.player");
        if (!cell) return;

        var playerLink = cell.querySelector('a[href*="player?L="]');
        if (!playerLink) return;

        var pid = parsePidFromHref(playerLink.getAttribute("href") || "");
        if (!pid) return;

        var salaryCell = row.querySelector("td.salary");
        var yearsCell = row.querySelector("td.contractyear");
        var statusCell = row.querySelector("td.contractstatus");
        var infoCell = row.querySelector("td.contractinfo");

        if (!salaryCell || !yearsCell || !statusCell || !infoCell) return;

        var fid = getFidFromRow(row);
        var contract = {
          salary: salaryCell.textContent,
          years: yearsCell.textContent,
          status: statusCell.textContent,
          info: infoCell.textContent
        };
        var elig = computeEligibility(contract);

        rosterEligibilityByPid.set(pid, {
          playerId: pid,
          playerName: safeStr(playerLink.textContent),
          franchiseId: fid,
          years: parseInt(contract.years, 10) || 0,
          salary: parseMoney(contract.salary),
          status: safeStr(contract.status),
          info: safeStr(contract.info),
          extensionEligible: elig.extensionEligible,
          restructureEligible: elig.restructureEligible
        });
      });
    }

    function renderRosterQuickActions() {
      if (document.body.id !== "body_options_07") return;

      var rows = Array.from(document.querySelectorAll("#body_options_07 tr"));
      rows.forEach(function (row) {
        var cell = row.querySelector("td.player");
        if (!cell) return;

        if (cell.querySelector(".ccc-quick-actions")) return;

        var playerLink = cell.querySelector('a[href*="player?L="]');
        if (!playerLink) return;

        var pid = parsePidFromHref(playerLink.getAttribute("href") || "");
        if (!pid) return;

        var info = rosterEligibilityByPid.get(pid);
        if (!info) return;
        if (!info.extensionEligible && !info.restructureEligible) return;

        var wrap = document.createElement("span");
        wrap.className = "ccc-quick-actions";

        if (info.extensionEligible) {
          var ext = document.createElement("button");
          ext.type = "button";
          ext.className = "ccc-action-btn ext";
          ext.textContent = "Extension";
          ext.setAttribute("data-ccc-action", "extension");
          ext.setAttribute("data-ccc-pid", pid);
          ext.setAttribute("data-ccc-fid", info.franchiseId || "");
          wrap.appendChild(ext);
        }

        if (info.restructureEligible) {
          var rs = document.createElement("button");
          rs.type = "button";
          rs.className = "ccc-action-btn rs";
          rs.textContent = "Restructure";
          rs.setAttribute("data-ccc-action", "restructure");
          rs.setAttribute("data-ccc-pid", pid);
          rs.setAttribute("data-ccc-fid", info.franchiseId || "");
          wrap.appendChild(rs);
        }

        cell.appendChild(wrap);
      });
    }

    function extractPopupPid(popupRoot) {
      if (!popupRoot) return "";
      var a = popupRoot.querySelector('a[href*="player?L="]');

    }

    function renderPopupQuickActions() {

      var pid = extractPopupPid(popup);

        var seasonQuery = safeStr(qs.get("cccSeason")) || safeStr(hashQs.get("cccSeason"));
        var yearsQuery = safeStr(qs.get("cccYears")) || safeStr(hashQs.get("cccYears"));

        var hasQueryAction = !!(actionQuery && playerQuery);

    function csvEscape(value) {
      var s = safeStr(value);
      if (s.indexOf('"') !== -1) s = s.replace(/"/g, '""');

      return s;

    function rowsToCsv(rows) {
      if (!rows || !rows.length) return "team_id,team_name,division,player,position,salary,years_left,contract_type,points,bye,special\n";
      var headers = ["team_id","team_name","division","player","position","salary","years_left","contract_type","points","bye","special"];
      var lines = [headers.join(",")];
      rows.forEach(function (row) {
        lines.push(headers.map(function (h) { return csvEscape(row[h]); }).join(","));
      });
      return lines.join("\n") + "\n";

    function downloadTextFile(filename, text, mimeType) {
      var blob = new Blob([text], { type: mimeType || "text/plain;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () {

      }, 0);
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "readonly");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          var ok = document.execCommand("copy");
          ta.remove();
          if (ok) resolve();
          else reject(new Error("copy failed"));
        } catch (err) {
          ta.remove();
          reject(err);
        }
      });
    }

    function parseContractParts(raw) {
      var out = { chips: [], extras: [] };
      if (!raw) return out;

      var parts = raw.split("|").map(function (p) { return safeStr(p); }).filter(Boolean);
      if (!parts.length) {
        out.extras.push(raw);
        return out;
      }

      parts.forEach(function (part) {
        var lower = part.toLowerCase();
        var value = "";

        if (/^cl\b/i.test(part)) {
          value = textAfterPrefix(part, /^cl\s*(.*)$/i);
          out.chips.push({ label: "CL", value: value || "?", tone: "neutral" });
          return;
        }
        if (/^tcv\b/i.test(part)) {
          value = textAfterPrefix(part, /^tcv\s*(.*)$/i);
          out.chips.push({ label: "TCV", value: value || "?", tone: "neutral" });
          return;
        }
        if (/^aav\b/i.test(part)) {
          value = textAfterPrefix(part, /^aav\s*(.*)$/i);
          out.chips.push({ label: "AAV", value: value || "?", tone: "neutral" });
          return;
        }
        if (/^ext\s*:/i.test(part)) {
          value = textAfterPrefix(part, /^ext\s*:\s*(.*)$/i);
          out.chips.push({ label: "Ext", value: value || "Yes", tone: "accent" });
          return;
        }
        if (/^gtd\s*:/i.test(part)) {
          value = textAfterPrefix(part, /^gtd\s*:\s*(.*)$/i);
          out.chips.push({ label: "GTD", value: value || "Yes", tone: "accent" });
          return;
        }
        if (lower.indexOf("option eligible") !== -1) {
          out.chips.push({ label: "Option", value: "Eligible", tone: "accent" });
          return;
        }
        if (lower.indexOf("no further extension") !== -1 || lower.indexOf("no further extensions") !== -1) {
          out.chips.push({ label: "Ext", value: "Locked", tone: "accent" });
          return;
        }
        if (/^y\d+\s*-/i.test(part)) {
          out.extras.push(part);
          return;
        }

        out.extras.push(part);
      });

      return out;
    }

    function decorateTaxiSection(table) {

      var taxiCount = Number.isFinite(taxiCountAttr) ? taxiCountAttr : playerRows.filter(function (row) {

      playerRows.forEach(function (row) {

          capTone = "warning";

      var playersLabel = isFilterActive() ? (String(visiblePlayers) + "/" + String(totalPlayers)) : String(totalPlayers);

      meta.appendChild(buildSummaryChip("Salary", formatMoneyCompact(salaryTotal), "neutral"));
      meta.appendChild(buildSummaryChip("Taxi", String(taxiCount), "neutral"));
      meta.appendChild(buildSummaryChip("Status", capValue, capTone));

    function renderRosterSummaries() {
      if (!isRosterPage()) return;
      muteMutationObserver(150);
      getRosterTables().forEach(renderRosterSummary);
    }

    function rowMatchesFilters(row) {
      if (!row || row.getAttribute("data-ups-player-row") !== "1") return true;
      var name = safeStr(row.getAttribute("data-ups-player-name") || "");
      var pos = safeStr(row.getAttribute("data-ups-player-pos") || "").toUpperCase();
      var teamId = safeStr(row.getAttribute("data-ups-team-id") || "");
      var yearsBucket = safeStr(row.getAttribute("data-ups-contract-years-bucket") || "");
      var typeKey = lowerText(row.getAttribute("data-ups-contract-type-key") || "");
      if (rosterUiState.search && name.indexOf(rosterUiState.search) === -1) return false;
      if (rosterUiState.positions && rosterUiState.positions.length && rosterUiState.positions.indexOf(pos) === -1) return false;
      if (rosterUiState.teams && rosterUiState.teams.length && rosterUiState.teams.indexOf(teamId) === -1) return false;
      if (rosterUiState.years && rosterUiState.years.length && rosterUiState.years.indexOf(yearsBucket) === -1) return false;
      if (rosterUiState.contractTypes && rosterUiState.contractTypes.length && rosterUiState.contractTypes.indexOf(typeKey) === -1) return false;

    function applyRosterViewState() {
      if (!isRosterPage()) return;
      var filterActive = isFilterActive();
      var root = getRosterRoot();
      if (root) root.classList.toggle("ups-roster-filter-active", filterActive);

      getRosterTables().forEach(function (table) {
        sortTableRows(table);
        var taxiCollapsed = getTaxiCollapsed(table);
        var visibleMatchCount = 0;
        var teamCollapsed = getTeamCollapsed(table);

        Array.from(table.querySelectorAll("tr")).forEach(function (row) {
          if (row.querySelector("td.player")) {
            var match = rowMatchesFilters(row);
            var hideByTaxi = taxiCollapsed && row.getAttribute("data-ups-taxi-row") === "1";
            row.hidden = !match || hideByTaxi;
            if (!row.hidden) visibleMatchCount += 1;
            return;
          }

          if (row.getAttribute("data-ups-taxi-header") === "1") {
            row.hidden = false;
            return;
          }

          if (row.getAttribute("data-ups-taxi-row") === "1" || row.getAttribute("data-ups-taxi-summary-row") === "1") {
            row.hidden = taxiCollapsed;
            return;
          }

          row.hidden = false;
        });

        table.classList.toggle("ups-roster-no-match", filterActive && visibleMatchCount === 0);
        table.hidden = filterActive && visibleMatchCount === 0;

        var body = table.tBodies && table.tBodies[0];
        var effectiveCollapsed = !filterActive && teamCollapsed;
        if (body) body.hidden = effectiveCollapsed;
        updateTeamCollapseUi(table, effectiveCollapsed);

        var wrap = table.closest(".mobile-wrap");
        if (wrap && wrap.querySelector("table.report") === table) {
          wrap.hidden = !!table.hidden;
        }

        var hostCell = table.closest("td.two_column_layout");
        if (hostCell && hostCell.querySelectorAll("table.report").length === 1 && hostCell.querySelector("table.report") === table) {
          hostCell.hidden = !!table.hidden;
        }

        var toggle = table.querySelector(".ups-roster-taxi-toggle");
        if (toggle) toggle.setAttribute("aria-expanded", taxiCollapsed ? "false" : "true");
      });

      Array.from(document.querySelectorAll("#body_options_07 table.two_column_layout > tbody > tr")).forEach(function (layoutRow) {
        var cells = Array.prototype.filter.call(layoutRow.children || [], function (child) {
          return child && child.tagName === "TD" && /\btwo_column_layout\b/.test(safeStr(child.className));
        });
        if (!cells.length) return;
        var hasRosterCell = cells.some(function (cell) { return !!cell.querySelector("table.report"); });
        if (!hasRosterCell) return;
        layoutRow.hidden = cells.every(function (cell) { return cell.hidden; });

    function enhanceRosterTables() {
      if (!isRosterPage()) return;

      getRosterTables().forEach(function (table) {
        Array.from(table.querySelectorAll("tr")).forEach(function (row) {
          markPrimaryColumns(row);
          var infoCell = row.querySelector("td.contractinfo");
          if (infoCell) enhanceContractInfoCell(infoCell);

          if (row.querySelector("td.player")) {

    function onClick(e) {
      var clearBtn = e.target && e.target.closest ? e.target.closest("[data-ups-roster-clear='1']") : null;

        rosterUiState.positions = [];
        rosterUiState.teams = [];
        rosterUiState.divisions = [];
        rosterUiState.years = [];
        rosterUiState.contractTypes = [];
        rosterUiState.sort = "default";

          var searchEl = toolbar.querySelector("#upsRosterSearch");
          var teamsEl = toolbar.querySelector("#upsRosterTeams");
          var posEl = toolbar.querySelector("#upsRosterPositions");
          var yearsEl = toolbar.querySelector("#upsRosterYears");
          var typesEl = toolbar.querySelector("#upsRosterTypes");
          var sortEl = toolbar.querySelector("#upsRosterSort");

          setMultiSelectValues(posEl, []);
          setMultiSelectValues(yearsEl, []);
          setMultiSelectValues(typesEl, []);
          if (sortEl) sortEl.value = "default";

        saveRosterFilterState();
        applyRosterViewState();
        renderRosterSummaries();
        updateToolbarStatus();
        return;

      var exportBtn = e.target && e.target.closest ? e.target.closest("[data-ups-roster-export]") : null;
      if (exportBtn) {
        var mode = safeStr(exportBtn.getAttribute("data-ups-roster-export")).toLowerCase();
        var rows = collectVisibleRosterRows();
        var timestamp = new Date().toISOString().replace(/[:T]/g, "-").slice(0, 16);
        if (mode === "csv") {
          downloadTextFile("ups-rosters-" + timestamp + ".csv", rowsToCsv(rows), "text/csv;charset=utf-8");
        } else if (mode === "json") {
          var json = JSON.stringify(rows, null, 2);
          copyTextToClipboard(json).then(function () {
            updateToolbarStatus();
          }).catch(function () {
            downloadTextFile("ups-rosters-" + timestamp + ".json", json, "application/json;charset=utf-8");
          });
        }
        return;

      var teamToggle = e.target && e.target.closest ? e.target.closest(".ups-roster-team-toggle") : null;
      if (teamToggle) {
        var tableForTeam = teamToggle.closest("table.report");
        if (tableForTeam) {
          setTeamCollapsed(tableForTeam, !getTeamCollapsed(tableForTeam));
          applyRosterViewState();
          renderRosterSummaries();
          updateToolbarStatus();
        }
        return;
      }

      var taxiToggle = e.target && e.target.closest ? e.target.closest(".ups-roster-taxi-toggle") : null;
      if (taxiToggle) {
        var table = taxiToggle.closest("table.report");
        if (table) {
          setTaxiCollapsed(table, !getTaxiCollapsed(table));
          applyRosterViewState();
          renderRosterSummaries();
          updateToolbarStatus();
        }
        return;
      }

      var rowMoreBtn = e.target && e.target.closest ? e.target.closest(".ups-roster-row-more") : null;
      if (rowMoreBtn) {
        var row = rowMoreBtn.closest("tr[data-ups-player-row='1']");
        if (!row) return;
        var expanded = row.getAttribute("data-ups-row-expanded") === "1";
        row.setAttribute("data-ups-row-expanded", expanded ? "0" : "1");
        rowMoreBtn.setAttribute("aria-expanded", expanded ? "false" : "true");

      var btn = e.target && e.target.closest ? e.target.closest(".ups-contract-more") : null;

      if (!stack) return;

      if (!details) return;

      enhanceRosterTables();
      ensureToolbar();
      applyRosterViewState();
      renderRosterSummaries();
      updateToolbarStatus();
    }

    function init() {
      if (!isRosterPage()) return;

      try {
        var savedSearch = sessionStorage.getItem("ups_roster_search");
        if (savedSearch) rosterUiState.search = lowerText(savedSearch);
        rosterUiState.positions = loadStoredList("ups_roster_positions").map(function (v) { return safeStr(v).toUpperCase(); });
        rosterUiState.teams = loadStoredList("ups_roster_teams");
        rosterUiState.divisions = [];
        rosterUiState.years = loadStoredList("ups_roster_years");
        rosterUiState.contractTypes = loadStoredList("ups_roster_contract_types").map(lowerText);
        var savedSort = safeStr(sessionStorage.getItem("ups_roster_sort"));
        if (savedSort) rosterUiState.sort = savedSort.toLowerCase();
        if (!rosterUiState.positions.length) {
          var savedPos = sessionStorage.getItem("ups_roster_position");
          if (savedPos && safeStr(savedPos).toUpperCase() !== "ALL") {
            rosterUiState.positions = [safeStr(savedPos).toUpperCase()];
          }
        }
        if (!/^(default|salary_desc|salary_asc|years_desc|years_asc|points_desc|points_asc|name_asc)$/.test(rosterUiState.sort)) {
          rosterUiState.sort = "default";
        }
      } catch (e) {}

      refreshRosterUi();
      document.addEventListener("click", onClick, true);
      document.addEventListener("input", function (evt) {
        var el = evt && evt.target;
        if (!el || el.id !== "upsRosterSearch") return;

      if (!window.MutationObserver) return;
      var root = getRosterRoot();
      if (!root) return;

      var pending = false;
      var obs = new MutationObserver(function () {
        if (Date.now() < observerMuteUntil) return;
        if (pending) return;
        pending = true;
        setTimeout(function () {
          pending = false;
          refreshRosterUi();
        }, 80);
      });
      obs.observe(root, { childList: true, subtree: true });

      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();

</script>
