<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
(function () {
  var mount = document.getElementById("upsMarquee");
  if (!mount) return;

  function safeStr(v) {
    return v === null || v === undefined ? "" : String(v);
  }

  function safeInt(v) {
    var n = parseInt(String(v).replace(/[^\d-]/g, ""), 10);
    return isNaN(n) ? 0 : n;
  }

  function htmlEsc(v) {
    return safeStr(v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function pad2(v) {
    return String(v).padStart(2, "0");
  }

  function getLeagueId() {
    try {
      var u = new URL(window.location.href);
      var q = u.searchParams.get("L");
      if (q) return q;
    } catch (e) {}
    var m = String(window.location.pathname || "").match(/\/home\/(\d+)(?:\/|$)/i);
    if (m && m[1]) return String(m[1]);
    if (typeof league_id !== "undefined" && league_id) return String(league_id);
    return "";
  }

  function getYear() {
    try {
      var u = new URL(window.location.href);
      var q = u.searchParams.get("YEAR");
      if (q) return q;
    } catch (e) {}
    var m = String(window.location.pathname || "").match(/\/(\d{4})\//);
    if (m && m[1]) return String(m[1]);
    if (typeof year !== "undefined" && year) return String(year);
    return String(new Date().getFullYear());
  }

  function fetchFirstJson(urls) {
    function attempt(i) {
      if (i >= urls.length) return Promise.reject(new Error("all fetch candidates failed"));
      return fetch(urls[i], { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .catch(function () {
          return attempt(i + 1);
        });
    }
    return attempt(0);
  }

  function collectDraftPicks(node, out) {
    if (!node) return;
    if (Array.isArray(node)) {
      for (var i = 0; i < node.length; i += 1) collectDraftPicks(node[i], out);
      return;
    }
    if (typeof node !== "object") return;
    var hasRound = node.round !== undefined;
    var hasPick = node.pick !== undefined;
    var hasFranchise = node.franchise !== undefined || node.franchise_id !== undefined;
    if (hasRound && hasPick && hasFranchise) {
      out.push({
        round: safeInt(node.round),
        pick: safeInt(node.pick),
        franchise: safeStr(node.franchise || node.franchise_id || ""),
        player: safeStr(node.player || node.player_name || "")
      });
    }
    var keys = Object.keys(node);
    for (var k = 0; k < keys.length; k += 1) collectDraftPicks(node[keys[k]], out);
  }

  function normalizeDraftPicks(raw) {
    var out = [];
    collectDraftPicks(raw, out);
    out = out
      .filter(function (p) {
        return p.round > 0 && p.pick > 0 && p.franchise;
      })
      .sort(function (a, b) {
        return a.round - b.round || a.pick - b.pick;
      });
    var seen = {};
    var unique = [];
    for (var i = 0; i < out.length; i += 1) {
      var key = out[i].round + "|" + out[i].pick + "|" + out[i].franchise;
      if (seen[key]) continue;
      seen[key] = 1;
      unique.push(out[i]);
    }
    return unique.slice(0, 24);
  }

  function buildFranchiseMap(tagTrackingRows) {
    var map = {};
    (tagTrackingRows || []).forEach(function (r) {
      var fid = safeStr(r && r.franchise_id).replace(/\D/g, "").padStart(4, "0").slice(-4);
      if (!fid) return;
      if (!map[fid]) map[fid] = safeStr(r && r.franchise_name) || fid;
    });
    return map;
  }

  function buildRingOfHonorText(championsPayload) {
    var yearToWinner = {};
    var recent = championsPayload && championsPayload.recent_winners;
    var leaders = championsPayload && championsPayload.title_leaders;

    if (Array.isArray(recent)) {
      recent.forEach(function (r) {
        var y = safeInt(r && r.year);
        if (y) yearToWinner[y] = safeStr(r.franchise || "");
      });
    }

    if (Array.isArray(leaders)) {
      leaders.forEach(function (r) {
        var owner = safeStr(r && r.franchise);
        safeStr(r && r.years)
          .split(",")
          .forEach(function (rawYear) {
            var y = safeInt(rawYear);
            if (!y) return;
            if (!yearToWinner[y]) yearToWinner[y] = owner;
          });
      });
    }

    var parts = [];
    for (var y = 2010; y <= 2026; y += 1) {
      parts.push(y + ": " + (yearToWinner[y] || "TBD"));
    }
    return parts.join("  \u2022  ");
  }

  function buildTopExpiringRookieText(tagTrackingRows) {
    var best = null;
    (tagTrackingRows || []).forEach(function (r) {
      var years = safeInt(r && r.contract_year);
      var statusText =
        (safeStr(r && r.contract_status) + " " + safeStr(r && r.contract_info)).toLowerCase();
      if (years > 1) return;
      if (statusText.indexOf("rookie") === -1) return;
      var pts = Number(r && r.points_total || 0);
      if (!best || pts > best.pts) {
        best = {
          name: safeStr(r && r.player_name),
          team: safeStr(r && r.franchise_name),
          pts: pts
        };
      }
    });
    if (!best) return "No expiring rookie candidates yet.";
    return (
      best.name +
      " (" +
      best.team +
      ")  \u2022  " +
      best.pts.toFixed(1) +
      " pts"
    );
  }

  function buildTaggedPlayersText(tagSubs) {
    if (!Array.isArray(tagSubs) || !tagSubs.length) return "No submitted tags yet.";
    var maxSeason = 0;
    tagSubs.forEach(function (r) {
      var s = safeInt(r && (r.season || r.year));
      if (s > maxSeason) maxSeason = s;
    });
    var scoped = tagSubs.filter(function (r) {
      var s = safeInt(r && (r.season || r.year));
      return maxSeason ? s === maxSeason : true;
    });
    var names = scoped
      .slice()
      .sort(function (a, b) {
        return safeStr(a && a.franchise_name).localeCompare(safeStr(b && b.franchise_name)) ||
          safeStr(a && a.player_name).localeCompare(safeStr(b && b.player_name));
      })
      .slice(0, 24)
      .map(function (r) {
        var player = safeStr(r && r.player_name);
        var team = safeStr(r && r.franchise_name);
        return player && team ? player + " (" + team + ")" : player || team;
      })
      .filter(Boolean);
    var suffix = scoped.length > names.length ? "  \u2022  +" + (scoped.length - names.length) + " more" : "";
    return maxSeason + " submitted tags (" + scoped.length + "): " + names.join("  \u2022  ") + suffix;
  }

  function render(lanes, draftYear) {
    var laneHtml = lanes
      .map(function (lane) {
        return (
          '<div class="ups-marquee-lane">' +
          '<div class="ups-marquee-label">' + htmlEsc(lane.label) + "</div>" +
          '<div class="ups-marquee-body">' + htmlEsc(lane.body) + "</div>" +
          "</div>"
        );
      })
      .join("");

    mount.innerHTML =
      '<div class="ups-marquee-header">' +
      '<div class="ups-marquee-title">UPS League Pulse</div>' +
      '<div class="ups-marquee-subtitle">Draft / Champions / Expiring Rookies / Tags \u2022 ' + htmlEsc(String(draftYear || "")) + "</div>" +
      "</div>" +
      '<div class="ups-marquee-lanes">' + laneHtml + "</div>";
  }

  function boot() {
    var selectedYear = getYear();
    var leagueId = getLeagueId();
    var version = "v1.0.2";
    var cacheKey = String(Date.now());
    var baseCandidates = [
      "https://keithcreelman.github.io/upsmflproduction/",
      "https://keithcreelman.github.io/upsmflproduction/"
    ];

    var championsPromise = fetchFirstJson(
      baseCandidates.map(function (base) {
        return base + "site/champions_panels.json?v=" + cacheKey;
      })
    ).catch(function () {
      return {};
    });

    var tagTrackingPromise = fetchFirstJson(
      baseCandidates.map(function (base) {
        return base + "site/ccc/tag_tracking.json?v=" + cacheKey;
      })
    ).catch(function () {
      return { rows: [] };
    });

    var tagSubPromise = fetchFirstJson(
      baseCandidates.map(function (base) {
        return base + "site/ccc/tag_submissions.json?v=" + cacheKey;
      })
    ).catch(function () {
      return { rows: [] };
    });

    var draftPromise = fetchFirstJson([
      "https://api.myfantasyleague.com/" +
        encodeURIComponent(selectedYear) +
        "/export?TYPE=draftResults&L=" +
        encodeURIComponent(leagueId) +
        "&JSON=1&_=" +
        cacheKey
    ]).catch(function () {
      return {};
    });

    Promise.all([championsPromise, tagTrackingPromise, tagSubPromise, draftPromise]).then(function (all) {
      var champions = all[0] || {};
      var trackingRaw = all[1] || {};
      var tagSubsRaw = all[2] || {};
      var draftRaw = all[3] || {};

      var tagTrackingRows = Array.isArray(trackingRaw)
        ? trackingRaw
        : Array.isArray(trackingRaw.rows)
        ? trackingRaw.rows
        : Array.isArray(trackingRaw.tag_tracking)
        ? trackingRaw.tag_tracking
        : [];

      var tagSubs = Array.isArray(tagSubsRaw)
        ? tagSubsRaw
        : Array.isArray(tagSubsRaw.rows)
        ? tagSubsRaw.rows
        : Array.isArray(tagSubsRaw.submissions)
        ? tagSubsRaw.submissions
        : [];

      var fidToName = buildFranchiseMap(tagTrackingRows);
      var rookiePicks = normalizeDraftPicks(draftRaw);
      var rookieText = rookiePicks.length
        ? rookiePicks
            .map(function (p) {
              var pickNo = p.round + "." + pad2(p.pick);
              var team = fidToName[p.franchise] || p.franchise;
              var player = p.player || "On the Clock";
              return pickNo + " " + team + " - " + player;
            })
            .join("  \u2022  ")
        : "No rookie draft picks available yet.";

      var lanes = [
        { label: "Rookie Draft (First 24)", body: rookieText },
        { label: "Champions Ring Of Honor (2010-2026)", body: buildRingOfHonorText(champions) },
        { label: "Highest Scoring Expiring Rookie", body: buildTopExpiringRookieText(tagTrackingRows) },
        { label: "Submitted Tagged Players", body: buildTaggedPlayersText(tagSubs) }
      ];
      render(lanes, selectedYear);
    }).catch(function () {
      render(
        [
          { label: "Rookie Draft (First 24)", body: "Unable to load draft data." },
          { label: "Champions Ring Of Honor (2010-2026)", body: "Unable to load champions data." },
          { label: "Highest Scoring Expiring Rookie", body: "Unable to load expiring rookie data." },
          { label: "Submitted Tagged Players", body: "Unable to load tag submission data." }
        ],
        selectedYear
      );
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
  } // UPS_BB_GATE_END
</script>

  /* ─────────────────────────────────────────────────────────────────
   * MFL native-page scroll-to-bottom defensive fix (added 2026-05-12)
   *
   * Owner reported: on native MFL pages (e.g., my_tickets, settings,
   * options forms) the bottom action button (Submit Reply, Save, etc.)
   * is hidden behind UPS-injected sticky chrome. Going full-screen
   * makes the button visible — confirms it's a viewport / safe-area
   * problem, not a stylesheet load failure.
   *
   * The May 11 fix in PR #60 added bottom padding to HUB shells
   * (.rdh-main, .tops-shell, .rwb-shell, .twb-shell, .ccc-main) but
   * MFL native page wrappers (#container-wrap, body, .maincontent,
   * legacy <center> + <table> layouts) were never covered. This
   * block adds breathing room to those native containers + uses
   * 100dvh on mobile so iOS Safari's URL bar can't clip content.
   *
   * Purely additive CSS. Worst case: extra blank space at the bottom
   * of a few pages. No risk to functionality. ───────────────────── */
  html, body {
    overflow-x: hidden;
  }
  /* Native MFL page containers need bottom breathing room so the
     last interactive control (Submit Reply, etc.) clears the UPS
     champion footer at the viewport bottom. Bumped 6rem → 10rem on
     2026-05-13 after a screenshot showed the SUBMIT REPLY button on
     my_tickets still getting clipped at desktop sizes. */
  body > #container-wrap,
  body > #container,
  body > #wrapper,
  body > .maincontent,
  body > .content,
  body > #content_wrap,
  body > center > form,
  body > center > table,
  body > form,
  body > table {
    padding-bottom: 10rem !important;
    box-sizing: border-box;
  }
  /* ─────────────────────────────────────────────────────────────────
   * UNIVERSAL native-MFL scroll safety + link contrast (2026-05-20)
   *
   * Previously we enumerated body IDs (body_my_tickets, body_options_,
   * body_csetup, body_commissioner_setup, ...) and missed pages every
   * time MFL added new ones. Switched to body-level + class-aware
   * selectors so EVERY native MFL page is covered automatically.
   *
   * Risk analysis (why this is safe to apply universally):
   *   - Extra body padding-bottom on a UPS hub iframe = a small blank
   *     strip below the content. Harmless; iframe height beacon
   *     handles auto-sizing.
   *   - a:not([class]) excludes ALL UPS-injected components (CCC
   *     pills, hub buttons, .ah-*, .rdh-*, .btn) by virtue of those
   *     having class attributes. Only MFL's bare <a href> links match.
   * ───────────────────────────────────────────────────────────────── */

  /* Scroll safety — every page gets enough bottom padding to clear
     the UPS hero/champion footer. Submit buttons get extra
     scroll-margin so focus-scrolling parks them above the fold. */
  body {
    padding-bottom: 8rem !important;
  }
  body input[type="submit"],
  body button[type="submit"],
  body input[type="image"][src*="submit"],
  body input[name="SUBMIT"],
  body .ups-submit,
  body [class*="submit"] {
    scroll-margin-bottom: 12rem !important;
  }
  @media (max-width: 980px) {
    body {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10rem) !important;
    }
  }

  /* Link contrast — any unstyled MFL link (no class, no inline color)
     gets the UPS link color + bold + underline. UPS components all
     have class attributes so they're naturally excluded. */
  body a:not([class]):not([style*="color"]),
  body a:not([class]):not([style*="color"]):visited {
    color: var(--ups-link, #2960c1) !important;
    font-weight: 700 !important;
    text-decoration: underline !important;
  }
  body a:not([class]):not([style*="color"]):hover,
  body a:not([class]):not([style*="color"]):focus {
    color: var(--ups-link-hover, #1a4290) !important;
  }

  /* Text contrast — MFL renders hint/help/note text in faded grays
     (#888-ish) that work on white but disappear on UPS dark theme.
     This is a broad sweep of common text-bearing elements that
     EXCLUDES anything with a UPS-prefixed class or inline color.
     Same exclusion pattern as the link rule above. UPS components
     keep their own colors because their class selectors win on the
     specific elements that need it.

     Coverage: td, th, div, span, p, label, li, dt, dd — covers most
     MFL form/report layouts. Excludes nav-style elements (because
     those typically have classes) and anything with inline styling. */
  body td:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body th:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body div:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body span:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body p:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body label:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body li:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body dt:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]),
  body dd:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]):not([class*="ccc-"]):not([class*="tops-"]):not([class*="twb-"]):not([class*="rwb-"]):not([class*="lmb-"]):not([class*="fo-"]):not([style*="color"]) {
    color: var(--ups-text, #e8edf5) !important;
  }

  /* Catch the specific class names MFL uses for hint/help boxes —
     these tend to carry inline color via stylesheet rules that
     would still win over the broad rule above. Force-override
     every common name + their descendants.

     CONFIRMED MFL MARKUP (from a 2026-05-20 inspection of the
     auction-settings page):
       <tr id="row_hint_AUCTION_TYPE">
         <td class="tdalert tdalert-info-table">
           <span><b>Hint:</b> Changing these values...</span>
         </td>
       </tr>
     The .tdalert / .tdalert-info-table + the row_hint_ id attribute
     give us two reliable signals to target. */
  body .hint, body .hint *,
  body .note, body .note *,
  body .help, body .help *,
  body .help_text, body .help_text *,
  body .helpbox, body .helpbox *,
  body .helphint, body .helphint *,
  body .formhint, body .formhint *,
  body .tdalert, body .tdalert *,
  body .tdalert-info-table, body .tdalert-info-table *,
  body tr[id^="row_hint_"], body tr[id^="row_hint_"] *,
  body [class*="hint"]:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]),
  body [class*="hint"]:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]) *,
  body [class*="note"]:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]),
  body [class*="note"]:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]) *,
  body [class*="tdalert"]:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]),
  body [class*="tdalert"]:not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]) * {
    color: var(--ups-text, #e8edf5) !important;
    opacity: 1 !important;
    text-shadow: none !important;
  }

  /* ═══════════════════════════════════════════════════════════════════
   * Auction Bid (O=43) — comprehensive UPS dark-theme overlay v2
   *
   * Replaces the earlier Phase 4.1 block (which used wrong CSS var
   * names — `--ups-accent` is GOLD #f0c465, not blue). v2 uses the

  /* ─────────────────────────────────────────────────────────────────
   * TOS .alert.alert-info-body mirror (2026-05-20)
   *
   * theeohiostate's footer.js rewrites MFL's <span class="reportnavigation">
   * into <span class="alert alert-info-body"> at runtime, so our
   * .reportnavigation rules above never light up the post-transform DOM
   * on auction pages. Mirror the dark-info treatment onto the
   * transformed class so the Hint blocks render correctly regardless of
   * whether the TOS transform ran. (See docs/mfl_native/lessons_from_
   * theeohiostate.md — anti-pattern #1 documents the transform; we
   * style its output rather than fight it until TOS is staged out.)
   * ───────────────────────────────────────────────────────────────── */
  body[id^="body_options_43"] .alert.alert-info-body,
  body[id^="body_options_43"] span.alert-info-body {
    display: block !important;
    padding: 10px 14px !important;
    margin: 8px 0 !important;
    background: var(--ups-surface, #111b2e) !important;
    border: 1px solid var(--ups-border, #27476f) !important;
    border-left: 3px solid var(--ups-accent, #f0c465) !important;
    border-radius: 4px !important;
    color: var(--ups-text, #e8effa) !important;
    font-size: 12px !important;
    line-height: 1.6 !important;
  }
  body[id^="body_options_43"] .alert.alert-info-body .reportnavigationheader,
  body[id^="body_options_43"] .alert.alert-info-body .alert-info-header,
  body[id^="body_options_43"] .alert.alert-info-body > strong:first-child,
  body[id^="body_options_43"] .alert.alert-info-body > b:first-child {
    display: inline !important;
    color: var(--ups-accent, #f0c465) !important;
    font-weight: 700 !important;
    margin-right: 6px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.3px !important;
    font-size: 11px !important;
  }
  body[id^="body_options_43"] .alert.alert-info-body b,
  body[id^="body_options_43"] .alert.alert-info-body strong {
    color: var(--ups-text, #e8effa) !important;
    font-weight: 700 !important;
  }
  body[id^="body_options_43"] .alert.alert-info-body .warning {
    color: var(--ups-warning, #d33642) !important;
    background: rgba(211, 54, 66, 0.12) !important;
    padding: 1px 5px !important;
    border-radius: 3px !important;
    font-weight: 600 !important;
  }
  body[id^="body_options_43"] td .alert.alert-info-body,
  body[id^="body_options_43"] tr .alert.alert-info-body {
    margin: 4px 0 !important;
  }

  /* ─────────────────────────────────────────────────────────────────
   * Phase A — white-gap closure + visual feel match to .ah-* hub
   * 2026-05-20.
   *
   * White gaps were leaking through because MFL wraps content in
   * <form>, <p>, and unclassed <div>/<span> blocks whose default
   * white background showed through between our styled .report
   * tables. Solution: paint every block-level descendant that doesn't
   * already have an explicit background — and tighten typography to
   * the auction hub treatment (system font 14px, uppercase muted
   * sub-captions, 8px container radii).
   * ───────────────────────────────────────────────────────────────── */

  /* html + body — guarantee no white leak ever, including the
     overflow zone past the page bottom. */
  html:has(body[id^="body_options_43"]),
  body[id^="body_options_43"] {
    background: var(--ups-bg, #0b1220) !important;
  }

  /* Every block-level wrapper MFL emits between sections. Painting
     transparent inherits the body's dark — but also explicitly setting
     --ups-bg covers any element whose parent isn't body (e.g. a div
     in a div). Excludes our themed classes so we don't repaint cards. */
  body[id^="body_options_43"] form,
  body[id^="body_options_43"] fieldset,
  body[id^="body_options_43"] > div:not(.myfantasyleague_menu),
  body[id^="body_options_43"] .pagebody > p,
  body[id^="body_options_43"] .pagebody > div:not(.report):not(.alert):not(.alert-info-body):not([class*="ups-"]):not([class*="ah-"]):not([class*="rdh-"]) {
    background: var(--ups-bg, #0b1220) !important;
    color: var(--ups-text, #e8effa) !important;
  }

  /* <p> tags on O=43 — tighten margin so consecutive blocks don't
     leave a tall stripe; paragraph text inherits surface dark. */
  body[id^="body_options_43"] p {
    background: transparent !important;
    color: var(--ups-text, #e8effa) !important;
    margin: 8px 0 !important;
    line-height: 1.5 !important;
  }

  /* Empty <p>/<br> wrappers MFL leaves between sections show as
     blank stripes; squash to zero height when they have no text. */
  body[id^="body_options_43"] p:empty,
  body[id^="body_options_43"] br + br {
    display: none !important;
  }

  /* Section captions (the "START AUCTIONING…" / "SELECT A PLAYER…"
     rows) — already get .report > caption styling above. Tighten
     a notch to match .ah-card h2 (uppercase, muted, 13px). */
  body[id^="body_options_43"] table.report caption {
    background: var(--ups-caption-bg, linear-gradient(135deg, #0f1728 0%, #1c3359 60%, #204f73 100%)) !important;
    color: var(--ups-text, #e8effa) !important;
    padding: 12px 16px !important;
    font-weight: 700 !important;
    font-size: 13px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.5px !important;
    border-bottom: 1px solid var(--ups-border, #27476f) !important;
    caption-side: top !important;
    text-align: left !important;
    border-radius: 8px 8px 0 0 !important;
  }

  /* MFL's secondary section header (e.g. "Select A Player Before
     Submitting Auction Bid") often lives in a <td> as a row spanning
     the table width. Style it as a sub-caption strip. */
  body[id^="body_options_43"] table.report tr.eventablerow td[colspan]:first-child:only-child,
  body[id^="body_options_43"] table.report tr.oddtablerow td[colspan]:first-child:only-child {
    background: var(--ups-th-bg, #152742) !important;
    color: var(--ups-muted, #9fb3d1) !important;
    text-transform: uppercase !important;
    letter-spacing: 0.4px !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    padding: 8px 16px !important;
  }

  /* Make the report tables share .ah-card's exact 16px outer rhythm so
     stacked tables align with the auction hub iframe living above
     them. */
  body[id^="body_options_43"] table.report {
    margin: 0 0 16px !important;
    width: 100% !important;
    max-width: 1400px !important;
  }

  /* Body typography matches .ah-main: system font, 14px, 1.5 leading.
     Existing rule sets the family on the body wrapper; add size +
     leading explicitly to override MFL's defaults. */
  body[id^="body_options_43"],
  body[id^="body_options_43"] td,
  body[id^="body_options_43"] th {
    font-size: 14px !important;
    line-height: 1.5 !important;
  }
  body[id^="body_options_43"] table.report th {
    font-size: 11px !important;
  }
  body[id^="body_options_43"] table.report td {
    font-size: 13px !important;
  }

  /* Cells that wrap form inputs (e.g. Opening Bid, Comments) — kill
     the alt-row striping in those contexts so the input doesn't
     sit on a different shade than its label. */
  body[id^="body_options_43"] table.report tr:has(input[type="text"]) td,
  body[id^="body_options_43"] table.report tr:has(textarea) td,
  body[id^="body_options_43"] table.report tr:has(select) td {
    background: var(--ups-surface, #111b2e) !important;
  }

  /* Form inputs / selects / textareas */
  body[id^="body_options_43"] input[type="text"],
  body[id^="body_options_43"] input[type="password"],
  body[id^="body_options_43"] input[type="email"],
  body[id^="body_options_43"] input[type="number"],
  body[id^="body_options_43"] select,
  body[id^="body_options_43"] textarea {
    background: var(--ups-surface-alt, #16253f) !important;
    color: var(--ups-text, #e8effa) !important;
    border: 1px solid var(--ups-border, #27476f) !important;
    border-radius: 4px !important;
    padding: 6px 10px !important;
    font-size: 13px !important;
    font-family: inherit !important;
  }
  body[id^="body_options_43"] input[type="text"]:focus,
  body[id^="body_options_43"] input[type="password"]:focus,
  body[id^="body_options_43"] input[type="email"]:focus,
  body[id^="body_options_43"] input[type="number"]:focus,
  body[id^="body_options_43"] select:focus,
  body[id^="body_options_43"] textarea:focus {
    outline: none !important;
    border-color: var(--ups-accent, #f0c465) !important;
    box-shadow: 0 0 0 2px rgba(240, 196, 101, 0.18) !important;
  }
  body[id^="body_options_43"] textarea {
    resize: vertical !important;
  }
  body[id^="body_options_43"] .inputlabel {
    color: var(--ups-muted, #9fb3d1) !important;
    font-size: 11px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.3px !important;
    display: block !important;
    margin-bottom: 4px !important;
    font-weight: 500 !important;
  }

  /* Submit / button — uses the UPS button blue, not the gold accent.
     CRITICAL: this is the bid-submit button. Don't break visibility. */
  body[id^="body_options_43"] input[type="submit"],
  body[id^="body_options_43"] button[type="submit"],
  body[id^="body_options_43"] input[type="button"],
  body[id^="body_options_43"] button:not(.ups-quickbid-btn) {
    background: var(--ups-btn-bg, #1f4d93) !important;
    color: var(--ups-btn-text, #ffffff) !important;
    border: 1px solid var(--ups-btn-border, #4a75b7) !important;
    padding: 8px 16px !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    font-weight: 700 !important;
    font-size: 13px !important;
    font-family: inherit !important;
    letter-spacing: 0.02em !important;
    transition: filter 120ms !important;
  }
  body[id^="body_options_43"] input[type="submit"]:hover,
  body[id^="body_options_43"] button[type="submit"]:hover,
  body[id^="body_options_43"] input[type="button"]:hover,
  body[id^="body_options_43"] button:not(.ups-quickbid-btn):hover {
    filter: brightness(1.15) !important;
  }
  body[id^="body_options_43"] input[type="submit"]:disabled,
  body[id^="body_options_43"] button:disabled {
    opacity: 0.5 !important;
    cursor: not-allowed !important;
    filter: none !important;
  }
  body[id^="body_options_43"] .form_buttons {
    background: var(--ups-surface, #111b2e) !important;
    padding: 12px !important;
    text-align: center !important;
  }

  /* Quick-bid buttons (Phase 4.3) — outlined gold accent, distinct
     from the main submit blue. Pre-styled here so they appear the
     moment the JS injects them. */
  body[id^="body_options_43"] .ups-quickbid-btn {
    background: transparent !important;
    color: var(--ups-accent, #f0c465) !important;
    border: 1px solid var(--ups-accent, #f0c465) !important;
    padding: 4px 10px !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    margin-left: 4px !important;
    font-family: inherit !important;
  }
  body[id^="body_options_43"] .ups-quickbid-btn:hover {
    background: var(--ups-accent, #f0c465) !important;
    color: var(--ups-accent-ink, #102a55) !important;
  }

  /* Status indicators */
  body[id^="body_options_43"] .warning:not(.reportnavigation .warning) {
    color: var(--ups-warning, #d33642) !important;
    font-weight: 600 !important;
  }
  body[id^="body_options_43"] .positive,
  body[id^="body_options_43"] .success {
    color: var(--ups-success, #25c37d) !important;
    font-weight: 600 !important;
  }
  body[id^="body_options_43"] .negative,
  body[id^="body_options_43"] .error {
    color: var(--ups-danger, #e36572) !important;
    font-weight: 600 !important;
  }
  body[id^="body_options_43"] .injurystatus {
    color: var(--ups-warning, #d33642) !important;
    font-weight: 700 !important;
  }

  /* ─────────────────────────────────────────────────────────────────
   * Phase B-lite — inline player picker (2026-05-20)
   *
   * O=43's auction-nominate form (form#AddDropForm) is an inline
   * searchable table of ~1000+ players. Each row has a small <Add>
   * button; clicking writes player_id into the hidden #sel_pid input
   * (name="PLAYER_PICK") and submits. There's NO popup — the whole
   * picker is rendered inline. Style it to feel like an .ah-card so
   * it visually matches the auction-hub iframe rendered above it.
   *
   * Full side-mount drawer pivot is deferred to a separate scoped
   * session (Phase C) — needs MFL player feed + search + on-pick
   * animation work that doesn't fit a CSS-only pass.
   * ───────────────────────────────────────────────────────────────── */
  body[id^="body_options_43"] form#AddDropForm {
    background: var(--ups-surface, #111b2e) !important;
    border: 1px solid var(--ups-border, #27476f) !important;
    border-radius: 8px !important;
    padding: 16px !important;
    margin: 0 0 16px !important;
    color: var(--ups-text, #e8effa) !important;
  }
  body[id^="body_options_43"] form#AddDropForm select#picker_filt_nfl,
  body[id^="body_options_43"] form#AddDropForm select#position-filter {
    min-width: 120px !important;
    margin-right: 6px !important;
    margin-bottom: 6px !important;
  }
  /* The hundreds of <button>Add</button> rows in the picker table.
     Compact, gold-outline so they stand out from MFL's submit blue. */
  body[id^="body_options_43"] form#AddDropForm button:not([type="submit"]) {
    background: transparent !important;
    color: var(--ups-accent, #f0c465) !important;
    border: 1px solid var(--ups-accent, #f0c465) !important;
    padding: 3px 10px !important;
    border-radius: 3px !important;
    cursor: pointer !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    font-family: inherit !important;
    letter-spacing: 0.02em !important;
    line-height: 1.4 !important;
    text-transform: uppercase !important;
    transition: background 100ms, color 100ms !important;
  }
  body[id^="body_options_43"] form#AddDropForm button:not([type="submit"]):hover {
    background: var(--ups-accent, #f0c465) !important;
    color: var(--ups-accent-ink, #102a55) !important;
  }
  body[id^="body_options_43"] form#AddDropForm button:not([type="submit"]):disabled {
    opacity: 0.4 !important;
    cursor: not-allowed !important;
  }
  /* Inner picker table rows — tighten so 1000 players don't push the
     page height into the moon. */
  body[id^="body_options_43"] form#AddDropForm table.report td,
  body[id^="body_options_43"] form#AddDropForm table.report th {
    padding: 6px 10px !important;
    font-size: 12px !important;
  }
  /* When the picker scrolls in a container with inline overflow style,
     normalize the chrome. */
  body[id^="body_options_43"] form#AddDropForm div[style*="overflow"] {
    border: 1px solid var(--ups-border, #27476f) !important;
    border-radius: 6px !important;
    background: var(--ups-surface, #111b2e) !important;
    max-height: 480px !important;
  }

  /* ─────────────────────────────────────────────────────────────────
   * TOS .add-drop-player-row picker rows (2026-05-20)
   *
   * theeohiostate's footer.js renders the player picker as
   * <div class="add-drop-player-row oddtablerow selected-player">
   * instead of the bare table rows MFL ships. Their selected state
   * is rgba(60, 179, 0, 0.1) (pale green wash) — readable on light
   * theme but unreadable on dark. Repaint dark + use a green LEFT
   * BORDER as the "selected" indicator so the semantic stays.
   *
   * Classes come from mflscripts.com — confirmed by the
   * "https://www.mflscripts.com/playerImages_80x107/" img src.
   * ───────────────────────────────────────────────────────────────── */
  /* Specificity-matched to beat light.css. Diagnostic confirmed
     TOS uses .add-player-container .add-drop-player-row* (0,3,0).
     Including .add-player-container in our chain → 0,4,1 — wins
     regardless of source order or !important. */
  body[id^="body_options_43"] .add-player-container .add-drop-player-row {
    background: var(--ups-row-odd, #111f35) !important;
    background-color: var(--ups-row-odd, #111f35) !important;
    color: var(--ups-text, #e8effa) !important;
    border-bottom: 1px solid var(--ups-td-border, #203a5d) !important;
  }
  body[id^="body_options_43"] .add-player-container .add-drop-player-row.eventablerow {
    background: var(--ups-row-even, #0f1b30) !important;
    background-color: var(--ups-row-even, #0f1b30) !important;
  }
  body[id^="body_options_43"] .add-player-container .add-drop-player-row.oddtablerow {
    background: var(--ups-row-odd, #111f35) !important;
    background-color: var(--ups-row-odd, #111f35) !important;
  }
  /* Selected state — dark fill + green left stripe (semantic preserved) */
  body[id^="body_options_43"] .add-player-container .add-drop-player-row.selected-player {
    background: var(--ups-surface-alt, #16253f) !important;
    background-color: var(--ups-surface-alt, #16253f) !important;
    border-left: 3px solid var(--ups-success, #25c37d) !important;
  }
  /* Hover — surface-alt dark, beats TOS's green wash */
  body[id^="body_options_43"] .add-player-container .add-drop-player-row:hover,
  body[id^="body_options_43"] .add-player-container .add-drop-player-row.hover,
  body[id^="body_options_43"] .add-player-container .add-drop-player-row.is-hovered {
    background: var(--ups-surface-alt, #16253f) !important;
    background-color: var(--ups-surface-alt, #16253f) !important;
  }
  /* Selected + hover composed — keep green stripe AND dark fill */
  body[id^="body_options_43"] .add-player-container .add-drop-player-row.selected-player:hover {
    background: var(--ups-surface-alt, #16253f) !important;
    background-color: var(--ups-surface-alt, #16253f) !important;
    border-left: 3px solid var(--ups-success, #25c37d) !important;
  }
  /* Defensive fallbacks (no .add-player-container wrapper) — kept at
     lower specificity in case TOS ever refactors away the wrapper */
  body[id^="body_options_43"] .add-drop-player-row.selected-player {
    background: var(--ups-surface-alt, #16253f) !important;
    border-left: 3px solid var(--ups-success, #25c37d) !important;
  }
  body[id^="body_options_43"] .add-drop-player-row:hover {
    background: var(--ups-surface-alt, #16253f) !important;
  }
  /* All text inside the picker row inherits the light text token —
     defeats whatever inline color TOS may apply to player names
     under the now-dark surface. */
  body[id^="body_options_43"] .add-drop-player-row,
  body[id^="body_options_43"] .add-drop-player-row * {
    color: var(--ups-text, #e8effa) !important;
  }
  /* TOS marks projection-points cells with weak grey — bump to muted
     so the value stays visible on dark. */
  body[id^="body_options_43"] .add-drop-player-row [class*="proj"],
  body[id^="body_options_43"] .add-drop-player-row [class*="rank"],
  body[id^="body_options_43"] .add-drop-player-row [class*="bye"] {
    color: var(--ups-muted, #9fb3d1) !important;
  }
  /* Helmet image wrappers — round + thin border to match avatar treatment */
  body[id^="body_options_43"] .add-drop-player-row .player-img-wrapper-clippler {
    border: 1px solid var(--ups-border, #27476f) !important;
    border-radius: 50% !important;
    overflow: hidden !important;
  }

  /* Lock-status legend (#locked-msg) — TOS renders the "[L] Locked: ...
     # Locked: Global ... * Locked: Recently Dropped" key below the
     picker. Element has no class hooks; target by ID. Inherits page
     default #000 on dark background → unreadable without an override. */
  body[id^="body_options_43"] #locked-msg,
  body[id^="body_options_43"] #locked-msg * {
    color: var(--ups-text, #e8effa) !important;
  }
  body[id^="body_options_43"] #locked-msg b {
    color: var(--ups-accent, #f0c465) !important;
    font-weight: 700 !important;
  }
  body[id^="body_options_43"] #locked-msg a {
    color: var(--ups-link, #8ec4ff) !important;
    text-decoration: none !important;
  }
  body[id^="body_options_43"] #locked-msg a:hover {
    color: var(--ups-link-hover, #c0deff) !important;
    text-decoration: underline !important;
  }

  /* Player picker table */
  body[id^="body_options_43"] table.pickerbox {
    background: var(--ups-surface, #111b2e) !important;
    border: 1px solid var(--ups-border, #27476f) !important;
    color: var(--ups-text, #e8effa) !important;
  }
  body[id^="body_options_43"] table.pickerbox th {
    background: var(--ups-th-bg, #152742) !important;
    color: var(--ups-muted, #9fb3d1) !important;
    border-bottom: 1px solid var(--ups-border, #27476f) !important;
    padding: 8px 10px !important;
    font-size: 11px !important;
    text-transform: uppercase !important;
  }
  body[id^="body_options_43"] table.pickerbox td {
    padding: 6px 8px !important;
    color: var(--ups-text, #e8effa) !important;
    border-bottom: 1px solid var(--ups-td-border, #203a5d) !important;
  }
  body[id^="body_options_43"] table.pickerbox tr:hover {
    background: var(--ups-surface-alt, #16253f) !important;
  }
  body[id^="body_options_43"] table.pickerbox a {
    color: var(--ups-link, #8ec4ff) !important;
    text-decoration: none !important;
  }
  body[id^="body_options_43"] table.pickerbox a:hover {
    color: var(--ups-link-hover, #c0deff) !important;
    text-decoration: underline !important;
  }
  /* Scrollable container around the picker */
  body[id^="body_options_43"] div[style*="overflow: auto"] {
    border-color: var(--ups-border, #27476f) !important;
    background: var(--ups-surface, #111b2e) !important;
  }

  /* Player position pills (.position_qb, .position_rb, etc.) */
  body[id^="body_options_43"] a[class^="position_"],
  body[id^="body_options_43"] [class^="position_"] {
    color: var(--ups-link, #8ec4ff) !important;
    font-weight: 600 !important;
  }

  /* Franchise badge cell — restraining oversized icons */
  body[id^="body_options_43"] .franchiseicon {
    max-width: 32px !important;
    height: auto !important;
    border-radius: 4px !important;
    vertical-align: middle !important;
  }
  body[id^="body_options_43"] [class^="franchise_"] {
    color: var(--ups-link, #8ec4ff) !important;
  }

  /* Typography niceties */
  body[id^="body_options_43"] p,
  body[id^="body_options_43"] span,
  body[id^="body_options_43"] label,
  body[id^="body_options_43"] td,
  body[id^="body_options_43"] li {
    color: var(--ups-text, #e8effa);
  }
  body[id^="body_options_43"] b,
  body[id^="body_options_43"] strong {
    color: var(--ups-report-strong, #ffffff) !important;
    font-weight: 700 !important;
  }
  body[id^="body_options_43"] i,
  body[id^="body_options_43"] em {
    color: var(--ups-muted, #9fb3d1) !important;
  }
  body[id^="body_options_43"] h1,
  body[id^="body_options_43"] h2,
  body[id^="body_options_43"] h3,
  body[id^="body_options_43"] h4,
  body[id^="body_options_43"] h5,
  body[id^="body_options_43"] h6,
  body[id^="body_options_43"] h1 *,
  body[id^="body_options_43"] h2 *,
  body[id^="body_options_43"] h3 *,
  body[id^="body_options_43"] h4 *,

<script>
  if (!window.UPS_BAREBONES) { // UPS_BB_GATE
  // ─── O=43 picker + #locked-msg inline-style painter ────────────────────
  // Last-resort nuclear override: inline element.style.setProperty(..., 'important')
  // beats EVERYTHING in author CSS — no specificity war can win against it.
  //
  // Why we need this: TOS's light.css ships .add-player-container
  // .add-drop-player-row* rules with similar specificity + loaded after
  // our <style> block, so they win the cascade. Inline !important styles
  // bypass the cascade entirely.
  //
  // Scoped strictly to body_options_43 — does nothing on any other page.
  // ───────────────────────────────────────────────────────────────────────
  (function () {
    if (!document.body || !/^body_options_43/.test(document.body.id || "")) {
      // Page not loaded yet OR not the right page — try once at DOM ready then bail
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
          if (/^body_options_43/.test(document.body.id || "")) initO43Painter();
        });
      }
      return;
    }
    initO43Painter();

    function initO43Painter() {
      // Token values mirror our :root --ups-* CSS vars so the painted styles
      // match the rest of the dark theme.
      var TOK = {
        rowOdd:     "#111f35",  // --ups-row-odd
        rowEven:    "#0f1b30",  // --ups-row-even
        surface:    "#111b2e",  // --ups-surface
        surfaceAlt: "#16253f",  // --ups-surface-alt
        text:       "#e8effa",  // --ups-text
        border:     "#27476f",  // --ups-border
        success:    "#25c37d",  // --ups-success
        accent:     "#f0c465",  // --ups-accent
      };

      function paintRow(row, isHovered) {
        if (!row || !row.style) return;
        var isSel = row.classList.contains("selected-player");
        var isEven = row.classList.contains("eventablerow");
        var bg = (isSel || isHovered) ? TOK.surfaceAlt : (isEven ? TOK.rowEven : TOK.rowOdd);
        row.style.setProperty("background", bg, "important");
        row.style.setProperty("background-color", bg, "important");
        if (isSel) {
          row.style.setProperty("border-left", "3px solid " + TOK.success, "important");
        } else {
          row.style.removeProperty("border-left");
        }
        row.style.setProperty("color", TOK.text, "important");
      }

      function paintLockedMsg() {
        var lock = document.getElementById("locked-msg");
        if (!lock) return;
        lock.style.setProperty("display", "block", "important");
        lock.style.setProperty("background", TOK.surface, "important");
        lock.style.setProperty("background-color", TOK.surface, "important");
        lock.style.setProperty("color", TOK.text, "important");
        lock.style.setProperty("border", "1px solid " + TOK.border, "important");
        lock.style.setProperty("border-radius", "6px", "important");
        lock.style.setProperty("padding", "10px 14px", "important");
        lock.style.setProperty("margin", "8px 0 12px", "important");
        lock.style.setProperty("font-size", "12px", "important");
        lock.style.setProperty("line-height", "1.6", "important");
        // Sigils ([L], #, *) — gold accent
        lock.querySelectorAll("b").forEach(function (b) {
          b.style.setProperty("color", TOK.accent, "important");
          b.style.setProperty("background", "transparent", "important");
          b.style.setProperty("font-weight", "700", "important");
        });
        // Direct text nodes — light. We can't style text nodes, but we
        // can set color on the parent + all children.
        lock.style.setProperty("color", TOK.text, "important");
        lock.querySelectorAll("a").forEach(function (a) {
          a.style.setProperty("color", "#8ec4ff", "important"); // --ups-link
          a.style.setProperty("background", "transparent", "important");
        });
      }

      function sweepAll() {
        document.querySelectorAll(".add-drop-player-row").forEach(function (row) {
          paintRow(row, false);
        });
        paintLockedMsg();
      }

      // Initial sweep — handle anything already in the DOM
      sweepAll();

      // Periodic sweep for late-rendered rows. TOS finishes its DOM
      // injection within a few seconds; we keep sweeping for 30s to be
      // safe, then stop.
      var sweepInterval = setInterval(sweepAll, 750);
      setTimeout(function () { clearInterval(sweepInterval); }, 30000);

      // Delegated hover handlers — work for any row, even ones rendered
      // after we bind. Capture phase so we beat any TOS handlers.
      document.addEventListener("mouseover", function (e) {
        var row = e.target.closest && e.target.closest(".add-drop-player-row");
        if (row) paintRow(row, true);
      }, true);
      document.addEventListener("mouseout", function (e) {
        var row = e.target.closest && e.target.closest(".add-drop-player-row");
        if (row) paintRow(row, false);
      }, true);

      // Re-paint after any class change on a row (TOS toggles
      // .selected-player when user clicks Add/Deselect).
      if (window.MutationObserver) {
        var obs = new MutationObserver(function (records) {
          for (var i = 0; i < records.length; i += 1) {
            var t = records[i].target;
            if (t && t.classList && t.classList.contains("add-drop-player-row")) {
              paintRow(t, false);
            }
            // Newly-added rows too
            var added = records[i].addedNodes;
            for (var j = 0; j < added.length; j += 1) {
              var n = added[j];
              if (!n || n.nodeType !== 1) continue;
              if (n.classList && n.classList.contains("add-drop-player-row")) paintRow(n, false);
              else if (n.querySelectorAll) {
                n.querySelectorAll(".add-drop-player-row").forEach(function (r) { paintRow(r, false); });
              }
              if (n.id === "locked-msg") paintLockedMsg();
            }
          }
        });
        obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
        // Stop after 60s — TOS doesn't touch the DOM after that
        setTimeout(function () { try { obs.disconnect(); } catch (e) {} }, 60000);
      }
    }
  })();
  } // UPS_BB_GATE_END
</script>

  /* ── Native MFL page contrast repairs (Keith 2026-06-17) ───────────────────
     A few native pages render a single element light-on-light (invisible): the
     global light-text override applies, but that element kept a light background.
     Force BOTH a dark surface and light text on just those elements, scoped to
     their body_<route> id so no other page/element is affected (id-specificity
     also wins over the broad global rules regardless of source order). */

  body#body_lineup #lineup table.report tr.oddtablerow th,
  body#body_lineup #lineup table.report tr.oddtablerow td { background: var(--ups-row-odd, #111f35) !important; }
  body#body_lineup #lineup table.report tr.eventablerow th,
  body#body_lineup #lineup table.report tr.eventablerow td { background: var(--ups-row-even, #0f1b30) !important; }
  /* Links readable on the dark rows (player names carry MFL position colors). */

  /* Form controls (projection select, optional-message textarea). */

  /* Commish "Select A Franchise" gate on /lineup: it's a bare .reportform with a
     dropdown + submit (no lineup table). Make its text + button clearly visible
     so the page reads as intentional, not an empty dark void. */
  body#body_lineup #lineup form.reportform { color: var(--ups-text, #e8effa) !important; }
  body#body_lineup #lineup input[type="submit"],
  body#body_lineup #lineup input[type="button"] {
    background: var(--ups-accent, #f3b61f) !important;
    color: var(--ups-accent-ink, #0e1320) !important;

    padding: 0.4rem 0.85rem !important;

  /* The owner lineup TABLE lives inside <form> in a .mobile-wrap that MFL/
     light.css leaves WHITE — that white shows as the "blank" lineup area (the
     IR/Taxi tables sit in their own wrap and render dark over it, which is why
     only the lineup looked blank). Darken the form + wrap, and force the table +
     its rows shown in case anything leaves them inline-hidden. */
