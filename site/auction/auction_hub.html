<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auction Hub — UPS League</title>
<link rel="stylesheet" href="auction_hub.css?v=2026.07.26.v0.9.15">
</head>
<body>
<header class="ah-header">
  <h1>Auction Hub <span class="subtitle" id="ah-subtitle">UPS League · 2026</span>
    <button id="ah-version-badge" class="ah-version-badge" title="Click for module changelog">Loading…</button>
  </h1>
  <div class="meta" id="ah-meta">Loading…</div>
</header>

<!-- Top tabs = the two auctions (mirrors the mobile app). Sub-sections
     (Summary · Players · Lots · History · Tracker) render as pills below,
     and the whole body re-renders into #ah-content per (tab, sub). -->
<nav class="ah-tabs" id="ah-tabs">
  <button data-tab="faa" class="active">FA Auction</button>
  <button data-tab="era">Expired Rookie</button>
</nav>

<nav class="ah-subnav" id="ah-subnav" aria-label="Auction sections"></nav>

<main class="ah-main">
  <div class="ah-auction-banner" id="ah-banner" style="display:none;"></div>
  <div id="ah-content"><div class="ah-placeholder">Loading the auction hub…</div></div>
</main>

<script src="../shared/cap_math.js?v=2026.05.12.v1"></script>
<script src="../shared/player_profile_master.js?v=2026.05.12.v1"></script>
<script src="auction_hub.js?v=2026.07.26.v0.9.15"></script>
</body>
</html>
