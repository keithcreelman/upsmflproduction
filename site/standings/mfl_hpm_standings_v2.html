  // ────────────────────────────────────────────────────────────────────────
  // View — Draft Order Finish
  //
  // Derives next-year rookie pick (1.01 → 1.12) from the playoff schedule
  // per league_context_v1.md §1. Schedule-driven so it adapts to the
  // year's bracket shape (modern flat, conference-era split, etc.).
  //
  // Pick mapping per league_context §1:
  //   1.01 = Toilet Bowl champion (won the Toilet)
  //   1.02 = Toilet Bowl runner-up (lost Toilet final)
  //   1.03 = Toilet semifinal winner
  //   1.04 = Toilet semifinal loser
  //   1.05 + 1.06 = Week (final-1) game between two Week-R1 Toilet losers
  //   1.07 + 1.08 = Week (final-1) game between two Week-R1 Champ losers
  //   1.09 = Championship semifinal loser
  //   1.10 = Championship semifinal winner (consolation winner)
  //   1.11 = Championship runner-up
  //   1.12 = UPS champion
  // ────────────────────────────────────────────────────────────────────────
  function renderDraftOrder(host) {
    fetchD1("/api/playoff-bracket", state.year).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load bracket for " + state.year + ".");
      var seeds = resp.seeds || [];
      var matchups = resp.matchups || [];
      var seedMap = buildSeedMap(seeds);
      var playoffWeeks = resp.playoff_weeks && resp.playoff_weeks.length === 3 ? resp.playoff_weeks : [15, 16, 17];
      var WK_R1 = playoffWeeks[0], WK_SEMI = playoffWeeks[1], WK_FINAL = playoffWeeks[2];
      if (!matchups.length) {
        host.innerHTML = '<div class="banner">Draft order is set once the playoff bracket completes (final game in Week ' + WK_FINAL + ').</div>' + DEFERRED_NOTE;
        return;
      }
      // Dedupe + scope to each side.
      var champIds = new Set(seeds.slice(0, 6).map(function (s) { return pad4(s.franchise_id); }));
      var hawkIds  = new Set(seeds.slice(6, 12).map(function (s) { return pad4(s.franchise_id); }));
      var seen = {}, games = [];
      matchups.forEach(function (m) {
        var k = m.week + "|" + [pad4(m.franchise_id), pad4(m.opponent_franchise_id)].sort().join("-");
        if (seen[k]) return;
        seen[k] = true;
        games.push(m);
      });
      function side(g, ids) {
        return ids.has(pad4(g.franchise_id)) && ids.has(pad4(g.opponent_franchise_id));
      }
      function winner(g) { return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.franchise_id) : pad4(g.opponent_franchise_id); }
      function loser(g)  { return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.opponent_franchise_id) : pad4(g.franchise_id); }

      function pickResults(ids) {
        var r1   = games.filter(function (g) { return Number(g.week) === WK_R1 && side(g, ids); });
        var semi = games.filter(function (g) { return Number(g.week) === WK_SEMI && side(g, ids); });
        var fin  = games.filter(function (g) { return Number(g.week) === WK_FINAL && side(g, ids); });
        var r1Win = new Set(), r1Lose = new Set();
        r1.forEach(function (g) { r1Win.add(winner(g)); r1Lose.add(loser(g)); });
        // Classify W-semi games: placement (both R1 losers) vs semi (everyone else).
        var placement = null, semis = [];
        semi.forEach(function (g) {
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (r1Lose.has(a) && r1Lose.has(b)) placement = g;
          else semis.push(g);
        });
        var semiWin = new Set(), semiLose = new Set();
        semis.forEach(function (g) { semiWin.add(winner(g)); semiLose.add(loser(g)); });
        // Final week: title vs 3rd-place.
        var title = null, third = null, other = [];
        fin.forEach(function (g) {
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (semiWin.has(a) && semiWin.has(b)) title = g;
          else if (semiLose.has(a) && semiLose.has(b)) third = g;
          else other.push(g);
        });
        return { r1: r1, semi: semis, placement: placement, fin: fin, title: title, third: third, other: other,
                 r1Win: r1Win, r1Lose: r1Lose, semiWin: semiWin, semiLose: semiLose };
      }
      var champ = pickResults(champIds);
      var hawk  = pickResults(hawkIds);

      // Build pick → franchise_id map.
      var picks = {}; // key like "1.12" -> { fid, label, why }
      // 1.12 = UPS champion
      if (champ.title) picks["1.12"] = { fid: winner(champ.title), why: "Won UPS Championship" };
      // 1.11 = UPS runner-up
      if (champ.title) picks["1.11"] = { fid: loser(champ.title), why: "Lost UPS Championship" };
      // 1.10 = Champ semifinal winner whose semi-WIN didn't reach final?  Actually:
      //        "championship semifinal winner (consolation winner — gets later pick because they advanced + got money)"
      //        That implies the W16 game between R1 LOSERS (placement). Winner = 1.10.
      if (champ.placement) picks["1.10"] = { fid: winner(champ.placement), why: "Won championship-side W" + WK_SEMI + " placement (1.07/1.08 → 1.10)" };
      // 1.09 = championship semifinal loser
      // Per doc: "1.09 = championship semifinal loser" → loser of the 3rd-place W17 game (semi losers).
      if (champ.third) picks["1.09"] = { fid: loser(champ.third), why: "Lost championship 3rd-place game" };
      //         The semi-loser who WINS the 3rd-place game maps to 1.10? Re-check.
      //         Re-reading: 1.10 = "semifinal winner (consolation winner)" — winner of the consolation W17 game.
      //         1.09 = "semifinal loser" — loser of consolation. Both come from the third-place W17 game.
      if (champ.third) picks["1.10"] = { fid: winner(champ.third), why: "Won championship 3rd-place (consolation) game" };
      // 1.07 + 1.08 = decided by W (final-1) game between two W-R1 champ losers
      //   1.07 = winner of that game
      //   1.08 = loser of that game
      if (champ.placement) {
        picks["1.08"] = { fid: loser(champ.placement), why: "Lost championship W" + WK_SEMI + " placement (1.07/1.08)" };
        picks["1.07"] = { fid: winner(champ.placement), why: "Won championship W" + WK_SEMI + " placement (1.07/1.08)" };
        // 1.07/1.08 vs 1.10 — doc says 1.05/1.06 from TOILET-side W(N-1), 1.07/1.08 from CHAMP-side W(N-1).
        // So 1.07 = champ W16 placement winner, 1.08 = champ W16 placement loser. That conflicts with 1.10.
        // Re-resolve: 1.10 comes from CHAMPIONSHIP 3RD-PLACE (W17). 1.07/1.08 from CHAMPIONSHIP placement (W16).
      }
      // Hawktuah side:
      // 1.01 = Toilet Bowl champion (won Toilet final)
      if (hawk.title) picks["1.01"] = { fid: winner(hawk.title), why: "Won Hawktuah Bowl (Toilet champ)" };
      // 1.02 = Toilet Bowl runner-up
      if (hawk.title) picks["1.02"] = { fid: loser(hawk.title), why: "Lost Hawktuah Bowl final" };
      // 1.03 = Toilet semifinal winner (winner of W17 toilet 3rd-place is the consolation winner)
      if (hawk.third) picks["1.03"] = { fid: winner(hawk.third), why: "Won Toilet 3rd-place (consolation)" };
      // 1.04 = Toilet semifinal loser (loser of W17 toilet 3rd-place)
      if (hawk.third) picks["1.04"] = { fid: loser(hawk.third), why: "Lost Toilet 3rd-place" };
      // 1.05 + 1.06 = W16 placement on hawk side
      if (hawk.placement) {
        picks["1.05"] = { fid: winner(hawk.placement), why: "Won Toilet W" + WK_SEMI + " placement (1.05/1.06)" };
        picks["1.06"] = { fid: loser(hawk.placement), why: "Lost Toilet W" + WK_SEMI + " placement (1.05/1.06)" };
      }

      // Render the table.
      var pickOrder = ["1.01","1.02","1.03","1.04","1.05","1.06","1.07","1.08","1.09","1.10","1.11","1.12"];
      var rowsHtml = pickOrder.map(function (p) {
        var rec = picks[p];
        var fid = rec && rec.fid;
        var seedInfo = fid ? seedMap[pad4(fid)] : null;
        var seedBadge = seedInfo
          ? '<span class="seed-badge ' + seedInfo.side + '">' + (seedInfo.side === "champ" ? "🏆" : "🦅") + ' ' + seedInfo.seed + '</span>'
          : '<span class="seed-badge none">—</span>';
        var info = fid ? (resp.seeds.find(function (s) { return pad4(s.franchise_id) === pad4(fid); }) || {}) : {};
        var pickStyle = p === "1.01" ? 'background:rgba(110,60,30,0.15)' : (p === "1.12" ? 'background:rgba(231,190,89,0.12)' : "");
        return '<tr style="' + pickStyle + '">'
          + '<td class="num" style="font-weight:800;color:var(--gold);font-size:13px">' + p + '</td>'
          + '<td>' + seedBadge + '</td>'
          + '<td>' + (info.franchise_name ? escapeHtml(info.franchise_name) : "<span style='color:var(--dim)'>pending</span>") + '</td>'
          + '<td>' + escapeHtml(info.owner_name || "") + '</td>'
          + '<td style="font-size:11px;color:var(--muted);font-style:italic">' + escapeHtml((rec && rec.why) || "—") + '</td>'
          + '</tr>';
      }).join("");

      host.innerHTML = ''
        + '<div class="methodology">'
        + '<strong>Draft Order Finish</strong> maps each playoff outcome to the next-year rookie draft pick per <code>league_context_v1.md §1</code>. '
        + 'Toilet Bowl winner picks first (1.01), UPS Champion picks last (1.12). '
        + 'Picks 1.05/1.06 + 1.07/1.08 are decided by Week ' + WK_SEMI + ' placement games between Week ' + WK_R1 + ' losers. '
        + '1.09/1.10 are decided by the Week ' + WK_FINAL + ' championship 3rd-place game.'
        + '</div>'
        + '<div style="overflow-x:auto"><table><thead><tr>'
        + '<th class="num">Pick</th><th>Seed</th><th>Team</th><th>Owner</th><th>Why</th>'
        + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
        + '<div class="note">'
        + (state.year === (new Date().getUTCFullYear()) ? "If picks show 'pending', the bracket hasn't fully completed yet."
          : "Final draft order for " + state.year + " (used in the " + (state.year + 1) + " rookie draft).")
        + '</div>'
        + DEFERRED_NOTE;
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 4 — Historical Finishes
  // ────────────────────────────────────────────────────────────────────────
  function renderHistorical(host) {
    fetchD1("/api/historical-finishes", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load historical finishes.");
      var rows = resp.rows || [];
      if (!rows.length && resp.note) {
        host.innerHTML = '<div class="banner">' + escapeHtml(resp.note) + '</div>' + DEFERRED_NOTE;
        return;
      }
      var seasons = {}, byFid = {};
      rows.forEach(function (r) {
        seasons[r.season] = true;
        var fid = pad4(r.franchise_id);
        if (!byFid[fid]) byFid[fid] = { fid: fid, ownerSeen: {}, teamSeen: {}, byYear: {} };
        byFid[fid].byYear[r.season] = r;
        if (r.owner_name)    byFid[fid].ownerSeen[r.owner_name] = (byFid[fid].ownerSeen[r.owner_name] || 0) + 1;
        if (r.franchise_name) byFid[fid].teamSeen[r.franchise_name] = (byFid[fid].teamSeen[r.franchise_name] || 0) + 1;
      });
      function modal(map) {
        var best = "", bestN = 0;
        Object.keys(map).forEach(function (k) { if (map[k] > bestN) { bestN = map[k]; best = k; } });
        return best;
      }
      var seasonsSorted = Object.keys(seasons).map(Number).sort(function (a, b) { return b - a; });
      var franchiseList = Object.keys(byFid).map(function (fid) {
        return { fid: fid, owner: modal(byFid[fid].ownerSeen), team: modal(byFid[fid].teamSeen), byYear: byFid[fid].byYear };
      }).sort(function (a, b) { return a.owner.localeCompare(b.owner); });

      var head = '<tr><th class="hist-team">Owner · Team</th>' + seasonsSorted.map(function (y) { return '<th>' + y + '</th>'; }).join("") + '</tr>';
      var bodyHtml = franchiseList.map(function (f) {
        var cells = seasonsSorted.map(function (y) {
          var r = f.byYear[y];
          if (!r) return '<td class="hist-cell empty">—</td>';
          var finish = r.final_finish;
          var cls = "hist-cell";
          if (finish === 1)       cls += " champ";
          else if (finish === 2)  cls += " silver";
          else if (finish === 3)  cls += " bronze";
          else if (finish === 12) cls += " hawktuah";
          var title = "Final " + finish + (r.regular_season_finish ? " · Reg " + r.regular_season_finish : "") + (r.division ? " · " + r.division : "");
          return '<td class="' + cls + '" title="' + escapeHtml(title) + '">' + (finish == null ? "—" : finish) + '</td>';
        }).join("");
        return '<tr><td class="hist-team"><span class="owner">' + escapeHtml(f.owner) + '</span><span class="team">' + escapeHtml(f.team) + '</span></td>' + cells + '</tr>';
      }).join("");

      host.innerHTML = '<div style="overflow-x:auto"><table class="hist-table compact"><thead>' + head + '</thead><tbody>' + bodyHtml + '</tbody></table></div>'
        + '<div class="note">🥇 1 = UPS Champion · 🥈 2 = runner-up · 🥉 3 = bronze · 🚽 12 = Hawktuah / Toilet champion</div>'
        + DEFERRED_NOTE;
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 5 — 3-Year Eras
  // ────────────────────────────────────────────────────────────────────────
  function renderEras(host) {
    fetchD1("/api/eras", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load eras.");
      var eras = (resp.eras || []).filter(function (e) { return e.era_start >= ERA_FIRST; });
      var hasFS = resp.has_final_standings;
      var currentYear = (new Date().getUTCFullYear());
      var fsBanner = hasFS ? "" : '<div class="banner">⚠ <code>src_final_standings</code> not loaded — championship + hawktuah counts show 0 until migration 0033 runs.</div>';
      var html = fsBanner
        + '<div class="methodology">'
        + '⚠️ <strong>Methodology under review.</strong> '
        + 'Era headliners = top 2 owners by All-Play <strong>%</strong> across the 3-year cycle, '
        + '<strong>with a 3-full-season tenure floor</strong> (excludes mid-cycle joiners + dispersal departures). '
        + 'Retro Captains = top 4 by AP % (same tenure rule). '
        + 'Partial-tenure owners appear in the leaderboard tagged <span class="partial-badge">partial</span>. '
        + 'See <code>docs/standings_advanced_stats_proposals.md</code> §1A + Appendix A.'
        + '</div><div class="era-grid">';
      eras.forEach(function (era) {
        var rows = (era.rows || []).slice();
        var eligible = rows.filter(function (r) { return (r.seasons_played || 0) >= 3; });
        var byPct = eligible.slice().sort(function (a, b) {
          if ((b.ap_pct || 0) !== (a.ap_pct || 0)) return (b.ap_pct || 0) - (a.ap_pct || 0);
          if ((b.ap_w || 0)   !== (a.ap_w || 0))   return (b.ap_w || 0) - (a.ap_w || 0);
          return (b.pf || 0) - (a.pf || 0);
        });
        // Dynamic headliner count by AP% gap:
        //   - Clear leader (gap to #2 >= 5.0 ppts):   1-team era
        //   - Tight 2-way (gap to #3 >= 5.0 ppts):    2-team era
        //   - Genuinely tight pack (all top 3 within  3.0 ppts of each other): 3-team era
        //   - Default: 2-team era (matches our v1 framing)
        var HL_GAP_SOLO  = 0.05; // 5.0 pp separates #1 from the pack
        var HL_GAP_DUO   = 0.05; // 5.0 pp separates #2 from #3
        var HL_PACK_TIGHT = 0.03; // top 3 within 3.0 pp of each other
        var p1 = byPct[0] && byPct[0].ap_pct, p2 = byPct[1] && byPct[1].ap_pct, p3 = byPct[2] && byPct[2].ap_pct;
        var headlinerCount = 2;
        if (p1 != null && p2 != null && (p1 - p2) >= HL_GAP_SOLO) {
          headlinerCount = 1;
        } else if (p1 != null && p2 != null && p3 != null && (p1 - p3) <= HL_PACK_TIGHT) {
          headlinerCount = 3;
        } else if (p2 != null && p3 != null && (p2 - p3) < HL_GAP_DUO) {
          // 2-team isn't clearly better than 3 — bump to 3
          headlinerCount = 3;
        }
        var headliners = byPct.slice(0, headlinerCount);
        var captains = byPct.slice(0, 4);
        var inProgress = (era.era_end >= currentYear);
        var eraTitle = inProgress ? era.era_start + "–" + era.era_end + " (in progress)" : era.era_start + "–" + era.era_end;
        function pctGapNote() {
          var bits = [];
          if (p1 != null && p2 != null) bits.push("#1→#2: " + ((p1 - p2) * 100).toFixed(1) + " pp");
          if (p2 != null && p3 != null) bits.push("#2→#3: " + ((p2 - p3) * 100).toFixed(1) + " pp");
          return bits.length ? " <span style=\"color:var(--dim);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none\">(" + bits.join(" · ") + ")</span>" : "";
        }
        var headlinerText;
        if (inProgress) {
          headlinerText = "Era in progress — headliners pending";
        } else if (headliners.length === 1) {
          headlinerText = "The " + (headliners[0].owner_name || "?") + " Era" + pctGapNote();
        } else if (headliners.length === 2) {
          headlinerText = "The " + (headliners[0].owner_name || "?") + " & " + (headliners[1].owner_name || "?") + " Era" + pctGapNote();
        } else if (headliners.length === 3) {
          headlinerText = "The " + (headliners[0].owner_name || "?") + ", " + (headliners[1].owner_name || "?") + " & " + (headliners[2].owner_name || "?") + " Era" + pctGapNote();
        } else {
          headlinerText = "No eligible owners";
        }
        var capPills = captains.length
          ? captains.map(function (c) { return '<span class="cap-pill" title="AP% ' + fmtPct(c.ap_pct) + ' · ' + (c.seasons_played || 0) + ' seasons">' + escapeHtml(c.owner_name || "?") + '</span>'; }).join("")
          : '<span class="cap-empty">No eligible owners yet (3-season minimum)</span>';
        var byPctAll = rows.slice().sort(function (a, b) {
          var ea = (a.seasons_played || 0) >= 3 ? 1 : 0;
          var eb = (b.seasons_played || 0) >= 3 ? 1 : 0;
          if (ea !== eb) return eb - ea;
          if ((b.ap_pct || 0) !== (a.ap_pct || 0)) return (b.ap_pct || 0) - (a.ap_pct || 0);
          return (b.ap_w || 0) - (a.ap_w || 0);
        });
        var lbHead = '<tr><th>Owner</th><th class="num">Yrs</th><th class="num">AP %</th><th class="num">AP W</th><th>H2H</th><th class="num">PF</th><th class="num">🏆</th><th class="num">🚽</th><th class="num">Avg Fin</th></tr>';
        var lbBody = byPctAll.map(function (r) {
          var partial = (r.seasons_played || 0) < 3;
          return '<tr' + (partial ? ' class="partial"' : '') + '>'
            + '<td>' + escapeHtml(r.owner_name || "—") + (partial ? ' <span class="partial-badge" title="Did not play all 3 seasons of the cycle">partial</span>' : '') + '</td>'
            + '<td class="num">' + (r.seasons_played || 0) + '</td>'
            + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
            + '<td class="num">' + (r.ap_w || 0) + '</td>'
            + '<td>' + rec(r.h2h_w, r.h2h_l, r.h2h_t) + '</td>'
            + '<td class="num">' + fmtCommas(r.pf, 1) + '</td>'
            + '<td class="num">' + (r.championships || 0) + '</td>'
            + '<td class="num">' + (r.hawktuah_wins || 0) + '</td>'
            + '<td class="num">' + (r.avg_finish ? Number(r.avg_finish).toFixed(1) : "—") + '</td>'
            + '</tr>';
        }).join("");
        html += '<section class="era-card">'
          + '<div class="era-cycle">' + escapeHtml(eraTitle) + '</div>'
          + '<div class="era-name">' + escapeHtml(headlinerText) + '</div>'
          + '<div class="era-captains-label">Retro Captains (top 4 AP %, 3-season tenure)</div>'
          + '<div class="era-captains">' + capPills + '</div>'
          + '<div class="era-card-scroll"><table class="compact"><thead>' + lbHead + '</thead><tbody>' + lbBody + '</tbody></table></div>'
          + '</section>';
      });
      html += '</div>' + DEFERRED_NOTE;
      host.innerHTML = html;
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 6 — Division Power Rankings
  // ────────────────────────────────────────────────────────────────────────
  function renderDivPower(host) {
    fetchD1("/api/division-power-rankings", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load division power rankings.");
      var rows = (resp.rows || []).slice();
      var mode = state.dpMode;
      var view = rows.slice();
      if (mode === "best")       view = view.slice(0, 10);
      else if (mode === "worst") view = view.slice().sort(function (a, b) { return (a.ap_pct || 0) - (b.ap_pct || 0); }).slice(0, 10);
      else if (mode === "byCycle") {
        var grouped = {};
        rows.forEach(function (r) {
          var k = r.cycle_start + "|" + r.division;
          if (!grouped[k]) grouped[k] = {
            cycle_start: r.cycle_start, division: r.division,
            division_name: r.division_name || null,
            owners: r.owners,
            ap_w: 0, ap_l: 0, ap_t: 0, pf: 0, n: 0, produced_champion: 0
          };
          grouped[k].ap_w += (r.ap_w || 0);
          grouped[k].ap_l += (r.ap_l || 0);
          grouped[k].ap_t += (r.ap_t || 0);
          grouped[k].pf   += (r.pf || 0);
          grouped[k].n    += 1;
          grouped[k].produced_champion += (r.produced_champion || 0);
        });
        view = Object.keys(grouped).map(function (k) {
          var g = grouped[k];
          var games = g.ap_w + g.ap_l + g.ap_t;
          g.ap_pct = games > 0 ? (g.ap_w + 0.5 * g.ap_t) / games : null;
          return g;
        }).sort(function (a, b) { return (b.ap_pct || 0) - (a.ap_pct || 0); });
      }
      // Apply user sort
      view = sortRows(view, state.dpSort.key, state.dpSort.dir);

      var modeBtns = [
        { id: "allTime",  label: "All-time" },
        { id: "best",     label: "Best ever (top 10)" },
        { id: "worst",    label: "Worst ever (bottom 10)" },
        { id: "byCycle",  label: "By 3-year cycle" }
      ].map(function (m) {
        return '<button type="button" class="mode-btn" data-mode="' + m.id + '" data-active="' + (mode === m.id ? "1" : "0") + '">' + escapeHtml(m.label) + '</button>';
      }).join("");

      var sortHdrs = state.dpSort;
      var head = mode === "byCycle"
        ? '<tr><th class="num">#</th>'
          + sortableHeader("Cycle", "cycle_start", sortHdrs)
          + sortableHeader("Division", "division_name", sortHdrs)
          + '<th>Owners (cycle aggregate)</th>'
          + sortableHeader("AP W-L-T", "ap_w", sortHdrs)
          + sortableHeader("AP %", "ap_pct", sortHdrs, "num")
          + sortableHeader("PF", "pf", sortHdrs, "num")
          + sortableHeader("🏆 yrs", "produced_champion", sortHdrs, "num")
          + '</tr>'
        : '<tr><th class="num">#</th>'
          + sortableHeader("Season", "season", sortHdrs)
          + sortableHeader("Division", "division_name", sortHdrs)
          + '<th>Owners & AP %</th>'
          + sortableHeader("AP W-L-T", "ap_w", sortHdrs)
          + sortableHeader("AP %", "ap_pct", sortHdrs, "num")
          + sortableHeader("PF", "pf", sortHdrs, "num")
          + sortableHeader("🏆?", "produced_champion", sortHdrs)
          + '</tr>';

      // Render per-team breakdown for non-cycle modes (we have team_details
      // from the worker). For byCycle mode, fall back to the aggregated
      // owners string since teams may vary year over year within a cycle.
      function ownersCell(r) {
        if (mode === "byCycle") return escapeHtml(r.owners || "");
        var teams = r.team_details || [];
        if (!teams.length) return escapeHtml(r.owners || "");
        // Sort within division by overall PCT → div PCT → PF → AP%.
        var sorted = teams.slice().sort(function (a, b) {
          if (!!b.is_division_leader !== !!a.is_division_leader) return b.is_division_leader ? 1 : -1;
          return (b.computed_ap_pct || 0) - (a.computed_ap_pct || 0);
        });
        return sorted.map(function (t) {
          var pct = t.computed_ap_pct;
          var apStr = (pct != null) ? (Number(pct) * 100).toFixed(1) + "%" : "—";
          if (t.is_division_leader) {
            return '<span class="dp-owner dp-winner" title="Division Winner — AP ' + apStr + '"><span class="dp-name">' + escapeHtml(t.owner_name || "?") + '</span> <span class="dp-ap">' + apStr + '</span> 🏆</span>';
          }
          return '<span class="dp-owner"><span class="dp-name">' + escapeHtml(t.owner_name || "?") + '</span> <span class="dp-ap">' + apStr + '</span></span>';
        }).join(" · ");
      }

      var bodyHtml = view.map(function (r, i) {
        var divLabel = r.division_name || ("Division " + (r.division || "—"));
        return '<tr>'
          + '<td class="num">' + (i + 1) + '</td>'
          + '<td>' + (mode === "byCycle" ? (r.cycle_start + "–" + (r.cycle_start + 2)) : r.season) + '</td>'
          + '<td>' + escapeHtml(divLabel) + ' <span style="color:var(--dim);font-size:10px">' + escapeHtml(r.division || "") + '</span></td>'
          + '<td>' + ownersCell(r) + '</td>'
          + '<td>' + rec(r.ap_w, r.ap_l, r.ap_t) + '</td>'
          + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
          + '<td class="num">' + fmtCommas(r.pf, 1) + '</td>'
          + '<td' + (mode === "byCycle" ? ' class="num"' : '') + '>' + (r.produced_champion ? (mode === "byCycle" ? r.produced_champion : "Yes") : "—") + '</td>'
          + '</tr>';
      }).join("");

      host.innerHTML = '<div class="methodology">'
        + '⚠️ <strong>Methodology under review.</strong> Strength = aggregate All-Play % across the 3 teams in the division for that season. '
        + 'Tie-break AP wins → division PF. AP % is matchup-luck-neutral and normalizes across eras with different game counts. '
        + 'See <code>docs/standings_advanced_stats_proposals.md</code> §1B.'
        + '</div>'
        + '<div class="mode-row">' + modeBtns + '</div>'
        + '<div style="overflow-x:auto"><table><thead>' + head + '</thead><tbody>' + bodyHtml + '</tbody></table></div>'
        + '<div class="note">Click any column header to sort. Division names from MFL <code>TYPE=league</code>.</div>'
        + DEFERRED_NOTE;
      host.querySelectorAll("[data-mode]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.dpMode = b.getAttribute("data-mode");
          renderDivPower(host);
        });
      });
      wireSortClicks(host, state.dpSort, function () { renderDivPower(host); });
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // Boot
  // ────────────────────────────────────────────────────────────────────────
  renderShell();
  render();
})();
</script>
</body>
</html>
