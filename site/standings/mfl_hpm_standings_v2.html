      + '<label class="seg"><span class="seg-label">Season:</span><select id="bracketYear" class="team-select" aria-label="Bracket season">'
      + years.map(function (v) { return '<option value="' + v + '"' + (v === y ? " selected" : "") + '>' + v + '</option>'; }).join("") + '</select></label>'
      + (prev ? '<button type="button" class="mode-btn" data-byear="' + prev + '" aria-label="Show the ' + prev + ' bracket">◀ ' + prev + '</button>' : '')
      + (next ? '<button type="button" class="mode-btn" data-byear="' + next + '" aria-label="Show the ' + next + ' bracket">' + next + ' ▶</button>' : '')
      + '</div>';
  }
  function wireBracketBar(host) {
    var sel = host.querySelector("#bracketYear");
    if (sel) sel.addEventListener("change", function () { setYear(parseInt(sel.value, 10)); });
    host.querySelectorAll("[data-byear]").forEach(function (b) {
      b.addEventListener("click", function () { setYear(parseInt(b.getAttribute("data-byear"), 10)); });
    });
  }
  function renderBracket(host) {
    // Every outcome (a bracket, a projection, the seeds so far, an error) paints under the season picker, so another
    // year is always one click away.
    var paint = function (html) { host.innerHTML = bracketBarHtml() + html; wireBracketBar(host); };
    // F1 (Phase II-A2 correction pass): /api/playoff-bracket is the ONLY
    // required request — /api/standings (fetched separately, below, and
    // only in the projected branch) is purely cosmetic (the "through
    // Week N" banner suffix) and its failure must never block a valid
    // actual OR projected bracket.
    return fetchD1("/api/playoff-bracket", state.year).then(function (resp) {
      if (!resp || !resp.ok) return paint('<div class="err" role="alert">Couldn’t load the ' + escapeHtml(String(state.year)) + ' bracket. <button type="button" class="retry-btn" data-retry="1">Try again</button></div>');
      var seeds = resp.seeds || [];
      var matchups = resp.matchups || [];
      // F9 (Phase II-A2 correction pass): the ONE shared gating decision
      // — window.UPS_STANDINGS_RACE.projectionMode() — replaces this
      // page's own ad hoc "!matchups.length && !season_complete" check;
      // mobile's renderPlayoffsMode consumes the identical helper.
      var mode = (window.UPS_STANDINGS_RACE && window.UPS_STANDINGS_RACE.projectionMode)
        ? window.UPS_STANDINGS_RACE.projectionMode({ seasonComplete: resp.season_complete, matchups: matchups, seeds: seeds })
        : (matchups.length ? "actual" : "unavailable");
      if (mode === "projected") {
        var proj = window.UPS_STANDINGS_RACE.projectChalkBracket(seeds);
        // Non-fatal standings fetch, purely for the banner's week number.
        // A rejection (network/HTTP error — fetchD1 rejects on either)
        // resolves to null here rather than propagating, so it can never
        // replace this valid projected bracket with the generic fetch-
        // error view; projectedBannerText(null) degrades to bare
        // "PROJECTED" (projectedBannerText() is null-safe).
        return fetchD1("/api/standings", state.year).catch(function () { return null; }).then(function (stdResp) {
          var champByes = seeds.filter(function (s) { return Number(s.seed) === 1 || Number(s.seed) === 2; });
          var hawkByes = seeds.filter(function (s) { return Number(s.seed) === 7 || Number(s.seed) === 8; });
          var banner = '<div class="banner">' + escapeHtml(projectedBannerText(stdResp)) + ' — chalk (higher seed wins every game). Locks for real once Week 15 kicks off.</div>';
          paint(banner
            + renderProjectedBracketSide("UPS Championship — seeds 1-6", proj.champ, champByes, false)
            + renderProjectedBracketSide("Hawk Tuah Bowl — seeds 7-12", proj.hawk, hawkByes, true)
            + '<div class="note">Modern bracket: top 2 division winners earn seeds 1-2 (BYE). Wild cards = top 2 non-DW by AP%. This projection assumes the higher seed wins every remaining game — a real bracket routinely does not.</div>'
            + DEFERRED_NOTE);
        });
      }
      if (mode !== "actual") {
        // Preseason / partial season / invalid seeds — honest seed-table
        // fallback, never a fabricated or broken bracket. A finished season with no playoff games on record says so
        // (it never says the bracket "locks Week 15").
        paint((resp.season_complete
          ? '<div class="banner">No playoff games are on record for ' + escapeHtml(String(state.year)) + ', so the bracket can’t be drawn. Seeds:</div>'
          : '<div class="banner">Bracket locks Week 15. Seeds so far:</div>') + renderSeedTable(seeds, !resp.season_complete) + DEFERRED_NOTE);
        return;
      }
      // mode === "actual": real results exist. Everything from here down
      // is the pre-A2 real-results rendering path, untouched, and never
      // dependent on /api/standings.
      var seedMap = buildSeedMap(seeds);
      var champSeeds = seeds.slice(0, 6);
      var hawkSeeds  = seeds.slice(6, 12);
      // Older seasons' schedule rows can arrive without team names; the seeds always carry them.
      var seedNames = {}, seedOwners = {};
      seeds.forEach(function (s) { seedNames[pad4(s.franchise_id)] = s.franchise_name; seedOwners[pad4(s.franchise_id)] = s.owner_name; });

      // Playoff week range (varies by era — 2011-2021: W14-16; 2022+: W15-17).
      var playoffWeeks = resp.playoff_weeks && resp.playoff_weeks.length === 3
        ? resp.playoff_weeks
        : [15, 16, 17];
      var WK_R1 = playoffWeeks[0];
      var WK_SEMI = playoffWeeks[1];
      var WK_FINAL = playoffWeeks[2];

      // Dedupe matchups by (week, sorted-franchise-pair).
      var games = [];
      var seenPair = {};
      matchups.forEach(function (m) {
        var pair = m.week + "|" + [pad4(m.franchise_id), pad4(m.opponent_franchise_id)].sort().join("-");
        if (seenPair[pair]) return;
        seenPair[pair] = true;
        games.push(m);
      });

      function winnerId(g) {
        if (!g) return null;
        return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.franchise_id) : pad4(g.opponent_franchise_id);
      }
      function loserId(g) {
        if (!g) return null;
        return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.opponent_franchise_id) : pad4(g.franchise_id);
      }

      // Schedule-driven side builder.
      function buildSide(sideSeeds, hawk) {
        var sideIds = {};
        sideSeeds.forEach(function (s) { sideIds[pad4(s.franchise_id)] = s; });

        var byWeek = {};
        byWeek[WK_R1] = []; byWeek[WK_SEMI] = []; byWeek[WK_FINAL] = [];
        games.forEach(function (g) {
          if (byWeek[g.week] == null) return;
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (sideIds[a] && sideIds[b]) byWeek[g.week].push(g);
        });

        var r1Games = byWeek[WK_R1];
        var w16Games = byWeek[WK_SEMI];
        var w17Games = byWeek[WK_FINAL];

        // R1 winners + losers
        var r1Winners = {}, r1Losers = {};
        r1Games.forEach(function (g) {
          var w = winnerId(g), l = loserId(g);
          if (w) r1Winners[w] = g;
          if (l) r1Losers[l] = g;
        });

        // Byes = side seeds NOT in W15 but participating in W16
        var w15Participants = {};
        r1Games.forEach(function (g) {
          w15Participants[pad4(g.franchise_id)] = true;
          w15Participants[pad4(g.opponent_franchise_id)] = true;
        });
        var w16Participants = {};
        w16Games.forEach(function (g) {
          w16Participants[pad4(g.franchise_id)] = true;
          w16Participants[pad4(g.opponent_franchise_id)] = true;
        });
        var byes = sideSeeds.filter(function (s) {
          var id = pad4(s.franchise_id);
          return !w15Participants[id] && w16Participants[id];
        });

        // Classify W16 games:
        //   - "placement" = both participants lost in R1 (i.e., both in r1Losers)
        //   - "semi"      = anything else (one or both was a R1 winner or bye)
        var placementGame = null;
        var semiGames = [];
        w16Games.forEach(function (g) {
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (r1Losers[a] && r1Losers[b]) placementGame = g;
          else semiGames.push(g);
        });

        // W16 semi winners → final; W16 semi losers → 3rd-place game
        var semiWinners = {};
        var semiLosers = {};
        semiGames.forEach(function (g) {
          var w = winnerId(g), l = loserId(g);
          if (w) semiWinners[w] = g;
          if (l) semiLosers[l] = g;
        });

        // Classify W17:
        //   - "final"   = both participants are semi winners
        //   - "thirdPlace" = both participants are semi losers
        //   - "other"   = anything else (rare; show as consolation)
        var finalGame = null, thirdPlaceGame = null, otherW17 = [];
        w17Games.forEach(function (g) {
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (semiWinners[a] && semiWinners[b]) finalGame = g;
          else if (semiLosers[a] && semiLosers[b]) thirdPlaceGame = g;
          else otherW17.push(g);
        });

        var champFid = winnerId(finalGame);

        return {
          hawk: hawk,
          byes: byes,
          r1Games: r1Games,
          semiGames: semiGames,
          placementGame: placementGame,
          finalGame: finalGame,
          thirdPlaceGame: thirdPlaceGame,
          otherW17: otherW17,
          champFid: champFid
        };
      }

      function teamRow(fid, name, score, isWinner) {
        var seedInfo = fid ? seedMap[pad4(fid)] : null;
        var seedNum = seedInfo ? seedInfo.seed : null;
        return '<div class="matchup-team ' + (isWinner ? "winner" : (score == null ? "" : "loser")) + '">'
          + (seedNum != null ? '<span class="matchup-seed">#' + seedNum + '</span>' : '<span class="matchup-seed unranked">—</span>')
          + '<span class="matchup-name">' + escapeHtml(name || (fid ? seedNames[pad4(fid)] : null) || (fid || "?")) + '</span>'
          + '<span class="matchup-score">' + (score == null ? "—" : fmtDec(score)) + '</span>'
          + '</div>';
      }
      function byeCard(seed) {
        return '<div class="matchup bye">'
          + '<div class="matchup-team bye-row">'
          + '<span class="matchup-seed">#' + seed.seed + '</span>'
          + '<span class="matchup-name" style="text-transform:none;font-style:normal;color:var(--muted);font-size:11px">' + escapeHtml(seed.franchise_name || seed.franchise_id) + '</span>'
          + '<span style="font-size:9px;letter-spacing:0.1em;color:var(--gold)">BYE</span>'
          + '</div></div>';
      }
      function gameCard(game) {
        if (!game) {
          return '<div class="matchup"><div class="matchup-team bye-row" style="color:var(--dim)">pending</div></div>';
        }
        var aScore = Number(game.team_score || 0);
        var bScore = Number(game.opponent_score || 0);
        var aWon = aScore > bScore;
        return '<div class="matchup">'
          + teamRow(game.franchise_id, game.franchise_name, aScore, aWon)
          + teamRow(game.opponent_franchise_id, game.opponent_franchise_name, bScore, !aWon && bScore > 0)
          + '</div>';
      }
      function gameCardLabeled(label, game) {
        return '<div><div class="round-label" style="margin-bottom:4px">' + escapeHtml(label) + '</div>' + gameCard(game) + '</div>';
      }

      function renderSide(label, side, hawk) {
        // Round 1 column: every W15 game on this side + byes mixed in by seed order.
        // Sort the column by seed so byes interleave naturally with R1 games.
        var r1Cells = [];
        side.r1Games.forEach(function (g) {
          r1Cells.push({
            sortKey: Math.min(seedMap[pad4(g.franchise_id)] ? seedMap[pad4(g.franchise_id)].seed : 999,
                              seedMap[pad4(g.opponent_franchise_id)] ? seedMap[pad4(g.opponent_franchise_id)].seed : 999),
            html: gameCard(g)
          });
        });
        side.byes.forEach(function (s) {
          r1Cells.push({ sortKey: s.seed, html: byeCard(s) });
        });
        r1Cells.sort(function (a, b) { return a.sortKey - b.sortKey; });
        var r1Html = r1Cells.map(function (c) {
          return '<div class="bracket-slot has-connector">' + c.html + '</div>';
        }).join("");
        if (!r1Cells.length) r1Html = '<div class="empty" style="padding:14px 0">No W15 games for this side.</div>';

        // Semis column: every W16 semi game (placement game shown separately).
        var semiCells = side.semiGames.slice().sort(function (a, b) {
          // Sort by the higher-seeded participant (lower seed number).
          var sa = Math.min(seedMap[pad4(a.franchise_id)] ? seedMap[pad4(a.franchise_id)].seed : 999,
                            seedMap[pad4(a.opponent_franchise_id)] ? seedMap[pad4(a.opponent_franchise_id)].seed : 999);
          var sb = Math.min(seedMap[pad4(b.franchise_id)] ? seedMap[pad4(b.franchise_id)].seed : 999,
                            seedMap[pad4(b.opponent_franchise_id)] ? seedMap[pad4(b.opponent_franchise_id)].seed : 999);
          return sa - sb;
        });
        var semisHtml = semiCells.length
          ? semiCells.map(function (g) { return '<div class="bracket-slot has-connector">' + gameCard(g) + '</div>'; }).join("")
          : '<div class="empty" style="padding:14px 0">No semis yet.</div>';

        // Final column
        var finalHtml = side.finalGame
          ? '<div class="bracket-slot has-connector">' + gameCard(side.finalGame) + '</div>'
          : (side.semiGames.length ? '<div class="bracket-slot"><div class="matchup"><div class="matchup-team bye-row" style="color:var(--dim)">pending W17</div></div></div>' : "");

        // Trophy column
        var champHtml;
        if (side.champFid) {
          var champName = null, champOwner = null;
          if (side.finalGame) {
            if (pad4(side.finalGame.franchise_id) === pad4(side.champFid)) {
              champName = side.finalGame.franchise_name; champOwner = side.finalGame.franchise_owner;
            } else {
              champName = side.finalGame.opponent_franchise_name; champOwner = side.finalGame.opponent_owner;
            }
          }
          var champSeed = seedMap[pad4(side.champFid)];
          champHtml = '<div class="champion-card' + (hawk ? ' hawk-champ' : '') + '">'
            + '<div class="champion-label">' + (hawk ? "Hawk Tuah Bowl champion" : "UPS Champion") + '</div>'
            + '<div class="champion-icon">' + (hawk ? "🦅" : "🏆") + '</div>'
            + '<div class="champion-name">' + escapeHtml(champName || seedNames[pad4(side.champFid)] || side.champFid) + (champSeed ? ' <span style="color:var(--gold);font-size:11px">#' + champSeed.seed + '</span>' : "") + '</div>'
            + '<div class="champion-owner">' + escapeHtml(champOwner || seedOwners[pad4(side.champFid)] || "") + '</div>'
            + '</div>';
        } else {
          champHtml = '<div class="champion-card"><div class="champion-label">' + (hawk ? "Hawk Tuah Bowl champion" : "UPS Champion") + '</div><div class="champion-pending" style="margin-top:10px">— pending —</div></div>';
        }

        // Consolation strip beneath the bracket.
        var consBits = [];
        if (side.thirdPlaceGame) {
          consBits.push(gameCardLabeled(hawk ? ("Week " + WK_FINAL + " · Hawk Tuah Bowl 3rd-place game") : ("Week " + WK_FINAL + " · 3rd-place (1.09 / 1.10)"), side.thirdPlaceGame));
        }
        if (side.placementGame) {
          consBits.push(gameCardLabeled(hawk ? ("Week " + WK_SEMI + " · Hawk Tuah Bowl 5th-place game") : ("Week " + WK_SEMI + " · 5th–6th (1.07 / 1.08)"), side.placementGame));
        }
        side.otherW17.forEach(function (g) {
          consBits.push(gameCardLabeled("Week " + WK_FINAL + " · additional", g));
        });
        var consHtml = "";
        if (consBits.length) {
          consHtml = '<div class="bracket-consolation">'
            + '<div class="bracket-consolation-label">' + (hawk ? "Hawk Tuah Bowl · placement games" : "Consolation rounds") + '</div>'
            + '<div class="bracket-consolation-row">' + consBits.join("") + '</div>'
            + '</div>';
        }

        return ''
          + '<section class="bracket-section' + (hawk ? ' hawktuah' : '') + '">'
          +   '<h3>' + (hawk ? "🦅 " : "🏆 ") + escapeHtml(label) + '</h3>'
          +   '<div class="bracket">'
          +     '<div class="bracket-col">'
          +       '<div class="bracket-col-header">Round 1<span class="wk">Week ' + WK_R1 + '</span></div>'
          +       '<div class="bracket-col-r1">' + r1Html + '</div>'
          +     '</div>'
          +     '<div class="bracket-col">'
          +       '<div class="bracket-col-header">Semifinals<span class="wk">Week ' + WK_SEMI + '</span></div>'
          +       '<div class="bracket-col-semis">' + semisHtml + '</div>'
          +     '</div>'
          +     '<div class="bracket-col">'
          +       '<div class="bracket-col-header">' + (hawk ? "Hawk Tuah Bowl" : "Championship") + '<span class="wk">Week ' + WK_FINAL + '</span></div>'
          +       '<div class="bracket-col-final">' + finalHtml + '</div>'
          +     '</div>'
          +     '<div class="bracket-col">'
          +       '<div class="bracket-col-header">' + (hawk ? "Hawk Tuah Bowl champion" : "Trophy") + '</div>'
          +       '<div class="bracket-col-champion">' + champHtml + '</div>'
          +     '</div>'
          +   '</div>'
          +   consHtml
          + '</section>';
      }

      var champSide = buildSide(champSeeds, false);
      var hawkSide  = buildSide(hawkSeeds, true);

      // Detect conference-bracket format (2011-2013 in UPS): every R1
      // game on this side has both teams from the same conference. The
      // alternative is the modern flat-6 layout where R1 freely mixes.
      function isConferenceBracket(side, sideSeeds) {
        if (!resp.has_conferences) return false;
        if (!side.r1Games.length) return false;
        var seedConf = {};
        sideSeeds.forEach(function (s) { seedConf[pad4(s.franchise_id)] = s.conference_id || null; });
        return side.r1Games.every(function (g) {
          var a = seedConf[pad4(g.franchise_id)];
          var b = seedConf[pad4(g.opponent_franchise_id)];
          return a && b && a === b;
        });
      }

      var champIsConf = champSide && isConferenceBracket(champSide, champSeeds);
      var hawkIsConf  = hawkSide  && isConferenceBracket(hawkSide,  hawkSeeds);
      var yr = Number(state.year);

      // One side's games listed by week, with the champion from the recorded final standings: for an older season
      // whose games don't fit today's rounds (see below). noTitle: 2010's toilet bracket had the loser advance.
      function resultsByWeekHtml(hawk, sideSeeds, recFid, noTitle) {
        var ids = {};
        sideSeeds.forEach(function (s) { ids[pad4(s.franchise_id)] = true; });
        var mine = games.filter(function (g) { return ids[pad4(g.franchise_id)] && ids[pad4(g.opponent_franchise_id)]; });
        var weeks = [];
        mine.forEach(function (g) { if (weeks.indexOf(Number(g.week)) < 0) weeks.push(Number(g.week)); });
        weeks.sort(function (a, b) { return a - b; });
        var topSeed = function (g) { return Math.min((seedMap[pad4(g.franchise_id)] || { seed: 99 }).seed, (seedMap[pad4(g.opponent_franchise_id)] || { seed: 99 }).seed); };
        var cols = weeks.map(function (w) {
          var cards = mine.filter(function (g) { return Number(g.week) === w; }).sort(function (a, b) { return topSeed(a) - topSeed(b); })
            .map(function (g) { return gameCard(g); }).join("");
          return '<div class="bracket-col"><div class="bracket-col-header">Week ' + w + '</div><div class="bracket-col-list">' + cards + '</div></div>';
        }).join("");
        var label = hawk ? "Hawk Tuah Bowl champion" : "UPS Champion";
        var rs = recFid ? seedMap[pad4(recFid)] : null;
        var champ = recFid
          ? '<div class="champion-card' + (hawk ? ' hawk-champ' : '') + '"><div class="champion-label">' + label + '</div><div class="champion-icon">' + (hawk ? "🦅" : "🏆") + '</div>'
            + '<div class="champion-name">' + escapeHtml(seedNames[pad4(recFid)] || recFid) + (rs ? ' <span style="color:var(--gold);font-size:11px">#' + rs.seed + '</span>' : '') + '</div>'
            + '<div class="champion-owner">' + escapeHtml(seedOwners[pad4(recFid)] || "") + '</div><div class="champion-label" style="margin-top:6px">Recorded final standings</div></div>'
          : '<div class="champion-card' + (hawk ? ' hawk-champ' : '') + '"><div class="champion-label">' + label + '</div><div class="champion-pending" style="margin-top:10px">' + (noTitle ? "None marked: 2010’s toilet bracket had the loser advance." : "Not recorded.") + '</div></div>';
        return '<section class="bracket-section' + (hawk ? ' hawktuah' : '') + '">'
          + '<h3>' + (hawk ? "🦅 Hawk Tuah Bowl" : "🏆 UPS Championship") + ' — results by week</h3>'
          + '<div class="psub" style="margin:-8px 0 12px">' + yr + '’s ' + (hawk ? "toilet bracket" : "bracket") + ' doesn’t follow today’s rounds, so its games are listed by week' + (recFid ? '; the champion is the recorded final standing' : '') + '.</div>'
          + '<div class="bracket" style="grid-template-columns:repeat(' + Math.max(1, weeks.length) + ', minmax(0, 1fr)) 0.85fr;min-height:0">' + cols
          + '<div class="bracket-col"><div class="bracket-col-header">' + (hawk ? "Hawk Tuah Bowl champion" : "Trophy") + '</div><div class="bracket-col-champion">' + champ + '</div></div></div></section>';
      }
      // A finished season: each side's drawn champion is checked against the recorded final standings (1 = UPS
      // champion; 7 = Hawk Tuah Bowl champion, from 2011). The rounds above follow today's format; where an older
      // season's games don't fit them (on the 2026-10-17 data: every Hawk Tuah side 2010-2015), the drawn champion
      // disagrees with the record, so that side is listed by week instead. A season whose recorded finishes can't be
      // read draws as before.
      var check = resp.season_complete ? loadFinishes(yr).catch(function () { return null; }) : Promise.resolve(null);
      return check.then(function (fins) {
        var recBy = {};
        if (fins) Object.keys(fins).forEach(function (fid) { var f = Number(fins[fid].final_finish); if (f) recBy[f] = fid; });
        var byWeek = false;
        function sideHtml(hawk) {
          var side = hawk ? hawkSide : champSide, sideSeeds = hawk ? hawkSeeds : champSeeds, isConf = hawk ? hawkIsConf : champIsConf;
          var label = hawk ? (isConf ? "Hawk Tuah Bowl (toilet bowl) — conference format" : "Hawk Tuah Bowl — seeds 7-12")
            : (isConf ? "UPS Championship — conference format" : "UPS Championship — seeds 1-6");
          var out = {};
          var drawn = isConf ? renderConferenceBracket(label, side, sideSeeds, hawk, resp, out) : renderSide(label, side, hawk);
          if (!fins) return drawn;
          var noTitle = hawk && yr < 2011;
          var recFid = hawk ? (noTitle ? null : recBy[7]) : recBy[1];
          var drawnChamp = isConf ? out.champFid : side.champFid;
          if (!noTitle && (!recFid || pad4(drawnChamp || "") === pad4(recFid))) return drawn;
          byWeek = true;
          return resultsByWeekHtml(hawk, sideSeeds, recFid, noTitle);
        }
        var html = (champSide ? sideHtml(false) : "") + (hawkSide ? sideHtml(true) : "");
        var noteSuffix = (champIsConf || hawkIsConf)
          ? 'Conference-era bracket (2011-2013): each conference seeds top 3 by '
            + (resp.standings_sort || "Overall PCT") + '. #1 byes Week ' + WK_R1
            + ', #2 vs #3 in Week ' + WK_R1 + ', winner faces #1 in Week ' + WK_SEMI
            + '. Conference champions meet in Week ' + WK_FINAL + ' for the UPS title.'
          : 'Modern bracket: top 2 division winners earn seeds 1-2 (BYE). Wild cards = top 2 non-DW by AP%. Bracket reads left-to-right; gold-bar + "W" tag marks each round\'s winner.';
        html += '<div class="note">' + noteSuffix + (byWeek ? ' A side listed by week keeps every game as played; its champion is the recorded final standing.' : '') + '</div>' + DEFERRED_NOTE;
        paint(html);
      });
    }, function () {
      paint('<div class="err" role="alert">Couldn’t load the ' + escapeHtml(String(state.year)) + ' bracket. <button type="button" class="retry-btn" data-retry="1">Try again</button></div>');
    }).then(function () {
      host.querySelectorAll("[data-retry]").forEach(function (b) { b.addEventListener("click", function () { state.cache = {}; render(); }); });
    }).catch(function (e) { paint('<div class="err">Something went wrong drawing the ' + escapeHtml(String(state.year)) + ' bracket (' + escapeHtml((e && e.message) || String(e)) + ').</div>'); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // Conference-format bracket renderer (2011-2013 UPS)
  //
  // Each conference seeds top 3 by the year's standings_sort chain.
  // #1 byes Week N; #2 vs #3 play Week N; winner faces #1 in Week N+1
  // (conference championship). The two conference champs meet in Week N+2
  // for the UPS title; semi-losers play a 3rd-place game; etc.
  // ────────────────────────────────────────────────────────────────────────
  // out (optional): receives { champFid } — the title game's winner as drawn — so a finished season can be checked
  // against its recorded champion.
  function renderConferenceBracket(label, side, sideSeeds, hawk, resp, out) {
    // BUGFIX: WK_* are local to renderBracket; derive them here from resp.
    var pw = (resp && resp.playoff_weeks && resp.playoff_weeks.length === 3) ? resp.playoff_weeks : [15, 16, 17];
    var WK_R1 = pw[0], WK_SEMI = pw[1], WK_FINAL = pw[2];
    // Build a conference-local seed map so badges read "#1/#2/#3" within
    // each conference (matching the legacy MFL conference-bracket layout
    // the user referenced) instead of the global 1-12 numbering.
    var seedMap = {};
    sideSeeds.forEach(function (s) {
      seedMap[pad4(s.franchise_id)] = {
        seed: s.conference_seed || s.seed,
        side: hawk ? "hawk" : "champ",
        conf: s.conference_id
      };
    });
    var confs = {}; // confId -> { name, seeds:[], r1, semi, champFid }
    sideSeeds.forEach(function (s) {
      var c = s.conference_id || "—";
      if (!confs[c]) confs[c] = {
        confId: c,
        confName: s.conference_name || ("Conference " + c),
        seeds: []
      };
      confs[c].seeds.push(s);
    });
    // Within each conference, sort by conference_seed so the #1 (bye)
    // shows first, then #2 vs #3 follow in R1.
    Object.keys(confs).forEach(function (c) {
      confs[c].seeds.sort(function (a, b) {
        return (a.conference_seed || a.seed) - (b.conference_seed || b.seed);
      });
      var s = confs[c].seeds;
      // Find R1 (#2 vs #3) and semi (#1 vs R1 winner) in the schedule.
      var pairR1 = (s.length >= 3) ? findGameInList(side.r1Games, s[1].franchise_id, s[2].franchise_id) : null;
      confs[c].r1 = pairR1;
      var r1WinFid = winnerIdOf(pairR1);
      var r1LoseFid = loserIdOf(pairR1);
      confs[c].r1WinFid = r1WinFid;
      confs[c].r1LoseFid = r1LoseFid;
      var semiOpp = r1WinFid || (s[1] && s[1].franchise_id); // fall back if R1 not played
      confs[c].semi = (s.length >= 1 && semiOpp) ? findGameInList(side.semiGames.concat(side.placementGame ? [side.placementGame] : []), s[0].franchise_id, semiOpp) : null;
      confs[c].champFid = winnerIdOf(confs[c].semi) || (confs[c].semi ? null : s[0] && s[0].franchise_id);
      confs[c].runnerUpFid = loserIdOf(confs[c].semi);
    });

    // Final week: champion-vs-champion = UPS title; runner-up vs runner-up = 3rd place
    var confIds = Object.keys(confs);
    var champA = confIds[0] ? confs[confIds[0]].champFid : null;
    var champB = confIds[1] ? confs[confIds[1]].champFid : null;
    var titleGame = (champA && champB) ? findGameInList((side.r1Games.concat(side.semiGames, side.placementGame ? [side.placementGame] : [], side.finalGame ? [side.finalGame] : [], side.thirdPlaceGame ? [side.thirdPlaceGame] : [], side.otherW17 || [])), champA, champB) : null;
    var titleGameAtFinalWk = titleGame && Number(titleGame.week) === Number(side.finalGame && side.finalGame.week ? side.finalGame.week : null);
    var overallChampFid = winnerIdOf(titleGame);
    if (out) out.champFid = overallChampFid;
    // Older seasons' schedule rows can arrive without team names; the seeds always carry them.
    var seedNames = {}, seedOwners = {};
    sideSeeds.forEach(function (s) { seedNames[pad4(s.franchise_id)] = s.franchise_name; seedOwners[pad4(s.franchise_id)] = s.owner_name; });
    var runnerUpA = confIds[0] ? confs[confIds[0]].runnerUpFid : null;
    var runnerUpB = confIds[1] ? confs[confIds[1]].runnerUpFid : null;
    var thirdGame = (runnerUpA && runnerUpB) ? findGameInList(side.thirdPlaceGame ? [side.thirdPlaceGame].concat(side.otherW17 || []) : (side.otherW17 || []), runnerUpA, runnerUpB) : null;

    function teamRow(fid, name, score, isWinner) {
      var seedInfo = fid ? seedMap[pad4(fid)] : null;
      var seedNum = seedInfo ? seedInfo.seed : null;
      return '<div class="matchup-team ' + (isWinner ? "winner" : (score == null ? "" : "loser")) + '">'
        + (seedNum != null ? '<span class="matchup-seed">#' + seedNum + '</span>' : '<span class="matchup-seed unranked">—</span>')
        + '<span class="matchup-name">' + escapeHtml(name || (fid ? seedNames[pad4(fid)] : null) || (fid || "?")) + '</span>'
        + '<span class="matchup-score">' + (score == null ? "—" : fmtDec(score)) + '</span>'
        + '</div>';
    }
    function gameCard(g) {
      if (!g) return '<div class="matchup"><div class="matchup-team bye-row" style="color:var(--dim)">pending</div></div>';
      var aScore = Number(g.team_score || 0);
      var bScore = Number(g.opponent_score || 0);
      var aWon = aScore > bScore;
      return '<div class="matchup">'
        + teamRow(g.franchise_id, g.franchise_name, aScore, aWon)
        + teamRow(g.opponent_franchise_id, g.opponent_franchise_name, bScore, !aWon && bScore > 0)
        + '</div>';
    }
    function byeCard(seed) {
      return '<div class="matchup bye">'
        + '<div class="matchup-team bye-row">'
        + '<span class="matchup-seed">#' + seed.seed + '</span>'
        + '<span class="matchup-name" style="text-transform:none;font-style:normal;color:var(--muted);font-size:11px">' + escapeHtml(seed.franchise_name || seed.franchise_id) + '</span>'
        + '<span style="font-size:9px;letter-spacing:0.1em;color:var(--gold)">BYE</span>'
        + '</div></div>';
    }

    function renderConfHalf(c) {
      var s = c.seeds;
      var r1Html = '<div class="bracket-slot has-connector">' + (s[0] ? byeCard(s[0]) : "") + '</div>'
        + '<div class="bracket-slot has-connector">' + gameCard(c.r1) + '</div>';
      var semiHtml = '<div class="bracket-slot has-connector">' + gameCard(c.semi) + '</div>';
      var champHtml;
      if (c.champFid) {
        // Pull the team name from the semi game (champ is the winner there).
        var champName = null, champOwner = null;
        if (c.semi) {
          if (pad4(c.semi.franchise_id) === pad4(c.champFid)) {
            champName = c.semi.franchise_name; champOwner = c.semi.franchise_owner;
          } else {
            champName = c.semi.opponent_franchise_name; champOwner = c.semi.opponent_owner;
          }
        }
        champHtml = '<div class="champion-card' + (hawk ? ' hawk-champ' : '') + '">'
          + '<div class="champion-label">' + escapeHtml(c.confName) + ' Champion</div>'
          + '<div class="champion-icon">' + (hawk ? "🦅" : "🏆") + '</div>'
          + '<div class="champion-name">' + escapeHtml(champName || seedNames[pad4(c.champFid)] || c.champFid) + '</div>'
          + '<div class="champion-owner">' + escapeHtml(champOwner || seedOwners[pad4(c.champFid)] || "") + '</div>'
          + '</div>';
      } else {
        champHtml = '<div class="champion-card"><div class="champion-label">' + escapeHtml(c.confName) + ' Champ</div><div class="champion-pending" style="margin-top:10px">— pending —</div></div>';
      }
      return ''
        + '<section class="bracket-section' + (hawk ? ' hawktuah' : '') + '" style="margin-bottom:14px">'
        +   '<h3 style="color:' + (hawk ? '#ffc99b' : 'var(--gold)') + '">' + escapeHtml(c.confName) + ' Conference Championship</h3>'
        +   '<div class="bracket" style="grid-template-columns:1fr 1fr 0.85fr">'
        +     '<div class="bracket-col">'
        +       '<div class="bracket-col-header">Round 1<span class="wk">Week ' + WK_R1 + '</span></div>'
        +       '<div class="bracket-col-r1">' + r1Html + '</div>'
        +     '</div>'
        +     '<div class="bracket-col">'
        +       '<div class="bracket-col-header">Conf. Semifinal<span class="wk">Week ' + WK_SEMI + '</span></div>'
        +       '<div class="bracket-col-semis">' + semiHtml + '</div>'
        +     '</div>'
        +     '<div class="bracket-col">'
        +       '<div class="bracket-col-header">Conference Champ</div>'
        +       '<div class="bracket-col-champion">' + champHtml + '</div>'
        +     '</div>'
        +   '</div>'
        + '</section>';
    }

    // Title game block (UPS Championship for the champ side, or "Hawktuah Final" for hawk side).
    var titleBlock;
    if (titleGame) {
      var trophyLabel = hawk ? "Hawk Tuah Bowl Champion" : "UPS Champion";
      var trophyIcon  = hawk ? "🦅" : "🏆";
      var champ = null, runnerUp = null;
      if (overallChampFid) {
        if (pad4(titleGame.franchise_id) === pad4(overallChampFid)) {
          champ = { name: titleGame.franchise_name, owner: titleGame.franchise_owner, fid: titleGame.franchise_id, score: titleGame.team_score };
          runnerUp = { name: titleGame.opponent_franchise_name, owner: titleGame.opponent_owner, fid: titleGame.opponent_franchise_id, score: titleGame.opponent_score };
        } else {
          champ = { name: titleGame.opponent_franchise_name, owner: titleGame.opponent_owner, fid: titleGame.opponent_franchise_id, score: titleGame.opponent_score };
          runnerUp = { name: titleGame.franchise_name, owner: titleGame.franchise_owner, fid: titleGame.franchise_id, score: titleGame.team_score };
        }
      }
      titleBlock = ''
        + '<section class="bracket-section' + (hawk ? ' hawktuah' : '') + '" style="margin-top:10px">'
        +   '<h3>' + trophyIcon + ' ' + (hawk ? "Hawk Tuah Bowl" : "UPS Championship") + ' · Week ' + WK_FINAL + '</h3>'
        +   '<div class="bracket-consolation-row" style="grid-template-columns:1fr 1fr">'
        +     '<div>' + gameCard(titleGame) + '</div>'
        +     '<div class="champion-card' + (hawk ? ' hawk-champ' : '') + '">'
        +       '<div class="champion-label">' + trophyLabel + '</div>'
        +       '<div class="champion-icon">' + trophyIcon + '</div>'
        +       '<div class="champion-name">' + escapeHtml(champ ? (champ.name || seedNames[pad4(champ.fid)] || champ.fid) : "—") + '</div>'
        +       '<div class="champion-owner">' + escapeHtml(champ ? (champ.owner || seedOwners[pad4(champ.fid)] || "") : "") + '</div>'
        +     '</div>'
        +   '</div>'
        +   (thirdGame
            ? '<div style="margin-top:10px"><div class="round-label" style="margin-bottom:4px">' + (hawk ? 'Week ' + WK_FINAL + ' · Hawk Tuah Bowl 3rd-place game' : 'Week ' + WK_FINAL + ' · 3rd-place (1.09 / 1.10)') + '</div>' + gameCard(thirdGame) + '</div>'
            : "")
        + '</section>';
    } else {
      titleBlock = '<div class="banner" style="margin-top:10px">' + (hawk ? "Hawk Tuah Bowl" : "UPS Championship") + ' Week ' + WK_FINAL + ' pending.</div>';
    }

    return ''
      + '<section class="bracket-section' + (hawk ? ' hawktuah' : '') + '" style="background:none;border:none;padding:0">'
      +   '<h3 style="margin-bottom:10px">' + (hawk ? "🦅 " : "🏆 ") + escapeHtml(label) + '</h3>'
      +   confIds.map(function (c) { return renderConfHalf(confs[c]); }).join("")
      +   titleBlock
      + '</section>';
  }

  // Helpers used by the conference-bracket renderer.
  function findGameInList(list, aId, bId) {
    if (!list || !aId || !bId) return null;
    var a = pad4(aId), b = pad4(bId);
    for (var i = 0; i < list.length; i++) {
      var g = list[i]; if (!g) continue;
      var ga = pad4(g.franchise_id), gb = pad4(g.opponent_franchise_id);
      if ((ga === a && gb === b) || (ga === b && gb === a)) return g;
    }
    return null;
  }
  function winnerIdOf(g) {
    if (!g) return null;
    return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.franchise_id) : pad4(g.opponent_franchise_id);
  }
  function loserIdOf(g) {
    if (!g) return null;
    return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.opponent_franchise_id) : pad4(g.franchise_id);
  }

  // The seeds when no bracket can be drawn: the same aligned Seed cell as every other table (BYE / DIV / WC chips in
  // the phone's colors; H1-H6 for the Hawk Tuah Bowl side). projected: the regular season isn't over.
  function renderSeedTable(seeds, projected) {
    if (!seeds.length) return '<div class="empty">No seeds yet.</div>';
    var rows = seeds.map(function (s) {
      var n = Number(s.seed);
      var st = n <= 6 ? (s.bye || n <= 2 ? "BYE" : (s.path === "DIV" ? "DIV" : (s.path === "WC" ? "WC" : null))) : null;
      return '<tr><td class="seed-col">' + seedCellHtml(n, statusChipHtml(st, projected)) + '</td><td>' + escapeHtml(s.franchise_name || s.franchise_id) + '</td><td>' + escapeHtml(s.owner_name || "") + '</td><td class="num">' + fmtPct(s.allplay_pct) + '</td><td class="num">' + fmtPct(s.h2h_pct) + '</td><td class="num">' + fmtCommas(s.pf, 1) + '</td></tr>';
    }).join("");
    return '<div style="overflow-x:auto;margin-top:14px"><table><thead><tr><th class="seed-col">Seed</th><th>Team</th><th>Owner</th><th class="num">AP %</th><th class="num">H2H %</th><th class="num">PF</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // ────────────────────────────────────────────────────────────────────────
  // View — Hall of Champions
  // Per closed UPS season: champion card with regular-season AP, playoff
  // AP, total AP, playoff seed, division-winner flag, total points,
  // historical AP rank across champions, and the championship game
  // (opponent, score, MFL box-score link).
  // ────────────────────────────────────────────────────────────────────────
  // ────────────────────────────────────────────────────────────────────────
  // Hall of Champions — picker + summary table + per-champion big-card view.
  // Mirrors the Eras restructure (default "Summary" → wide sortable
  // table of every champion; pick a specific season for the detailed
  // page). Per-champion narratives keyed by season year in
  // CHAMPION_STORIES; empty entries fall back to data-only rendering.
  // ────────────────────────────────────────────────────────────────────────

  // Hand-curated season blurbs per champion. Add as we draft them. Each
  // value is multi-paragraph (separator = blank line); the renderer
  // splits on \n\n and wraps each chunk in <p>. Same convention as
  // ERA_STORIES.
  var CHAMPION_STORIES = {
    // Example shape:
    // 2024: {
    //   blurb:
    // "Quarter 1 (W1-4): ...\n\n" +
    // "Quarter 2 (W5-8): ...\n\n" +
    // "Quarter 3 (W9-12): ...\n\n" +
    // "Quarter 4 (W13-14): ...\n\n" +
    // "Playoffs: ..."
    // }
  };

  function hocRec3(w, l, t) { return (w || 0) + "-" + (l || 0) + (t ? "-" + t : ""); }
  function hocRecPct(w, l, t) {
    var g = (w || 0) + (l || 0) + (t || 0);
    return g > 0 ? ((w + 0.5 * t) / g) : null;
  }
  // Render an HoC blurb (multi-paragraph) the same way era blurbs render.
  function renderChampBlurbHtml(blurb) {
    var s = String(blurb == null ? "" : blurb).trim();
    if (!s) return "";
    var paras = s.split(/\n\s*\n/);
    return '<div class="era-blurb">'
      + paras.map(function (p) {
          return '<p>' + escapeHtml(p.trim()) + '</p>';
        }).join("")
      + '</div>';
  }
  // Rank champions on a numeric field — descending (#1 = highest value).
  // Returns a map keyed by season → 1-based rank. Ties get the same rank.
  function rankChampsDesc(champs, getter) {
    var arr = champs.map(function (c) {
      return { season: c.season, val: Number(getter(c)) };
    }).filter(function (r) { return isFinite(r.val); });
    arr.sort(function (a, b) { return b.val - a.val; });
    var map = {};
    var lastVal = null, lastRank = 0;
    arr.forEach(function (r, i) {
      var rank = (lastVal != null && r.val === lastVal) ? lastRank : (i + 1);
      map[r.season] = rank;
      lastVal = r.val;
      lastRank = rank;
    });
    return map;
  }

  function renderChampPickerHtml(champs) {
    var opts = ['<option value="all"' + (state.champSelected === "all" ? " selected" : "") + '>All Champions — Summary</option>'];
    // Newest first in the picker so this year's champ is at top.
    var sorted = champs.slice().sort(function (a, b) { return Number(b.season) - Number(a.season); });
    sorted.forEach(function (c) {
      var val = String(c.season);
      var who = c.owner_name ? (" · " + c.owner_name) : "";
      var label = c.season + " — " + (c.franchise_name || c.franchise_id || "Champion") + who;
      opts.push('<option value="' + escapeHtml(val) + '"' + (state.champSelected === val ? " selected" : "") + '>' + escapeHtml(label) + '</option>');
    });
    return '<div class="era-picker-row"><label class="era-picker">View <select id="champSel">' + opts.join("") + '</select></label></div>';
  }

  function wireChampPicker(host) {
    var sel = host.querySelector("#champSel");
    if (sel) {
      sel.addEventListener("change", function () {
        state.champSelected = sel.value || "all";
        pushQs();
        render();
      });
    }
    host.querySelectorAll("th.hoc-summary-th").forEach(function (h) {
      h.addEventListener("click", function () {
        var key = h.getAttribute("data-hoc-sort");
        if (!key) return;
        if (state.champSummary.sortKey === key) {
          state.champSummary.sortDir = state.champSummary.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.champSummary.sortKey = key;
          state.champSummary.sortDir = (key === "season" || key === "owner_name" || key === "franchise_name") ? "asc" : "desc";
        }
        render();
      });
    });
  }

  function renderHocSummaryHtml(champs, ranks) {
    function th(key, label, isNum) {
      var active = state.champSummary.sortKey === key;
      var arrow = active ? (state.champSummary.sortDir === "asc" ? " ▲" : " ▼") : "";
      var cls = (isNum ? "num " : "") + "hoc-summary-th" + (active ? " active" : "");
      return '<th class="' + cls + '" data-hoc-sort="' + key + '">' + escapeHtml(label) + arrow + '</th>';
    }
    var rows = champs.slice().sort(function (a, b) {
      var sa = state.champSummary.sortKey;
      var dir = state.champSummary.sortDir === "asc" ? 1 : -1;
      var av = a[sa], bv = b[sa];
      if (sa === "owner_name" || sa === "franchise_name") {
        return String(av || "").localeCompare(String(bv || "")) * dir;
      }
      if (sa === "season") {
        return (Number(a.season) - Number(b.season)) * dir;
      }
      if (sa === "ap_rank") {
        return ((ranks.ap[a.season] || 99) - (ranks.ap[b.season] || 99)) * dir;
      }
      if (sa === "pf_rank") {
        return ((ranks.pf[a.season] || 99) - (ranks.pf[b.season] || 99)) * dir;
      }
      if (sa === "pf_index") {
        return ((Number(a.pf_index) || 0) - (Number(b.pf_index) || 0)) * dir;
      }
      if (sa === "idx_rank") {
        return ((ranks.idx[a.season] || 99) - (ranks.idx[b.season] || 99)) * dir;
      }
      av = Number(av || 0); bv = Number(bv || 0);
      return (av - bv) * dir;
    });
    var head = '<tr>'
      + th("season",         "Season",     false)
      + th("franchise_name", "Franchise",  false)
      + th("owner_name",     "Owner",      false)
      + '<th class="num">Seed</th>'
      + '<th class="num">Div Win</th>'
      + th("total_ap_pct",   "Total AP %", true)
      + th("ap_rank",        "AP Rank",    true)
      + th("pf",             "PF",         true)
      + th("pf_index",       "IDX",        true)
      + th("idx_rank",       "IDX Rank",   true)
      + '<th>Final Score</th>'
      + '</tr>';
    var body = rows.map(function (c) {
      var totalPct = c.total_ap_pct != null ? c.total_ap_pct : hocRecPct(c.total_ap_w, c.total_ap_l, c.total_ap_t);
      var fg = c.final_game || null;
      var finalScore = fg ? (fmtDec(fg.champion_score) + " – " + fmtDec(fg.opponent_score)) : "—";
      var seed = c.seed_rank_overall != null ? "#" + c.seed_rank_overall : "—";
      var divWin = c.division_winner === true ? "Yes" : (c.division_winner === false ? "No" : "—");
      var apRank = ranks.ap[c.season] ? "#" + ranks.ap[c.season] : "—";
      var idxRank = ranks.idx[c.season] ? "#" + ranks.idx[c.season] : "—";
      var idxStr = (c.pf_index != null && isFinite(c.pf_index))
        ? Number(c.pf_index).toFixed(2)
        : "—";
      return '<tr>'
        + '<td>' + escapeHtml(c.season) + '</td>'
        + '<td>' + escapeHtml(c.franchise_name || c.franchise_id || "—") + '</td>'
        + '<td>' + escapeHtml(c.owner_name || "—") + '</td>'
        + '<td class="num">' + seed + '</td>'
        + '<td class="num">' + divWin + '</td>'
        + '<td class="num">' + fmtPct(totalPct) + '</td>'
        + '<td class="num">' + apRank + '</td>'
        + '<td class="num">' + fmtCommas(c.pf, 1) + '</td>'
        + '<td class="num">' + idxStr + '</td>'

    }).join("");
    return '<section class="era-detail-card">'
      + '<div class="era-name">Hall of Champions — Summary</div>'

      + '</section>';
  }

  function renderChampDetailHtml(c, champs, ranks) {

    var playPct = hocRecPct(c.playoff_ap_w, c.playoff_ap_l, c.playoff_ap_t);

      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Reg Season AP</div><div class="hoc-stat-big-v">' + hocRec3(c.regseason_ap_w, c.regseason_ap_l, c.regseason_ap_t) + ' <span class="hoc-stat-big-sub">' + fmtPct(regPct) + '</span></div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Playoff AP</div><div class="hoc-stat-big-v">' + hocRec3(c.playoff_ap_w, c.playoff_ap_l, c.playoff_ap_t) + ' <span class="hoc-stat-big-sub">' + fmtPct(playPct) + '</span></div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Points For</div><div class="hoc-stat-big-v">' + fmtCommas(c.pf, 1) + '</div><div class="hoc-stat-big-rank">' + pfRank + '</div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Playoff Seed</div><div class="hoc-stat-big-v">' + (c.seed_rank_overall != null ? "#" + c.seed_rank_overall : "—") + '</div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Division Winner</div><div class="hoc-stat-big-v">' + (c.division_winner === true ? '<span style="color:var(--gold)">YES</span>' : (c.division_winner === false ? "No" : "—")) + '</div></div>'
      + '</div>'
      + (fg
          ? '<div class="hoc-final"><div class="hoc-final-label">Championship — Week ' + fg.week + '</div>'
            + '<div class="hoc-final-row">'
            +   '<span class="hoc-final-team">' + escapeHtml(c.franchise_name || c.franchise_id) + '</span>'
            +   '<span class="hoc-final-score ' + fgScoreClass + '">' + fmtDec(fg.champion_score) + '</span>'

  function renderHallOfChampions(host) {
    return fetchD1("/api/hall-of-champions", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load Hall of Champions.");
      var champs = resp.champions || [];
      if (!champs.length) {
        host.innerHTML = DRAFT_CONTENT_BANNER + '<div class="banner">No champions identified yet — needs <code>src_final_standings</code> loaded or playoff schedule rows in D1.</div>';

        }),
        pf: rankChampsDesc(champs, function (c) { return c.pf; }),

        idx: rankChampsDesc(champs, function (c) { return c.pf_index; })

  // ────────────────────────────────────────────────────────────────────────
  // View — Draft Order Finish
  //
  // Derives next-year rookie pick (1.01 → 1.12) from the playoff schedule
  // per league_context_v1.md §1. Schedule-driven so it adapts to the
  // year's bracket shape (modern flat, conference-era split, etc.).
  //
  // Pick mapping per league_context §1 — the ONE table is the shared module's BRACKET_FINISH_SLOTS (finish → pick):
  //   finish 7 (Hawk Tuah Bowl winner) 1.01 · 8 (its loser) 1.02 · 9 / 10 (Toilet 3rd-place game) 1.03 / 1.04
  //   finish 11 / 12 (Toilet placement game, two Round 1 losers) 1.05 / 1.06
  //   finish 5 / 6 (championship placement game, two Round 1 losers) 1.07 / 1.08
  //   finish 3 / 4 (championship 3rd-place game, the semifinal losers) 1.10 / 1.09
  //   finish 2 (runner-up) 1.11 · finish 1 (UPS champion) 1.12
  // A pick whose game hasn't been played reads "pending" — it is never filled from another game.
  // ────────────────────────────────────────────────────────────────────────
  // F2 (Phase II-A2 correction pass): renderDraftOrder no longer has its
  // own inline pick-assignment arithmetic for real results. BOTH the
  // actual and projected branches below get their picks EXCLUSIVELY from
  // window.UPS_STANDINGS_RACE — buildActualBracketResult()/
  // projectChalkBracket(), both driven by the one BRACKET_FINISH_SLOTS
  // table — and their "why" text from the shared pickWhyText() helper.
  // This removes the old dual-mapping risk (the previous inline logic
  // had a demonstrated bug: 1.10 was assigned once from the placement
  // game, then silently overwritten by the 3rd-place game a few lines
  // later) and the shared table's slot list can never disagree with
  // itself the way two hand-written arithmetic blocks could.
  function renderDraftOrderTable(host, seeds, picks, playoffWeeks, opts) {
    var seedMap = buildSeedMap(seeds);
    var projected = !!(opts && opts.projected);
    var pickOrder = ["1.01","1.02","1.03","1.04","1.05","1.06","1.07","1.08","1.09","1.10","1.11","1.12"];
    var rowsHtml = pickOrder.map(function (p) {
      var fid = picks[p];
      var seedInfo = fid ? seedMap[pad4(fid)] : null;
      var seedBadge = seedInfo
        ? '<span class="seed-badge ' + seedInfo.side + '">' + (seedInfo.side === "champ" ? "🏆" : "🦅") + ' ' + seedInfo.seed + '</span>'
        : '<span class="seed-badge none">—</span>';
      var info = fid ? (seeds.find(function (s) { return pad4(s.franchise_id) === pad4(fid); }) || {}) : {};
      var why = fid && window.UPS_STANDINGS_RACE ? window.UPS_STANDINGS_RACE.pickWhyText(p, projected) : null;
      var pendingText = projected ? "—" : "pending";
      var pickStyle = p === "1.01" ? 'background:rgba(110,60,30,0.15)' : (p === "1.12" ? 'background:rgba(231,190,89,0.12)' : "");
      return '<tr style="' + pickStyle + '">'
        + '<td class="num" style="font-weight:800;color:var(--gold);font-size:13px">' + p + '</td>'
        + '<td>' + seedBadge + '</td>'
        + '<td>' + (info.franchise_name ? escapeHtml(info.franchise_name) : "<span style='color:var(--dim)'>" + pendingText + "</span>") + '</td>'
        + '<td>' + escapeHtml(info.owner_name || "") + '</td>'
        + '<td style="font-size:11px;color:var(--muted);font-style:italic">' + escapeHtml(why || "—") + '</td>'
        + '</tr>';
    }).join("");
    return '<div style="overflow-x:auto"><table><thead><tr>'
      + '<th class="num">Pick</th><th>Seed</th><th>Team</th><th>Owner</th><th>Why' + (projected ? " (projected)" : "") + '</th>'
      + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
  }
  function renderDraftOrder(host) {
    return fetchD1("/api/playoff-bracket", state.year).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load bracket for " + state.year + ".");
      var seeds = resp.seeds || [];
      var matchups = resp.matchups || [];
      var playoffWeeks = resp.playoff_weeks && resp.playoff_weeks.length === 3 ? resp.playoff_weeks : [15, 16, 17];
      var WK_R1 = playoffWeeks[0], WK_SEMI = playoffWeeks[1], WK_FINAL = playoffWeeks[2];
      // F9: the same shared gating decision renderBracket() uses.
      var mode = (window.UPS_STANDINGS_RACE && window.UPS_STANDINGS_RACE.projectionMode)
        ? window.UPS_STANDINGS_RACE.projectionMode({ seasonComplete: resp.season_complete, matchups: matchups, seeds: seeds })
        : (matchups.length ? "actual" : "unavailable");
      if (mode === "projected") {
        var draftProj = window.UPS_STANDINGS_RACE.projectChalkBracket(seeds);
        var draftYear = window.UPS_STANDINGS_RACE.nextDraftYear(state.year);
        host.innerHTML = '<div class="banner"><span class="partial-badge">PROJECTED</span> ' + escapeHtml("Projected " + draftYear + " rookie draft order — chalk (higher seed wins every remaining game).") + '</div>'
          + '<div class="methodology"><strong>Projected Draft Order</strong> assumes every remaining playoff game is won by the higher (numerically lower) seed. A real bracket routinely produces upsets — this is a placeholder, not a forecast, and updates automatically once real games are played.</div>'
          + renderDraftOrderTable(host, seeds, draftProj.picks, playoffWeeks, { projected: true })
          + '<div class="note">All 12 picks shown are <strong>PROJECTED</strong> — none are final. Locks for real once Week ' + WK_FINAL + ' completes.</div>'
          + DEFERRED_NOTE;
        return;
      }
      if (mode !== "actual") {
        host.innerHTML = '<div class="banner">Draft order is set once the playoff bracket completes (final game in Week ' + WK_FINAL + ').</div>' + DEFERRED_NOTE;
        return;
      }
      // mode === "actual": real results. buildActualBracketResult() does
      // ALL of the dedup/classification/pick-assignment work — a
      // conflicting/invalid actual bracket (status !== "ok") fails
      // closed to an honest message rather than rendering anything
      // partially fabricated. A still-in-progress bracket (some slots
      // undecided) renders only the picks it actually has — the "pending"
      // placeholder already handles the rest.
      var actual = window.UPS_STANDINGS_RACE
        ? window.UPS_STANDINGS_RACE.buildActualBracketResult(seeds, matchups, playoffWeeks)
        : { status: "unavailable", reason: "shared module not loaded" };
      if (actual.status !== "ok") {
        host.innerHTML = '<div class="banner">Draft order unavailable' + (actual.reason ? (": " + escapeHtml(actual.reason)) : ".") + '</div>' + DEFERRED_NOTE;
        return;
      }
      host.innerHTML = ''
        + '<div class="methodology">'
        + '<strong>Draft Order Finish</strong> maps each playoff outcome to the next-year rookie draft pick per <code>league_context_v1.md §1</code>. '
        + 'Hawk Tuah Bowl winner picks first (1.01), UPS Champion picks last (1.12). '
        + 'Picks 1.05/1.06 + 1.07/1.08 are decided by Week ' + WK_SEMI + ' placement games between Week ' + WK_R1 + ' losers. '
        + '1.09/1.10 are decided by the Week ' + WK_FINAL + ' championship 3rd-place game.'
        + '</div>'
        + renderDraftOrderTable(host, seeds, actual.picks, playoffWeeks, { projected: false })
        + '<div class="note">'
        + (state.year === (new Date().getUTCFullYear()) ? "If picks show 'pending', the bracket hasn't fully completed yet."
          : "Final draft order for " + state.year + " (used in the " + (state.year + 1) + " rookie draft).")
        + '</div>'
        + DEFERRED_NOTE;
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 4 — Historical Finishes
  //   Every cell is labeled with THAT season's owner and team (/api/historical-finishes carries owner_name and
  //   franchise_name per season). Rows are grouped by owner (default) or by franchise slot. The old grid grouped by
  //   franchise id and labeled the row with its most frequent owner, so a slot that changed hands credited one
  //   owner's titles to another (Eric Martel's 2024 title sat under "Kyle Creelman · BTNH").
  // ────────────────────────────────────────────────────────────────────────
  // Hawk Tuah Bowl champion = finish 7 (the toilet-bracket winner picks 1.01), from 2011; 2010's toilet bracket had
  // the loser advance. Finish 12 is last place, not a title.
  function isHawktuahTitle(season, finish) { return Number(season) >= 2011 && Number(finish) === 7; }
  function renderHistorical(host) {
    return fetchD1("/api/historical-finishes", null).then(function (resp) {
      if (!resp || !resp.ok) return showFailure(host, "the historical finishes");
      var rows = resp.rows || [];
      if (!rows.length) {
        host.innerHTML = '<div class="banner">' + escapeHtml(resp.note || "No recorded final standings yet.") + '</div>' + DEFERRED_NOTE;
        return;
      }
      var bySlot = state.histGroup === "slot";
      var seasons = {}, groups = {};
      rows.forEach(function (r) {
        seasons[r.season] = true;
        var fid = pad4(r.franchise_id);
        var key = bySlot ? fid : (r.owner_name || ("Franchise " + fid + " (owner not recorded)"));
        var g = groups[key] || (groups[key] = { key: key, fid: fid, byYear: {}, latest: null });
        (g.byYear[r.season] = g.byYear[r.season] || []).push(r);
        if (!g.latest || Number(r.season) > Number(g.latest.season)) g.latest = r;
      });
      var seasonsSorted = Object.keys(seasons).map(Number).sort(function (a, b) { return b - a; });
      var list = Object.keys(groups).map(function (k) { return groups[k]; });
      list.sort(bySlot ? function (a, b) { return a.fid.localeCompare(b.fid); } : function (a, b) { return a.key.localeCompare(b.key); });
      function cellHtml(season, recs) {
        if (!recs || !recs.length) return '<td class="hist-cell empty">—</td>';
        var r = recs[0];
        var finish = Number(r.final_finish) || null;
        var cls = "hist-cell";
        if (finish === 1)       cls += " champ";
        else if (finish === 2)  cls += " silver";
        else if (finish === 3)  cls += " bronze";
        else if (isHawktuahTitle(season, finish)) cls += " hawktuah";
        var who = recs.map(function (x) { return [x.owner_name || "owner not recorded", x.franchise_name || ("Franchise " + pad4(x.franchise_id))].join(" · "); }).join(" / ");
        var title = season + " · " + who + " · Final " + (finish == null ? "—" : finish) + (r.regular_season_finish ? " · Reg " + r.regular_season_finish : "") + (r.division ? " · Div " + r.division : "")
          + (finish === 1 ? " · UPS champion" : (isHawktuahTitle(season, finish) ? " · Hawk Tuah Bowl champion" : ""));
        // the visible label: the team in "by owner" rows (the owner is the row), the owner in "by slot" rows
        var sub = bySlot ? (r.owner_name || "—") : (r.franchise_name || ("F" + pad4(r.franchise_id)));
        return '<td class="' + cls + '" title="' + escapeHtml(title) + '" aria-label="' + escapeHtml(title) + '">' + (finish == null ? "—" : finish)
          + (recs.length > 1 ? '<span class="cell-sub">+' + (recs.length - 1) + ' more</span>' : '<span class="cell-sub">' + escapeHtml(sub) + '</span>') + '</td>';
      }
      var head = '<tr><th class="hist-team" scope="col">' + (bySlot ? "Franchise slot · latest team" : "Owner · latest team") + '</th>' + seasonsSorted.map(function (y) { return '<th scope="col">' + y + '</th>'; }).join("") + '</tr>';
      var bodyHtml = list.map(function (g) {
        var cells = seasonsSorted.map(function (y) { return cellHtml(y, g.byYear[y]); }).join("");
        var label = bySlot
          ? '<span class="owner">Franchise ' + escapeHtml(g.fid) + '</span><span class="team">' + escapeHtml((g.latest && g.latest.franchise_name) || "") + (g.latest && g.latest.owner_name ? " · " + escapeHtml(g.latest.owner_name) : "") + '</span>'
          : '<span class="owner">' + escapeHtml(g.key) + '</span><span class="team">' + escapeHtml((g.latest && g.latest.franchise_name) || "") + '</span>';
        return '<tr><th class="hist-team" scope="row" style="font-weight:400">' + label + '</th>' + cells + '</tr>';
      }).join("");
      var groupCtl = '<div class="seg" role="group" aria-label="Group rows" style="margin-bottom:10px"><span class="seg-label">Rows:</span>'
        + '<button type="button" class="mode-btn" data-group="owner" aria-pressed="' + (!bySlot) + '">By owner</button>'
        + '<button type="button" class="mode-btn" data-group="slot" aria-pressed="' + bySlot + '">By franchise slot</button></div>';
      host.innerHTML = groupCtl + '<div style="overflow-x:auto"><table class="hist-table compact"><thead>' + head + '</thead><tbody>' + bodyHtml + '</tbody></table></div>'
        + '<div class="note">Each cell is that season’s finish after the playoffs, labeled with that season’s ' + (bySlot ? "owner" : "team") + ' (hover for owner, team and regular-season finish). '
        + '1 = UPS champion · 2 = runner-up · 3 = third · 7 = Hawk Tuah Bowl champion (from 2011; 2010’s toilet bracket had the loser advance) · 12 = last place.</div>'
        + DEFERRED_NOTE;
      host.querySelectorAll("[data-group]").forEach(function (b) {
        b.addEventListener("click", function () { state.histGroup = b.getAttribute("data-group"); pushQs(); renderHistorical(host); });
      });
    }, function () { showFailure(host, "the historical finishes"); }).catch(drawFailed(host));
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 5 — 3-Year Eras
  // ────────────────────────────────────────────────────────────────────────
  // Era stories — hand-curated narrative per era cycle, keyed by
  // era_start year. Each entry: { name, blurb }. Replaces the
  // algorithmic "The X & Y Era" headline. Keith 2026-05-15: the
  // headlines should feel evolutionary (league development arc), not
  // a rolling owner-name top-N. Drafts below; tweak as needed.
  // Narratives drafted by the league-context-aware research agent
  // (Sonnet, 2026-05-15). Blurbs are multi-paragraph — separator is a
  // blank line; renderEraBlurbHtml splits into <p> tags. Iterate by
  // editing the blurb strings directly; the wrapping logic does the
  // rest. Unverifiable claims tagged "[per Keith's recollection]".
  var ERA_STORIES = {
    2011: {
      name: "Birth of Something Beautiful",
      blurb:
"The inaugural season did not go smoothly, and that is precisely why it is beloved. Kevin Bousquet, Ryan's brother, got booted mid-auction before the first year even started. The league handed his half-built roster to Kris Lake, a name nobody had ever heard, and Lake promptly won Year 2 (2012) with it — finishing with the best all-play record in the league [per Keith's recollection]. Nothing like handing someone else's partially assembled car to a stranger and watching them take it to the championship.\n\n" +
"The 2011 inaugural title belonged to Shawn Blake (Blake Bombers), who stomped the competition through the regular season and the bracket. He was not the league-best by all-play that year — the era had zero all-play records for 2011, a reminder the league was still figuring out what to track — but his dominance in actual head-to-head wins was undeniable. Derrick Whitman arrived in 2012 and made an immediate statement, running the best all-play win rate in 2013 to take the title with his DBCA squad. Steve Bousquet and Josh Martel also joined the league in this era, filling out the foundational roster of owners who would define the league for the next decade [per Keith's recollection].\n\n" +
"The format itself was still being assembled. No rookie draft in 2011, a four-owner dispersal in 2012, and the first real dynasty cap rules clicking into place. Everyone was learning together, making it up as they went, and somehow the league that emerged was actually worth keeping."
    },
    2014: {
      name: "Figuring Out the Rules Before Breaking Them",
      blurb:
"The league grew up in this era. Rule votes happened in earnest, restructure limits got debated, the taxi squad found its form, and everyone stopped asking \"wait, can we do that?\" every week. The competitive landscape reflected the stability: every champion from 2014 to 2016 was a different owner, and none of them ran away with it easily.\n\n" +
"Ryan Bousquet's Ulterior Warrior took the 2014 title in a 177.9-to-155.3 final over Shawn Blake's Blake Bombers, capping a strong head-to-head season. The very next year Blake flipped the script — Blake Bombers beat Ulterior Warrior 199.4-to-125.4 in the 2015 final, one of the most lopsided championship games in league history. Then 2016 belonged to Bear Dunn's C-Town Chivalry, who broke through with a 249.4-to-164.2 stomping of Steve Bousquet's Good in Da Hood. Three different champions, three different storylines, and the Blake-vs-Bousquet rivalry started taking shape.\n\n" +
"The kicker scoring overhaul in 2016 was the most visible mechanical change, moving from flat bonus points to per-yard scoring. It seems minor in retrospect but it was the kind of rule that changed how people valued roster slots. This era set the tone for everything that followed."
    },
    2017: {
      name: "New Owners — Good and Very, Very Bad",
      blurb:
"The 2017-2019 era is remembered in two completely different ways depending on who you asked. On one side of the ledger: Steve Bousquet's Good in Da Hood put together back-to-back championships in 2017 and 2018, posting the best single-season all-play mark in the league to that point. He posted one of the best three-year cycle all-play stretches anyone had ever put up in this league. Josh Martel finally caught fire and won the 2019 title with Sex Manther, and Derrick Whitman returned to manage a transition year before the Balderelli brothers, AJ and Rico, took over his franchise mid-2017. The Balderellis hit the ground running — reportedly executing a trade within 34 minutes of taking over the roster [per Keith's recollection].\n\n" +
