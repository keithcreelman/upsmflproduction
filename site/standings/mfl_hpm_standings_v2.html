  // Picker + summary-table helpers for the Eras view.
  // - "all" (default) → one wide summary table, every owner × every era,
  //                     sortable by any column. No story blurbs here —
  //                     designed as a scan-the-history overview.
  // - <era_start year> → original per-era card, just filtered to that
  //                      single era (story + blurb visible, table full-
  //                      width so it doesn't need horizontal scroll).
  //
  // PF Index methodology (Keith 2026-05-15):
  // Normalize by seasons played first, then average. A 1-season
  // owner's PF must NOT be compared head-to-head against a 3-season
  // owner's PF — that punishes mid-era joiners. Compute per-season
  // PF rate for each row, then the era mean of those rates. Index
  // value is owner_rate ÷ era_mean_rate. 1.22 = +22% above era pace.
  function eraPfPerSeasonMean(rows) {
    var rateSum = 0, rateCount = 0;
    (rows || []).forEach(function (r) {
      var pf = Number(r.pf || 0);
      var seasons = Number(r.seasons_played || 0);
      if (pf > 0 && seasons > 0) {
        rateSum += pf / seasons;
        rateCount += 1;
      }
    });
    return rateCount > 0 ? rateSum / rateCount : 0;
  }
  function eraPfIndex(r, pfPerSeasonMean) {
    var pf = Number(r.pf || 0);
    var seasons = Number(r.seasons_played || 0);
    if (pf <= 0 || seasons <= 0 || pfPerSeasonMean <= 0) return 0;
    var rate = pf / seasons;
    return rate / pfPerSeasonMean;
  }
  // Legacy name retained so call sites that didn't get updated still
  // resolve — but it now returns the per-season mean.
  function eraPfMean(rows) { return eraPfPerSeasonMean(rows); }
  function renderEraPickerHtml(eras) {
    var opts = ['<option value="all"' + (state.eraSelected === "all" ? " selected" : "") + '>All Eras — Summary</option>'];
    eras.forEach(function (era) {
      var val = String(era.era_start);
      var num = eraNumberFromStart(era.era_start);
      var label = "Era " + num + " (" + era.era_start + "–" + era.era_end + ")";
      var story = ERA_STORIES[Number(era.era_start)];
      if (story && story.name) label += " — " + story.name;
      opts.push('<option value="' + escapeHtml(val) + '"' + (state.eraSelected === val ? " selected" : "") + '>' + escapeHtml(label) + '</option>');
    });
    return '<div class="era-picker-row"><label class="era-picker">View <select id="eraSel">' + opts.join("") + '</select></label></div>';
  }
  // Era number from start year: 2011 → 1, 2014 → 2, 2017 → 3, etc.
  // First UPS season is 2011 per league_context.
  function eraNumberFromStart(eraStart) {
    var n = Math.floor((Number(eraStart) - 2011) / 3) + 1;
    return n > 0 ? n : 1;
  }
  // Era blurbs may be multi-paragraph (separated by \n\n). Render
  // each chunk as its own <p>; escapeHtml each one so untrusted
  // characters don't break out. Empty blurb → empty string.
  function renderEraBlurbHtml(blurb) {
    var s = String(blurb == null ? "" : blurb).trim();
    if (!s) return "";
    var paras = s.split(/\n\s*\n/);
    return '<div class="era-blurb">'
      + paras.map(function (p) {
          return '<p>' + escapeHtml(p.trim()) + '</p>';
        }).join("")
      + '</div>';
  }
  // { "<era_start>|<owner>": Hawk Tuah Bowl titles } from /api/historical-finishes (finish 7, from 2011), the owner
  // of record being that season's owner_name — the same per-season owner /api/eras groups by.
  function hawktuahTitlesByEraOwner(finRows) {
    var out = {};
    (finRows || []).forEach(function (r) {
      if (!r || !isHawktuahTitle(r.season, r.final_finish) || !r.owner_name) return;
      var eraStart = Math.floor((Number(r.season) - 2011) / 3) * 3 + 2011;
      var k = eraStart + "|" + r.owner_name;
      out[k] = (out[k] || 0) + 1;
    });
    return out;
  }
  function hawkCell(hawk, eraStart, owner) {
    if (!hawk) return '<span class="dim" title="Historical finishes couldn’t be loaded">—</span>';
    return String(hawk[eraStart + "|" + owner] || 0);
  }
  function renderErasSummaryHtml(eras, hawk) {
    var summaryRows = [];
    eras.forEach(function (era) {
      var pfPerSeasonMean = eraPfPerSeasonMean(era.rows);
      var eraNum = eraNumberFromStart(era.era_start);
      (era.rows || []).forEach(function (r) {
        var pfVal = Number(r.pf || 0);
        summaryRows.push({
          era_label: "Era " + eraNum + " (" + era.era_start + "–" + era.era_end + ")",
          era_start: era.era_start,
          era_num: eraNum,
          owner_name: r.owner_name,
          seasons_played: r.seasons_played,
          ap_pct: r.ap_pct,
          ap_w: r.ap_w,
          h2h_w: r.h2h_w, h2h_l: r.h2h_l, h2h_t: r.h2h_t,
          pf: pfVal,
          // Pre-computed Idx (per-season normalized) so the sort
          // comparator can use it directly and partial-tenure owners
          // aren't penalized for fewer seasons.
          idx: eraPfIndex(r, pfPerSeasonMean),
          championships: r.championships,
          hawktuah_titles: hawk ? (hawk[era.era_start + "|" + r.owner_name] || 0) : null,
          avg_finish: r.avg_finish
        });
      });
    });
    var sa = state.eraSummary.sortKey;
    var dir = state.eraSummary.sortDir === "asc" ? 1 : -1;
    summaryRows.sort(function (a, b) {
      var av = a[sa], bv = b[sa];
      if (sa === "owner_name" || sa === "era_label") {
        return String(av || "").localeCompare(String(bv || "")) * dir;
      }
      av = Number(av || 0); bv = Number(bv || 0);
      if (av === bv) {
        if (a.era_start !== b.era_start) return a.era_start - b.era_start;
        return (b.ap_pct || 0) - (a.ap_pct || 0);
      }
      return (av - bv) * dir;
    });
    function th(key, label, isNum) {
      var active = state.eraSummary.sortKey === key;
      var arrow = active ? (state.eraSummary.sortDir === "asc" ? " ▲" : " ▼") : "";
      var cls = (isNum ? "num " : "") + "era-summary-th" + (active ? " active" : "");
      return '<th class="' + cls + '" data-era-sort="' + key + '">' + escapeHtml(label) + arrow + '</th>';
    }
    var head = '<tr>'
      + th("era_label",      "Era",     false)
      + th("owner_name",     "Owner",   false)
      + th("seasons_played", "Yrs",     true)
      + th("ap_pct",         "AP %",    true)
      + th("ap_w",           "AP W",    true)
      + '<th>H2H</th>'
      + th("idx",            "Idx",     true)
      + th("championships",  "🏆 Titles", true)
      + th("hawktuah_titles", "🚽 Hawk Tuah Bowl titles", true)
      + th("avg_finish",     "Avg Fin", true)
      + '</tr>';
    var body = summaryRows.map(function (r) {
      var partial = (r.seasons_played || 0) < 3;
      var idxStr = r.idx > 0 ? r.idx.toFixed(2) : "—";
      return '<tr' + (partial ? ' class="partial"' : '') + '>'
        + '<td>' + escapeHtml(r.era_label) + '</td>'
        + '<td>' + escapeHtml(r.owner_name || "—") + (partial ? ' <span class="partial-badge" title="Did not play all 3 seasons of the cycle">partial</span>' : '') + '</td>'
        + '<td class="num">' + (r.seasons_played || 0) + '</td>'
        + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
        + '<td class="num">' + (r.ap_w || 0) + '</td>'
        + '<td>' + rec(r.h2h_w, r.h2h_l, r.h2h_t) + '</td>'
        + '<td class="num">' + idxStr + '</td>'
        + '<td class="num">' + (r.championships || 0) + '</td>'
        + '<td class="num">' + hawkCell(hawk, r.era_start, r.owner_name) + '</td>'
        + '<td class="num">' + (r.avg_finish ? Number(r.avg_finish).toFixed(1) : "—") + '</td>'
        + '</tr>';
    }).join("");
    return '<section class="era-detail-card">'
      + '<div class="era-name">All Eras — Owner × Era Summary</div>'
      + '<div class="era-blurb">Every owner across every 3-year cycle. Click a column header to sort. Pick a specific era from the dropdown above for that era\'s story + a focused leaderboard.</div>'
      + '<div class="era-card-scroll"><table class="compact era-summary-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
      + '</section>';
  }
  function wireEraPicker(host) {
    var sel = host.querySelector("#eraSel");
    if (sel) {
      sel.addEventListener("change", function () {
        state.eraSelected = sel.value || "all";
        pushQs();
        render();
      });
    }
    host.querySelectorAll("th.era-summary-th").forEach(function (h) {
      h.addEventListener("click", function () {
        var key = h.getAttribute("data-era-sort");
        if (!key) return;
        if (state.eraSummary.sortKey === key) {
          state.eraSummary.sortDir = state.eraSummary.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.eraSummary.sortKey = key;
          state.eraSummary.sortDir = (key === "era_label" || key === "owner_name") ? "asc" : "desc";
        }
        render();
      });
    });
  }

  function renderEras(host) {
    // Hawktuah titles come from the recorded finishes (finish 7); a failed read shows "—", never a 0.
    var finsP = fetchD1("/api/historical-finishes", null).then(function (j) { return (j && j.ok) ? hawktuahTitlesByEraOwner(j.rows) : null; }, function () { return null; });
    return Promise.all([fetchD1("/api/eras", null), finsP]).then(function (both) {
      var resp = both[0], hawk = both[1];
      if (!resp || !resp.ok) return showError(host, "Couldn't load eras.");
      var erasAll = (resp.eras || []).filter(function (e) { return e.era_start >= ERA_FIRST; });
      var hasFS = resp.has_final_standings;
      var currentYear = (new Date().getUTCFullYear());
      var fsBanner = hasFS ? "" : '<div class="banner">⚠ <code>src_final_standings</code> not loaded — championship + hawktuah counts show 0 until migration 0033 runs.</div>';
      var prefix = fsBanner + DRAFT_CONTENT_BANNER
        + '<div class="note">🚽 Hawk Tuah Bowl titles = Hawk Tuah Bowl championships (finish 7, from 2011)' + (hawk ? '' : ' — not shown: the historical finishes couldn’t be loaded') + '. 🏆 Titles = UPS championships.</div>';

      // Picker first; then either the cross-era summary, or the
      // existing per-era card filtered to a single era.
      var pickerHtml = renderEraPickerHtml(erasAll);

      if (state.eraSelected === "all") {
        host.innerHTML = prefix + pickerHtml + renderErasSummaryHtml(erasAll, hawk);
        wireEraPicker(host);
        return;
      }

      var eras = erasAll.filter(function (e) { return String(e.era_start) === String(state.eraSelected); });
      if (!eras.length) {
        host.innerHTML = prefix + pickerHtml + '<div class="banner">Era not found — pick another from the dropdown.</div>';
        wireEraPicker(host);
        return;
      }
      var html = prefix + pickerHtml + '<div class="era-grid era-grid--single">';
      eras.forEach(function (era) {
        var rows = (era.rows || []).slice();
        var eligible = rows.filter(function (r) { return (r.seasons_played || 0) >= 3; });
        var byPct = eligible.slice().sort(function (a, b) {
          if ((b.ap_pct || 0) !== (a.ap_pct || 0)) return (b.ap_pct || 0) - (a.ap_pct || 0);
          if ((b.ap_w || 0)   !== (a.ap_w || 0))   return (b.ap_w || 0) - (a.ap_w || 0);
          return (b.pf || 0) - (a.pf || 0);
        });
        // Dynamic headliner count by AP% gap:
        //   - Clear leader (gap to #2 >= 5.0 ppts):   1-team era
        //   - Tight 2-way (gap to #3 >= 5.0 ppts):    2-team era
        //   - Genuinely tight pack (all top 3 within  3.0 ppts of each other): 3-team era
        //   - Default: 2-team era (matches our v1 framing)
        var HL_GAP_SOLO  = 0.05; // 5.0 pp separates #1 from the pack
        var HL_GAP_DUO   = 0.05; // 5.0 pp separates #2 from #3
        var HL_PACK_TIGHT = 0.03; // top 3 within 3.0 pp of each other
        var p1 = byPct[0] && byPct[0].ap_pct, p2 = byPct[1] && byPct[1].ap_pct, p3 = byPct[2] && byPct[2].ap_pct;
        var headlinerCount = 2;
        if (p1 != null && p2 != null && (p1 - p2) >= HL_GAP_SOLO) {
          headlinerCount = 1;
        } else if (p1 != null && p2 != null && p3 != null && (p1 - p3) <= HL_PACK_TIGHT) {
          headlinerCount = 3;
        } else if (p2 != null && p3 != null && (p2 - p3) < HL_GAP_DUO) {
          // 2-team isn't clearly better than 3 — bump to 3
          headlinerCount = 3;
        }
        var inProgress = (era.era_end >= currentYear);
        var eraTitle = inProgress ? era.era_start + "–" + era.era_end + " (in progress)" : era.era_start + "–" + era.era_end;

        // Hand-curated era story (name + blurb). Falls back to a generic
        // "Era N" label + empty blurb if not in the map.
        var story = ERA_STORIES[Number(era.era_start)] || {
          name: "Era",
          blurb: ""
        };

        // PF Index: each owner's PF / era-mean-PF (mean across all
        // owners in the era). 1.22 = +22% above era avg, 0.92 = -8%.
        // Saves horizontal space vs raw PF numbers. Falls back to "—"
        // when era PF totals aren't loaded.
        var pfSum = 0;
        var pfCount = 0;
        rows.forEach(function (r) {
          var pf = Number(r.pf || 0);
          if (pf > 0) { pfSum += pf; pfCount += 1; }
        });
        var pfMean = pfCount > 0 ? pfSum / pfCount : 0;

        var byPctAll = rows.slice().sort(function (a, b) {
          var ea = (a.seasons_played || 0) >= 3 ? 1 : 0;
          var eb = (b.seasons_played || 0) >= 3 ? 1 : 0;
          if (ea !== eb) return eb - ea;
          if ((b.ap_pct || 0) !== (a.ap_pct || 0)) return (b.ap_pct || 0) - (a.ap_pct || 0);
          return (b.ap_w || 0) - (a.ap_w || 0);
        });
        var lbHead = '<tr><th>Owner</th><th class="num">Yrs</th><th class="num">AP %</th><th class="num">AP W</th><th>H2H</th><th class="num" title="Points-For Index — owner PF-per-season ÷ era mean PF-per-season. 1.22 = +22% above era pace. Normalized by seasons played so partial-tenure owners aren\'t penalized.">Idx</th><th class="num" title="UPS championships">🏆 Titles</th><th class="num" title="Hawk Tuah Bowl championships (finish 7, from 2011)">🚽 Hawk Tuah Bowl titles</th><th class="num">Avg Fin</th></tr>';
        var pfPerSeasonMean = eraPfPerSeasonMean(rows);
        var lbBody = byPctAll.map(function (r) {
          var partial = (r.seasons_played || 0) < 3;
          var idxNum = eraPfIndex(r, pfPerSeasonMean);
          var idxStr = idxNum > 0 ? idxNum.toFixed(2) : "—";
          return '<tr' + (partial ? ' class="partial"' : '') + '>'
            + '<td>' + escapeHtml(r.owner_name || "—") + (partial ? ' <span class="partial-badge" title="Did not play all 3 seasons of the cycle">partial</span>' : '') + '</td>'
            + '<td class="num">' + (r.seasons_played || 0) + '</td>'
            + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
            + '<td class="num">' + (r.ap_w || 0) + '</td>'
            + '<td>' + rec(r.h2h_w, r.h2h_l, r.h2h_t) + '</td>'
            + '<td class="num">' + idxStr + '</td>'
            + '<td class="num">' + (r.championships || 0) + '</td>'
            + '<td class="num">' + hawkCell(hawk, era.era_start, r.owner_name) + '</td>'
            + '<td class="num">' + (r.avg_finish ? Number(r.avg_finish).toFixed(1) : "—") + '</td>'
            + '</tr>';
        }).join("");
        html += '<section class="era-card">'
          + '<div class="era-cycle">' + escapeHtml(eraTitle) + '</div>'
          + '<div class="era-name">' + escapeHtml(story.name) + (inProgress ? " <span class=\"era-inprogress\">(in progress)</span>" : "") + '</div>'
          + renderEraBlurbHtml(story.blurb)
          + '<div class="era-card-scroll"><table class="compact"><thead>' + lbHead + '</thead><tbody>' + lbBody + '</tbody></table></div>'
          + '</section>';
      });
      html += '</div>' + DEFERRED_NOTE;
      host.innerHTML = html;
      wireEraPicker(host);
    }, function () { showFailure(host, "the 3-year eras"); }).catch(drawFailed(host));
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 6 — Division Power Rankings

  function renderDivPower(host) {
    return fetchD1("/api/division-power-rankings", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load division power rankings.");
      var rows = (resp.rows || []).slice();
      var mode = state.dpMode;
      var view = rows.slice();
      if (mode === "best")       view = view.slice(0, 10);
      else if (mode === "worst") view = view.slice().sort(function (a, b) { return (a.ap_pct || 0) - (b.ap_pct || 0); }).slice(0, 10);
      else if (mode === "byCycle") {
        var grouped = {};
        rows.forEach(function (r) {
          var k = r.cycle_start + "|" + r.division;
          if (!grouped[k]) grouped[k] = {
            cycle_start: r.cycle_start, division: r.division,
            division_name: r.division_name || null,
            owners: r.owners,
            ap_w: 0, ap_l: 0, ap_t: 0, pf: 0, n: 0, produced_champion: 0
          };
          grouped[k].ap_w += (r.ap_w || 0);
          grouped[k].ap_l += (r.ap_l || 0);
          grouped[k].ap_t += (r.ap_t || 0);
          grouped[k].pf   += (r.pf || 0);
          grouped[k].n    += 1;
          grouped[k].produced_champion += (r.produced_champion || 0);
        });
        view = Object.keys(grouped).map(function (k) {
          var g = grouped[k];
          var games = g.ap_w + g.ap_l + g.ap_t;
          g.ap_pct = games > 0 ? (g.ap_w + 0.5 * g.ap_t) / games : null;
          return g;
        }).sort(function (a, b) { return (b.ap_pct || 0) - (a.ap_pct || 0); });
      }
      // Apply user sort
      view = sortRows(view, state.dpSort.key, state.dpSort.dir);

      var modeBtns = [
        { id: "allTime",  label: "All-time" },
        { id: "best",     label: "Best ever (top 10)" },
        { id: "worst",    label: "Worst ever (bottom 10)" },
        { id: "byCycle",  label: "By 3-year cycle" }
      ].map(function (m) {
        return '<button type="button" class="mode-btn" data-mode="' + m.id + '" data-active="' + (mode === m.id ? "1" : "0") + '">' + escapeHtml(m.label) + '</button>';
      }).join("");

      var sortHdrs = state.dpSort;
      var head = mode === "byCycle"
        ? '<tr><th class="num">#</th>'
          + sortableHeader("Cycle", "cycle_start", sortHdrs)
          + sortableHeader("Division", "division_name", sortHdrs)
          + '<th>Owners (cycle aggregate)</th>'
          + sortableHeader("AP W-L-T", "ap_w", sortHdrs)
          + sortableHeader("AP %", "ap_pct", sortHdrs, "num")
          + sortableHeader("PF", "pf", sortHdrs, "num")
          + sortableHeader("🏆 yrs", "produced_champion", sortHdrs, "num")
          + '</tr>'
        : '<tr><th class="num">#</th>'
          + sortableHeader("Season", "season", sortHdrs)
          + sortableHeader("Division", "division_name", sortHdrs)
          + '<th>Owners & AP %</th>'
          + sortableHeader("AP W-L-T", "ap_w", sortHdrs)
          + sortableHeader("AP %", "ap_pct", sortHdrs, "num")
          + sortableHeader("PF", "pf", sortHdrs, "num")
          + sortableHeader("🏆?", "produced_champion", sortHdrs)
          + '</tr>';

      // Render per-team breakdown for non-cycle modes (we have team_details
      // from the worker). For byCycle mode, fall back to the aggregated
      // owners string since teams may vary year over year within a cycle.
      function ownersCell(r) {
        if (mode === "byCycle") return escapeHtml(r.owners || "");
        var teams = r.team_details || [];
        if (!teams.length) return escapeHtml(r.owners || "");
        // Sort within division by overall PCT → div PCT → PF → AP%.
        var sorted = teams.slice().sort(function (a, b) {
          if (!!b.is_division_leader !== !!a.is_division_leader) return b.is_division_leader ? 1 : -1;
          return (b.computed_ap_pct || 0) - (a.computed_ap_pct || 0);
        });
        return sorted.map(function (t) {
          var pct = t.computed_ap_pct;
          var apStr = (pct != null) ? (Number(pct) * 100).toFixed(1) + "%" : "—";
          if (t.is_division_leader) {
            return '<span class="dp-owner dp-winner" title="Division Winner — AP ' + apStr + '"><span class="dp-name">' + escapeHtml(t.owner_name || "?") + '</span> <span class="dp-ap">' + apStr + '</span> 🏆</span>';
          }
          return '<span class="dp-owner"><span class="dp-name">' + escapeHtml(t.owner_name || "?") + '</span> <span class="dp-ap">' + apStr + '</span></span>';
        }).join(" · ");
      }

      var bodyHtml = view.map(function (r, i) {
        var divLabel = r.division_name || ("Division " + (r.division || "—"));
        return '<tr>'
          + '<td class="num">' + (i + 1) + '</td>'
          + '<td>' + (mode === "byCycle" ? (r.cycle_start + "–" + (r.cycle_start + 2)) : r.season) + '</td>'
          + '<td>' + escapeHtml(divLabel) + ' <span style="color:var(--dim);font-size:10px">' + escapeHtml(r.division || "") + '</span></td>'
          + '<td>' + ownersCell(r) + '</td>'
          + '<td>' + rec(r.ap_w, r.ap_l, r.ap_t) + '</td>'
          + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
          + '<td class="num">' + fmtCommas(r.pf, 1) + '</td>'
          + '<td' + (mode === "byCycle" ? ' class="num"' : '') + '>' + (r.produced_champion ? (mode === "byCycle" ? r.produced_champion : "Yes") : "—") + '</td>'
          + '</tr>';
      }).join("");

      host.innerHTML = '<div class="methodology">'
        + '⚠️ <strong>Methodology under review.</strong> Strength = aggregate All-Play % across the 3 teams in the division for that season. '
        + 'Tie-break AP wins → division PF. AP % is matchup-luck-neutral and normalizes across eras with different game counts. '
        + 'See <code>docs/standings_advanced_stats_proposals.md</code> §1B.'
        + '</div>'
        + '<div class="mode-row">' + modeBtns + '</div>'
        + '<div style="overflow-x:auto"><table><thead>' + head + '</thead><tbody>' + bodyHtml + '</tbody></table></div>'
        + '<div class="note">Click any column header to sort. Division names from MFL <code>TYPE=league</code>.</div>'
        + DEFERRED_NOTE;
      host.querySelectorAll("[data-mode]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.dpMode = b.getAttribute("data-mode");
          renderDivPower(host);
        });
      });
      wireSortClicks(host, state.dpSort, function () { renderDivPower(host); });
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // Boot
  // ────────────────────────────────────────────────────────────────────────
  renderShell();
  watchHeight();
  render();
})();
</script>
</body>
</html>
