<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UPS Standings</title>
  <style>
    /* Front Office look (Keith 2026-10-23): the same near-black page, panels, borders, blue accent and system type as
       site/rosters/v2/front_office.css. --gold keeps its old name but is now the Front Office accent blue; amber
       (--warn) marks what is projected or uncertain, so a forecast never reads as a result. */
    :root {
      --bg: #0b0f18;
      --panel: #141a26;
      --panel-2: #1a2230;
      --line: #2a3446;
      --line-soft: rgba(138, 151, 173, 0.25);
      --text: #e8edf5;
      --muted: #8a97ad;
      --dim: rgba(232, 237, 245, 0.5);
      --gold: #5b8dff;
      --gold-deep: #3f6fe0;
      --teal: #5b8dff;
      --navy: #0b0f18;
      --warn: #fbbf24;
      --ok: #4ade80;
      --silver: #c8d2dd;
      --bronze: #cd7f32;
      --hawktuah: #6e3c1e;
      --champ-bg: rgba(91, 141, 255, 0.15);
      --hawk-bg: rgba(251, 191, 36, 0.12);
      --accent-soft: #2a3f6e;
    }
    html, body {
      margin: 0;
      padding: 0;
      /* transparent page background so the standings module inherits
         the parent MFL chrome (matches the clean look of Rookie Draft
         Hub / Player Stats / Overview). Individual cards still have
         their own painted backgrounds (.card, .era-detail-card, etc).
         Keith 2026-05-15. */
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5;
      min-height: 100vh;
    }
    html.standalone, html.standalone body { background: var(--bg); }
    a { color: var(--teal); }
    .wrap {
      max-width: 1340px;
      margin: 0 auto;
      padding: 14px;
    }
    .card {
      background: linear-gradient(180deg, rgba(26, 34, 48, 0.98), rgba(11, 15, 24, 0.98));
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 26, 38, 0.55);
      flex-wrap: wrap;
    }
    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--gold);
    }
    .sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    /* Historical-data accuracy banner. Yellow-accent so it reads as
       "advisory" (not error). Lives directly under the title so it's
       impossible to miss across every standings view. */
    .hist-warn {
      margin-top: 8px;
      padding: 8px 12px;
      background: linear-gradient(180deg, rgba(91, 141, 255, 0.16), rgba(91, 141, 255, 0.06));
      border: 1px solid rgba(91, 141, 255, 0.55);
      border-left: 3px solid var(--gold);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      line-height: 1.45;
      max-width: 640px;
    }
    .hist-warn strong {
      color: var(--gold);
      font-weight: 800;
      margin-right: 0.25em;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-left: auto;
    }
    .views {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 26, 38, 0.3);
    }
    .view-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .view-btn:hover {
      border-color: var(--gold);
      color: var(--text);
    }
    .view-btn[data-active="1"] {
      background: rgba(91, 141, 255, 0.16);
      border-color: var(--gold);
      color: var(--gold);
    }
    .year-picker, .scope-picker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .year-picker select, .scope-picker select {
      background: var(--navy);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
    }
    .scope-picker.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .body {
      padding: 16px;
      min-height: 320px;
    }
    .loading, .empty, .err {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 13px;
    }
    .err { color: var(--warn); }
    .methodology {
      background: rgba(125, 232, 217, 0.06);
      border: 1px dashed rgba(125, 232, 217, 0.3);
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.55;
      margin-bottom: 14px;
    }
    .methodology strong { color: var(--text); }
    .methodology code {
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 4px;
      border-radius: 3px;
      color: var(--teal);
      font-size: 11px;
    }
    .banner {
      background: rgba(91, 141, 255, 0.1);
      border: 1px solid rgba(91, 141, 255, 0.3);
      color: var(--gold);
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 13px;
    }
    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
    }
    .deferred-note {
      margin-top: 14px;
      padding: 8px 12px;
      background: rgba(255, 138, 101, 0.08);
      border-left: 3px solid var(--warn);
      color: var(--muted);
      font-size: 11px;
      border-radius: 0 4px 4px 0;
    }
    .deferred-note strong { color: var(--warn); }

    /* ─── Tables ─── */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line-soft);
    }
    th {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 700;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
    }
    th.sortable:hover { color: var(--gold); }
    th.sortable[data-sort-active="1"] { color: var(--gold); }
    th.sortable[data-sort-active="1"]::after {
      content: " ▾";
      font-size: 9px;
      opacity: 0.7;
    }
    th.sortable[data-sort-active="1"][data-sort-dir="asc"]::after { content: " ▴"; }
    tbody tr:hover td { background: rgba(125, 232, 217, 0.04); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .compact th, .compact td { padding: 4px 7px; font-size: 11px; }

    .team-logo {
      width: 56px;
      height: 28px;
      border-radius: 3px;
      margin-right: 7px;
      vertical-align: middle;
      object-fit: contain;
    }
    .leader-pill {
      display: inline-block;
      background: var(--gold);
      color: #1a1208;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 7px;
      letter-spacing: 0.08em;
      flex: none;
      white-space: nowrap;
    }
    .seed-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .seed-badge.champ {
      background: var(--champ-bg);
      border: 1px solid rgba(91, 141, 255, 0.5);
      color: var(--gold);
    }
    .seed-badge.hawk {
      background: var(--hawk-bg);
      border: 1px solid rgba(255, 138, 101, 0.5);
      color: var(--warn);
    }
    .seed-badge.none {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--dim);
    }
    /* ─── Phase II-A1: status chips, seed dividers, AP GB, Luck, Form/trend, disclosure ─── */
    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      box-sizing: border-box;
      min-width: 38px;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      line-height: 14px;
      font-weight: 800;
      letter-spacing: 0.06em;
      white-space: nowrap;
      vertical-align: middle;
    }
    .status-chip.bye { background: var(--champ-bg); border: 1px solid rgba(91, 141, 255, 0.55); color: var(--gold); }
    /* #1329: teal = division winner, blue = wild card (the phone app's palette); the text carries the meaning. */
    .status-chip.div { background: rgba(45,212,191,0.14); border: 1px solid rgba(45,212,191,0.55); color: #7de8d9; }
    .status-chip.wc { background: rgba(91,141,255,0.14); border: 1px solid rgba(91,141,255,0.55); color: #a9c3ff; }
    .status-chip.projected { border-style: dashed; min-width: 64px; }
    .status-chip.projected small { font-weight: 400; opacity: .8; }
    /* Seed cells (#1329 decision 2): the number in a fixed-width slot, then the BYE / DIV / WC chip in its own slot,
       both centered on one line, so numbers and chips form two straight columns in every table. H1-H6 (the Hawk Tuah
       Bowl seeds, 7th-12th) are orange, as on the phone. */
    th.seed-col, td.seed-col { text-align: left; white-space: nowrap; width: 1%; }
    .seed-cell { display: inline-grid; grid-template-columns: 26px auto; align-items: center; column-gap: 6px; vertical-align: middle; }
    .seed-cell .seed-n { text-align: center; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; line-height: 18px; }
    .seed-cell .seed-n.hawk { color: var(--warn); }
    .seed-cell .seed-n.none { color: var(--dim); font-weight: 600; }
    tr.seed-divider td {
      padding: 3px 10px;
      border-bottom: 2px solid var(--gold);
    }
    tr.seed-divider.hawk-divider td {
      border-bottom: none;
      background: rgba(255, 138, 101, 0.08);
      color: var(--warn);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      padding: 5px 10px;
    }
    .luck-pos { color: #7cd992; }
    .luck-neg { color: var(--warn); }
    .form-chips { display: inline-flex; gap: 2px; }
    .form-chip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 3px;
      font-size: 9px; font-weight: 800;
    }
    .form-chip.W { background: rgba(124,217,146,0.18); color: #7cd992; }
    .form-chip.L { background: rgba(255,138,101,0.18); color: var(--warn); }
    .form-chip.T { background: rgba(255,255,255,0.1); color: var(--muted); }
    .rank-strip { display: inline-flex; gap: 1px; }
    .rank-cell {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 2px; font-size: 8px; font-weight: 700;
    }
    .rank-cell.top { background: rgba(124,217,146,0.22); color: #7cd992; }
    .rank-cell.mid { background: rgba(255,255,255,0.08); color: var(--muted); }
    .rank-cell.bot { background: rgba(255,138,101,0.16); color: var(--warn); }
    .rank-cell.playoff-wk { opacity: 0.45; filter: grayscale(1); }
    .rank-cell.empty { background: transparent; }
    tr.race-row, tr.hunt-row { cursor: pointer; }
    /* One row treatment for every desktop table (#1329 decision 2): a subtle background for the viewer's own row, a
       gold bar on the FIRST cell of a division leader's row, nothing on the other cells. Never a border, outline or
       shadow per cell (Safari drew those as a box around each cell). Keyboard focus tints the row; a mouse click
       doesn't outline it. */
    tr.you-row > td { background: rgba(125, 232, 217, 0.09); }
    tr.leader-row > td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
    tr.race-row:focus, tr.hunt-row:focus { outline: none; }
    tr.race-row:focus-visible > td, tr.hunt-row:focus-visible > td { background: rgba(125, 232, 217, 0.14); }
    tr.race-row[aria-expanded="true"] > td, tr.hunt-row[aria-expanded="true"] > td { background: rgba(20, 26, 38, 0.55); border-bottom-color: transparent; }
    tr.race-row td.disclosure-toggle { text-align: center; color: var(--muted); font-size: 10px; }
    tr.disclosure-row td {
      background: rgba(20, 26, 38, 0.55);
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    /* A team cell: the logo beside a block with the name (and its tags) over the owner, so a long name wraps inside
       its own block instead of around the logo. */
    .team-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .team-cell .team-logo { flex: none; margin-right: 0; }
    .team-cell .tc-text { min-width: 0; }
    .team-cell .tc-name { font-weight: 600; }
    .team-cell .leader-pill { margin-left: 5px; }
    /* Division cards sit two to a row at 1280: compact cells and smaller logos so the whole table (Seed chip
       included) fits the card instead of hiding its last column behind a sideways scroll. */
    table.div-table th, table.div-table td { padding: 7px 6px; }
    table.div-table th:first-child, table.div-table td:first-child { padding-left: 10px; }
    table.div-table .team-logo { width: 40px; height: 20px; }
    table.div-table .status-chip.projected { min-width: 56px; }
    .why-seed { color: var(--text); line-height: 1.5; }
    .why-blocked { color: var(--warn); font-style: italic; }
    .partial-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--dim);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-left: 5px;
      vertical-align: middle;
    }
    tr.partial td { opacity: 0.6; }
    /* A team's details (Playoff Picture cards, In the hunt, Full League): the seed sentence and a compact scoring
       summary as tiles that wrap; week by week lives in Weekly → Team by week. */
    .team-detail { display: grid; gap: 10px; font-size: 12px; min-width: 0; max-width: 760px; }
    .team-detail .why-seed { line-height: 1.5; }
    .stat-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 0; }
    .stat-tile { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line-soft); border-radius: 6px; padding: 6px 9px; min-width: 0; }
    .stat-tile dt { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .stat-tile dd { margin: 2px 0 0; font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .stat-tile dd small { font-size: 11px; font-weight: 400; color: var(--muted); }
    .detail-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 11px; color: var(--muted); }
    .detail-foot .link-btn { margin: 0; }

    /* ─── Divisions view ─── */
    .conf-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 6px 8px;
      margin: 16px 0 8px;
      border-bottom: 1px solid var(--line);
    }
    .conf-header:first-child { margin-top: 0; }
    .conf-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .conf-ap {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .conf-ap .val {
      color: var(--teal);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 14px;
      text-transform: none;
      letter-spacing: 0;
      margin-left: 6px;
    }
    .div-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr));
      gap: 16px;
    }
    .div-grid + .conf-header { margin-top: 24px; }
    .div-card {
      background: linear-gradient(180deg, rgba(26, 34, 48, 0.6), rgba(20, 26, 38, 0.6));
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
    }
    .div-card-header {
      padding: 12px 16px;
      background: rgba(20, 26, 38, 0.6);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .div-card-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .div-card-brand { min-width: 0; flex: 1; }
    .div-banner {
      height: 40px;
      width: auto;
      max-width: 100%;
      display: block;
      border-radius: 4px;
    }
    .div-card-ap {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .div-card-ap .val {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--teal);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 2px;
    }
    .div-card-body { padding: 4px 12px 12px; }
    .div-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      gap: 14px;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 13px;
    }
    .div-tb-note {
      grid-column: 1 / -1;
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      padding: 2px 0 4px 32px;
      letter-spacing: 0.02em;
    }
    .div-tb-note .step { color: var(--gold); font-weight: 700; font-style: normal; text-transform: uppercase; letter-spacing: 0.06em; font-size: 9px; }
    .div-row:last-child { border-bottom: none; }
    .div-row.leader {
      background: linear-gradient(90deg, rgba(91, 141, 255, 0.08), rgba(91, 141, 255, 0));
      border-left: 3px solid var(--gold);
      padding-left: 5px;
    }
    .div-row .team-block {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .div-row .team-name {
      font-weight: 700;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .div-row .team-name .tn-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .div-row .team-block > div { min-width: 0; }
    .div-row .team-logo { flex: 0 0 auto; }
    .div-row .owner {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }
    .div-row .stat {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      text-align: right;
      min-width: 56px;
    }
    .div-row .stat-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ─── True bracket layout ─── */
    .bracket-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .bracket-section h3 {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bracket-section.hawktuah h3 { color: #ffc99b; }
    /* The bracket itself: 4 columns (R1 / Semis / Final / Champion).
       Each column is a flex container with matchup cells distributed
       to roughly line up the connectors. */
    .bracket {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 0.85fr;
      gap: 18px;
      overflow-x: auto;
      min-height: 360px;
    }
    .bracket-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 200px;
    }
    .bracket-col-header {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 2px;
      text-align: center;
      font-weight: 700;
    }
    .bracket-col-header .wk {
      display: block;
      color: var(--teal);
      font-size: 9px;
      margin-top: 2px;
      letter-spacing: 0.12em;
    }
    .bracket-col-r1, .bracket-col-semis, .bracket-col-final, .bracket-col-champion {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 10px;
    }
    .bracket-slot {
      position: relative;
    }
    /* Connector lines between rounds (right edge of each matchup). */
    .bracket-slot.has-connector::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 50%;
      width: 10px;
      height: 1px;
      background: var(--line);
    }
    .matchup {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(20, 26, 38, 0.6);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .matchup.bye {
      border-style: dashed;
      background: rgba(20, 26, 38, 0.3);
    }
    .matchup-team {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
      position: relative;
    }
    .matchup-team + .matchup-team { border-top: 1px solid var(--line-soft); }
    .matchup-team.winner {
      color: var(--text);
      font-weight: 700;
      background: rgba(91, 141, 255, 0.12);
      border-left: 3px solid var(--gold);
    }
    .matchup-team.winner::after {
      content: "W";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--gold);
      color: #1a1208;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.04em;
    }
    .matchup-team.winner .matchup-score { padding-right: 24px; }
    .matchup-team.loser { opacity: 0.6; }
    /* F6 (Phase II-A2 correction pass): projected (chalk) advancement —
       visually distinct from a real .winner (no gold bar, no "W" badge,
       a "chalk pick" text tag instead) so a projected row can never be
       mistaken for an actual completed result. */
    .matchup-team.projected-leader {
      color: var(--text);
      font-weight: 600;
      background: rgba(90, 170, 200, 0.10);
      border-left: 3px dashed var(--teal);
    }
    .matchup-team.projected-leader::after {
      content: "chalk pick";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 1px solid var(--teal);
      color: var(--teal);
      font-size: 8px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .matchup-team.projected-leader .matchup-score { padding-right: 74px; }
    .round-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .matchup-team.projected-trail { opacity: 0.6; }
    .matchup-team.bye-row {
      font-style: italic;
      color: var(--dim);
      justify-content: center;
      padding: 6px 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .matchup-seed {
      display: inline-block;
      width: 22px;
      text-align: center;
      font-weight: 800;
      color: var(--gold);
      font-size: 11px;
    }
    .matchup-seed.unranked {
      color: var(--dim);
      font-weight: 600;
    }
    .matchup-name {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .matchup-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 12px;
    }
    /* Champion column — single highlighted card. */
    .champion-card {
      background: linear-gradient(135deg, rgba(91, 141, 255, 0.16), rgba(217,147,0,0.1));
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(91, 141, 255, 0.15);
    }
    .champion-card.hawk-champ {
      background: linear-gradient(135deg, rgba(110,60,30,0.4), rgba(110,60,30,0.15));
      border-color: #ffc99b;
      box-shadow: 0 4px 14px rgba(110,60,30,0.25);
    }
    .champion-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .champion-icon { font-size: 32px; margin: 6px 0 2px; }
    .champion-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .champion-owner {
      font-size: 11px;
      color: var(--muted);
    }
    .champion-pending {
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
    }
    /* F6: projected champion card — dashed teal border, muted gradient,
       distinct from both the real UPS gold and Hawktuah copper looks. */
    .champion-card.projected-champ {
      background: linear-gradient(135deg, rgba(90,170,200,0.14), rgba(90,170,200,0.05));
      border: 2px dashed var(--teal);
      box-shadow: 0 4px 14px rgba(90,170,200,0.12);
    }
    /* Consolation row underneath the main bracket. */
    .bracket-consolation {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--line-soft);
    }
    .bracket-consolation-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .bracket-col-list { display: flex; flex-direction: column; gap: 10px; }
    .bracket-consolation-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 10px;
    }
    @media (max-width: 760px) {
      .bracket { grid-template-columns: 1fr; }
      .bracket-col { min-width: unset; }
    }

    /* ─── Historical Finishes grid ─── */
    .hist-table { font-variant-numeric: tabular-nums; }
    .hist-table th, .hist-table td { text-align: center; padding: 4px 6px; }
    .hist-team { text-align: left !important; white-space: nowrap; min-width: 180px; }
    .hist-team .owner { font-weight: 700; }
    .hist-table th.hist-team[scope="row"] { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--text); }
    .hist-team .team { font-size: 10px; color: var(--muted); display: block; }
    .hist-cell { font-weight: 700; }
    .hist-cell.empty { color: rgba(255, 255, 255, 0.15); }
    .hist-cell.champ {
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      color: #1a1208;
      border-radius: 3px;
    }
    .hist-cell.silver {
      background: linear-gradient(135deg, var(--silver), #95a3b5);
      color: #1a1208;
      border-radius: 3px;
    }
    .hist-cell.bronze {
      background: linear-gradient(135deg, var(--bronze), #8b5a1f);
      color: #f7e9d0;
      border-radius: 3px;
    }
    .hist-cell.hawktuah {
      background: rgba(110, 60, 30, 0.5);
      color: #ffc99b;
      border-radius: 3px;
    }

    /* ─── Hall of Champions ─── */
    .hoc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr));
      gap: 16px;
    }
    /* Big single-champion detail card — same gold-trimmed look as
       the original .hoc-card but full-width, with a larger logo and
       roomier stat tiles. Used by the per-champion picker page. */
    .hoc-detail-card {
      background: linear-gradient(180deg, rgba(91, 141, 255, 0.10), rgba(26, 34, 48, 0.45) 35%);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 10px 28px rgba(91, 141, 255, 0.10);
    }
    .hoc-detail-head {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(91, 141, 255, 0.25);
    }
    .hoc-detail-logo {
      width: 96px; height: 96px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid rgba(91, 141, 255, 0.45);
      background: var(--navy);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    .hoc-detail-logo--blank {
      background: var(--panel);
    }
    .hoc-detail-titles { min-width: 0; }
    .hoc-detail-season {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .hoc-detail-team {
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.1;
    }
    .hoc-detail-owner {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }
    .hoc-detail-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .hoc-stat-big {
      background: rgba(20, 26, 38, 0.5);
      border: 1px solid rgba(91, 141, 255, 0.18);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .hoc-stat-big-k {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .hoc-stat-big-v {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .hoc-stat-big-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 4px;
    }
    .hoc-stat-big-rank {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }
    /* Summary-table sortable headers — mirror the Eras Summary look. */
    .hoc-summary-th { cursor: pointer; user-select: none; }
    .hoc-summary-th:hover { color: var(--gold); }
    .hoc-summary-th.active { color: var(--gold); }
    .hoc-card {
      background: linear-gradient(180deg, rgba(91, 141, 255, 0.10), rgba(26, 34, 48, 0.45) 35%);
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(91, 141, 255, 0.08);
    }
    .hoc-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(91, 141, 255, 0.25);
    }
    .hoc-season {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .hoc-trophy { font-size: 24px; }
    .hoc-team {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .hoc-logo {
      width: 48px; height: 48px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.18);
      background: var(--navy);
    }
    .hoc-team-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .hoc-owner {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .hoc-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 14px;
      margin-bottom: 14px;
    }
    .hoc-stat-rank { grid-column: 1 / -1; }
    .hoc-stat-k {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .hoc-stat-v {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }
    .hoc-stat-pct {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-left: 6px;
    }
    .hoc-final {
      background: rgba(20, 26, 38, 0.55);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .hoc-final-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .hoc-final-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3px 0;
    }
    .hoc-final-team {
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
    }
    .hoc-final-owner {
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
    }
    .hoc-final-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--muted);
    }
    .hoc-final-score.champ-win { color: var(--gold); }
    .hoc-box-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--teal);
      text-decoration: none;
    }
    .hoc-box-link:hover { color: var(--gold); text-decoration: underline; }

    /* ─── Eras ─── */
    .era-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr));
      gap: 14px;
    }
    /* When the picker filters to a single era, render one full-width
       card (no grid) so the leaderboard table can breathe. */
    .era-grid--single {
      display: block;
    }
    .era-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-width: 0;
    }
    /* Full-width version of .era-card, used by the per-era detail page
       and the cross-era summary table. */
    .era-detail-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 20px;
      min-width: 0;
    }
    .era-card-scroll {
      overflow-x: auto;
      margin: 0 -4px;
      padding: 0 4px;
    }
    .era-card .compact { min-width: 540px; }
    /* Picker row sits above the era card(s). */
    .era-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .era-picker {
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .era-picker select {
      background: var(--navy);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    /* Cross-era summary table — sortable, full width. */
    .era-summary-table { width: 100%; }
    .era-summary-th { cursor: pointer; user-select: none; }
    .era-summary-th:hover { color: var(--gold); }
    .era-summary-th.active { color: var(--gold); }
    .era-cycle {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .era-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
      margin: 4px 0 8px;
      line-height: 1.25;
    }
    .era-inprogress {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: none;
    }
    /* Hand-curated narrative per era — replaces the algorithmic
       headliner + captain pills (Keith 2026-05-15). Multi-paragraph
       blurbs are split into <p> elements by renderEraBlurbHtml. */
    .era-blurb {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 14px;
      opacity: 0.92;
    }
    .era-blurb p {
      margin: 0 0 10px;
    }
    .era-blurb p:last-child {
      margin-bottom: 0;
    }
    .era-captains-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 12px;
      margin-bottom: 6px;
    }
    .era-captains {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }
    .cap-pill {
      background: rgba(125, 232, 217, 0.1);
      border: 1px solid rgba(125, 232, 217, 0.3);
      color: var(--teal);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .cap-empty { font-size: 11px; color: var(--muted); font-style: italic; }

    /* ─── Division Power Rankings owner pills ─── */
    .dp-owner {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      white-space: nowrap;
      margin-right: 2px;
    }
    .dp-owner .dp-name { color: var(--text); font-weight: 600; }
    .dp-owner .dp-ap { color: var(--muted); font-variant-numeric: tabular-nums; }
    .dp-owner.dp-winner {
      background: rgba(91, 141, 255, 0.16);
      border-color: var(--gold);
    }
    .dp-owner.dp-winner .dp-name { color: var(--gold); font-weight: 800; }
    .dp-owner.dp-winner .dp-ap { color: var(--gold); }

    /* ─── Division Power Rankings modes ─── */
    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }
    .mode-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
    }
    .mode-btn[data-active="1"] {
      background: rgba(91, 141, 255, 0.16);
      border-color: var(--gold);
      color: var(--gold);
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: rgba(20, 26, 38, 0.55);
      color: var(--muted);
      font-size: 11px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer code { background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; color: var(--teal); }

    /* ─── Standings v3 (desktop): tabs, view bar, Playoff Picture, Weekly, Trends ─── */
    .views { gap: 6px; }
    .view-btn[aria-selected="true"] { background: rgba(91, 141, 255, 0.16); border-color: var(--gold); color: var(--gold); }
    .subnav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: rgba(20, 26, 38, 0.18); }
    .subnav[hidden] { display: none; }
    .view-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
    .view-bar .fresh { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--teal); }
    .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .seg-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
    .mode-btn[aria-pressed="true"] { background: rgba(91, 141, 255, 0.16); border-color: var(--gold); color: var(--gold); }
    .mode-btn:focus-visible, .view-btn:focus-visible, .retry-btn:focus-visible, .link-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    details.about { margin-left: auto; font-size: 12px; color: var(--muted); max-width: 100%; }
    details.about > summary { cursor: pointer; color: var(--teal); font-weight: 700; list-style: none; }
    details.about > summary::-webkit-details-marker { display: none; }
    details.about > summary::before { content: "ⓘ "; }
    details.about[open] { flex-basis: 100%; margin-left: 0; background: rgba(20, 26, 38, 0.55); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
    details.about dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0 0; }
    details.about dt { color: var(--text); font-weight: 700; }
    details.about dd { margin: 0; line-height: 1.45; }
    .summary-card { background: rgba(91, 141, 255, 0.07); border: 1px solid rgba(91, 141, 255, 0.35); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.55; }
    .summary-card b { color: var(--gold); }
    .err-box { background: rgba(255, 138, 101, 0.08); border: 1px solid rgba(255, 138, 101, 0.45); border-left: 3px solid var(--warn); border-radius: 6px; padding: 12px 16px; color: var(--text); font-size: 13px; line-height: 1.5; }
    .err-box b { color: var(--warn); }
    .err-box .psub { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
    .psub { color: var(--muted); font-size: 11px; line-height: 1.45; text-transform: none; letter-spacing: 0; font-weight: 400; }
    .retry-btn, .link-btn { background: transparent; border: 1px solid var(--teal); color: var(--teal); border-radius: 5px; padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: 8px; }
    .link-btn { margin: 8px 0 0; }
    .pic-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
    /* Forecast */
    .fc-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .fc-tile { background: rgba(20, 26, 38, 0.55); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 8px; padding: 10px 12px; font-size: 12px; min-width: 0; }
    .fc-tile.hawk { border-top-color: var(--warn); }
    .fc-tile h3 { margin: 0 0 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
    .fc-tile.hawk h3 { color: var(--warn); }
    .fc-big { font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
    .fc-line { margin-top: 5px; overflow-wrap: anywhere; line-height: 1.4; }

  <div class="wrap" id="app">
    <div class="card">
      <header class="head">
        <div>
          <div class="title">UPS Standings</div>
          <div class="sub">Full league · divisions · playoff picture · forecast · league history</div>

          </div>

        <div class="controls">
          <label class="year-picker">Season <select id="yearSel"></select></label>
          <label class="scope-picker" id="scopePicker">
            Scope

              <option value="full">Full Season</option>
              <option value="regular">Regular Season</option>
              <option value="playoffs">Playoffs</option>

            <span id="customWk" style="display:none;white-space:nowrap"> wk
              <input id="cwStart" type="number" min="1" max="25" style="width:46px">–<input id="cwEnd" type="number" min="1" max="25" style="width:46px">
            </span>
          </label>
        </div>
      </header>

      <nav class="views" id="viewNav" role="tablist" aria-label="Standings views"></nav>

      <main class="body" id="body">
        <div class="loading">Loading…</div>
      </main>

      <footer class="footer">
        <code id="workerLbl" style="display:none"></code>
      </footer>
    </div>
  </div>

<script>
(function () {

  // ────────────────────────────────────────────────────────────────────────
  function el(id) { return document.getElementById(id); }

      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;")

  function pad4(v) { var s = String(v == null ? "" : v); while (s.length < 4) s = "0" + s; return s; }
  // The viewer's own franchise (the Rookie Draft Hub's localStorage key) — highlights "your" row in the race table.
  var VIEWER_FID = (function () {

    } catch (e) { return null; }

  function fmtPct(p) {

  var DIV_BANNERS_2025 = {

    "LEGION OF BOOM":   "74598_division01_logo.png",
    "MAKE IT RAIN":     "74598_division02_logo.png",
    "DOG POUND 4 LIFE": "74598_division03_logo.png"
  };
  function divBannerHtml(code, name) {
    var file = (state.year <= 2025) ? DIV_BANNERS_2025[String(name || "").toUpperCase().trim()] : null;
    if (file) {
      var url = "https://keithcreelman.github.io/upsmflproduction/standings/div_logos/" + file;
      return '<img class="div-banner" src="' + url + '" alt="' + escapeHtml(name || "") + '">';
    }

  }
  function fmtCommas(n, digits) {

  }

  }

  function tkoMark(r) {
    if (!r || !r.takeover) return "";
    var t = r.takeover;

      + '<div style="font-weight:600;margin-bottom:4px">Ownership note — record-keeping per league_context §D.2</div>'

  }
  function fetchD1(endpoint, year) {

      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (json) { if (json && json.ok !== false) state.cache[key] = json; return json; });
  }

        hm: state.view === "weekly" && state.wview === "heat" && state.heat === "table" ? "table" : null,

        chart: state.view === "trends" && state.chart ? state.chart : null,

  function divisionLabel(r) {

  // Sort utility: stable, click-to-sort. Nulls always sort last, in both directions.

      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === "string" || typeof bv === "string") {
        av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
        return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      return dir === "asc" ? (av - bv) : (bv - av);
    });

  }
  // Build a clickable th. `align` = "left" or "num"; `title` = an optional one-line explanation (tooltip).

    return '<th class="sortable' + (align === "num" ? " num" : "") + '" data-sort-key="' + escapeHtml(key) + '" data-sort-active="' + active + '" data-sort-dir="' + sortState.sortDir + '"' + (title ? ' title="' + escapeHtml(title) + '"' : '') + ' scope="col">' + escapeHtml(label) + '</th>';
  }
  // Keys whose natural first click is ascending (names, seeds, finishes, ranks where 1 is best).
  var ASC_FIRST = { owner_name: 1, franchise_name: 1, division: 1, division_name: 1, seed: 1, fin: 1, _pfRank: 1, _avgRank: 1, _l3Rank: 1, _paRank: 1, _back: 1, _divGBs: 1, _wcGB: 1 };

      th.addEventListener("click", function () {

        if (sortState.sortKey === key) {

      });

  // ────────────────────────────────────────────────────────────────────────
  // Embed sizing — mfl_hpm_embed_loader.js sizes its iframe from this message.
  // ────────────────────────────────────────────────────────────────────────
  var lastSentHeight = 0;
  function notifyHeight() {
    try {
      var parent = window.parent;
      if (!parent || parent === window || typeof parent.postMessage !== "function") return;
      var app = el("app");
      var box = app && app.getBoundingClientRect ? app.getBoundingClientRect() : null;
      var h = Math.ceil((box && box.height) || 0);

  function renderShell() {

    // dark background so the light text stays readable.
    try { if (!window.parent || window.parent === window) document.documentElement.classList.add("standalone"); } catch (e) {}

      return '<button type="button" class="view-btn" role="tab" data-view="' + v.id + '" aria-selected="' + (on ? "true" : "false") + '" data-active="' + (on ? "1" : "0") + '">' + escapeHtml(v.label) + '</button>';
    }).join("");

      b.addEventListener("click", function () { state.view = b.getAttribute("data-view"); pushQs(); render(); });
    });

    }).join("");

    // Scope picker (Full / Regular / Playoffs / Custom weeks) — Full League and Divisions only, for historical use.
    var scopeSel = el("scopeSel");
    var customWk = el("customWk");
    var cwStart = el("cwStart");
    var cwEnd = el("cwEnd");

        pushQs(); render();
      });

      if (cwEnd) cwEnd.addEventListener("change", onCustom);

  }

  // One way to change the season (the header picker, the bracket's own picker): keeps both pickers in step.
  function setYear(y) {
    if (!(y >= FIRST_YEAR)) return;
    state.year = y;
    state.overall = { sortKey: null, sortDir: "asc" };   // each season opens in its own default order
    state.week = null;

    if (sel) sel.value = String(y);

  }

  }
  function renderSubNav() {

  // ────────────────────────────────────────────────────────────────────────

  var STATUS_LABEL = { BYE: "Bye", DIV: "Division winner", WC: "Wild card" };
  // projected: the regular season isn't over, so the status is where the team would be if the season ended today.

  function rowsByFid(rows) { var m = {}; (rows || []).forEach(function (r) { if (r) m[pad4(r.franchise_id)] = r; }); return m; }
  // ▲/▼ since last week — the worker's order_change (+ = moved up). Text + aria-label, never color alone.

  // Division leaders: each division in the order of its leader's seed, teams in the worker's division order.
  function divisionLeadersHtml(resp, rows, final, magic) {

  // ── Playoff Picture, bracket first (Keith 2026-10-22) ──
  //   Two brackets, never mixed: TODAY = the seeds if the season ended today (the worker's ladder); FORECAST = the
  // seeds in the order of average finish across the newest UPS Wire simulation, with each team's odds beside it. Neither
  // decides a game: Round 2 re-seeds (the top seed meets the lowest seed left), so the semifinals name a rule, not a team.
  // Every matchup opens the Tale of the Tape (descriptive, never a prediction). Below: the projected rookie-draft order
  // with pick ownership (ppDraft), then the seed cards, races and tiebreaks behind one control.
  function ppForecast(resp) {
    var W = Number((resp.regular_season || {}).through_week);
    if (!(W >= 1)) return Promise.resolve(null);
    return newestForecast(state.year, W).then(function (cur) {
      if (!cur) return null;
      return Promise.all([newestForecast(state.year, Number(cur.throughWeek) - 1), forecastDetail(cur)]).then(function (got) {
        var recon = forecastReconcile(cur, resp);
        if (recon.hard.length) return { cur: cur, refused: recon.hard };
        return { cur: cur, model: forecastModel(resp, cur, got[0], got[1]), why: got[1].why || null };
      });
    }).catch(function () { return null; });
  }
  function ppTeam(seedLabel, name, sub) {
    return '<div class="pp-team"><span class="pp-seed">' + escapeHtml(seedLabel) + '</span><span class="pp-name">' + escapeHtml(name) + '</span>'
      + (sub ? '<span class="pp-sub">' + sub + '</span>' : '') + '</div>';
  }
  // side: [{ fid, name, label, sub }] in seed order (6 teams). kind: "today" | "proj".
  function ppSideHtml(title, side, kind, hawk, extra) {
    if (!side || side.length !== 6) return '';
    function game(a, b, round) {
      return '<div class="pp-game">' + ppTeam(a.label, a.name, a.sub) + ppTeam(b.label, b.name, b.sub)
        + '<div class="pp-tape"><button type="button" class="link-btn" data-tape="' + a.fid + '|' + b.fid + '" data-tape-kind="' + kind + '" data-tape-round="' + escapeHtml(round) + '" data-tape-seeds="' + escapeHtml(a.label + '|' + b.label) + '">Tale of the Tape</button></div></div>';
    }
    var bye = function (t) { return '<div class="pp-game">' + ppTeam(t.label, t.name, t.sub) + '<div class="pp-feed">bye in Round 1</div></div>'; };
    var r1 = game(side[2], side[5], (hawk ? "Hawk Tuah Bowl" : "UPS") + " Round 1") + game(side[3], side[4], (hawk ? "Hawk Tuah Bowl" : "UPS") + " Round 1");
    var semis = '<div class="pp-game">' + ppTeam(side[0].label, side[0].name, side[0].sub) + '<div class="pp-feed">v the lowest seed left after Round 1</div></div>'
      + '<div class="pp-game">' + ppTeam(side[1].label, side[1].name, side[1].sub) + '<div class="pp-feed">v the other Round 1 winner</div></div>';
    var fin = '<div class="pp-game"><div class="pp-feed">' + (hawk ? "Hawk Tuah Bowl" : "UPS Championship") + ': the semifinal winners</div>' + (extra || '') + '</div>';
    return '<section class="pp-side' + (kind === "proj" ? " proj" : "") + '"><h3>' + (hawk ? "🦅 " : "🏆 ") + escapeHtml(title) + '</h3>'
      + '<div class="pp-rounds"><div><div class="pp-col-h">Byes · Round 1</div>' + bye(side[0]) + bye(side[1]) + r1 + '</div>'
      + '<div><div class="pp-col-h">Semifinals (re-seeded)</div>' + semis + '</div>'
      + '<div><div class="pp-col-h">Final</div>' + fin + '</div></div></section>';
  }
  function ppTodaySides(resp) {
    var rows = resp.rows || [], by = {}, pos = {};
    rows.forEach(function (r, i) { pos[pad4(r.franchise_id)] = i + 1; if (r.playoff_seed != null) by[Number(r.playoff_seed)] = r; });
    var champ = [1, 2, 3, 4, 5, 6].map(function (n) { var r = by[n]; return r ? { fid: pad4(r.franchise_id), name: nameOf(r), label: String(n), sub: r.is_division_leader ? "division leader" : "wild card" } : null; });
    var outside = rows.filter(function (r) { return r.playoff_seed == null; }).slice(0, 6);
    var hawk = outside.map(function (r, i) { return { fid: pad4(r.franchise_id), name: nameOf(r), label: "H" + (i + 1), sub: "" }; });
    return { champ: champ.every(Boolean) ? champ : null, hawk: hawk.length === 6 ? hawk : null };
  }
  function ppProjSides(model) {
    var t = model.teams;   // the Forecast's projected order: average finishing place
    if (!model.hasDetail || t.length !== 12) return null;
    function e(x, i) {
      var p = x.place ? x.place[i] : null;
      var sub = (p != null ? "this seed in " + fcPct(p) : "") + (i < 6 ? " · playoffs " + fcPct(x.po) : " · H1–H6 " + fcPct(1 - x.po));
      return { fid: x.fid, name: x.name, label: i < 6 ? String(i + 1) : "H" + (i - 5), sub: escapeHtml(sub) };
    }

  }
  // fc: undefined = the Forecast is still loading; null = none available; else ppForecast's answer.
  function ppOutlookHtml(resp, final, fc) {
      var today = ppTodaySides(resp);
      var proj = fc && fc.model ? ppProjSides(fc.model) : null;
      var mode = state.ppMode === "proj" && proj ? "proj" : "today";
      var W = Number((resp.regular_season || {}).through_week);
      var sw = '<div class="pp-switch" role="group" aria-label="Which bracket"><span class="seg-label">Bracket:</span>'
        + '<button type="button" class="mode-btn" data-pp="today" aria-pressed="' + (mode === "today") + '">If the season ended today</button>'
        + '<button type="button" class="mode-btn" data-pp="proj" aria-pressed="' + (mode === "proj") + '"' + (proj ? '' : ' disabled') + '>Projected · ' + (fc && fc.cur ? 'Week ' + fc.cur.throughWeek + ' Forecast' : 'Forecast') + '</button></div>';
      var html;
      if (mode === "today") {
        html = '<div class="pp-head"><span class="pp-label today">If the season ended today</span> Seeds from the standings through Week ' + W + (final ? ' (final)' : '') + '. Not a prediction: no game is decided.</div>'
          + '<div class="pp-sides">' + ppSideHtml("UPS Championship · seeds 1–6", today.champ, "today", false) + ppSideHtml("Hawk Tuah Bowl · H1–H6", today.hawk, "today", true) + '</div>';
      } else {
        var m = fc.model, cur = fc.cur;
        var ups = topBy(m.teams, "title", 1)[0], hawkT = topBy(m.teams, "hawk", 1)[0];

        };
        html = '<div class="pp-head"><span class="pp-label proj">Projected · not final</span> Seeds in the order of average finish across ' + Number(cur.runs || 10000).toLocaleString("en-US") + ' simulated seasons in the UPS Wire’s Week ' + cur.throughWeek + ' Forecast (generated ' + escapeHtml(fcWhen(cur)) + '). Each team shows how often it lands on that seed. It updates with each week’s Forecast.</div>'
          + '<div class="pp-sides">' + ppSideHtml("UPS Championship · projected seeds", proj.champ, "proj", false, ups ? champLine(ups, fu) : '')
          + ppSideHtml("Hawk Tuah Bowl · projected seeds", proj.hawk, "proj", true, hawkT ? '<div class="pp-champ">Most likely Hawk Tuah Bowl champion: <b>' + escapeHtml(hawkT.name) + '</b> ' + fcPct(hawkT.hawk) + '</div>' + (fh ? '<div class="pp-champ">Most likely final: <b>' + escapeHtml(fh.a.name) + '</b> v <b>' + escapeHtml(fh.b.name) + '</b> ' + fcPct(fh.p) + '</div>' : '') : '') + '</div>';
      }
      var why = fc === undefined ? 'Loading the UPS Wire Forecast for the projected bracket…'
        : !fc ? 'No UPS Wire forecast is available for ' + state.year + ' yet, so only today’s bracket is shown.'
        : fc.refused ? 'The Forecast isn’t used: its starting scores differ from these standings (' + escapeHtml(fc.refused[0]) + ').'
        : !proj ? 'The ' + 'Week ' + fc.cur.throughWeek + ' Forecast didn’t record finishing places, so there’s no projected bracket.' : '';
      return '<h3 class="sec-h">' + state.year + ' playoff bracket</h3>' + sw + html + (why ? '<div class="note">' + why + '</div>' : '');
  }
  function drawPlayoffOutlook(host, resp, final) {
    if (!host.querySelector) return Promise.resolve();
    return ppForecast(resp).then(function (fc) {
      var slot = host.querySelector("#ppBracket"), dslot = host.querySelector("#ppDraft");
      if (!slot) return;
      slot.innerHTML = ppOutlookHtml(resp, final, fc);
      slot.querySelectorAll("[data-pp]").forEach(function (b) {
        b.addEventListener("click", function () { if (b.disabled) return; state.ppMode = b.getAttribute("data-pp"); drawPlayoffOutlook(host, resp, final); });
      });
      wireTape(slot, resp);
      if (dslot && !dslot.getAttribute("data-done")) drawDraftOutlook(dslot, resp, fc);
      notifyHeight();
    });
  }

  // ── Tale of the Tape on desktop (the phone's sheet, from the same shared numbers: standings_race.js matchupTape) ──
  function tapeRow(label, a, b, edge, sub) {
    return '<tr><td>' + escapeHtml(label) + (sub ? '<div class="rk">' + escapeHtml(sub) + '</div>' : '') + '</td>'
      + '<td class="v' + (edge === "a" ? " edge" : "") + '">' + a + '</td><td class="v' + (edge === "b" ? " edge" : "") + '">' + b + '</td></tr>';
  }
  function tapeVal(v, rank) { return (v == null ? "—" : fmtPts(v)) + (rank ? ' <span class="rk">' + ordinal(rank) + '</span>' : ''); }
  function openTape(resp, a, b, kind, round, seeds, trigger) {
    var M = window.UPS_STANDINGS_RACE;
    var t = M && M.matchupTape ? M.matchupTape(resp, a, b) : null;
    var by = rowsByFid(resp.rows), sl = String(seeds || "|").split("|");
    var head = '<h3>Tale of the Tape</h3><div class="psub">' + escapeHtml(round) + ' · ' + (kind === "proj" ? 'projected matchup (Forecast seeds), not final' : 'if the season ended today') + ' · what has happened so far, not a prediction</div>';
    var body;
    if (!t || t.status !== "ok") body = '<div class="err-box" role="alert">The weekly results couldn’t be verified, so nothing is compared.</div>';
    else {
      var A = t.a, B = t.b, e = t.edges || {}, c = function (x) { return x.ceiling; };
      var hdr = '<tr><td></td><td class="v"><b>' + escapeHtml(sl[0]) + ' ' + escapeHtml(nameOf(by[a])) + '</b></td><td class="v"><b>' + escapeHtml(sl[1]) + ' ' + escapeHtml(nameOf(by[b])) + '</b></td></tr>';
      body = '<table class="tape-tbl"><tbody>' + hdr
        + tapeRow("H2H record", recStr(A.record), recStr(B.record), null)
        + tapeRow("All-Play", recStr(A.ap), recStr(B.ap), null)
        + tapeRow("Season scoring average", tapeVal(A.avg.value, A.avg.rank), tapeVal(B.avg.value, B.avg.rank), e.avg, "per week")
        + tapeRow("Last 3 weeks average", tapeVal(A.last3.avg, A.last3.rank), tapeVal(B.last3.avg, B.last3.rank), e.last3)
        + tapeRow("All-Play wins per week", tapeVal(A.apPerWeek.value, A.apPerWeek.rank), tapeVal(B.apPerWeek.value, B.apPerWeek.rank), e.apPerWeek, "of 11")
        + tapeRow("Weekly swing", "±" + fmtPts(A.consistency.spread) + ' <span class="rk">' + ordinal(A.consistency.rank) + ' steadiest</span>', "±" + fmtPts(B.consistency.spread) + ' <span class="rk">' + ordinal(B.consistency.rank) + ' steadiest</span>', e.consistency)
        + tapeRow("Highest week", tapeVal(c(A).high.value, c(A).high.rank), tapeVal(c(B).high.value, c(B).high.rank), e.high)
        + tapeRow("Median week", tapeVal(c(A).median.value, c(A).median.rank), tapeVal(c(B).median.value, c(B).median.rank), e.median)
        + tapeRow("Lowest week", tapeVal(c(A).low.value, c(A).low.rank), tapeVal(c(B).low.value, c(B).low.rank), e.low)
        + tapeRow("Opponent points per H2H game", tapeVal(A.faced.perGame, null), tapeVal(B.faced.perGame, null), null, "schedule, not skill")
        + '</tbody></table><div class="note">Gold = the stronger side in that category so far; ranks are among all 12 teams, regular season. The phone app’s Tale of the Tape also shows offense / IDP points and the owners’ head-to-head history.</div>';
    }
    var ov = document.createElement("div");
    ov.className = "tape-overlay";
    ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Tale of the Tape");
    ov.innerHTML = '<div class="tape-box"><button type="button" class="tape-close" aria-label="Close">×</button>' + head + body + '</div>';
    var prevFocus = document.activeElement;
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener("keydown", onKey); if (prevFocus && prevFocus.focus) prevFocus.focus(); }
    function onKey(ev) { if (ev.key === "Escape") close(); }
    ov.addEventListener("click", function (ev) { if (ev.target === ov) close(); });
    ov.querySelector(".tape-close").addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    // Over the whole page, with the box at the button that opened it: inside MFL's frame (sized to the page) a
    // fixed overlay would open at the top of a tall frame, off the screen the owner is looking at.
    var docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    var at = trigger && trigger.getBoundingClientRect ? trigger.getBoundingClientRect().top + (window.scrollY || 0) - 60 : 10;
    ov.style.minHeight = docH + "px";
    ov.style.paddingTop = Math.max(10, Math.min(at, docH - 700)) + "px";
    document.body.appendChild(ov);
    ov.querySelector(".tape-close").focus({ preventScroll: true });

  function wireTape(scope, resp) {
    scope.querySelectorAll("[data-tape]").forEach(function (b) {

      });
