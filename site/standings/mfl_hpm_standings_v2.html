    if (!list || !aId || !bId) return null;
    var a = pad4(aId), b = pad4(bId);
    for (var i = 0; i < list.length; i++) {
      var g = list[i]; if (!g) continue;
      var ga = pad4(g.franchise_id), gb = pad4(g.opponent_franchise_id);
      if ((ga === a && gb === b) || (ga === b && gb === a)) return g;
    }
    return null;
  }
  function winnerIdOf(g) {
    if (!g) return null;
    return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.franchise_id) : pad4(g.opponent_franchise_id);
  }
  function loserIdOf(g) {
    if (!g) return null;
    return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.opponent_franchise_id) : pad4(g.franchise_id);
  }

  function renderSeedTable(seeds) {
    if (!seeds.length) return '<div class="empty">No seeds yet.</div>';
    var rows = seeds.map(function (s) {
      var badge = s.seed <= 6 ? '<span class="seed-badge champ">🏆 ' + s.seed + '</span>' : '<span class="seed-badge hawk">🦅 ' + s.seed + '</span>';
      var path = s.path === "DIV" ? '<span class="leader-pill">DIV</span>'
                : s.path === "WC"  ? '<span class="leader-pill" style="background:var(--teal);color:#08222d">WC</span>'
                : '';
      return '<tr><td>' + badge + '</td><td>' + escapeHtml(s.franchise_name || s.franchise_id) + ' ' + path + '</td><td>' + escapeHtml(s.owner_name || "") + '</td><td class="num">' + fmtPct(s.allplay_pct) + '</td><td class="num">' + fmtPct(s.h2h_pct) + '</td><td class="num">' + fmtCommas(s.pf, 1) + '</td></tr>';
    }).join("");
    return '<div style="overflow-x:auto;margin-top:14px"><table><thead><tr><th>Seed</th><th>Team</th><th>Owner</th><th class="num">AP %</th><th class="num">PCT</th><th class="num">PF</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // ────────────────────────────────────────────────────────────────────────
  // View — Hall of Champions
  // Per closed UPS season: champion card with regular-season AP, playoff
  // AP, total AP, playoff seed, division-winner flag, total points,
  // historical AP rank across champions, and the championship game
  // (opponent, score, MFL box-score link).
  // ────────────────────────────────────────────────────────────────────────
  // ────────────────────────────────────────────────────────────────────────
  // Hall of Champions — picker + summary table + per-champion big-card view.
  // Mirrors the Eras restructure (default "Summary" → wide sortable
  // table of every champion; pick a specific season for the detailed
  // page). Per-champion narratives keyed by season year in
  // CHAMPION_STORIES; empty entries fall back to data-only rendering.
  // ────────────────────────────────────────────────────────────────────────

  // Hand-curated season blurbs per champion. Add as we draft them. Each
  // value is multi-paragraph (separator = blank line); the renderer
  // splits on \n\n and wraps each chunk in <p>. Same convention as
  // ERA_STORIES.
  var CHAMPION_STORIES = {
    // Example shape:
    // 2024: {
    //   blurb:
    // "Quarter 1 (W1-4): ...\n\n" +
    // "Quarter 2 (W5-8): ...\n\n" +
    // "Quarter 3 (W9-12): ...\n\n" +
    // "Quarter 4 (W13-14): ...\n\n" +
    // "Playoffs: ..."
    // }
  };

  function hocRec3(w, l, t) { return (w || 0) + "-" + (l || 0) + (t ? "-" + t : ""); }
  function hocRecPct(w, l, t) {
    var g = (w || 0) + (l || 0) + (t || 0);
    return g > 0 ? ((w + 0.5 * t) / g) : null;
  }
  // Render an HoC blurb (multi-paragraph) the same way era blurbs render.
  function renderChampBlurbHtml(blurb) {
    var s = String(blurb == null ? "" : blurb).trim();
    if (!s) return "";
    var paras = s.split(/\n\s*\n/);
    return '<div class="era-blurb">'
      + paras.map(function (p) {
          return '<p>' + escapeHtml(p.trim()) + '</p>';
        }).join("")
      + '</div>';
  }
  // Rank champions on a numeric field — descending (#1 = highest value).
  // Returns a map keyed by season → 1-based rank. Ties get the same rank.
  function rankChampsDesc(champs, getter) {
    var arr = champs.map(function (c) {
      return { season: c.season, val: Number(getter(c)) };
    }).filter(function (r) { return isFinite(r.val); });
    arr.sort(function (a, b) { return b.val - a.val; });
    var map = {};
    var lastVal = null, lastRank = 0;
    arr.forEach(function (r, i) {
      var rank = (lastVal != null && r.val === lastVal) ? lastRank : (i + 1);
      map[r.season] = rank;
      lastVal = r.val;
      lastRank = rank;
    });
    return map;
  }

  function renderChampPickerHtml(champs) {
    var opts = ['<option value="all"' + (state.champSelected === "all" ? " selected" : "") + '>All Champions — Summary</option>'];
    // Newest first in the picker so this year's champ is at top.
    var sorted = champs.slice().sort(function (a, b) { return Number(b.season) - Number(a.season); });
    sorted.forEach(function (c) {
      var val = String(c.season);
      var who = c.owner_name ? (" · " + c.owner_name) : "";
      var label = c.season + " — " + (c.franchise_name || c.franchise_id || "Champion") + who;
      opts.push('<option value="' + escapeHtml(val) + '"' + (state.champSelected === val ? " selected" : "") + '>' + escapeHtml(label) + '</option>');
    });
    return '<div class="era-picker-row"><label class="era-picker">View <select id="champSel">' + opts.join("") + '</select></label></div>';
  }

  function wireChampPicker(host) {
    var sel = host.querySelector("#champSel");
    if (sel) {
      sel.addEventListener("change", function () {
        state.champSelected = sel.value || "all";
        pushQs();
        render();
      });
    }
    host.querySelectorAll("th.hoc-summary-th").forEach(function (h) {
      h.addEventListener("click", function () {
        var key = h.getAttribute("data-hoc-sort");
        if (!key) return;
        if (state.champSummary.sortKey === key) {
          state.champSummary.sortDir = state.champSummary.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.champSummary.sortKey = key;
          state.champSummary.sortDir = (key === "season" || key === "owner_name" || key === "franchise_name") ? "asc" : "desc";
        }
        render();
      });
    });
  }

  function renderHocSummaryHtml(champs, ranks) {
    function th(key, label, isNum) {
      var active = state.champSummary.sortKey === key;
      var arrow = active ? (state.champSummary.sortDir === "asc" ? " ▲" : " ▼") : "";
      var cls = (isNum ? "num " : "") + "hoc-summary-th" + (active ? " active" : "");
      return '<th class="' + cls + '" data-hoc-sort="' + key + '">' + escapeHtml(label) + arrow + '</th>';
    }
    var rows = champs.slice().sort(function (a, b) {
      var sa = state.champSummary.sortKey;
      var dir = state.champSummary.sortDir === "asc" ? 1 : -1;
      var av = a[sa], bv = b[sa];
      if (sa === "owner_name" || sa === "franchise_name") {
        return String(av || "").localeCompare(String(bv || "")) * dir;
      }
      if (sa === "season") {
        return (Number(a.season) - Number(b.season)) * dir;
      }
      if (sa === "ap_rank") {
        return ((ranks.ap[a.season] || 99) - (ranks.ap[b.season] || 99)) * dir;
      }
      if (sa === "pf_rank") {
        return ((ranks.pf[a.season] || 99) - (ranks.pf[b.season] || 99)) * dir;
      }
      if (sa === "pf_index") {
        return ((Number(a.pf_index) || 0) - (Number(b.pf_index) || 0)) * dir;
      }
      if (sa === "idx_rank") {
        return ((ranks.idx[a.season] || 99) - (ranks.idx[b.season] || 99)) * dir;
      }
      av = Number(av || 0); bv = Number(bv || 0);
      return (av - bv) * dir;
    });
    var head = '<tr>'
      + th("season",         "Season",     false)
      + th("franchise_name", "Franchise",  false)
      + th("owner_name",     "Owner",      false)
      + '<th class="num">Seed</th>'
      + '<th class="num">Div Win</th>'
      + th("total_ap_pct",   "Total AP %", true)
      + th("ap_rank",        "AP Rank",    true)
      + th("pf",             "PF",         true)
      + th("pf_index",       "IDX",        true)
      + th("idx_rank",       "IDX Rank",   true)
      + '<th>Final Score</th>'
      + '</tr>';
    var body = rows.map(function (c) {

        + '<td>' + escapeHtml(c.season) + '</td>'
        + '<td>' + escapeHtml(c.franchise_name || c.franchise_id || "—") + '</td>'
        + '<td>' + escapeHtml(c.owner_name || "—") + '</td>'
        + '<td class="num">' + seed + '</td>'

        + '<td class="num">' + fmtPct(totalPct) + '</td>'

    }).join("");
    return '<section class="era-detail-card">'
      + '<div class="era-name">Hall of Champions — Summary</div>'
      + '<div class="era-blurb">Every UPS champion since 2011, with key stats + all-time ranks within the championship cohort. Click any column header to sort. Pick a specific season from the dropdown above for that champion\'s detailed page.</div>'
      + '<div class="era-card-scroll"><table class="compact era-summary-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
      + '</section>';

      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Reg Season AP</div><div class="hoc-stat-big-v">' + hocRec3(c.regseason_ap_w, c.regseason_ap_l, c.regseason_ap_t) + ' <span class="hoc-stat-big-sub">' + fmtPct(regPct) + '</span></div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Playoff AP</div><div class="hoc-stat-big-v">' + hocRec3(c.playoff_ap_w, c.playoff_ap_l, c.playoff_ap_t) + ' <span class="hoc-stat-big-sub">' + fmtPct(playPct) + '</span></div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Points For</div><div class="hoc-stat-big-v">' + fmtCommas(c.pf, 1) + '</div><div class="hoc-stat-big-rank">' + pfRank + '</div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Playoff Seed</div><div class="hoc-stat-big-v">' + (c.seed_rank_overall != null ? "#" + c.seed_rank_overall : "—") + '</div></div>'
      +   '<div class="hoc-stat-big"><div class="hoc-stat-big-k">Division Winner</div><div class="hoc-stat-big-v">' + (c.division_winner === true ? '<span style="color:var(--gold)">YES</span>' : (c.division_winner === false ? "No" : "—")) + '</div></div>'

  // ────────────────────────────────────────────────────────────────────────
  // View — Draft Order Finish
  //
  // Derives next-year rookie pick (1.01 → 1.12) from the playoff schedule
  // per league_context_v1.md §1. Schedule-driven so it adapts to the
  // year's bracket shape (modern flat, conference-era split, etc.).
  //
  // Pick mapping per league_context §1:
  //   1.01 = Toilet Bowl champion (won the Toilet)
  //   1.02 = Toilet Bowl runner-up (lost Toilet final)
  //   1.03 = Toilet semifinal winner
  //   1.04 = Toilet semifinal loser
  //   1.05 + 1.06 = Week (final-1) game between two Week-R1 Toilet losers
  //   1.07 + 1.08 = Week (final-1) game between two Week-R1 Champ losers
  //   1.09 = Championship semifinal loser
  //   1.10 = Championship semifinal winner (consolation winner)
  //   1.11 = Championship runner-up
  //   1.12 = UPS champion
  // ────────────────────────────────────────────────────────────────────────
  function renderDraftOrder(host) {
    fetchD1("/api/playoff-bracket", state.year).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load bracket for " + state.year + ".");
      var seeds = resp.seeds || [];
      var matchups = resp.matchups || [];
      var seedMap = buildSeedMap(seeds);
      var playoffWeeks = resp.playoff_weeks && resp.playoff_weeks.length === 3 ? resp.playoff_weeks : [15, 16, 17];
      var WK_R1 = playoffWeeks[0], WK_SEMI = playoffWeeks[1], WK_FINAL = playoffWeeks[2];
      if (!matchups.length) {
        host.innerHTML = '<div class="banner">Draft order is set once the playoff bracket completes (final game in Week ' + WK_FINAL + ').</div>' + DEFERRED_NOTE;
        return;
      }
      // Dedupe + scope to each side.
      var champIds = new Set(seeds.slice(0, 6).map(function (s) { return pad4(s.franchise_id); }));
      var hawkIds  = new Set(seeds.slice(6, 12).map(function (s) { return pad4(s.franchise_id); }));
      var seen = {}, games = [];
      matchups.forEach(function (m) {
        var k = m.week + "|" + [pad4(m.franchise_id), pad4(m.opponent_franchise_id)].sort().join("-");
        if (seen[k]) return;
        seen[k] = true;
        games.push(m);
      });
      function side(g, ids) {
        return ids.has(pad4(g.franchise_id)) && ids.has(pad4(g.opponent_franchise_id));
      }
      function winner(g) { return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.franchise_id) : pad4(g.opponent_franchise_id); }
      function loser(g)  { return Number(g.team_score || 0) > Number(g.opponent_score || 0) ? pad4(g.opponent_franchise_id) : pad4(g.franchise_id); }

      function pickResults(ids) {
        var r1   = games.filter(function (g) { return Number(g.week) === WK_R1 && side(g, ids); });
        var semi = games.filter(function (g) { return Number(g.week) === WK_SEMI && side(g, ids); });
        var fin  = games.filter(function (g) { return Number(g.week) === WK_FINAL && side(g, ids); });
        var r1Win = new Set(), r1Lose = new Set();
        r1.forEach(function (g) { r1Win.add(winner(g)); r1Lose.add(loser(g)); });
        // Classify W-semi games: placement (both R1 losers) vs semi (everyone else).
        var placement = null, semis = [];
        semi.forEach(function (g) {
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (r1Lose.has(a) && r1Lose.has(b)) placement = g;
          else semis.push(g);
        });
        var semiWin = new Set(), semiLose = new Set();
        semis.forEach(function (g) { semiWin.add(winner(g)); semiLose.add(loser(g)); });
        // Final week: title vs 3rd-place.
        var title = null, third = null, other = [];
        fin.forEach(function (g) {
          var a = pad4(g.franchise_id), b = pad4(g.opponent_franchise_id);
          if (semiWin.has(a) && semiWin.has(b)) title = g;
          else if (semiLose.has(a) && semiLose.has(b)) third = g;
          else other.push(g);
        });
        return { r1: r1, semi: semis, placement: placement, fin: fin, title: title, third: third, other: other,
                 r1Win: r1Win, r1Lose: r1Lose, semiWin: semiWin, semiLose: semiLose };
      }
      var champ = pickResults(champIds);
      var hawk  = pickResults(hawkIds);

      // Build pick → franchise_id map.
      var picks = {}; // key like "1.12" -> { fid, label, why }
      // 1.12 = UPS champion
      if (champ.title) picks["1.12"] = { fid: winner(champ.title), why: "Won UPS Championship" };
      // 1.11 = UPS runner-up
      if (champ.title) picks["1.11"] = { fid: loser(champ.title), why: "Lost UPS Championship" };
      // 1.10 = Champ semifinal winner whose semi-WIN didn't reach final?  Actually:
      //        "championship semifinal winner (consolation winner — gets later pick because they advanced + got money)"
      //        That implies the W16 game between R1 LOSERS (placement). Winner = 1.10.
      if (champ.placement) picks["1.10"] = { fid: winner(champ.placement), why: "Won championship-side W" + WK_SEMI + " placement (1.07/1.08 → 1.10)" };
      // 1.09 = championship semifinal loser
      // Per doc: "1.09 = championship semifinal loser" → loser of the 3rd-place W17 game (semi losers).
      if (champ.third) picks["1.09"] = { fid: loser(champ.third), why: "Lost championship 3rd-place game" };
      //         The semi-loser who WINS the 3rd-place game maps to 1.10? Re-check.
      //         Re-reading: 1.10 = "semifinal winner (consolation winner)" — winner of the consolation W17 game.
      //         1.09 = "semifinal loser" — loser of consolation. Both come from the third-place W17 game.
      if (champ.third) picks["1.10"] = { fid: winner(champ.third), why: "Won championship 3rd-place (consolation) game" };
      // 1.07 + 1.08 = decided by W (final-1) game between two W-R1 champ losers
      //   1.07 = winner of that game
      //   1.08 = loser of that game
      if (champ.placement) {
        picks["1.08"] = { fid: loser(champ.placement), why: "Lost championship W" + WK_SEMI + " placement (1.07/1.08)" };
        picks["1.07"] = { fid: winner(champ.placement), why: "Won championship W" + WK_SEMI + " placement (1.07/1.08)" };
        // 1.07/1.08 vs 1.10 — doc says 1.05/1.06 from TOILET-side W(N-1), 1.07/1.08 from CHAMP-side W(N-1).
        // So 1.07 = champ W16 placement winner, 1.08 = champ W16 placement loser. That conflicts with 1.10.
        // Re-resolve: 1.10 comes from CHAMPIONSHIP 3RD-PLACE (W17). 1.07/1.08 from CHAMPIONSHIP placement (W16).
      }
      // Hawktuah side:
      // 1.01 = Toilet Bowl champion (won Toilet final)
      if (hawk.title) picks["1.01"] = { fid: winner(hawk.title), why: "Won Hawktuah Bowl (Toilet champ)" };
      // 1.02 = Toilet Bowl runner-up
      if (hawk.title) picks["1.02"] = { fid: loser(hawk.title), why: "Lost Hawktuah Bowl final" };
      // 1.03 = Toilet semifinal winner (winner of W17 toilet 3rd-place is the consolation winner)
      if (hawk.third) picks["1.03"] = { fid: winner(hawk.third), why: "Won Toilet 3rd-place (consolation)" };
      // 1.04 = Toilet semifinal loser (loser of W17 toilet 3rd-place)
      if (hawk.third) picks["1.04"] = { fid: loser(hawk.third), why: "Lost Toilet 3rd-place" };
      // 1.05 + 1.06 = W16 placement on hawk side
      if (hawk.placement) {
        picks["1.05"] = { fid: winner(hawk.placement), why: "Won Toilet W" + WK_SEMI + " placement (1.05/1.06)" };
        picks["1.06"] = { fid: loser(hawk.placement), why: "Lost Toilet W" + WK_SEMI + " placement (1.05/1.06)" };
      }

      // Render the table.
      var pickOrder = ["1.01","1.02","1.03","1.04","1.05","1.06","1.07","1.08","1.09","1.10","1.11","1.12"];
      var rowsHtml = pickOrder.map(function (p) {
        var rec = picks[p];
        var fid = rec && rec.fid;
        var seedInfo = fid ? seedMap[pad4(fid)] : null;
        var seedBadge = seedInfo
          ? '<span class="seed-badge ' + seedInfo.side + '">' + (seedInfo.side === "champ" ? "🏆" : "🦅") + ' ' + seedInfo.seed + '</span>'
          : '<span class="seed-badge none">—</span>';
        var info = fid ? (resp.seeds.find(function (s) { return pad4(s.franchise_id) === pad4(fid); }) || {}) : {};
        var pickStyle = p === "1.01" ? 'background:rgba(110,60,30,0.15)' : (p === "1.12" ? 'background:rgba(231,190,89,0.12)' : "");
        return '<tr style="' + pickStyle + '">'
          + '<td class="num" style="font-weight:800;color:var(--gold);font-size:13px">' + p + '</td>'
          + '<td>' + seedBadge + '</td>'
          + '<td>' + (info.franchise_name ? escapeHtml(info.franchise_name) : "<span style='color:var(--dim)'>pending</span>") + '</td>'
          + '<td>' + escapeHtml(info.owner_name || "") + '</td>'
          + '<td style="font-size:11px;color:var(--muted);font-style:italic">' + escapeHtml((rec && rec.why) || "—") + '</td>'
          + '</tr>';
      }).join("");

      host.innerHTML = ''
        + '<div class="methodology">'
        + '<strong>Draft Order Finish</strong> maps each playoff outcome to the next-year rookie draft pick per <code>league_context_v1.md §1</code>. '
        + 'Toilet Bowl winner picks first (1.01), UPS Champion picks last (1.12). '
        + 'Picks 1.05/1.06 + 1.07/1.08 are decided by Week ' + WK_SEMI + ' placement games between Week ' + WK_R1 + ' losers. '
        + '1.09/1.10 are decided by the Week ' + WK_FINAL + ' championship 3rd-place game.'
        + '</div>'
        + '<div style="overflow-x:auto"><table><thead><tr>'
        + '<th class="num">Pick</th><th>Seed</th><th>Team</th><th>Owner</th><th>Why</th>'
        + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
        + '<div class="note">'
        + (state.year === (new Date().getUTCFullYear()) ? "If picks show 'pending', the bracket hasn't fully completed yet."
          : "Final draft order for " + state.year + " (used in the " + (state.year + 1) + " rookie draft).")
        + '</div>'
        + DEFERRED_NOTE;
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 4 — Historical Finishes
  // ────────────────────────────────────────────────────────────────────────
  function renderHistorical(host) {
    fetchD1("/api/historical-finishes", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load historical finishes.");
      var rows = resp.rows || [];
      if (!rows.length && resp.note) {
        host.innerHTML = '<div class="banner">' + escapeHtml(resp.note) + '</div>' + DEFERRED_NOTE;
        return;
      }
      var seasons = {}, byFid = {};
      rows.forEach(function (r) {
        seasons[r.season] = true;
        var fid = pad4(r.franchise_id);
        if (!byFid[fid]) byFid[fid] = { fid: fid, ownerSeen: {}, teamSeen: {}, byYear: {} };
        byFid[fid].byYear[r.season] = r;
        if (r.owner_name)    byFid[fid].ownerSeen[r.owner_name] = (byFid[fid].ownerSeen[r.owner_name] || 0) + 1;
        if (r.franchise_name) byFid[fid].teamSeen[r.franchise_name] = (byFid[fid].teamSeen[r.franchise_name] || 0) + 1;
      });
      function modal(map) {
        var best = "", bestN = 0;
        Object.keys(map).forEach(function (k) { if (map[k] > bestN) { bestN = map[k]; best = k; } });
        return best;
      }
      var seasonsSorted = Object.keys(seasons).map(Number).sort(function (a, b) { return b - a; });
      var franchiseList = Object.keys(byFid).map(function (fid) {
        return { fid: fid, owner: modal(byFid[fid].ownerSeen), team: modal(byFid[fid].teamSeen), byYear: byFid[fid].byYear };
      }).sort(function (a, b) { return a.owner.localeCompare(b.owner); });

      var head = '<tr><th class="hist-team">Owner · Team</th>' + seasonsSorted.map(function (y) { return '<th>' + y + '</th>'; }).join("") + '</tr>';
      var bodyHtml = franchiseList.map(function (f) {
        var cells = seasonsSorted.map(function (y) {
          var r = f.byYear[y];
          if (!r) return '<td class="hist-cell empty">—</td>';
          var finish = r.final_finish;
          var cls = "hist-cell";
          if (finish === 1)       cls += " champ";
          else if (finish === 2)  cls += " silver";
          else if (finish === 3)  cls += " bronze";
          else if (finish === 12) cls += " hawktuah";
          var title = "Final " + finish + (r.regular_season_finish ? " · Reg " + r.regular_season_finish : "") + (r.division ? " · " + r.division : "");
          return '<td class="' + cls + '" title="' + escapeHtml(title) + '">' + (finish == null ? "—" : finish) + '</td>';
        }).join("");
        return '<tr><td class="hist-team"><span class="owner">' + escapeHtml(f.owner) + '</span><span class="team">' + escapeHtml(f.team) + '</span></td>' + cells + '</tr>';
      }).join("");

      host.innerHTML = '<div style="overflow-x:auto"><table class="hist-table compact"><thead>' + head + '</thead><tbody>' + bodyHtml + '</tbody></table></div>'
        + '<div class="note">🥇 1 = UPS Champion · 🥈 2 = runner-up · 🥉 3 = bronze · 🚽 12 = Hawktuah / Toilet champion</div>'
        + DEFERRED_NOTE;
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 5 — 3-Year Eras
  // ────────────────────────────────────────────────────────────────────────
  // Era stories — hand-curated narrative per era cycle, keyed by
  // era_start year. Each entry: { name, blurb }. Replaces the
  // algorithmic "The X & Y Era" headline. Keith 2026-05-15: the
  // headlines should feel evolutionary (league development arc), not
  // a rolling owner-name top-N. Drafts below; tweak as needed.
  // Narratives drafted by the league-context-aware research agent
  // (Sonnet, 2026-05-15). Blurbs are multi-paragraph — separator is a
  // blank line; renderEraBlurbHtml splits into <p> tags. Iterate by
  // editing the blurb strings directly; the wrapping logic does the
  // rest. Unverifiable claims tagged "[per Keith's recollection]".
  var ERA_STORIES = {
    2011: {
      name: "Birth of Something Beautiful",
      blurb:
"The inaugural season did not go smoothly, and that is precisely why it is beloved. Kevin Bousquet, Ryan's brother, got booted mid-auction before the first year even started. The league handed his half-built roster to Kris Lake, a name nobody had ever heard, and Lake promptly won Year 2 (2012) with it — finishing with the best all-play record in the league [per Keith's recollection]. Nothing like handing someone else's partially assembled car to a stranger and watching them take it to the championship.\n\n" +

    2017: {

  // Picker + summary-table helpers for the Eras view.
  // - "all" (default) → one wide summary table, every owner × every era,
  //                     sortable by any column. No story blurbs here —
  //                     designed as a scan-the-history overview.
  // - <era_start year> → original per-era card, just filtered to that
  //                      single era (story + blurb visible, table full-
  //                      width so it doesn't need horizontal scroll).
  //
  // PF Index methodology (Keith 2026-05-15):
  // Normalize by seasons played first, then average. A 1-season
  // owner's PF must NOT be compared head-to-head against a 3-season
  // owner's PF — that punishes mid-era joiners. Compute per-season
  // PF rate for each row, then the era mean of those rates. Index
  // value is owner_rate ÷ era_mean_rate. 1.22 = +22% above era pace.
  function eraPfPerSeasonMean(rows) {
    var rateSum = 0, rateCount = 0;
    (rows || []).forEach(function (r) {
      var pf = Number(r.pf || 0);
      var seasons = Number(r.seasons_played || 0);
      if (pf > 0 && seasons > 0) {
        rateSum += pf / seasons;
        rateCount += 1;
      }
    });
    return rateCount > 0 ? rateSum / rateCount : 0;
  }
  function eraPfIndex(r, pfPerSeasonMean) {
    var pf = Number(r.pf || 0);
    var seasons = Number(r.seasons_played || 0);
    if (pf <= 0 || seasons <= 0 || pfPerSeasonMean <= 0) return 0;
    var rate = pf / seasons;
    return rate / pfPerSeasonMean;
  }
  // Legacy name retained so call sites that didn't get updated still
  // resolve — but it now returns the per-season mean.
  function eraPfMean(rows) { return eraPfPerSeasonMean(rows); }
  function renderEraPickerHtml(eras) {
    var opts = ['<option value="all"' + (state.eraSelected === "all" ? " selected" : "") + '>All Eras — Summary</option>'];
    eras.forEach(function (era) {
      var val = String(era.era_start);
      var num = eraNumberFromStart(era.era_start);
      var label = "Era " + num + " (" + era.era_start + "–" + era.era_end + ")";
      var story = ERA_STORIES[Number(era.era_start)];
      if (story && story.name) label += " — " + story.name;
      opts.push('<option value="' + escapeHtml(val) + '"' + (state.eraSelected === val ? " selected" : "") + '>' + escapeHtml(label) + '</option>');
    });
    return '<div class="era-picker-row"><label class="era-picker">View <select id="eraSel">' + opts.join("") + '</select></label></div>';
  }
  // Era number from start year: 2011 → 1, 2014 → 2, 2017 → 3, etc.
  // First UPS season is 2011 per league_context.
  function eraNumberFromStart(eraStart) {
    var n = Math.floor((Number(eraStart) - 2011) / 3) + 1;
    return n > 0 ? n : 1;
  }
  // Era blurbs may be multi-paragraph (separated by \n\n). Render
  // each chunk as its own <p>; escapeHtml each one so untrusted
  // characters don't break out. Empty blurb → empty string.
  function renderEraBlurbHtml(blurb) {
    var s = String(blurb == null ? "" : blurb).trim();
    if (!s) return "";
    var paras = s.split(/\n\s*\n/);
    return '<div class="era-blurb">'
      + paras.map(function (p) {
          return '<p>' + escapeHtml(p.trim()) + '</p>';
        }).join("")
      + '</div>';
  }
  function renderErasSummaryHtml(eras) {
    var summaryRows = [];
    eras.forEach(function (era) {
      var pfPerSeasonMean = eraPfPerSeasonMean(era.rows);
      var eraNum = eraNumberFromStart(era.era_start);
      (era.rows || []).forEach(function (r) {
        var pfVal = Number(r.pf || 0);
        summaryRows.push({
          era_label: "Era " + eraNum + " (" + era.era_start + "–" + era.era_end + ")",
          era_start: era.era_start,
          era_num: eraNum,
          owner_name: r.owner_name,
          seasons_played: r.seasons_played,
          ap_pct: r.ap_pct,
          ap_w: r.ap_w,
          h2h_w: r.h2h_w, h2h_l: r.h2h_l, h2h_t: r.h2h_t,
          pf: pfVal,
          // Pre-computed Idx (per-season normalized) so the sort
          // comparator can use it directly and partial-tenure owners
          // aren't penalized for fewer seasons.
          idx: eraPfIndex(r, pfPerSeasonMean),
          championships: r.championships,
          hawktuah_wins: r.hawktuah_wins,
          avg_finish: r.avg_finish
        });
      });
    });
    var sa = state.eraSummary.sortKey;
    var dir = state.eraSummary.sortDir === "asc" ? 1 : -1;
    summaryRows.sort(function (a, b) {
      var av = a[sa], bv = b[sa];
      if (sa === "owner_name" || sa === "era_label") {
        return String(av || "").localeCompare(String(bv || "")) * dir;
      }
      av = Number(av || 0); bv = Number(bv || 0);
      if (av === bv) {
        if (a.era_start !== b.era_start) return a.era_start - b.era_start;
        return (b.ap_pct || 0) - (a.ap_pct || 0);
      }
      return (av - bv) * dir;
    });
    function th(key, label, isNum) {
      var active = state.eraSummary.sortKey === key;
      var arrow = active ? (state.eraSummary.sortDir === "asc" ? " ▲" : " ▼") : "";
      var cls = (isNum ? "num " : "") + "era-summary-th" + (active ? " active" : "");
      return '<th class="' + cls + '" data-era-sort="' + key + '">' + escapeHtml(label) + arrow + '</th>';
    }
    var head = '<tr>'
      + th("era_label",      "Era",     false)
      + th("owner_name",     "Owner",   false)
      + th("seasons_played", "Yrs",     true)
      + th("ap_pct",         "AP %",    true)
      + th("ap_w",           "AP W",    true)
      + '<th>H2H</th>'
      + th("idx",            "Idx",     true)
      + th("championships",  "🏆",       true)
      + th("hawktuah_wins",  "🚽",       true)
      + th("avg_finish",     "Avg Fin", true)
      + '</tr>';
    var body = summaryRows.map(function (r) {
      var partial = (r.seasons_played || 0) < 3;
      var idxStr = r.idx > 0 ? r.idx.toFixed(2) : "—";
      return '<tr' + (partial ? ' class="partial"' : '') + '>'
        + '<td>' + escapeHtml(r.era_label) + '</td>'
        + '<td>' + escapeHtml(r.owner_name || "—") + (partial ? ' <span class="partial-badge" title="Did not play all 3 seasons of the cycle">partial</span>' : '') + '</td>'
        + '<td class="num">' + (r.seasons_played || 0) + '</td>'
        + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
        + '<td class="num">' + (r.ap_w || 0) + '</td>'
        + '<td>' + rec(r.h2h_w, r.h2h_l, r.h2h_t) + '</td>'
        + '<td class="num">' + idxStr + '</td>'
        + '<td class="num">' + (r.championships || 0) + '</td>'
        + '<td class="num">' + (r.hawktuah_wins || 0) + '</td>'
        + '<td class="num">' + (r.avg_finish ? Number(r.avg_finish).toFixed(1) : "—") + '</td>'
        + '</tr>';
    }).join("");
    return '<section class="era-detail-card">'
      + '<div class="era-name">All Eras — Owner × Era Summary</div>'
      + '<div class="era-blurb">Every owner across every 3-year cycle. Click a column header to sort. Pick a specific era from the dropdown above for that era\'s story + a focused leaderboard.</div>'
      + '<div class="era-card-scroll"><table class="compact era-summary-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
      + '</section>';
  }
  function wireEraPicker(host) {
    var sel = host.querySelector("#eraSel");
    if (sel) {
      sel.addEventListener("change", function () {
        state.eraSelected = sel.value || "all";
        pushQs();
        render();
      });
    }
    host.querySelectorAll("th.era-summary-th").forEach(function (h) {
      h.addEventListener("click", function () {
        var key = h.getAttribute("data-era-sort");
        if (!key) return;
        if (state.eraSummary.sortKey === key) {
          state.eraSummary.sortDir = state.eraSummary.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.eraSummary.sortKey = key;
          state.eraSummary.sortDir = (key === "era_label" || key === "owner_name") ? "asc" : "desc";
        }
        render();
      });
    });
  }

  function renderEras(host) {
    fetchD1("/api/eras", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load eras.");
      var erasAll = (resp.eras || []).filter(function (e) { return e.era_start >= ERA_FIRST; });
      var hasFS = resp.has_final_standings;
      var currentYear = (new Date().getUTCFullYear());
      var fsBanner = hasFS ? "" : '<div class="banner">⚠ <code>src_final_standings</code> not loaded — championship + hawktuah counts show 0 until migration 0033 runs.</div>';
      var prefix = fsBanner + DRAFT_CONTENT_BANNER;

      // Picker first; then either the cross-era summary, or the
      // existing per-era card filtered to a single era.
      var pickerHtml = renderEraPickerHtml(erasAll);

      if (state.eraSelected === "all") {
        host.innerHTML = prefix + pickerHtml + renderErasSummaryHtml(erasAll);
        wireEraPicker(host);
        return;
      }

      var eras = erasAll.filter(function (e) { return String(e.era_start) === String(state.eraSelected); });
      if (!eras.length) {
        host.innerHTML = prefix + pickerHtml + '<div class="banner">Era not found — pick another from the dropdown.</div>';
        wireEraPicker(host);
        return;
      }
      var html = prefix + pickerHtml + '<div class="era-grid era-grid--single">';
      eras.forEach(function (era) {
        var rows = (era.rows || []).slice();
        var eligible = rows.filter(function (r) { return (r.seasons_played || 0) >= 3; });
        var byPct = eligible.slice().sort(function (a, b) {
          if ((b.ap_pct || 0) !== (a.ap_pct || 0)) return (b.ap_pct || 0) - (a.ap_pct || 0);
          if ((b.ap_w || 0)   !== (a.ap_w || 0))   return (b.ap_w || 0) - (a.ap_w || 0);
          return (b.pf || 0) - (a.pf || 0);
        });
        // Dynamic headliner count by AP% gap:
        //   - Clear leader (gap to #2 >= 5.0 ppts):   1-team era
        //   - Tight 2-way (gap to #3 >= 5.0 ppts):    2-team era
        //   - Genuinely tight pack (all top 3 within  3.0 ppts of each other): 3-team era
        //   - Default: 2-team era (matches our v1 framing)
        var HL_GAP_SOLO  = 0.05; // 5.0 pp separates #1 from the pack
        var HL_GAP_DUO   = 0.05; // 5.0 pp separates #2 from #3
        var HL_PACK_TIGHT = 0.03; // top 3 within 3.0 pp of each other
        var p1 = byPct[0] && byPct[0].ap_pct, p2 = byPct[1] && byPct[1].ap_pct, p3 = byPct[2] && byPct[2].ap_pct;
        var headlinerCount = 2;
        if (p1 != null && p2 != null && (p1 - p2) >= HL_GAP_SOLO) {
          headlinerCount = 1;
        } else if (p1 != null && p2 != null && p3 != null && (p1 - p3) <= HL_PACK_TIGHT) {
          headlinerCount = 3;
        } else if (p2 != null && p3 != null && (p2 - p3) < HL_GAP_DUO) {
          // 2-team isn't clearly better than 3 — bump to 3
          headlinerCount = 3;
        }
        var inProgress = (era.era_end >= currentYear);
        var eraTitle = inProgress ? era.era_start + "–" + era.era_end + " (in progress)" : era.era_start + "–" + era.era_end;

        // Hand-curated era story (name + blurb). Falls back to a generic
        // "Era N" label + empty blurb if not in the map.
        var story = ERA_STORIES[Number(era.era_start)] || {
          name: "Era",
          blurb: ""
        };

        // PF Index: each owner's PF / era-mean-PF (mean across all
        // owners in the era). 1.22 = +22% above era avg, 0.92 = -8%.
        // Saves horizontal space vs raw PF numbers. Falls back to "—"
        // when era PF totals aren't loaded.
        var pfSum = 0;
        var pfCount = 0;
        rows.forEach(function (r) {
          var pf = Number(r.pf || 0);
          if (pf > 0) { pfSum += pf; pfCount += 1; }
        });
        var pfMean = pfCount > 0 ? pfSum / pfCount : 0;

        var byPctAll = rows.slice().sort(function (a, b) {
          var ea = (a.seasons_played || 0) >= 3 ? 1 : 0;
          var eb = (b.seasons_played || 0) >= 3 ? 1 : 0;
          if (ea !== eb) return eb - ea;
          if ((b.ap_pct || 0) !== (a.ap_pct || 0)) return (b.ap_pct || 0) - (a.ap_pct || 0);
          return (b.ap_w || 0) - (a.ap_w || 0);
        });
        var lbHead = '<tr><th>Owner</th><th class="num">Yrs</th><th class="num">AP %</th><th class="num">AP W</th><th>H2H</th><th class="num" title="Points-For Index — owner PF-per-season ÷ era mean PF-per-season. 1.22 = +22% above era pace. Normalized by seasons played so partial-tenure owners aren\'t penalized.">Idx</th><th class="num">🏆</th><th class="num">🚽</th><th class="num">Avg Fin</th></tr>';
        var pfPerSeasonMean = eraPfPerSeasonMean(rows);
        var lbBody = byPctAll.map(function (r) {
          var partial = (r.seasons_played || 0) < 3;
          var idxNum = eraPfIndex(r, pfPerSeasonMean);
          var idxStr = idxNum > 0 ? idxNum.toFixed(2) : "—";
          return '<tr' + (partial ? ' class="partial"' : '') + '>'
            + '<td>' + escapeHtml(r.owner_name || "—") + (partial ? ' <span class="partial-badge" title="Did not play all 3 seasons of the cycle">partial</span>' : '') + '</td>'
            + '<td class="num">' + (r.seasons_played || 0) + '</td>'
            + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
            + '<td class="num">' + (r.ap_w || 0) + '</td>'
            + '<td>' + rec(r.h2h_w, r.h2h_l, r.h2h_t) + '</td>'
            + '<td class="num">' + idxStr + '</td>'
            + '<td class="num">' + (r.championships || 0) + '</td>'
            + '<td class="num">' + (r.hawktuah_wins || 0) + '</td>'
            + '<td class="num">' + (r.avg_finish ? Number(r.avg_finish).toFixed(1) : "—") + '</td>'
            + '</tr>';
        }).join("");
        html += '<section class="era-card">'
          + '<div class="era-cycle">' + escapeHtml(eraTitle) + '</div>'
          + '<div class="era-name">' + escapeHtml(story.name) + (inProgress ? " <span class=\"era-inprogress\">(in progress)</span>" : "") + '</div>'
          + renderEraBlurbHtml(story.blurb)
          + '<div class="era-card-scroll"><table class="compact"><thead>' + lbHead + '</thead><tbody>' + lbBody + '</tbody></table></div>'
          + '</section>';
      });
      html += '</div>' + DEFERRED_NOTE;
      host.innerHTML = html;
      wireEraPicker(host);
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // View 6 — Division Power Rankings
  // ────────────────────────────────────────────────────────────────────────
  function renderDivPower(host) {
    fetchD1("/api/division-power-rankings", null).then(function (resp) {
      if (!resp || !resp.ok) return showError(host, "Couldn't load division power rankings.");
      var rows = (resp.rows || []).slice();
      var mode = state.dpMode;
      var view = rows.slice();
      if (mode === "best")       view = view.slice(0, 10);
      else if (mode === "worst") view = view.slice().sort(function (a, b) { return (a.ap_pct || 0) - (b.ap_pct || 0); }).slice(0, 10);
      else if (mode === "byCycle") {
        var grouped = {};
        rows.forEach(function (r) {
          var k = r.cycle_start + "|" + r.division;
          if (!grouped[k]) grouped[k] = {
            cycle_start: r.cycle_start, division: r.division,
            division_name: r.division_name || null,
            owners: r.owners,
            ap_w: 0, ap_l: 0, ap_t: 0, pf: 0, n: 0, produced_champion: 0
          };
          grouped[k].ap_w += (r.ap_w || 0);
          grouped[k].ap_l += (r.ap_l || 0);
          grouped[k].ap_t += (r.ap_t || 0);
          grouped[k].pf   += (r.pf || 0);
          grouped[k].n    += 1;
          grouped[k].produced_champion += (r.produced_champion || 0);
        });
        view = Object.keys(grouped).map(function (k) {
          var g = grouped[k];
          var games = g.ap_w + g.ap_l + g.ap_t;
          g.ap_pct = games > 0 ? (g.ap_w + 0.5 * g.ap_t) / games : null;
          return g;
        }).sort(function (a, b) { return (b.ap_pct || 0) - (a.ap_pct || 0); });
      }
      // Apply user sort
      view = sortRows(view, state.dpSort.key, state.dpSort.dir);

      var modeBtns = [
        { id: "allTime",  label: "All-time" },
        { id: "best",     label: "Best ever (top 10)" },
        { id: "worst",    label: "Worst ever (bottom 10)" },
        { id: "byCycle",  label: "By 3-year cycle" }
      ].map(function (m) {
        return '<button type="button" class="mode-btn" data-mode="' + m.id + '" data-active="' + (mode === m.id ? "1" : "0") + '">' + escapeHtml(m.label) + '</button>';
      }).join("");

      var sortHdrs = state.dpSort;
      var head = mode === "byCycle"
        ? '<tr><th class="num">#</th>'
          + sortableHeader("Cycle", "cycle_start", sortHdrs)
          + sortableHeader("Division", "division_name", sortHdrs)
          + '<th>Owners (cycle aggregate)</th>'
          + sortableHeader("AP W-L-T", "ap_w", sortHdrs)
          + sortableHeader("AP %", "ap_pct", sortHdrs, "num")
          + sortableHeader("PF", "pf", sortHdrs, "num")
          + sortableHeader("🏆 yrs", "produced_champion", sortHdrs, "num")
          + '</tr>'
        : '<tr><th class="num">#</th>'
          + sortableHeader("Season", "season", sortHdrs)
          + sortableHeader("Division", "division_name", sortHdrs)
          + '<th>Owners & AP %</th>'
          + sortableHeader("AP W-L-T", "ap_w", sortHdrs)
          + sortableHeader("AP %", "ap_pct", sortHdrs, "num")
          + sortableHeader("PF", "pf", sortHdrs, "num")
          + sortableHeader("🏆?", "produced_champion", sortHdrs)
          + '</tr>';

      // Render per-team breakdown for non-cycle modes (we have team_details
      // from the worker). For byCycle mode, fall back to the aggregated
      // owners string since teams may vary year over year within a cycle.
      function ownersCell(r) {
        if (mode === "byCycle") return escapeHtml(r.owners || "");
        var teams = r.team_details || [];
        if (!teams.length) return escapeHtml(r.owners || "");
        // Sort within division by overall PCT → div PCT → PF → AP%.
        var sorted = teams.slice().sort(function (a, b) {
          if (!!b.is_division_leader !== !!a.is_division_leader) return b.is_division_leader ? 1 : -1;
          return (b.computed_ap_pct || 0) - (a.computed_ap_pct || 0);
        });
        return sorted.map(function (t) {
          var pct = t.computed_ap_pct;
          var apStr = (pct != null) ? (Number(pct) * 100).toFixed(1) + "%" : "—";
          if (t.is_division_leader) {
            return '<span class="dp-owner dp-winner" title="Division Winner — AP ' + apStr + '"><span class="dp-name">' + escapeHtml(t.owner_name || "?") + '</span> <span class="dp-ap">' + apStr + '</span> 🏆</span>';
          }
          return '<span class="dp-owner"><span class="dp-name">' + escapeHtml(t.owner_name || "?") + '</span> <span class="dp-ap">' + apStr + '</span></span>';
        }).join(" · ");
      }

      var bodyHtml = view.map(function (r, i) {
        var divLabel = r.division_name || ("Division " + (r.division || "—"));
        return '<tr>'
          + '<td class="num">' + (i + 1) + '</td>'
          + '<td>' + (mode === "byCycle" ? (r.cycle_start + "–" + (r.cycle_start + 2)) : r.season) + '</td>'
          + '<td>' + escapeHtml(divLabel) + ' <span style="color:var(--dim);font-size:10px">' + escapeHtml(r.division || "") + '</span></td>'
          + '<td>' + ownersCell(r) + '</td>'
          + '<td>' + rec(r.ap_w, r.ap_l, r.ap_t) + '</td>'
          + '<td class="num">' + fmtPct(r.ap_pct) + '</td>'
          + '<td class="num">' + fmtCommas(r.pf, 1) + '</td>'
          + '<td' + (mode === "byCycle" ? ' class="num"' : '') + '>' + (r.produced_champion ? (mode === "byCycle" ? r.produced_champion : "Yes") : "—") + '</td>'
          + '</tr>';
      }).join("");

      host.innerHTML = '<div class="methodology">'
        + '⚠️ <strong>Methodology under review.</strong> Strength = aggregate All-Play % across the 3 teams in the division for that season. '
        + 'Tie-break AP wins → division PF. AP % is matchup-luck-neutral and normalizes across eras with different game counts. '
        + 'See <code>docs/standings_advanced_stats_proposals.md</code> §1B.'
        + '</div>'
        + '<div class="mode-row">' + modeBtns + '</div>'
        + '<div style="overflow-x:auto"><table><thead>' + head + '</thead><tbody>' + bodyHtml + '</tbody></table></div>'
        + '<div class="note">Click any column header to sort. Division names from MFL <code>TYPE=league</code>.</div>'
        + DEFERRED_NOTE;
      host.querySelectorAll("[data-mode]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.dpMode = b.getAttribute("data-mode");
          renderDivPower(host);
        });
      });
      wireSortClicks(host, state.dpSort, function () { renderDivPower(host); });
    }).catch(function (e) { showError(host, "Fetch failed: " + e.message); });
  }

  // ────────────────────────────────────────────────────────────────────────
  // Boot
  // ────────────────────────────────────────────────────────────────────────
  renderShell();
  render();
})();
</script>
</body>
</html>
