    // Subtitle now carries MFL contract details (salary / years / AAV)
    // + season fantasy totals (points / PPG) pulled from the leaderboard
    // row. Per-week rendering doesn't include these because they're
    // season-aggregates, not per-week values — surfacing them once in
    // the header avoids spamming identical values on every week row.
    var metaParts = [(pos ? pos : ""), nfl, mfl].filter(Boolean);
    // Contract chips (Salary/AAV/Yrs) removed from Player Stats — contract detail
    // lives in the Front Office / Contracts hub (Keith: "enough deets on contracts").
    if (playerRow.mfl_points != null) metaParts.push(fmtCell(playerRow.mfl_points, "dec1") + " MFL pts");
    if (playerRow.mfl_ppg != null) metaParts.push(fmtCell(playerRow.mfl_ppg, "dec1") + " PPG");
    drawerSub.textContent = metaParts.join(" · ");
    drawerBody.innerHTML = '<div class="asw-loading">Fetching week-by-week…</div>';

    // Fetch weekly-scoped data using current leaderboard filters
    var seasons = getSelectedSeasons();
    var url = API_BASE + "/api/advanced-stats-player-weekly" +
      "?gsis_id=" + encodeURIComponent(playerRow.gsis_id) +
      "&seasons=" + encodeURIComponent(seasons.join(",")) +
      getScopeQueryParams();

  // Fetch all-seasons rows for By Season view. Omits the seasons param
  // so we get every year the player has data for, but honors the main
  // screen's scope (Keith 2026-04-24 — "MFL Reg" on the main view means
  // MFL Reg per-season in the drawer too, not full-year regardless).
  function fetchAllYears() {
    if (!drawerState.playerRow) return Promise.reject(new Error("no player"));
    var url = API_BASE + "/api/advanced-stats-player-weekly" +
      "?gsis_id=" + encodeURIComponent(drawerState.playerRow.gsis_id) +
      getScopeQueryParams();

  // Heuristic — does this column represent a rate/% that should be AVG'd
  // across weeks rather than SUM'd? Covers both fmt-based and name-based
  // cases so we don't need to mark every column individually.
  function isRateColumn(key, def) {
    if (def && (def.fmt === "pct" || def.fmt === "pct0")) return true;
    if (/_pct$|_rate$|_per_|_avg$|_pct_|_adot$/.test(key)) return true;
    return false;
  }

  // Collapse an array of weekly rows into one synthetic row per season.
  // Counting stats are SUM'd, rate stats AVG'd. Computed columns ignored
  // (their `compute` function runs naturally on the aggregated row).
  function aggregateBySeason(weekRows) {
    var bySeason = {};
    weekRows.forEach(function(r){
      var s = r.season;
      if (!bySeason[s]) bySeason[s] = [];
      bySeason[s].push(r);
    });

    // Collect ALL column keys seen across rows + COLS — some may not
    // appear on every row (e.g., PFR cols for pre-2018 weeks).
    var keySet = {};
    weekRows.forEach(function(r){ Object.keys(r).forEach(function(k){ keySet[k] = true; }); });

    return Object.keys(bySeason).map(function(s){
      var rows = bySeason[s];
      var agg = { season: parseInt(s, 10), week: null };
      // Games played = weeks with ANY offensive/defensive production
      agg.games = rows.filter(function(r){
        return (r.rush_att||0) + (r.targets||0) + (r.pass_att||0) +
               (r.def_tackles_total||0) + (r.fg_att||0) + (r.punts||0) +
               (r.def_tackles_ast||0) > 0;
      }).length;

      Object.keys(keySet).forEach(function(k){
        if (k === "season" || k === "week" || k === "games") return;
        var def = COLS[k] || {};
        if (def.compute) return; // computed columns derive from aggregates
        var vals = [];
        rows.forEach(function(r){ if (typeof r[k] === "number") vals.push(r[k]); });
        if (!vals.length) { agg[k] = null; return; }
        if (isRateColumn(k, def)) {
          agg[k] = vals.reduce(function(a,b){return a+b;}, 0) / vals.length;
        } else {
          agg[k] = vals.reduce(function(a,b){return a+b;}, 0);
        }
      });

      // Passthrough identity fields from the last weekly row (player may
      // have changed teams mid-season — show the final affiliation)
      var last = rows[rows.length - 1];
      ["team","opponent","position","pos_group","mfl_franchise_id",
       "mfl_franchise_name","mfl_pid","gsis_id","player_name"].forEach(function(k){
        agg[k] = last && last[k];
      });
      return agg;
    }).sort(function(a, b){ return b.season - a.season; });
  }

  // Dispatcher — renders weekly or seasonal view using the drawerState
  // cache, fetching lazily when switching to By Season for the first time.
  function renderDrawerContent() {
    if (drawerState.view === "weekly") {
      if (drawerState.weekRows) renderDrawer(drawerState.playerRow, drawerState.weekRows, "weekly");
      return;
    }
    // season mode
    if (drawerState.seasonRows) {
      renderDrawer(drawerState.playerRow, drawerState.seasonRows, "season");
      return;
    }
    drawerBody.innerHTML = '<div class="asw-loading">Fetching all seasons…</div>';
    fetchAllYears().then(function(j){
      drawerState.allYearRows = Array.isArray(j.rows) ? j.rows : [];
      drawerState.seasonRows = aggregateBySeason(drawerState.allYearRows);
      if (!drawerState.seasonRows.length) {
        drawerBody.innerHTML = '<div class="asw-empty">No career data.</div>';
        return;
      }
      renderDrawer(drawerState.playerRow, drawerState.seasonRows, "season");
    }).catch(function(e){
      drawerBody.innerHTML = '<div class="asw-err">All-seasons fetch failed: ' + (e && e.message || e) + '</div>';
    });
  }

  // Build a simple SVG line chart for a single metric across a series of
  // rows (weeks OR seasons). Returns an HTML string embedding the SVG.
  // Keep this dependency-free so the workbench stays a single drop-in file.
  //
  // Rows may arrive in either direction (table wants newest-first; chart
  // wants oldest→newest left-to-right). Sort here so the chart always
  // reads chronologically regardless of caller order.
  function buildMiniChart(metricKey, label, weekRows, mode) {
    weekRows = weekRows.slice().sort(function(a, b){
      var sa = a.season || 0, sb = b.season || 0;
      if (sa !== sb) return sa - sb;                 // oldest season first
      return (a.week || 0) - (b.week || 0);          // then ascending week
    });
    var def = COLS[metricKey] || { label: metricKey };
    var W = 520, H = 110, PAD_L = 36, PAD_R = 8, PAD_T = 10, PAD_B = 20;
    var innerW = W - PAD_L - PAD_R;
    var innerH = H - PAD_T - PAD_B;

    // Build (x, y) series. x = sequential index (we preserve input order
    // which is season DESC, week ASC).
    var points = weekRows.map(function(r, i){
      var v = getVal(r, metricKey);
      return { x: i, y: (typeof v === "number" && !isNaN(v)) ? v : null, row: r };
    });
    var validYs = points.map(function(p){ return p.y; }).filter(function(y){ return y != null; });
    if (!validYs.length) {
      return '<div class="asw-chart"><div class="asw-chart-title">'+label+'</div>' +
             '<div class="asw-empty" style="padding:16px">No values.</div></div>';
    }
    var yMin = Math.min.apply(null, validYs.concat([0]));
    var yMax = Math.max.apply(null, validYs);
    if (yMax === yMin) yMax = yMin + 1;
    var xCount = Math.max(1, points.length - 1);

    function sx(i){ return PAD_L + (i / xCount) * innerW; }
    function sy(v){ return PAD_T + innerH - ((v - yMin) / (yMax - yMin)) * innerH; }

    // Build path d-attribute, breaking on nulls
    var d = "";
    var penUp = true;
    points.forEach(function(p){
      if (p.y == null) { penUp = true; return; }
      d += (penUp ? "M" : "L") + sx(p.x).toFixed(1) + " " + sy(p.y).toFixed(1) + " ";
      penUp = false;
    });

    // Dots + hover title on every valid point (format depends on mode)
    var dots = points.map(function(p){
      if (p.y == null) return "";
      var stamp = mode === "season"
        ? String(p.row.season || "")
        : (p.row.season || "") + " W" + (p.row.week || "");
      var label = stamp + ": " + fmtCell(p.y, def.fmt);
      return '<circle class="pt" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="2.8">' +
             '<title>'+label.replace(/</g,"&lt;")+'</title></circle>';
    }).join("");

    // Y-axis labels (min / max / mid)
    var yMid = (yMin + yMax) / 2;
    var yTicks = [yMin, yMid, yMax].map(function(v){
      var y = sy(v).toFixed(1);
      return '<text class="axis" x="'+(PAD_L-4)+'" y="'+y+'" text-anchor="end" dy="3">' + fmtCell(v, def.fmt) + '</text>' +
             '<line class="grid" x1="'+PAD_L+'" y1="'+y+'" x2="'+(W-PAD_R)+'" y2="'+y+'"/>';
    }).join("");

    // X-axis labels (season # for By Season, "W<n>" for By Week).
    // Keith 2026-04-24: chart without x-labels was disorienting — you
    // could see the line slope but not what it was plotted against.
    // For long sequences we stride the labels so they don't collide.
    var xLabelStride = Math.max(1, Math.ceil(points.length / 10));
    var xTicks = points.map(function(p, i){
      if (i % xLabelStride !== 0 && i !== points.length - 1) return "";
      var label = mode === "season"
        ? String(p.row.season || "")
        : "W" + (p.row.week || "");
      var x = sx(i).toFixed(1);
      return '<text class="axis" x="'+x+'" y="'+(H - 4)+'" text-anchor="middle">'+ label +'</text>';
    }).join("");

    // Zero line when it's inside the range
    var zeroLine = "";
    if (yMin < 0 && yMax > 0) {
      var z = sy(0).toFixed(1);
      zeroLine = '<line class="zero" x1="'+PAD_L+'" y1="'+z+'" x2="'+(W-PAD_R)+'" y2="'+z+'"/>';
    }

    return '<div class="asw-chart">' +
             '<div class="asw-chart-title">'+label+'</div>' +
             '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
               yTicks + zeroLine +
               '<path class="line" d="'+d+'"/>' +
               dots +
               xTicks +
             '</svg>' +
           '</div>';
  }

  // Render drawer body: chart + table (week-by-week OR per-season).
  // mode: "weekly" shows (Season, Wk) as leftmost sticky cols.
  // mode: "season" shows (Season) only; each row is one year.
  // ---- Drawer header blocks: Profile chips + percentile bars + splits strip ----
  // Percentile bars (the PlayerProfiler card pattern): each signature metric as a
  // 0-100 positional percentile vs the CURRENTLY LOADED position rows. Uses data
  // already in memory — no extra fetches.
  var PCTL_METRICS_BY_TAB = {
    qb:     ["mfl_ppg","pass_yds","pass_tds","cmp_pct","epa_play","epa_cpoe","xfp_sustain","ftn_pa"],
    rb:     ["mfl_ppg","rush_yds","y_per_a","rush_share","target_share","ngs_ryoe_pa","epa_play","xfp_sustain"],
    wr:     ["mfl_ppg","rec_yds","target_share","wopr","rt_yprr","ngs_sep","epa_play","xfp_sustain"],
    te:     ["mfl_ppg","rec_yds","target_share","wopr","rt_yprr","ngs_sep","epa_play","xfp_sustain"],
    flex_o: ["mfl_ppg","rec_yds","rush_yds","target_share","wopr","rt_yprr","epa_play","xfp_sustain"],
    dl:     ["mfl_ppg","def_tackles_total","def_sacks","def_pressures","def_tfl"],
    lb:     ["mfl_ppg","def_tackles_total","def_sacks","def_pass_def","def_tfl"],
    db:     ["mfl_ppg","def_tackles_total","def_ints","def_pass_def"],
    flex_idp: ["mfl_ppg","def_tackles_total","def_sacks","def_ints"],
    pk:     ["mfl_ppg","fg_made","fg_pct"],
    pn:     ["mfl_ppg","punts","punt_net_avg","punt_i20_pct"],
  };
  function buildDrawerProfileHtml(playerRow) {
    var html = "";
    // Profile chips — age / draft capital / athleticism (static JSON).
    var prof = profileByGsis[String(playerRow.gsis_id)];
    var chips = [];
    if (prof) {
      if (prof.age != null) chips.push("Age " + prof.age);
      if (prof.draft_cap) chips.push(prof.draft_cap);
      if (prof.forty != null) chips.push(prof.forty + "s 40yd");
      if (prof.speed_score != null) chips.push("Speed " + prof.speed_score);
    }
    var mkt = marketByMfl[String(playerRow.mfl_pid)];
    if (mkt) {
      if (mkt.own != null) chips.push("Own " + mkt.own.toFixed(0) + "%");
      if (mkt.rank != null) chips.push("Xpert #" + mkt.rank);
      if (mkt.inj) chips.push("⚕ " + mkt.inj);
    }
    if (chips.length) {
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">' +
        chips.map(function(c){ return '<span style="background:var(--panel-alt);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--text)">' + escapeHtml(c) + '</span>'; }).join("") +
        '</div>';
    }
    // Percentile bars vs the loaded position rows.
    var tab = TABS[state.activeTab];
    var pool = (state.rowsByWorkerPos[tab.workerPos] || []).filter(function(r){
      return !tab.positionFilter || tab.positionFilter.indexOf(String(r.position || "").toUpperCase()) >= 0;
    });
    var keys = (PCTL_METRICS_BY_TAB[state.activeTab] || []).filter(function(k){ return COLS[k]; });
    if (pool.length >= 8 && keys.length) {
      var bars = keys.map(function(k){
        var def = COLS[k];
        var mine = getVal(playerRow, k);
        if (mine == null || isNaN(mine)) return "";
        var below = 0, n = 0;
        for (var i = 0; i < pool.length; i++) {
          var v = getVal(pool[i], k);
          if (v == null || (typeof v === "number" && isNaN(v))) continue;
          n++;
          if (v <= mine) below++;
        }
        if (n < 8) return "";
        var pct = Math.round(100 * below / n);
        if (def.invertRank) pct = 100 - pct;
        var color = pct >= 80 ? "var(--good, #3fb950)" : pct >= 60 ? "#7bc96f" : pct >= 40 ? "var(--muted)" : pct >= 20 ? "#e0863f" : "var(--bad, #f85149)";
        return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px">' +
          '<span style="width:88px;color:var(--muted);text-align:right;flex:none" title="' + escapeHtml(def.title || "") + '">' + escapeHtml(def.label) + '</span>' +
          '<span style="flex:1;height:9px;background:var(--panel-alt);border-radius:5px;overflow:hidden"><span style="display:block;height:100%;width:' + pct + '%;background:' + color + ';border-radius:5px"></span></span>' +
          '<span style="width:56px;flex:none">' + fmtCell(mine, def.fmt) + '</span>' +
          '<span style="width:34px;flex:none;color:' + color + ';font-weight:700">' + pct + '</span>' +
        '</div>';
      }).filter(Boolean).join("");
      if (bars) {
        html += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px" title="Positional percentile vs the currently loaded ' + escapeHtml(tab.label) + ' rows (0-100, higher = better; lower-is-better stats auto-inverted)">' + bars + '</div>';
      }
    }
    // Splits strip — game script + home/road opportunities per game.
    var sp = splitsByGsis[String(playerRow.gsis_id)];
    if (sp && (sp.lead || sp.trail || sp.home)) {
      function cell(lbl, b) {
        if (!b || !b.g) return "";
        return '<span style="background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11.5px"><span style="color:var(--muted)">' + lbl + ':</span> <b>' + (b.opp_pg != null ? b.opp_pg : "—") + '</b> opp/g <span style="color:var(--muted)">(' + b.g + 'g)</span></span>';
      }
      var cells = [cell("Leading", sp.lead), cell("Neutral", sp.neutral), cell("Trailing", sp.trail), cell("Home", sp.home), cell("Road", sp.road)].filter(Boolean).join("");
      if (cells) {
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px" title="Opportunities (targets + carries; dropbacks for QBs) per game by game situation — the game-script read">' +
          '<span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;align-self:center">Splits</span>' + cells + '</div>';
      }
    }
    return html ? '<section class="asw-drawer-section"><h3>Profile</h3>' + html + '</section>' : "";
  }

  function renderDrawer(playerRow, rows, mode) {
    var tab = TABS[state.activeTab];
    mode = mode || "weekly";
    var isSeason = mode === "season";

    // Default chart metric — first entry in the tab's chart list, or
    // fall back to the leaderboard's active sort key. Remembered across
    // re-renders via drawerState.chartMetric so the user's pick survives
    // By Week ↔ By Season toggles.
    var defaultMetrics = (CHART_METRICS_BY_TAB[state.activeTab] || []).filter(function(k){ return COLS[k]; });
    if (!drawerState.chartMetric || !COLS[drawerState.chartMetric]) {
      drawerState.chartMetric = defaultMetrics[0] || state.sortKey || "games";
    }
    var chartMetric = drawerState.chartMetric;

    // Grouped metric dropdown — reuses the tab's column-group structure
    // so charts are organized the same way the leaderboard cols are.
    var metricSelectHtml = (function(){
      var opts = (tab.groups || []).map(function(g){
        var innerOpts = g.cols
          .filter(function(k){ return COLS[k] && COLS[k].num; })
          .map(function(k){
            var sel = k === chartMetric ? ' selected' : '';
            return '<option value="'+k+'"'+sel+'>'+ escapeHtml(COLS[k].label || k) +'</option>';
          }).join("");
        if (!innerOpts) return "";
        return '<optgroup label="'+ escapeHtml(g.label) +'">'+ innerOpts +'</optgroup>';
      }).filter(Boolean).join("");
      return '<select id="asw-chart-metric" style="background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;min-width:200px">' + opts + '</select>';
    })();
    var chartsHtml =
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">' +
        '<span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700">Chart</span>' +
        metricSelectHtml +
      '</div>' +
      '<div id="asw-chart-mount">' +
        buildMiniChart(chartMetric, (COLS[chartMetric] && COLS[chartMetric].label) || chartMetric, rows, mode) +
      '</div>';

    // Metric-focused table (Keith 2026-04-24): instead of dumping every
    // visible column group, show a narrow strip centered on the chart
    // metric. Structure:
    //   [Season, Wk|G, MFL Pts, Snaps, Snap%] + [chartMetric, ...supports]
    // Identical columns in Weekly and Season modes so eye-to-eye
    // comparison works when toggling views.
    var usageGroup = (tab.groups || []).find(function(g){ return g.id === "usage"; });
    var usageSuffix = usageGroup
      ? usageGroup.cols.filter(function(c){ return c !== "games" && COLS[c]; })
      : [];
    var supports = METRIC_FOCUS[chartMetric] || [];
    var tableCols = [chartMetric].concat(supports);
    // Dedupe + drop any keys not in COLS (stale refs)
    var seen = {};
    tableCols = tableCols.filter(function(k){
      if (!k || seen[k] || !COLS[k]) return false;
      seen[k] = true;
      return true;
    });

    // Single-row header — Season | Wk(or G) | MFL Pts | Snaps | Snap% | [metric] | [supports]
    var colHeader = isSeason
      ? '<th class="week-col">Season</th><th class="week-col num">G</th><th class="week-col num">MFL Pts</th>'
      : '<th class="week-col">Season</th><th class="week-col">Wk</th><th class="week-col num">MFL Pts</th>';
    colHeader += usageSuffix.map(function(k){
      var d = COLS[k] || { label: k };
      return '<th class="num">' + escapeHtml(d.label) + '</th>';
    }).join("");
    colHeader += tableCols.map(function(k, i){
      var d = COLS[k] || { label: k };
      var cls = d.num ? "num" : "";
      // Accent the picked chart metric so the eye knows which col drives the chart
      var accent = i === 0 ? ' style="color:var(--accent)"' : "";
      return '<th class="'+cls+'"'+accent+' title="'+escapeHtml(d.title || "")+'">'+ escapeHtml(d.label) +'</th>';
    }).join("");

    var body = rows.map(function(r){
      var leftCells = isSeason
        ? '<td class="week-col">'+(r.season||"")+'</td>' +
          '<td class="week-col num">'+(r.games != null ? r.games : "—")+'</td>' +
          '<td class="week-col num">'+ fmtCell(r.mfl_points, "dec1") +'</td>'
        : '<td class="week-col">'+(r.season||"")+'</td>' +
          '<td class="week-col">'+(r.week||"")+'</td>' +
          '<td class="week-col num">'+ fmtCell(r.mfl_points, "dec1") +'</td>';
      var cells = leftCells;
      usageSuffix.forEach(function(k){
        var d = COLS[k] || {};
        var v = getVal(r, k);
        cells += '<td class="num">'+ fmtCell(v, d.fmt) +'</td>';
      });
      tableCols.forEach(function(k, i){
        var d = COLS[k] || {};
        var v = getVal(r, k);
        var cls = d.num ? "num" : "";
        var accent = i === 0 ? ' style="color:var(--accent);font-weight:600"' : "";
        cells += '<td class="'+cls+'"'+accent+'>'+ fmtCell(v, d.fmt) +'</td>';
      });
      return '<tr>'+cells+'</tr>';
    }).join("");

    var sectionLabel = isSeason
      ? 'Year-over-year · ' + rows.length + ' seasons'
      : 'Week-by-week · ' + rows.length + ' weeks';

    drawerBody.innerHTML =
      buildDrawerProfileHtml(playerRow) +
      '<section class="asw-drawer-section">' +
        '<h3>Trend (' + tab.label + (isSeason ? ' · By Season' : ' · By Week') + ')</h3>' +
        chartsHtml +
      '</section>' +
      '<section class="asw-drawer-section">' +
        '<h3>' + sectionLabel + '</h3>' +
        '<div class="asw-table-wrap"><table class="asw-table asw-week-table">' +
          '<thead><tr class="asw-col-row">' + colHeader + '</tr></thead>' +
          '<tbody>' + body + '</tbody>' +
        '</table></div>' +
      '</section>';

    // Wire the metric dropdown — re-render the whole drawer body so
    // the supporting-metrics table beneath the chart also swaps to
    // match the new pick (prior version only updated the chart, which
    // left a stale QB table under a TE's chart, etc.).
    var sel = document.getElementById("asw-chart-metric");
    if (sel) {
      sel.addEventListener("change", function(){
        drawerState.chartMetric = sel.value;
        renderDrawer(playerRow, rows, mode);
      });
    }
  }

  drawerCloseBtn.addEventListener("click", closeDrawer);
  drawerScrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && drawerEl.classList.contains("open")) closeDrawer();
  });
  // By Week / By Season view toggle
  drawerViewBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      var view = btn.getAttribute("data-view");
      if (drawerState.view === view) return;
      drawerState.view = view;
      drawerViewBtns.forEach(function(x){
        x.setAttribute("aria-pressed", x === btn ? "true" : "false");
      });
      renderDrawerContent();
    });
  });

  // ---------- URL state ----------
  // Serialize the full current view (tab, sub, seasons, scope, teams,
  // groups, sort, heat, filter-row visibility, per-column filters,
  // search) into window.location.hash so a copied URL reproduces the
  // exact view. Hash avoids server round-trips and keeps it out of
  // history (replaceState).
  function syncUrl() {
    try {
      var params = new URLSearchParams();
      params.set("tab", state.activeTab);
      if (state.activeSubTab && state.activeSubTab !== "all") params.set("sub", state.activeSubTab);
      var seasons = getSelectedSeasons();
      if (seasons.length) params.set("seasons", seasons.join(","));
      var scope = getScope();
      if (scope === "custom") {
        var r = getCustomWeekRange();
        params.set("scope", "custom");
        params.set("week_min", String(r.lo));
        params.set("week_max", String(r.hi));
      } else {
        params.set("scope", scope);
      }
      var teams = [];
      for (var ti = 0; ti < teamSel.options.length; ti++) {
        if (teamSel.options[ti].selected) teams.push(teamSel.options[ti].value);
      }
      if (teams.length && !(teams.length === 1 && teams[0] === "__ALL__")) {
        params.set("teams", teams.join(","));
      }
      // Preset views: view= names the preset; groups= is only written for
      // custom (old URLs carrying groups= without view= parse as custom).
      params.set("view", state.viewName || "standard");
      if (state.viewName === "custom") {
        var groups = Array.from(state.visibleGroups).sort();
        if (groups.length) params.set("groups", groups.join(","));
      }
      if (state.sortKey) params.set("sort", state.sortKey + "." + state.sortDir);
      if (state.heatOn) params.set("heat", "1");
      if (state.filtersVisible) params.set("fv", "1");
      Object.keys(state.filters).forEach(function(k){
        var v = (state.filters[k] || "").trim();
        if (v) params.set("f." + k, v);
      });
      if (searchEl.value) params.set("q", searchEl.value);
      var hash = "#" + params.toString();
      if (window.location.hash !== hash) {
        history.replaceState(null, "", hash);
      }
    } catch (e) { /* URL API unavailable — silently ignore */ }
  }

  // Read URL on boot. Returns true if any URL state was applied so the
  // initial-load bootstrap can skip its default group reset.
  function readStateFromUrl() {
    var hash = String(window.location.hash || "").replace(/^#/, "");
    if (!hash) return false;
    var params;
    try { params = new URLSearchParams(hash); } catch (e) { return false; }
    var touched = false;

    var t = params.get("tab");
    if (t && TABS[t]) { state.activeTab = t; touched = true; }
    var sub = params.get("sub");
    if (sub) { state.activeSubTab = sub; touched = true; }

    var seasonsParam = params.get("seasons");
    if (seasonsParam) {
      var wanted = {};
      seasonsParam.split(",").forEach(function(s){
        var y = parseInt(s, 10);
        if (y) wanted[y] = true;
      });
      for (var i = 0; i < seasonsSel.options.length; i++) {
        seasonsSel.options[i].selected = !!wanted[parseInt(seasonsSel.options[i].value, 10)];
      }
      touched = true;
    }

    var scope = params.get("scope");
    if (scope === "custom") {
      scopeSel.value = "custom";
      var wmin = parseInt(params.get("week_min"), 10);
      var wmax = parseInt(params.get("week_max"), 10);
      if (Number.isFinite(wmin) && wmin >= 1 && wmin <= 22) weekStartSel.value = String(wmin);
      if (Number.isFinite(wmax) && wmax >= 1 && wmax <= 22) weekEndSel.value   = String(wmax);
      touched = true;
    } else if (scope) {
      scopeSel.value = scope;
      touched = true;
    } else if (params.get("weeks")) {
      // Legacy URLs used weeks=1,2,3 (list). Collapse to a [lo,hi] range.
      var wks = params.get("weeks").split(",").map(function(w){ return parseInt(w, 10); })
                     .filter(function(w){ return w >= 1 && w <= 22; });
      if (wks.length) {
        scopeSel.value = "custom";
        weekStartSel.value = String(Math.min.apply(null, wks));
        weekEndSel.value   = String(Math.max.apply(null, wks));
        touched = true;
      }
    }

    // Teams — franchise options arrive async. Defer to leagueStatePromise.
    var teamsParam = params.get("teams");
    if (teamsParam) {
      leagueStatePromise.then(function(){
        var wants = {};
        teamsParam.split(",").forEach(function(t){ if (t) wants[t] = true; });
        for (var j = 0; j < teamSel.options.length; j++) {
          teamSel.options[j].selected = !!wants[teamSel.options[j].value];
        }
        runQuery();
      });
      touched = true;
    }

    var viewParam = params.get("view");
    var groupsParam = params.get("groups");
    if (viewParam && viewParam !== "custom" && groupsForView(TABS[state.activeTab], viewParam)) {
      state.visibleGroups = groupsForView(TABS[state.activeTab], viewParam);
      state.viewName = viewParam;
      touched = true;
    } else if (groupsParam) {
      // Explicit group list (or legacy pre-view URL) → custom.
      state.visibleGroups = new Set(groupsParam.split(",").filter(Boolean));
      state.viewName = "custom";
      touched = true;
    }

    var sortParam = params.get("sort");
    if (sortParam) {
      var parts = sortParam.split(".");
      state.sortKey = parts[0] || null;
      state.sortDir = parts[1] === "asc" ? "asc" : "desc";
      touched = true;
    }
    if (params.get("heat") === "1") { state.heatOn = true; touched = true; }
    if (params.get("fv") === "1")   { state.filtersVisible = true; touched = true; }
    params.forEach(function(v, k){
      if (k.indexOf("f.") === 0) { state.filters[k.slice(2)] = v; touched = true; }
    });
    if (params.get("q")) { searchEl.value = params.get("q"); touched = true; }
    return touched;
  }

  // ---------- Initial load ----------
  var urlApplied = readStateFromUrl();
  if (!urlApplied || state.visibleGroups.size === 0) {
    restoreViewForTab(state.activeTab);   // saved per-tab view (falls back to Standard)
  }
  // Highlight the active tab (readStateFromUrl doesn't touch aria-pressed on tabs)
  tabsEl.querySelectorAll(".asw-tab").forEach(function(btn){
    btn.setAttribute("aria-pressed", btn.getAttribute("data-tab") === state.activeTab ? "true" : "false");
  });
  renderSubTabs();
  renderColsBar();
  updateCustomPickerVisibility();
  wireTopScroll();
  setPageHead("player-stats");
  runQuery();

  // Keep URL in sync after every render (covers sort/filter/heat/group
  // toggle changes in addition to the runQuery path).
  (function(){
    var origRender = render;
    render = function(){ origRender.apply(null, arguments); syncUrl(); };
  })();

  // ===================== Fantasy Points Against (Stats sub-tab) =====================
  // RAW points a defense allows to a position (per game) + the opponent-ADJUSTED
  // rating, from /api/fantasy-points-against. One fetch per (year, week-range)
  // returns all 9 groups; the position chips filter client-side. Lazy: the view
  // only builds on first switch.
  (function(){
    var host = document.getElementById("asw-view-fpa");
    var viewTabs = document.getElementById("asw-viewtabs");
    var psSection = document.getElementById("asw-view-player-stats");
    if (!host || !viewTabs) return;
    function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    var POS = [["QB", "QB"], ["RB", "RB"], ["WR", "WR"], ["TE", "TE"], ["DL", "DL"], ["LB", "LB"], ["DB", "DB"], ["PK", "K"], ["PN", "P"]];
    var fpa = { year: String(THIS_YEAR), pos: "RB", wkMin: 1, wkMax: 18, sort: "rank", dir: 1, cache: {}, years: null, rendered: false, _fb: false, detailTeam: null, detailWeek: null, detailCache: {} };
    function flipName(n){ n = String(n || ""); if (n.indexOf(",") >= 0) { var p = n.split(","); return ((p[1] || "").trim() + " " + (p[0] || "").trim()).trim(); } return n; }
    function posLbl(){ return (POS.filter(function(p){ return p[0] === fpa.pos; })[0] || ["", ""])[1] || fpa.pos; }
    function key(){ return fpa.year + ":" + fpa.wkMin + "-" + fpa.wkMax; }

    function loadYears(cb){
      if (fpa.years) return cb(fpa.years);
      fetch(API_BASE + "/api/league-years").then(function(r){ return r.json(); }).then(function(d){
        var ys = [];
        (d && d.years || []).forEach(function(y){ if (y && y.season && parseInt(y.season, 10) >= 2017) ys.push(String(y.season)); });
        ys.sort().reverse();
        if (!ys.length) { for (var y = THIS_YEAR; y >= 2017; y--) ys.push(String(y)); }
        fpa.years = ys; cb(ys);
      }).catch(function(){ var ys = []; for (var y = THIS_YEAR; y >= 2017; y--) ys.push(String(y)); fpa.years = ys; cb(ys); });
    }

    function load(){
      var k = key();
      if (fpa.cache[k]) { paint(); return; }
      var body = host.querySelector(".fpa-body"); if (body) body.innerHTML = '<div class="asw-meta" style="padding:14px">Loading…</div>';
      fetch(API_BASE + "/api/fantasy-points-against?YEAR=" + encodeURIComponent(fpa.year) + "&week_min=" + fpa.wkMin + "&week_max=" + fpa.wkMax)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var data = (d && d.ok) ? d : { teams: {}, weeksUsed: [] };
          fpa.cache[k] = data;
          // Offseason / empty current year → fall back to the prior season once.
          if (!Object.keys(data.teams || {}).length && fpa.year === String(THIS_YEAR) && !fpa._fb) {
            fpa._fb = true; fpa.year = String(THIS_YEAR - 1);
            var ysel = host.querySelector(".fpa-year"); if (ysel) ysel.value = fpa.year;
            load(); return;
          }
          paint();
        })
        .catch(function(){ fpa.cache[k] = { teams: {}, weeksUsed: [], err: 1 }; paint(); });
    }

    function rkCls(rank, of){ if (rank == null) return "mid"; if (rank <= 10) return "easy"; if (rank > of - 10) return "tough"; return "mid"; }

    function paint(){
      if (fpa.detailTeam) { paintDetail(fpa.detailTeam); return; }
      var d = fpa.cache[key()] || { teams: {} }, teams = d.teams || {}, rows = [];
      Object.keys(teams).forEach(function(tm){ var c = teams[tm] && teams[tm][fpa.pos]; if (c) rows.push({ tm: tm, raw: c.raw || {}, adj: c.adj || {} }); });
      rows.sort(function(a, b){
        var va, vb;
        if (fpa.sort === "rank") { va = a.adj.rank == null ? 999 : a.adj.rank; vb = b.adj.rank == null ? 999 : b.adj.rank; }
        else if (fpa.sort === "ratio") { va = a.adj.ratio == null ? -1 : a.adj.ratio; vb = b.adj.ratio == null ? -1 : b.adj.ratio; }
        else { va = a.raw[fpa.sort] == null ? -1 : a.raw[fpa.sort]; vb = b.raw[fpa.sort] == null ? -1 : b.raw[fpa.sort]; }
        return (va - vb) * fpa.dir;
      });
      var of = rows.length, posLabel = posLbl();
      var wu = (d.weeksUsed || []).length;
      var sub = fpa.year + " · weeks " + fpa.wkMin + "–" + fpa.wkMax + (wu ? " (" + wu + " played)" : "") + " · rank 1 = most generous to " + posLabel + " · click a team for the game-by-game breakdown" + (d.err ? " · (load error)" : "");
      function arrow(k){ return fpa.sort === k ? (fpa.dir > 0 ? " ▲" : " ▼") : ""; }
      var html = '<div class="fpa-sub">' + esc(sub) + '</div>' +
        '<div class="asw-table-wrap"><table class="fpa-table"><thead><tr>' +
        '<th class="num" data-k="rank">Rank' + arrow("rank") + '</th>' +
        '<th class="team">Team</th>' +
        '<th class="num" data-k="perGame" title="Raw fantasy points this defense allows to the position per game">Allowed' + arrow("perGame") + '</th>' +
        '<th class="num" data-k="oppNorm" title="What the players it faced normally average per game (strength-of-schedule baseline)">Opp Norm' + arrow("oppNorm") + '</th>' +
        '<th class="num" data-k="ratio" title="Allowed vs opponent normal — opponent-adjusted">&Delta;%' + arrow("ratio") + '</th>' +
        '<th class="num" data-k="games">G' + arrow("games") + '</th>' +
        '</tr></thead><tbody>';
      if (!rows.length) html += '<tr><td class="team">—</td><td colspan="5" class="num" style="color:var(--muted)">No data for this position / range.</td></tr>';
      rows.forEach(function(r){
        var pct = r.adj.ratio != null ? Math.round((r.adj.ratio - 1) * 100) : null;
        html += '<tr class="fpa-team-row" data-team="' + esc(r.tm) + '" title="Click for the game-by-game breakdown">' +
          '<td class="num"><span class="fpa-rk ' + rkCls(r.adj.rank, of) + '">' + (r.adj.rank != null ? ("#" + r.adj.rank) : "—") + '</span></td>' +
          '<td class="team">' + esc(r.tm) + '</td>' +
          '<td class="num">' + (r.raw.perGame != null ? r.raw.perGame : "—") + '</td>' +
          '<td class="num">' + (r.raw.oppNorm != null ? r.raw.oppNorm : "—") + '</td>' +
          '<td class="num">' + (pct != null ? '<span class="asw-trend ' + (pct > 0 ? "up" : (pct < 0 ? "dn" : "")) + '">' + (pct >= 0 ? "+" : "") + pct + "%</span>" : "—") + '</td>' +
          '<td class="num">' + (r.raw.games != null ? r.raw.games : "—") + '</td>' +
          '</tr>';
      });

    var adpSection = document.getElementById("asw-view-adp");
    // Multi-source value board, normalized to RANKINGS for the UPS league
    // (Superflex, dynasty-lean). Every source becomes a clean overall rank; the
    // values drive per-position TIERS. The owner picks which sources to include
    // and a dynasty↔redraft skew (default 35% redraft); ranks + tiers recompute
    // client-side. (Roster format is baked to Superflex — no picker.)
    var adp = { pos: "ALL", q: "", sort: "ovr", dir: 1, data: null, sources: [], rendered: false, _t: null,

    var ADP_SRC = [["fc","FantasyCalc"],["ktc","KeepTradeCut"],["dp","DynastyProcess"]];
    function adpKeys(){ return { d: "dsf", r: "rsf" }; }   // baked Superflex
    // RANK-CONSENSUS redraft axis (Keith 2026-07-13, mirrors trade_grader.
    // fetch_adp_board() — keep in sync). The old value-average had two
    // compounding bugs: (1) KTC/DynastyProcess rarely publish rsf at all, so
    // "35% redraft" often collapsed to FantasyCalc's single field; (2) where
    // KTC DOES publish rsf, its redraft $-scale isn't comparable to FC's — a
    // KTC rsf ~4700-4800 can correspond to only KTC's OWN ~104th-110th-best
    // redraft player, wildly inflating a mid-tier player the instant KTC is
    // present. Fix: rank each source against only its own reporting
    // population (a scale mismatch can never leak in), average the available
    // ranks across {fc.rsf desc, ktc.rsf desc, ffcAdp asc (FantasyFootball-
    // Calculator, real live-draft ADP)}, then map the consensus rank back onto
    // FC's rsf $-scale so it still plugs into the existing dyn/rd blend.
    // Verified same-day against real external ADP: Parker Washington
    // WR91->WR42 (FantasyData has him WR39/ADP85); Kyle Pitts TE6->TE7
    // (FantasyData has him TE8/ADP92 — the OLD "TE6" was itself inflated by
    // the KTC scale-mismatch bug); Kittle holds exactly TE9 (his three source
    // ranks already agreed).
    function adpRankMap(board, keyFn, ascending){
      var scored = [];
      board.forEach(function(p){ var v = keyFn(p); if (v != null) scored.push([v, p]); });
      scored.sort(function(a,b){ return ascending ? a[0]-b[0] : b[0]-a[0]; });
      var m = new Map();
      scored.forEach(function(x, i){ m.set(x[1], i+1); });
      return m;
    }
    function adpRankToFcValueCurve(board, fcRank){
      var pairs = [];
      board.forEach(function(p){
        var r = fcRank.get(p), v = p.fc && p.fc.rsf;
        if (r && v) pairs.push([r, Number(v)]);
      });
      pairs.sort(function(a,b){ return a[0]-b[0]; });
      return pairs;
    }
    function adpValueAtRank(r, curve){
      if (!curve || !curve.length) return null;
      if (r <= curve[0][0]) return curve[0][1];
      if (r >= curve[curve.length-1][0]) return curve[curve.length-1][1];
      for (var i=1; i<curve.length; i++){
        if (curve[i][0] >= r){
          var r0=curve[i-1][0], v0=curve[i-1][1], r1=curve[i][0], v1=curve[i][1];
          var f = r1!==r0 ? (r-r0)/(r1-r0) : 0;
          return v0 + (v1-v0)*f;
        }
      }
      return curve[curve.length-1][1];
    }
    function adpBuildRankConsensus(board){
      var fcRank = adpRankMap(board, function(p){ return p.fc && p.fc.rsf > 0 ? p.fc.rsf : null; }, false);
      var ktcRank = adpRankMap(board, function(p){ return p.ktc && p.ktc.rsf > 0 ? p.ktc.rsf : null; }, false);
      var ffcRank = adpRankMap(board, function(p){ return p.ffcAdp; }, true);
      // MFL native AAV — the ONLY source quoting real auction dollars, and it IS
      // live again for 2026 (800 tracked auctions). REFERENCE ONLY, deliberately NOT
      // in the consensus: inspected 2026-07-21, the top six players by average value
      // are all 2026 rookies (Jeremiyah Love $57.39 ... Ja'Marr Chase only 7th,
      // Josh Allen 10th) because the auctions MFL tracks in July are dynasty ROOKIE
      // auctions. That is a rookie-draft ordering, not a redraft one, and ranking it
      // rather than averaging it does not help — the contamination is in the order
      // itself. The rank map is built so the column can be displayed and so this is
      // one uncomment away if the pool shifts once redraft auctions ramp up.
      var mflRank = adpRankMap(board, function(p){ return p.mflAav > 0 ? p.mflAav : null; }, false);
      return { fcRank: fcRank, ktcRank: ktcRank, ffcRank: ffcRank, mflRank: mflRank, curve: adpRankToFcValueCurve(board, fcRank) };
    }
    // Consensus REDRAFT value for one row, honoring which sources are toggled on.
    function adpRedraftConsensus(row, rc){
      if (!rc) return null;
      var ranks = [];
      if (adp.srcSel.fc && rc.fcRank.has(row)) ranks.push(rc.fcRank.get(row));
      if (adp.srcSel.ktc && rc.ktcRank.has(row)) ranks.push(rc.ktcRank.get(row));
      if (rc.ffcRank.has(row)) ranks.push(rc.ffcRank.get(row));   // ffcAdp has no UI toggle — always on
      if (!ranks.length) return null;
      var avg = ranks.reduce(function(a,b){ return a+b; }, 0) / ranks.length;
      return adpValueAtRank(avg, rc.curve);
    }
    // One source's displayed value for the chosen skew. At the extremes a
    // dynasty-only source (DP has no redraft value) drops to null instead of
    // falling back to the other dimension — so DP shows "—" at 100% redraft.
    // The DYNASTY value of one source's block. Prefer `ndsf` — the worker's
    // SCALE-NORMALISED dynasty value (each source ranked within its own reporting
    // population, TE-premium-bridged for the non-TEP sources, mapped onto one
    // common cardinal curve). Averaging raw `dsf` across sources is the 2026-07-13
    // bug in its dynasty-axis form: KTC's value curve is ~4.6x flatter than
    // DynastyProcess's past rank 100, so a raw mean silently becomes KTC's board.
    // With `ndsf` every source shares one scale, so ANY subset the user toggles on
    // can be plainly averaged and stay correct. `dsf` fallback is split-deploy
    // safety only (site ships before the worker) — see worker /api/adp-board.
    function adpDynVal(blk, k){
      if (!blk) return null;
      if (blk.ndsf != null && blk.ndsf > 0) return blk.ndsf;
      return blk[(k || adpKeys()).d];
    }
    function adpSrcBlend(row, src){
      var blk = row[src]; if (!blk) return null;
      var k = adpKeys(), dyn = adpDynVal(blk, k), rd = blk[k.r];
      if (dyn == null && rd == null) return null;
      if (adp.rdPct >= 0.999) return (rd != null && rd > 0) ? rd : null;
      if (adp.rdPct <= 0.001) return (dyn != null && dyn > 0) ? dyn : null;
      if (rd == null) return dyn; if (dyn == null) return rd;
      return Math.round((1 - adp.rdPct) * dyn + adp.rdPct * rd);
    }
    // Consensus VALUE = PER-DIMENSION blend: average the selected sources' dynasty
    // values and their redraft values SEPARATELY, then blend by the skew. This is
    // why a dynasty-only source (DP, no redraft) can't drag an old-but-elite
    // redraft player down at 100% redraft — it simply isn't in the redraft mean.
    function adpBlend(row){
      if (row.isIdp) return row.idpVal != null ? row.idpVal : null;
      var k = adpKeys(), dynVals = [];
      ADP_SRC.forEach(function(p){
        if (!adp.srcSel[p[0]]) return;
        var blk = row[p[0]]; if (!blk) return;
        var v = adpDynVal(blk, k);
        if (v != null && v > 0) dynVals.push(v);
      });
      var dynC = dynVals.length ? dynVals.reduce(function(a,b){ return a + b; }, 0) / dynVals.length : null;
      var rdC = adpRedraftConsensus(row, adp._rankConsensus);
      if (dynC == null && rdC == null) return null;
      if (rdC == null) return Math.round(dynC);
      if (dynC == null) return Math.round(rdC);
      return Math.round((1 - adp.rdPct) * dynC + adp.rdPct * rdC);
    }

    // Per-position TIERS from the consensus value, via LOCAL-CLIFF detection: a
    // new tier starts where a value drop is much bigger than the surrounding
    // drops (a cliff relative to the local terrain). This finds cliffs at any
    // depth — so RB7→RB8 can break while RB8..RB15 sit flat in one tier — and
    // doesn't dump the long flat tail into one giant tier the way a global
    // threshold does. arr must be pre-sorted desc by value.
    function adpAssignTiers(arr){
      var n = arr.length; if (!n) return;
      var vals = arr.map(function(r){ return r._bv != null ? r._bv : (r.idpVal || 0); });
      arr[0]._tier = 1; if (n < 2) return;
      var gaps = []; for (var i = 1; i < n; i++) gaps.push(vals[i-1] - vals[i]);
      var W = 4, K = 2.5, MINREL = 0.04;
      function median(a){ if (!a.length) return 0; var s = a.slice().sort(function(x,y){ return x - y; }); var m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; }
      var tier = 1;
      for (var j = 1; j < n; j++){
        var g = vals[j-1] - vals[j];
        var lo = Math.max(0, (j-1) - W), hi = Math.min(gaps.length, (j-1) + W + 1);
        var local = []; for (var t = lo; t < hi; t++) if (gaps[t] > 0) local.push(gaps[t]);
        var med = median(local);
        var rel = vals[j-1] > 0 ? g / vals[j-1] : 0;
        if (med > 0 && g > med * K && rel > MINREL) tier++;
        arr[j]._tier = tier;
      }
    }
    function adpPaint(){
      var skewEl = adpSection.querySelector(".adp-skew-lbl");
      var rdP = Math.round(adp.rdPct * 100);

      var isIdpView = (adp.pos === "DL" || adp.pos === "LB" || adp.pos === "DB");
      // Ranking/tier universe: offense (non-IDP) normally; IDP only in a D-line view.
      var universe = (adp.data || []).filter(function(r){ return isIdpView ? r.isIdp : !r.isIdp; });
      universe.forEach(function(r){ r._bv = adpBlend(r); });
      // Clean per-source OVERALL ranks (sort by each source's blended value;
      // Sleeper by its search_rank) → 1..N, no duplicate #1s.
      if (!isIdpView) {
        ADP_SRC.forEach(function(p){
          universe.forEach(function(r){ r["_rk_" + p[0]] = null; });
          universe.map(function(r){ return { r: r, v: adpSrcBlend(r, p[0]) }; })
            .filter(function(x){ return x.v != null && x.v > 0; })
            .sort(function(a, b){ return b.v - a.v; })
            .forEach(function(x, i){ x.r["_rk_" + p[0]] = i + 1; });
        });
        universe.forEach(function(r){ r._rk_slp = null; });
        universe.filter(function(r){ return r.sleeperRank != null; })
          .sort(function(a, b){ return a.sleeperRank - b.sleeperRank; })
          .forEach(function(r, i){ r._rk_slp = i + 1; });
        // FFCalc = real redraft ADP (lower = drafted earlier) → clean rank. Reference column.
        universe.forEach(function(r){ r._rk_ffc = null; });
        universe.filter(function(r){ return r.ffcAdp != null; })
          .sort(function(a, b){ return a.ffcAdp - b.ffcAdp; })
          .forEach(function(r, i){ r._rk_ffc = i + 1; });
      }
      // Overall consensus rank (clean 1..N) + positional rank + tiers per position.
      universe.slice().sort(function(a, b){ return (b._bv || 0) - (a._bv || 0); }).forEach(function(r, i){ r._ovr = i + 1; });
      var byPos = {}; universe.forEach(function(r){ (byPos[r.pos] = byPos[r.pos] || []).push(r); });
      Object.keys(byPos).forEach(function(pos){
        var arr = byPos[pos].sort(function(a, b){ return (b._bv || 0) - (a._bv || 0); });
        arr.forEach(function(r, i){ r._posRank = i + 1; });
        adpAssignTiers(arr);
      });
      // Filter to the view + team/FA + search, then sort for display. The ranking
      // above is over the FULL universe, so a player keeps their overall # / tier
      // even when filtered to a roster.
      var rows = universe.slice();
      if (!isIdpView && adp.pos !== "ALL") rows = rows.filter(function(r){ return r.pos === adp.pos; });
      if (adp.team && adp.team !== "__ALL__") {
        rows = rows.filter(function(r){
          var fid = pidToFid[String(r.pid)] || null;
          if (adp.team === "__ROSTERED__") return fid != null;
          if (adp.team === "FA") return fid == null;
          return fid === adp.team;
        });
      }
      var q = adp.q.trim().toLowerCase();
      if (q) rows = rows.filter(function(r){ return ((r.name || "") + " " + (r.team || "") + " " + (r.pos || "")).toLowerCase().indexOf(q) >= 0; });
      rows.sort(function(a, b){
        if (adp.sort === "name") { var na = (a.name || "").toLowerCase(), nb = (b.name || "").toLowerCase(); return (na < nb ? -1 : na > nb ? 1 : 0) * adp.dir; }
        var va = a[adp.sort] == null ? (adp.dir > 0 ? Infinity : -Infinity) : a[adp.sort];
        var vb = b[adp.sort] == null ? (adp.dir > 0 ? Infinity : -Infinity) : b[adp.sort];
        return (va - vb) * adp.dir;
      });
      function arrow(k){ return adp.sort === k ? (adp.dir > 0 ? " ▲" : " ▼") : ""; }
      function tierPill(t){ if (t == null) return "—"; var cls = t <= 1 ? "adp-t1" : t <= 2 ? "adp-t2" : t <= 3 ? "adp-t3" : "adp-tn"; return '<span class="adp-tier ' + cls + '">T' + t + '</span>'; }
      var nSrc = ADP_SRC.filter(function(p){ return adp.srcSel[p[0]]; }).length;
      var fetched = relTime(adp.generatedAt);
      var sub = isIdpView
        ? ('IDP — FantasyPros dynasty ECR · ranks + tiers · ' + rows.length + ' players · click a header to sort')
        : ('Superflex · ' + (rdP === 0 ? "Dynasty" : rdP === 100 ? "Redraft" : (rdP + "% redraft / " + (100 - rdP) + "% dynasty")) + ' · normalized ranks across ' + nSrc + ' source' + (nSrc === 1 ? "" : "s") + ' · FFC = real redraft ADP · tiers from value gaps · ' + rows.length + ' players' + (fetched ? ' · sources fetched ' + fetched : ''));
      var html = '<div class="fpa-sub">' + esc(sub) + '</div>' +
        '<div class="asw-table-wrap"><table class="fpa-table"><thead><tr>' +
        '<th class="num" data-k="ovr" title="Overall consensus rank in your league (Superflex)">#' + arrow("ovr") + '</th>' +
        '<th class="team" data-k="name">Player' + arrow("name") + '</th>' +
        '<th class="num" data-k="_posRank" title="Positional rank (e.g. QB1, RB8) — click to sort">Pos' + arrow("_posRank") + '</th><th class="num">Tm</th>' +
        '<th class="num" data-k="age">Age' + arrow("age") + '</th>' +
        '<th class="num" data-k="_tier" title="Tier within position — from value gaps (a cliff in value starts a new tier)">Tier' + arrow("_tier") + '</th>';
      if (isIdpView) {
        html += '<th class="num" data-k="fpEcr" title="FantasyPros dynasty IDP expert consensus rank">ECR' + arrow("fpEcr") + '</th>';
      } else {
        html += '<th class="num" data-k="_rk_fc" title="FantasyCalc overall rank (this skew)">FC' + arrow("_rk_fc") + '</th>' +
          '<th class="num" data-k="_rk_ktc" title="KeepTradeCut overall rank (this skew)">KTC' + arrow("_rk_ktc") + '</th>' +
          '<th class="num" data-k="_rk_dp" title="DynastyProcess overall rank (dynasty)">DP' + arrow("_rk_dp") + '</th>' +
          '<th class="num" data-k="_rk_slp" title="Sleeper overall popularity rank (clean 1..N)">Slp' + arrow("_rk_slp") + '</th>' +
          '<th class="num" data-k="_rk_ffc" title="FantasyFootballCalculator — REAL redraft average draft position (rank; reference)">FFC' + arrow("_rk_ffc") + '</th>';
      }
      html += '</tr></thead><tbody>';
      var ncols = isIdpView ? 7 : 10;
      if (!rows.length) html += '<tr><td class="team">—</td><td colspan="' + ncols + '" class="num" style="color:var(--muted)">No players.</td></tr>';
      rows.forEach(function(r){
        html += '<tr>' +
          '<td class="num"><b>' + (r._ovr != null ? r._ovr : "—") + '</b></td>' +
          '<td class="team">' + esc(r.name) + '</td>' +
          '<td class="num">' + esc(r.pos) + (r._posRank != null ? r._posRank : "") + '</td>' +
          '<td class="num">' + esc(r.team || "—") + '</td>' +
          '<td class="num">' + (r.age != null ? r.age : "—") + '</td>' +
          '<td class="num">' + tierPill(r._tier) + '</td>';
        if (isIdpView) {
          html += '<td class="num">' + (r.fpEcr != null ? ("#" + r.fpEcr) : "—") + '</td>';
        } else {
          html += '<td class="num">' + (r._rk_fc != null ? r._rk_fc : "—") + '</td>' +
            '<td class="num">' + (r._rk_ktc != null ? r._rk_ktc : "—") + '</td>' +
            '<td class="num">' + (r._rk_dp != null ? r._rk_dp : "—") + '</td>' +
            '<td class="num">' + (r._rk_slp != null ? r._rk_slp : "—") + '</td>' +
            '<td class="num">' + (r._rk_ffc != null ? r._rk_ffc : "—") + '</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>' + adpFreshnessFooter();
      adpBody().innerHTML = html;
      adpSection.querySelectorAll(".fpa-table th[data-k]").forEach(function(th){
        th.addEventListener("click", function(){ var k = th.getAttribute("data-k"); if (adp.sort === k) adp.dir = -adp.dir; else { adp.sort = k; adp.dir = 1; } adpPaint(); });

      ysel.addEventListener("change", function(){ sched.season = ysel.value; schedLoad(); });
      schedSection.querySelectorAll(".sched-pos [data-spos]").forEach(function(b){ b.addEventListener("click", function(){ sched.pos = b.getAttribute("data-spos"); schedSection.querySelectorAll(".sched-pos [data-spos]").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); schedLoad(); }); });
      schedSection.querySelectorAll(".sched-view [data-sview]").forEach(function(b){ b.addEventListener("click", function(){ sched.view = b.getAttribute("data-sview"); schedSection.querySelectorAll(".sched-view [data-sview]").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); schedPaint(); }); });
    }
    function schedCellColor(ratio){
      if (ratio == null) return "background:var(--panel-alt);color:var(--muted)";
      var t = Math.max(0, Math.min(1, (ratio - 0.8) / 0.4));   // 0 = tough (red) → 1 = easy (green)
      return "background:hsl(" + Math.round(t * 120) + ",55%,36%);color:#fff";
    }
    function schedPaint(){
      var d = sched.data || {}, teams = (d.teams || []).slice();
      var aggKey = sched.view === "playoffs" ? "playoffAvg" : "seasonAvg";
      teams.sort(function(a, b){ return (b[aggKey] || 0) - (a[aggKey] || 0); });
      var posLbl = (SCHED_POS.filter(function(p){ return p[0] === (d.pos || sched.pos); })[0] || ["", sched.pos])[1];
      var sub = posLbl + " strength of schedule · " + (d.season || sched.season) +
        (d.projected ? " (projected — using " + d.ratingSeason + " defense ratings)" : "") +
        " · green = faces generous defenses (easy), red = tough · sorted easiest-first by " +
        (sched.view === "playoffs" ? "playoff (Wk 15–17)" : "season") + " avg";
      var wkCols = []; for (var w = 1; w <= 18; w++) wkCols.push(w);
      var html = '<div class="fpa-sub">' + esc(sub) + '</div>' +
        '<div class="asw-table-wrap"><table class="fpa-table sched-grid"><thead><tr>' +
        '<th class="num">#</th><th class="team">Team</th>' +
        wkCols.map(function(w){ return '<th class="num">' + (w >= 15 && w <= 17 ? '<span style="color:var(--accent)">' + w + '</span>' : w) + '</th>'; }).join("") +
        '<th class="num">Avg</th></tr></thead><tbody>';
      if (!teams.length) html += '<tr><td colspan="21" class="num" style="color:var(--muted)">No schedule data.</td></tr>';
      teams.forEach(function(t, i){
        var byWk = {}; (t.weeks || []).forEach(function(w){ byWk[w.wk] = w; });
        html += '<tr><td class="num">' + (i + 1) + '</td><td class="team">' + esc(t.team) + '</td>' +
          wkCols.map(function(w){ var c = byWk[w]; if (!c || c.opp == null) return '<td class="num sched-cell" style="background:var(--panel-alt);color:var(--muted)">—</td>'; return '<td class="num sched-cell" style="' + schedCellColor(c.ratio) + '" title="vs ' + esc(c.opp) + ' · matchup ' + (c.ratio != null ? c.ratio : "—") + ' (D rank ' + (c.rank || "—") + ' of 32)">' + esc(c.opp) + '</td>'; }).join("") +
          '<td class="num" style="' + schedCellColor(t[aggKey]) + '"><b>' + (t[aggKey] != null ? t[aggKey] : "—") + '</b></td></tr>';
      });
      html += '</tbody></table></div>';
      schedBody().innerHTML = html;
      notifyResize();
    }

    var sections = { "player-stats": psSection, "fpa": host, "adp": adpSection, "vegas": vegasSection, "pace": paceSection, "schedule": schedSection };
    viewTabs.querySelectorAll(".asw-viewtab").forEach(function(btn){
      btn.addEventListener("click", function(){
        var v = btn.getAttribute("data-view");
        viewTabs.querySelectorAll(".asw-viewtab").forEach(function(x){ x.setAttribute("aria-selected", x === btn ? "true" : "false"); });
        Object.keys(sections).forEach(function(k){ if (sections[k]) sections[k].hidden = (k !== v); });
        setPageHead(v);   // masthead names the board you're actually on
        if (v === "fpa" && !fpa.rendered) { fpa.rendered = true; renderShell(); load(); }
        if (v === "adp" && !adp.rendered) { adp.rendered = true; adpRenderShell(); adpLoad(); }
        if (v === "vegas" && !vegas.rendered) { vegas.rendered = true; vegasLoad(); }
        if (v === "pace" && !pace.rendered) { pace.rendered = true; paceLoad(); }
        if (v === "schedule" && !sched.rendered) { sched.rendered = true; schedRenderShell(); schedLoad(); }
        setTimeout(notifyResize, 80);
      });
    });
  })();
})();
</script>
</body>
</html>
