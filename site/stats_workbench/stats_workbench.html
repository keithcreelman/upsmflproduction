<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPS Advanced Stats Workbench</title>
<!-- Absolute URLs: this page is injected as an iframe srcdoc (no base URL), so
     relative asset paths do not resolve. Same reason the profile script at the
     bottom is absolute. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap">
<style>
/* ── Design tokens ────────────────────────────────────────────────────────
   DARK is the default (matches the rest of the UPS app); [data-theme="light"]
   on <html> swaps the ground for the editorial light treatment. Everything
   downstream reads these vars — never a raw hex — so one flip restyles the
   whole page. --accent stays #6aa8ff in dark because JS-generated SVG
   (scatter, sparklines, drawer charts) inherits it. */
:root{
  --bg:#0b0f17; --panel:#121826; --panel-alt:#192130;
  --border:rgba(232,239,250,.11); --border-strong:rgba(232,239,250,.22);
  --text:#e8effa; --muted:#8fa0bc; --accent:#6aa8ff;
  --ok:#5bd9a2; --warn:#f0c465; --err:#ff7b7b; --smash:#73e68c; --hit:#7cb3ff;
  --contrib:#a8a8a8; --bust:#e07a7a;
  --row-hover:rgba(106,168,255,.07);
  /* Heat quintiles — token-driven so light mode can re-author them (they were
     hardcoded rgba/hex before, which made a light theme impossible). */
  --heat-1-bg:rgba(224,80,80,.34);  --heat-1-fg:#ffc9c9;
  --heat-2-bg:rgba(224,80,80,.15);  --heat-2-fg:#ffd9d9;
  --heat-3-bg:rgba(160,160,180,.08);--heat-3-fg:var(--muted);
  --heat-4-bg:rgba(90,220,130,.15); --heat-4-fg:#b8ffcf;
  --heat-5-bg:rgba(90,220,130,.34); --heat-5-fg:#c4ffd6;
  --font-ui:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:"Big Shoulders Display","Inter Tight",Impact,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#fff; --panel:#fff; --panel-alt:#f6f7f9;
  --border:rgba(14,17,24,.11); --border-strong:rgba(14,17,24,.2);
  --text:#0e1118; --muted:rgba(14,17,24,.55); --accent:#1d4ed8;
  --ok:#0f8a5f; --warn:#a86a00; --err:#c02626; --smash:#0f8a5f; --hit:#1d4ed8;
  --contrib:#6b7280; --bust:#c02626;
  --row-hover:rgba(29,78,216,.05);
  --heat-1-bg:rgba(192,38,38,.16);  --heat-1-fg:#8c1a1a;
  --heat-2-bg:rgba(192,38,38,.07);  --heat-2-fg:#a33;
  --heat-3-bg:transparent;          --heat-3-fg:var(--muted);
  --heat-4-bg:rgba(15,138,95,.09);  --heat-4-fg:#0b6b49;
  --heat-5-bg:rgba(15,138,95,.2);   --heat-5-fg:#08543a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--font-ui)}
h1{margin:0 0 8px;font-size:18px;letter-spacing:.02em}
.asw-shell{max-width:1400px;margin:0 auto;padding:12px}
.asw-version{font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:1px 6px;vertical-align:middle;margin-left:6px;letter-spacing:.03em}
.asw-subtitle{color:var(--muted);font-size:11px;margin-bottom:12px}
/* Responsive (B7) — the page embeds in an iframe that can be tablet/large-phone
   width. Tighten chrome + let the drawer go full-width so it's usable narrow. */
@media (max-width:820px){
  .asw-shell{padding:8px}
  h1{font-size:16px}
  .asw-drawer{width:100vw}
  .asw-tabs{padding:8px}
  .asw-tab{padding:5px 9px}
}
@media (max-width:560px){
  .asw-drawer-head h2{font-size:14px}
  .asw-table th,.asw-table td{padding:4px 6px}
}

/* Primary position tabs — grouped by phase (Offense / Defense / Special) */
.asw-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.asw-tabs-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-right:4px;padding-left:6px}
.asw-tabs-label:first-child{padding-left:0}
.asw-tab{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:.1s}
.asw-tab:hover{border-color:var(--border-strong)}
.asw-tab[aria-pressed="true"]{background:var(--accent);color:#0a1222;border-color:var(--accent)}
.asw-tabs-sep{width:1px;height:18px;background:var(--border);margin:0 4px}

/* Sub-position chips — inline inside the active DL / DB tab button */
.asw-tab .asw-subtab-group{display:none;gap:3px;margin-left:8px;padding-left:8px;border-left:1px solid rgba(255,255,255,.22)}
.asw-tab[aria-pressed="true"] .asw-subtab-group{display:inline-flex;align-items:center}
.asw-subtab{background:rgba(10,18,34,.28);color:inherit;border:1px solid rgba(10,18,34,.3);border-radius:999px;padding:1px 8px;font-size:10px;cursor:pointer;font-weight:600;line-height:1.5}
.asw-subtab:hover{background:rgba(10,18,34,.4)}
.asw-subtab[aria-pressed="true"]{background:#0a1222;color:#f0f8ff;border-color:#0a1222}

/* Filter controls row */
.asw-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;position:relative}
.asw-controls label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.asw-controls select,.asw-controls input{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px;min-width:100px}
.asw-controls input[type="text"]{min-width:160px}
.asw-controls .asw-chip{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;transition:.1s}
.asw-controls .asw-chip[aria-pressed="true"]{background:var(--accent);color:#0a1222;border-color:var(--accent);font-weight:700}

/* Phase C — collapsed filter summary pill + expandable detail panel.
   Swaps in when the controls row is collapsed; expanded restores the
   full inline controls. */
.asw-filters-pill{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.1s;max-width:100%}
.asw-filters-pill:hover{border-color:var(--border-strong)}
.asw-filters-pill .sep{opacity:.4;margin:0 2px}
.asw-filters-pill .summary{color:var(--muted);font-weight:500}
.asw-filters-pill .chev{font-size:9px;opacity:.7}
.asw-controls.collapsed > :not(.asw-filters-pill):not(#asw-filters-pill){display:none}
.asw-controls.expanded > .asw-filters-pill{display:none}

/* Column group controls bar — now a single "Columns" dropdown pill
   + utility toggles (Filters/Heat/CSV) on the right. Replaces the
   7-chip row that wrapped on narrower screens. */
.asw-cols-bar{display:flex;gap:8px;align-items:center;background:var(--panel);padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;position:relative}
.asw-cols-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-right:4px}

/* "Columns · N active" pill — the popover trigger */
.asw-cols-trigger{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.1s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asw-cols-trigger:hover{border-color:var(--border-strong)}
.asw-cols-trigger.is-customized{background:var(--accent);color:#0a1222;border-color:var(--accent)}
.asw-cols-trigger .chev{font-size:9px;opacity:.7}

/* Popover panel */
.asw-cols-popover{position:absolute;top:calc(100% + 4px);left:12px;z-index:35;background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:12px 0;min-width:260px;max-width:320px;max-height:70vh;overflow-y:auto;display:none}
.asw-cols-popover.open{display:block}
.asw-cols-popover h4{margin:0 12px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.asw-cols-popover .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;padding:8px 12px 2px}
.asw-cols-popover .section-label:first-of-type{padding-top:0}
.asw-cols-popover label.group-item{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:12px;cursor:pointer;user-select:none}
.asw-cols-popover label.group-item:hover{background:var(--panel-alt)}
.asw-cols-popover label.group-item input{accent-color:var(--accent);cursor:pointer}
.asw-cols-popover hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.asw-cols-popover .footer{padding:8px 12px 0;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--border);margin-top:6px}
.asw-cols-popover .reset-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;font-size:11px;border-radius:4px;cursor:pointer}
.asw-cols-popover .reset-btn:hover{color:var(--text);border-color:var(--border-strong)}
.asw-cols-popover .done-btn{background:var(--accent);color:#0a1222;border:0;padding:4px 14px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer}
.asw-cols-spacer{flex:1}
.asw-filter-toggle{background:var(--panel-alt);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:600}
.asw-filter-toggle:hover{border-color:var(--border-strong);color:var(--text)}
.asw-filter-toggle[aria-pressed="true"]{background:var(--accent);color:#0a1222;border-color:var(--accent)}
.asw-filter-clear{background:transparent;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer}
.asw-filter-clear:hover{background:rgba(240,196,101,.08)}

/* Filter row (third thead row with inline inputs under column headers) */
.asw-table tr.asw-filter-row th{position:sticky;background:var(--panel-alt);padding:2px 4px;border-bottom:1px solid var(--border-strong);cursor:default}
.asw-table tr.asw-filter-row th.group-sep{border-left:1px solid var(--border-strong)}
.asw-table tr.asw-filter-row input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:2px 5px;font-size:11px;width:100%;min-width:55px;font-family:inherit}
.asw-table tr.asw-filter-row input:focus{border-color:var(--accent);outline:none}
.asw-table tr.asw-filter-row input.active{border-color:var(--accent);background:rgba(106,168,255,.08);color:var(--accent)}
.asw-table tr.asw-filter-row input.invalid{border-color:var(--err);color:var(--err)}
.asw-table tr.asw-filter-row input.num-filter{text-align:right;font-variant-numeric:tabular-nums}
/* Column-header active-filter indicator */
.asw-table tr.asw-col-row th.has-filter::before{content:"•";color:var(--accent);margin-right:3px}

/* Percentile heat-map cell shading (quintiles: q1 worst → q5 best).
   Bumped 2026-04-24: prior opacities (.07/.16) were nearly invisible
   on dark bg. Stronger colors + bold + colored text on the extremes
   so the eye catches top/bottom 20% at a glance. */
.asw-table.heat td.pct-q1{background:var(--heat-1-bg);color:var(--heat-1-fg);font-weight:700}
.asw-table.heat td.pct-q2{background:var(--heat-2-bg);color:var(--heat-2-fg)}
.asw-table.heat td.pct-q3{background:var(--heat-3-bg);color:var(--heat-3-fg)}
.asw-table.heat td.pct-q4{background:var(--heat-4-bg);color:var(--heat-4-fg)}
.asw-table.heat td.pct-q5{background:var(--heat-5-bg);color:var(--heat-5-fg);font-weight:700}

/* Comparison mode — row checkbox column + sticky compare bar */
.asw-table th.sel-col,.asw-table td.sel-col{padding:4px 6px;text-align:center;width:28px;background:var(--panel-alt)}
.asw-table td.sel-col{background:inherit}
.asw-compare-check{width:14px;height:14px;cursor:pointer;accent-color:var(--accent)}
.asw-compare-bar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--accent) 0%,#4a82d4 100%);color:#0a1222;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:8px;margin-bottom:8px;font-weight:600;box-shadow:0 4px 14px rgba(106,168,255,.25);animation:asw-compare-in .18s ease-out}
@keyframes asw-compare-in{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}
.asw-compare-bar-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.asw-compare-chip{background:rgba(10,18,34,.2);border:1px solid rgba(10,18,34,.25);color:#0a1222;padding:3px 4px 3px 10px;border-radius:999px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.asw-compare-chip button{background:transparent;border:0;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 6px;border-radius:999px}
.asw-compare-chip button:hover{background:rgba(10,18,34,.18)}
.asw-compare-primary{margin-left:auto;background:#0a1222;color:#f0f8ff;border:1px solid #1a2a45;padding:6px 16px;font-weight:800;border-radius:6px;cursor:pointer;font-size:12px;letter-spacing:.02em}
.asw-compare-primary:hover{background:#13213a;border-color:var(--accent)}
.asw-compare-primary:disabled{opacity:.5;cursor:not-allowed}
.asw-compare-clear{background:transparent;border:0;color:#0a1222;cursor:pointer;font-size:11px;text-decoration:underline;padding:0 6px;opacity:.85;font-weight:700}
.asw-compare-clear:hover{opacity:1}

/* Comparison drawer — side-by-side table */
.asw-compare-table{width:100%;border-collapse:collapse;font-size:12px}
.asw-compare-table th,.asw-compare-table td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.asw-compare-table thead th{background:var(--panel-alt);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;position:sticky;top:0}
.asw-compare-table thead th.player{color:var(--text);text-align:right;font-size:12px;text-transform:none;letter-spacing:0}
.asw-compare-table thead th.player .sub{display:block;color:var(--muted);font-size:10px;font-weight:500}
.asw-compare-table td.metric{color:var(--muted);font-weight:600;background:var(--panel);position:sticky;left:0;z-index:1}
.asw-compare-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.asw-compare-table td.best{background:rgba(115,230,140,.14);font-weight:700;color:#b5ffcc}
.asw-compare-table td.worst{background:rgba(224,122,122,.10);color:#ffb9b9}
.asw-compare-section-row td{background:var(--panel);color:var(--accent);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border-strong)}

.asw-meta{color:var(--muted);font-size:11px;margin-bottom:6px}
/* Top horizontal scrollbar — a thin overflow strip whose inner spacer is sized
   to the table width; its scrollLeft is two-way-synced with the table wrap. */
.asw-topscroll{overflow-x:auto;overflow-y:hidden;height:14px;background:var(--panel);border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0}
#asw-topscroll-spacer{height:1px}
/* Bounded scroll region so the sticky header + top scrollbar stay put while the
   body scrolls (works inside the auto-height iframe embed, not just standalone). */
.asw-table-wrap{overflow:auto;max-height:680px;background:var(--panel);border:1px solid var(--border);border-top:0;border-radius:0 0 8px 8px}
/* Main leaderboard only: hide the wrap's OWN horizontal scrollbar so the single
   top bar is the only horizontal scroller (it drives wrap.scrollLeft — overflow-x
   hidden still scrolls programmatically). Vertical scroll stays. The shared
   .asw-table-wrap class keeps its native scrollbars for the drawer/FPA tables. */
#asw-table-wrap{overflow-x:hidden}
/* Phase E (2026-04-24): bump table to 13px + a touch more row padding.
   12px was dense enough that long sessions strained; 13px reads clean
   without forcing horizontal scroll on reasonable screens. */
table.asw-table{width:100%;border-collapse:collapse;font-size:13px}
.asw-table th,.asw-table td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
/* Group header row */
.asw-table tr.asw-group-row th{position:sticky;top:0;background:var(--panel);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:10px;padding:4px 8px;border-bottom:1px solid var(--border-strong);text-align:center;cursor:default}
.asw-table tr.asw-group-row th.no-group{color:transparent;border-bottom-color:var(--border)}
.asw-table tr.asw-group-row th.group-sep{border-left:1px solid var(--border-strong)}
/* Column header row */
.asw-table tr.asw-col-row th{position:sticky;top:0;background:var(--panel-alt);color:var(--muted);font-weight:600;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
/* When Heat is on, the group-header row renders above the column row, so push
   the (sticky) column row down by the group-row height. */
.asw-table.heat tr.asw-col-row th{top:21px}
.asw-table tr.asw-col-row th.group-sep{border-left:1px solid var(--border-strong)}
.asw-table th.num,.asw-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.asw-table th[aria-sort="ascending"]::after{content:" ▲";color:var(--accent)}
.asw-table th[aria-sort="descending"]::after{content:" ▼";color:var(--accent)}
.asw-table td.group-sep{border-left:1px solid var(--border-strong)}
.asw-table tbody tr:hover{background:rgba(106,168,255,.06)}
.asw-table td.name{font-weight:600}
.asw-table td.dim{color:var(--muted)}
.asw-empty{padding:40px;text-align:center;color:var(--muted)}
.asw-loading{padding:20px;text-align:center;color:var(--muted);font-style:italic}
.asw-err{padding:12px;color:var(--err);border:1px solid var(--err);border-radius:4px;background:rgba(255,123,123,.05);margin-bottom:8px}

/* Row click → drill-down */
.asw-table tbody tr{cursor:pointer}
.asw-table tbody tr.is-active{background:rgba(106,168,255,.14) !important;box-shadow:inset 3px 0 0 var(--accent)}

/* Slide-in drawer for per-week drill-down */
.asw-drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40}
.asw-drawer-scrim.open{opacity:1;pointer-events:auto}
.asw-drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,92vw);background:var(--bg);border-left:1px solid var(--border-strong);box-shadow:-8px 0 30px rgba(0,0,0,.45);transform:translateX(100%);transition:transform .22s ease;z-index:41;display:flex;flex-direction:column;overflow:hidden}
.asw-drawer.open{transform:translateX(0)}
.asw-drawer-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.asw-drawer-head h2{margin:0;font-size:15px;letter-spacing:.01em}
.asw-drawer-head .asw-drawer-sub{color:var(--muted);font-size:11px;margin-left:8px}
.asw-drawer-head .asw-drawer-close{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:6px;font-size:16px;cursor:pointer}
.asw-drawer-head .asw-drawer-close:hover{background:var(--panel-alt);border-color:var(--border-strong)}
.asw-drawer-body{flex:1;overflow:auto;padding:12px 14px}
.asw-drawer-section{margin-bottom:14px}
.asw-drawer-section h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.asw-chart{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px}
.asw-chart svg{display:block;width:100%;height:auto}
.asw-chart-title{font-size:11px;color:var(--muted);margin-bottom:4px}
.asw-chart line.grid{stroke:var(--border);stroke-width:.5}
.asw-chart line.zero{stroke:var(--border-strong);stroke-width:.8}
.asw-chart path.line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.asw-chart circle.pt{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.asw-chart text.axis{fill:var(--muted);font-size:9px;font-family:-apple-system,sans-serif}
.asw-chart text.label{fill:var(--text);font-size:10px;font-family:-apple-system,sans-serif;font-weight:600}
.asw-week-table{font-size:11px}
.asw-week-table th.week-col,.asw-week-table td.week-col{position:sticky;left:0;background:var(--panel-alt);z-index:2;font-weight:700}
.asw-week-table tbody tr{cursor:default}
.asw-drawer-sub-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.asw-week-chip{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;user-select:none}
.asw-week-chip[aria-pressed="true"]{background:var(--accent);color:#0a1222;border-color:var(--accent);font-weight:700}

/* Stats page-level sub-tabs (Player Stats / Fantasy Points Against) */
.asw-viewtabs{display:flex;gap:6px;margin-bottom:12px}
.asw-viewtab{background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.1s;letter-spacing:.01em}
.asw-viewtab:hover{border-color:var(--border-strong);color:var(--text)}
.asw-viewtab[aria-selected="true"]{background:var(--accent);color:#0a1222;border-color:var(--accent)}
/* Fantasy Points Against view */
.fpa-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--panel);padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
.fpa-controls label{display:flex;flex-direction:column;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.fpa-controls select{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-size:13px}
.fpa-pos{display:flex;flex-wrap:wrap;gap:5px}
.fpa-pos button{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.fpa-pos button[aria-pressed="true"]{background:var(--accent);color:#0a1222;border-color:var(--accent)}
.fpa-sub{color:var(--muted);font-size:11px;margin:2px 0 10px}
table.fpa-table{width:100%;border-collapse:collapse;font-size:13px}
.fpa-table th,.fpa-table td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right}
.fpa-table th{background:var(--panel-alt);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;position:sticky;top:0;cursor:pointer;user-select:none}
.fpa-table th.team,.fpa-table td.team{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:700}
.fpa-table td.num{font-variant-numeric:tabular-nums}
.sched-grid th,.sched-grid td{padding:4px 6px;font-size:11px;text-align:center;border-bottom:1px solid var(--border)}
.sched-grid td.team,.sched-grid th.team{text-align:left}
.sched-grid td.sched-cell{font-weight:700;min-width:34px;border-radius:3px}
.fpa-rk{display:inline-block;min-width:32px;text-align:center;padding:2px 7px;border-radius:5px;font-weight:800;font-variant-numeric:tabular-nums}
.fpa-rk.easy{background:rgba(91,217,162,.16);color:#8ff0c4}
.fpa-rk.tough{background:rgba(224,122,122,.14);color:#ffb1b1}
.fpa-rk.mid{background:var(--panel-alt);color:var(--text)}
.asw-trend{font-weight:700;font-variant-numeric:tabular-nums}
.asw-trend.up{color:var(--ok)}
.asw-trend.dn{color:var(--err)}
.fpa-team-row{cursor:pointer}
.fpa-team-row:hover{background:var(--panel-alt)}
.fpa-week-row{cursor:pointer}
.fpa-week-row:hover{background:var(--panel-alt)}
.adp-srcs{display:flex;gap:10px;flex-wrap:wrap}
.adp-srctog{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap}
.adp-srctog input{accent-color:var(--accent);cursor:pointer}
.adp-slider{accent-color:var(--accent);cursor:pointer}
.adp-tier{display:inline-block;min-width:22px;padding:1px 6px;border-radius:4px;font-weight:800;font-size:11px;line-height:1.5}
.adp-t1{background:var(--accent);color:#0a1222}
.adp-t2{background:rgba(91,141,255,.55);color:#0a1222}
.adp-t3{background:rgba(91,141,255,.28);color:var(--text)}
.adp-tn{background:var(--panel-alt);color:var(--muted)}
.fpa-back{color:var(--accent);text-decoration:none;font-weight:700}
.fpa-back:hover{text-decoration:underline}

/* ══════════════════════════════════════════════════════════════════════════
   EDITORIAL LAYER (2026-08-05) — restyles the chrome on top of the structural
   rules above. Deliberately appended rather than rewriting them: every class
   name, sticky offset and measured width the JS depends on stays intact, so
   this is a skin, not a rebuild.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Page masthead: eyebrow → display title → standfirst ─────────────────── */
.asw-shell{max-width:1580px;padding:0 28px 72px}
.asw-pagehead{padding:26px 0 0;margin-bottom:14px}
.asw-pagehead-top{display:flex;align-items:flex-start;gap:16px}
.asw-eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.asw-pagehead h1{
  font-family:var(--font-display);font-size:clamp(34px,4.6vw,54px);font-weight:800;
  line-height:.96;letter-spacing:.01em;text-transform:uppercase;margin:6px 0 0;color:var(--text);
}
.asw-standfirst{color:var(--muted);font-size:13px;line-height:1.55;max-width:74ch;margin:10px 0 0}
.asw-head-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.asw-theme-btn{
  background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:999px;
  width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;line-height:1;transition:.12s;
}
.asw-theme-btn:hover{color:var(--text);border-color:var(--border-strong)}

/* ── View tabs → underline rail ─────────────────────────────────────────── */
.asw-viewtabs{
  display:flex;flex-wrap:wrap;gap:0;background:none;border:0;border-bottom:1px solid var(--border);
  border-radius:0;padding:0;margin:0 0 16px;
}
.asw-viewtab{
  background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);font-family:var(--font-ui);font-size:11px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;padding:11px 16px 9px;cursor:pointer;
  transition:.12s;margin-bottom:-1px;
}
.asw-viewtab:first-child{padding-left:0}
.asw-viewtab:hover{color:var(--text)}
.asw-viewtab[aria-selected="true"]{background:none;color:var(--text);border-bottom-color:var(--accent);font-weight:700}

/* ── Position tabs → quiet rail, accent underline on the active one ─────── */
.asw-tabs{background:none;border:0;border-radius:0;padding:0;gap:2px;margin-bottom:14px;
  border-bottom:1px solid var(--border);align-items:stretch}
.asw-tabs-label{font-size:9px;letter-spacing:.16em;align-self:center;padding:0 8px 0 0}
.asw-tabs-label:not(:first-child){padding-left:14px}
.asw-tab{
  background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);font-family:var(--font-ui);font-size:12px;font-weight:600;
  letter-spacing:.04em;padding:9px 12px 8px;margin-bottom:-1px;transition:.12s;
}
.asw-tab:hover{border-color:transparent;color:var(--text)}
.asw-tab[aria-pressed="true"]{background:none;color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.asw-tabs-sep{display:none}
.asw-tab .asw-subtab-group{border-left-color:var(--border-strong)}
.asw-subtab{background:var(--panel-alt);color:var(--muted);border-color:var(--border)}
.asw-subtab:hover{background:var(--panel-alt);color:var(--text)}
.asw-subtab[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* ── Filter + columns bars → flat, airy, hairline-ruled ─────────────────── */
.asw-controls,.asw-cols-bar{background:none;border:0;border-radius:0;padding:0 0 12px;margin-bottom:12px;
  border-bottom:1px solid var(--border);gap:14px}
.asw-controls label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;gap:5px}
.asw-controls select,.asw-controls input{
  background:var(--panel-alt);border:1px solid var(--border);border-radius:7px;padding:7px 9px;
  font-family:var(--font-ui);font-size:12.5px;color:var(--text);
}
.asw-controls select:focus,.asw-controls input:focus{outline:none;border-color:var(--accent)}
.asw-cols-label,.asw-compare-bar-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
/* Compare bar — was a full-bleed saturated gradient that shouted over the
   whole page; make it a quiet panel with the accent carried by the button. */
.asw-compare-bar{background:var(--panel-alt);color:var(--text);border:1px solid var(--border);
  border-left:2px solid var(--accent);border-radius:0 8px 8px 0;box-shadow:none;font-weight:500}
.asw-compare-bar-label{color:var(--muted)}
.asw-compare-primary{background:var(--accent);color:var(--bg);border:0;font-weight:700}
.asw-compare-clear{color:var(--muted)}
/* Column-preset + action chips — pill rail rather than boxes. */
.asw-cols-bar .asw-chip,.asw-cols-bar button{border-radius:999px;font-size:11.5px}
.asw-filters-pill{border-radius:999px;font-size:11.5px}
.asw-meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;color:var(--muted);padding:0 0 8px}

/* ── The table ──────────────────────────────────────────────────────────── */
.asw-table-wrap{background:none;border:0;border-radius:0;max-height:none}
.asw-topscroll{border:0}
table.asw-table{font-size:13px}
.asw-table th,.asw-table td{padding:9px 12px;border-bottom:1px solid var(--border)}
/* Header rows: micro-caps labels, hairline rule, opaque + above the pinned
   body cells (the structural rules give sticky th no z-index — with pinned
   columns now carrying their own background, body cells would paint over the
   header without this). */
.asw-table tr.asw-col-row th{
  background:var(--bg);color:var(--muted);font-family:var(--font-ui);font-size:9.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border-strong);
  z-index:3;
}
.asw-table tr.asw-group-row th{background:var(--bg);letter-spacing:.14em;font-size:9px;z-index:3}
.asw-table tr.asw-col-row th:hover{color:var(--text)}
.asw-table tr.asw-col-row th[aria-sort]{color:var(--text)}
.asw-table th[aria-sort="ascending"]::after,.asw-table th[aria-sort="descending"]::after{font-size:8px}
.asw-table tr.asw-filter-row th{background:var(--bg);z-index:3}
/* Numerals: mono + tabular everywhere they line up in a column. */
.asw-table td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:-.01em}
.asw-table th.num{font-family:var(--font-ui)}
.asw-table td.name{font-weight:500;letter-spacing:.005em}
.asw-table tbody tr:hover td{background:var(--row-hover)}
.asw-table tbody tr:hover td.asw-pin{background:var(--panel-alt)}

/* Pinned left columns (Savant pattern): checkbox · rank · player stay put
   while every stat column scrolls under them. Widths are fixed because the
   `left` offsets have to be exact — .sel-col's 28px is the pre-existing one
   the structural rule already sets. */
.asw-table th.sel-col,.asw-table td.sel-col{position:sticky;left:0;width:28px;background:var(--bg)}
.asw-table th.rank-col,.asw-table td.rank-col{position:sticky;left:28px;width:40px;min-width:40px;
  text-align:right;background:var(--bg);font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.asw-table td.name{position:sticky;left:68px;width:196px;min-width:196px;background:var(--bg)}
.asw-table th.name-col{position:sticky;left:68px;width:196px;min-width:196px;background:var(--bg)}
/* Header cells that are pinned BOTH ways must outrank the scrolled header
   cells. The structural `tr.asw-col-row th` rule is (0,2,2) — a plain
   `.asw-table th.name-col` (0,2,1) loses to it, so the scrolled columns painted
   straight over "#" and "Player". Match the row in the selector to win. */
.asw-table tr.asw-col-row th.sel-col,
.asw-table tr.asw-col-row th.rank-col,
.asw-table tr.asw-col-row th.name-col,
.asw-table tr.asw-group-row th.sel-col,
.asw-table tr.asw-group-row th.rank-col,
.asw-table tr.asw-filter-row th.sel-col,
.asw-table tr.asw-filter-row th.rank-col{z-index:5}
.asw-table td.sel-col,.asw-table td.rank-col,.asw-table td.name{z-index:1}
/* The pinned block gets a hairline edge so it reads as a fixed rail. */
.asw-table tr.asw-col-row th.name-col,.asw-table td.name{box-shadow:1px 0 0 var(--border)}
.asw-table tbody tr.is-active td.sel-col,
.asw-table tbody tr.is-active td.rank-col,
.asw-table tbody tr.is-active td.name{background:var(--panel-alt) !important}

/* Dead-data flags — a column whose source is empty is labelled, not silently
   blank (Keith 2026-08-05: "flag anything where the data is missing"). */
.asw-table tr.asw-col-row th.col-nodata{color:var(--warn)}
.asw-table tr.asw-col-row th.col-nodata::before{content:"⚠ ";font-size:9px}
/* Not-applicable-for-this-position: quieter than broken — it's information, not a fault. */
.asw-table tr.asw-col-row th.col-na{opacity:.42}
/* :not([aria-sort]) so this never fights the sort-arrow ::after on the same th. */
.asw-table tr.asw-col-row th.col-na:not([aria-sort])::after{content:" ·n/a";font-size:8px;letter-spacing:.04em}
.asw-datanote{
  display:flex;gap:9px;align-items:flex-start;margin:0 0 12px;padding:9px 12px;
  border:1px solid var(--border);border-left:2px solid var(--warn);border-radius:0 7px 7px 0;
  background:var(--panel-alt);color:var(--muted);font-size:11.5px;line-height:1.5;
}
.asw-datanote b{color:var(--text);font-weight:600}
.asw-datanote code{font-family:var(--font-mono);font-size:11px;color:var(--warn)}

@media (max-width:820px){
  .asw-shell{padding:0 14px 56px}
  .asw-pagehead{padding-top:18px}
  .asw-table td.name,.asw-table th.name-col{width:150px;min-width:150px}
}
</style>
</head>
<body>
<div class="asw-shell">

<!-- Page masthead. Title + standfirst are driven per-view by VIEW_META so the
     heading always names the board you're actually looking at. -->
<header class="asw-pagehead">
  <div class="asw-pagehead-top">
    <div>
      <div class="asw-eyebrow">UPS · Advanced Stats</div>
      <h1 id="asw-page-title">Player Stats <span id="asw-version" class="asw-version" title="Module version"></span></h1>
    </div>
    <div class="asw-head-actions">
      <button type="button" class="asw-theme-btn" id="asw-theme-btn" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </div>
  <p class="asw-standfirst" id="asw-page-desc"></p>
</header>

<!-- Stats page sub-tabs: Player Stats (this workbench) vs Fantasy Points Against. -->
<div class="asw-viewtabs" id="asw-viewtabs" role="tablist" aria-label="Stats views">
  <button type="button" class="asw-viewtab" data-view="player-stats" aria-selected="true" role="tab">Player Stats</button>
  <button type="button" class="asw-viewtab" data-view="fpa" aria-selected="false" role="tab">Fantasy Points Against</button>
  <button type="button" class="asw-viewtab" data-view="adp" aria-selected="false" role="tab">ADP</button>
  <button type="button" class="asw-viewtab" data-view="vegas" aria-selected="false" role="tab">Vegas</button>
  <button type="button" class="asw-viewtab" data-view="pace" aria-selected="false" role="tab">Pace</button>
  <button type="button" class="asw-viewtab" data-view="schedule" aria-selected="false" role="tab">Schedule</button>
</div>

<section id="asw-view-player-stats">

<!-- Primary position tabs -->
<div class="asw-tabs" id="asw-tabs">
  <span class="asw-tabs-label">Offense</span>
  <button type="button" class="asw-tab" data-tab="qb" aria-pressed="true">QB</button>
  <button type="button" class="asw-tab" data-tab="rb">RB</button>
  <button type="button" class="asw-tab" data-tab="wr">WR</button>
  <button type="button" class="asw-tab" data-tab="te">TE</button>
  <button type="button" class="asw-tab" data-tab="flex_o">Flex·O</button>
  <span class="asw-tabs-sep"></span>
  <span class="asw-tabs-label">Defense</span>
  <button type="button" class="asw-tab" data-tab="dl">DL</button>
  <button type="button" class="asw-tab" data-tab="lb">LB</button>
  <button type="button" class="asw-tab" data-tab="db">DB</button>
  <button type="button" class="asw-tab" data-tab="flex_idp">Flex·IDP</button>
  <span class="asw-tabs-sep"></span>
  <span class="asw-tabs-label">Special</span>
  <button type="button" class="asw-tab" data-tab="pk">PK</button>
  <button type="button" class="asw-tab" data-tab="pn">PN</button>
</div>

<!-- Filter row — collapsed by default into a summary pill (Phase C).
     Click the pill to expand the full Seasons / Team / Scope / Search
     controls. Click away or hit "Hide" to collapse again. -->
<div class="asw-controls collapsed" id="asw-controls">
  <button type="button" class="asw-filters-pill" id="asw-filters-pill" title="Click to edit filters">
    <span>⚙ Filters</span>
    <span class="summary" id="asw-filters-summary"></span>
    <span class="chev">▾</span>
  </button>
  <label>Seasons
    <select id="asw-seasons" multiple size="4" style="min-width:110px; max-height:100px"></select>
    <span style="font-size:10px; color:var(--muted)">⌘/Ctrl multi-select</span>
  </label>
  <label>Team
    <select id="asw-team" multiple size="6" style="min-width:180px; max-height:140px">
      <option value="__ALL__" selected>All (league-wide)</option>
      <option value="__ROSTERED__">All (Rostered)</option>
      <option value="FA">Free Agents</option>
    </select>
    <span style="font-size:10px; color:var(--muted)">⌘/Ctrl multi-select · Franchises below</span>
  </label>
  <label>Scope
    <select id="asw-scope" style="min-width:180px">
      <option value="mfl_reg">MFL Reg (wks 1-14)</option>
      <option value="mfl_playoffs">MFL Playoffs (wks 15-17)</option>
      <option value="mfl_total" selected>MFL Total (wks 1-17)</option>
      <option value="full">Full + NFL Playoffs (1-22)</option>
      <option value="custom">Custom weeks…</option>
    </select>
  </label>
  <label id="asw-weeks-label" hidden>Weeks
    <div style="display:flex;gap:6px;align-items:center">
      <select id="asw-week-start" style="min-width:70px"></select>
      <span style="color:var(--muted);font-size:11px">to</span>
      <select id="asw-week-end"   style="min-width:70px"></select>
    </div>
  </label>
  <label>Search
    <input type="text" id="asw-search" placeholder="name, team, or position…">
  </label>
</div>

<!-- Column-group toggle chips + filter-row toggle -->
<div class="asw-cols-bar" id="asw-cols-bar">
  <span class="asw-cols-label">Columns</span>
  <!-- group chips injected by JS, then the filter toggle block appended -->
</div>

<!-- Known-empty-source warning for whatever columns are currently visible.
     Filled by renderDataNote(); hidden when every visible column has data. -->
<div id="asw-datanote-slot"></div>

<!-- Sticky compare bar — appears above the table when 1+ players selected -->
<div class="asw-compare-bar" id="asw-compare-bar" hidden>
  <span class="asw-compare-bar-label">Compare</span>
  <span id="asw-compare-chips" style="display:inline-flex;flex-wrap:wrap;gap:6px"></span>
  <button type="button" class="asw-compare-clear" id="asw-compare-clear">Clear</button>
  <button type="button" class="asw-compare-primary" id="asw-compare-go">Compare →</button>
</div>

<div class="asw-meta" id="asw-meta"></div>
<!-- Top horizontal scrollbar (B7/Keith 2026-06-20): scroll left↔right from the
     top instead of the bottom; stays put while the table body scrolls. Width of
     the inner spacer is synced to the table width after each render. -->
<div class="asw-topscroll" id="asw-topscroll"><div id="asw-topscroll-spacer"></div></div>
<div class="asw-table-wrap" id="asw-table-wrap"><div id="asw-body"></div></div>
</section>

<!-- Fantasy Points Against view — lazy-rendered on first switch by the FPA module below. -->
<section id="asw-view-fpa" hidden></section>

<!-- ADP / dynasty-value board — lazy-rendered on first switch. -->
<section id="asw-view-adp" hidden></section>

<!-- Vegas implied-points board — lazy-rendered on first switch. -->
<section id="asw-view-vegas" hidden></section>

<section id="asw-view-pace" hidden></section>

<section id="asw-view-schedule" hidden></section>
</div>

<!-- Drill-down drawer (slides in on row click) -->
<div class="asw-drawer-scrim" id="asw-drawer-scrim" hidden></div>
<aside class="asw-drawer" id="asw-drawer" aria-hidden="true">
  <div class="asw-drawer-head">
    <h2 id="asw-drawer-title">Player</h2>
    <span class="asw-drawer-sub" id="asw-drawer-sub"></span>
    <div id="asw-drawer-view-toggle" style="display:flex;gap:4px;margin-left:12px">
      <button type="button" class="asw-chip" data-view="weekly" aria-pressed="true"  title="Week-by-week within the selected season(s)">By Week</button>
      <button type="button" class="asw-chip" data-view="season" aria-pressed="false" title="Year-over-year: one row per season across ALL years this player has data">By Season</button>
    </div>
    <button type="button" class="asw-chip" id="asw-drawer-fullprofile" style="margin-left:auto" title="Open the full UPS player profile (Bio · Stats · Game Log · News)">Full profile ↗</button>
    <button type="button" class="asw-drawer-close" id="asw-drawer-close" aria-label="Close">×</button>
  </div>
  <div class="asw-drawer-body" id="asw-drawer-body"></div>
</aside>

<!-- Shared UPS player-profile modal. Absolute URL because this page is injected
     as an iframe srcdoc (no base URL for relative paths). Defines window.UPS_openPlayerProfile. -->
<script src="https://keithcreelman.github.io/upsmflproduction/shared/player_profile_master.js?v=2026.05.12.v1"></script>

<script>
(function(){
  "use strict";

  // ---------- Config ----------
  var API_BASE = (typeof window !== "undefined" && window.UPS_ASW_API_BASE) ||
                 "https://upsmflproduction.keith-creelman.workers.dev";
  var THIS_YEAR = new Date().getFullYear();

  // ---------- Theme (dark default, light opt-in, remembered) ----------
  var THEME_KEY = "asw.theme";
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
    var b = document.getElementById("asw-theme-btn");
    if (b) b.textContent = t === "light" ? "☾" : "☀";
  }
  (function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved === "light" ? "light" : "dark");
    document.addEventListener("click", function (e) {
      var btn = e.target && e.target.closest && e.target.closest("#asw-theme-btn");
      if (!btn) return;
      var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e2) {}
    });
  })();

  // ---------- Per-view masthead copy ----------
  var VIEW_META = {
    "player-stats": { title:"Player Stats", desc:'NFL on-field counts (nflverse) plus snap share and PFR advanced, joined to this league’s own MFL scoring. The position rail picks who’s listed; Columns picks what’s measured. Click any player for week-by-week and by-season trends, then “Full profile” for the full UPS card.' },
    "fpa":          { title:"Fantasy Points Against", desc:"How generous each NFL defense has been to every fantasy position — raw and schedule-adjusted. Click a team to see the week-by-week players who did the damage." },
    "adp":          { title:"ADP · Dynasty Value", desc:"Multi-source consensus draft position and dynasty trade value (FantasyCalc, KeepTradeCut, DynastyProcess, Sleeper), blended into one board with tiering." },
    "vegas":        { title:"Vegas Implied Points", desc:"Team totals implied by the live betting market — the cleanest public read on how many points a real offense is expected to score." },
    "pace":         { title:"Team Pace", desc:"Plays per game, seconds per snap, and pass rate by team — the volume side of opportunity, before any individual usage share is applied." },
    "schedule":     { title:"Strength of Schedule", desc:"Positional schedule difficulty by week, rated off last season’s defensive performance. Use it to time streamers and read a stretch run." }
  };
  function setPageHead(view) {
    var m = VIEW_META[view] || VIEW_META["player-stats"];
    var t = document.getElementById("asw-page-title");
    var d = document.getElementById("asw-page-desc");
    // Keep the version badge — it's a live node other code writes into.
    if (t) {
      var badge = document.getElementById("asw-version");
      t.textContent = m.title + " ";
      if (badge) t.appendChild(badge);
    }
    if (d) d.textContent = m.desc;
  }

  // ---------- Known-empty data sources ----------
  // Audited live against /api/advanced-stats-leaderboard on 2026-08-05: all
  // five position groups, season 2025, weeks 1-17 (the page's own default
  // query). Every VISIBLE column on this page came back with real data, so
  // nothing is listed here. The map exists so that a genuinely dead column
  // gets labelled instead of rendering as a silent wall of blanks.
  //
  // mfl_aav / mfl_years_remaining used to be null for 100% of rows here. Two
  // independent causes, both fixed in the worker 2026-08-05:
  //   1. /api/mfl-league-state's pid_to_contract emitted only
  //      { salary, contractYear, contractInfo, contractStatus }, so
  //      applyLiveOwnership()'s liveC.aav / liveC.yearsRemaining patch below
  //      had never once fired. It now sends aav + yearsRemaining (+
  //      contractLength), derived with the worker's own _parseContractData.
  //   2. The leaderboard SQL computed years-remaining as
  //      `years_total - contract_year + 1`, the inverse of the real meaning
  //      (MFL counts contract_year DOWN). Corrected to contract_year.
  // src_contracts season 2026 still has aav/contract_length empty for all 504
  // rows, so the SQL side stays null until that backfill lands — but the live
  // overlay now covers every rostered player regardless, which is the better
  // source anyway (live MFL, not a manual sync).
  var DEAD_COLS = {};
  // Columns empty only for CERTAIN position tabs. These are real absences
  // rather than bugs — a kicker takes no offensive snaps — but a blank column
  // still deserves to say why. Counts verified against 2025.
  var DEAD_COLS_BY_TAB = {
    off_snaps_total:    ["pk","pn"],
    off_snap_rate:      ["pk","pn"],
    def_snaps_total:    ["qb","pk","pn"],
    def_snap_rate:      ["qb","pk","pn"],
    receiving_drops:    ["qb"],
    receiving_drop_pct: ["qb"],
    fg_att_60plus:      ["pn"],
    fg_made_60plus:     ["pn"]
  };
  // → { kind: "broken"|"na", why } or null. "broken" means the source should
  // have data and doesn't (loud). "na" means the stat genuinely doesn't apply
  // to this position (quiet) — a kicker has no offensive snaps.
  function deadReason(colKey, tab) {
    if (DEAD_COLS[colKey]) return { kind: "broken", why: DEAD_COLS[colKey] };
    var tabs = DEAD_COLS_BY_TAB[colKey];
    if (tabs && tabs.indexOf(tab) >= 0) return { kind: "na", why: "not tracked for this position" };
    return null;
  }
  var MIN_SEASON = 2011;
  var LEAGUE_ID = "74598";

  // Version badge (informational; the live version is the pinned SHA). Absolute
  // URL because the page runs as an iframe srcdoc (no base for relative paths).
  fetch("https://keithcreelman.github.io/upsmflproduction/stats_workbench/VERSION.json?_=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(v){ var el = document.getElementById("asw-version"); if (el && v && v.version) el.textContent = "v" + v.version; })
    .catch(function(){});

  // ---------- Column manifest (single source of truth) ----------
  // Each column: label, num, fmt, cls, title, compute? (derived value)
  var COLS = {
    // Identity
    player_name:         { label:"Player",   cls:"name" },
    team:                { label:"NFL",      cls:"dim",
      title:"Current NFL team (falls back to the stat-season team if unknown)",
      compute: function(r){ return r.current_team || r.team || "—"; } },
    mfl_franchise_name:  { label:"MFL Team", cls:"dim",
      compute: function(r){ return r.mfl_franchise_name || "FA"; } },
    position:            { label:"Pos",      cls:"dim" },
    pos_rank:            { label:"Pos Rk",   num:true, cls:"dim",
      title:"Rank within position by MFL PPG, over the current query (matches the mobile app).",
      compute: function(r){ return (state.rankByGsis && state.rankByGsis[r.gsis_id]) || null; } },
    // MFL Details (league-specific scoring + contract)
    mfl_points:          { label:"MFL Pts",  num:true, fmt:"dec1",
      title:"Total MFL fantasy points over the selected season/scope" },
    mfl_ppg:             { label:"MFL PPG",  num:true, fmt:"dec1",
      title:"MFL points ÷ games with a score (excludes inactives/byes; computed server-side)" },
    // Strength-of-Schedule-adjusted MFL points (side-loaded /api/sos-adjusted-points, by gsis_id).
    // raw ÷ avg generosity of the defenses faced — easy schedule adjusts DOWN, tough adjusts UP.
    mfl_points_sos:      { label:"SoS Δ",  num:true, fmt:"delta",
      title:"Strength-of-Schedule delta = SoS-adjusted points − raw points. NEGATIVE = easy schedule (faced generous defenses, raw is inflated); POSITIVE = hard schedule (faced tough defenses, raw understates them).",
      compute:function(r){ var s=sosByGsis[String(r.gsis_id)]; return (s && s.sos != null && s.raw != null) ? Math.round((s.sos - s.raw)*10)/10 : null; } },
    // Consistency / boom-bust (side-loaded /api/player-consistency, by gsis_id).
    cons_floor:          { label:"Floor",   num:true, fmt:"dec1", title:"Lowest weekly fantasy score in the window (scoring games only)",
      compute:function(r){ var c=consistByGsis[String(r.gsis_id)]; return c && c.floor != null ? c.floor : null; } },
    cons_ceil:           { label:"Ceil",    num:true, fmt:"dec1", title:"Highest weekly fantasy score in the window",
      compute:function(r){ var c=consistByGsis[String(r.gsis_id)]; return c && c.ceil != null ? c.ceil : null; } },
    cons_score:          { label:"Consist", num:true, title:"Consistency 0-100 (higher = steadier week to week; = 100 × (1 − stdev ÷ PPG))",
      compute:function(r){ var c=consistByGsis[String(r.gsis_id)]; return c && c.consistency != null ? c.consistency : null; } },
    cons_boom:           { label:"Boom%",   num:true, title:"% of weeks at/above the position's leaguewide 75th-percentile weekly score (a ceiling week)",
      compute:function(r){ var c=consistByGsis[String(r.gsis_id)]; return c && c.boom_pct != null ? c.boom_pct : null; } },
    cons_bust:           { label:"Bust%",   num:true, invertRank:true, title:"% of weeks at/below the position's leaguewide 25th-percentile weekly score (a floor week)",
      compute:function(r){ var c=consistByGsis[String(r.gsis_id)]; return c && c.bust_pct != null ? c.bust_pct : null; } },
    cons_spark:          { label:"Trend",   title:"Weekly fantasy points across the window (left → right)",
      compute:function(r){ var c=consistByGsis[String(r.gsis_id)]; return c && c.weeks && c.weeks.length ? c.weeks : null; }, fmt:"spark" },
    // Efficiency / EPA (side-loaded /api/player-epa, nflfastR PBP, by gsis_id).
    epa_play:            { label:"EPA",     num:true, fmt:"epa", title:"Expected Points Added per play (nflfastR) — QB: per dropback, RB: per carry, WR/TE: per target. Positive = efficient.",
      compute:function(r){ var x=epaRole(r); return x && x.epa != null ? x.epa : null; } },
    epa_cpoe:            { label:"CPOE",    num:true, fmt:"delta", title:"Completion % Over Expected (QB pass plays) — accuracy vs the nflfastR completion-probability model",
      compute:function(r){ var e=epaByGsis[String(r.gsis_id)]; return e && e.pass && e.pass.plays >= 50 && e.pass.cpoe != null ? e.pass.cpoe : null; } },
    epa_succ:            { label:"Succ%",   num:true, fmt:"pct0", title:"Success rate — share of plays with positive EPA (QB dropbacks / carries / targets). Qualified samples only.",
      compute:function(r){ var x=epaRole(r); return x && x.succ != null ? x.succ : null; } },
    epa_vol:             { label:"EPA n",   num:true, title:"EPA sample — QB dropbacks / RB carries / WR-TE targets in the window",
      compute:function(r){ var x=epaRoleRaw(r); return x ? (x.plays != null ? x.plays : x.tgt) : null; } },
    // Route Separation — PFF Route Separation Score (manual export, side-loaded
    // by gsis_id). avg_score = separation ABOVE/BELOW expected (route+coverage+
    // depth adjusted), routes-weighted into MAN / ZONE / overall composites with
    // within-pool percentiles. Separation (route-volume adjusted) is QB/target-
    // independent and more predictive of next-season fantasy PPG than YPRR; the
    // MAN split is the stable, repeatable skill signal (zone is noisier).
    sep_man_pct:  { label:"vs Man",  num:true, fmt:"pct0", title:"Separation vs MAN coverage — percentile among qualified receivers (≥20 man routes). The stable, repeatable skill signal: man-coverage separation is far more predictive year-to-year than zone. Empty = under the route minimum.",
      compute:function(r){ var s=sepByGsis[String(r.gsis_id)]; return s && s.man_pct != null ? s.man_pct : null; } },
    sep_zone_pct: { label:"vs Zone", num:true, fmt:"pct0", title:"Separation vs ZONE coverage — percentile among qualified receivers (≥20 zone routes). Less stable year-to-year than man, but not noise.",
      compute:function(r){ var s=sepByGsis[String(r.gsis_id)]; return s && s.zone_pct != null ? s.zone_pct : null; } },
    sep_pct:      { label:"Overall", num:true, fmt:"pct0", title:"Overall route separation percentile among qualified receivers (≥50 contested routes; man + zone, routes-weighted).",
      compute:function(r){ var s=sepByGsis[String(r.gsis_id)]; return s && s.overall_pct != null ? s.overall_pct : null; } },
    sep_man:      { label:"Man±", num:true, fmt:"epa", title:"Separation above/below expected vs man coverage (routes-weighted). Positive = gets open more than an average receiver vs that look.",
      compute:function(r){ var s=sepByGsis[String(r.gsis_id)]; return s && s.man_score != null ? s.man_score : null; } },
    sep_zone:     { label:"Zone±", num:true, fmt:"epa", title:"Separation above/below expected vs zone coverage (routes-weighted).",
      compute:function(r){ var s=sepByGsis[String(r.gsis_id)]; return s && s.zone_score != null ? s.zone_score : null; } },
    sep_rt:       { label:"Sep Rt", num:true, title:"Route sample feeding the separation composite (contested man+zone routes).",
      compute:function(r){ var s=sepByGsis[String(r.gsis_id)]; return s && s.overall_routes != null ? s.overall_routes : null; } },
    // Expected Fantasy Points — nflverse ffopportunity, RE-SCORED under our league
    // rules (side-loaded JSON by gsis_id, weeks 1-17 = our fantasy season). xFP =
    // league fantasy points an average player would score given THIS player's
    // OPPORTUNITY (targets, air yards, carries, red-zone) — the most predictive
    // fantasy signal. The ± is computed against the OFFICIAL MFL actual (the MFL
    // Pts / MFL PPG columns) over MFL's game denominator, so the four columns tie:
    //   ± = MFL Pts − xFP ; ±/g = MFL PPG − xFP/g ; xFP/g = xFP ÷ MFL games.
    // NEGATIVE = left points on the table vs his usage (buy-low / positive-
    // regression lean); POSITIVE = outproduced his opportunity (sell-high lean).
    xfp_tot:      { label:"xFP", num:true, fmt:"dec1", title:"Expected Fantasy Points (2025, weeks 1-17, league-scored) — total fantasy points an AVERAGE player would score on this player's opportunity (targets / air yards / carries / red-zone). The most predictive fantasy stat.",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; return x && x.xfp != null ? x.xfp : null; } },
    xfp_pg:       { label:"xFP/g", num:true, fmt:"dec1", title:"Expected Fantasy Points per game = xFP ÷ MFL games (same denominator as MFL PPG, so they're directly comparable).",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.xfp==null) return null; var g=(r.games!=null&&r.games>0)?r.games:(x.games||0); return g>0 ? Math.round((x.xfp/g)*100)/100 : null; } },
    xfp_diff:     { label:"±", num:true, fmt:"delta", title:"MFL Pts − xFP (official actual minus expected, weeks 1-17). NEGATIVE (red) = UNDERperformed his opportunity → usage supports more, a buy-low / positive-regression lean; POSITIVE (green) = OUTproduced his opportunity → sell-high lean.",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.xfp==null||r.mfl_points==null) return null; return Math.round((r.mfl_points - x.xfp)*10)/10; } },
    xfp_diff_pg:  { label:"±/g", num:true, fmt:"delta", title:"MFL PPG − xFP/g (per game).",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.xfp==null) return null; var g=(r.games!=null&&r.games>0)?r.games:(x.games||0); if(!(g>0)) return null; var mppg=(r.mfl_ppg!=null)?r.mfl_ppg:(r.mfl_points!=null?r.mfl_points/g:null); return mppg!=null ? Math.round((mppg - x.xfp/g)*100)/100 : null; } },
    // Skill-vs-luck decomposition of the ± (modeled, scaled to the official ±). The
    // ± splits into a TD-luck bucket and a yards+receptions skill bucket; Sustain± is
    // the reliability-weighted, sample-shrunk part projected to carry forward; Luck±
    // is the rest (regresses). vs Self measures him against his OWN multi-year norm;
    // Backed is the independent skill support; Call is the synthesized verdict.
    xfp_td:       { label:"TD±", num:true, fmt:"delta", title:"Points from TOUCHDOWNS over expected (scaled to your official ±). Scoring-event LUCK — TD-over-expected has ~zero year-to-year stability (QB/RB r=0), so this is the part that regresses.",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.td_diff==null) return null; return Math.round(x.td_diff*xfpScale(r,x)*10)/10; } },
    xfp_eff:      { label:"Eff±", num:true, fmt:"delta", title:"Points from YARDS + RECEPTIONS over expected (scaled to your official ±). The skill-leaning bucket — yards/receptions over expected are repeatable (WR/TE reception reliability r=0.8, yards r=0.64).",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.eff_diff==null) return null; return Math.round(x.eff_diff*xfpScale(r,x)*10)/10; } },
    xfp_sustain:  { label:"Sustain±", num:true, fmt:"delta", title:"The part of the ± projected to CARRY FORWARD — each residual component shrunk by its measured year-to-year reliability AND the player's sample size, scaled to your official ±. This is the skill signal.",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.sustainable_diff==null) return null; return Math.round(x.sustainable_diff*xfpScale(r,x)*10)/10; } },
    xfp_luck:     { label:"Luck±", num:true, fmt:"delta", title:"The part of the ± NOT projected to carry forward (official ± minus Sustain±) — expected to mean-revert next season.",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; var off=xfpOfficial(r,x); if(off==null||!x||x.sustainable_diff==null) return null; return Math.round((off - x.sustainable_diff*xfpScale(r,x))*10)/10; } },
    xfp_vs_self:  { label:"vs Self", num:true, fmt:"delta", title:"This season's SUSTAINABLE rate vs the player's OWN multi-year baseline (years 1-3 use a UPS draft-slot prior, ramping to their own data). NEGATIVE = below his proven norm (buy lean); POSITIVE = above it. Measures him against himself, not the league — so a perennial over-converter is not flagged a sell just for being good.",
      compute:function(r){ var x=xfpByGsis[String(r.gsis_id)]; if(!x||x.regression_signal_pg==null) return null; var g=(r.games!=null&&r.games>0)?r.games:(x.games||1); return Math.round(x.regression_signal_pg*g*10)/10; } },
    xfp_corrob:   { label:"Backed", num:true, fmt:"sint", title:"Skill backing: net count of top-tercile minus bottom-tercile finishes on this position's STABLE skills (WR/TE: man-separation, target share, ADOT, YAC, EPA - RB: rush EPA, YAC/att, snap%, carry share - QB: CPOE, EPA, success%). Positive = his underlying skills support beating expectation, so it is likelier real than luck.",
      titleFn:function(r){ var c=state.xfpBack&&state.xfpBack[String(r.gsis_id)]; return c&&c.reasons&&c.reasons.length?("Skills vs position: "+c.reasons.join(", ")):""; },
      compute:function(r){ var c=state.xfpBack&&state.xfpBack[String(r.gsis_id)]; return c?c.backed:null; } },
    xfp_verdict:  { label:"Call", fmt:"verdict", title:"Buy-low / Hold / Sell-high — synthesizes the regression-prone Luck±, the player's skill backing, and where he sits vs his own baseline. BUY = underperformed but skills/track-record say better; SELL = overperformed on luck without skill support; HOLD = in line, or the over-performance is skill-backed.",
      titleFn:function(r){ var v=xfpVerdictInfo(r); if(!v) return ""; return v.verdict+" - official "+(v.off>=0?"+":"")+v.off.toFixed(0)+" = sustainable "+(v.sustain>=0?"+":"")+v.sustain.toFixed(0)+" + luck "+(v.luck>=0?"+":"")+v.luck.toFixed(0)+"; skill backing "+(v.bk>=0?"+":"")+v.bk+"; vs own baseline "+(v.vsSelf>=0?"+":"")+v.vsSelf.toFixed(0); },
      compute:function(r){ var v=xfpVerdictInfo(r); return v?v.verdict:null; } },
    // Market (MFL) — MFL-wide market signals (/api/mfl-market, joined by mfl_pid).
    // The behavioral data no stat source has: what thousands of MFL owners are
    // actually DOING with each player — plus the FantasySharks expert rank MFL
    // publishes, this league's scoring-adjusted projection, and the injury feed.
    mkt_own:      { label:"Own%",   num:true, fmt:"pct0", title:"% of ALL MFL leagues where this player is rostered (live, MFL-wide). 100% = universally owned; low % = lottery ticket / deep stash.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.own != null ? m.own : null; } },
    mkt_start:    { label:"Start%", num:true, fmt:"pct0", title:"% of MFL leagues starting him this week (MFL-wide) — the crowd's lineup confidence.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.start != null ? m.start : null; } },
    mkt_add:      { label:"Add%",   num:true, fmt:"pct0", title:"% of MFL leagues that ADDED him this week — the waiver-wire heat signal (who's trending up).",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.add != null ? m.add : null; } },
    mkt_drop:     { label:"Cut%",   num:true, fmt:"pct0", invertRank:true, title:"% of MFL leagues that DROPPED (cut) him this week — falling out of favor. (Labeled Cut% to avoid clashing with the PFR dropped-passes Drop%.)",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.drop != null ? m.drop : null; } },
    mkt_trade:    { label:"Trade%", num:true, fmt:"pct0", title:"% of MFL leagues where he was traded this week — deal-flow / debate signal.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.trade != null ? m.trade : null; } },
    mkt_rank:     { label:"Xpert Rk", num:true, invertRank:true, title:"MFL's expert overall rank (FantasySharks) — cross-position value, superflex-friendly. Lower = better.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.rank != null ? m.rank : null; } },
    mkt_rank_chg: { label:"Rk Δ",  num:true, fmt:"trend", title:"Expert-rank movement vs last week — ▲ = climbed the board.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.rank_chg != null ? m.rank_chg : null; } },
    mkt_proj:     { label:"Proj",   num:true, fmt:"dec1", title:"MFL weekly projection scored under THIS league's rules (FantasySharks raw stats × our scoring). Current projection week.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.proj != null ? m.proj : null; } },
    mkt_aav:      { label:"MFL AAV$", num:true, fmt:"dec1", title:"MFL-wide average AUCTION value ($ of a standard budget) — market price context vs our salary cap.",
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.aav != null ? m.aav : null; } },
    mkt_inj:      { label:"Inj",    cls:"dim", title:"Official NFL injury report status (MFL feed). Hover for detail + expected return.",
      titleFn:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.inj_detail ? m.inj_detail : ""; },
      compute:function(r){ var m=marketByMfl[String(r.mfl_pid)]; return m && m.inj ? m.inj : null; } },
    // Receiving · Air Yards (2018+) — TRUE weekly air yards (PFR via nfl_player_weekly)
    // + the derived opportunity composites the industry treats as the most
    // predictive receiver-usage stats: AY share, WOPR, RACR.
    rec_air_yds:  { label:"Air Yds", num:true, title:"Total air yards on his targets (2018+) — depth-weighted opportunity volume.",
      compute:function(r){ return r.rec_air_yds ? r.rec_air_yds : null; } },
    ay_share:     { label:"AY%",    num:true, fmt:"pct", title:"His share of the TEAM's air yards over his active weeks (2018+) — the forward-looking half of WOPR.",
      compute:function(r){ return r.air_yds_share != null ? r.air_yds_share : null; } },
    wopr:         { label:"WOPR",   num:true, fmt:"dec2", title:"Weighted Opportunity Rating = 1.5×target share + 0.7×air-yards share (2018+). The standard one-number usage composite; ≥0.60 = elite alpha usage.",

  // Pick the EPA role that matches a row's fantasy position (QB→pass, RB→rush, WR/TE→rec).
  function epaRoleRaw(r){ var e=epaByGsis[String(r.gsis_id)]; if(!e) return null; var pg=String(r.pos_group||r.position||"").toUpperCase(); if(pg==="QB") return e.pass; if(pg==="RB") return e.rush; return e.rec; }

  // ---- Expected Points: skill-vs-luck helpers ----
  // The decomposition (td_diff/eff_diff/sustainable_diff) is MODELED (ffopp actual −
  // expected). Scale it to the OFFICIAL ± (MFL points − xFP) so the buckets reconcile
  // to the ± the user sees; clamp, and fall back to unscaled when the modeled total ≈ 0.
  function xfpScale(r, x){
    if (!x || x.xfp == null || r.mfl_points == null || x.modeled_diff == null) return 1;
    if (Math.abs(x.modeled_diff) < 3) return 1;
    return Math.max(0.5, Math.min(2.0, (r.mfl_points - x.xfp) / x.modeled_diff));
  }
  function xfpOfficial(r, x){ return (r.mfl_points != null && x && x.xfp != null) ? (r.mfl_points - x.xfp) : null; }

  // Stable-skill backing: within each position bucket over the loaded rows, mark each
  // player top-tercile (+1) / bottom-tercile (−1) on the repeatable skills and net the
  // signs. Recomputed per render into state.xfpBack (gsis -> {backed, reasons}).
  function computeSkillBacking(rows){
    function bucket(r){ var p=String(r.position||r.pos_group||"").toUpperCase(); if(p==="QB")return"QB"; if(p==="RB"||p==="FB"||p==="HB")return"RB"; if(p==="WR"||p==="TE")return"WR_TE"; return null; }
    var SK = {
      QB: [["CPOE",function(r){var e=epaByGsis[String(r.gsis_id)];return e&&e.pass?e.pass.cpoe:null;}],
           ["EPA",function(r){var e=epaByGsis[String(r.gsis_id)];return e&&e.pass?e.pass.epa:null;}],
           ["Succ",function(r){var e=epaByGsis[String(r.gsis_id)];return e&&e.pass?e.pass.succ:null;}]],
      RB: [["EPA",function(r){var e=epaByGsis[String(r.gsis_id)];return e&&e.rush?e.rush.epa:null;}],
           ["YAC/A",function(r){return r.yac_per_a;}],
           ["Snap%",function(r){return r.off_snap_rate;}],
           ["Ru%",function(r){return r.rush_share;}]],
      WR_TE: [["ManSep",function(r){var s=sepByGsis[String(r.gsis_id)];return s?s.man_pct:null;}],
              ["Tgt%",function(r){return r.target_share;}],
              ["ADOT",function(r){return r.receiving_adot;}],
              ["YAC/R",function(r){return r.receiving_yac_per_r;}],
              ["EPA",function(r){var e=epaByGsis[String(r.gsis_id)];return e&&e.rec?e.rec.epa:null;}]]
    };
    var groups = {};
    rows.forEach(function(r){ var b=bucket(r); if(b)(groups[b]=groups[b]||[]).push(r); });
    var cache = {};
    Object.keys(groups).forEach(function(b){
      var grp = groups[b], skills = SK[b] || [];
      var tiers = skills.map(function(sk){
        var vals = grp.map(function(r){ return sk[1](r); }).filter(function(v){ return v != null && !isNaN(v); }).sort(function(a,c){ return a-c; });
        if (vals.length < 6) return null;
        return { lo: vals[Math.floor(vals.length/3)], hi: vals[Math.floor(2*vals.length/3)] };
      });
      grp.forEach(function(r){
        var score = 0, reasons = [];
        skills.forEach(function(sk, i){
          var t = tiers[i]; if (!t) return; var v = sk[1](r); if (v == null || isNaN(v)) return;
          if (v >= t.hi){ score++; reasons.push(sk[0]+"↑"); }
          else if (v <= t.lo){ score--; reasons.push(sk[0]+"↓"); }
        });
        cache[String(r.gsis_id)] = { backed: score, reasons: reasons };
      });
    });
    return cache;
  }

  // Buy / Hold / Sell — synthesize the regression-prone luck, skill backing, and
  // position vs the player's own baseline. T = points threshold (~0.75/g over a season).
  function xfpVerdictInfo(r){
    var x = xfpByGsis[String(r.gsis_id)];
    if (!x || x.xfp == null || r.mfl_points == null) return null;
    var scale = xfpScale(r, x);
    var off = r.mfl_points - x.xfp;
    var sustain = (x.sustainable_diff || 0) * scale;
    var luck = off - sustain;
    var games = r.games || x.games || 1;
    var vsSelf = (x.regression_signal_pg != null ? x.regression_signal_pg : 0) * games;
    var bk = (state.xfpBack && state.xfpBack[String(r.gsis_id)]) ? state.xfpBack[String(r.gsis_id)].backed : 0;
    var T = 12, verdict = "Hold";
    // SELL: overperformed and the overage is mostly LUCK — sustainable skill is less than
    // half of it, so it won't repeat (a skilled back who rode TD variance still sells; a
    // genuinely sustainable overperformer like a high-Eff± WR does NOT — his sustain holds up).
    if (off >= T && luck >= T && sustain < 0.5 * luck) verdict = "Sell";
    // BUY: underperformed and the shortfall is mostly luck (sustainable is not as negative),
    // or he's sitting below his OWN proven baseline with his skills still intact.
    else if (off <= -T && (sustain > 0.5 * luck || (vsSelf <= -T && bk >= 0))) verdict = "Buy";
    else if (off < 0 && vsSelf <= -T && bk >= 0) verdict = "Buy";
    return { verdict: verdict, off: off, sustain: sustain, luck: luck, vsSelf: vsSelf, bk: bk };
  }
  // Gated to a qualified sample so 1-carry scrubs don't top an EPA sort (rate

  // for multi-season windows where everyone clears them.
  function epaRole(r){ var x=epaRoleRaw(r); if(!x) return null; var pg=String(r.pos_group||r.position||"").toUpperCase(); var n=(x.plays!=null?x.plays:x.tgt)||0; var min=pg==="QB"?50:(pg==="RB"?25:20); return n>=min ? x : null; }
