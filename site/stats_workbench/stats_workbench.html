  // ---------- Per-column filter expressions ----------
  // Grammar (per cell):
  //   ""          → no filter
  //   "150"       → >= 150  (bare number defaults to >=)
  //   ">150"      → strictly greater
  //   ">=150"     → at least
  //   "<5"/"<=5"  → strict / inclusive less
  //   "=5"        → exact
  //   "150-300"   → inclusive range
  //   "10%" / "10" on a pct column → 0.10
  //   (fallback for string/dim cols) → substring (case-insensitive)
  function buildPredicate(expr, colKey) {
    if (!expr || !expr.trim()) return null;
    var s = expr.trim();
    var def = COLS[colKey] || {};
    var isPct = def.fmt === "pct" || def.fmt === "pct0";
    var isNumCol = !!def.num;

    function toNum(raw) {
      if (raw == null) return null;
      var hadPct = /%$/.test(raw);
      var n = parseFloat(String(raw).replace(/%$/, "").trim());
      if (isNaN(n)) return null;
      // For pct columns, user typing "10" or "10%" means 0.10.
      // Stored values come as decimals (0.10) from dec cols; pct0 cols
      // may already be in 0-100 form (e.g., 57.3). Let the compare-side
      // normalize — we just bring the filter to the same scale as value.
      if (isPct && (hadPct || n > 1)) n = n / 100;
      return n;
    }
    function normalizeCellForPct(v) {
      // Cell values in pct/pct0 columns are heterogeneous: base `fmt:pct` stores
      // 0-1 decimals; `fmt:pct0` may store 0-1 OR 0-100. Bring > 1 values down.
      if (v == null) return null;
      var n = Number(v);
      if (isNaN(n)) return null;
      if (isPct && n > 1) n = n / 100;
      return n;
    }

    if (isNumCol) {
      // Range "a-b"
      var rangeM = /^(-?\d+(?:\.\d+)?%?)\s*-\s*(-?\d+(?:\.\d+)?%?)$/.exec(s);
      if (rangeM) {
        var lo = toNum(rangeM[1]); var hi = toNum(rangeM[2]);
        if (lo == null || hi == null) return { invalid: true };
        return { test: function(v){
          var n = isPct ? normalizeCellForPct(v) : Number(v);
          return n != null && !isNaN(n) && n >= lo && n <= hi;
        }};
      }
      // Op-prefixed or bare number
      var opM = /^(>=|<=|>|<|=)?\s*(-?\d+(?:\.\d+)?%?)$/.exec(s);
      if (opM) {
        var op = opM[1] || ">=";
        var n = toNum(opM[2]);
        if (n == null) return { invalid: true };
        return { test: function(v){
          var x = isPct ? normalizeCellForPct(v) : Number(v);
          if (x == null || isNaN(x)) return false;
          switch (op) {
            case ">=": return x >= n;
            case "<=": return x <= n;
            case ">":  return x >  n;
            case "<":  return x <  n;
            case "=":  return x === n;
          }
          return false;
        }};
      }
      return { invalid: true };
    }
    // Text columns → substring match
    var lower = s.toLowerCase();
    return { test: function(v){
      return String(v == null ? "" : v).toLowerCase().indexOf(lower) >= 0;
    }};
  }

  // Cached predicates so we don't re-parse on every render cycle. Invalidated
  // whenever state.filters changes.
  var _predicateCache = {};
  function predicateFor(colKey) {
    if (_predicateCache[colKey] !== undefined) return _predicateCache[colKey];
    _predicateCache[colKey] = buildPredicate(state.filters[colKey], colKey);
    return _predicateCache[colKey];
  }
  function invalidatePredicateCache() { _predicateCache = {}; }

  function countActiveFilters() {
    var n = 0;
    Object.keys(state.filters).forEach(function(k){
      if ((state.filters[k] || "").trim()) n++;
    });
    return n;
  }

  // Default-visible groups for the current tab. (= the "Standard" preset view.)
  function resetVisibleGroupsForTab(tabId) {
    var tab = TABS[tabId];
    state.visibleGroups = new Set(
      (tab.groups || []).filter(function(g){ return g.defaultOn; }).map(function(g){ return g.id; })
    );
    state.viewName = "standard";
  }

  // ---------- Preset views (Standard | Advanced | Analytics | Custom) ----------
  // One-table view toggles (the PFR/FantasyPros pattern) layered on the group
  // picker: Standard = the tab's defaultOn groups (unchanged semantics);
  // Advanced = every non-analytics group (full traditional + advanced stats);
  // Analytics = MFL Details + Usage + the modeled/derived families. Any manual
  // group change flips to Custom. Choice persists per tab in localStorage and
  // round-trips in the URL hash (view=; groups= only written for custom).
  var ANA_GROUP_IDS = { consistency:1, efficiency:1, route_separation:1, expected_points:1,
                        routes:1, ngs_rec:1, ngs_rush:1, ngs_pass:1,
                        ftn_qb:1, ftn_rec:1, ftn_rb:1 };
  function groupsForView(tab, view) {
    var gs = tab.groups || [];
    if (view === "standard")  return new Set(gs.filter(function(g){ return g.defaultOn; }).map(function(g){ return g.id; }));
    if (view === "advanced")  return new Set(gs.filter(function(g){ return !ANA_GROUP_IDS[g.id]; }).map(function(g){ return g.id; }));
    if (view === "analytics") return new Set(gs.filter(function(g){ return g.id === "mfl_details" || g.id === "usage" || ANA_GROUP_IDS[g.id]; }).map(function(g){ return g.id; }));
    return null; // custom — caller keeps current groups
  }
  function applyView(tabId, view) {
    var tab = TABS[tabId];
    var set = groupsForView(tab, view);
    if (set) state.visibleGroups = set;
    state.viewName = set ? view : "custom";
    persistView(tabId);
  }
  function persistView(tabId) {
    try {
      localStorage.setItem("asw.view." + tabId, state.viewName);
      if (state.viewName === "custom") localStorage.setItem("asw.groups." + tabId, Array.from(state.visibleGroups).join(","));
    } catch (e) { /* private mode */ }
  }
  // On tab activation: restore the tab's saved view (falls back to Standard).
  function restoreViewForTab(tabId) {
    var saved = null, savedGroups = null;
    try {
      saved = localStorage.getItem("asw.view." + tabId);
      savedGroups = localStorage.getItem("asw.groups." + tabId);
    } catch (e) { /* private mode */ }
    if (saved === "custom" && savedGroups) {
      state.visibleGroups = new Set(savedGroups.split(",").filter(Boolean));
      state.viewName = "custom";
    } else if (saved && groupsForView(TABS[tabId], saved)) {
      state.visibleGroups = groupsForView(TABS[tabId], saved);
      state.viewName = saved;
    } else {
      resetVisibleGroupsForTab(tabId);
    }
  }
  // Mark the current state Custom (manual group change) + sync chips in place.
  function markViewCustom() {
    state.viewName = "custom";
    persistView(state.activeTab);
    refreshViewChips();
  }
  function refreshViewChips() {
    colsBarEl.querySelectorAll(".asw-view-chip").forEach(function(ch){
      ch.setAttribute("aria-pressed", ch.getAttribute("data-view") === state.viewName ? "true" : "false");
    });
    var sv = colsBarEl.querySelector(".asw-save-view");
    if (sv) sv.style.display = state.viewName === "custom" ? "" : "none";
  }

  // ---------- Cell formatting ----------
  function fmtCell(v, fmt){
    if (v == null || v === "" || (typeof v === "number" && isNaN(v))) return "—";
    if (fmt === "trend") {
      var t = Number(v); if (t === 0) return "0";
      return '<span class="asw-trend ' + (t > 0 ? "up" : "dn") + '">' + (t > 0 ? "▲" : "▼") + Math.abs(t) + "</span>";
    }
    if (fmt === "delta") {
      // Signed, colored delta — positive (hard schedule) green, negative (easy) red.
      var d = Number(v); if (d === 0) return "0";
      return '<span class="asw-trend ' + (d > 0 ? "up" : "dn") + '">' + (d > 0 ? "+" : "") + d.toFixed(1) + "</span>";
    }
    if (fmt === "epa") {
      // EPA per play — positive green (efficient), negative red.
      var e = Number(v);
      return '<span class="asw-trend ' + (e > 0 ? "up" : (e < 0 ? "dn" : "")) + '">' + (e > 0 ? "+" : "") + e.toFixed(3) + "</span>";
    }
    if (fmt === "sint") {
      // Signed integer, colored (skill-backing count).
      var iv = Number(v); if (iv === 0) return "0";
      return '<span class="asw-trend ' + (iv > 0 ? "up" : "dn") + '">' + (iv > 0 ? "+" : "") + iv.toFixed(0) + "</span>";
    }
    if (fmt === "verdict") {
      // Buy-low / Hold / Sell-high tag.
      if (v === "Buy")  return '<span class="asw-trend up">Buy</span>';
      if (v === "Sell") return '<span class="asw-trend dn">Sell</span>';
      return '<span class="dim">Hold</span>';
    }
    if (fmt === "spark") {
      // Inline weekly-points sparkline (v = ordered array of weekly scores).
      if (!Array.isArray(v) || !v.length) return "—";
      var W = 66, H = 16, N = v.length, mn = v[0], mx = v[0];
      for (var si = 0; si < N; si++){ if (v[si] < mn) mn = v[si]; if (v[si] > mx) mx = v[si]; }
      var rng = (mx - mn) || 1, pts = [];
      for (var sj = 0; sj < N; sj++){ var sx = N > 1 ? (sj / (N - 1)) * (W - 2) + 1 : W / 2; var sy = H - 1 - ((v[sj] - mn) / rng) * (H - 2); pts.push(sx.toFixed(1) + "," + sy.toFixed(1)); }
      return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="vertical-align:middle"><polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/></svg>';
    }
    if (fmt === "dec1") return Number(v).toFixed(1);
    if (fmt === "dec2") return Number(v).toFixed(2);
    if (fmt === "pct")  return (Number(v)*100).toFixed(1)+"%";
    if (fmt === "pct0") {
      var n = Number(v);
      if (n > 0 && n <= 1) n = n * 100;
      return n.toFixed(1)+"%";
    }
    if (fmt === "money") {
      // Compact dollar formatting — 45000 → 45K, 1250000 → 1.25M, 250 → 250.
      // No $ sign, integer K whole-numbers drop the decimal ("8K" not "8.0K").
      var m = Number(v);
      if (m === 0) return "0";
      var abs = Math.abs(m);
      var sign = m < 0 ? "-" : "";
      function trim(n){ return n.endsWith(".0") ? n.slice(0,-2) : n; }
      if (abs >= 1e6) return sign + trim((abs / 1e6).toFixed(2)) + "M";
      if (abs >= 1e3) return sign + trim((abs / 1e3).toFixed(abs >= 1e4 ? 0 : 1)) + "K";
      return sign + abs.toFixed(0);
    }
    return String(v);
  }

  function getVal(row, colKey){
    var def = COLS[colKey];
    if (def && def.compute) return def.compute(row);
    return row[colKey];
  }

  // ---------- Build the visible column list (respecting group toggles) ----------
  // Returns an array of "blocks" — each block is { groupId, groupLabel, colKeys }.
  // Identity block always first (no group label in the group header row).
  function buildBlocks() {
    var tab = TABS[state.activeTab];
    var blocks = [];
    blocks.push({ groupId: "ident", groupLabel: null, colKeys: tab.ident.slice() });
    (tab.groups || []).forEach(function(g){
      if (!state.visibleGroups.has(g.id)) return;
      blocks.push({ groupId: g.id, groupLabel: g.label, colKeys: g.cols.slice() });
    });
    return blocks;
  }

  function flatCols(blocks) {
    var out = [];
    blocks.forEach(function(b){ b.colKeys.forEach(function(k){ out.push(k); }); });
    return out;
  }

  // ---------- Render table (two-row thead: group headers + column headers) ----------
  // ---------- Top horizontal scrollbar (synced to the table wrap) ----------
  function syncTopScroll() {
    var wrap = document.getElementById("asw-table-wrap");
    var top = document.getElementById("asw-topscroll");
    var spacer = document.getElementById("asw-topscroll-spacer");
    if (!wrap || !top || !spacer) return;
    var tbl = wrap.querySelector("table");
    var w = tbl ? tbl.scrollWidth : wrap.scrollWidth;
    // The wrap has a vertical scrollbar (bounded 680px height) that narrows its
    // client width; the top bar has none. Pad the spacer by that difference so the
    // top bar's scroll RANGE matches the wrap's full content — otherwise it stops
    // short of the last column (Y/A) by the scrollbar width.
    var vsb = Math.max(0, top.clientWidth - wrap.clientWidth);
    spacer.style.width = (w + vsb) + "px";
    // Only show the top bar when the table actually overflows horizontally.
    top.style.display = (w > wrap.clientWidth + 1) ? "" : "none";
  }
  var _topScrollWired = false;
  function wireTopScroll() {
    if (_topScrollWired) return;
    var wrap = document.getElementById("asw-table-wrap");
    var top = document.getElementById("asw-topscroll");
    if (!wrap || !top) return;
    _topScrollWired = true;
    var lock = false;
    top.addEventListener("scroll", function () { if (lock) return; lock = true; wrap.scrollLeft = top.scrollLeft; lock = false; });
    wrap.addEventListener("scroll", function () { if (lock) return; lock = true; top.scrollLeft = wrap.scrollLeft; lock = false; });
    window.addEventListener("resize", syncTopScroll);
  }

  // ---------- Scatter discovery view (Phase 4) ----------
  // Usage-vs-efficiency scatter over the current filtered rows: spot the
  // archetypes (volume monsters, efficiency kings, do-everythings, avoids).
  var SCATTER_DEFAULTS = {
    qb: ["pass_att","epa_play"], rb: ["rush_share","ngs_ryoe_pa"], wr: ["target_share","rt_yprr"],
    te: ["target_share","rt_yprr"], flex_o: ["target_share","epa_play"],
    dl: ["def_snaps_total","def_pressures"], lb: ["def_snaps_total","def_tackles_total"],
    db: ["def_snaps_total","def_pass_def"], flex_idp: ["def_snaps_total","def_tackles_total"],
    pk: ["fg_att","fg_pct"], pn: ["punts","punt_net_avg"],
  };
  function scatterAxes() {
    var d = SCATTER_DEFAULTS[state.activeTab] || ["games","mfl_ppg"];
    var x = state.scatterX && COLS[state.scatterX] ? state.scatterX : d[0];
    var y = state.scatterY && COLS[state.scatterY] ? state.scatterY : d[1];
    if (!COLS[x]) x = "games";
    if (!COLS[y]) y = "mfl_ppg";
    return [x, y];
  }
  function buildScatterHtml(rows) {
    var tab = TABS[state.activeTab];
    var ax = scatterAxes(), xKey = ax[0], yKey = ax[1];
    // axis pickers from the tab's numeric columns, grouped like the chart dropdown
    function pickerHtml(id, cur) {
      var opts = (tab.groups || []).map(function(g){
        var inner = g.cols.filter(function(k){ return COLS[k] && COLS[k].num; }).map(function(k){
          return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+escapeHtml(COLS[k].label||k)+'</option>';
        }).join("");
        return inner ? '<optgroup label="'+escapeHtml(g.label)+'">'+inner+'</optgroup>' : "";
      }).filter(Boolean).join("");
      return '<select id="'+id+'" style="background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;max-width:180px">'+opts+'</select>';
    }
    var pts = rows.map(function(r){
      var x = getVal(r, xKey), y = getVal(r, yKey);
      if (x == null || y == null || isNaN(x) || isNaN(y)) return null;
      return { x: Number(x), y: Number(y), r: r };
    }).filter(Boolean);
    if (pts.length < 3) {
      return '<div style="padding:10px 0;display:flex;gap:10px;align-items:center">X ' + pickerHtml("asw-sc-x", xKey) + ' Y ' + pickerHtml("asw-sc-y", yKey) + '</div>' +
             '<div class="asw-empty">Not enough data points for these axes (pick others — some stats need the Analytics data or 2016+/2018+ seasons).</div>';
    }
    var W = 960, H = 560, PL = 56, PR = 16, PT = 14, PB = 40;
    var xs = pts.map(function(p){ return p.x; }), ys = pts.map(function(p){ return p.y; });
    var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
    if (xMax === xMin) xMax = xMin + 1;
    if (yMax === yMin) yMax = yMin + 1;
    var xPad = (xMax - xMin) * 0.04, yPad = (yMax - yMin) * 0.06;
    xMin -= xPad; xMax += xPad; yMin -= yPad; yMax += yPad;
    function sx(v){ return PL + ((v - xMin) / (xMax - xMin)) * (W - PL - PR); }
    function sy(v){ return H - PB - ((v - yMin) / (yMax - yMin)) * (H - PT - PB); }
    // median crosshairs → quadrants
    function med(a){ var s = a.slice().sort(function(p,q){return p-q;}); var m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
    var mx = med(xs), my = med(ys);
    var fx = function(v){ return fmtCell(v, COLS[xKey].fmt).replace(/<[^>]*>/g,""); };
    var fy = function(v){ return fmtCell(v, COLS[yKey].fmt).replace(/<[^>]*>/g,""); };
    // label the top-N interesting dots (extremes by distance from median)
    var labeled = pts.slice().sort(function(a,b){
      function d(p){ return Math.abs(p.x-mx)/(xMax-xMin) + Math.abs(p.y-my)/(yMax-yMin); }
      return d(b) - d(a);
    }).slice(0, Math.min(14, pts.length));
    var labeledSet = new Set(labeled.map(function(p){ return p.r.gsis_id; }));
    var dots = pts.map(function(p){
      var nm = p.r.player_name || "";
      var lbl = labeledSet.has(p.r.gsis_id)
        ? '<text x="'+(sx(p.x)+6)+'" y="'+(sy(p.y)+3)+'" font-size="9.5" fill="var(--muted)">'+escapeHtml((nm.split(" ").length>1?nm.split(" ").slice(-1)[0]:nm))+'</text>' : "";
      return '<g class="asw-sc-dot" data-gsis="'+escapeHtml(String(p.r.gsis_id||""))+'" style="cursor:pointer">' +
        '<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="4.2" fill="var(--accent)" fill-opacity="0.75" stroke="var(--bg)" stroke-width="1">' +
        '<title>'+escapeHtml(nm)+' — '+escapeHtml(COLS[xKey].label)+': '+fx(p.x)+' · '+escapeHtml(COLS[yKey].label)+': '+fy(p.y)+'</title></circle>' + lbl + '</g>';
    }).join("");
    var svg =
      '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;background:var(--panel);border:1px solid var(--border);border-radius:8px">' +
        '<line x1="'+sx(mx)+'" y1="'+PT+'" x2="'+sx(mx)+'" y2="'+(H-PB)+'" stroke="var(--border)" stroke-dasharray="4 4"/>' +
        '<line x1="'+PL+'" y1="'+sy(my)+'" x2="'+(W-PR)+'" y2="'+sy(my)+'" stroke="var(--border)" stroke-dasharray="4 4"/>' +
        '<text x="'+(W-PR-4)+'" y="'+(PT+12)+'" text-anchor="end" font-size="10" fill="var(--muted)">high usage · high efficiency</text>' +
        '<text x="'+(PL+4)+'" y="'+(H-PB-6)+'" font-size="10" fill="var(--muted)">low usage · low efficiency</text>' +
        '<text x="'+((PL+W-PR)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--text)">'+escapeHtml(COLS[xKey].label)+' →</text>' +
        '<text x="14" y="'+((PT+H-PB)/2)+'" text-anchor="middle" font-size="11" fill="var(--text)" transform="rotate(-90 14 '+((PT+H-PB)/2)+')">'+escapeHtml(COLS[yKey].label)+' →</text>' +
        dots +
      '</svg>';
    return '<div style="padding:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700">Scatter</span>' +
        'X ' + pickerHtml("asw-sc-x", xKey) + ' Y ' + pickerHtml("asw-sc-y", yKey) +
        '<span style="color:var(--muted);font-size:11px">' + pts.length + ' players · dashed lines = medians · click a dot for the player drawer</span>' +
      '</div>' + svg;
  }
  function wireScatter(rows) {
    var xSel = document.getElementById("asw-sc-x"), ySel = document.getElementById("asw-sc-y");
    if (xSel) xSel.addEventListener("change", function(){ state.scatterX = xSel.value; render(); });
    if (ySel) ySel.addEventListener("change", function(){ state.scatterY = ySel.value; render(); });
    var byGsis = {};
    rows.forEach(function(r){ if (r.gsis_id) byGsis[String(r.gsis_id)] = r; });
    bodyEl.querySelectorAll(".asw-sc-dot").forEach(function(g){
      g.addEventListener("click", function(){
        var r = byGsis[g.getAttribute("data-gsis")];
        if (r) openDrawer(r);
      });
    });
  }

  // Banner above the table naming any VISIBLE column whose source is empty,
  // plus the "you picked a season with no data" case. Silent when everything
  // on screen has data behind it.
  function renderDataNote(cols, apiRowCount) {
    var slot = document.getElementById("asw-datanote-slot");
    if (!slot) return;
    var notes = [];

    // Only genuinely-BROKEN sources earn a banner. "Doesn't apply to this
    // position" is real information but not a problem, so it stays on the
    // column header + its tooltip instead of shouting from the top of the page.
    var broken = (cols || []).filter(function (k) {
      var d = deadReason(k, state.activeTab);
      return d && d.kind === "broken";
    });
    if (broken.length) {
      var parts = broken.map(function (k) {
        return "<code>" + escapeHtml((COLS[k] && COLS[k].label) || k) + "</code>";
      }).join(" ");
      var reasons = {};
      broken.forEach(function (k) { reasons[deadReason(k, state.activeTab).why] = 1; });
      var keys = Object.keys(reasons);
      var why = keys.length === 1 ? keys[0] : "see each column's tooltip";
      notes.push("<b>No data behind " + (broken.length === 1 ? "this column" : "these columns") + ":</b> " +
                 parts + " — " + escapeHtml(why) + ". They render empty for every player.");
    }

    // Season with nothing behind it — the worker answers 200 with zero rows for
    // a season whose weekly stats haven't been ingested (e.g. one that hasn't
    // been played yet), which otherwise just looks like a broken page.
    if (apiRowCount === 0) {
      var seasons = [];
      try { seasons = getSelectedSeasons(); } catch (e) {}
      notes.push("<b>No stats for " + escapeHtml(seasons.join(", ")) + ".</b> " +
                 "Weekly data only exists through the most recently completed season — pick an earlier one.");
    }
    // The worker caps a query at 500 rows; past that the board is silently
    // truncated, which matters most on the deep pools (skill / IDP).
    if (apiRowCount >= 500) {
      notes.push("<b>Showing the first 500 players.</b> This position pool is larger than the query cap, " +
                 "so the tail is cut off — narrow by team or scope to see further down.");
    }

    slot.innerHTML = notes.length
      ? '<div class="asw-datanote"><span>⚠</span><span>' + notes.join("<br>") + "</span></div>"
      : "";
  }

  function render() {
    var tab = TABS[state.activeTab];
    var blocks = buildBlocks();
    var cols = flatCols(blocks);

    // Ensure a valid sort key
    if (!state.sortKey || cols.indexOf(state.sortKey) < 0) {
      state.sortKey = cols.indexOf(tab.defaultSort) >= 0 ? tab.defaultSort : cols[0];
      state.sortDir = (COLS[state.sortKey] && COLS[state.sortKey].num) ? "desc" : "asc";
    }

    // Filter rows
    var workerPos = tab.workerPos;
    var allRows = state.rowsByWorkerPos[workerPos] || [];
    var rows = allRows.slice();

    // Position filter (client-side, from tab definition)
    var posFilter = tab.positionFilter;
    if (posFilter && posFilter.length) {
      rows = rows.filter(function(r){ return posFilter.indexOf(r.position) >= 0; });
    }
    // Sub-tab filter (DL/DB)
    if (tab.subTabs) {
      var active = tab.subTabs.find(function(st){ return st.id === state.activeSubTab; }) || tab.subTabs[0];
      if (active && active.positions && active.positions.length) {
        rows = rows.filter(function(r){ return active.positions.indexOf(r.position) >= 0; });
      }
    }

    // Search — name + NFL team + position (B6), mirrors the mobile auction search.
    var searchQ = (searchEl.value || "").trim().toLowerCase();
    if (searchQ) rows = rows.filter(function(r){
      var hay = (String(r.player_name||"") + " " + String(r.current_team||r.team||"") + " " +
                 String(r.position||"") + " " + String(r.pos_group||"")).toLowerCase();
      return hay.indexOf(searchQ) !== -1;
    });

    // Per-column filters (only apply to currently visible columns — a filter
    // on a hidden column is parked, not lost, until the group is re-enabled)
    var activeCols = cols.filter(function(k){
      var p = predicateFor(k);
      return p && !p.invalid;
    });
    if (activeCols.length) {
      rows = rows.filter(function(r){
        for (var i = 0; i < activeCols.length; i++) {
          var k = activeCols[i];
          var v = getVal(r, k);
          if (!predicateFor(k).test(v)) return false;
        }
        return true;
      });
    }

    // Sort
    rows.sort(function(a, b){
      var av = getVal(a, state.sortKey);
      var bv = getVal(b, state.sortKey);
      if (av == null) av = state.sortDir === "asc" ? Infinity : -Infinity;
      if (bv == null) bv = state.sortDir === "asc" ? Infinity : -Infinity;
      if (typeof av === "string" || typeof bv === "string") {
        av = String(av); bv = String(bv);
        return state.sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      }
      return state.sortDir === "asc" ? av - bv : bv - av;
    });

    // ---- Build table HTML ----
    // First cell in every header + body row is a compare-checkbox column
    // (not part of the blocks — it's a fixed prefix that doesn't affect
    // sort/filter/heat logic).
    // Rank column: position in the CURRENT sort, so it renumbers as you sort
    // or filter. Purely presentational — it is not a COLS entry and never
    // enters sort/filter/heat/CSV logic.
    var SEL_TH_GROUP = '<th class="sel-col"></th><th class="rank-col"></th>';
    var SEL_TH_COL   = '<th class="sel-col" title="Select for comparison"></th>' +
                       '<th class="rank-col" title="Rank in the current sort">#</th>';

    // Group header row
    var groupRow = SEL_TH_GROUP + blocks.map(function(b, i){
      var span = b.colKeys.length;
      var sepCls = i > 0 ? "group-sep" : "";
      if (!b.groupLabel) {
        return '<th class="no-group '+sepCls+'" colspan="'+span+'"></th>';
      }
      return '<th class="'+sepCls+'" colspan="'+span+'">'+b.groupLabel+'</th>';
    }).join("");

    // Column header row
    var colRow = SEL_TH_COL;
    blocks.forEach(function(b, bi){
      b.colKeys.forEach(function(k, ci){
        var def = COLS[k] || { label: k };
        var sortAttr = k === state.sortKey
          ? ' aria-sort="' + (state.sortDir === "asc" ? "ascending" : "descending") + '"'
          : "";
        var cls = [];
        if (def.num) cls.push("num");
        if (k === "player_name") cls.push("name-col");
        if (bi > 0 && ci === 0) cls.push("group-sep");
        if ((state.filters[k] || "").trim()) cls.push("has-filter");
        // Flag a column whose SOURCE is empty rather than letting it render as
        // a wall of blank cells with no explanation.
        var dead = deadReason(k, state.activeTab);
        if (dead) cls.push(dead.kind === "broken" ? "col-nodata" : "col-na");
        var titleText = dead
          ? ((dead.kind === "broken" ? "NO DATA — " : "N/A — ") + dead.why + (def.title ? ("\n\n" + def.title) : ""))
          : (def.title || "");
        var titleAttr = titleText ? ' title="' + titleText.replace(/"/g, "&quot;") + '"' : "";
        colRow += '<th class="'+cls.join(" ")+'"'+sortAttr+titleAttr+' data-col-key="'+k+'">'+def.label+'</th>';
      });
    });

    // Filter row (third thead row). Only rendered when filtersVisible is true.
    var filterRow = "";
    if (state.filtersVisible) {
      filterRow = '<th class="sel-col"></th><th class="rank-col"></th>';
      blocks.forEach(function(b, bi){
        b.colKeys.forEach(function(k, ci){
          var def = COLS[k] || {};
          var raw = state.filters[k] || "";
          var p = raw.trim() ? buildPredicate(raw, k) : null;
          var inputCls = [];
          if (def.num) inputCls.push("num-filter");
          if (p && p.invalid) inputCls.push("invalid");
          else if (raw.trim()) inputCls.push("active");
          var thCls = [];
          if (bi > 0 && ci === 0) thCls.push("group-sep");
          var placeholder = def.num ? (def.fmt === "pct" || def.fmt === "pct0" ? ">10%" : ">150") : "";
          filterRow += '<th class="'+thCls.join(" ")+'">' +
            '<input type="text" class="'+inputCls.join(" ")+'" data-filter-key="'+k+'" ' +
            'value="'+raw.replace(/"/g,"&quot;")+'" placeholder="'+placeholder+'"></th>';
        });
      });
    }

    // Percentile heat map — quintile boundaries per numeric column.
    // Computed against the CURRENT visible row set (post filter+search)
    // so you're always ranking against whoever else is on the screen.
    // Identity / text cols skipped. Stable under changing tabs.
    var heatBuckets = {};
    if (state.heatOn) {
      cols.forEach(function(k){
        var def = COLS[k] || {};
        if (!def.num) return;
        var vals = [];
        for (var i = 0; i < rows.length; i++) {
          var v = getVal(rows[i], k);
          if (typeof v === "number" && !isNaN(v)) vals.push(v);
        }
        if (vals.length < 4) return; // not enough spread to be meaningful
        var sorted = vals.slice().sort(function(a,b){ return a - b; });
        function quantile(q){
          var idx = (sorted.length - 1) * q;
          var lo = Math.floor(idx), hi = Math.ceil(idx);
          return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
        }
        heatBuckets[k] = {
          b1: quantile(0.2),
          b2: quantile(0.4),
          b3: quantile(0.6),
          b4: quantile(0.8),
          invert: !!def.invertRank,
        };
      });
    }
    function heatClass(k, v) {
      var b = heatBuckets[k];
      if (!b || typeof v !== "number" || isNaN(v)) return "";
      var q;
      if      (v <= b.b1) q = 1;
      else if (v <= b.b2) q = 2;
      else if (v <= b.b3) q = 3;
      else if (v <= b.b4) q = 4;
      else                q = 5;
      if (b.invert) q = 6 - q; // lower values should get the "good" color
      return " pct-q" + q;
    }

    // Body — prefix each row with the compare checkbox + its rank in the
    // current sort. One <tr> per row still, so the row-index → rows[idx]
    // mapping the drill-down and compare cache rely on is unchanged.
    var body = rows.map(function(r, rowIdx){
      var gid = r.gsis_id || "";
      var checked = state.compareSet.has(gid) ? " checked" : "";
      var selCell = '<td class="sel-col">' +
        '<input type="checkbox" class="asw-compare-check" data-compare-gsis="'+gid+'"'+checked+'>' +
        '</td>' +
        '<td class="rank-col">' + (rowIdx + 1) + '</td>';
      var cells = selCell;
      blocks.forEach(function(b, bi){
        b.colKeys.forEach(function(k, ci){
          var def = COLS[k] || {};
          var v = getVal(r, k);
          var cls = [];
          if (def.num) cls.push("num");
          if (def.cls) cls.push(def.cls);
          if (bi > 0 && ci === 0) cls.push("group-sep");
          var hc = state.heatOn ? heatClass(k, v) : "";
          var tip = def.titleFn ? def.titleFn(r) : "";
          var tipAttr = tip ? ' title="'+String(tip).replace(/"/g,"&quot;")+'"' : "";
          cells += '<td class="'+cls.join(" ")+hc+'"'+tipAttr+'>'+fmtCell(v, def.fmt)+'</td>';
        });
      });
      return '<tr>'+cells+'</tr>';
    }).join("");

    var theadFilter = state.filtersVisible
      ? '<tr class="asw-filter-row">'+filterRow+'</tr>'
      : "";
    // Phase D (2026-04-24): group-header thead row only renders when
    // Heat is on. Without the color bands the group labels are visual
    // ink without payoff — a vertical accent separator between groups
    // (the .group-sep class on the col-row + body cells) carries the
    // grouping visually without the extra row.
    var theadGroup = state.heatOn
      ? '<tr class="asw-group-row">'+groupRow+'</tr>'
      : "";
    if (state.scatterOn) {
      // Scatter discovery view — swaps the table for a usage-vs-efficiency
      // scatter of the SAME filtered rows. Click a dot → the player drawer.
      bodyEl.innerHTML = rows.length ? buildScatterHtml(rows) : '<div class="asw-empty">No rows.</div>';
      wireScatter(rows);
    } else {
    bodyEl.innerHTML = rows.length || state.filtersVisible
      ? '<table class="asw-table' + (state.heatOn ? ' heat' : '') + '">' +
          '<thead>' +
            theadGroup +
            '<tr class="asw-col-row">'+colRow+'</tr>' +
            theadFilter +
          '</thead>' +
          '<tbody>'+ (rows.length ? body : '<tr><td colspan="'+(cols.length + 2)+'" class="asw-empty">No rows match filters.</td></tr>') +'</tbody>' +
        '</table>'
      : '<div class="asw-empty">No rows.</div>';
    }

    renderDataNote(cols, state.lastApiCount);
    syncTopScroll();   // size + show the top horizontal scrollbar for this table

    // "42 of 240 players" when any narrowing applied; plain "240 players" otherwise.
    // The denominator counts rows already narrowed by position/sub-tab (the
    // "universe" for this tab), so the fraction stays meaningful.
    var universe = allRows.slice();
    if (posFilter && posFilter.length) {
      universe = universe.filter(function(r){ return posFilter.indexOf(r.position) >= 0; });
    }
    if (tab.subTabs) {
      var st = tab.subTabs.find(function(x){ return x.id === state.activeSubTab; }) || tab.subTabs[0];
      if (st && st.positions && st.positions.length) {
        universe = universe.filter(function(r){ return st.positions.indexOf(r.position) >= 0; });
      }
    }
    var total = universe.length;
    var narrowed = rows.length !== total;
    var countLabel = narrowed
      ? (rows.length + " of " + total + " players")
      : (total + " player" + (total === 1 ? "" : "s"));
    // Stash what's currently visible so CSV export + comparison mode
    // can pull it without re-running the filter/sort pipeline.
    state.lastRows = rows;
    state.lastCols = cols;

    var filterCount = countActiveFilters();
    var filterHint = filterCount ? " · " + filterCount + " filter" + (filterCount === 1 ? "" : "s") : "";
    // Coverage / completeness signal (A1/A6): flag the 500-row cap (long-tail
    // truncation) + the offseason "season hasn't started" case. Cheap, no
    // per-cell noise — derived from the payload count + selected seasons.
    var covSeasons = getSelectedSeasons();
    var maxSeason = covSeasons.length ? Math.max.apply(null, covSeasons) : null;
    var nowY = new Date().getUTCFullYear();
    var coverage = maxSeason ? (" · data through " + maxSeason) : "";
    if (state.lastApiCount === 500) {
      coverage += " · top 500 by yardage — deep bench may be cut off";
    } else if (maxSeason === nowY && state.lastApiCount === 0) {
      coverage += " · " + nowY + " hasn’t started — showing no rows yet";
    }
    metaEl.textContent = (state.lastQuery || "") + " · " + countLabel + (searchQ ? " (search)" : "") + filterHint + coverage;

    // Wire sort (column-header clicks)
    bodyEl.querySelectorAll("th[data-col-key]").forEach(function(el){
      el.addEventListener("click", function(){
        var key = el.getAttribute("data-col-key");
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = key;
          state.sortDir = (COLS[key] && COLS[key].num) ? "desc" : "asc";
        }
        render();
      });
    });

    // Wire row click → drill-down panel. Stash the matching row object
    // on each <tr> via an index lookup so the handler can pass it straight
    // into openDrawer without a second find.
    var tbodyRows = bodyEl.querySelectorAll("tbody tr");
    tbodyRows.forEach(function(tr, idx){
      var rowObj = rows[idx];
      if (!rowObj || !rowObj.gsis_id) return;
      // Cache the row for the compare drawer (values are pre-aggregated
      // per the current filter window).
      state.compareRows[rowObj.gsis_id] = rowObj;
      tr.addEventListener("click", function(e){
        // Ignore clicks on the checkbox — they have their own handler.
        if (e.target && e.target.matches && e.target.matches(".asw-compare-check")) return;
        bodyEl.querySelectorAll("tbody tr.is-active").forEach(function(x){
          x.classList.remove("is-active");
        });
        tr.classList.add("is-active");
        openDrawer(rowObj);
      });
    });

    // Wire comparison checkboxes — toggle compareSet, stop propagation
    // so the row-click handler doesn't fire underneath.
    bodyEl.querySelectorAll(".asw-compare-check").forEach(function(inp){
      inp.addEventListener("click", function(e){ e.stopPropagation(); });
      inp.addEventListener("change", function(e){
        var gid = inp.getAttribute("data-compare-gsis");
        if (!gid) return;
        if (inp.checked) {
          if (state.compareSet.size >= 4) {
            inp.checked = false;
            return;
          }
          state.compareSet.add(gid);
        } else {
          state.compareSet.delete(gid);
        }
        renderCompareBar();
      });
    });

    // Wire filter-row inputs. Debounce keystrokes so typing doesn't thrash.
    // After the debounced render() fires, the input node is destroyed/recreated —
    // so we capture focus + caret before render and restore on the new element.
    if (state.filtersVisible) {
      var debTimer = null;
      bodyEl.querySelectorAll("input[data-filter-key]").forEach(function(inp){
        // Restore focus to this field if it was the pending one (handles the
        // re-render that ran while user was typing).
        if (pendingFocus && pendingFocus.key === inp.getAttribute("data-filter-key")) {
          requestAnimationFrame(function(){
            inp.focus();
            try {
              var pos = Math.min(pendingFocus.pos, inp.value.length);
              inp.setSelectionRange(pos, pos);
            } catch(e) {}
            pendingFocus = null;
          });
        }
        inp.addEventListener("input", function(){
          var key = inp.getAttribute("data-filter-key");
          state.filters[key] = inp.value;
          invalidatePredicateCache();
          updateFilterToggleLabel();
          // Live-validate this input's visual state without a full render
          var raw = inp.value.trim();
          inp.classList.remove("active","invalid");
          if (raw) {
            var p = buildPredicate(raw, key);
            inp.classList.add(p && p.invalid ? "invalid" : "active");
          }
          clearTimeout(debTimer);
          debTimer = setTimeout(function(){
            // Before re-render, record where the caret is so render() can
            // hand focus back to the freshly-mounted input.
            pendingFocus = { key: key, pos: inp.selectionStart || inp.value.length };
            render();
          }, 250);
        });
      });
    }
  }

  // Focus hand-off across renders (filter-row typing restores caret position)
  var pendingFocus = null;

  // ---------- Render the columns control bar ----------
  // Phase B (2026-04-24): replaced the 7-chip row with a single
  // "Columns · N active" dropdown trigger that opens a popover with
  // grouped checkboxes. Keeps all utility toggles (Filters / Heat /
  // CSV) on the right of the same row. Saves a whole row at idle.
  var _filterToggleBtn = null;
  var _filterClearBtn = null;

  // Group section labels are derived from the group's `label` prefix
  // ("Receiving · Advanced" → section "Receiving"). Groups without a
  // " · " delimiter go into a catch-all "General" section.
  function colsSectionFor(groupLabel) {
    var idx = (groupLabel || "").indexOf(" · ");
    if (idx > 0) return groupLabel.slice(0, idx);
    return null; // render without a section header
  }

  // "Columns · 3 active" or (if ≤3) "MFL Details · Usage · Volume".
  function buildColsTriggerLabel(tab) {
    var active = (tab.groups || []).filter(function(g){
      return state.visibleGroups.has(g.id);
    });
    if (!active.length) return "Columns · 0 active";
    if (active.length <= 3) {
      return active.map(function(g){
        // Short label — drop " · " suffix ("Receiving · Volume" → "Volume")
        var idx = (g.label || "").lastIndexOf(" · ");
        return idx > 0 ? g.label.slice(idx + 3) : g.label;
      }).join(" · ");
    }
    return "Columns · " + active.length + " active";
  }

  function isCustomizedFromDefaults(tab) {
    var defaults = new Set((tab.groups || []).filter(function(g){ return g.defaultOn; }).map(function(g){ return g.id; }));
    if (defaults.size !== state.visibleGroups.size) return true;
    var diff = false;
    defaults.forEach(function(id){ if (!state.visibleGroups.has(id)) diff = true; });
    return diff;
  }

  // Renders into a container region (NOT the popover root) so the
  // caller can keep a header above it without getting wiped on rebuild.
  function renderColsPopover(tab, containerEl) {
    containerEl.innerHTML = "";
    var groups = tab.groups || [];
    var lastSection = null;
    groups.forEach(function(g){
      var section = colsSectionFor(g.label);
      if (section && section !== lastSection) {
        var sh = document.createElement("div");
        sh.className = "section-label";
        sh.textContent = section;
        containerEl.appendChild(sh);
        lastSection = section;
      } else if (!section && lastSection !== "_general_") {
        // Only draw a "General" divider if we previously had a section
        if (lastSection) containerEl.appendChild(document.createElement("hr"));
        lastSection = "_general_";
      }
      var lbl = document.createElement("label");
      lbl.className = "group-item";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = state.visibleGroups.has(g.id);
      cb.addEventListener("change", function(){
        if (cb.checked) state.visibleGroups.add(g.id);
        else state.visibleGroups.delete(g.id);
        markViewCustom();  // manual group change → Custom view (persists + syncs chips)
        render();
        // Update trigger label + customized style without a full re-render
        var trigger = colsBarEl.querySelector(".asw-cols-trigger");
        if (trigger) {
          trigger.querySelector(".cols-trigger-label").textContent = buildColsTriggerLabel(tab);
          trigger.classList.toggle("is-customized", isCustomizedFromDefaults(tab));
        }
      });
      // Short label inside the sectioned popover (drop section prefix)
      var short = section ? g.label.slice(section.length + 3) : g.label;
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(short));
      containerEl.appendChild(lbl);
    });

    var footer = document.createElement("div");
    footer.className = "footer";
    var resetBtn = document.createElement("button");
    resetBtn.type = "button";
    resetBtn.className = "reset-btn";
    resetBtn.textContent = "Reset to defaults";
    resetBtn.addEventListener("click", function(){
      resetVisibleGroupsForTab(state.activeTab);  // = the Standard preset
      persistView(state.activeTab);
      refreshViewChips();
      renderColsPopover(tab, containerEl);
      render();
      var trigger = colsBarEl.querySelector(".asw-cols-trigger");
      if (trigger) {
        trigger.querySelector(".cols-trigger-label").textContent = buildColsTriggerLabel(tab);
        trigger.classList.toggle("is-customized", isCustomizedFromDefaults(tab));
      }
    });
    var doneBtn = document.createElement("button");
    doneBtn.type = "button";
    doneBtn.className = "done-btn";
    doneBtn.textContent = "Done";
    doneBtn.addEventListener("click", function(){
      // Close the popover (container's parent is the popover root)
      var pop = containerEl.parentElement;
      if (pop) pop.classList.remove("open");
    });
    footer.appendChild(resetBtn);
    footer.appendChild(doneBtn);
    containerEl.appendChild(footer);
  }

  function renderColsBar() {
    var tab = TABS[state.activeTab];
    var label = colsBarEl.querySelector(".asw-cols-label");
    colsBarEl.innerHTML = "";
    colsBarEl.appendChild(label);

    // Preset view chips — one-click Standard / Advanced / Analytics (+ Custom
    // indicator). Clicking a preset swaps the visible group set; any manual
    // change in the Columns popover flips to Custom.
    [["standard","Standard","The tab's default column groups — the core box-score view"],
     ["advanced","Advanced","Everything traditional + advanced (PFR, red zone, shares, market) — no analytics models"],
     ["analytics","Analytics","MFL Details + Usage + the modeled families (consistency, EPA, xFP skill/luck, separation, routes/NGS)"],
     ["custom","Custom","Your own group selection (pick via Columns ▾)"]].forEach(function(v){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "asw-chip asw-view-chip";
      chip.setAttribute("data-view", v[0]);
      chip.setAttribute("aria-pressed", state.viewName === v[0] ? "true" : "false");
      chip.textContent = v[1];
      chip.title = v[2];
      chip.addEventListener("click", function(){
        if (v[0] === "custom") {
          // Custom is a state, not a preset — just open the picker.
          var pop = colsBarEl.querySelector(".asw-cols-popover");
          if (pop) pop.classList.add("open");
          return;
        }
        applyView(state.activeTab, v[0]);
        refreshViewChips();
        renderColsPopover(tab, colsBarEl.querySelector(".cols-groups-region"));
        var trig = colsBarEl.querySelector(".asw-cols-trigger");
        if (trig) {
          trig.querySelector(".cols-trigger-label").textContent = buildColsTriggerLabel(tab);
          trig.classList.toggle("is-customized", isCustomizedFromDefaults(tab));
        }
        render();
      });
      colsBarEl.appendChild(chip);
    });

    // Named saved views — user-defined group sets beyond the presets. Saved per
    // tab in localStorage; ☆ appears when the current selection is Custom.
    function namedViews() {
      try { return JSON.parse(localStorage.getItem("asw.namedViews." + state.activeTab) || "[]"); } catch (e) { return []; }
    }
    function setNamedViews(list) {
      try { localStorage.setItem("asw.namedViews." + state.activeTab, JSON.stringify(list)); } catch (e) { /* private mode */ }
    }
    namedViews().forEach(function(v){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "asw-chip asw-named-view";
      chip.textContent = v.name + " ×";
      chip.title = "Apply saved view \"" + v.name + "\" (" + (v.groups || []).length + " groups). Click the × side to delete.";
      chip.addEventListener("click", function(e){
        // click on the trailing × (last ~14px) deletes; anywhere else applies
        var rect = chip.getBoundingClientRect();
        if (e.clientX > rect.right - 16) {
          if (confirm('Delete saved view "' + v.name + '"?')) { setNamedViews(namedViews().filter(function(x){ return x.name !== v.name; })); renderColsBar(); }
          return;
        }
        state.visibleGroups = new Set(v.groups || []);
        state.viewName = "custom";
        persistView(state.activeTab);
        refreshViewChips();
        render();
      });
      colsBarEl.appendChild(chip);
    });
    // Always rendered; visibility toggled by refreshViewChips() so it appears the
    // moment a popover change flips the state to Custom (the popover deliberately
    // avoids full colsBar re-renders, which would close it).
    var saveChip = document.createElement("button");
    saveChip.type = "button";
    saveChip.className = "asw-chip asw-save-view";
    saveChip.textContent = "☆ Save view";
    saveChip.title = "Name and save the current custom column selection as a reusable view for this tab";
    saveChip.style.display = state.viewName === "custom" ? "" : "none";
    saveChip.addEventListener("click", function(){
      var name = (prompt("Name this view:") || "").trim().slice(0, 24);
      if (!name) return;
      var list = namedViews().filter(function(x){ return x.name !== name; });
      list.push({ name: name, groups: Array.from(state.visibleGroups) });
      setNamedViews(list);
      renderColsBar();
    });
    colsBarEl.appendChild(saveChip);

    // Trigger pill — "Columns · N active" (or short group list if ≤3)
    var trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "asw-cols-trigger";
    trigger.title = "Click to pick which column groups show in the table";
    if (isCustomizedFromDefaults(tab)) trigger.classList.add("is-customized");
    var triggerLabel = document.createElement("span");
    triggerLabel.className = "cols-trigger-label";
    triggerLabel.textContent = buildColsTriggerLabel(tab);
    trigger.appendChild(triggerLabel);
    var chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = "▾";
    trigger.appendChild(chev);
    colsBarEl.appendChild(trigger);

    // Popover — sibling of trigger, absolutely positioned. Structure:
    //   <div.popover>
    //     <h4>Columns for {tab}</h4>
    //     <div.region> ← renderColsPopover writes here; h4 never wipes
    //   </div>
    var popover = document.createElement("div");
    popover.className = "asw-cols-popover";
    var header = document.createElement("h4");
    header.textContent = "Columns for " + tab.label;
    popover.appendChild(header);
    var region = document.createElement("div");
    region.className = "cols-groups-region";
    popover.appendChild(region);
    renderColsPopover(tab, region);
    colsBarEl.appendChild(popover);

    trigger.addEventListener("click", function(e){
      e.stopPropagation();
      popover.classList.toggle("open");
    });
    // Close on outside click or Esc
    document.addEventListener("click", function handler(e){
      if (!popover.classList.contains("open")) return;
      if (popover.contains(e.target) || trigger.contains(e.target)) return;
      popover.classList.remove("open");
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && popover.classList.contains("open")) popover.classList.remove("open");
    });
    // Right side: filter toggle + clear
    var spacer = document.createElement("span");
    spacer.className = "asw-cols-spacer";
    colsBarEl.appendChild(spacer);

    _filterToggleBtn = document.createElement("button");
    _filterToggleBtn.type = "button";
    _filterToggleBtn.className = "asw-filter-toggle";
    _filterToggleBtn.setAttribute("aria-pressed", state.filtersVisible ? "true" : "false");
    _filterToggleBtn.title = "Show inline column filters — type >150, <5, 10%, 150-300, etc.";
    _filterToggleBtn.addEventListener("click", function(){
      state.filtersVisible = !state.filtersVisible;
      _filterToggleBtn.setAttribute("aria-pressed", state.filtersVisible ? "true" : "false");
      render();
    });
    colsBarEl.appendChild(_filterToggleBtn);

    var scatterBtn = document.createElement("button");
    scatterBtn.type = "button";
    scatterBtn.className = "asw-filter-toggle";
    scatterBtn.textContent = "⚬ Scatter";
    scatterBtn.setAttribute("aria-pressed", state.scatterOn ? "true" : "false");
    scatterBtn.title = "Swap the table for a usage-vs-efficiency scatter of the same filtered rows — spot the archetypes. Pick any X/Y stat; click a dot for the player drawer.";
    scatterBtn.addEventListener("click", function(){
      state.scatterOn = !state.scatterOn;
      scatterBtn.setAttribute("aria-pressed", state.scatterOn ? "true" : "false");
      render();
    });
    colsBarEl.appendChild(scatterBtn);

    var heatBtn = document.createElement("button");
    heatBtn.type = "button";
    heatBtn.className = "asw-filter-toggle";
    heatBtn.textContent = "🔥 Heat";
    heatBtn.setAttribute("aria-pressed", state.heatOn ? "true" : "false");
    heatBtn.title = "Color each numeric cell by its position-group percentile rank. Green = top quintile, red = bottom. Stats where lower is better (Drops, INTs, Sacks, Miss%) are auto-inverted.";
    heatBtn.addEventListener("click", function(){
      state.heatOn = !state.heatOn;
      heatBtn.setAttribute("aria-pressed", state.heatOn ? "true" : "false");
      render();
    });
    colsBarEl.appendChild(heatBtn);

    var csvBtn = document.createElement("button");
    csvBtn.type = "button";
    csvBtn.className = "asw-filter-toggle";
    csvBtn.textContent = "📥 CSV";
    csvBtn.title = "Export the currently visible rows and columns to a CSV file";
    csvBtn.addEventListener("click", exportCsv);
    colsBarEl.appendChild(csvBtn);

    _filterClearBtn = document.createElement("button");
    _filterClearBtn.type = "button";
    _filterClearBtn.className = "asw-filter-clear";
    _filterClearBtn.textContent = "Clear";
    _filterClearBtn.title = "Clear all column filters";
    _filterClearBtn.addEventListener("click", function(){
      state.filters = {};
      invalidatePredicateCache();
      updateFilterToggleLabel();
      render();
    });
    colsBarEl.appendChild(_filterClearBtn);

    updateFilterToggleLabel();
  }

  function updateFilterToggleLabel() {
    if (!_filterToggleBtn) return;
    var n = countActiveFilters();
    _filterToggleBtn.textContent = n ? "☰ Filters (" + n + ")" : "☰ Filters";
    if (_filterClearBtn) _filterClearBtn.style.display = n ? "" : "none";
  }

  // ---------- Render sub-position chips inline inside the active tab button ----------
  // (Phase A cleanup: dropped the separate sub-tabs row. DL/DB get an
  // inline chip cluster rendered inside their own tab button — only
  // shows when that tab is active via CSS [aria-pressed="true"].)
  function renderSubTabs() {
    // Clear any existing sub-chip groups first
    tabsEl.querySelectorAll(".asw-subtab-group").forEach(function(g){ g.remove(); });
    var tab = TABS[state.activeTab];
    if (!tab.subTabs) return;
    var parentBtn = tabsEl.querySelector('[data-tab="' + state.activeTab + '"]');
    if (!parentBtn) return;
    var group = document.createElement("span");
    group.className = "asw-subtab-group";
    tab.subTabs.forEach(function(st){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "asw-subtab";
      btn.setAttribute("data-subtab", st.id);
      btn.setAttribute("aria-pressed", state.activeSubTab === st.id ? "true" : "false");
      btn.textContent = st.label;
      btn.addEventListener("click", function(e){
        // Swallow the click so it doesn't bubble up to the parent tab
        // (would re-activate the tab and reset state).
        e.stopPropagation();
        state.activeSubTab = st.id;
        group.querySelectorAll(".asw-subtab").forEach(function(x){
          x.setAttribute("aria-pressed", x === btn ? "true" : "false");
        });
        render();
      });
      group.appendChild(btn);
    });
    parentBtn.appendChild(group);
  }

  // ---------- Scope presets + custom week picker ----------
  // Scope is now one of: mfl_reg (1-14), mfl_playoffs (15-17),
  // mfl_total (1-17, default), full (1-22), custom (explicit list).
  var SCOPE_RANGES = {
    mfl_reg:      { min: 1,  max: 14, label: "MFL Reg" },
    mfl_playoffs: { min: 15, max: 17, label: "MFL Playoffs" },
    mfl_total:    { min: 1,  max: 17, label: "MFL Total" },
    full:         { min: 1,  max: 22, label: "Full + NFL Playoffs" },
  };
  // Custom weeks as a [start, end] range (two dropdowns) — replaces the
  // 22-chip picker that was painful to use. Contiguous-only, which
  // covers the realistic cases (first-N, last-N, playoffs, arbitrary
  // sub-window). Non-contiguous analysis was fringe enough to cut.
  var weeksLabelEl = document.getElementById("asw-weeks-label");
  var weekStartSel = document.getElementById("asw-week-start");
  var weekEndSel   = document.getElementById("asw-week-end");

  (function populateWeekSelects(){
    for (var w = 1; w <= 22; w++) {
      var a = document.createElement("option");
      a.value = String(w); a.textContent = "Wk " + w;
      if (w === 1)  a.selected = true;
      weekStartSel.appendChild(a);
      var b = document.createElement("option");
      b.value = String(w); b.textContent = "Wk " + w;
      if (w === 17) b.selected = true;
      weekEndSel.appendChild(b);
    }
  })();

  function getCustomWeekRange(){
    var lo = parseInt(weekStartSel.value, 10);
    var hi = parseInt(weekEndSel.value, 10);
    if (!Number.isFinite(lo)) lo = 1;
    if (!Number.isFinite(hi)) hi = 22;
    if (lo > hi) { var t = lo; lo = hi; hi = t; } // auto-swap on inversion
    return { lo: Math.max(1, lo), hi: Math.min(22, hi) };
  }

  function getScope(){
    return scopeSel ? scopeSel.value : "mfl_total";
  }
  function getScopeLabel(){
    var s = getScope();
    if (s === "custom") {
      var r = getCustomWeekRange();
      return "Wks " + r.lo + "-" + r.hi;
    }
    return (SCOPE_RANGES[s] && SCOPE_RANGES[s].label) || s;
  }
  function getScopeQueryParams(){
    var s = getScope();
    if (s === "custom") {
      var r = getCustomWeekRange();
      return "&week_min=" + r.lo + "&week_max=" + r.hi;
    }
    var preset = SCOPE_RANGES[s] || SCOPE_RANGES.mfl_total;
    return "&week_min=" + preset.min + "&week_max=" + preset.max;
  }
  function updateCustomPickerVisibility(){
    if (getScope() === "custom") weeksLabelEl.removeAttribute("hidden");
    else weeksLabelEl.setAttribute("hidden", "");
  }
  weekStartSel.addEventListener("change", runQuery);
  weekEndSel.addEventListener("change", runQuery);
  function getSelectedSeasons(){
    var sel = [];
    for (var i = 0; i < seasonsSel.options.length; i++) {
      if (seasonsSel.options[i].selected) sel.push(parseInt(seasonsSel.options[i].value, 10));
    }
    sel = sel.filter(function(s){ return s >= MIN_SEASON; });
    return sel.length ? sel : [defaultSeason];
  }
  function getSelectedTeams(){
    var sel = [];
    for (var i = 0; i < teamSel.options.length; i++) {
      if (teamSel.options[i].selected) sel.push(teamSel.options[i].value);
    }
    // "All (league-wide)" wins over everything else — returns [] meaning no filter.
    if (sel.indexOf("__ALL__") >= 0) return [];
    return sel;
  }

  // ---------- Rank within position by MFL PPG (B2) ----------
  // Bucket by position (||pos_group), sort by mfl_ppg desc, assign 1..N. Keyed
  // by gsis_id. Identical logic to the mobile app's buildLeaderboardMap so the
  // "Pos Rk" column here and the "PPG Rk" in the mobile player sheet agree.
  function computePosRanks(rows) {
    var buckets = {};
    (rows || []).forEach(function(r){
      if (!r || !r.gsis_id) return;
      // Rank within the IDP/offense GROUP (DL/LB/DB/QB/RB/WR/TE/PK), not the raw
      // nflverse position — otherwise DT/DE/OLB each get a #1 and a "DL" shows
      // multiple rank-1s (Keith 2026-06-20). pos_group is clean (DL/LB/DB).
      var pos = String(r.pos_group || r.position || "").toUpperCase();
      (buckets[pos] = buckets[pos] || []).push(r);
    });
    var map = {};
    Object.keys(buckets).forEach(function(pos){
      buckets[pos].slice()
        .sort(function(a,b){ return Number(b.mfl_ppg || 0) - Number(a.mfl_ppg || 0); })
        .forEach(function(r, i){ map[r.gsis_id] = i + 1; });
    });
    return map;
  }

  // ---------- Fetch for the current tab's workerPos ----------
  function runQuery() {
    var tab = TABS[state.activeTab];
    var reqTab = state.activeTab;   // guard: drop this fetch if the user switches tabs before it resolves
    var workerPos = tab.workerPos;
    var seasons = getSelectedSeasons();
    var scope = getScope();
    var teams = getSelectedTeams();
    state.sortKey = null;
    bodyEl.innerHTML = '<div class="asw-loading">Fetching…</div>';
    metaEl.textContent = "";
    // Server-side min_games=1 — real game-count filtering is done per-column
    // in the header filter row (type a number into G). Keep limit=500 so
    // multi-season queries still fit the D1 row cap.
    var url = API_BASE + "/api/advanced-stats-leaderboard" +
      "?seasons=" + encodeURIComponent(seasons.join(",")) +
      "&pos="    + encodeURIComponent(workerPos) +
      getScopeQueryParams() +
      "&min_games=1" +
      "&limit=500";
    // SoS-adjusted MFL points — side-load per query with the SAME seasons +
    // week window so the adjusted total lines up with the displayed raw points.
    var sosFetch = fetch(API_BASE + "/api/sos-adjusted-points?seasons=" +
        encodeURIComponent(seasons.join(",")) + getScopeQueryParams())
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ sosByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ sosByGsis = {}; });
    // Consistency / boom-bust — same seasons + week window, joined by gsis_id.
    var consistFetch = fetch(API_BASE + "/api/player-consistency?seasons=" +
        encodeURIComponent(seasons.join(",")) + getScopeQueryParams())
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ consistByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ consistByGsis = {}; });
    // EPA / efficiency — keyed by gsis_id, re-aggregated across the seasons.
    var epaFetch = fetch(API_BASE + "/api/player-epa?seasons=" +
        encodeURIComponent(seasons.join(",")))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ epaByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ epaByGsis = {}; });
    var routesFetch = fetch(API_BASE + "/api/player-routes?seasons=" +
        encodeURIComponent(seasons.join(",")))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ routesByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ routesByGsis = {}; });
    var ngsFetch = fetch(API_BASE + "/api/player-ngs?seasons=" +
        encodeURIComponent(seasons.join(",")))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ ngsByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ ngsByGsis = {}; });
    var ftnFetch = fetch(API_BASE + "/api/player-ftn?seasons=" +
        encodeURIComponent(seasons.join(",")))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ ftnByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ ftnByGsis = {}; });
    var splitsFetch = fetch(API_BASE + "/api/player-splits?seasons=" +
        encodeURIComponent(seasons.join(",")))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ splitsByGsis = (j && j.by_gsis) || {}; })
      .catch(function(){ splitsByGsis = {}; });
    // PFF Route Separation — static 2025 export (Pages JSON), keyed by gsis_id.
    // Loaded once; only populated for the rows that have a 2025 separation row.
    var sepFetch = fetch("https://keithcreelman.github.io/upsmflproduction/stats_workbench/pff_separation_2025.json")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        sepByGsis = {};
        var arr = (j && j.players) || [];
        for (var si = 0; si < arr.length; si++){ var p = arr[si]; if (p && p.gsis_id) sepByGsis[String(p.gsis_id)] = p; }
      })
      .catch(function(){ sepByGsis = {}; });
    // Expected Fantasy Points — static 2025 export (Pages JSON), keyed by gsis_id.
    var xfpFetch = fetch("https://keithcreelman.github.io/upsmflproduction/stats_workbench/nfl_xfp_2025.json")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        xfpByGsis = {};
        var arr = (j && j.players) || [];
        for (var xi = 0; xi < arr.length; xi++){ var p = arr[xi]; if (p && p.gsis_id) xfpByGsis[String(p.gsis_id)] = p; }
      })
      .catch(function(){ xfpByGsis = {}; });
    Promise.all([
      fetch(url).then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }),
      leagueStatePromise,
      currentTeamsPromise,
      sosFetch,
      consistFetch,
      epaFetch,
      routesFetch,
      ngsFetch,
      ftnFetch,
      splitsFetch,
      sepFetch,
      xfpFetch,
      marketReady,
      profileReady,
    ]).then(function(pair){
      var j = pair[0];
      var rows = Array.isArray(j.rows) ? j.rows : [];
      // Coverage signal (A1): the worker LIMITs at 500; j.count === 500 means
      // the long tail was truncated. Stash pre-team-filter count for the meta line.
      state.lastApiCount = (j && typeof j.count === "number") ? j.count : rows.length;
      rows = applyLiveOwnership(rows);
      // Team filter (post-ownership-overlay)
      // Special values:
      //   [] / __ALL__        → no filter (every player)
      //   __ROSTERED__        → any active franchise roster (exclude FAs)
      //   FA                  → free agents only
      //   <fid>               → that specific franchise
      // Multi-select: if __ROSTERED__ picked alongside specific fids,
      // __ROSTERED__ wins (superset). If FA also picked, add FAs back.
      if (teams.length) {
        var wantAllRostered = teams.indexOf("__ROSTERED__") >= 0;
        var wantFA = teams.indexOf("FA") >= 0;
        var wantFids = {};
        teams.forEach(function(t){
          if (t !== "FA" && t !== "__ROSTERED__" && t !== "__ALL__") wantFids[padFid(t)] = true;
        });
        rows = rows.filter(function(r){
          if (!r.mfl_franchise_id) return wantFA;
          if (wantAllRostered) return true;
          return wantFids[r.mfl_franchise_id] === true;
        });
      }
      state.rowsByWorkerPos[workerPos] = rows;   // cache is keyed by pos — safe to keep even if superseded
      // A newer tab switch already replaced the active view: keep the cached rows
      // above, but don't clobber the active tab's rank map / meta line / render
      // with this stale position's data (was the "PN tab shows 'QB ·'" bug).
      if (state.activeTab !== reqTab) return;
      // B2 — rank within position by MFL PPG over the fetched set. Mirrors the
      // mobile buildLeaderboardMap (app.js) exactly (bucket by position||pos_group,
      // sort by mfl_ppg desc) so desktop + mobile ranks never disagree.
      state.rankByGsis = computePosRanks(rows);
      state.xfpBack = computeSkillBacking(rows);   // skill-backing for the xFP verdict, ranked within this position set
      var seasonLabel = seasons.length === 1 ? String(seasons[0])
                      : seasons.length <= 3 ? seasons.sort(function(a,b){return b-a}).join(", ")
                      : seasons.sort(function(a,b){return a-b})[0] + "-" + seasons.sort(function(a,b){return b-a})[0];
      var teamLabel = "";
      if (teams.length === 1) {
        var t0 = teams[0];
        teamLabel = " · " + (
          t0 === "FA"           ? "Free Agents" :
          t0 === "__ROSTERED__" ? "All Rostered" :
          (fidToName[padFid(t0)] || t0)
        );
      } else if (teams.length > 1) {
        teamLabel = " · " + teams.length + " teams";
      }
      state.lastQuery = tab.label + " · " + seasonLabel + " · " + getScopeLabel() + teamLabel;
      render();
    }).catch(function(e){
      bodyEl.innerHTML = '<div class="asw-err">Query failed: '+(e && e.message || e)+'</div>';
      metaEl.textContent = "";
    });
  }

  // ---------- Tab switching ----------
  function activateTab(tabId) {
    if (!TABS[tabId]) return;
    state.activeTab = tabId;
    state.activeSubTab = "all";
    state.sortKey = null;
    // Per-column filters are scoped to a position — they rarely make sense
    // across tabs (RuAtt≥150 becomes noise on a DB table). Clear on switch.
    state.filters = {};
    invalidatePredicateCache();
    state.scatterX = state.scatterY = null;   // scatter axes reset to the new tab's defaults
    restoreViewForTab(tabId);
    tabsEl.querySelectorAll(".asw-tab").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-tab") === tabId ? "true" : "false");
    });
    renderSubTabs();
    renderColsBar();
    runQuery();
  }

  // ---------- Wiring ----------
  tabsEl.querySelectorAll(".asw-tab").forEach(function(btn){
    btn.addEventListener("click", function(){ activateTab(btn.getAttribute("data-tab")); });
  });
  scopeSel.addEventListener("change", function(){
    updateCustomPickerVisibility();
    runQuery();
  });
  // Initial visibility sync (default scope is mfl_total → picker hidden)
  updateCustomPickerVisibility();
  [seasonsSel, teamSel].forEach(function(el){
    el.addEventListener("change", runQuery);
  });

  // ---------- Phase C: filter pill (collapsed summary → expanded controls) ----------
  var filtersControlsEl = document.getElementById("asw-controls");
  var filtersPillEl     = document.getElementById("asw-filters-pill");
  var filtersSummaryEl  = document.getElementById("asw-filters-summary");

  function buildFilterSummary() {
    var seasons = getSelectedSeasons();
    var seasonLabel;
    if (seasons.length === 1) seasonLabel = String(seasons[0]);
    else if (seasons.length <= 3) seasonLabel = seasons.sort(function(a,b){return b-a;}).join(", ");
    else seasonLabel = seasons.length + " seasons";
    var scope = getScopeLabel();
    var teams = getSelectedTeams();
    var teamLabel;
    if (!teams.length) teamLabel = "All";
    else if (teams.length === 1) {
      var t = teams[0];
      teamLabel = t === "FA" ? "FA" : (t === "__ROSTERED__" ? "Rostered" : (fidToName[padFid(t)] || t));
    } else {
      teamLabel = teams.length + " teams";
    }
    var parts = [seasonLabel, scope, teamLabel];
    if (searchEl.value) parts.push('"' + searchEl.value + '"');
    return parts.join(" · ");
  }
  function updateFilterSummary() {
    if (filtersSummaryEl) filtersSummaryEl.textContent = buildFilterSummary();
  }

  if (filtersPillEl && filtersControlsEl) {
    filtersPillEl.addEventListener("click", function(){
      filtersControlsEl.classList.toggle("collapsed");
      filtersControlsEl.classList.toggle("expanded");
    });
    // Keep summary fresh on every filter-affecting change
    [seasonsSel, teamSel, scopeSel, weekStartSel, weekEndSel].forEach(function(el){
      if (el) el.addEventListener("change", updateFilterSummary);
    });
    searchEl.addEventListener("input", updateFilterSummary);
    // Initial population after league-state loads (so team name resolves cleanly)
    leagueStatePromise.then(updateFilterSummary);
    updateFilterSummary();
  }
  searchEl.addEventListener("input", function(){ if ((state.rowsByWorkerPos[TABS[state.activeTab].workerPos] || []).length) render(); });

  // ---------- Comparison mode ----------
  // Top-of-page sticky bar shows selected players as removable chips +
  // a prominent "Compare →" button. The Compare button opens a side-by-
  // side drawer reusing cached leaderboard rows (no refetch needed for
  // aggregate comparisons). Drill-down drawer (single-player) and
  // compare drawer share the drawer DOM.
  var compareBarEl    = document.getElementById("asw-compare-bar");
  var compareChipsEl  = document.getElementById("asw-compare-chips");
  var compareGoBtn    = document.getElementById("asw-compare-go");
  var compareClearBtn = document.getElementById("asw-compare-clear");

  function renderCompareBar() {
    var ids = Array.from(state.compareSet);
    if (!ids.length) {
      compareBarEl.setAttribute("hidden", "");
      return;
    }
    compareBarEl.removeAttribute("hidden");
    compareChipsEl.innerHTML = ids.map(function(gid){
      var row = state.compareRows[gid] || {};
      var name = row.player_name || gid;
      var team = row.team || "";
      var teamSuffix = team ? " · " + team : "";
      return '<span class="asw-compare-chip" data-compare-chip="'+gid+'">' +
        escapeHtml(name) + escapeHtml(teamSuffix) +
        '<button type="button" aria-label="Remove" data-remove-gsis="'+gid+'">×</button>' +
        '</span>';
    }).join("");
    compareGoBtn.textContent = "Compare " + ids.length + " player" + (ids.length === 1 ? "" : "s") + " →";
    compareGoBtn.disabled = ids.length < 2;

    // Wire chip × removes (re-rendered each call)
    compareChipsEl.querySelectorAll("[data-remove-gsis]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var gid = btn.getAttribute("data-remove-gsis");
        state.compareSet.delete(gid);
        // Uncheck matching checkbox(es) in table
        bodyEl.querySelectorAll('input.asw-compare-check[data-compare-gsis="'+gid+'"]').forEach(function(c){
          c.checked = false;
        });
        renderCompareBar();
      });
    });
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function clearCompareSet() {
    state.compareSet.clear();
    bodyEl.querySelectorAll(".asw-compare-check").forEach(function(c){ c.checked = false; });
    renderCompareBar();
  }

  // Build the comparison drawer: rows = metrics (from active tab's
  // visible groups), cols = players. Best/worst values per row flagged
  // with heat-style classes so eye can pick out advantages instantly.
  function openCompareDrawer() {
    var ids = Array.from(state.compareSet);
    if (ids.length < 2) return;
    var players = ids.map(function(gid){ return state.compareRows[gid]; }).filter(Boolean);
    if (players.length < 2) return;

    drawerScrim.removeAttribute("hidden");
    drawerScrim.classList.add("open");
    drawerEl.classList.add("open");
    drawerEl.setAttribute("aria-hidden", "false");

    // Drawer state resets (not single-player mode here)
    drawerState.playerRow = null;
    drawerState.weekRows = null;
    drawerState.allYearRows = null;
    drawerState.seasonRows = null;
    // Hide the Week/Season view toggle + Full-profile — single-player only.
    var toggleBox = document.getElementById("asw-drawer-view-toggle");
    if (toggleBox) toggleBox.style.display = "none";
    if (drawerFullBtn) drawerFullBtn.style.display = "none";

    drawerTitle.textContent = "Comparison";
    drawerSub.textContent = players.length + " players · " + getScopeLabel();

    var blocks = buildBlocks();
    var tab = TABS[state.activeTab];

    // Each block → section header row + one row per metric
    var sections = blocks.slice(1).map(function(b){
      var groupHeader = '<tr class="asw-compare-section-row">' +
        '<td colspan="'+(players.length + 1)+'">'+ (b.groupLabel || "") +'</td></tr>';
      var rows = b.colKeys.map(function(k){
        var def = COLS[k] || { label: k };
        // Compute each player's value for this metric
        var vals = players.map(function(p){ return getVal(p, k); });
        var numericVals = vals.filter(function(v){ return typeof v === "number" && !isNaN(v); });
        var best = numericVals.length ? (def.invertRank ? Math.min.apply(null, numericVals) : Math.max.apply(null, numericVals)) : null;
        var worst = numericVals.length ? (def.invertRank ? Math.max.apply(null, numericVals) : Math.min.apply(null, numericVals)) : null;
        var cells = players.map(function(p){
          var v = getVal(p, k);
          var cls = ["num"];
          if (typeof v === "number" && !isNaN(v) && numericVals.length > 1) {
            if (v === best && best !== worst) cls.push("best");
            else if (v === worst && best !== worst) cls.push("worst");
          }
          return '<td class="'+cls.join(" ")+'">' + fmtCell(v, def.fmt) + '</td>';
        }).join("");
        return '<tr><td class="metric">'+ escapeHtml(def.label) +'</td>' + cells + '</tr>';
      }).join("");
      return groupHeader + rows;
    }).join("");

    var playerHeaders = players.map(function(p){
      var team = p.team || "";
      var mfl  = p.mfl_franchise_name || "FA";
      var pos  = p.position || "";
      return '<th class="player num">' +
        escapeHtml(p.player_name || "—") +
        '<span class="sub">'+ escapeHtml((pos ? pos + " · " : "") + team + " · " + mfl) +'</span>' +
        '</th>';
    }).join("");

    drawerBody.innerHTML =
      '<section class="asw-drawer-section">' +
        '<h3>Head-to-head (' + tab.label + ')</h3>' +
        '<div class="asw-table-wrap"><table class="asw-compare-table">' +
          '<thead><tr><th>Metric</th>' + playerHeaders + '</tr></thead>' +
          '<tbody>' + sections + '</tbody>' +
        '</table></div>' +
      '</section>';
  }

  compareClearBtn.addEventListener("click", clearCompareSet);
  compareGoBtn.addEventListener("click", openCompareDrawer);

  // ---------- CSV export ----------
  // Exports exactly what's on screen: visible rows (post search + per-
  // column filter + sub-tab filter), visible columns (identity +
  // active column groups). Numbers go raw (no pct/dec formatting) so
  // Excel/Google Sheets can parse them cleanly. Strings with commas,
  // quotes, or newlines get RFC-4180 quoted.
  function csvEscape(v) {
    var s = (v == null) ? "" : String(v);
    if (/[,"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportCsv() {
    var rows = state.lastRows || [];
    var cols = state.lastCols || [];
    if (!rows.length || !cols.length) return;
    var header = cols.map(function(k){
      return csvEscape((COLS[k] && COLS[k].label) || k);
    }).join(",");
    var body = rows.map(function(r){
      return cols.map(function(k){
        var v = getVal(r, k);
        if (v == null || (typeof v === "number" && isNaN(v))) return "";
        if (typeof v === "number") return String(v);
        return csvEscape(v);
      }).join(",");
    }).join("\n");
    var tab = TABS[state.activeTab];
    var seasons = getSelectedSeasons();
    var seasonPart = seasons.length ? seasons.sort(function(a,b){return a-b;}).join("-") : "all";
    var fname = "upsmfl_stats_" + (tab.label || state.activeTab).toLowerCase().replace(/[^a-z0-9]+/g, "") +
      "_" + seasonPart + ".csv";
    var blob = new Blob([header + "\n" + body], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 100);
  }

  // ---------- Drill-down drawer (row click → per-week view) ----------
  // Drawer state lives outside `state` since it's ephemeral UI-only and
  // doesn't need to survive tab switches. Null means closed.
  var drawerEl       = document.getElementById("asw-drawer");
  var drawerScrim    = document.getElementById("asw-drawer-scrim");
  var drawerTitle    = document.getElementById("asw-drawer-title");
  var drawerSub      = document.getElementById("asw-drawer-sub");
  var drawerBody     = document.getElementById("asw-drawer-body");
  var drawerCloseBtn = document.getElementById("asw-drawer-close");
  var drawerViewBtns = document.querySelectorAll('#asw-drawer-view-toggle [data-view]');

  // Drawer-scoped state — cache both weekly (selected seasons) and
  // per-season-aggregated (all-years) rows so toggle is instant after
  // first fetch of each.
  var drawerState = {
    playerRow:    null,
    weekRows:     null,  // raw rows from /api/advanced-stats-player-weekly, selected-seasons scope
    allYearRows:  null,  // raw rows from same endpoint but ALL seasons (for By Season aggregation)
    seasonRows:   null,  // aggregated one-row-per-season synthesized from allYearRows
    view:         "weekly",
  };

  function openDrawer(playerRow) {
    drawerScrim.removeAttribute("hidden");
    drawerScrim.classList.add("open");
    drawerEl.classList.add("open");
    drawerEl.setAttribute("aria-hidden", "false");

    // Reset drawer-scoped state for the new player (Keith 2026-04-24:
    // chartMetric must clear too, otherwise opening a TE after a QB

    drawerState.playerRow   = playerRow;

    drawerState.allYearRows = null;
    drawerState.seasonRows  = null;

      b.setAttribute("aria-pressed", b.getAttribute("data-view") === "weekly" ? "true" : "false");

    var name = playerRow.player_name || "—";

    var mfl = playerRow.mfl_franchise_name || "FA";
