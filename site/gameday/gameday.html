<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPS Game Day</title>
<style>
  :root {
    --bg: #0b0f18; --panel: #141a26; --panel2: #1a2230; --line: #2a3446; --line-soft: #3a455c;
    --fg: #e8edf5; --muted: #8a97ad; --accent: #5b8dff; --warn: #fbbf24; --ok: #4ade80; --danger: #f87171; --teal: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .gd-wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .gd-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gd-head h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .gd-badge { font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 9px; }
  .gd-sub { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }

  /* Tab bar */
  .gd-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .gd-tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font-weight: 600; font-size: 14px; padding: 10px 16px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .gd-tabs button:hover { color: var(--fg); }
  .gd-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .gd-stub { color: var(--muted); padding: 40px 16px; text-align: center; }
  .gd-err { color: var(--danger); padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }

  /* ---- Lineup tab ---- */
  .gd-lu-status { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .gd-lu-status-line { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 15px; }
  .gd-lu-status-line strong { font-weight: 800; }
  .gd-chips { display: flex; gap: 7px; }
  .gd-chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; }
  .gd-chip.ok { color: var(--ok); border-color: rgba(74,222,128,0.4); }
  .gd-chip.under { color: var(--warn); border-color: rgba(251,191,36,0.4); }
  .gd-bar { margin-top: 10px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .gd-bar-fill { height: 100%; transition: width 200ms; background: var(--accent); }
  .gd-bar-fill.ok { background: var(--ok); }
  .gd-bar-fill.under { background: var(--warn); }
  .gd-lu-errors { margin: 10px 0 0; padding: 0 0 0 18px; font-size: 12px; color: var(--warn); }
  .gd-lu-tools { display: flex; gap: 8px; margin-top: 12px; }
  .gd-tool { padding: 8px 14px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .gd-tool:hover { border-color: var(--line-soft); }

  .gd-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .gd-cols { grid-template-columns: 1fr; } }
  .gd-col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .gd-col-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    background: var(--panel2); border-bottom: 1px solid var(--line); }
  .gd-col-head .n { color: var(--accent); letter-spacing: 0; }
  .gd-slot { display: grid; grid-template-columns: 88px 1fr 52px; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); }
  .gd-slot-proj { text-align: right; font-size: 14px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .gd-slot-proj.none { color: var(--muted); font-weight: 600; }
  .gd-chip.proj { color: var(--accent); border-color: rgba(91,141,255,0.4); }
  .gd-slot:first-child { border-top: 0; }
  .gd-slot.filled { border-left: 3px solid var(--accent); padding-left: 11px; }
  .gd-slot-tag { display: flex; flex-direction: column; line-height: 1.15; }
  .gd-slot-tag .pos { font-size: 14px; font-weight: 800; color: var(--fg); }
  .gd-slot-tag .pos.flex { color: var(--accent); font-size: 13px; }
  .gd-slot-tag .elig { font-size: 9px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-top: 1px; }
  .gd-slot-sel { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 30px 9px 11px; font-size: 13px; font-family: inherit; min-height: 40px;
    -webkit-appearance: none; appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238a97ad"><path d="M7 10l5 5 5-5z"/></svg>');
    background-repeat: no-repeat; background-position: right 8px center; }
  .gd-slot-sel.empty { color: var(--muted); border-color: var(--line-soft); border-style: dashed; }

  .gd-submit-row { margin-top: 16px; }
  .gd-submit { width: 100%; padding: 14px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .gd-submit.ready { background: var(--teal); color: #08251f; border-color: var(--teal); }
  .gd-submit.busy { opacity: 0.6; cursor: wait; }
  .gd-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .gd-msg { margin-top: 12px; padding: 9px 13px; border-radius: 8px; font-size: 13px; }
  .gd-msg.ok { background: rgba(74,222,128,0.1); color: var(--ok); border: 1px solid rgba(74,222,128,0.3); }
  .gd-msg.err { background: rgba(248,113,113,0.1); color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
  .gd-msg.info { background: rgba(91,141,255,0.1); color: var(--accent); border: 1px solid rgba(91,141,255,0.3); }

  /* ---- Taxi tab ---- */
  .gd-taxi-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .gd-taxi-table th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .gd-taxi-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .gd-taxi-table tr:hover td { background: var(--panel); }
  .gd-taxi-pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  .gd-taxi-sal { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--teal); }
  .gd-taxi-head { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 0; padding: 9px 12px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px 8px 0 0;
    font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .gd-taxi-head .n { color: var(--accent); letter-spacing: 0; }
  .gd-callup { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
  .gd-callup.danger { color: var(--warn); border-color: rgba(251,191,36,0.4); }
  .gd-callup.perm { color: var(--teal); border-color: rgba(45,212,191,0.4); }
  .gd-taxi-btn { padding: 6px 13px; border-radius: 7px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; border: 1px solid var(--line); white-space: nowrap; }
  .gd-taxi-btn.up { background: var(--accent); color: #08122e; border-color: var(--accent); }
  .gd-taxi-btn.down { background: var(--panel2); color: var(--fg); }
  .gd-taxi-btn:disabled { opacity: 0.55; cursor: wait; }
  .gd-note { color: var(--muted); font-size: 12.5px; margin: 14px 0; }
  .gd-link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; background: var(--accent);
    color: #08122e; border-radius: 8px; font-weight: 700; font-size: 13.5px; text-decoration: none; }
  .gd-link-btn.alt { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }

  /* ---- Live Scoring tab ---- */
  .gd-ls-hero { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .gd-ls-hero h2 { margin: 0 0 6px; font-size: 17px; }
  .gd-ls-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .gd-ls-frame { width: 100%; min-height: 600px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }

  /* ---- Live scoreboard ---- */
  .gd-sb-filter { display: flex; gap: 8px; margin-bottom: 12px; }
  .gd-sb-filter select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 28px 7px 10px; font-size: 13px; font-family: inherit; -webkit-appearance: none; appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238a97ad"><path d="M7 10l5 5 5-5z"/></svg>'); background-repeat: no-repeat; background-position: right 8px center; }
  .gd-sb-final { color: var(--muted); font-weight: 800; font-size: 11px; }
  .gd-plink { color: var(--fg); text-decoration: none; border-bottom: 1px dotted var(--line-soft); }
  .gd-plink:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .gd-sb-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 14px; }
  .gd-sb-wk { font-weight: 800; }
  .gd-sb-meta { color: var(--muted); font-size: 12px; }
  .gd-sb-livedot { color: var(--ok); font-weight: 800; }
  .gd-sb-myline { display: flex; align-items: baseline; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
  .gd-sb-myline .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .gd-sb-myline .live { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gd-sb-myline .proj { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .gd-sb-match { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: var(--panel); }
  .gd-sb-match-row { display: grid; grid-template-columns: 1.4fr 1.6fr 1.2fr 24px; gap: 12px; align-items: center; padding: 11px 14px; cursor: pointer; }
  .gd-sb-match-row:hover { background: var(--panel2); }
  .gd-sb-opp { font-weight: 700; }
  .gd-sb-opp .vs { color: var(--muted); font-weight: 600; margin-right: 2px; }
  .gd-sb-pill { font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .gd-sb-pill.win { color: var(--ok); border: 1px solid rgba(74,222,128,0.4); }
  .gd-sb-pill.lose { color: var(--warn); border: 1px solid rgba(251,191,36,0.4); }
  .gd-sb-nums { font-variant-numeric: tabular-nums; }
  .gd-sb-nums .s { font-size: 15px; font-weight: 700; }
  .gd-sb-nums .p { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .gd-sb-wp { display: flex; align-items: center; gap: 8px; }
  .gd-sb-wpbar { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .gd-sb-wpbar .fill { height: 100%; background: var(--accent); }
  .gd-sb-wp .wpn { font-size: 13px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .gd-sb-exp { color: var(--muted); text-align: center; }
  .gd-sb-oppros { border-top: 1px solid var(--line); padding: 0 6px 6px; background: var(--bg); }
  .gd-sb-sec-head { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .gd-sb-toggle button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; margin-left: 4px; }
  .gd-sb-toggle button.on { color: var(--accent); border-color: var(--accent); }
  .gd-sb-ros th, .gd-sb-ap th { font-size: 10px; }
  .gd-sb-ap tr.me td { background: rgba(91,141,255,0.10); }
  .gd-sb-ap .rk, .gd-sb-ros .rk { color: var(--muted); font-variant-numeric: tabular-nums; width: 28px; }
  .gd-sb-st { font-size: 11px; font-weight: 700; }
  .gd-sb-st.done { color: var(--muted); }
  .gd-sb-st.now { color: var(--ok); }
  .gd-sb-st.yet { color: var(--fg-muted, var(--muted)); opacity: 0.8; }
  .gd-sb-inj { font-size: 9px; font-weight: 800; color: var(--danger); border: 1px solid rgba(248,113,113,0.4); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  @media (max-width: 720px) { .gd-sb-match-row { grid-template-columns: 1fr 1fr; row-gap: 8px; } .gd-sb-wp { grid-column: 1 / -1; } .gd-sb-exp { display: none; } }
</style>
</head>
<body>
<div class="gd-wrap" id="gd-root">
  <div class="gd-stub">Loading Game Day…</div>
</div>

<script>
(function () {
  "use strict";

  // ---------- helpers ----------
  function s(v) { return v == null ? "" : String(v).trim(); }
  function pad4(v) { var d = String(v == null ? "" : v).replace(/\D/g, ""); return d ? ("0000" + d).slice(-4) : ""; }
  function asArray(v) { return v == null ? [] : (Array.isArray(v) ? v : [v]); }
  function esc(v) { return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmtUsd(n) {
    n = Number(n || 0);
    if (!n) return "$0";
    if (n >= 1000) return "$" + Math.round(n / 1000) + "K";
    return "$" + n;
  }
  function nameFromMfl(raw) {
    raw = s(raw);
    if (raw.indexOf(",") >= 0) {
      var p = raw.split(","); var last = s(p[0]); var rest = s(p[1]);
      return rest ? rest + " " + last : last;
    }
    return raw;
  }

  // ---------- context ----------
  var qp; try { qp = new URLSearchParams(location.search || ""); } catch (e) { qp = { get: function () { return ""; } }; }
  var CTX = {
    leagueId: s(window.UPS_GAMEDAY_LEAGUE_ID) || s(qp.get("L")) || "74598",
    year: s(window.UPS_GAMEDAY_YEAR) || s(qp.get("YEAR")) || String(new Date().getFullYear()),
    host: s(window.UPS_GAMEDAY_HOST) || "www48.myfantasyleague.com",
    franchiseId: pad4(window.UPS_GAMEDAY_FRANCHISE_ID || qp.get("FRANCHISE_ID") || qp.get("FRANCHISE") || "")
  };
  var WORKER_BASE = (function () {
    try { var o = qp.get("worker_base"); if (o) return o.replace(/\/$/, ""); } catch (e) {}
    if (typeof window.UPS_GAMEDAY_API_BASE === "string" && window.UPS_GAMEDAY_API_BASE) return s(window.UPS_GAMEDAY_API_BASE).replace(/\/$/, "");
    return "https://upsmflproduction.keith-creelman.workers.dev";
  })();
  function workerUrl(path) { return WORKER_BASE + path; }

  var STATE = {
    tab: "lineup",
    league: null, rosters: null, salaries: null, players: null, proj: {},
    franchises: [], viewerFranchiseId: "", viewerFranchise: null,
    loadErrors: [],
    slots: null,            // { slotId: pid }
    submitting: false,
    message: null           // { kind, text }
  };

  // ---------- data layer (mirrors team_operations.js) ----------
  function onMflHost() {
    try { return /\.myfantasyleague\.com$/.test(String(location.hostname || "").toLowerCase()); } catch (e) { return false; }
  }
  function mflExportUrl(type, extra) {
    var base = onMflHost()
      ? "//" + CTX.host + "/" + encodeURIComponent(CTX.year) + "/export"
      : workerUrl("/api/mfl-export");
    var url = base + "?TYPE=" + encodeURIComponent(type) +
      "&L=" + encodeURIComponent(CTX.leagueId) + "&YEAR=" + encodeURIComponent(CTX.year) + "&JSON=1";
    if (extra) { for (var k in extra) { if (extra[k] != null && extra[k] !== "") url += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(extra[k]); } }
    return url;
  }
  function fetchJson(url) {
    var same = false;
    try { same = /\.myfantasyleague\.com$/i.test(new URL(url, location.href).hostname); } catch (e) {}
    return fetch(url, { credentials: same ? "include" : "omit", mode: "cors" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(function (err) { STATE.loadErrors.push((url.split("TYPE=")[1] || url).split("&")[0] + ": " + (err && err.message || err)); return null; });
  }
  function readCookie(name) {
    try { var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)")); return m ? decodeURIComponent(m[1]) : ""; } catch (e) { return ""; }
  }
  function readCookieRaw(name) {
    try { var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)")); return m ? m[1] : ""; } catch (e) { return ""; }
  }

  function loadData() {
    return Promise.all([
      fetchJson(mflExportUrl("league")),
      fetchJson(mflExportUrl("rosters")),
      fetchJson(mflExportUrl("salaries")),
      fetchJson(mflExportUrl("players", { DETAILS: "1" })),
      fetchJson(mflExportUrl("projectedScores"))   // current-week projections (keyless)
    ]).then(function (r) {
      STATE.league = r[0]; STATE.rosters = r[1]; STATE.salaries = r[2]; STATE.players = r[3];
      STATE.proj = parseProj(r[4]);
      parseLeague(); resolveViewer();
    });
  }
  // pid -> projected points (MFL projectedScores). "Fine for now" per Keith;
  // a better source can swap in behind projFor() later.
  function parseProj(j) {
    var map = {}, ps = j && j.projectedScores && j.projectedScores.playerScore;
    asArray(ps).forEach(function (p) { if (p && p.id) { var n = parseFloat(p.score); if (!isNaN(n)) map[String(p.id)] = n; } });
    return map;
  }
  function projFor(pid) { var v = STATE.proj && STATE.proj[String(pid)]; return v == null ? null : v; }
  function fmtProj(v) { return v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1); }
  // League-wide positional rank by projection (cached): { pid: { rank, group } }.
  function posRankMap() {
    if (STATE.projRank) return STATE.projRank;
    var byG = {};
    Object.keys(STATE.proj || {}).forEach(function (pid) {
      var pl = playerById(pid); var g = posGroup(pl && pl.position);
      if (g === "OTH") return;
      (byG[g] = byG[g] || []).push({ pid: pid, proj: STATE.proj[pid] });
    });
    var map = {};
    Object.keys(byG).forEach(function (g) {
      byG[g].sort(function (a, b) { return b.proj - a.proj; });
      byG[g].forEach(function (x, i) { map[x.pid] = { rank: i + 1, group: g }; });
    });
    STATE.projRank = map; return map;
  }
  function posRankFor(pid) { return posRankMap()[String(pid)] || null; }
  function parseLeague() {
    var lg = STATE.league && STATE.league.league; if (!lg) return;
    STATE.franchises = asArray(lg.franchises && lg.franchises.franchise).map(function (f) {
      return { id: pad4(f.id), name: s(f.name), owner: s(f.owner_name) };
    });
  }
  function resolveViewer() {
    var fid = CTX.franchiseId;
    if (!fid) { var ll = readCookie("MFL_LAST_LOGIN_FRANCHISE_ID"); if (ll) fid = pad4(ll); }
    if (!fid) { try { var ls = window.localStorage && window.localStorage.getItem("rdh_my_fid"); if (ls) fid = pad4(ls); } catch (e) {} }
    if (!fid) {
      var lg = STATE.league && STATE.league.league;
      var cookie = readCookie("MFL_USER_ID");
      if (lg && cookie) {
        var fr = asArray(lg.franchises && lg.franchises.franchise);
        for (var i = 0; i < fr.length; i++) {
          var owner = s(fr[i].username || fr[i].owner_id || fr[i].owner_name);
          if (owner && owner.indexOf(cookie) !== -1) { fid = pad4(fr[i].id); break; }
        }
      }
    }
    STATE.viewerFranchiseId = fid;
    STATE.viewerFranchise = STATE.franchises.find(function (f) { return f.id === fid; }) || null;
    if (fid) { try { window.localStorage && window.localStorage.setItem("rdh_my_fid", fid); } catch (e) {} }
  }
  function playerById(id) {
    if (!STATE.players || !STATE.players.players) return null;
    var list = asArray(STATE.players.players.player);
    for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(id)) return list[i]; }
    return null;
  }
  function getMyRoster() {
    if (!STATE.rosters || !STATE.rosters.rosters) return [];
    var fr = asArray(STATE.rosters.rosters.franchise);
    var mine = fr.find(function (f) { return pad4(f.id) === STATE.viewerFranchiseId; });
    if (!mine) return [];
    return asArray(mine.player).map(function (p) {
      return { id: String(p.id), status: s(p.status), salary: Number(p.salary || 0),
        contractYear: s(p.contractYear), contractInfo: s(p.contractInfo) };
    });
  }

  // ---------- 18-starter slot model (mirror of site/m/front_office_lineup.js) ----------
  function posGroup(pos) {
    var p = s(pos).toUpperCase();
    if (p === "QB") return "QB";
    if (p === "RB" || p === "FB" || p === "HB") return "RB";
    if (p === "WR") return "WR";
    if (p === "TE") return "TE";
    if (p === "PK" || p === "K") return "PK";
    if (p === "PN" || p === "P") return "PN";
    if (p === "DT" || p === "DE" || p === "NT" || p === "DL") return "DL";
    if (p === "LB" || p === "OLB" || p === "ILB" || p === "MLB") return "LB";
    if (p === "CB" || p === "S" || p === "FS" || p === "SS" || p === "DB") return "DB";
    return "OTH";
  }
  var SLOTS = [
    { id: "QB1", label: "QB", side: "O", accepts: ["QB"] },
    { id: "RB1", label: "RB", side: "O", accepts: ["RB"] },
    { id: "RB2", label: "RB", side: "O", accepts: ["RB"] },
    { id: "WR1", label: "WR", side: "O", accepts: ["WR"] },
    { id: "WR2", label: "WR", side: "O", accepts: ["WR"] },
    { id: "TE1", label: "TE", side: "O", accepts: ["TE"] },
    { id: "OF1", label: "Flex", side: "O", accepts: ["RB", "WR", "TE"], flex: true, note: "RB/WR/TE" },
    { id: "OF2", label: "Flex", side: "O", accepts: ["RB", "WR", "TE"], flex: true, note: "RB/WR/TE" },
    { id: "SF1", label: "SuperFlex", side: "O", accepts: ["QB", "RB", "WR", "TE"], flex: true, note: "QB/RB/WR/TE" },
    { id: "PK1", label: "K", side: "O", accepts: ["PK"] },
    { id: "PN1", label: "P", side: "O", accepts: ["PN"] },
    { id: "DL1", label: "DL", side: "D", accepts: ["DL"], note: "DT/DE" },
    { id: "DL2", label: "DL", side: "D", accepts: ["DL"], note: "DT/DE" },
    { id: "LB1", label: "LB", side: "D", accepts: ["LB"] },
    { id: "LB2", label: "LB", side: "D", accepts: ["LB"] },
    { id: "DB1", label: "DB", side: "D", accepts: ["DB"], note: "CB/S" },
    { id: "DB2", label: "DB", side: "D", accepts: ["DB"], note: "CB/S" },
    { id: "DF1", label: "Flex", side: "D", accepts: ["DL", "LB", "DB"], flex: true, note: "DL/LB/DB" }
  ];
  var TOTAL = 18, OFF = 11, DEF = 7;
  function slotAccepts(slot, g) { return slot.accepts.indexOf(g) !== -1; }
  function eligibleRow(r) { if (!r) return false; if (r.isTaxi || r.isIr || r.isExpired) return false; return posGroup(r.pos) !== "OTH"; }

  function buildRows() {
    return getMyRoster().map(function (r) {
      var p = playerById(r.id) || {};
      var cy = parseInt(r.contractYear, 10);
      var row = { id: r.id, name: nameFromMfl(p.name) || ("Player " + r.id), pos: s(p.position).toUpperCase(),
        team: s(p.team), salary: r.salary, group: posGroup(p.position),
        isTaxi: /taxi/i.test(r.status || ""), isIr: /ir|injured/i.test(r.status || ""), isExpired: cy === 0 };
      row.eligible = eligibleRow(row);
      return row;
    });
  }
  // Optimal lineup by projection (no-projection sorts last).
  function optScore(r) { var p = projFor(r.id); return p == null ? -1 : p; }
  function autoFill(rows) {
    var byG = {};
    rows.forEach(function (r) { if (eligibleRow(r)) { var g = posGroup(r.pos); (byG[g] = byG[g] || []).push(r); } });
    Object.keys(byG).forEach(function (g) { byG[g].sort(function (a, b) { return optScore(b) - optScore(a); }); });
    var used = {}, draft = {};
    function take(accepts) {
      var best = null;
      accepts.forEach(function (g) { (byG[g] || []).forEach(function (r) { if (!used[r.id] && (!best || optScore(r) > optScore(best))) best = r; }); });
      if (best) { used[best.id] = 1; return best.id; } return "";
    }
    SLOTS.forEach(function (sl) { if (!sl.flex) draft[sl.id] = take(sl.accepts); });
    SLOTS.forEach(function (sl) { if (sl.flex) draft[sl.id] = take(sl.accepts); });
    return draft;
  }
  function validate(draft, byId) {
    draft = draft || {};
    var filled = 0, dupes = 0, ineligible = 0, mismatch = 0, seen = {}, bySide = { O: 0, D: 0 };
    SLOTS.forEach(function (sl) {
      var pid = draft[sl.id]; if (!pid) return;
      filled++; bySide[sl.side]++;
      if (seen[pid]) dupes++; else seen[pid] = 1;
      var r = byId[pid];
      if (!r || r.isTaxi || r.isIr || r.isExpired) { ineligible++; return; }
      if (!slotAccepts(sl, posGroup(r.pos))) mismatch++;
    });
    var errors = [];
    if (filled < TOTAL) { var n = TOTAL - filled; errors.push("Fill " + n + " more slot" + (n === 1 ? "" : "s")); }
    if (dupes) errors.push(dupes + " player" + (dupes === 1 ? "" : "s") + " used in two slots");
    if (ineligible) errors.push(ineligible + " ineligible (taxi/IR/expired) selected");
    if (mismatch) errors.push(mismatch + " player" + (mismatch === 1 ? "" : "s") + " in the wrong slot");
    var problems = dupes + ineligible + mismatch;
    return { ok: problems === 0 && filled === TOTAL, complete: filled === TOTAL, problems: problems, filled: filled, bySide: bySide, errors: errors };
  }

  // ---------- render ----------
  var root = document.getElementById("gd-root");
  function rerender() { render(); }

  var TABS = [
    { key: "lineup", label: "Submit Lineup" },
    { key: "taxi", label: "Taxi Squad" },
    { key: "live", label: "Live Scoring" }
  ];

  function render() {
    if (STATE.sbTimer) { clearTimeout(STATE.sbTimer); STATE.sbTimer = null; }  // re-armed by renderLive when on the live tab
    var who = STATE.viewerFranchise ? STATE.viewerFranchise.name : (STATE.viewerFranchiseId || "—");
    var html = '<div class="gd-head"><h1>Game Day</h1><span class="gd-badge">' + esc(who) + '</span></div>' +
      '<div class="gd-sub">League ' + esc(CTX.leagueId) + ' · ' + esc(CTX.year) + ' · set your starters, manage the taxi squad, and follow live scoring.</div>' +
      '<nav class="gd-tabs" id="gd-tabs">' +
        TABS.map(function (t) { return '<button type="button" data-gdtab="' + t.key + '"' + (t.key === STATE.tab ? ' class="active"' : '') + '>' + esc(t.label) + '</button>'; }).join("") +
      '</nav>' +
      '<div id="gd-content"></div>';

  // ---- Lineup tab ----
  // Salary is irrelevant for a starting lineup — show projection + positional
  // projection rank instead (Keith 2026-06-21).
  function optText(r) {
    var meta = []; if (r.pos) meta.push(r.pos); if (r.team) meta.push(r.team);
    var line = r.name + (meta.length ? "  ·  " + meta.join(" ") : "");
    var p = projFor(r.id);
    if (p != null) {
      line += "  ·  " + fmtProj(p) + " pts";
      var rk = posRankFor(r.id);
      if (rk) line += "  ·  " + rk.group + " #" + rk.rank;
    }
    return line;
  }
  function slotHtml(slot, rows, draft, used) {
    var current = draft[slot.id] || "";
    var cands = rows.filter(function (r) {
      if (!r.eligible || !slotAccepts(slot, r.group)) return false;
      return !used[r.id] || r.id === current;
    }).sort(function (a, b) {
      // Highest projected first (no-projection sorts last), tie → salary.
      var va = projFor(a.id), vb = projFor(b.id);
      va = va == null ? -1 : va; vb = vb == null ? -1 : vb;
      if (vb !== va) return vb - va;
      return (b.salary || 0) - (a.salary || 0);
    });
    var opts = '<option value="">— Empty —</option>';
    cands.forEach(function (r) { opts += '<option value="' + esc(r.id) + '"' + (r.id === current ? " selected" : "") + '>' + esc(optText(r)) + '</option>'; });
    var note = slot.note ? '<span class="elig">' + esc(slot.note) + '</span>' : "";
    var cur = current ? projFor(current) : null;
    return '<div class="gd-slot' + (current ? " filled" : "") + '">' +
      '<div class="gd-slot-tag"><span class="pos' + (slot.flex ? " flex" : "") + '">' + esc(slot.label) + '</span>' + note + '</div>' +
      '<select class="gd-slot-sel' + (current ? "" : " empty") + '" data-slot="' + esc(slot.id) + '">' + opts + '</select>' +
      '<div class="gd-slot-proj' + (cur != null ? "" : " none") + '" title="Projected points">' + esc(fmtProj(cur)) + '</div>' +
    '</div>';
  }
  function renderLineup(el) {
    var rows = buildRows();
    if (!rows.length) {
      el.innerHTML = '<div class="gd-stub">No roster found' + (STATE.viewerFranchiseId ? " for " + esc(STATE.viewerFranchiseId) : " — sign in to MFL") + '.</div>';
      return;
    }
    if (!STATE.slots) STATE.slots = autoFill(rows);
    var draft = STATE.slots;
    var byId = {}; rows.forEach(function (r) { byId[r.id] = r; });
    var v = validate(draft, byId);
    var used = {}; SLOTS.forEach(function (sl) { if (draft[sl.id]) used[draft[sl.id]] = 1; });
    var projTotal = null;
    SLOTS.forEach(function (sl) { var pid = draft[sl.id]; if (pid) { var p = projFor(pid); if (p != null) projTotal = (projTotal || 0) + p; } });
    var projChip = projTotal != null ? '<span class="gd-chip proj" title="Projected points (MFL, current week)">' + fmtProj(projTotal) + ' Proj Pts</span>' : '';

    var offCls = v.bySide.O === OFF ? "ok" : "under", defCls = v.bySide.D === DEF ? "ok" : "under";
    var fillCls = v.ok ? "ok" : "under", pct = Math.min(100, Math.round(v.filled / TOTAL * 100));
    var summary = v.ok ? '<strong>' + TOTAL + ' / ' + TOTAL + '</strong> starters · ready to submit'
                       : '<strong>' + v.filled + ' / ' + TOTAL + '</strong> starters set';

    var subLabel, subReady = false, subDis = false;
    if (STATE.submitting) { subLabel = "Submitting…"; subDis = true; }
    else if (v.problems > 0) { subLabel = "Fix lineup errors"; subDis = true; }
    else if (v.complete) { subLabel = "Submit Lineup to MFL"; subReady = true; }
    else if (v.filled > 0) { subLabel = "Save Lineup (" + v.filled + "/" + TOTAL + ")"; }
    else { subLabel = "Pick your starters"; subDis = true; }

    var html =
      '<div class="gd-lu-status">' +
        '<div class="gd-lu-status-line">' + summary +
          '<span class="gd-chips">' + projChip + '<span class="gd-chip ' + offCls + '">Off ' + v.bySide.O + '/' + OFF + '</span>' +
          '<span class="gd-chip ' + defCls + '">Def ' + v.bySide.D + '/' + DEF + '</span></span>' +
        '</div>' +
        '<div class="gd-bar"><div class="gd-bar-fill ' + fillCls + '" style="width:' + pct + '%"></div></div>' +
        (v.errors.length ? '<ul class="gd-lu-errors">' + v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join("") + '</ul>' : '') +
        '<div class="gd-lu-tools"><button type="button" class="gd-tool" id="gd-autofill" title="Fill the highest-projected eligible player into every slot">⚡ Optimal</button>' +
        '<button type="button" class="gd-tool" id="gd-clear">Clear all</button></div>' +
      '</div>' +
      (STATE.message ? '<div class="gd-msg ' + esc(STATE.message.kind) + '">' + esc(STATE.message.text) + '</div>' : '') +
      '<div class="gd-cols">' +
        '<div class="gd-col"><div class="gd-col-head"><span>Offense</span><span class="n">' + OFF + '</span></div>' +
          SLOTS.filter(function (sl) { return sl.side === "O"; }).map(function (sl) { return slotHtml(sl, rows, draft, used); }).join("") + '</div>' +
        '<div class="gd-col"><div class="gd-col-head"><span>Defense</span><span class="n">' + DEF + '</span></div>' +
          SLOTS.filter(function (sl) { return sl.side === "D"; }).map(function (sl) { return slotHtml(sl, rows, draft, used); }).join("") + '</div>' +
      '</div>' +
      '<div class="gd-submit-row"><button class="gd-submit' + (subReady ? " ready" : "") + (STATE.submitting ? " busy" : "") + '" id="gd-submit"' + (subDis ? " disabled" : "") + '>' + esc(subLabel) + '</button></div>';
    el.innerHTML = html;

    el.querySelectorAll(".gd-slot-sel").forEach(function (sel) {
      sel.addEventListener("change", function (e) {
        var id = e.target.getAttribute("data-slot"), pid = e.target.value;
        if (pid) STATE.slots[id] = pid; else delete STATE.slots[id];
        rerender();
      });
    });
    var af = document.getElementById("gd-autofill");
    if (af) af.addEventListener("click", function () { STATE.slots = autoFill(rows); STATE.message = null; rerender(); });
    var clr = document.getElementById("gd-clear");
    if (clr) clr.addEventListener("click", function () { STATE.slots = {}; STATE.message = null; rerender(); });
    var sub = document.getElementById("gd-submit");
    if (sub) sub.addEventListener("click", submitLineup);
  }

  function submitLineup() {
    if (STATE.submitting) return;
    var fid = STATE.viewerFranchiseId; if (!fid) return;
    var draft = STATE.slots || {}, seen = {}, starters = [];
    SLOTS.forEach(function (sl) { var pid = draft[sl.id]; if (pid && !seen[pid]) { seen[pid] = 1; starters.push(pid); } });
    if (!starters.length) return;
    STATE.submitting = true; STATE.message = { kind: "info", text: "Submitting lineup to MFL…" }; rerender();
    var url = workerUrl("/api/submit-lineup");
    var uid = readCookieRaw("MFL_USER_ID");
    if (uid) url += "?MFL_USER_ID=" + encodeURIComponent(uid);
    fetch(url, { method: "POST", mode: "cors", credentials: "omit",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ franchiseId: fid, starters: starters }) })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (resp) {
        if (resp.body && resp.body.ok) STATE.message = { kind: "ok", text: "Lineup saved to MFL ✓" };
        else {
          var err = (resp.body && resp.body.error)
            || (resp.body && resp.body.mfl_response && resp.body.mfl_response.error && resp.body.mfl_response.error.$t)
            || (resp.body && resp.body.mfl_response && resp.body.mfl_response.error) || ("HTTP " + resp.status);
          STATE.message = { kind: "err", text: String(err) };
        }
      })
      .catch(function (e) { STATE.message = { kind: "err", text: "Submit failed: " + (e && e.message || e) }; })
      .then(function () { STATE.submitting = false; rerender(); });
  }

  // ---- Taxi tab ----
  // ---- Taxi tab (in-app promote/demote, mirrors mobile) ----
  // Pulls the worker /roster-workbench feed for server-computed taxi_eligible +
  // call-up counts + off-cap salary, and POSTs promote/demote to
  // /roster-workbench/action (the worker enforces all §B2 rules + returns the
  // error text). No bounce to MFL.
  function loadRwb(force) {
    if (STATE.rwb && !force) return;
    STATE.rwb = { loaded: false, teams: [] };
    fetch(workerUrl("/roster-workbench?L=" + encodeURIComponent(CTX.leagueId) + "&YEAR=" + encodeURIComponent(CTX.year)), { mode: "cors", credentials: "omit" })
      .then(function (r) { return r.json(); })
      .then(function (j) { STATE.rwb = { loaded: true, teams: (j && j.teams) || [] }; rerender(); })
      .catch(function () { STATE.rwb = { loaded: true, teams: [] }; rerender(); });
  }
  function myRwbPlayers() {
    var t = ((STATE.rwb && STATE.rwb.teams) || []).find(function (x) { return pad4(x.franchise_id) === STATE.viewerFranchiseId; });
    return t ? (t.players || []) : [];
  }
  function callupLabel(p) {
    if (p.taxi_permanent_promotion) return '<span class="gd-callup perm">Promoted</span>';
    var used = Number(p.taxi_callups_used || 0), max = Number(p.taxi_callups_max || 3), pend = Number(p.taxi_callups_pending || 0);
    return '<span class="gd-callup' + (used >= max ? " danger" : "") + '">' + used + '/' + max + (pend ? " +" + pend : "") + '</span>';
  }
  function taxiAction(action, pid, name) {
    var verb = action === "promote_taxi" ? "Promote" : "Demote";
    var msg = action === "promote_taxi"
      ? "Promote " + name + " to your active roster?\n\nCanon §B2: each taxi player gets 3 call-ups; the 4th makes the promotion PERMANENT (no longer cap-free to cut). Demoting before the next NFL week locks does not burn a call-up."
      : "Send " + name + " to your taxi squad?\n\nTaxi salary is off-cap. Demoting before the next NFL week locks does not burn a call-up.";
    if (!window.confirm(msg)) return;
    STATE.taxiBusy = pid; STATE.message = null; rerender();
    fetch(workerUrl("/roster-workbench/action"), {
      method: "POST", mode: "cors", credentials: "omit",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: action, league_id: CTX.leagueId, season: CTX.year, franchise_id: STATE.viewerFranchiseId, player_id: pid })
    }).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (resp) {
        var b = resp.body || {};
        var ok = resp.status >= 200 && resp.status < 300 && b.ok !== false && b.error == null;
        if (ok) { STATE.message = { kind: "ok", text: verb + "d " + name + " ✓" }; STATE.taxiBusy = null; loadRwb(true); }
        else {
          var err = b.error || b.message || (b.mfl_response && (b.mfl_response.error && b.mfl_response.error.$t || b.mfl_response.error)) || ("HTTP " + resp.status);
          STATE.message = { kind: "err", text: String(err) }; STATE.taxiBusy = null; rerender();
        }
      })
      .catch(function (e) { STATE.message = { kind: "err", text: "Move failed: " + (e && e.message || e) }; STATE.taxiBusy = null; rerender(); });
  }

  function renderTaxi(el) {

      .sort(function (a, b) { return (b.salary || 0) - (a.salary || 0); });

    function row(p, action) {

      return '<tr><td>' + esc(name) + '</td><td class="gd-taxi-pos">' + esc(p.position || "—") + '</td>' +

        '<td class="gd-taxi-sal">' + esc(fmtUsd(p.salary)) + '</td><td style="text-align:right">' + btn + '</td></tr>';

        list.map(function (p) { return row(p, action); }).join("") + '</tbody></table>';

    el.innerHTML =

      (STATE.message ? '<div class="gd-msg ' + esc(STATE.message.kind) + '">' + esc(STATE.message.text) + '</div>' : '') +
      bucket("On the Taxi Squad — call up to active", onTaxi, "promote_taxi", "No players on your taxi squad.") +
      bucket("Eligible to send to Taxi", eligible, "demote_taxi", "No active rookies are taxi-eligible (UPS draft R2–5, within 3 league years, not permanently promoted).");

    el.querySelectorAll(".gd-taxi-btn").forEach(function (b) {
      b.addEventListener("click", function () { taxiAction(b.getAttribute("data-act"), b.getAttribute("data-pid"), b.getAttribute("data-name")); });
    });

  // ============ Live Scoring scoreboard ============
  // Custom board: live-adjusted projections (live + remaining proj, injury-aware),
  // double/triple-header support, per-matchup win probability, and an All-Play
  // board. Data via the worker proxy (60s cache = shared poller); polls ~30s
  // while games are live. Spec: memory project_gameday_scoreboard.
  var SB_POLL_MS = 30000, SIGMA_BASE = 30;

  function injuryFactor(status) {
    var s = String(status || "").toUpperCase();
    if (!s) return 1;
    if (s === "OUT" || s.indexOf("IR") >= 0 || s.indexOf("PUP") >= 0 || s.indexOf("SUSP") >= 0 || s === "NA") return 0;
    if (s.indexOf("DOUBT") >= 0) return 0.40;
    if (s.indexOf("QUEST") >= 0) return 0.75;
    return 1;
  }
  function injuryShort(status) {
    var s = String(status || "").toUpperCase(); if (!s) return "";
    if (s.indexOf("DOUBT") >= 0) return "D"; if (s.indexOf("QUEST") >= 0) return "Q";
    if (s === "OUT") return "OUT"; if (s.indexOf("IR") >= 0) return "IR";
    if (s.indexOf("PUP") >= 0) return "PUP"; if (s.indexOf("SUSP") >= 0) return "SUS";
    return s.slice(0, 3);
  }
  // standard normal CDF (Abramowitz-Stegun 26.2.17)
  function normCdf(z) {
    var t = 1 / (1 + 0.2316419 * Math.abs(z));
    var d = 0.3989422804 * Math.exp(-z * z / 2);
    var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return z > 0 ? 1 - p : p;
  }
  function parseInjuries(j) {
    var map = {}, inj = j && j.injuries && j.injuries.injury;
    asArray(inj).forEach(function (i) { if (i && i.id) map[String(i.id)] = String(i.status || ""); });
    return map;
  }

  // Year/week filter (default: current year, current/live week). "" week = current.
  function sbYear() { return STATE.sbYear || CTX.year; }
  function sbWeekSel() { return STATE.sbWeek || qp.get("W") || ""; }
  function sbExportUrl(type, week) {
    var base = onMflHost() ? "//" + CTX.host + "/" + encodeURIComponent(sbYear()) + "/export" : workerUrl("/api/mfl-export");
    var url = base + "?TYPE=" + encodeURIComponent(type) + "&L=" + encodeURIComponent(CTX.leagueId) + "&YEAR=" + encodeURIComponent(sbYear()) + "&JSON=1&DETAILS=1";
    if (week) url += "&W=" + encodeURIComponent(week);
    return url;
  }
  // Loads BOTH liveScoring (current/live) + weeklyResults (historical, keyless,
  // every past week) for the selected year/week, then picks the source: live if
  // liveScoring has franchise data for the week, else the weeklyResults snapshot.
  function loadScoreboard(force) {
    if (STATE.sb && STATE.sb.loaded && !force) { if (STATE.tab === "live") scheduleSbPoll(); return; }
    if (!STATE.sb) STATE.sb = { loaded: false };
    var wk = sbWeekSel();
    Promise.all([
      fetchJson(sbExportUrl("liveScoring", wk)),
      fetchJson(sbExportUrl("weeklyResults", wk)),
      fetchJson(sbExportUrl("schedule")),
      fetchJson(sbExportUrl("injuries")),
      fetchJson(sbExportUrl("league"))
    ]).then(function (r) {
      var live = r[0], weekly = r[1];
      var liveFr = (live && live.liveScoring && asArray(live.liveScoring.franchise).filter(function (f) { return f && f.id; })) || [];
      var source = liveFr.length ? "live" : ((weekly && weekly.weeklyResults && weekly.weeklyResults.matchup) ? "weekly" : "live");
      var franchises = [];
      try { franchises = asArray(r[4].league.franchises.franchise).map(function (f) { return { id: pad4(f.id), name: s(f.name) }; }); } catch (e) {}
      STATE.sb = { loaded: true, source: source, live: live, weekly: weekly, schedule: r[2], injuries: parseInjuries(r[3]),
        franchises: franchises.length ? franchises : STATE.franchises };
      try { STATE.sbAt = new Date(); } catch (e) {}
      if (STATE.tab === "live") { render(); scheduleSbPoll(); }
    }).catch(function () { STATE.sb = { loaded: true, error: true }; if (STATE.tab === "live") render(); });
  }
  function sbSource() { return (STATE.sb && STATE.sb.source) || "live"; }
  function sbLive() { return (STATE.sb && STATE.sb.live && STATE.sb.live.liveScoring) || null; }
  function sbWeekly() { return (STATE.sb && STATE.sb.weekly && STATE.sb.weekly.weeklyResults) || null; }
  function sbFranchises() { return (STATE.sb && STATE.sb.franchises) || STATE.franchises; }
  function sbWeek() {
    if (sbSource() === "weekly") { var wr = sbWeekly(); return wr ? String(wr.week || sbWeekSel() || "") : (sbWeekSel() || ""); }
    var ls = sbLive(); return ls ? String(ls.week || "") : (sbWeekSel() || "");
  }
  function injStatusFor(pid) { return (STATE.sb && STATE.sb.injuries && STATE.sb.injuries[String(pid)]) || ""; }
  function anyGameLive() {
    if (sbSource() !== "live") return false;
    var ls = sbLive(); return ls ? asArray(ls.franchise).some(function (f) { return parseInt(f.playersCurrentlyPlaying, 10) > 0; }) : false;
  }
  // Find a franchise's raw row from the active source. liveScoring keeps teams
  // in franchise[] (playoff weeks also split into matchup[].franchise[]);
  // weeklyResults keeps every team inside matchup[].franchise[].
  function sbFranchiseRaw(fid) {
    fid = pad4(fid);
    if (sbSource() === "weekly") {
      var wr = sbWeekly(); var found = null;
      if (wr) asArray(wr.matchup).forEach(function (m) { asArray(m.franchise).forEach(function (f) { if (pad4(f.id) === fid && !found) found = f; }); });
      return found;
    }
    var ls = sbLive(); if (!ls) return null;
    var direct = asArray(ls.franchise).find(function (f) { return pad4(f.id) === fid; });
    if (direct) return direct;
    var f2 = null;
    asArray(ls.matchup).forEach(function (m) { asArray(m.franchise).forEach(function (f) { if (pad4(f.id) === fid) f2 = f; }); });
    return f2;
  }
  // Starters normalized across shapes: liveScoring=franchise.players.player[],
  // weeklyResults=franchise.player[].
  function sbStarterRows(raw) { return asArray((raw && raw.players && raw.players.player) || (raw && raw.player) || []); }
  // Per-franchise computed scoreboard line. Live → projection blend; weekly
  // (completed) → final (no remaining, no injury adjust).
  function sbCompute(fid) {
    fid = pad4(fid);
    var meta = sbFranchises().find(function (f) { return f.id === fid; }) || { id: fid, name: fid };
    var raw = sbFranchiseRaw(fid);
    if (!raw) return { fid: fid, name: meta.name, live: 0, projFinal: 0, remaining: 0, secRem: 0, slots: 0, starters: [], hasData: false };
    var live = sbSource() === "live";
    var teamScore = Number(raw.score || 0), remaining = 0, secRem = 0, starters = [];
    sbStarterRows(raw).forEach(function (p) {
      if (String(p.status) !== "starter") return;
      var pid = String(p.id), pts = Number(p.score || 0);
      var gsr = live ? (parseInt(p.gameSecondsRemaining, 10) || 0) : 0;
      var status = live ? injStatusFor(pid) : "";
      var origProj = live ? (projFor(pid) || 0) : 0;
      var factor = injuryFactor(status);
      var rem = (!live || factor === 0) ? 0 : origProj * factor * (gsr / 3600);
      remaining += rem; secRem += gsr;
      var pm = playerById(pid) || {};
      starters.push({ pid: pid, name: nameFromMfl(pm.name) || pid, pos: s(pm.position).toUpperCase(), nfl: s(pm.team),
        live: pts, gsr: gsr, status: status, projFinal: pts + rem,
        playing: live && gsr > 0 && gsr < 3600, done: !live || gsr <= 0, yet: live && gsr >= 3600 });
    });
    starters.sort(function (a, b) { return b.projFinal - a.projFinal; });
    return { fid: fid, name: meta.name, live: teamScore, remaining: remaining, projFinal: teamScore + remaining, secRem: secRem, slots: starters.length, starters: starters, hasData: true };
  }
  function winProb(a, b) {
    var diff = a.projFinal - b.projFinal;
    var slots = (a.slots + b.slots) || 1;
    var frac = Math.max(0, Math.min(1, (a.secRem + b.secRem) / (slots * 3600)));
    var sigma = SIGMA_BASE * Math.sqrt(frac);
    if (sigma < 0.5) return diff > 0 ? 1 : (diff < 0 ? 0 : 0.5);
    return normCdf(diff / sigma);
  }
  function sbOpponents() {
    var opps = [];
    // Historical: weeklyResults.matchup has the clean multi-header pairings.
    if (sbSource() === "weekly") {
      var wr = sbWeekly();
      if (wr) asArray(wr.matchup).forEach(function (m) {
        var fr = asArray(m.franchise).map(function (f) { return pad4(f.id); });
        if (fr.indexOf(STATE.viewerFranchiseId) >= 0) fr.forEach(function (id) { if (id !== STATE.viewerFranchiseId && opps.indexOf(id) < 0) opps.push(id); });
      });
      return opps;
    }
    var sched = STATE.sb && STATE.sb.schedule && STATE.sb.schedule.schedule; var wk = sbWeek();
    if (sched) {
      var weeks = asArray(sched.weeklySchedule);
      var wrow = weeks.find(function (w) { return String(w.week) === wk; }) || null;
      if (wrow) asArray(wrow.matchup).forEach(function (m) {
        var fr = asArray(m.franchise).map(function (f) { return pad4(f.id); });
        if (fr.indexOf(STATE.viewerFranchiseId) >= 0) fr.forEach(function (id) { if (id !== STATE.viewerFranchiseId) opps.push(id); });
      });
    }
    // Fallback to liveScoring's own matchup pairing when the schedule export
    // has no row (e.g. playoffs, which the regular-season schedule omits).
    if (!opps.length) {
      var ls = sbLive();
      if (ls) asArray(ls.matchup).forEach(function (m) {
        var fr = asArray(m.franchise).map(function (f) { return pad4(f.id); });
        if (fr.indexOf(STATE.viewerFranchiseId) >= 0) fr.forEach(function (id) { if (id !== STATE.viewerFranchiseId && opps.indexOf(id) < 0) opps.push(id); });
      });
    }
    return opps;
  }
  function scheduleSbPoll() {
    if (STATE.sbTimer) { clearTimeout(STATE.sbTimer); STATE.sbTimer = null; }
    if (STATE.tab !== "live") return;
    try { if (document.hidden) return; } catch (e) {}
    if (!anyGameLive()) return;
    STATE.sbTimer = setTimeout(function () { loadScoreboard(true); }, SB_POLL_MS);
  }
  function fmtPts(n) { return (Math.round((Number(n) || 0) * 10) / 10).toFixed(1); }

  // Year + Week filter controls (any past week via weeklyResults; "Current" = live).
  function weekControls() {
    var cy = parseInt(CTX.year, 10) || (new Date()).getFullYear(), years = [];
    for (var y = cy; y >= cy - 4; y--) years.push(String(y));
    var yOpts = years.map(function (y) { return '<option value="' + y + '"' + (y === sbYear() ? " selected" : "") + '>' + y + '</option>'; }).join("");
    var selWk = sbWeekSel();
    var wOpts = '<option value=""' + (!selWk ? " selected" : "") + '>Current week</option>';
    for (var w = 1; w <= 17; w++) wOpts += '<option value="' + w + '"' + (String(w) === String(selWk) ? " selected" : "") + '>Week ' + w + '</option>';
    return '<div class="gd-sb-filter"><select id="gd-sb-year">' + yOpts + '</select><select id="gd-sb-week">' + wOpts + '</select></div>';
  }
  function bindWeekControls(el) {
    var yEl = el.querySelector("#gd-sb-year");
    if (yEl) yEl.addEventListener("change", function () { STATE.sbYear = yEl.value; STATE.sb = null; STATE.sbExpand = null; render(); });
    var wEl = el.querySelector("#gd-sb-week");
    if (wEl) wEl.addEventListener("change", function () { STATE.sbWeek = wEl.value; STATE.sb = null; STATE.sbExpand = null; render(); });
  }

  function renderLive(el) {
    loadScoreboard();
    if (!STATE.sb || !STATE.sb.loaded) { el.innerHTML = weekControls() + '<div class="gd-stub">Loading scoring…</div>'; bindWeekControls(el); return; }
    var ls = sbLive();
    var active = sbSource() === "weekly" ? sbWeekly() : ls;
    var nativeUrl = "//" + CTX.host + "/" + encodeURIComponent(sbYear()) + "/ajax_ls?L=" + encodeURIComponent(CTX.leagueId);
    if (STATE.sb.error || !active) {
      el.innerHTML = weekControls() +
        '<div class="gd-ls-hero"><h2>Scoreboard</h2><div class="gd-note" style="margin:0">No scoring data for ' + esc(sbYear()) + ' ' + (sbWeekSel() ? "Week " + esc(sbWeekSel()) : "the current week") +
        (STATE.sb.error ? " (feed error)" : "") + '. Pick another week above.</div>' +
        '<div class="gd-ls-actions"><a class="gd-link-btn" href="' + esc(nativeUrl) + '" target="_blank" rel="noopener">Open MFL Live Scoring ↗</a></div></div>';
      bindWeekControls(el);
      return;
    }
    var me = sbCompute(STATE.viewerFranchiseId);
    var opps = sbOpponents().map(function (id) { return sbCompute(id); });
    var wk = sbWeek();
    var sbView = STATE.sbView || "proj";
    var updated = "";
    try { if (STATE.sbAt) updated = "updated " + Math.max(0, Math.round((new Date() - STATE.sbAt) / 1000)) + "s ago"; } catch (e) {}

    // ---- Section 1: My Week (multi-matchup) ----
    var statusTag = anyGameLive() ? '<span class="gd-sb-livedot">● LIVE</span> '
      : (sbSource() === "weekly" ? '<span class="gd-sb-final">Final</span> ' : '');
    var hdr = weekControls() +
      '<div class="gd-sb-top"><div><span class="gd-sb-wk">' + esc(sbYear()) + ' · Week ' + esc(wk) + '</span> · ' + esc(me.name) +
      '</div><div class="gd-sb-meta">' + statusTag + esc(updated) + '</div></div>';
    var myCard = '<div class="gd-sb-myline"><span class="lbl">Your score</span>' +
      '<span class="live">' + fmtPts(me.live) + '</span><span class="proj">proj ' + fmtPts(me.projFinal) + '</span></div>';
    var matchHtml = "";
    if (!opps.length) {
      matchHtml = '<div class="gd-note">No head-to-head opponent this week (bye) — your All-Play result still counts below.</div>';
    } else {
      matchHtml = opps.map(function (o, i) {
        var wp = winProb(me, o); var meWin = me.projFinal >= o.projFinal;
        var margin = me.projFinal - o.projFinal;
        var pill = meWin ? '<span class="gd-sb-pill win">Winning</span>' : '<span class="gd-sb-pill lose">Losing</span>';
        var wpPct = Math.round(wp * 100);
        var expanded = STATE.sbExpand === o.fid;
        return '<div class="gd-sb-match">' +
          '<div class="gd-sb-match-row" data-oppexp="' + esc(o.fid) + '">' +
            '<div class="gd-sb-opp"><span class="vs">vs</span> ' + esc(o.name) + ' ' + pill + '</div>' +
            '<div class="gd-sb-nums"><span class="s">' + fmtPts(me.live) + ' – ' + fmtPts(o.live) + '</span>' +
              '<span class="p">proj ' + fmtPts(me.projFinal) + ' – ' + fmtPts(o.projFinal) + ' (' + (margin >= 0 ? '+' : '') + fmtPts(margin) + ')</span></div>' +
            '<div class="gd-sb-wp"><div class="gd-sb-wpbar"><div class="fill" style="width:' + wpPct + '%"></div></div><span class="wpn">' + wpPct + '%</span></div>' +
            '<div class="gd-sb-exp">' + (expanded ? '▾' : '▸') + '</div>' +
          '</div>' +
          (expanded ? '<div class="gd-sb-oppros">' + rosterTable(o) + '</div>' : '') +
        '</div>';
      }).join("");
    }

    // ---- Section 2: My roster live ----
    var myRoster = '<div class="gd-sb-sec-head">Your starters</div>' + rosterTable(me);

    // ---- Section 3: All-Play board ----
    var all = sbFranchises().map(function (f) { return sbCompute(f.id); }).filter(function (x) { return x.hasData; });
    var metricOf = function (x) { return sbView === "live" ? x.live : x.projFinal; };
    all.sort(function (a, b) { return metricOf(b) - metricOf(a); });
    var apRows = all.map(function (x, i) {
      var beat = all.filter(function (y) { return y.fid !== x.fid && metricOf(y) < metricOf(x); }).length;
      var tied = all.filter(function (y) { return y.fid !== x.fid && metricOf(y) === metricOf(x); }).length;
      var mine = x.fid === STATE.viewerFranchiseId;
      return '<tr' + (mine ? ' class="me"' : '') + '><td class="rk">' + (i + 1) + '</td><td>' + esc(x.name) + '</td>' +
        '<td class="gd-taxi-sal" style="color:var(--fg)">' + fmtPts(x.live) + '</td>' +
        '<td class="gd-taxi-sal" style="color:var(--accent)">' + fmtPts(x.projFinal) + '</td>' +
        '<td class="gd-taxi-pos">' + beat + '–' + (all.length - 1 - beat - tied) + (tied ? '–' + tied : '') + '</td></tr>';
    }).join("");
    var allplay = '<div class="gd-sb-sec-head">All-Play board ' +
      '<span class="gd-sb-toggle"><button type="button" data-sbview="proj"' + (sbView === "proj" ? ' class="on"' : '') + '>Proj final</button>' +
      '<button type="button" data-sbview="live"' + (sbView === "live" ? ' class="on"' : '') + '>Live</button></span></div>' +
      '<table class="gd-taxi-table gd-sb-ap"><thead><tr><th class="rk">#</th><th>Team</th><th style="text-align:right">Live</th><th style="text-align:right">Proj</th><th>Beating</th></tr></thead><tbody>' + apRows + '</tbody></table>';

    el.innerHTML = hdr + myCard + matchHtml + myRoster + allplay +
      '<div class="gd-ls-actions" style="margin-top:16px"><a class="gd-link-btn alt" href="' + esc(nativeUrl) + '" target="_blank" rel="noopener">MFL Live Scoring ↗</a></div>';

    el.querySelectorAll("[data-oppexp]").forEach(function (r) {
      r.addEventListener("click", function () { var id = r.getAttribute("data-oppexp"); STATE.sbExpand = (STATE.sbExpand === id) ? null : id; render(); });
    });
    el.querySelectorAll("[data-sbview]").forEach(function (b) {
      b.addEventListener("click", function () { STATE.sbView = b.getAttribute("data-sbview"); render(); });
    });
    bindWeekControls(el);
    scheduleSbPoll();
  }

  // Live roster table (used for "my starters" + expandable opponent rosters).
  // MFL player page for the selected week — the canonical per-player scoring
  // breakdown (raw stats → points), perfectly aligned with MFL. (An in-app
  // breakdown via a worker scrape of this page is a planned follow-up.)
  function mflPlayerUrl(pid) {
    var wk = sbWeek();
    return "//" + CTX.host + "/" + encodeURIComponent(sbYear()) + "/player?L=" + encodeURIComponent(CTX.leagueId) +
      "&P=" + encodeURIComponent(pid) + (wk ? "&W=" + encodeURIComponent(wk) : "");
  }
  function rosterTable(team) {
    if (!team.starters.length) return '<div class="gd-stub" style="padding:14px">No starters scored yet.</div>';
    return '<table class="gd-taxi-table gd-sb-ros"><thead><tr><th>Player</th><th>Pos</th><th>NFL</th><th>State</th><th style="text-align:right">Live</th><th style="text-align:right">Proj</th></tr></thead><tbody>' +
      team.starters.map(function (p) {
        var st = p.done ? '<span class="gd-sb-st done">Final</span>'
          : p.playing ? '<span class="gd-sb-st now">● ' + Math.ceil(p.gsr / 60) + "'</span>"
          : '<span class="gd-sb-st yet">Yet</span>';
        var inj = injuryShort(p.status) ? ' <span class="gd-sb-inj">' + esc(injuryShort(p.status)) + '</span>' : "";
        var nameCell = '<a class="gd-plink" href="' + esc(mflPlayerUrl(p.pid)) + '" target="_blank" rel="noopener" title="Scoring breakdown on MFL">' + esc(p.name) + '</a>';
        return '<tr><td>' + nameCell + inj + '</td><td class="gd-taxi-pos">' + esc(p.pos || "—") + '</td>' +
          '<td class="gd-taxi-pos">' + esc(p.nfl || "—") + '</td><td>' + st + '</td>' +
          '<td class="gd-taxi-sal" style="color:var(--fg)">' + fmtPts(p.live) + '</td>' +
          '<td class="gd-taxi-sal" style="color:var(--accent)">' + fmtPts(p.projFinal) + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  // ---------- boot ----------
  loadData().then(function () {
    render();
    if (STATE.loadErrors.length && !STATE.viewerFranchiseId) {
      // Surfaced inside the lineup/taxi stubs; keep a console trace for diagnostics.
      try { console.warn("[gameday] load issues:", STATE.loadErrors); } catch (e) {}
    }
  }).catch(function (err) {
    root.innerHTML = '<div class="gd-wrap"><div class="gd-err">Game Day failed to load: ' + esc(err && err.message || err) + '</div></div>';
  });
})();
</script>
</body>
</html>
