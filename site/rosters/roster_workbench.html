<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UPS Roster Workbench</title>
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="./roster_workbench.css">
</head>
<body>
  <div id="roster-workbench"></div>
  <!-- Shared master player-profile modal — loaded before roster_workbench.js
       so window.UPS_openPlayerProfile is defined when Roster Workbench builds
       its player-action modal. Defensive: if this file 404s on jsDelivr (or
       isn't present yet on a given branch), Roster Workbench falls back to
       its own local Bio/Stats/Game Log/News implementation. -->
  <script src="../shared/cap_math.js" defer></script>
  <script src="../shared/player_profile_master.js" defer></script>
  <script src="./roster_workbench.js" defer></script>
</body>
</html>
