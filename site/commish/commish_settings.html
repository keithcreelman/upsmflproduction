<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commish Settings — UPS League</title>
<!-- build 2026.07.13.1 — +🧠 Draft Intel (4th War Room view) + Live Board tier-depletion cockpit -->
<!-- build 2026.07.13.2 — +🗓️ Auction Dates → MFL panel (commish-editable timeline → MFL calendar push) -->
<!-- build 2026.07.13.3 — Auction Dates simplified to roster cut/lock date only (WAIVER_LOCK); commit gated by franchise_id (no key prompt) -->
<!-- build 2026.07.13.4 — Auction Dates = open + close → one AUCTION_START event (dropped roster cut/waiver lock) -->
<!-- build 2026.07.14.1 — +cut deadline (CUSTOM marker) alongside auction open + close -->
<!-- build 2026.07.14.2 — "Update League Calendar": Trade/Rookie/ERA/FAA → MFL (correct types incl WAIVER_NONE) + D1 league_events (mobile sync) -->
<!-- build 2026.07.20.1 — ❤️ Health landing tab (config audit + heartbeats + flags board + test residue); grouped tab bar (Dashboard/League Config/Live Ops/Controls); Status folded into Health drill-ins; Kill Switches → domain cards with dark→live chains; dead AI-workbench JS removed -->

<style>
  :root {
    --bg: #0b0f18; --panel: #141a26; --panel2: #1a2230; --line: #2a3446;
    --fg: #e8edf5; --muted: #8a97ad; --accent: #5b8dff; --warn: #fbbf24; --ok: #4ade80; --danger: #f87171;
    /* Aliases so the panels ported from the Front Office app (which reference
       --border / --panel-alt / --text via inline styles) render unchanged. */
    --border: #2a3446; --panel-alt: #1a2230; --text: #e8edf5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  .cs-wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .cs-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .cs-head h1 { font-size: 22px; margin: 0; }
  .cs-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 7px; }
  .cs-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; line-height: 1.5; }
  .cs-gate { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* Top tab bar — 4 labeled sections (Dashboard · League Config · Live Ops · Controls) */
  .cs-tabs { display: flex; gap: 0; flex-wrap: wrap; align-items: flex-end; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .cs-tabgrp { display: flex; flex-direction: column; border-right: 1px solid var(--line); padding-right: 10px; margin-right: 10px; }
  .cs-tabgrp:last-child { border-right: 0; padding-right: 0; margin-right: 0; }
  .cs-tabgrp-l { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); opacity: 0.8; padding: 0 14px 1px; }
  .cs-tabgrp-btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .cs-tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font-weight: 600; font-size: 13.5px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
  .cs-tabs button:hover { color: var(--fg); }
  .cs-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ❤️ Health dashboard tiles */
  .hv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .hv-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .hv-tile.bad { border-color: rgba(248,113,113,0.55); }
  .hv-tile.wide { grid-column: 1 / -1; }
  .hv-tile h3 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hv-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .hv-missing { font-size: 12px; color: var(--danger); margin: 3px 0; }
  .hv-chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--panel2); margin: 0 4px 5px 0; white-space: nowrap; }
  .hv-chip.on { color: #fff; background: #1f8a4c; border-color: #1f8a4c; }
  .hv-chip.danger-on { box-shadow: 0 0 0 2px rgba(248,113,113,0.7); }
  .hv-chip .ov { font-size: 9px; font-weight: 800; text-transform: uppercase; margin-left: 5px; opacity: 0.85; }
  .hv-flag-grp { margin: 7px 0; }
  .hv-flag-grp-l { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 3px; }

  /* Kill Switches — domain cards; escalation chains indent with ↳ */
  .ks-chain { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .ks-chain:last-child { border-bottom: 0; }
  .ks-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; }
  .ks-row.child { margin-left: 26px; }
  .ks-arrow { color: var(--muted); font-weight: 700; margin-right: 6px; }
  .ks-src { display: inline-block; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .ks-src.ov { color: var(--warn); border-color: rgba(251,191,36,0.45); }

  /* MFL Settings tab — identity tools + grouped setup cards */
  .cs-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .cs-tool { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 9px; text-decoration: none;
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font-weight: 600; font-size: 13px; }
  .cs-tool:hover { border-color: var(--accent); }
  .cs-tool.warn { color: var(--warn); border-color: rgba(251,184,107,0.4); }
  .cs-sech { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .cs-sech .lead { color: var(--accent); }
  .cs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cs-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .cs-card.caution { border-color: rgba(248,113,113,0.35); }
  .cs-card h3 { margin: 0 0 9px; font-size: 13.5px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .cs-card.caution h3 { color: var(--danger); }
  .cs-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .cs-card li a { display: block; padding: 5px 7px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 12.5px; }
  .cs-card li a:hover { background: var(--panel2); color: var(--accent); }
  .cs-card li a::after { content: "↗"; color: var(--muted); font-size: 10px; margin-left: 5px; }
  .cs-note { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.5; }

  /* Operational panels (ported from the FO app) */
  .fo-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .fo-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .fo-card-head h3 { font-size: 15px; margin: 0; }
  .fo-row-hint { font-size: 12px; color: var(--muted); background: var(--panel2); border-left: 3px solid var(--accent);
    padding: 8px 11px; border-radius: 6px; margin: 0 0 12px; line-height: 1.5; }
  .fo-table-loading { padding: 26px; text-align: center; color: var(--muted); }
  .fo-table-scroll { overflow-x: auto; }
  .fo-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fo-table th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 7px 8px; white-space: nowrap; }
  .fo-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .fo-table th.num, .fo-table td.num { text-align: right; }
  .fo-table-empty { text-align: center; color: var(--muted); padding: 18px; }
  .small { font-size: 11.5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
    cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  .btn.small { padding: 4px 10px; }
  .btn.warn { border-color: rgba(251,184,107,0.55); color: var(--warn); }
  .btn.secondary { color: var(--muted); font-weight: 500; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  /* Toast */
  #cs-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg); padding: 10px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 160ms, transform 160ms; z-index: 9999; }
  #cs-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #cs-toast.err { border-color: var(--danger); color: var(--danger); }
  #cs-toast.ok { border-color: var(--ok); }

  /* Auction War Room */
  .wr-vtabs { display: inline-flex; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .wr-vtabs button { background: transparent; border: 0; color: var(--muted); font-weight: 700; font-size: 13px; padding: 7px 16px; border-radius: 7px; cursor: pointer; }
  .wr-vtabs button.on { background: var(--accent); color: #0a1222; }
  .wr-budget { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted); }
  .wr-budget b { color: var(--fg); font-size: 15px; }
  .wr-results { margin-top: 6px; }
  .wr-res { padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .wr-res:hover { background: var(--panel2); color: var(--accent); }
  .wr-board { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .wr-tier-grp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .wr-tier-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 8px; }
  .wr-tgt { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .wr-tgt:last-child { border-bottom: 0; }
  .wr-tgt .nm { flex: 1 1 180px; }
  .wr-tgt input.wr-max { width: 56px; padding: 4px 6px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font-size: 12px; }
  .wr-tgt select.wr-tier { padding: 4px 6px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font-size: 12px; }
  .wr-rm { background: transparent; border: 0; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .wr-rm:hover { color: var(--danger); }
  .wr-conf { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .wr-conf.high { color: var(--ok); border-color: rgba(74,222,128,0.4); }
  .wr-conf.medium { color: var(--warn); border-color: rgba(251,191,36,0.4); }
  .wr-conf.low { color: var(--danger); border-color: rgba(248,113,113,0.5); }
  .wr-card.lowconf { border-color: rgba(248,113,113,0.35); }
  .wr-verif { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .wr-verif summary { font-size: 12.5px; font-weight: 700; color: var(--accent); cursor: pointer; }
  .wr-verif p { font-size: 12px; color: var(--fg); margin: 8px 0; line-height: 1.5; }
  .wr-verif ul { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  .wr-th { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 6px; }
  .wr-th.high { color: var(--danger); border: 1px solid rgba(248,113,113,0.5); background: rgba(248,113,113,0.08); }
  .wr-th.medium { color: var(--warn); border: 1px solid rgba(251,191,36,0.45); background: rgba(251,191,36,0.07); }
  .wr-th.low { color: var(--muted); border: 1px solid var(--line); }
  .wr-mini-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wr-mini-h { font-size: 12px; font-weight: 700; color: var(--fg); margin-bottom: 7px; }
  .wr-mini-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .wr-mini-row b { color: var(--accent); }
  .wr-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .wr-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .wr-card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .wr-stat-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .wr-stat-row b { color: var(--fg); }
  .wr-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .wr-badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .wr-badge.pounce { color: var(--danger); border-color: rgba(248,113,113,0.4); }
  .wr-badge.lurk { color: var(--warn); border-color: rgba(251,191,36,0.4); }
  .wr-badge.owl { color: var(--accent); border-color: rgba(91,141,255,0.4); }
  .wr-badge.whale { color: #c084fc; border-color: rgba(192,132,252,0.4); }
  .wr-heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; height: 16px; border-radius: 4px; overflow: hidden; }
  .wr-hr { display: block; height: 100%; }
  .wr-heat-ax { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin: 2px 0 9px; }
  .wr-hl { font-size: 12.5px; font-weight: 600; color: var(--fg); margin: 4px 0 8px; line-height: 1.4; }
  .wr-dl { margin: 0; font-size: 12px; line-height: 1.5; }
  .wr-dl dt { font-weight: 700; color: var(--accent); margin-top: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .wr-dl dt.vs { color: var(--danger); }
  .wr-dl dd { margin: 1px 0 0; color: var(--muted); }
  .wr-dl dd.vs { color: var(--fg); }
  .wr-ex { margin-top: 8px; }
  .wr-ex summary { font-size: 11.5px; color: var(--accent); cursor: pointer; }
  .wr-ex ul { margin: 6px 0 0; padding-left: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .wr-doc { margin-top: 6px; }
  .wr-doc summary { font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 8px 0; }
  .wr-doc pre { white-space: pre-wrap; font-size: 11.5px; line-height: 1.5; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; }
  /* ── FA Value view ── */
  .fo-sub { font-size: 11px; color: var(--muted); }
  .fav-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .fav-sg-h { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent); margin-bottom: 6px; }
  .fav-fit { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); margin: 0 4px 4px 0; color: var(--muted); }
  .fav-fit.need { color: #fbbf24; border-color: rgba(251,191,36,0.45); background: rgba(251,191,36,0.08); }
  .fav-fit.surp { color: #34d399; border-color: rgba(52,211,153,0.35); }
  .fav-fit.depth { color: #f59e0b; border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.07); }
  .fav-fit.ok { color: var(--muted); }
  .fav-fit.sm { font-size: 10px; padding: 1px 6px; }
  .fav-fit-w { display: inline-block; margin: 0 6px 4px 0; font-size: 11px; color: var(--muted); }
  .fav-comp.own { color: #c084fc; border: 1px solid rgba(192,132,252,0.4); background: rgba(192,132,252,0.08); }
  .fav-row.owned td:first-child { box-shadow: inset 3px 0 0 rgba(192,132,252,0.55); }
  .fav-rate { display: inline-block; font-size: 11px; font-weight: 600; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; margin: 0 4px 4px 0; }
  .fav-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .fav-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 12px; }
  .fav-cg { display: flex; align-items: center; gap: 6px; }
  .fav-cl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .wr-vtabs.sm { margin: 0; padding: 2px; }
  .wr-vtabs.sm button { font-size: 11px; padding: 4px 9px; }
  .fav-chk { font-size: 12px; color: var(--fg); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #fav-sort { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 12px; }
  .fav-bar { position: relative; height: 7px; background: var(--panel2); border-radius: 4px; margin-bottom: 3px; min-width: 120px; }
  .fav-bar-fill { position: absolute; top: 0; height: 100%; background: linear-gradient(90deg, rgba(91,141,255,0.35), rgba(52,211,153,0.55)); border-radius: 4px; }
  .fav-bar-tick { position: absolute; top: -2px; width: 2px; height: 11px; background: var(--fg); border-radius: 1px; }
  .fav-apw { font-size: 11px; color: var(--muted); } .fav-apw b { color: var(--fg); }
  .fav-rk { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .fav-px { display: block; font-size: 10px; color: var(--muted); }
  .fav-v { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .fav-v.sp { color: #0a1222; background: #34d399; } .fav-v.val { color: #0a1222; background: var(--accent); }
  .fav-v.fair { color: var(--muted); border: 1px solid var(--line); } .fav-v.over { color: #fff; background: var(--danger); }
  .fav-v.dart { color: #0a1222; background: #c084fc; }
  .fav-est { color: #fbbf24; font-weight: 800; margin-left: 3px; }
  .fav-vr.pos { color: #34d399; font-weight: 800; } .fav-vr.posL { color: #5b8dff; font-weight: 700; } .fav-vr.neg { color: var(--danger); }
  .fav-comp { display: inline-block; font-size: 10.5px; color: var(--muted); background: var(--panel2); border-radius: 5px; padding: 1px 6px; margin: 0 3px 2px 0; }
  .fav-comp.big { font-size: 12px; padding: 3px 9px; color: var(--fg); }
  .fav-row { cursor: pointer; } .fav-row:hover { background: var(--panel2); }
  .fav-detail td { background: var(--panel2); }
  .fav-dwrap { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; padding: 4px 2px; }
  .fav-dh { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .fav-dwhy { font-size: 12.5px; color: var(--fg); line-height: 1.5; margin-bottom: 8px; }
  .fav-dmeta { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .fav-table td { vertical-align: middle; }
  /* inflation panel */
  .fav-infl { border-left: 3px solid var(--line); }
  .fav-infl.hot { border-left-color: var(--danger); } .fav-infl.cool { border-left-color: #5b8dff; }
  .fav-infl-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; align-items: center; }
  .fav-infl-big { display: flex; align-items: center; gap: 10px; }
  .fav-infl-x { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .fav-infl.hot .fav-infl-x { color: var(--danger); } .fav-infl.cool .fav-infl-x { color: #5b8dff; }
  .fav-infl-lab { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); line-height: 1.35; }
  .fav-infl-ms { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .fav-infl-m { font-size: 11.5px; color: var(--muted); } .fav-infl-m b { color: var(--fg); font-size: 13px; margin-left: 5px; }
  .fav-infl-note { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }
  /* live auction overlay */
  .fav-live { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 4px 0 9px; }
  .fav-live.on { color: #34d399; } .fav-live.on b { color: #34d399; }

  var WORKER_BASE = (function () {

  };

    // The worker's commish gates check the API key FIRST, so a stored key wins
    // even when a session token is present. The old code returned early on the

  function paintScouting(host) {

    var byThreat = cards.filter(function (c) { return c.fid !== "0008"; }).sort(function (a, b) {
      var r = (rank[a.threat_level] || 9) - (rank[b.threat_level] || 9);
      return r || ((h2h[b.fid] || {}).opp_w || 0) - ((h2h[a.fid] || {}).opp_w || 0);

    var fids = byThreat.map(function (c) { return c.fid; });

      (verif ? '<details class="wr-verif"><summary>🔎 Trust check — adversarially verified (' + verdicts.length + ' verifiers)</summary>' +
        '<p>' + esc(verif.note) + '</p><ul>' + (verif.key_corrections || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></details>' : "") +

      '<div class="fo-card"><div class="fo-card-head"><h3>🎯 Danger Board</h3><span class="small" style="color:var(--muted)">ranked by threat to 0008</span></div>' +
      '<div class="fo-table-scroll"><table class="fo-table"><thead><tr><th class="num">#</th><th>Owner</th><th>Threat</th><th class="num" title="Your record in shared SF lots">You</th><th class="num" title="Pounce rate">⚡</th><th class="num" title="Times the underbidder">🥷</th><th>Read</th></tr></thead><tbody>' + dbRows + '</tbody></table></div></div>' +

      '<div class="fo-card"><div class="fo-card-head"><h3>Your two fears</h3></div>' + fearBlock + '</div>' +

      '<div class="cs-sech"><span class="lead">Scouting cards</span></div><div class="wr-cards">' + cardHtml + '</div>' +

      '<div class="fo-card"><div class="fo-card-head"><h3>Position $ thresholds (SF) — what is "rare" for the price</h3></div><div class="fo-table-scroll">' + ptHtml + '</div>' +
      '<div class="small" style="color:var(--muted);margin-top:8px">p90 = a top-10% price for that position. A $10K LB is rare; a $30K WR is routine.</div></div>' +

      '<div class="fo-card"><div class="fo-card-head"><h3>Contender roster benchmark</h3><span class="small" style="color:var(--muted)">PF bar ≈ ' + (bm.pf_bar || '—') + '/season</span></div>' +
      '<div class="fo-table-scroll"><table class="fo-table"><thead><tr><th>Season</th><th class="num">AP</th><th>Team</th><th class="num">All-play</th><th class="num">PF</th></tr></thead><tbody>' + bmRows + '</tbody></table></div>' +

  }

  // ════════════════════════════════════════════════════════════════════
  // DISCORD ROUTING — per-mechanism prod/test channel (POST /admin/commish-settings)
  // ════════════════════════════════════════════════════════════════════
  function renderDiscordRouting() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading Discord routing…</div></div>';
    fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L)).then(function (data) {
      if (CS.tab !== myTab) return;   // tab switched while the fetch was in flight
      var cfg = (data && data.discord_routing) || {};
      var labels = { extension: "Extension", myac: "Auction Contract (FA + MYAC)", auctionbidding: "Auction Bidding (live bid/nom narration)", restructure: "Restructure", tag: "Tag / Untag", mym: "MYM", traderoast: "Trade Roast bot (trades always post to #transactions)" };
      var rowHtml = Object.keys(labels).map(function (k) {
        var val = String(cfg[k] || "prod").toLowerCase();
        var seg = ["prod", "test"].map(function (o) {
          var on = val === o, c = o === "test" ? "#e67e22" : "#1f8a4c";
          return '<button type="button" class="fo-route-btn" data-route="' + k + '" data-val="' + o + '" style="padding:4px 14px;border:1px solid var(--border);background:' + (on ? c : "var(--panel-alt)") + ";color:" + (on ? "#fff" : "var(--text)") + ";cursor:pointer;font-weight:" + (on ? "600" : "400") + ";" + (o === "prod" ? "border-radius:4px 0 0 4px;" : "border-radius:0 4px 4px 0;border-left:none;") + '">' + (o === "prod" ? "Prod" : "Test") + "</button>";
        }).join("");
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);"><span>' + esc(labels[k]) + '</span><span style="display:inline-flex;">' + seg + "</span></div>";
      }).join("");
      host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Discord Routing</h3></div>' +
        '<p class="fo-row-hint">💡 Per-mechanism: where contract announcements post. <strong style="color:#1f8a4c;">Prod</strong> = league channel · <strong style="color:#e67e22;">Test</strong> = test channel. Dry-run submissions always go to test regardless. Saved to D1 instantly.</p>' +
        rowHtml + "</div>";
      $$(".fo-route-btn", host).forEach(function (btn) {
        btn.addEventListener("click", function () {
          var k = btn.getAttribute("data-route"), v = btn.getAttribute("data-val");
          if (String(cfg[k] || "prod").toLowerCase() === v) return;
          var upd = {}; upd[k] = v;
          postJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L), { discord_routing: upd })
            .then(function () { toast((labels[k] || k) + " → " + (v === "test" ? "Test" : "Prod"), "ok"); })
            .catch(function (e) { toast("Failed: " + (e.message || String(e)), "err"); })
            .then(function () { renderDiscordRouting(); });
        });
      });
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Failed to load: ' + esc(e.message || String(e)) + "</div></div>";
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // MISSED NOMINATIONS — §F RULE 2 ledger + the immunity override
  // ════════════════════════════════════════════════════════════════════
  // Canon T4.3a fines a missed nomination $3K/$7K/$15K, escalating, applied to
  // BOTH the current season and the next. The caveat is the reason this screen
  // exists: "if there's some family emergency... let us know and it won't be
  // held against you." Canon quotes "a member of a CC" — that body no longer
  // exists (Keith 2026-07-15), so notice to THE LEAGUE is the standard, and it
  // is a heads-up rather than an application ("in Yellowstone, no service"). A
  // fine system with no way to honour that will eventually fine someone who
  // called first — worse than no system.
  //
  // Excusing VOIDS, it does not delete. The row stays as evidence the owner
  // gave notice, which is exactly what protects them the next time it comes up.
  function renderNomFines() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading missed nominations…</div></div>';
    fetchJSON(apiUrl("/admin/auction/nom-compliance") + "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR))
      .then(function (data) {
        if (CS.tab !== myTab) return;
        var days = (data && data.days) || [];
        var names = (data && data.franchise_names) || {};
        var armed = !!(data && data.penalties_armed);
        var nm = function (fid) { return names[fid] || ("Team " + fid); };

        var banner = armed
          ? '<p class="fo-row-hint" style="border-left:3px solid #c0392b;padding-left:8px;">⚠️ <strong>Fines are ARMED</strong> — these are real cap adjustments. Excusing a day that already posted to MFL needs the salaryAdj reversed by hand; the row below will say so.</p>'
          : '<p class="fo-row-hint" style="border-left:3px solid #1f8a4c;padding-left:8px;">🌑 <strong>Fines are DARK</strong> — misses are recorded and counted, but no money has moved. Nothing here has been charged.</p>';

        if (!days.length) {
          host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>⚖️ Missed Nominations — §F RULE 2</h3></div>' +
            banner + '<p class="fo-row-hint">No missed nominations recorded this auction. 🎉</p>' +
            '<p class="fo-row-hint" style="color:var(--muted);">A day is only recorded once it CLOSES (midnight ET) — the 9 AM report is what writes it. Today in progress will never appear here.</p></div>';
          return;
        }

        var rows = days.map(function (d) {
          var pens = (d.penalties || []).filter(function (p) { return !p.voided; });
          var thisYr = pens.filter(function (p) { return Number(p.applies_to_season) === Number(data.season); });
          var nextYr = pens.filter(function (p) { return Number(p.applies_to_season) === Number(data.season) + 1; });
          var posted = (d.penalties || []).some(function (p) { return Number(p.posted_to_mfl) === 1; });
          var off = (d.penalties || [])[0] ? Number((d.penalties || [])[0].offense_no) : 0;
          var k = function (arr) { return arr.reduce(function (s, p) { return s + Number(p.amount_k || 0); }, 0); };
          var voided = Number(d.voided) === 1;

          var money = voided
            ? '<span style="color:#1f8a4c;font-weight:600;">excused — no fine</span>'
            : (off > (data.fine_schedule_k || []).length
                ? '<span style="color:#c0392b;font-weight:600;">league-fit review (no fine)</span>'
                : '<strong>$' + k(thisYr) + 'K</strong> this season · <strong>$' + k(nextYr) + 'K</strong> next');

          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);' + (voided ? 'opacity:.6;' : '') + '">' +
            '<span style="flex:1;">' +
              '<strong>' + esc(nm(d.fid)) + '</strong> — ' + esc(d.et_day) +
              (voided ? ' <span style="color:#1f8a4c;">✅ excused</span>' : ' <span style="color:#c0392b;">⚠️ offense #' + off + '</span>') +
              '<br><span class="small" style="color:var(--muted);">' +
                'nominated ' + Number(d.noms_used) + '/' + Number(d.noms_required) +
                ' · ' + Number(d.total_deficit) + ' roster spot(s) still open · ' + money +
              '</span>' +
              (voided && d.void_reason ? '<br><span class="small" style="color:var(--muted);opacity:.8;">reason: ' + esc(d.void_reason) + '</span>' : "") +
              (posted && !voided ? '<br><span class="small" style="color:#c0392b;">posted to MFL — excusing this needs a manual salaryAdj reversal</span>' : "") +
            '</span>' +
            '<button type="button" class="fo-void-btn" data-fid="' + esc(d.fid) + '" data-day="' + esc(d.et_day) + '" data-undo="' + (voided ? "1" : "0") + '" ' +
              'style="flex:0 0 auto;padding:5px 14px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:' + (voided ? "var(--panel-alt)" : "#7a7f87") + ';color:' + (voided ? "var(--text)" : "#fff") + ';">' +
              (voided ? "Restore fine" : "Excuse") + '</button>' +
          '</div>';
        }).join("");

        host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>⚖️ Missed Nominations — §F RULE 2</h3></div>' +
          banner +
          '<p class="fo-row-hint">💡 <strong>Excuse</strong> an owner who had an emergency, or who told the league ahead of time they would be out of pocket (canon §T4.3a — the CC no longer exists, so notice to the league is the standard; e.g. &quot;in Yellowstone, no service&quot;). It voids the day, its fines, and drops it from their offense count — then re-derives the rest, so excusing a 2nd miss makes the 3rd become the 2nd ($7K, not $15K). Re-pricing only ever moves a fine down. Excusing keeps the record; it does not delete it.</p>' +
          '<p class="fo-row-hint" style="color:var(--muted);">Fines escalate $' + (data.fine_schedule_k || []).join("K → $") + 'K, each applied to this season <em>and</em> next. The next-season half is booked here but does not reach MFL until the rollover.</p>' +
          rows + "</div>";

        $$(".fo-void-btn", host).forEach(function (btn) {
          btn.addEventListener("click", function () {
            var fid = btn.getAttribute("data-fid"), day = btn.getAttribute("data-day");
            var undo = btn.getAttribute("data-undo") === "1";
            var reason = "";
            if (!undo) {
              reason = window.prompt('Excuse ' + nm(fid) + ' for ' + day + '?\n\nWhy? (e.g. "gave notice 7/13", "family emergency") — this is kept on the record.');
              if (reason === null) return;
            } else if (!window.confirm("Restore the fine for " + nm(fid) + " on " + day + "?")) {
              return;
            }
            postJSON(apiUrl("/admin/auction/void-nom-day"), {
              season: YEAR, league_id: L, fid: fid, et_day: day, reason: reason, undo: undo
            })
              .then(function (r) {
                toast(undo ? "Fine restored" : "Excused — no fine", "ok");
                if (r && r.needs_mfl_reversal) {
                  window.alert("Heads up: " + r.needs_mfl_reversal + " penalty row(s) had already POSTED to MFL. Voiding here does NOT undo that — reverse the salaryAdj in MFL by hand.");
                }
              })
              .catch(function (e) { toast("Failed: " + (e.message || String(e)), "err"); })
              .then(function () { renderNomFines(); });
          });
        });
      })
      .catch(function (e) {
        if (CS.tab !== myTab) return;
        host.innerHTML = '<div class="fo-card"><p class="fo-row-hint" style="color:#c0392b;">Failed to load: ' + esc(e.message || String(e)) + "</p></div>";
      });
  }

  // ════════════════════════════════════════════════════════════════════
  // KILL SWITCHES — runtime feature flags (POST /admin/commish-settings)
  // ════════════════════════════════════════════════════════════════════
  // ════════════════════════════════════════════════════════════════════
  // RULE PROPOSALS v2 — author a proposal, publish it into the Hall voting
  // engine (thread + tally + per-owner DM cards with Approve/Decline/Discuss).
  // DARK LAUNCH: while RULE_PROPOSALS_LIVE is off, every publish DMs only the
  // commish and runs in the test channel — rehearse until comfortable, then
  // flip the switch in Kill Switches. (Keith 2026-07-15.)
  // ════════════════════════════════════════════════════════════════════
  // Proposals-list UI state (survives tab re-renders). testOnly=false hides
  // [test] proposals from the list (default); true shows ONLY tests so they
  // can be reviewed and deleted.
  var RPUI = { testOnly: false };

  function renderRuleProps() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading rule proposals…</div></div>';
    fetchJSON(apiUrl("/admin/rule-proposals") + "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR))
      .then(function (data) {
        if (CS.tab !== myTab) return;
        var flags = (data && data.flags) || {};
        var props = (data && data.proposals) || [];
        var qa = (data && data.qa_log) || [];

        var banner = flags.live
          ? '<p class="fo-row-hint" style="border-left:3px solid #c0392b;padding-left:8px;">🟢 <strong>LIVE</strong> — publishing fans out to EVERY active owner and posts in the Rules channel. Use the test-mode checkbox to rehearse a single proposal.</p>'
          : '<p class="fo-row-hint" style="border-left:3px solid #1f8a4c;padding-left:8px;">🌑 <strong>DARK</strong> — every publish DMs only YOU and runs in the test channel (passes at 1 YES so you can walk the whole flow solo). Flip <strong>Rule proposals LIVE</strong> in Kill Switches when ready.</p>';

        var defaultDeadline = new Date(Date.now() + 7 * 86400000);
        var dlPad = function (n) { return (n < 10 ? "0" : "") + n; };
        var dlLocal = defaultDeadline.getFullYear() + "-" + dlPad(defaultDeadline.getMonth() + 1) + "-" + dlPad(defaultDeadline.getDate()) + "T21:00";

        // In-app AI drafting workbench removed — rule drafting now happens in a
        // dedicated Claude Code session; the commish pastes the finished block
        // straight into the New Rule Proposal form below.
        var wbCard = '';

        var form =
          '<div class="fo-card"><div class="fo-card-head"><h3>📜 New Rule Proposal</h3></div>' + banner +
          '<div style="display:grid;gap:8px;max-width:760px;">' +
            '<label style="font-weight:700;">Round title <span style="font-weight:400;opacity:.65;font-size:12px;">— the batch headline (optional for one rule; used as the announcement title for a multi-rule post)</span><br>' +
              '<input type="text" id="rp-round-title" style="width:100%;" placeholder="e.g. July Rules Package — QB caps + taxi cleanup"></label>' +
            '<label style="font-weight:700;">① Proposal(s) — paste the owner-facing block. For MULTIPLE rules in one post, separate each with a line <code>=== NEXT RULE ===</code><br>' +
              '<textarea id="rp-proposal" rows="12" style="width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;" placeholder="Paste one or more rules. Each is parsed into title / tldr / rule text / rationale / supporting data — the fields owners see. Separate multiple rules with a line:  === NEXT RULE ===  . Hit Preview to check the parse before publishing."></textarea></label>' +
            '<div class="fo-row-hint" style="margin-top:-2px;">Auto-parsed per rule: the <b>**title:**</b> / <b>**tldr:**</b> lines + <b>## body_md</b> / <b>## rationale_md</b> / <b>## supporting_data_md</b> sections. Split multiple rules with <code>=== NEXT RULE ===</code>; Preview shows every rule captured.</div>' +
            '<div style="margin-top:6px;padding-top:8px;border-top:1px dashed rgba(128,128,128,.45);">' +
              '<label style="font-weight:700;">🔒 ② Rule change on approval — canon edits (Block 2 — COMMISH-ONLY, never shown to owners)<br>' +
                '<textarea id="rp-canon" rows="8" style="width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;" placeholder="Paste the Rule-Change ledger (Block 2): the exact edits to docs/league_context_v1.md to apply IF this passes, plus the changelog entry. For multiple rules, separate each rule&#39;s canon block with the SAME === NEXT RULE === line, in the same order. Never sent in the owner DM or thread. Stored + logged pass or fail."></textarea></label>' +
              '<div class="fo-row-hint" style="margin-top:2px;">Owners never see this. One canon block per rule (same <code>=== NEXT RULE ===</code> order); stored with each proposal and written to the version-controlled changelog when you rule the outcome — pass or fail.</div>' +
            '</div>' +
            '<div style="display:flex;gap:16px;flex-wrap:wrap;">' +
              '<label>Passes at (YES votes) <input type="number" id="rp-pass" min="1" max="12" value="7" style="width:70px;"></label>' +
              '<label title="How often non-voters get a DM reminder for THIS round. Quiet hours (10 PM–6 AM ET) always apply.">Nudge cadence <select id="rp-nudge">' +
                '<option value="">Default (48h, then daily after day 6)</option>' +
                '<option value="24">Every 24h</option>' +
                '<option value="12">Every 12h</option>' +
                '<option value="72">Every 3 days</option>' +
                '<option value="0">Off (no nudges)</option>' +
              '</select></label>' +
              '<label>Deadline <input type="datetime-local" id="rp-deadline" value="' + dlLocal + '"></label>' +
              '<label>Category <input type="text" id="rp-category" value="rules" style="width:120px;"></label>' +
              '<label><input type="checkbox" id="rp-testmode"' + (flags.live ? '' : ' checked disabled') + '> test mode (solo + test channel)</label>' +
            '</div>' +
            '<div><button type="button" class="fo-btn" id="rp-preview-btn">Preview</button> ' +
            '<button type="button" class="fo-btn" id="rp-publish-btn" style="font-weight:700;">' + (flags.live ? '🚀 Publish to league' : '🌑 Publish (dark — DMs only you)') + '</button></div>' +
            '<pre id="rp-preview" style="display:none;white-space:pre-wrap;background:rgba(128,128,128,.08);padding:10px;border-radius:8px;font-size:12px;"></pre>' +
          '</div></div>';

        var testCount = props.filter(function (pr) { return Number(pr.test_only) === 1; }).length;
        // Default view HIDES [test] proposals; the Test-only toggle flips to
        // showing ONLY tests (where the delete buttons live).
        var visibleProps = props.filter(function (pr) {
          var isTest = Number(pr.test_only) === 1;
          return RPUI.testOnly ? isTest : !isTest;
        });
        var rows = visibleProps.map(function (pr) {
          var isTest = Number(pr.test_only) === 1;
          var tally = '✅ ' + (pr.yes || 0) + ' · ❌ ' + (pr.no || 0) + ' · ➖ ' + (pr.abstain || 0) + ' / needs ' + (pr.pass_yes_count || 7);
          var st = pr.final_outcome
            ? (pr.final_outcome === 'passed' ? '✅ PASSED' : pr.final_outcome === 'rejected' ? '❌ REJECTED' : pr.final_outcome.toUpperCase()) + (pr.close_reason === 'commish_ruling' ? ' (ruling)' : '')
            : (pr.round_status === 'open' ? '🗳 open' : pr.round_status);
          var testTag = isTest ? ' <span style="opacity:.65;">[test]</span>' : '';
          var link = pr.thread_url ? ' · <a href="' + esc(pr.thread_url) + '" target="_blank" rel="noopener">thread ↗</a>' : '';
          var controls = '';
          if (pr.round_status === 'open' && !pr.final_outcome) {
            controls =
              '<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
                '<select data-rpv-outcome="' + esc(pr.proposal_id) + '"><option value="passed">rule: PASSED</option><option value="rejected">rule: REJECTED</option></select>' +
                '<input type="text" data-rpv-reason="' + esc(pr.proposal_id) + '" placeholder="reason (posted to the league)" style="min-width:240px;">' +
                '<button type="button" class="fo-btn" data-rpv-btn="' + esc(pr.proposal_id) + '">⚖️ Rule (my voice)</button>' +
              '</div>';
          }
          var ruling =
            '<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
              '<input type="text" data-rpr-text="' + esc(pr.proposal_id) + '" placeholder="ruling / authoritative answer for the bot to trust" style="min-width:280px;">' +
              '<label style="font-size:12px;"><input type="checkbox" data-rpr-post="' + esc(pr.proposal_id) + '" checked> also post to thread</label>' +
              '<button type="button" class="fo-btn" data-rpr-btn="' + esc(pr.proposal_id) + '">Save ruling</button>' +
            '</div>';
          var delRow = isTest
            ? '<div style="margin-top:6px;">' +
                '<button type="button" class="fo-btn" data-rpdel="' + esc(pr.proposal_id) + '" title="Permanently delete this test proposal and its round, votes, and discussion" style="border-color:#a13b3b;color:#e06b6b;font-size:12px;padding:3px 10px;">🗑 Delete test</button>' +
              '</div>'
            : '';
          return '<div class="fo-card" style="margin-top:8px;"><strong>' + esc(pr.title) + '</strong>' + testTag +
            '<div class="fo-row-hint">' + st + ' · ' + tally + ' · 💬 ' + (pr.qa_count || 0) + ' discussions (' + (pr.surfaced_count || 0) + ' surfaced)' + link + '</div>' +
            controls + ruling + delRow + '</div>';
        }).join('');

        var qaRows = qa.slice(0, 15).map(function (q) {
          var head = (q.kind === 'keith_ruling' || q.kind === 'commish_verdict')
            ? '⚖️ RULING [' + esc(q.proposal_id) + ']: ' + esc(q.keith_ruling || '')
            : (q.surfaced ? '📢 ' : '🔒 ') + esc(q.display_name || 'owner') + ' (' + esc(q.kind) + ') [' + esc(q.proposal_id) + ']: ' + esc(q.question_text || '');
          var ans = q.bot_answer ? '<div style="opacity:.75;margin-left:12px;">🤖 ' + esc(String(q.bot_answer).slice(0, 240)) + '</div>' : '';
          return '<div style="margin:6px 0;font-size:12px;">' + head + ans + '</div>';
        }).join('');

        host.innerHTML = wbCard + form +
          '<div class="fo-card" style="margin-top:12px;">' +
            '<div class="fo-card-head" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">' +
              '<h3>Proposals' + (RPUI.testOnly ? ' <span style="font-weight:400;opacity:.6;font-size:13px;">— tests</span>' : '') + '</h3>' +
              '<label style="font-weight:400;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;">' +
                '<input type="checkbox" id="rp-test-only"' + (RPUI.testOnly ? ' checked' : '') + '> 🧪 Test-only (' + testCount + ')' +
              '</label>' +
            '</div>' +
            (rows || '<p class="fo-row-hint">' + (RPUI.testOnly ? 'No test proposals.' : 'None yet.') + '</p>') +
          '</div>' +
          '<div class="fo-card" style="margin-top:12px;"><div class="fo-card-head"><h3>Recent discussions (🔒 = private, 📢 = surfaced)</h3></div>' + (qaRows || '<p class="fo-row-hint">No discussions yet.</p>') + '</div>';

        var val = function (id) { return (document.getElementById(id) || {}).value || ''; };
        // Parse the pasted Block 1 (owner-facing proposal) into its fields, so
        // the commish pastes ONE block instead of typing five. Tolerant of the
        // drafting session's format: **title:** / **tldr:** lines + ## body_md /
        // ## rationale_md / ## supporting_data_md sections (### subheads stay
        // inside their section; the ## Canon Change block, if pasted here by
        // mistake, is ignored — it belongs in Block 2).
        function parseProposal(raw) {
          var t = String(raw || '').replace(/\r/g, '');
          function inline(label) {
            var m = t.match(new RegExp('\\*\\*\\s*' + label + '\\s*:?\\s*\\*\\*\\s*:?\\s*(.+)', 'i'));
            return m ? m[1].trim() : '';
          }
          var o = { title: inline('title'), tldr: inline('tldr'), body_md: '', rationale_md: '', supporting_data_md: '', pass: '', category: '' };
          t.split(/\n(?=##\s)/).forEach(function (sec) {
            var m = sec.match(/^##\s*([^\n]+)\n?([\s\S]*)$/);
            if (!m) return;
            var h = m[1].toLowerCase(), b = (m[2] || '').trim();
            if (/canon change/.test(h)) return;
            else if (/body|votable|the rule/.test(h)) o.body_md = b;
            else if (/rationale|why/.test(h)) o.rationale_md = b;
            else if (/support|data/.test(h)) o.supporting_data_md = b;
          });
          var pm = t.match(/\*\*\s*pass_yes_count\s*:?\s*\*\*\s*:?\s*(\d+)/i); if (pm) o.pass = pm[1];
          var cm = t.match(/\*\*\s*category\s*:?\s*\*\*\s*:?\s*([A-Za-z0-9_-]+)/i); if (cm) o.category = cm[1];
          return o;
        }
        // Split Block 1 (and Block 2 canon) into N rules on a "=== NEXT RULE ==="
        // delimiter line, pair canon blocks by order, and emit an items[] array.
        // One rule (no delimiter) => items.length 1, round_title defaults to the
        // rule's own title, so the single-rule round id is unchanged.
        var RULE_DELIM = /^[ \t]*={2,}[ \t]*NEXT RULE[ \t]*={2,}[ \t]*$/im;
        var buildBody = function () {
          var dl = val('rp-deadline');
          var chunks = String(val('rp-proposal') || '').split(RULE_DELIM)
            .map(function (s) { return s.trim(); }).filter(function (s) { return s.length; });
          if (!chunks.length) chunks = [''];
          var canonChunks = String(val('rp-canon') || '').split(RULE_DELIM)
            .map(function (s) { return s.trim(); });
          var parsed = chunks.map(function (c) { return parseProposal(c); });
          var items = parsed.map(function (p, i) {
            return {
              title: p.title, tldr: p.tldr, body_md: p.body_md,
              rationale_md: p.rationale_md, supporting_data_md: p.supporting_data_md,
              canon_change_md: (canonChunks[i] || '') || undefined,
            };
          });
          var roundTitle = val('rp-round-title').trim();
          return {
            round_title: roundTitle || (items[0] && items[0].title) || '',
            items: items,
            pass_yes_count: parseInt(val('rp-pass'), 10) || parseInt(parsed[0] && parsed[0].pass, 10) || 7,
            nudge_interval_hours: val('rp-nudge') === '' ? undefined : parseInt(val('rp-nudge'), 10),
            deadline_utc: dl ? new Date(dl).toISOString() : '',
            category: val('rp-category') || (parsed[0] && parsed[0].category) || 'rules',
            test_mode: !!(document.getElementById('rp-testmode') || {}).checked,
          };
        };
        document.getElementById('rp-preview-btn').addEventListener('click', function () {
          var b = buildBody();
          var pre = document.getElementById('rp-preview');
          pre.style.display = 'block';
          var out = [];
          out.push('── ROUND ──');
          out.push('Round title: ' + (b.round_title || '❌ MISSING') + '   ·   Rules in this post: ' + b.items.length);
          out.push('Deadline: ' + (b.deadline_utc || '(not set)') + '   ·   Passes at: ' + b.pass_yes_count + ' YES' + (b.test_mode || !flags.live ? ' (dark = 1)' : ''));
          out.push('');
          b.items.forEach(function (it, i) {
            var miss = [];
            if (!it.title) miss.push('title');
            if (!it.body_md) miss.push('rule text (## body_md)');
            out.push('── RULE ' + (i + 1) + (it.title ? ': ' + it.title : '') + ' ──');
            out.push('  title: ' + (it.title ? '✅' : '❌ MISSING') +
              '  ·  tldr: ' + (it.tldr ? '✅' : '⚠️ empty') +
              '  ·  rule text: ' + (it.body_md ? '✅' : '❌ MISSING') +
              '  ·  rationale: ' + (it.rationale_md ? '✅' : '⚠️ empty') +
              '  ·  supporting: ' + (it.supporting_data_md ? '✅' : '— none') +
              '  ·  canon: ' + (it.canon_change_md ? '✅' : '— none'));
            if (miss.length) out.push('  ⚠️ Could not parse: ' + miss.join(', ') + ' — needs a **title:** line and a ## body_md section.');
          });
          var it0 = b.items[0] || {};
          out.push('');
          out.push('── SAMPLE DM CARD (rule 1 of ' + b.items.length + ', each owner gets one per rule) ──');
          out.push('🏛 RULE PROPOSAL — ' + (it0.title || ''));
          out.push('');
          out.push(it0.tldr || '');
          out.push('[✅ Approve] [❌ Decline] [💬 Discuss]');
          pre.textContent = out.join('\n');
        });
        document.getElementById('rp-publish-btn').addEventListener('click', function () {
          var b = buildBody();
          if (!b.items.length) return toast('Paste at least one rule', 'err');
          for (var i = 0; i < b.items.length; i++) {
            var it = b.items[i];
            if (!it.title || it.title.length < 4) return toast('Rule ' + (i + 1) + ': title too short', 'err');
            if (!it.body_md || it.body_md.length < 10) return toast('Rule ' + (i + 1) + ': rule text too short (need a ## body_md section)', 'err');
          }
          if (b.items.length > 1 && !b.round_title) return toast('Give the round a title (top field) when posting multiple rules', 'err');
          if (!b.deadline_utc) return toast('Set a deadline', 'err');
          var darkNow = !flags.live || b.test_mode;
          var n = b.items.length;
          var msg = darkNow
            ? 'Publish DARK? ' + n + ' rule' + (n > 1 ? 's' : '') + ' — DMs only you, test channel, each passes at 1 YES.'
            : 'Publish LIVE to the whole league? ' + n + ' rule' + (n > 1 ? 's' : '') + ' — every active owner gets a DM card per rule. This is the real thing.';
          if (!window.confirm(msg)) return;
          var hour = new Date().getHours();
          if (!darkNow && (hour >= 22 || hour < 6) && !window.confirm('It is quiet hours (10 PM–6 AM ET) — owners get pinged NOW. Still publish?')) return;
          postJSON(apiUrl('/admin/rule-proposals/publish') + '?L=' + encodeURIComponent(L) + '&YEAR=' + encodeURIComponent(YEAR), b)
            .then(function (r) { toast('Published ' + r.round_id + ' (' + (r.item_count || n) + ' rule' + ((r.item_count || n) > 1 ? 's' : '') + ') — fan-out running (~15s)', 'ok'); setTimeout(renderRuleProps, 4000); })
            .catch(function (e) { toast('Publish failed: ' + e.message, 'err'); });
        });
        $$('[data-rpv-btn]', host).forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-rpv-btn');
            var outcome = (host.querySelector('[data-rpv-outcome="' + id + '"]') || {}).value;
            var reason = (host.querySelector('[data-rpv-reason="' + id + '"]') || {}).value;
            if (!reason) return toast('A reason is required — it goes to the league', 'err');
            if (!window.confirm('Rule ' + id + ' as ' + outcome.toUpperCase() + '? This closes the vote and announces with your reason.')) return;
            postJSON(apiUrl('/admin/rule-proposals/' + encodeURIComponent(id) + '/verdict') + '?L=' + encodeURIComponent(L) + '&YEAR=' + encodeURIComponent(YEAR), { outcome: outcome, reason: reason })
              .then(function () { toast('Ruled. Announcement is on its way.', 'ok'); setTimeout(renderRuleProps, 2500); })
              .catch(function (e) { toast('Refused: ' + e.message, 'err'); });
          });
        });
        $$('[data-rpr-btn]', host).forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-rpr-btn');
            var text = (host.querySelector('[data-rpr-text="' + id + '"]') || {}).value;
            var post = !!(host.querySelector('[data-rpr-post="' + id + '"]') || {}).checked;
            if (!text) return toast('Type the ruling first', 'err');
            postJSON(apiUrl('/admin/rule-proposals/' + encodeURIComponent(id) + '/ruling') + '?L=' + encodeURIComponent(L) + '&YEAR=' + encodeURIComponent(YEAR), { text: text, post_to_thread: post })
              .then(function () { toast('Ruling saved — the bot now treats it as authoritative.', 'ok'); setTimeout(renderRuleProps, 2000); })
              .catch(function (e) { toast('Failed: ' + e.message, 'err'); });
          });
        });

        // ── Test-only filter toggle + test-proposal delete ──
        var testOnlyCb = document.getElementById('rp-test-only');
        if (testOnlyCb) testOnlyCb.addEventListener('change', function () {
          RPUI.testOnly = testOnlyCb.checked;
          renderRuleProps();
        });
        $$('[data-rpdel]', host).forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.getAttribute('data-rpdel');
            if (!window.confirm('Permanently delete test proposal “' + id + '”?\n\nThis removes the proposal and its round, votes, and all discussion. Cannot be undone.')) return;
            btn.disabled = true;
            postJSON(apiUrl('/admin/rule-proposals/' + encodeURIComponent(id) + '/delete') + '?L=' + encodeURIComponent(L) + '&YEAR=' + encodeURIComponent(YEAR), {})
              .then(function () { toast('Deleted test ' + id, 'ok'); setTimeout(renderRuleProps, 600); })
              .catch(function (e) { btn.disabled = false; toast('Delete failed: ' + e.message, 'err'); });
          });
        });
      })
      .catch(function (e) {
        if (CS.tab !== myTab) return;
        host.innerHTML = '<div class="fo-card"><p class="fo-row-hint">Failed to load: ' + esc(e.message) + '</p></div>';
      });
  }

  // Domain cards: each chain is [parent, escalation…] — the parent is the dark
  // master and every flag after it escalates (dark → live), rendered indented
  // with ↳ so the pairs read side-by-side. Flags the worker reports that no
  // card claims land in "Other" so nothing silently disappears.
  var KS_DOMAINS = [
    { name: "🤝 Trades", chains: [
      ["TRADE_DM_ENABLED"],
      ["TRADE_3WAY_ENABLED", "TRADE_3WAY_EXECUTE"],
      ["TRADE_SENTINEL_ENABLED", "TRADE_SENTINEL_ACT_ENABLED", "TRADE_SENTINEL_ADOPT_NATIVE"]
    ] },
    { name: "🔨 Auction", chains: [
      ["AUCTION_INAPP_BID_ENABLED"],
      ["AUCTION_ERA_ENABLED"],
      ["AUCTION_FAA_ENABLED", "AUCTION_FAA_PENALTIES_ENABLED", "AUCTION_FAA_FINALIZE_ENABLED"],
      ["AUCTION_NIGHTLY_NUDGE_ENABLED"]
    ] },
    { name: "📜 Rule Proposals", chains: [
      ["RULE_PROPOSALS_ENABLED", "RULE_PROPOSALS_LIVE"],
      ["RULE_PROPOSALS_DRAFT_ENABLED"],
      ["RULE_PROPOSALS_AI_ENABLED"]
    ] },
    { name: "🪂 Drops", chains: [
      ["DROP_TRACKER_ENABLED", "DROP_TRACKER_AUTO_POST", "DROP_TRACKER_POST_MFL"]
    ] },
    { name: "📢 OTB", chains: [
      ["OTB_LIVE_MODE"]
    ] }
  ];

  function renderKillSwitches() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading kill switches…</div></div>';
    fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L)).then(function (data) {
      if (CS.tab !== myTab) return;
      var flags = (data && data.feature_flags) || [];
      var byKey = {};
      flags.forEach(function (f) { byKey[f.key] = f; });

      var flagRow = function (f, isChild) {
        var on = !!f.value;
        var seg = [["on", "On"], ["off", "Off"]].map(function (pair) {
          var o = pair[0], isOn = (o === "on") === on;
          var bg = isOn ? (o === "on" ? "#1f8a4c" : "#7a7f87") : "var(--panel-alt)";
          return '<button type="button" class="fo-flag-btn" data-flag="' + esc(f.key) + '" data-val="' + o + '" style="padding:4px 16px;border:1px solid var(--border);background:' + bg + ";color:" + (isOn ? "#fff" : "var(--text)") + ";cursor:pointer;font-weight:" + (isOn ? "600" : "400") + ";" + (o === "on" ? "border-radius:4px 0 0 4px;" : "border-radius:0 4px 4px 0;border-left:none;") + '">' + pair[1] + "</button>";
        }).join("");
        var src = '<span class="ks-src' + (f.overridden ? " ov" : "") + '">' + (f.overridden ? "override" : "env default") + "</span>";
        return '<div class="ks-row' + (isChild ? " child" : "") + '">' +
          '<span style="flex:1;">' + (isChild ? '<span class="ks-arrow">↳</span>' : "") +
          '<strong>' + esc(f.label) + (f.danger ? ' <span style="color:#c0392b;">⚠️</span>' : "") + '</strong> ' + src +
          '<br><span class="small" style="color:var(--muted);">' + esc(f.help) + '</span>' +
          '<br><span class="small" style="color:var(--muted);opacity:.8;"><code>' + esc(f.key) + '</code></span></span>' +
          '<span style="display:inline-flex;flex:0 0 auto;">' + seg + "</span></div>";
      };

      var claimed = {};
      var cards = KS_DOMAINS.map(function (dom) {
        var chainsHtml = dom.chains.map(function (chain) {
          var rows = chain.map(function (k, i) {
            claimed[k] = true;
            var f = byKey[k];
            if (!f) return '<div class="ks-row' + (i > 0 ? " child" : "") + '"><span class="small" style="color:var(--muted);">' + (i > 0 ? '<span class="ks-arrow">↳</span>' : "") + '<code>' + esc(k) + '</code> — not reported by the worker (deploy pending?)</span></div>';
            return flagRow(f, i > 0);
          }).join("");
          return '<div class="ks-chain">' + rows + "</div>";
        }).join("");
        return '<div class="fo-card"><div class="fo-card-head"><h3>' + esc(dom.name) + '</h3></div>' + chainsHtml + "</div>";
      }).join("");

      var leftovers = flags.filter(function (f) { return !claimed[f.key]; });
      if (leftovers.length) {
        cards += '<div class="fo-card"><div class="fo-card-head"><h3>Other</h3></div>' +
          '<div class="ks-chain">' + leftovers.map(function (f) { return flagRow(f, false); }).join("") + "</div></div>";
      }

      host.innerHTML =
        '<p class="fo-row-hint">💡 Flip a feature on/off live — no redeploy. Saved to D1 instantly; the D1 <strong>override</strong> beats the wrangler.toml <strong>env default</strong>. Chains read dark → live: a ↳ flag escalates its parent (real MFL writes / league-wide fan-out) and a ⚠️ flag asks for confirmation before turning On.</p>' +
        cards;
      $$(".fo-flag-btn", host).forEach(function (btn) {
        btn.addEventListener("click", function () {
          var k = btn.getAttribute("data-flag"), v = btn.getAttribute("data-val") === "on";
          var cur = byKey[k];
          if (cur && !!cur.value === v) return;
          if (cur && cur.danger && v && !window.confirm('Turn ON "' + cur.label + '" (live)? ' + (cur.help || "This is a live action that can't be easily undone."))) return;
          var upd = {}; upd[k] = v ? "1" : "0";
          postJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L), { feature_flags: upd })
            .then(function () { toast((cur ? cur.label : k) + " → " + (v ? "On" : "Off"), v && cur && cur.danger ? "err" : "ok"); })
            .catch(function (e) { toast("Failed: " + (e.message || String(e)), "err"); })
            .then(function () { renderKillSwitches(); });
        });
      });
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Failed to load: ' + esc(e.message || String(e)) + "</div></div>";
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // AUCTION DATES → MFL — commish-editable FA-auction timeline, pushed to
  // MFL's league calendar via import?TYPE=calendarEvent. Config lives in D1
  // (ups_settings 'auction_calendar', read/written through /admin/commish-
  // settings); the push is POST /admin/auction/push-mfl-calendar.
  // ════════════════════════════════════════════════════════════════════
  var AC = { cfg: null, fields: [], pushTarget: "74598", preview: null };
  function acEsc(v) { return esc(v == null ? "" : String(v)); }
  function renderAuctionCalendar() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading auction calendar…</div></div>';
    fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L) + "&cal_league=" + encodeURIComponent(AC.pushTarget)).then(function (data) {
      if (CS.tab !== myTab) return;
      AC.cfg = (data && data.auction_calendar) || { season: YEAR, faa: {} };
      AC.fields = (data && data.auction_calendar_fields) || [];
      if (!AC.cfg.season) AC.cfg.season = YEAR;
      paintAuctionCalendar(host);
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Failed to load: ' + acEsc(e.message || String(e)) + "</div></div>";
    });
  }

  function paintAuctionCalendar(host) {
    var faa = (AC.cfg && AC.cfg.faa) || {};
    var savedAt = AC.cfg && AC.cfg.updated_at ? new Date(AC.cfg.updated_at).toLocaleString() : "never";
    // Fields whose value ENFORCES something (not just calendar/reminder copy) are
    // marked so they don't read as one more cosmetic date. Saving one of these
    // triggers the worker's 409 confirm gate — see the Save handler below.
    var ENFORCED = { contract_deadline_at: "Enforces the extension / MYAC lockout" };
    var dateRows = AC.fields.map(function (f) {
      var enf = ENFORCED[f.key];
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);' +
        (enf ? 'background:rgba(192,57,43,.06);border-left:3px solid #c0392b;padding-left:10px;' : '') + '">' +
        '<span style="flex:1;"><strong>' + acEsc(f.label) + '</strong>' +
        (enf ? ' <span class="small" style="color:#c0392b;font-weight:600;">⚠ ' + acEsc(enf) + '</span>' : '') +
        '<br><span class="small" style="color:var(--muted);">' + acEsc(f.help) + '</span></span>' +
        '<input type="datetime-local" data-acf="' + acEsc(f.key) + '" value="' + acEsc(faa[f.key] || "") +
        '" style="flex:0 0 auto;padding:6px 8px;border:1px solid ' + (enf ? '#c0392b' : 'var(--border)') + ';border-radius:4px;background:var(--panel-alt);color:var(--text);font-size:13px;"></div>';
    }).join("");

    var isTest = AC.pushTarget !== "74598";
    var scopeBanner = isTest
      ? '<div class="fo-row-hint" style="background:rgba(184,134,11,.12);border-left:3px solid #b8860b;padding:8px 10px;margin-bottom:10px;">'
        + '<strong>Editing the TEST league (' + acEsc(AC.pushTarget) + ') calendar.</strong> Separate config \u2014 saving here does not '
        + 'touch the real league, and none of these dates gate real contracts. The app calendar (mobile / FO / team ops) is not '
        + 'written for a test league.</div>'
      : '';
    var targetSeg = [["74598", "Real league (74598)"], ["25625", "Test league (25625)"]].map(function (pair) {
      var on = AC.pushTarget === pair[0];
      return '<button type="button" class="ac-target-btn" data-actarget="' + pair[0] + '" style="padding:5px 14px;border:1px solid var(--border);background:' + (on ? (pair[0] === "74598" ? "#1f8a4c" : "#b8860b") : "var(--panel-alt)") + ";color:" + (on ? "#fff" : "var(--text)") + ";cursor:pointer;font-weight:" + (on ? "600" : "400") + ";" + (pair[0] === "74598" ? "border-radius:4px 0 0 4px;" : "border-radius:0 4px 4px 0;border-left:none;") + '">' + pair[1] + "</button>";
    }).join("");

    var previewHtml = "";
    if (AC.preview) {
      var p = AC.preview;
      if (p.error) {
        previewHtml = '<div class="fo-card" style="border-color:#c0392b;"><strong style="color:#c0392b;">' + (p._push ? "Push error:" : "Preview error:") + '</strong> ' + acEsc(p.error) +
          (p.missing && p.missing.length ? '<br><span class="small">Missing dates: ' + acEsc(p.missing.join(", ")) + "</span>" : "") + "</div>";
      } else {
        // MFL calendar rows: dryRun uses p.events (with already_exists); commit uses p.mfl.results.
        var mflList = p.dryRun ? (p.events || []) : ((p.mfl && p.mfl.results) || []);
        var mflRows = mflList.map(function (e) {
          var status = p.dryRun
            ? (e.already_exists ? '<span class="small" style="color:var(--muted);">already on MFL ✓</span>' : '<span style="color:#1f8a4c;">will add</span>')
            : (e.skipped ? '<span class="small" style="color:var(--muted);">already there — skipped</span>'
               : (e.ok ? '<span style="color:#1f8a4c;">✔ written</span>' : '<span style="color:#c0392b;">✗ ' + acEsc(e.error || ("HTTP " + e.status)) + "</span>"));
          return '<tr><td><strong>' + acEsc(e.event_type) + '</strong><br><span class="small" style="color:var(--muted);">' + acEsc(e.label) + "</span></td>" +
            "<td>" + acEsc(e.start_at || "") + (e.end_at ? " → " + acEsc(e.end_at) : "") + "</td><td>" + status + "</td></tr>";
        }).join("");
        // App calendar (D1 league_events) rows.
        var appList = p.dryRun ? (p.league_events || []) : ((p.app_calendar && p.app_calendar.results) || []);
        // The league-guard entry carries no event/date — it is reported separately
        // below, so keep it out of the per-event table.
        var appRows = appList.filter(function (r) { return r && !r.skipped; }).map(function (r) {
          var status = p.dryRun ? '<span style="color:#1f8a4c;">will sync</span>'
            : (r.ok ? '<span style="color:#1f8a4c;">✔ synced</span>' : '<span style="color:#c0392b;">✗ ' + acEsc(r.error || "") + "</span>");
          return "<tr><td><strong>" + acEsc(r.event) + "</strong></td><td>" + acEsc(r.date || "") + "</td><td>" + status + "</td></tr>";
        }).join("");
        var head = p.dryRun ? "Preview" : "Push result";
        var okMsg = p.dryRun ? "" : (p.ok ? '<p class="fo-row-hint">✅ Written to MFL + the app calendar (mobile / FO / team ops).</p>' : '<p class="fo-row-hint" style="color:#c0392b;">⚠️ Some writes failed — see below.</p>');
        // The app calendar (D1 league_events) is NOT league-scoped — it has no
        // league_id column — so the worker refuses to write it from a non-production
        // target. Say so loudly: otherwise a test push looks like a full success
        // while the app calendar silently kept the production dates.
        var skippedD1 = (appList || []).filter(function (r) { return r && r.skipped; });
        if (skippedD1.length) {
          okMsg += '<p class="fo-row-hint" style="color:#b8860b;">⚠️ App calendar NOT written — ' +
            acEsc(skippedD1[0].error || "refused for this league target") +
            ' The MFL calendar push above still ran.</p>';
        }
        // MFL's API can't delete/update calendar events, and MFL auto-generates
        // some of its own (in-season roster locks, etc.) that we must NOT touch.
        // So we don't flag specific events for deletion — just a soft reminder to
        // tidy up manually if a date changed.
        var staleHtml = '<p class="small" style="color:var(--muted);margin-top:8px;">MFL\'s API can\'t remove calendar events. If you <em>changed</em> a date, an older copy may remain — review and remove it on the <a href="' + acEsc(p.manage_url || "#") + '" target="_blank" rel="noopener">MFL calendar</a>. (The app calendar always overwrites cleanly.)</p>';
        previewHtml =
          '<div class="fo-card"><div class="fo-card-head"><h3>' + head + " · " + acEsc(p.league) + " · " + acEsc(p.season) + "</h3></div>" +
          okMsg +
          (mflRows ? '<p class="fo-row-hint" style="margin-bottom:2px;"><strong>MFL calendar</strong></p><table class="fo-table"><thead><tr><th>MFL event</th><th>When (ET)</th><th>Status</th></tr></thead><tbody>' + mflRows + "</tbody></table>" : "") +
          (appRows ? '<p class="fo-row-hint" style="margin:12px 0 2px;"><strong>App calendar</strong> <span class="small" style="color:var(--muted);">(mobile · FO · team ops — always overwrites cleanly)</span></p><table class="fo-table"><thead><tr><th>Event</th><th>Date</th><th>Status</th></tr></thead><tbody>' + appRows + "</tbody></table>" : "") +
          (p.missing && p.missing.length ? '<p class="small" style="color:#b8860b;margin-top:8px;">Not set (skipped): ' + acEsc(p.missing.join(", ")) + "</p>" : "") +
          (p.has_cookie === false ? '<p class="small" style="color:#c0392b;">⚠️ MFL_COOKIE not set on the worker — MFL writes will fail (app calendar still syncs).</p>' : "") +
          staleHtml + "</div>";
      }
    }

    host.innerHTML =
      '<div class="fo-card"><div class="fo-card-head"><h3>Update League Calendar' +
        (isTest ? ' <span style="color:#b8860b;">— TEST ' + acEsc(AC.pushTarget) + '</span>' : '') + '</h3>' +
        '<span class="small" style="color:var(--muted);">saved ' + acEsc(savedAt) + "</span></div>" +
      scopeBanner +
      '<p class="fo-row-hint">💡 Set the league\'s key dates (ET) once, then push them everywhere. Writes to <strong>MFL\'s calendar</strong> (Trade&nbsp;Deadline, Rookie&nbsp;Draft, ERA + FA&nbsp;Auction as <code>AUCTION_START</code>, and a <code>WAIVER_NONE</code> "No Add/Drops" span over the FA&nbsp;Auction) <strong>and the app calendar</strong> (mobile · Front&nbsp;Office · team&nbsp;ops). <strong>Auction rules</strong> (cap / roster / format) can\'t be set via API — see the <a href="https://github.com/keithcreelman/upsmflproduction/blob/main/docs/auction/mfl_auction_setup_runbook.md" target="_blank" rel="noopener">runbook</a>.</p>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;"><strong>Season</strong>' +
        '<input type="text" id="ac-season" value="' + acEsc(AC.cfg.season) + '" style="width:90px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--panel-alt);color:var(--text);"></div>' +
      dateRows +
      '<div style="margin-top:14px;"><button type="button" id="ac-save" class="fo-btn" style="padding:8px 20px;">💾 Save dates</button></div></div>' +

      '<div class="fo-card"><div class="fo-card-head"><h3>Push to MFL + app calendar</h3></div>' +
      '<p class="fo-row-hint">Target league: <span style="display:inline-flex;vertical-align:middle;">' + targetSeg + '</span>' +
        (isTest ? ' <span class="small" style="color:#b8860b;">— safe: writes to the test league only.</span>' : ' <span class="small" style="color:#c0392b;">— LIVE: writes to the real league calendar.</span>') + "</p>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        '<button type="button" id="ac-preview" class="fo-btn" style="padding:8px 20px;">🔍 Preview</button>' +
        '<button type="button" id="ac-push" class="fo-btn" style="padding:8px 20px;background:' + (isTest ? "#b8860b" : "#c0392b") + ';color:#fff;">📤 Push' + (isTest ? " (test)" : " (LIVE)") + "</button>" +
        '<a class="fo-btn" href="https://' + acEsc(HOST) + "/" + acEsc(YEAR) + "/options?L=" + acEsc(AC.pushTarget) + '&O=110" target="_blank" rel="noopener" style="padding:8px 20px;text-decoration:none;">↗ MFL calendar</a>' +
      "</div></div>" + previewHtml;

    // Save
    document.getElementById("ac-save").addEventListener("click", function () {
      var faaUpd = {};
      $$("[data-acf]", host).forEach(function (inp) { faaUpd[inp.getAttribute("data-acf")] = inp.value || ""; });
      var season = (document.getElementById("ac-season") || {}).value || YEAR;
      var url = apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L);

      function doSave(confirmGate) {
        var payload = { auction_calendar: { season: season, faa: faaUpd, league_id: AC.pushTarget } };
        if (confirmGate) payload.auction_calendar.confirm_contract_gate = true;
        return postJSON(url, payload).then(function (r) {
          AC.cfg = (r && r.auction_calendar) || AC.cfg;
          AC.preview = null;
          toast(confirmGate ? "League dates saved — contract deadline gate moved" : "League dates saved", "ok");
          paintAuctionCalendar(host);
        });
      }

      doSave(false).catch(function (e) {
        var d = e && e.data;
        // The contract deadline is not just a date on this panel — it enforces the
        // veteran extension / MYAC lockout. The worker refuses the first save with
        // 409 + the before/after and the gate name; surface exactly that rather
        // than a generic failure, then re-send with the explicit confirmation.
        if (e && e.status === 409 && d && d.error === "contract_gate_confirm_required") {
          var msg =
            "⚠️  This moves a LIVE CONTRACT GATE, not just a reminder.\n\n" +
            "Gate: " + (d.gate || "veteran extensions + MYAC") + "\n\n" +
            "Contract deadline\n" +
            "   before:  " + (d.before || "(not set — using the hardcoded date)") + "\n" +
            "   after:   " + (d.after || "(cleared — falls back to the hardcoded date)") + "\n\n" +
            "In force after saving:\n   " + (d.effective_after_save || "?") + "\n\n" +
            "Past that instant, veteran extension / MYAC / restructure submissions are REJECTED.\n" +
            "This change is written to an audit log.\n\nApply it?";
          if (!window.confirm(msg)) { toast("Save cancelled — nothing changed", "err"); return; }
          return doSave(true).catch(function (e2) {
            toast("Save failed: " + (e2.message || String(e2)), "err");
          });
        }
        toast("Save failed: " + (e.message || String(e)), "err");
      });
    });
    // Target toggle
    $$(".ac-target-btn", host).forEach(function (btn) {
      btn.addEventListener("click", function () {
        // Each league has its OWN calendar config now, so switching target must
        // RELOAD — repainting would show the previous league's dates under the new
        // label, exactly the confusion this scoping exists to end.
        AC.pushTarget = btn.getAttribute("data-actarget");
        AC.preview = null;
        AC.cfg = null;
        renderAuctionCalendar();
      });
    });
    // Preview (dryRun — no key, writes nothing)
    document.getElementById("ac-preview").addEventListener("click", function () {
      var u = apiUrl("/admin/auction/push-mfl-calendar") + "?L=" + encodeURIComponent(AC.pushTarget) + "&YEAR=" + encodeURIComponent(AC.cfg.season || YEAR);
      postJSON(u, {}).then(function (r) { AC.preview = r; paintAuctionCalendar(host); })
        .catch(function (e) { AC.preview = { error: e.message || String(e) }; paintAuctionCalendar(host); });
    });
    // Push (commit — commish-gated by franchise_id, passed automatically; no key to type)
    document.getElementById("ac-push").addEventListener("click", function () {
      var live = AC.pushTarget === "74598";
      if (live && !window.confirm("Write these dates to the REAL league (74598) — MFL calendar + the app calendar — now?")) return;
      var u = apiUrl("/admin/auction/push-mfl-calendar") + "?L=" + encodeURIComponent(AC.pushTarget) + "&YEAR=" + encodeURIComponent(AC.cfg.season || YEAR) + "&commit=1&franchise_id=0008";
      postJSON(u, {}).then(function (r) { AC.preview = r; toast(r.ok ? "Pushed to MFL ✔" : "Push had errors", r.ok ? "ok" : "err"); paintAuctionCalendar(host); })
        .catch(function (e) { AC.preview = { error: e.message || String(e), _push: true }; toast("Push failed: " + (e.message || String(e)), "err"); paintAuctionCalendar(host); });
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // CONTRACT REVERT — list recent submissions, dry-run preview, revert in MFL
  // ════════════════════════════════════════════════════════════════════
  function ctKindLabel(k) { return { myac: "MYAC", extension: "Extension", restructure: "Restructure", mym: "MYM", tag: "Tag", untag: "Untag" }[k] || k; }
  function ctContractStr(c, isTag) {
    if (!c) return isTag ? "(untag)" : "—";
    var sal = c.salary != null ? "$" + Number(c.salary).toLocaleString() : "$?";
    var yr = c.contract_year != null ? c.contract_year + "yr" : "";
    return [c.contract_status || "", yr, sal].filter(Boolean).join(" · ");
  }
  function franchiseName(fid) { return (CS.fmap && CS.fmap[pad4(fid)]) || s(fid); }

  function loadFranchiseMap() {
    if (CS.fmap) return Promise.resolve(CS.fmap);
    return fetchJSON(apiUrl("/api/mfl-export") + "?TYPE=league&L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR))
      .then(function (d) {
        var fr = d && d.league && d.league.franchises && d.league.franchises.franchise;
        var arr = Array.isArray(fr) ? fr : (fr ? [fr] : []);
        var m = {}; arr.forEach(function (f) { if (f && f.id) m[pad4(f.id)] = f.name || f.id; });
        CS.fmap = m; return m;
      }).catch(function () { CS.fmap = {}; return {}; });
  }

  function renderContractRevert() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Contract Revert</h3>' +
      '<span class="small" id="cs-cr-meta" style="color:var(--muted);">Loading…</span></div>' +
      '<p class="fo-row-hint">💡 Select recent contract submissions and revert them — restores the prior contract in MFL (tags → untag). Discord is silenced for reverts. A dry-run preview + confirm runs before any write.</p>' +
