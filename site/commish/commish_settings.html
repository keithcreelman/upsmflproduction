      '<div id="cs-cr-body"><div class="fo-table-loading">Loading contract submissions…</div></div></div>';
    CS.cr.sel = {};
    Promise.all([
      loadFranchiseMap(),
      fetchJSON(apiUrl("/admin/contract-submissions") + "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR))
    ]).then(function (res) {
      if (CS.tab !== myTab) return;
      CS.cr.subs = (res[1] && res[1].submissions) || [];
      var meta = document.getElementById("cs-cr-meta");
      if (meta) meta.textContent = CS.cr.subs.length + " submission" + (CS.cr.subs.length === 1 ? "" : "s") + " · " + YEAR;
      renderContractRevertBody();
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      var b = document.getElementById("cs-cr-body");
      if (b) b.innerHTML = '<div class="fo-table-loading">Failed to load: ' + esc(e.message || String(e)) + "</div>";
    });
  }

  function renderContractRevertBody() {
    var body = document.getElementById("cs-cr-body");
    if (!body) return;
    var cr = CS.cr;
    if (!cr.subs.length) { body.innerHTML = '<div class="fo-table-loading">No contract submissions this season.</div>'; return; }
    var fmtDt = function (x) { return s(x).replace("T", " ").slice(0, 16); };
    var rows = cr.subs.map(function (sub) {
      var key = sub.table + ":" + sub.id;
      var checked = cr.sel[key] ? "checked" : "";
      var disabled = sub.revertable ? "" : "disabled";
      var isTag = sub.kind === "tag" || sub.kind === "untag";
      var newStr = ctContractStr(sub.new, false) + (sub.new && sub.new.tag_side ? " (" + sub.new.tag_side + ")" : "");
      var priorStr = ctContractStr(sub.prior, isTag);
      return '<tr>' +
        '<td style="text-align:center;"><input type="checkbox" class="cs-cr-chk" data-key="' + esc(key) + '" ' + checked + ' ' + disabled + '></td>' +
        '<td>' + esc(sub.player_name || sub.player_id || "") + '</td>' +
        '<td>' + esc(ctKindLabel(sub.kind)) + '</td>' +
        '<td>' + esc(franchiseName(sub.franchise_id)) + '</td>' +
        '<td class="small">' + esc(newStr) + '</td>' +
        '<td class="small">' + esc(priorStr) + (sub.revertable ? '' : ' <span style="color:var(--muted);">(no revert)</span>') + '</td>' +
        '<td class="small">' + esc(fmtDt(sub.submitted_at_utc)) + '</td>' +
        '</tr>';
    }).join("");
    var nSel = Object.keys(cr.sel).filter(function (k) { return cr.sel[k]; }).length;
    body.innerHTML =
      '<div style="margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
        '<button type="button" class="btn small warn" id="cs-cr-revert"' + (nSel ? '' : ' disabled') + '>Revert selected (' + nSel + ')</button>' +
        '<button type="button" class="btn small secondary" id="cs-cr-refresh">↻ Refresh</button>' +
        '<span class="small" id="cs-cr-status" style="color:var(--muted);"></span>' +
      '</div>' +
      '<div class="fo-table-scroll"><table class="fo-table"><thead><tr>' +
        '<th style="width:32px;"></th><th>Player</th><th>Kind</th><th>Team</th><th>Submitted (new)</th><th>Reverts to (prior)</th><th>When (UTC)</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    $$(".cs-cr-chk", body).forEach(function (chk) {
      chk.addEventListener("change", function () {
        var k = this.getAttribute("data-key");
        if (this.checked) cr.sel[k] = true; else delete cr.sel[k];
        renderContractRevertBody();
      });
    });
    var rb = document.getElementById("cs-cr-revert"); if (rb) rb.addEventListener("click", doContractRevert);
    var fb = document.getElementById("cs-cr-refresh"); if (fb) fb.addEventListener("click", renderContractRevert);
  }

  function doContractRevert() {
    var cr = CS.cr;
    var reverts = Object.keys(cr.sel).filter(function (k) { return cr.sel[k]; }).map(function (k) {
      var i = k.lastIndexOf(":"); return { table: k.slice(0, i), id: parseInt(k.slice(i + 1), 10) || 0 };
    });
    if (!reverts.length) return;
    var status = document.getElementById("cs-cr-status");
    var setStatus = function (m) { if (status) status.textContent = m; };
    var revertUrl = apiUrl("/admin/contract-revert") + "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR);
    setStatus("Previewing (dry-run)…");
    postJSON(revertUrl, { league_id: L, season: YEAR, dry_run: true, reverts: reverts }).then(function (dry) {
      var lines = (dry.results || []).map(function (r) {
        var to = r.restored && r.restored.contract_status
          ? r.restored.contract_status + " " + r.restored.contract_year + "yr $" + Number(r.restored.salary || 0).toLocaleString()
          : "untag";
        var sub = (cr.subs || []).filter(function (x) { return x.table === r.table && String(x.id) === String(r.id); })[0];
        var nm = r.player_name || (sub && sub.player_name) || r.id;
        return (r.ok ? "✓" : "✗") + " " + nm + " → " + to + (r.error ? " (" + r.error + ")" : "");
      });
      if (!window.confirm("Revert " + reverts.length + " contract(s) in MFL?\n\n" + lines.join("\n") + "\n\nThis writes to MFL (Discord silenced) and is not undoable from here.")) {
        setStatus(""); return;
      }
      setStatus("Reverting…");
      postJSON(revertUrl, { league_id: L, season: YEAR, dry_run: false, reverts: reverts }).then(function (resp) {
        var all = resp.results || [];
        var okN = all.filter(function (r) { return r.ok; }).length;
        var failed = all.filter(function (r) { return !r.ok; });
        setStatus("Reverted " + okN + "/" + all.length + (failed.length ? " — failed: " + failed.map(function (f) { return (f.player_name || f.id) + " (" + (f.error || f.status || "?") + ")"; }).join(", ") : "") + ". Refreshing…");
        cr.sel = {};
        toast("Reverted " + okN + "/" + all.length, failed.length ? "err" : "ok");
        renderContractRevert();
      }).catch(function (e) { setStatus("Revert failed: " + (e.message || e)); });
    }).catch(function (e) { setStatus("Preview failed: " + (e.message || e)); });
  }

  // ════════════════════════════════════════════════════════════════════
  // STATUS + HEALTH shared helpers — the status pill and the age→verdict
  // logic (generalized from the old Trade-Roast row so every heartbeat tile
  // judges the same way).
  // ════════════════════════════════════════════════════════════════════
  function csPill(state, txt) {
    var c = state === "prod" ? "#1f8a4c" : state === "test" ? "#e67e22" :
            state === "down" ? "#c0392b" : "#7a7a7a";
    return '<span style="background:' + c + ';color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;white-space:nowrap;">' + esc(txt) + "</span>";
  }
  function fmtAge(sec) {
    if (sec < 90) return Math.round(sec) + "s ago";
    if (sec < 5400) return Math.round(sec / 60) + "m ago";
    if (sec < 172800) return (sec / 3600).toFixed(1) + "h ago";
    return Math.round(sec / 86400) + "d ago";
  }
  // Heartbeat age → LIVE / STALE / DOWN (null age = never seen).
  function hbVerdict(ageSec, liveMaxSec, staleMaxSec) {
    if (ageSec == null) return { state: "inactive", label: "NO DATA" };
    if (ageSec < liveMaxSec) return { state: "prod", label: "LIVE" };
    if (ageSec < staleMaxSec) return { state: "test", label: "STALE" };
    return { state: "down", label: "DOWN" };
  }

  // ════════════════════════════════════════════════════════════════════
  // STATUS — Discord posters (live routing) + D1 writers (live row counts).
  // No longer a top-level tab: it renders inside the ❤️ Health tab's drill-in
  // area (hostOverride), with renderHealth owning the back link.
  // ════════════════════════════════════════════════════════════════════
  function renderStatus(hostOverride) {
    var host = hostOverride || content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading status…</div></div>';
    Promise.all([
      fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L)).catch(function () { return {}; }),
      fetchJSON(apiUrl("/admin/d1-status") + "?L=" + encodeURIComponent(L)).catch(function () { return {}; }),
      fetchJSON(apiUrl("/api/roast-heartbeat")).catch(function () { return {}; })
    ]).then(function (res) {
      if (CS.tab !== myTab) return;
      var routing = (res[0] || {}).discord_routing || {};
      var d1 = (res[1] || {}).tables || [];
      var hb = res[2] || {};
      var pill = csPill;
      // Trade Roast bot — LIVE heartbeat, not a hardcoded label. The bot POSTs a
      // heartbeat every poll tick (5 min); this row shows its actual age. The old
      // static "PROD" pill stayed green through the 2026-07-11 25-hour bot hang.
      var roastRow = (function () {
        var age = hb && hb.age_seconds != null ? Number(hb.age_seconds) : null;
        var v = hbVerdict(age, 720, 3600);
        if (v.state === "inactive") return { n: "Trade Roast bot", state: "inactive", label: "NO DATA",
          note: "No heartbeat ever received — bot not running the heartbeat build yet. Trades post to #transactions when up." };
        if (v.state === "prod") return { n: "Trade Roast bot", state: "prod", label: "LIVE",
          note: "Heartbeat " + fmtAge(age) + " (env=" + (hb.env || "?") + "). Trade roasts post to #transactions, always — the Discord Routing toggle does NOT steer it." };
        if (v.state === "test") return { n: "Trade Roast bot", state: "test", label: "STALE",
          note: "Last heartbeat " + fmtAge(age) + " — bot may be hung or restarting. Watchdog kicks it after 15 min of silence." };
        return { n: "Trade Roast bot", state: "down", label: "DOWN",
          note: "Last heartbeat " + fmtAge(age) + " — the bot is not running (or can't reach the worker). Check launchd on the commish Mac." };
      })();
      var discordRows = [
        { n: "Contract — Extension", k: "extension" },
        { n: "Contract — Auction (FA + MYAC)", k: "myac" },
        { n: "Contract — Restructure", k: "restructure" },
        { n: "Contract — Tag / Untag", k: "tag" },
        { n: "Contract — MYM", k: "mym" },
        { n: "Drop / Cap penalty", state: "prod" },
        { n: "Trade notification", state: "prod" },
        { n: "Auction alerts (live bid/nom)", k: "auctionbidding" },
        { n: "Deadline reminders", state: "prod" },
        roastRow
      ].map(function (r) {
        var state = r.k ? String(routing[r.k] || "prod").toLowerCase() : r.state;
        var label = r.label || (state === "inactive" ? "INACTIVE" : (state === "test" ? "TEST" : "PROD"));
        return "<tr><td>" + esc(r.n) + "</td><td>" + pill(state, label) + '</td><td class="small" style="color:var(--muted);">' + esc(r.note || (r.k ? "commish-configurable" : "wired")) + "</td></tr>";
      }).join("");
      var cntByTable = {}; d1.forEach(function (t) { cntByTable[t.table] = t; });
      var d1Defs = [
        { cat: "Contract Submissions", n: "Extensions / FA / historical", t: "ups_extension_submissions", freq: "on submit + forum backfill" },
        { cat: "Contract Submissions", n: "Restructures", t: "ups_restructure_submissions", freq: "on submit + ingest action" },
        { cat: "Contract Submissions", n: "Tags / Untags", t: "ups_tag_submissions", freq: "on submit" },
        { cat: "Contract Submissions", n: "Commish settings", t: "ups_settings", freq: "on change" },
        { cat: "MFL", n: "Drop / cap-penalty events", t: "ups_drop_events", freq: "on cut + scan" },
        { cat: "MFL", n: "ERA auction pool", t: "ups_era_pool", freq: "pre-auction sync" },
        { cat: "MFL", n: "Auction lots / bids", t: "ups_auction_lots", freq: "live during auction" },
        { cat: "MFL", n: "Draft picks", t: "ups_draft_picks", freq: "hourly cron" },
        { cat: "MFL", n: "Tag history", t: "ups_tag_history", freq: "tag pipeline" },
        { cat: "MFL", n: "MYM history", t: "ups_mym_history", freq: "MYM submit" }
      ];
      var known = {}; d1Defs.forEach(function (d) { known[d.t] = true; });
      d1.forEach(function (t) { if (!known[t.table]) d1Defs.push({ cat: "Other", n: "—", t: t.table, freq: "—" }); });
      var d1Rows = d1Defs.map(function (d) {
        var live = cntByTable[d.t];
        var rows = live ? live.rows : 0;
        var last = live && live.last_write ? s(live.last_write).replace("T", " ").slice(0, 16) : "—";
        var st = live && rows > 0 ? "prod" : "inactive";
        return "<tr><td>" + esc(d.cat) + "</td><td>" + esc(d.n) + '</td><td class="small"><code>' + esc(d.t) + "</code></td><td class=\"num\">" + rows + '</td><td class="small" style="color:var(--muted);">' + esc(d.freq) + "</td><td class=\"small\" style=\"color:var(--muted);\">" + esc(last) + "</td><td>" + pill(st, st === "prod" ? "LIVE" : "EMPTY") + "</td></tr>";
      }).join("");
      var viewSel = '<select id="cs-status-view" style="background:var(--panel-alt);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:4px;">' +
        '<option value="discord"' + (CS.statusView === "discord" ? " selected" : "") + ">Discord</option>" +
        '<option value="d1"' + (CS.statusView === "d1" ? " selected" : "") + ">D1</option></select>";
      var inner = CS.statusView === "d1"
        ? '<p class="fo-row-hint">💡 Everything that writes to D1 — MFL data vs Contract Submissions — with live row counts (the source of truth).</p>' +
          '<div class="fo-table-scroll"><table class="fo-table"><thead><tr><th>Category</th><th>Writes</th><th>Table</th><th class="num">Rows</th><th>Frequency</th><th>Last write</th><th>Status</th></tr></thead><tbody>' + d1Rows + "</tbody></table></div>"
        : '<p class="fo-row-hint">💡 Everything scheduled to post to Discord, and whether it routes to Prod / Test / is Inactive. Contract types are live from the Discord Routing settings.</p>' +
          '<div class="fo-table-scroll"><table class="fo-table"><thead><tr><th>Poster</th><th>Routing</th><th>Notes</th></tr></thead><tbody>' + discordRows + "</tbody></table></div>";
      host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Status</h3>' +
        '<span style="display:inline-flex;align-items:center;gap:6px;"><span class="small" style="color:var(--muted);">View</span>' + viewSel + "</span></div>" + inner + "</div>";
      var vs = document.getElementById("cs-status-view"); if (vs) vs.addEventListener("change", function () { CS.statusView = this.value; renderStatus(hostOverride); });
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // ❤️ HEALTH — the landing dashboard. One /admin/health-summary call (bot
  // heartbeats + effective flags + test residue + calendar age) + one
  // /admin/config-health call (required-env audit), painted as a tile grid.
  // The old Status tab's Discord-routing and D1-table views survive as
  // drill-ins (CS.healthDrill) with a back link.
  // ════════════════════════════════════════════════════════════════════
  function renderHealth() {
    var host = content();
    var myTab = CS.tab;

    // Drill-in: swap the health content area for one of the old Status views.
    if (CS.healthDrill) {
      var which = CS.healthDrill;
      CS.statusView = which;
      host.innerHTML =
        '<p class="fo-row-hint" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
        '<span>' + (which === "d1" ? "🗄️ D1 tables — everything that writes to D1, with live row counts" : "📣 Discord posting — live routing per poster") + '</span>' +
        '<button type="button" class="btn small" id="hv-back">← Back to Health</button></p>' +
        '<div id="cs-health-drill"></div>';
      document.getElementById("hv-back").addEventListener("click", function () { CS.healthDrill = null; renderHealth(); });
      renderStatus(document.getElementById("cs-health-drill"));
      return;
    }

    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Taking vitals…</div></div>';
    var qs = "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR);
    Promise.all([
      fetchJSON(apiUrl("/admin/health-summary") + qs).catch(function (e) { return { __err: e.message || String(e) }; }),
      fetchJSON(apiUrl("/admin/config-health") + qs).catch(function (e) { return { __err: e.message || String(e) }; })
    ]).then(function (res) {
      if (CS.tab !== myTab || CS.healthDrill) return;
      var sum = res[0] || {}, cfg = res[1] || {};
      var hbs = (sum && sum.heartbeats) || {};

      // (a) Config Health — required env vars present?
      var cfgTile;
      if (cfg.__err) {
        cfgTile = '<div class="hv-tile bad"><h3>🔑 Config <span>' + csPill("down", "ERROR") + '</span></h3><div class="hv-note">' + esc(cfg.__err) + '</div></div>';
      } else if (!(cfg.missing || []).length) {
        cfgTile = '<div class="hv-tile"><h3>🔑 Config <span>' + csPill("prod", "OK") + '</span></h3>' +
          '<div class="hv-note">All required vars present · ' + Number(cfg.present_count || 0) + '/' + Number(cfg.checked || 0) + ' of the full manifest set (the rest are optional).</div></div>';
      } else {
        cfgTile = '<div class="hv-tile bad"><h3>🔑 Config <span>' + csPill("down", (cfg.missing || []).length + " MISSING") + '</span></h3>' +
          (cfg.missing || []).map(function (m) {
            return '<div class="hv-missing"><code>' + esc(m.key) + '</code> · ' + esc(m.category) +
              (m.silent_fallback ? ' · <strong>silent fallback!</strong>' : '') + '</div>';
          }).join("") +
          '<div class="hv-note"><strong>silent fallback!</strong> = the code substitutes a hardcoded value while the var is empty — the feature keeps "working", pointed wherever the fallback says.</div></div>';
      }

      // (b)(c)(d) Heartbeat tiles — shared LIVE/STALE/DOWN verdicts.
      var hbTile = function (icon, name, rec, liveMax, staleMax, note) {
        var age = rec && rec.age_sec != null ? Number(rec.age_sec) : null;
        var v = hbVerdict(age, liveMax, staleMax);
        var when = age == null ? "No heartbeat ever recorded." : "Last beat " + fmtAge(age) + ".";
        return '<div class="hv-tile' + (v.state === "down" ? " bad" : "") + '"><h3>' + icon + ' ' + esc(name) + ' <span>' + csPill(v.state, v.label) + '</span></h3>' +
          '<div class="hv-note">' + when + (note ? " " + note : "") + '</div></div>';
      };
      var pollTile = hbTile("🔨", "Auction poll", hbs.auction_poll, 600, 1800,
        "Fires every 5 min (*/5 cron or the launchd lifeline) — this is the ledger's freshness.");
      var roastAge = hbs.trade_roast && hbs.trade_roast.age_sec != null ? Number(hbs.trade_roast.age_sec) : null;
      var roastTile = hbTile("🔥", "Trade Roast bot", hbs.trade_roast, 720, 3600,
        (roastAge != null && hbs.trade_roast.env ? "env=" + esc(hbs.trade_roast.env) + ". " : "") +
        "launchd on the commish Mac; watchdog kicks it after 15 min of silence.");
      // Scheduler: cron_cf is stamped by the worker's scheduled() handler on
      // EVERY invocation (the */5 is the fastest guaranteed tick). If CF cron
      // is dead but the auction poll is fresh, the launchd stand-ins are the
      // only thing keeping the lights on — say so.
      var cronAge = hbs.cron_cf && hbs.cron_cf.age_sec != null ? Number(hbs.cron_cf.age_sec) : null;
      var pollAge = hbs.auction_poll && hbs.auction_poll.age_sec != null ? Number(hbs.auction_poll.age_sec) : null;
      var cronNote = "Cloudflare cron (scheduled()) — last trigger: <code>" + esc((hbs.cron_cf && hbs.cron_cf.status) || "?") + "</code>.";
      if ((cronAge == null || cronAge >= 1800) && pollAge != null && pollAge < 600) {
        cronNote += " ⚠️ <strong>launchd stand-in only</strong> — CF cron is not firing but the poll lifeline is carrying the ledger (2026-07-15 outage mode).";
      } else if (cronAge != null && cronAge < 600) {
        cronNote += " CF cron is alive.";
      }
      var cronTile = hbTile("⏰", "Scheduler", hbs.cron_cf, 600, 1800, cronNote);

      // (e) Flags board — effective kill-switch states, grouped by prefix.
      var flags = (sum && sum.flags) || [];
      var chip = function (f) {
        var cls = "hv-chip" + (f.value ? " on" : "") + (f.danger && f.value ? " danger-on" : "");
        return '<span class="' + cls + '" title="' + esc((f.label || f.key) + (f.help ? " — " + f.help : "")) + '">' + esc(f.key) +
          (f.overridden ? '<span class="ov">override</span>' : '') + '</span>';
      };
      var flagGroups = [
        { l: "Trades", p: "TRADE" }, { l: "Auction", p: "AUCTION" },
        { l: "Rule Proposals", p: "RULE_PROPOSALS" }, { l: "Drops", p: "DROP_TRACKER" }, { l: "OTB", p: "OTB" }
      ];
      var usedFlag = {};
      var flagHtml = flagGroups.map(function (g) {
        var fs = flags.filter(function (f) { return String(f.key).indexOf(g.p) === 0; });
        if (!fs.length) return "";
        fs.forEach(function (f) { usedFlag[f.key] = true; });
        return '<div class="hv-flag-grp"><div class="hv-flag-grp-l">' + esc(g.l) + '</div>' + fs.map(chip).join("") + '</div>';
      }).join("");
      var otherFlags = flags.filter(function (f) { return !usedFlag[f.key]; });
      if (otherFlags.length) flagHtml += '<div class="hv-flag-grp"><div class="hv-flag-grp-l">Other</div>' + otherFlags.map(chip).join("") + '</div>';
      var dangerOn = flags.filter(function (f) { return f.danger && f.value; }).length;
      var flagsTile = '<div class="hv-tile wide"><h3>🎛 Kill switches <span>' +
        (dangerOn ? csPill("test", dangerOn + " ⚠️ LIVE") : csPill("prod", "OK")) +
        ' <button type="button" class="btn small" id="hv-goto-ks">Manage →</button></h3>' +
        (flagHtml || '<div class="hv-note">No flags reported' + (sum.__err ? " — " + esc(sum.__err) : "") + '.</div>') +
        '<div class="hv-note">Green = on · grey = off · red ring = a ⚠️ live-action flag is armed · <em>override</em> = D1 override beats the env default.</div></div>';

      // (f) Test residue — leftover test rows that could leak into prod views.
      var trd = (sum && sum.test_residue) || {};
      var lots = Number(trd.auction_test_lots || 0), rounds = Number(trd.test_rule_rounds || 0);
      var residueTile = '<div class="hv-tile"><h3>🧪 Test residue <span>' +
        csPill(lots || rounds ? "test" : "prod", lots || rounds ? "CLEANUP" : "CLEAN") + '</span></h3>' +
        '<div class="hv-note">' + lots + ' test auction lot' + (lots === 1 ? "" : "s") + ' · ' + rounds + ' test rule round' + (rounds === 1 ? "" : "s") + '.</div>' +
        (lots ? '<button type="button" class="btn small warn" id="hv-purge-lots" style="margin-top:6px;">🗑 Purge test auction lots</button> ' : "") +
        (rounds ? '<button type="button" class="btn small" id="hv-goto-rp" style="margin-top:6px;">Delete via 📜 Rule Proposals →</button> ' : "") +
        '<button type="button" class="btn small warn" id="hv-purge-fines" style="margin-top:6px;">🗑 Purge test nomination fines</button>' +
        '</div>';

      // (g) Calendar config age.
      var calAt = sum && sum.calendar_updated_at;
      var calAge = null;
      if (calAt) { var t = new Date(calAt).getTime(); if (!isNaN(t)) calAge = Math.max(0, (Date.now() - t) / 1000); }
      var calTile = '<div class="hv-tile"><h3>🗓️ League calendar <span>' +
        (calAge != null ? csPill("prod", "SAVED") : csPill("inactive", "NEVER")) +
        ' <button type="button" class="btn small" id="hv-goto-cal">Edit →</button></h3>' +
        '<div class="hv-note">' + (calAge != null
          ? "Dates last saved " + fmtAge(calAge) + " (" + esc(String(calAt).replace("T", " ").slice(0, 16)) + " UTC)."
          : "No auction-calendar config saved yet.") + '</div></div>';

      // Drill-ins — the old Status tab's two views.
      var drillTile = '<div class="hv-tile"><h3>🔎 Deep status</h3>' +
        '<div class="hv-note" style="margin:0 0 8px;">The full posting + storage detail behind the tiles.</div>' +
        '<button type="button" class="btn small" id="hv-drill-discord">📣 Discord routing</button> ' +
        '<button type="button" class="btn small" id="hv-drill-d1">🗄️ D1 tables</button></div>';

      var genLine = '<p class="fo-row-hint" style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>💡 One-glance ops vitals — config, schedulers, kill switches, residue.' +
        (sum.__err ? ' <strong style="color:var(--danger);">health-summary failed: ' + esc(sum.__err) + '</strong>' : '') +
        ((sum.errors || []).length ? ' <strong style="color:var(--warn);">partial: ' + esc((sum.errors || []).join("; ")) + '</strong>' : '') +
        '</span><span style="display:inline-flex;align-items:center;gap:8px;white-space:nowrap;"><span class="small" style="color:var(--muted);">' +
        (sum.generated_at ? "as of " + esc(String(sum.generated_at).replace("T", " ").slice(0, 19)) + " UTC" : "") +
        '</span><button type="button" class="btn small" id="hv-refresh">↻ Refresh</button></span></p>';

      host.innerHTML = genLine +
        '<div class="hv-grid">' + cfgTile + pollTile + roastTile + cronTile + residueTile + calTile + drillTile + flagsTile + '</div>';

      var on = function (id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
      on("hv-refresh", function () { renderHealth(); });
      on("hv-goto-ks", function () { switchTab("killswitches"); });
      on("hv-goto-cal", function () { switchTab("auctioncal"); });
      on("hv-goto-rp", function () { RPUI.testOnly = true; switchTab("ruleprops"); });
      on("hv-drill-discord", function () { CS.healthDrill = "discord"; renderHealth(); });
      on("hv-drill-d1", function () { CS.healthDrill = "d1"; renderHealth(); });
      on("hv-purge-lots", function () {
        if (!window.confirm("Delete ALL " + lots + " TEST auction lot(s) (is_test=1) and their bids?\n\nReal lots are untouchable here. Cannot be undone.")) return;
        var btn = document.getElementById("hv-purge-lots"); if (btn) btn.disabled = true;
        postJSON(apiUrl("/admin/auction/delete-test-lots") + qs, {})
          .then(function (r) { toast("Purged " + (r.deleted_lots || 0) + " lot(s), " + (r.deleted_bids || 0) + " bid(s)", "ok"); })
          .catch(function (e) { toast("Purge failed: " + (e.message || String(e)), "err"); })
          .then(function () { renderHealth(); });
      });
      on("hv-purge-fines", function () {
        if (!window.confirm("Delete the TEST nomination-fine ledger (all days before the real FA Auction opens)?\n\nReal fines are untouchable. Cannot be undone.")) return;
        var btn = document.getElementById("hv-purge-fines"); if (btn) btn.disabled = true;
        postJSON(apiUrl("/admin/auction/delete-test-nom-fines") + qs, {})
          .then(function (r) { toast("Purged " + (r.deleted_days || 0) + " day(s), " + (r.deleted_penalties || 0) + " fine(s)", "ok"); })
          .catch(function (e) { toast("Purge failed: " + (e.message || String(e)), "err"); })
          .then(function () { renderHealth(); });
      });
    });
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  renderShell();
  renderTab();
})();
</script>
</body>
</html>
