<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commish Settings — UPS League</title>
<style>
  :root {
    --bg: #0b0f18; --panel: #141a26; --panel2: #1a2230; --line: #2a3446;
    --fg: #e8edf5; --muted: #8a97ad; --accent: #5b8dff; --warn: #fbbf24; --ok: #4ade80; --danger: #f87171;
    /* Aliases so the panels ported from the Front Office app (which reference
       --border / --panel-alt / --text via inline styles) render unchanged. */
    --border: #2a3446; --panel-alt: #1a2230; --text: #e8edf5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  .cs-wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
  .cs-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .cs-head h1 { font-size: 22px; margin: 0; }
  .cs-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 7px; }
  .cs-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; line-height: 1.5; }
  .cs-gate { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* Top tab bar (MFL Settings · Discord Routing · …) */
  .cs-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .cs-tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font-weight: 600; font-size: 13.5px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
  .cs-tabs button:hover { color: var(--fg); }
  .cs-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* MFL Settings tab — identity tools + grouped setup cards */
  .cs-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .cs-tool { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 9px; text-decoration: none;
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font-weight: 600; font-size: 13px; }
  .cs-tool:hover { border-color: var(--accent); }
  .cs-tool.warn { color: var(--warn); border-color: rgba(251,184,107,0.4); }
  .cs-sech { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .cs-sech .lead { color: var(--accent); }
  .cs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cs-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .cs-card.caution { border-color: rgba(248,113,113,0.35); }
  .cs-card h3 { margin: 0 0 9px; font-size: 13.5px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .cs-card.caution h3 { color: var(--danger); }
  .cs-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .cs-card li a { display: block; padding: 5px 7px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 12.5px; }
  .cs-card li a:hover { background: var(--panel2); color: var(--accent); }
  .cs-card li a::after { content: "↗"; color: var(--muted); font-size: 10px; margin-left: 5px; }
  .cs-note { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.5; }

  /* Operational panels (ported from the FO app) */
  .fo-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .fo-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .fo-card-head h3 { font-size: 15px; margin: 0; }
  .fo-row-hint { font-size: 12px; color: var(--muted); background: var(--panel2); border-left: 3px solid var(--accent);
    padding: 8px 11px; border-radius: 6px; margin: 0 0 12px; line-height: 1.5; }
  .fo-table-loading { padding: 26px; text-align: center; color: var(--muted); }
  .fo-table-scroll { overflow-x: auto; }
  .fo-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fo-table th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 7px 8px; white-space: nowrap; }
  .fo-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .fo-table th.num, .fo-table td.num { text-align: right; }
  .fo-table-empty { text-align: center; color: var(--muted); padding: 18px; }
  .small { font-size: 11.5px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
    cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  .btn.small { padding: 4px 10px; }
  .btn.warn { border-color: rgba(251,184,107,0.55); color: var(--warn); }
  .btn.secondary { color: var(--muted); font-weight: 500; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  /* Toast */
  #cs-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg); padding: 10px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 160ms, transform 160ms; z-index: 9999; }
  #cs-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #cs-toast.err { border-color: var(--danger); color: var(--danger); }
  #cs-toast.ok { border-color: var(--ok); }

  /* Auction War Room */
  .wr-vtabs { display: inline-flex; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .wr-vtabs button { background: transparent; border: 0; color: var(--muted); font-weight: 700; font-size: 13px; padding: 7px 16px; border-radius: 7px; cursor: pointer; }
  .wr-vtabs button.on { background: var(--accent); color: #0a1222; }
  .wr-budget { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted); }
  .wr-budget b { color: var(--fg); font-size: 15px; }
  .wr-results { margin-top: 6px; }
  .wr-res { padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .wr-res:hover { background: var(--panel2); color: var(--accent); }
  .wr-board { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .wr-tier-grp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .wr-tier-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 8px; }
  .wr-tgt { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .wr-tgt:last-child { border-bottom: 0; }
  .wr-tgt .nm { flex: 1 1 180px; }
  .wr-tgt input.wr-max { width: 56px; padding: 4px 6px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font-size: 12px; }
  .wr-tgt select.wr-tier { padding: 4px 6px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font-size: 12px; }
  .wr-rm { background: transparent; border: 0; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .wr-rm:hover { color: var(--danger); }
  .wr-conf { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .wr-conf.high { color: var(--ok); border-color: rgba(74,222,128,0.4); }
  .wr-conf.medium { color: var(--warn); border-color: rgba(251,191,36,0.4); }
  .wr-conf.low { color: var(--danger); border-color: rgba(248,113,113,0.5); }
  .wr-card.lowconf { border-color: rgba(248,113,113,0.35); }
  .wr-verif { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .wr-verif summary { font-size: 12.5px; font-weight: 700; color: var(--accent); cursor: pointer; }
  .wr-verif p { font-size: 12px; color: var(--fg); margin: 8px 0; line-height: 1.5; }
  .wr-verif ul { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  .wr-th { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 6px; }
  .wr-th.high { color: var(--danger); border: 1px solid rgba(248,113,113,0.5); background: rgba(248,113,113,0.08); }
  .wr-th.medium { color: var(--warn); border: 1px solid rgba(251,191,36,0.45); background: rgba(251,191,36,0.07); }
  .wr-th.low { color: var(--muted); border: 1px solid var(--line); }
  .wr-mini-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wr-mini-h { font-size: 12px; font-weight: 700; color: var(--fg); margin-bottom: 7px; }
  .wr-mini-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
  .wr-mini-row b { color: var(--accent); }
  .wr-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .wr-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .wr-card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .wr-stat-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .wr-stat-row b { color: var(--fg); }
  .wr-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .wr-badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .wr-badge.pounce { color: var(--danger); border-color: rgba(248,113,113,0.4); }
  .wr-badge.lurk { color: var(--warn); border-color: rgba(251,191,36,0.4); }
  .wr-badge.owl { color: var(--accent); border-color: rgba(91,141,255,0.4); }
  .wr-badge.whale { color: #c084fc; border-color: rgba(192,132,252,0.4); }
  .wr-heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; height: 16px; border-radius: 4px; overflow: hidden; }
  .wr-hr { display: block; height: 100%; }
  .wr-heat-ax { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin: 2px 0 9px; }
  .wr-hl { font-size: 12.5px; font-weight: 600; color: var(--fg); margin: 4px 0 8px; line-height: 1.4; }
  .wr-dl { margin: 0; font-size: 12px; line-height: 1.5; }
  .wr-dl dt { font-weight: 700; color: var(--accent); margin-top: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .wr-dl dt.vs { color: var(--danger); }
  .wr-dl dd { margin: 1px 0 0; color: var(--muted); }
  .wr-dl dd.vs { color: var(--fg); }
  .wr-ex { margin-top: 8px; }
  .wr-ex summary { font-size: 11.5px; color: var(--accent); cursor: pointer; }
  .wr-ex ul { margin: 6px 0 0; padding-left: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .wr-doc { margin-top: 6px; }
  .wr-doc summary { font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 8px 0; }
  .wr-doc pre { white-space: pre-wrap; font-size: 11.5px; line-height: 1.5; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; }
  /* ── FA Value view ── */
  .fo-sub { font-size: 11px; color: var(--muted); }
  .fav-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .fav-sg-h { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent); margin-bottom: 6px; }
  .fav-fit { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); margin: 0 4px 4px 0; color: var(--muted); }
  .fav-fit.need { color: #fbbf24; border-color: rgba(251,191,36,0.45); background: rgba(251,191,36,0.08); }
  .fav-fit.surp { color: #34d399; border-color: rgba(52,211,153,0.35); }
  .fav-fit.depth { color: #f59e0b; border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.07); }
  .fav-fit.ok { color: var(--muted); }
  .fav-fit.sm { font-size: 10px; padding: 1px 6px; }
  .fav-fit-w { display: inline-block; margin: 0 6px 4px 0; font-size: 11px; color: var(--muted); }
  .fav-comp.own { color: #c084fc; border: 1px solid rgba(192,132,252,0.4); background: rgba(192,132,252,0.08); }
  .fav-row.owned td:first-child { box-shadow: inset 3px 0 0 rgba(192,132,252,0.55); }
  .fav-rate { display: inline-block; font-size: 11px; font-weight: 600; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; margin: 0 4px 4px 0; }
  .fav-note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .fav-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 12px; }
  .fav-cg { display: flex; align-items: center; gap: 6px; }
  .fav-cl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .wr-vtabs.sm { margin: 0; padding: 2px; }
  .wr-vtabs.sm button { font-size: 11px; padding: 4px 9px; }
  .fav-chk { font-size: 12px; color: var(--fg); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #fav-sort { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 12px; }
  .fav-bar { position: relative; height: 7px; background: var(--panel2); border-radius: 4px; margin-bottom: 3px; min-width: 120px; }
  .fav-bar-fill { position: absolute; top: 0; height: 100%; background: linear-gradient(90deg, rgba(91,141,255,0.35), rgba(52,211,153,0.55)); border-radius: 4px; }
  .fav-bar-tick { position: absolute; top: -2px; width: 2px; height: 11px; background: var(--fg); border-radius: 1px; }
  .fav-apw { font-size: 11px; color: var(--muted); } .fav-apw b { color: var(--fg); }
  .fav-rk { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .fav-px { display: block; font-size: 10px; color: var(--muted); }
  .fav-v { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .fav-v.sp { color: #0a1222; background: #34d399; } .fav-v.val { color: #0a1222; background: var(--accent); }
  .fav-v.fair { color: var(--muted); border: 1px solid var(--line); } .fav-v.over { color: #fff; background: var(--danger); }
  .fav-v.dart { color: #0a1222; background: #c084fc; }
  .fav-est { color: #fbbf24; font-weight: 800; margin-left: 3px; }
  .fav-vr.pos { color: #34d399; font-weight: 800; } .fav-vr.posL { color: #5b8dff; font-weight: 700; } .fav-vr.neg { color: var(--danger); }
  .fav-comp { display: inline-block; font-size: 10.5px; color: var(--muted); background: var(--panel2); border-radius: 5px; padding: 1px 6px; margin: 0 3px 2px 0; }
  .fav-comp.big { font-size: 12px; padding: 3px 9px; color: var(--fg); }
  .fav-row { cursor: pointer; } .fav-row:hover { background: var(--panel2); }
  .fav-detail td { background: var(--panel2); }
  .fav-dwrap { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; padding: 4px 2px; }
  .fav-dh { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .fav-dwhy { font-size: 12.5px; color: var(--fg); line-height: 1.5; margin-bottom: 8px; }
  .fav-dmeta { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .fav-table td { vertical-align: middle; }
  /* inflation panel */
  .fav-infl { border-left: 3px solid var(--line); }
  .fav-infl.hot { border-left-color: var(--danger); } .fav-infl.cool { border-left-color: #5b8dff; }
  .fav-infl-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; align-items: center; }
  .fav-infl-big { display: flex; align-items: center; gap: 10px; }
  .fav-infl-x { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .fav-infl.hot .fav-infl-x { color: var(--danger); } .fav-infl.cool .fav-infl-x { color: #5b8dff; }
  .fav-infl-lab { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); line-height: 1.35; }
  .fav-infl-ms { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .fav-infl-m { font-size: 11.5px; color: var(--muted); } .fav-infl-m b { color: var(--fg); font-size: 13px; margin-left: 5px; }
  .fav-infl-note { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }
  /* worth blend slider */
  .fav-blend-tag { font-size: 10.5px; font-weight: 700; color: var(--fg); background: var(--panel2); border-radius: 999px; padding: 1px 8px; }
  .fav-blend input[type=range] { width: 100%; margin: 8px 0 4px; accent-color: var(--accent); cursor: pointer; }
  .fav-blend-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  /* help / explainer */
  .fav-help-q { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 800; font-size: 12px; cursor: pointer; vertical-align: middle; margin-left: 4px; }
  .fav-help-q:hover { background: var(--accent); color: #0a1222; }
  .fav-help-body { max-width: 760px; }
  .fav-help-sec { margin: 14px 0; } .fav-help-sec h4 { font-size: 13.5px; margin: 0 0 5px; color: var(--accent); }
  .fav-help-sec p, .fav-help-sec li { font-size: 13px; line-height: 1.6; color: var(--fg); }
  .fav-help-sec ul { margin: 5px 0; padding-left: 20px; } .fav-help-sec li { margin-bottom: 5px; }
  .fav-ex-pos { margin: 12px 0; padding: 10px 12px; background: var(--panel2); border-radius: 10px; } .fav-ex-pos h4 { margin: 0 0 8px; font-size: 13px; }
  .fav-ex { margin-bottom: 8px; } .fav-ex-h { font-size: 13px; margin-bottom: 3px; }
  .fav-ex-tag { font-size: 9.5px; font-weight: 800; text-transform: uppercase; background: var(--accent); color: #0a1222; padding: 1px 6px; border-radius: 999px; }
  .fav-ex-l { margin: 3px 0 0; padding-left: 18px; } .fav-ex-l li { font-size: 12px; line-height: 1.55; color: var(--muted); } .fav-ex-l b { color: var(--fg); }
  .fav-ex-take { font-size: 12px; line-height: 1.5; color: var(--fg); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  /* positional tiers */
  .fav-tiers-btn { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; }
  .fav-tiers-btn.on { background: var(--accent); color: #0a1222; border-color: var(--accent); }
  .fav-tier-row { display: flex; align-items: stretch; gap: 10px; margin-bottom: 10px; }
  .fav-tier-pos { flex: 0 0 30px; font-size: 15px; font-weight: 800; color: var(--accent); display: flex; align-items: center; }
  .fav-tier-cells { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .fav-tier { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 130px; }
  .fav-tier.sweet { border-color: #34d399; box-shadow: inset 0 0 0 1px rgba(52,211,153,0.35); }
  .fav-tier-l { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  .fav-tier-v { font-size: 12px; color: var(--muted); margin: 2px 0; } .fav-tier-v b { color: var(--fg); }
  .fav-tier-d { font-size: 10px; color: var(--muted); } .fav-tier.sweet .fav-tier-d { color: #34d399; }
  .fav-tier-arrow { color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) { .fav-dwrap { grid-template-columns: 1fr; } .fav-infl-grid { grid-template-columns: 1fr; } .fav-tier-cells { flex-direction: column; align-items: stretch; } .fav-tier-arrow { display: none; } }
  @media (max-width: 560px) { .wr-mini-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="cs-wrap" id="cs-root"><div class="cs-gate">Loading…</div></div>
<div id="cs-toast"></div>
<script>
(function () {
  "use strict";
  function s(v) { return String(v == null ? "" : v).trim(); }

      '<div class="fav-help-sec"><h4>2. PRICE — what he costs</h4>' +
      '<ul><li><b>Free agents</b>: what he\'ll clear for at the auction — his dynasty value, with a floor (any startable NFL player costs something), nudged by inflation.</li>' +
      '<li><b>Trade targets</b> (already on a team): their <b>contract cost (AAV)</b> — what you take on if you trade for them. They\'re not in the auction, so their salary <i>is</i> their price.</li></ul></div>' +
      '<div class="fav-help-sec"><h4>3. GAP — bargain or overpay</h4>' +
      '<p><b>Gap = price − worth.</b> A <b>negative</b> gap (green) means he\'s worth more than he costs — a bargain. A <b>positive</b> gap (red) means you\'re paying extra, usually because you <i>need</i> the position.</p></div>' +
      '<div class="fav-help-sec"><h4>4. INFLATION — why prices drift up</h4>' +
      '<p>Most players sit on cheap contracts, so teams have leftover cap chasing a small pool of free agents. Too many dollars + too few players = prices rise. We <b>track it live</b> in the gauge at the top — and it climbs as the studs get bought.</p></div>' +

  function favDetail(r) {
    var worth = r._w, gap = r._gap, price = r._price, owned = !!r.o, c = r.contract || {};
    // the served (lean) blob carries av/tcv/cl/cy at top level; the full payload nests them under contract.
    var aav = (c.aav_k != null ? c.aav_k : r.av), tcv = (c.tcv_k != null ? c.tcv_k : r.tcv),
      cl = (c.cl != null ? c.cl : r.cl), cy = (c.cy != null ? c.cy : r.cy);
    var DTNAME = (WR.fav.key && WR.fav.key._dt) || {};
    var why;
    if (owned) {
      if (gap <= -3) why = 'Worth <b>$' + worth + 'K</b> but his contract costs only <b>$' + price + 'K</b>/yr → <b>$' + (-gap) + 'K of surplus value</b> you\'d acquire in a trade — a buy-low target.';
      else if (gap >= 3) why = 'Costs <b>$' + price + 'K</b>/yr but worth only <b>$' + worth + 'K</b> → <b>$' + gap + 'K overpaid</b>. His owner may shop him; don\'t take the contract at face.';
      else why = 'Worth <b>$' + worth + 'K</b> ≈ his <b>$' + price + 'K</b>/yr AAV — fairly priced on his deal.';
    } else {
      if (gap <= -3) why = 'Worth <b>$' + worth + 'K</b> but clears ~<b>$' + price + 'K</b> → a <b>$' + (-gap) + 'K discount</b>. His production + asset value beat his expected price.';
      else if (gap >= 3) why = 'Clears ~<b>$' + price + 'K</b> but worth only <b>$' + worth + 'K</b> → a <b>$' + gap + 'K premium</b> — you pay it for the position/slot, not the production.';
      else why = 'Worth <b>$' + worth + 'K</b> ≈ price <b>$' + price + 'K</b> — about fair at the market rate.';
    }
    var backLoaded = (tcv && cl && Math.round(tcv / cl) > (aav || 0) * 1.4);
    var priceBlock = owned
      ? '<div class="fav-dh" style="margin-top:8px">Contract — AAV is the price</div><div class="fav-dmeta">AAV <b>$' + (aav != null ? aav : price) + 'K</b>/yr'
        + (tcv ? ' · total <b>$' + tcv + 'K</b>' : '') + (cl ? ' over ' + cl + ' yr' + (cl > 1 ? 's' : '') : '') + (cy ? ' · ' + cy + ' left' : '')
        + (backLoaded ? ' <span class="fav-est">⚠ back-loaded</span> (true avg ~$' + Math.round(tcv / cl) + 'K)' : '') + '</div>'
      : '<div class="fav-dh" style="margin-top:8px">Expected price</div><div class="fav-dmeta">clears ~<b>$' + price + 'K</b> (inflation-adjusted) · gap <b>' + (gap > 0 ? '+' : '') + gap + 'K</b></div>';
    var dealLine = (!owned && r.dt) ? 'Deal: <b>' + esc(DTNAME[r.dt] || r.dt) + '</b>' : "";

        '<div class="fav-dmeta" style="margin-top:6px">Worth/price shown is open-market value — your read for a trade ask.</div>';
    } else {
      var comp = (r.c || []).map(function (fid) { var t = (WR.fav.teams || {})[fid] || {}; return '<span class="fav-comp big">' + esc(t.team || fid) + (t.capspace != null ? ' · $' + Math.round((t.capspace || 0) / 1000) + 'K room' : '') + '</span>'; }).join(" ");
      lastCol = '<div class="fav-dh">Likely competition</div>' + (comp || '<span class="fav-rk">no other team has a clear need here</span>');
    }
    return '<tr class="fav-detail"><td colspan="8"><div class="fav-dwrap">' +
      '<div><div class="fav-dh">Read — ' + r._vlab + '</div><div class="fav-dwhy">' + why + '</div>' +
      (dealLine ? '<div class="fav-dmeta">' + dealLine + '</div>' : '') + '</div>' +
      '<div><div class="fav-dh">Worth breakdown</div><div class="fav-dmeta">redraft (production) <b>$' + (r.rw || 0) + 'K</b> · dynasty (asset) <b>$' + (r.dw || 0) + 'K</b> → blended <b>$' + worth + 'K</b><br>' +
      'all-play wins earned: proj <b>' + (r.a50 || 0) + '</b> · ceiling <b>' + (r.a90 || 0) + '</b></div>' +
      priceBlock + '</div>' +
      '<div>' + lastCol + '</div>' +
      '</div></td></tr>';
  }

  // DISCORD ROUTING — per-mechanism prod/test channel (POST /admin/commish-settings)
  // ════════════════════════════════════════════════════════════════════
  function renderDiscordRouting() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading Discord routing…</div></div>';
    fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L)).then(function (data) {
      if (CS.tab !== myTab) return;   // tab switched while the fetch was in flight
      var cfg = (data && data.discord_routing) || {};
      var labels = { extension: "Extension", myac: "Auction Contract (FA + MYAC)", auctionbidding: "Auction Bidding (live bid/nom narration)", restructure: "Restructure", tag: "Tag / Untag", mym: "MYM", traderoast: "Trade Roast bot (trades always post to #transactions)" };
      var rowHtml = Object.keys(labels).map(function (k) {
        var val = String(cfg[k] || "prod").toLowerCase();
        var seg = ["prod", "test"].map(function (o) {
          var on = val === o, c = o === "test" ? "#e67e22" : "#1f8a4c";
          return '<button type="button" class="fo-route-btn" data-route="' + k + '" data-val="' + o + '" style="padding:4px 14px;border:1px solid var(--border);background:' + (on ? c : "var(--panel-alt)") + ";color:" + (on ? "#fff" : "var(--text)") + ";cursor:pointer;font-weight:" + (on ? "600" : "400") + ";" + (o === "prod" ? "border-radius:4px 0 0 4px;" : "border-radius:0 4px 4px 0;border-left:none;") + '">' + (o === "prod" ? "Prod" : "Test") + "</button>";
        }).join("");
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);"><span>' + esc(labels[k]) + '</span><span style="display:inline-flex;">' + seg + "</span></div>";
      }).join("");
      host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Discord Routing</h3></div>' +
        '<p class="fo-row-hint">💡 Per-mechanism: where contract announcements post. <strong style="color:#1f8a4c;">Prod</strong> = league channel · <strong style="color:#e67e22;">Test</strong> = test channel. Dry-run submissions always go to test regardless. Saved to D1 instantly.</p>' +
        rowHtml + "</div>";
      $$(".fo-route-btn", host).forEach(function (btn) {
        btn.addEventListener("click", function () {
          var k = btn.getAttribute("data-route"), v = btn.getAttribute("data-val");
          if (String(cfg[k] || "prod").toLowerCase() === v) return;
          var upd = {}; upd[k] = v;
          postJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L), { discord_routing: upd })
            .then(function () { toast((labels[k] || k) + " → " + (v === "test" ? "Test" : "Prod"), "ok"); })
            .catch(function (e) { toast("Failed: " + (e.message || String(e)), "err"); })
            .then(function () { renderDiscordRouting(); });
        });
      });
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Failed to load: ' + esc(e.message || String(e)) + "</div></div>";
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // KILL SWITCHES — runtime feature flags (POST /admin/commish-settings)
  // ════════════════════════════════════════════════════════════════════
  function renderKillSwitches() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading kill switches…</div></div>';
    fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L)).then(function (data) {
      if (CS.tab !== myTab) return;
      var flags = (data && data.feature_flags) || [];
      var rowHtml = flags.map(function (f) {
        var on = !!f.value;
        var onColor = "#1f8a4c";
        var seg = [["on", "On"], ["off", "Off"]].map(function (pair) {
          var o = pair[0], isOn = (o === "on") === on;
          var bg = isOn ? (o === "on" ? onColor : "#7a7f87") : "var(--panel-alt)";
          return '<button type="button" class="fo-flag-btn" data-flag="' + esc(f.key) + '" data-val="' + o + '" style="padding:4px 16px;border:1px solid var(--border);background:' + bg + ";color:" + (isOn ? "#fff" : "var(--text)") + ";cursor:pointer;font-weight:" + (isOn ? "600" : "400") + ";" + (o === "on" ? "border-radius:4px 0 0 4px;" : "border-radius:0 4px 4px 0;border-left:none;") + '">' + pair[1] + "</button>";
        }).join("");
        var src = f.overridden ? "commish override" : "default";
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);">' +
          '<span style="flex:1;"><strong>' + esc(f.label) + (f.danger ? ' <span style="color:#c0392b;">⚠️</span>' : "") + '</strong>' +
          '<br><span class="small" style="color:var(--muted);">' + esc(f.help) + '</span>' +
          '<br><span class="small" style="color:var(--muted);opacity:.8;">' + esc(f.key) + " · " + src + "</span></span>" +
          '<span style="display:inline-flex;flex:0 0 auto;">' + seg + "</span></div>";
      }).join("");
      host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Kill Switches</h3></div>' +
        '<p class="fo-row-hint">💡 Flip a feature on/off live — no redeploy. Saved to D1 instantly. A ⚠️ flag is a live action and asks for confirmation before turning On.</p>' +
        rowHtml + "</div>";
      $$(".fo-flag-btn", host).forEach(function (btn) {
        btn.addEventListener("click", function () {
          var k = btn.getAttribute("data-flag"), v = btn.getAttribute("data-val") === "on";
          var cur = flags.filter(function (f) { return f.key === k; })[0];
          if (cur && !!cur.value === v) return;
          if (cur && cur.danger && v && !window.confirm('Turn ON "' + cur.label + '" (live)? ' + (cur.help || "This is a live action that can't be easily undone."))) return;
          var upd = {}; upd[k] = v ? "1" : "0";
          postJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L), { feature_flags: upd })
            .then(function () { toast((cur ? cur.label : k) + " → " + (v ? "On" : "Off"), v && cur && cur.danger ? "err" : "ok"); })
            .catch(function (e) { toast("Failed: " + (e.message || String(e)), "err"); })
            .then(function () { renderKillSwitches(); });
        });
      });
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Failed to load: ' + esc(e.message || String(e)) + "</div></div>";
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // CONTRACT REVERT — list recent submissions, dry-run preview, revert in MFL
  // ════════════════════════════════════════════════════════════════════
  function ctKindLabel(k) { return { myac: "MYAC", extension: "Extension", restructure: "Restructure", mym: "MYM", tag: "Tag", untag: "Untag" }[k] || k; }
  function ctContractStr(c, isTag) {
    if (!c) return isTag ? "(untag)" : "—";
    var sal = c.salary != null ? "$" + Number(c.salary).toLocaleString() : "$?";
    var yr = c.contract_year != null ? c.contract_year + "yr" : "";
    return [c.contract_status || "", yr, sal].filter(Boolean).join(" · ");
  }
  function franchiseName(fid) { return (CS.fmap && CS.fmap[pad4(fid)]) || s(fid); }

  function loadFranchiseMap() {
    if (CS.fmap) return Promise.resolve(CS.fmap);
    return fetchJSON(apiUrl("/api/mfl-export") + "?TYPE=league&L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR))
      .then(function (d) {
        var fr = d && d.league && d.league.franchises && d.league.franchises.franchise;
        var arr = Array.isArray(fr) ? fr : (fr ? [fr] : []);
        var m = {}; arr.forEach(function (f) { if (f && f.id) m[pad4(f.id)] = f.name || f.id; });
        CS.fmap = m; return m;
      }).catch(function () { CS.fmap = {}; return {}; });
  }

  function renderContractRevert() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Contract Revert</h3>' +
      '<span class="small" id="cs-cr-meta" style="color:var(--muted);">Loading…</span></div>' +
      '<p class="fo-row-hint">💡 Select recent contract submissions and revert them — restores the prior contract in MFL (tags → untag). Discord is silenced for reverts. A dry-run preview + confirm runs before any write.</p>' +
      '<div id="cs-cr-body"><div class="fo-table-loading">Loading contract submissions…</div></div></div>';
    CS.cr.sel = {};
    Promise.all([
      loadFranchiseMap(),
      fetchJSON(apiUrl("/admin/contract-submissions") + "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR))
    ]).then(function (res) {
      if (CS.tab !== myTab) return;
      CS.cr.subs = (res[1] && res[1].submissions) || [];
      var meta = document.getElementById("cs-cr-meta");
      if (meta) meta.textContent = CS.cr.subs.length + " submission" + (CS.cr.subs.length === 1 ? "" : "s") + " · " + YEAR;
      renderContractRevertBody();
    }).catch(function (e) {
      if (CS.tab !== myTab) return;
      var b = document.getElementById("cs-cr-body");
      if (b) b.innerHTML = '<div class="fo-table-loading">Failed to load: ' + esc(e.message || String(e)) + "</div>";
    });
  }

  function renderContractRevertBody() {
    var body = document.getElementById("cs-cr-body");
    if (!body) return;
    var cr = CS.cr;
    if (!cr.subs.length) { body.innerHTML = '<div class="fo-table-loading">No contract submissions this season.</div>'; return; }
    var fmtDt = function (x) { return s(x).replace("T", " ").slice(0, 16); };
    var rows = cr.subs.map(function (sub) {
      var key = sub.table + ":" + sub.id;
      var checked = cr.sel[key] ? "checked" : "";
      var disabled = sub.revertable ? "" : "disabled";
      var isTag = sub.kind === "tag" || sub.kind === "untag";
      var newStr = ctContractStr(sub.new, false) + (sub.new && sub.new.tag_side ? " (" + sub.new.tag_side + ")" : "");
      var priorStr = ctContractStr(sub.prior, isTag);
      return '<tr>' +
        '<td style="text-align:center;"><input type="checkbox" class="cs-cr-chk" data-key="' + esc(key) + '" ' + checked + ' ' + disabled + '></td>' +
        '<td>' + esc(sub.player_name || sub.player_id || "") + '</td>' +
        '<td>' + esc(ctKindLabel(sub.kind)) + '</td>' +
        '<td>' + esc(franchiseName(sub.franchise_id)) + '</td>' +
        '<td class="small">' + esc(newStr) + '</td>' +
        '<td class="small">' + esc(priorStr) + (sub.revertable ? '' : ' <span style="color:var(--muted);">(no revert)</span>') + '</td>' +
        '<td class="small">' + esc(fmtDt(sub.submitted_at_utc)) + '</td>' +
        '</tr>';
    }).join("");
    var nSel = Object.keys(cr.sel).filter(function (k) { return cr.sel[k]; }).length;
    body.innerHTML =
      '<div style="margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
        '<button type="button" class="btn small warn" id="cs-cr-revert"' + (nSel ? '' : ' disabled') + '>Revert selected (' + nSel + ')</button>' +
        '<button type="button" class="btn small secondary" id="cs-cr-refresh">↻ Refresh</button>' +
        '<span class="small" id="cs-cr-status" style="color:var(--muted);"></span>' +
      '</div>' +
      '<div class="fo-table-scroll"><table class="fo-table"><thead><tr>' +
        '<th style="width:32px;"></th><th>Player</th><th>Kind</th><th>Team</th><th>Submitted (new)</th><th>Reverts to (prior)</th><th>When (UTC)</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    $$(".cs-cr-chk", body).forEach(function (chk) {
      chk.addEventListener("change", function () {
        var k = this.getAttribute("data-key");
        if (this.checked) cr.sel[k] = true; else delete cr.sel[k];
        renderContractRevertBody();
      });
    });
    var rb = document.getElementById("cs-cr-revert"); if (rb) rb.addEventListener("click", doContractRevert);
    var fb = document.getElementById("cs-cr-refresh"); if (fb) fb.addEventListener("click", renderContractRevert);
  }

  function doContractRevert() {
    var cr = CS.cr;
    var reverts = Object.keys(cr.sel).filter(function (k) { return cr.sel[k]; }).map(function (k) {
      var i = k.lastIndexOf(":"); return { table: k.slice(0, i), id: parseInt(k.slice(i + 1), 10) || 0 };
    });
    if (!reverts.length) return;
    var status = document.getElementById("cs-cr-status");
    var setStatus = function (m) { if (status) status.textContent = m; };
    var revertUrl = apiUrl("/admin/contract-revert") + "?L=" + encodeURIComponent(L) + "&YEAR=" + encodeURIComponent(YEAR);
    setStatus("Previewing (dry-run)…");
    postJSON(revertUrl, { league_id: L, season: YEAR, dry_run: true, reverts: reverts }).then(function (dry) {
      var lines = (dry.results || []).map(function (r) {
        var to = r.restored && r.restored.contract_status
          ? r.restored.contract_status + " " + r.restored.contract_year + "yr $" + Number(r.restored.salary || 0).toLocaleString()
          : "untag";
        var sub = (cr.subs || []).filter(function (x) { return x.table === r.table && String(x.id) === String(r.id); })[0];
        var nm = r.player_name || (sub && sub.player_name) || r.id;
        return (r.ok ? "✓" : "✗") + " " + nm + " → " + to + (r.error ? " (" + r.error + ")" : "");
      });
      if (!window.confirm("Revert " + reverts.length + " contract(s) in MFL?\n\n" + lines.join("\n") + "\n\nThis writes to MFL (Discord silenced) and is not undoable from here.")) {
        setStatus(""); return;
      }
      setStatus("Reverting…");
      postJSON(revertUrl, { league_id: L, season: YEAR, dry_run: false, reverts: reverts }).then(function (resp) {
        var all = resp.results || [];
        var okN = all.filter(function (r) { return r.ok; }).length;
        var failed = all.filter(function (r) { return !r.ok; });
        setStatus("Reverted " + okN + "/" + all.length + (failed.length ? " — failed: " + failed.map(function (f) { return (f.player_name || f.id) + " (" + (f.error || f.status || "?") + ")"; }).join(", ") : "") + ". Refreshing…");
        cr.sel = {};
        toast("Reverted " + okN + "/" + all.length, failed.length ? "err" : "ok");
        renderContractRevert();
      }).catch(function (e) { setStatus("Revert failed: " + (e.message || e)); });
    }).catch(function (e) { setStatus("Preview failed: " + (e.message || e)); });
  }

  // ════════════════════════════════════════════════════════════════════
  // STATUS — Discord posters (live routing) + D1 writers (live row counts)
  // ════════════════════════════════════════════════════════════════════
  function renderStatus() {
    var host = content();
    var myTab = CS.tab;
    host.innerHTML = '<div class="fo-card"><div class="fo-table-loading">Loading status…</div></div>';
    Promise.all([
      fetchJSON(apiUrl("/admin/commish-settings") + "?L=" + encodeURIComponent(L)).catch(function () { return {}; }),
      fetchJSON(apiUrl("/admin/d1-status") + "?L=" + encodeURIComponent(L)).catch(function () { return {}; })
    ]).then(function (res) {
      if (CS.tab !== myTab) return;
      var routing = (res[0] || {}).discord_routing || {};
      var d1 = (res[1] || {}).tables || [];
      var pill = function (state, txt) {
        var c = state === "prod" ? "#1f8a4c" : state === "test" ? "#e67e22" : "#7a7a7a";
        return '<span style="background:' + c + ';color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;white-space:nowrap;">' + esc(txt) + "</span>";
      };
      var discordRows = [
        { n: "Contract — Extension", k: "extension" },
        { n: "Contract — Auction (FA + MYAC)", k: "myac" },
        { n: "Contract — Restructure", k: "restructure" },
        { n: "Contract — Tag / Untag", k: "tag" },
        { n: "Contract — MYM", k: "mym" },
        { n: "Drop / Cap penalty", state: "prod" },
        { n: "Trade notification", state: "prod" },
        { n: "Auction alerts (live bid/nom)", k: "auctionbidding" },
        { n: "Deadline reminders", state: "prod" },
        { n: "Trade Roast bot", state: "prod", note: "RUNNING — trade roasts post to #transactions, always. Manually tracked (separate process). The Discord Routing toggle does NOT steer it — trades always go to #transactions." }
      ].map(function (r) {
        var state = r.k ? String(routing[r.k] || "prod").toLowerCase() : r.state;
        var label = state === "inactive" ? "INACTIVE" : (state === "test" ? "TEST" : "PROD");
        return "<tr><td>" + esc(r.n) + "</td><td>" + pill(state, label) + '</td><td class="small" style="color:var(--muted);">' + esc(r.note || (r.k ? "commish-configurable" : "wired")) + "</td></tr>";
      }).join("");
      var cntByTable = {}; d1.forEach(function (t) { cntByTable[t.table] = t; });
      var d1Defs = [
        { cat: "Contract Submissions", n: "Extensions / FA / historical", t: "ups_extension_submissions", freq: "on submit + forum backfill" },
        { cat: "Contract Submissions", n: "Restructures", t: "ups_restructure_submissions", freq: "on submit + ingest action" },
        { cat: "Contract Submissions", n: "Tags / Untags", t: "ups_tag_submissions", freq: "on submit" },
        { cat: "Contract Submissions", n: "Commish settings", t: "ups_settings", freq: "on change" },
        { cat: "MFL", n: "Drop / cap-penalty events", t: "ups_drop_events", freq: "on cut + scan" },
        { cat: "MFL", n: "ERA auction pool", t: "ups_era_pool", freq: "pre-auction sync" },
        { cat: "MFL", n: "Auction lots / bids", t: "ups_auction_lots", freq: "live during auction" },
        { cat: "MFL", n: "Draft picks", t: "ups_draft_picks", freq: "hourly cron" },
        { cat: "MFL", n: "Tag history", t: "ups_tag_history", freq: "tag pipeline" },
        { cat: "MFL", n: "MYM history", t: "ups_mym_history", freq: "MYM submit" }
      ];
      var known = {}; d1Defs.forEach(function (d) { known[d.t] = true; });
      d1.forEach(function (t) { if (!known[t.table]) d1Defs.push({ cat: "Other", n: "—", t: t.table, freq: "—" }); });
      var d1Rows = d1Defs.map(function (d) {
        var live = cntByTable[d.t];
        var rows = live ? live.rows : 0;
        var last = live && live.last_write ? s(live.last_write).replace("T", " ").slice(0, 16) : "—";
        var st = live && rows > 0 ? "prod" : "inactive";
        return "<tr><td>" + esc(d.cat) + "</td><td>" + esc(d.n) + '</td><td class="small"><code>' + esc(d.t) + "</code></td><td class=\"num\">" + rows + '</td><td class="small" style="color:var(--muted);">' + esc(d.freq) + "</td><td class=\"small\" style=\"color:var(--muted);\">" + esc(last) + "</td><td>" + pill(st, st === "prod" ? "LIVE" : "EMPTY") + "</td></tr>";
      }).join("");
      var viewSel = '<select id="cs-status-view" style="background:var(--panel-alt);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:4px;">' +
        '<option value="discord"' + (CS.statusView === "discord" ? " selected" : "") + ">Discord</option>" +
        '<option value="d1"' + (CS.statusView === "d1" ? " selected" : "") + ">D1</option></select>";
      var inner = CS.statusView === "d1"
        ? '<p class="fo-row-hint">💡 Everything that writes to D1 — MFL data vs Contract Submissions — with live row counts (the source of truth).</p>' +
          '<div class="fo-table-scroll"><table class="fo-table"><thead><tr><th>Category</th><th>Writes</th><th>Table</th><th class="num">Rows</th><th>Frequency</th><th>Last write</th><th>Status</th></tr></thead><tbody>' + d1Rows + "</tbody></table></div>"
        : '<p class="fo-row-hint">💡 Everything scheduled to post to Discord, and whether it routes to Prod / Test / is Inactive. Contract types are live from the Discord Routing settings.</p>' +
          '<div class="fo-table-scroll"><table class="fo-table"><thead><tr><th>Poster</th><th>Routing</th><th>Notes</th></tr></thead><tbody>' + discordRows + "</tbody></table></div>";
      host.innerHTML = '<div class="fo-card"><div class="fo-card-head"><h3>Status</h3>' +
        '<span style="display:inline-flex;align-items:center;gap:6px;"><span class="small" style="color:var(--muted);">View</span>' + viewSel + "</span></div>" + inner + "</div>";
      var vs = document.getElementById("cs-status-view"); if (vs) vs.addEventListener("change", function () { CS.statusView = this.value; renderStatus(); });
    });
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  renderShell();
  renderTab();
})();
</script>
</body>
</html>
