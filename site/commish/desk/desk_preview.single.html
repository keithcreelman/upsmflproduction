<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Commissioner Desk preview</title>
<style>
/* UPS Commissioner Desk: styles. Phone first (320 px and up), light and dark, no external fonts or libraries.
 * Scoped under .ud-root. Theme: follows prefers-color-scheme; data-theme="dark" or "light" on .ud-root forces one.
 * Every text/background pair below is at least 4.5:1 (checked), borders at least 3:1. Color is never the only signal:
 * grades, states and boxes all carry text labels. */

.ud-root {
  --ud-bg: #f4f6fa; --ud-surface: #ffffff; --ud-surface2: #e9edf4; --ud-text: #161c2a; --ud-muted: #455064; --ud-border: #7d889e; --ud-hair: #c9d1de;
  --ud-accent: #1a47c4; --ud-accent-text: #ffffff; --ud-link: #1a47c4; --ud-focus: #b25000;
  --ud-amber-bg: #fff1c7; --ud-amber-tx: #452b00; --ud-amber-bd: #8a5700;
  --ud-blue-bg: #e1ebff; --ud-blue-tx: #0e2766; --ud-blue-bd: #2b55c7;
  --ud-red-bg: #fde4e2; --ud-red-tx: #5a0e08; --ud-red-bd: #b42318;
  --ud-grey-bg: #e7ebf2; --ud-grey-tx: #2a3244; --ud-grey-bd: #6b768b;
  --ud-info-bg: #e3edf4; --ud-info-tx: #17364d; --ud-info-bd: #3b6e95;
  --ud-ok-bg: #e7f3ec; --ud-ok-tx: #12351f; --ud-ok-bd: #2f7a4d;
  --ud-gA-bg: #d9f2e1; --ud-gA-tx: #0c4a28; --ud-gB-bg: #dce8ff; --ud-gB-tx: #12388f; --ud-gC-bg: #e8e0ff; --ud-gC-tx: #37238a;
  --ud-gD-bg: #ffe6bd; --ud-gD-tx: #5e3500; --ud-gN-bg: #ffdada; --ud-gN-tx: #6e0c0c;
  --ud-shadow: 0 8px 28px rgba(10, 20, 40, .28);
}
@media (prefers-color-scheme: dark) {
  .ud-root:not([data-theme="light"]) {
    --ud-bg: #0b101b; --ud-surface: #131a29; --ud-surface2: #1c2538; --ud-text: #e8edf7; --ud-muted: #b0bacd; --ud-border: #6a7690; --ud-hair: #2e3a54;
    --ud-accent: #8fb2ff; --ud-accent-text: #0a1226; --ud-link: #9dbaff; --ud-focus: #ffb454;
    --ud-amber-bg: #3a2a06; --ud-amber-tx: #ffe3a8; --ud-amber-bd: #d99a1e;
    --ud-blue-bg: #14264f; --ud-blue-tx: #d3e2ff; --ud-blue-bd: #7aa0ff;
    --ud-red-bg: #40130f; --ud-red-tx: #ffd6d1; --ud-red-bd: #ff8272;
    --ud-grey-bg: #222c42; --ud-grey-tx: #dde4f1; --ud-grey-bd: #8793ac;
    --ud-info-bg: #14303f; --ud-info-tx: #cfe8f7; --ud-info-bd: #6fb0d8;
    --ud-ok-bg: #12301f; --ud-ok-tx: #cdeedb; --ud-ok-bd: #4fae78;
    --ud-gA-bg: #12402a; --ud-gA-tx: #c4f2d4; --ud-gB-bg: #1b3270; --ud-gB-tx: #d0defe; --ud-gC-bg: #33276b; --ud-gC-tx: #e0d8ff;
    --ud-gD-bg: #4a3208; --ud-gD-tx: #ffe2b0; --ud-gN-bg: #521818; --ud-gN-tx: #ffd5d5;
    --ud-shadow: 0 8px 28px rgba(0, 0, 0, .6);
  }
}
.ud-root[data-theme="dark"] {
  --ud-bg: #0b101b; --ud-surface: #131a29; --ud-surface2: #1c2538; --ud-text: #e8edf7; --ud-muted: #b0bacd; --ud-border: #6a7690; --ud-hair: #2e3a54;
  --ud-accent: #8fb2ff; --ud-accent-text: #0a1226; --ud-link: #9dbaff; --ud-focus: #ffb454;
  --ud-amber-bg: #3a2a06; --ud-amber-tx: #ffe3a8; --ud-amber-bd: #d99a1e;
  --ud-blue-bg: #14264f; --ud-blue-tx: #d3e2ff; --ud-blue-bd: #7aa0ff;
  --ud-red-bg: #40130f; --ud-red-tx: #ffd6d1; --ud-red-bd: #ff8272;
  --ud-grey-bg: #222c42; --ud-grey-tx: #dde4f1; --ud-grey-bd: #8793ac;
  --ud-info-bg: #14303f; --ud-info-tx: #cfe8f7; --ud-info-bd: #6fb0d8;
  --ud-ok-bg: #12301f; --ud-ok-tx: #cdeedb; --ud-ok-bd: #4fae78;
  --ud-gA-bg: #12402a; --ud-gA-tx: #c4f2d4; --ud-gB-bg: #1b3270; --ud-gB-tx: #d0defe; --ud-gC-bg: #33276b; --ud-gC-tx: #e0d8ff;
  --ud-gD-bg: #4a3208; --ud-gD-tx: #ffe2b0; --ud-gN-bg: #521818; --ud-gN-tx: #ffd5d5;
  --ud-shadow: 0 8px 28px rgba(0, 0, 0, .6);
}

/* ── Base ─────────────────────────────────────────────────────────────────────────────────── */
.ud-root, .ud-root * { box-sizing: border-box; }
.ud-root {
  background: var(--ud-bg); color: var(--ud-text); max-width: 100%; min-width: 0; padding: 12px 16px 40px;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: anywhere; -webkit-text-size-adjust: 100%;
}
.ud-root > * { max-width: 760px; margin-left: auto; margin-right: auto; }
.ud-root h1, .ud-root h2, .ud-root h3, .ud-root h4, .ud-root p, .ud-root ul, .ud-root ol, .ud-root dl, .ud-root dd, .ud-root figure { margin: 0; }
.ud-root code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--ud-surface2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.ud-root a { color: var(--ud-link); }
.ud-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ud-muted { color: var(--ud-muted); }
.ud-note { color: var(--ud-muted); font-size: 13px; line-height: 1.45; margin-top: 6px; }
.ud-root :focus-visible { outline: 3px solid var(--ud-focus); outline-offset: 2px; border-radius: 4px; }
.ud-root [hidden] { display: none !important; }

/* Grid containers must not grow to the widest child: one shrinkable column. */
.ud-form, .ud-card, .ud-lead, .ud-block, .ud-branches, .ud-branch, .ud-box, .ud-conflict, .ud-follow, .ud-foot, .ud-report, .ud-drawer-panel, .ud-steps, .ud-tl-main { grid-template-columns: minmax(0, 1fr); }

/* ── Buttons and inputs (44 px tap targets) ───────────────────────────────────────────────── */
.ud-btn { font: inherit; font-weight: 600; min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--ud-border);
  background: var(--ud-surface); color: var(--ud-text); cursor: pointer; text-align: center; max-width: 100%; }
.ud-btn-primary { background: var(--ud-accent); color: var(--ud-accent-text); border-color: var(--ud-accent); }
.ud-btn-ghost { background: transparent; }
.ud-btn-chip { text-align: left; font-weight: 500; border-radius: 22px; padding: 8px 14px; line-height: 1.3; }
.ud-btn:hover { filter: brightness(.96); }
.ud-btn:disabled, .ud-btn[aria-disabled="true"], .ud-hist:disabled { opacity: .55; cursor: not-allowed; }
.ud-input { font: inherit; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ud-border); background: var(--ud-surface); color: var(--ud-text); resize: vertical; }
select.ud-input, input.ud-input { max-width: 100%; }
.ud-label { display: block; font-weight: 700; margin-bottom: 6px; }

/* ── Ask box ──────────────────────────────────────────────────────────────────────────────── */
.ud-fixture-note { margin-bottom: 10px; }
.ud-ask { background: var(--ud-surface); border: 1px solid var(--ud-hair); border-radius: 14px; padding: 14px; }
.ud-form { display: grid; gap: 10px; }
.ud-asof { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ud-asof label { font-size: 13px; color: var(--ud-muted); }
.ud-asof .ud-input { width: auto; min-width: 150px; }
.ud-form .ud-btn-primary { width: 100%; }
.ud-msg { min-height: 20px; font-size: 13px; color: var(--ud-red-tx); background: transparent; }
.ud-msg:empty { display: none; }
.ud-suggest { margin-top: 12px; }
.ud-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ud-more { margin-top: 10px; }
.ud-more > summary { min-height: 44px; display: flex; align-items: center; }

/* ── Progress ─────────────────────────────────────────────────────────────────────────────── */
.ud-progress { margin-top: 12px; background: var(--ud-surface); border: 1px solid var(--ud-hair); border-left: 5px solid var(--ud-accent); border-radius: 12px; padding: 12px 14px; }
.ud-steps { list-style: none; padding: 0; display: grid; gap: 4px; }
.ud-steps li { display: flex; gap: 8px; align-items: baseline; color: var(--ud-muted); }
.ud-steps li.ud-s-done { color: var(--ud-text); }
.ud-steps li.ud-s-now { color: var(--ud-text); font-weight: 700; }
.ud-step-m { display: inline-block; min-width: 18px; text-align: center; }
.ud-elapsed { margin-top: 6px; font-size: 13px; color: var(--ud-muted); font-variant-numeric: tabular-nums; }

/* ── Card ─────────────────────────────────────────────────────────────────────────────────── */
.ud-result { margin-top: 14px; outline: none; }
.ud-card { background: var(--ud-surface); border: 1px solid var(--ud-hair); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ud-head { display: flex; flex-wrap: wrap; gap: 6px; }
.ud-chip { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 10px; border-radius: 13px; border: 1px solid var(--ud-border); background: var(--ud-surface2); font-size: 12px; font-weight: 600; color: var(--ud-text); }
.ud-chip-ai { background: var(--ud-accent); color: var(--ud-accent-text); border-color: var(--ud-accent); }
.ud-chip-phase { background: var(--ud-amber-bg); color: var(--ud-amber-tx); border-color: var(--ud-amber-bd); }
.ud-qline { color: var(--ud-muted); font-size: 14px; }
.ud-qlabel { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; color: var(--ud-text); }
.ud-banner { border: 1px solid; border-left-width: 6px; border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.ud-banner-t { margin-right: 4px; }
.ud-tone-ok { background: var(--ud-ok-bg); color: var(--ud-ok-tx); border-color: var(--ud-ok-bd); }
.ud-tone-grey { background: var(--ud-grey-bg); color: var(--ud-grey-tx); border-color: var(--ud-grey-bd); }
.ud-tone-amber { background: var(--ud-amber-bg); color: var(--ud-amber-tx); border-color: var(--ud-amber-bd); }
.ud-tone-blue { background: var(--ud-blue-bg); color: var(--ud-blue-tx); border-color: var(--ud-blue-bd); }
.ud-tone-red { background: var(--ud-red-bg); color: var(--ud-red-tx); border-color: var(--ud-red-bd); }
.ud-tone-info { background: var(--ud-info-bg); color: var(--ud-info-tx); border-color: var(--ud-info-bd); }
.ud-state-stale_data .ud-banner { border-style: solid; border-width: 2px 2px 2px 8px; }
.ud-lead { display: grid; gap: 8px; font-size: 16px; line-height: 1.65; }
.ud-lead-p { margin: 0; }
.ud-caveat, .ud-notice { background: var(--ud-grey-bg); color: var(--ud-grey-tx); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.ud-notice { background: var(--ud-info-bg); color: var(--ud-info-tx); }

/* Fact chip: one tap opens the provenance drawer. The ::after widens the hit area to 44 px without growing the line. */
.ud-fact { position: relative; display: inline-flex; align-items: center; gap: 5px; margin: 1px 2px; padding: 1px 4px 1px 8px; min-height: 28px; font: inherit; font-weight: 700;
  font-variant-numeric: tabular-nums; color: var(--ud-text); background: var(--ud-surface2); border: 1px solid var(--ud-border); border-radius: 8px; cursor: pointer; vertical-align: baseline; max-width: 100%; text-align: left; overflow-wrap: anywhere; }
.ud-fact::after { content: ""; position: absolute; left: -4px; right: -4px; top: 50%; height: 44px; transform: translateY(-50%); }
.ud-fact:hover { border-color: var(--ud-accent); }
.ud-fv { min-width: 0; }
.ud-gr { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .03em; line-height: 1; padding: 4px 6px; border-radius: 5px; white-space: nowrap; border: 1px solid transparent; }
.ud-g-A { background: var(--ud-gA-bg); color: var(--ud-gA-tx); border-color: var(--ud-gA-tx); }
.ud-g-B { background: var(--ud-gB-bg); color: var(--ud-gB-tx); border-color: var(--ud-gB-tx); }
.ud-g-C { background: var(--ud-gC-bg); color: var(--ud-gC-tx); border-color: var(--ud-gC-tx); }
.ud-g-D { background: var(--ud-gD-bg); color: var(--ud-gD-tx); border-color: var(--ud-gD-tx); border-style: dotted; }
.ud-g-NO_RECORD { background: var(--ud-gN-bg); color: var(--ud-gN-tx); border-color: var(--ud-gN-tx); border-style: dashed; }
.ud-missing { display: inline-block; padding: 1px 8px; border: 2px dashed var(--ud-red-bd); border-radius: 8px; background: var(--ud-red-bg); color: var(--ud-red-tx); font-size: 13px; font-weight: 700; }
.ud-missing-t { text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }

/* ── Blocks ───────────────────────────────────────────────────────────────────────────────── */
.ud-block { display: grid; gap: 8px; min-width: 0; border-top: 1px solid var(--ud-hair); padding-top: 12px; }
.ud-block-t { font-size: 14px; font-weight: 800; }
.ud-block-src { font-size: 12px; color: var(--ud-muted); }
.ud-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--ud-hair); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.ud-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
.ud-table th, .ud-table td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--ud-hair); min-width: 78px; }
.ud-table thead th { background: var(--ud-surface2); font-weight: 800; font-size: 12.5px; position: sticky; top: 0; }
.ud-table tbody th { position: sticky; left: 0; background: var(--ud-surface); font-weight: 700; z-index: 1; min-width: 110px; max-width: 150px; border-right: 1px solid var(--ud-hair); }
.ud-table tbody tr:last-child th, .ud-table tbody tr:last-child td { border-bottom: 0; }
.ud-table .ud-num { text-align: right; font-variant-numeric: tabular-nums; }
.ud-table td, .ud-table th { overflow-wrap: break-word; }
.ud-compare thead th:not(:first-child) { text-align: center; }
.ud-chart svg { display: block; width: 100%; height: auto; max-height: 220px; background: var(--ud-surface2); border-radius: 10px; }
.ud-bar { fill: var(--ud-accent); }
.ud-base { stroke: var(--ud-muted); stroke-width: 1; }
.ud-axis { fill: var(--ud-text); font-size: 9.5px; font-family: inherit; }
.ud-era { stroke: var(--ud-amber-bd); stroke-width: 1.5; stroke-dasharray: 4 3; }
.ud-era-t { fill: var(--ud-text); font-size: 9px; font-weight: 700; }

.ud-timeline { list-style: none; padding: 0; display: grid; gap: 0; border-left: 3px solid var(--ud-border); margin-left: 6px; }
.ud-tl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 6px 0 10px 12px; position: relative; }
.ud-tl-row::before { content: ""; position: absolute; left: -9px; top: 12px; width: 13px; height: 13px; border-radius: 50%; background: var(--ud-surface); border: 3px solid var(--ud-accent); }
.ud-tl-date { grid-column: 1; font-size: 12.5px; color: var(--ud-muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.ud-tl-main { grid-column: 1; display: grid; gap: 2px; min-width: 0; }
.ud-tl-g { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
.ud-tl-move { font-weight: 600; }
.ud-tl-final .ud-tl-move, .ud-tl-final .ud-tl-what { font-weight: 800; }
.ud-tl-final::before { background: var(--ud-accent); }
.ud-tl-gap { border-top: 0; }
.ud-tl-gap::before { border-style: dashed; border-color: var(--ud-amber-bd); background: var(--ud-amber-bg); }
.ud-tl-gap .ud-tl-main { border: 2px dashed var(--ud-amber-bd); border-radius: 8px; padding: 6px 10px; background: var(--ud-amber-bg); color: var(--ud-amber-tx); }
.ud-gap-tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 4px 6px; border-radius: 5px; background: var(--ud-amber-bg); color: var(--ud-amber-tx); border: 1px dashed var(--ud-amber-bd); }
.ud-tl-what { color: var(--ud-text); font-size: 14px; }
.ud-det > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; min-height: 44px; display: flex; align-items: center; }
.ud-tl-det ul, .ud-det ul { padding-left: 18px; }
.ud-tl-det > summary { color: var(--ud-link); }

.ud-branches { display: grid; gap: 10px; }
.ud-branch { border: 1px solid var(--ud-border); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--ud-surface); }
.ud-branch-t { font-size: 14px; }
.ud-anchor { display: inline-block; font-weight: 800; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--ud-blue-bg); color: var(--ud-blue-tx); border: 1px solid var(--ud-blue-bd); }
.ud-canon { font-size: 12px; color: var(--ud-muted); margin-left: 6px; }
.ud-claim { display: block; margin-top: 3px; font-size: 14px; }

/* ── Boxes ────────────────────────────────────────────────────────────────────────────────── */
.ud-box { border: 2px solid; border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.ud-box-amber { background: var(--ud-amber-bg); color: var(--ud-amber-tx); border-color: var(--ud-amber-bd); }
.ud-box-blue { background: var(--ud-blue-bg); color: var(--ud-blue-tx); border-color: var(--ud-blue-bd); }
.ud-box .ud-note { color: inherit; opacity: .9; margin-top: 0; }
.ud-box-t { font-size: 14.5px; font-weight: 800; }
.ud-box .ud-list { padding-left: 18px; display: grid; gap: 8px; }
.ud-why { display: inline-block; margin-left: 4px; font-size: 12px; font-weight: 700; padding: 1px 7px; border: 1px solid currentColor; border-radius: 10px; }
.ud-need { display: block; font-size: 13.5px; margin-top: 2px; }
.ud-conflict { display: grid; gap: 8px; }
.ud-sides { display: grid; grid-template-columns: 1fr; gap: 8px; }
.ud-side { background: var(--ud-surface); color: var(--ud-text); border: 1px solid var(--ud-amber-bd); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; justify-items: start; }
.ud-side-t { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ud-muted); }
.ud-side-s { font-size: 13px; color: var(--ud-muted); }
.ud-ruling { background: var(--ud-surface); }
.ud-box-blue .ud-btn { justify-self: start; background: var(--ud-surface); }

.ud-follow { display: grid; gap: 8px; border-top: 1px solid var(--ud-hair); padding-top: 12px; }
.ud-actions { display: flex; gap: 8px; }
.ud-foot { display: grid; gap: 2px; border-top: 1px solid var(--ud-hair); padding-top: 8px; font-size: 13px; }
.ud-foot .ud-btn { justify-self: start; margin-top: 6px; }
.ud-cost { color: var(--ud-muted); }
.ud-report { background: var(--ud-surface2); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.ud-report .ud-actions { flex-wrap: wrap; }

/* ── History ──────────────────────────────────────────────────────────────────────────────── */
.ud-history { margin-top: 22px; }
.ud-history h2 { font-size: 16px; }
.ud-hist-list { list-style: none; padding: 0; display: grid; gap: 6px; margin-top: 8px; }
.ud-hist { display: grid; gap: 2px; width: 100%; min-height: 56px; text-align: left; font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--ud-hair); background: var(--ud-surface); color: var(--ud-text); cursor: pointer; }
.ud-hist:hover { border-color: var(--ud-accent); }
.ud-hist-q { font-weight: 600; }
.ud-hist-m { font-size: 12.5px; color: var(--ud-muted); }
.ud-tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 9px; border: 1px solid; }
.ud-empty { color: var(--ud-muted); padding: 8px 2px; }

/* ── Provenance drawer ────────────────────────────────────────────────────────────────────── */
.ud-drawer { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; max-width: none !important; }
.ud-drawer-bg { position: absolute; inset: 0; background: rgba(5, 10, 20, .6); }
.ud-drawer-panel { position: relative; width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; background: var(--ud-surface); color: var(--ud-text); border-radius: 16px 16px 0 0; padding: 16px 16px 24px; box-shadow: var(--ud-shadow); display: grid; gap: 10px; }
.ud-drawer-x { justify-self: end; }
.ud-drawer-t { font-size: 17px; }
.ud-prov-val { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ud-prov-label { color: var(--ud-muted); }
.ud-prov { display: grid; grid-template-columns: minmax(84px, 120px) 1fr; gap: 6px 12px; font-size: 14px; }
.ud-prov dt { color: var(--ud-muted); font-weight: 700; }
.ud-prov dd { min-width: 0; }
.ud-legend { list-style: none; padding-left: 0 !important; display: grid; gap: 6px; }
@media (min-width: 720px) { .ud-drawer { align-items: center; } .ud-drawer-panel { border-radius: 16px; } }

@media (max-width: 380px) {
  .ud-root { padding-left: 12px; padding-right: 12px; }
  .ud-card { padding: 12px; }
  .ud-prov { grid-template-columns: 1fr; gap: 0; }
  .ud-prov dd { margin-bottom: 6px; }
}
@media (min-width: 600px) { .ud-sides { grid-template-columns: 1fr 1fr; } .ud-form .ud-btn-primary { width: auto; justify-self: start; } }
@media (prefers-reduced-motion: no-preference) { .ud-btn, .ud-fact, .ud-hist { transition: border-color .12s, filter .12s; } }
@media print { .ud-ask, .ud-history, .ud-progress, .ud-drawer { display: none !important; } }

</style>
<style>
  html { background: #f4f6fa; }
  @media (prefers-color-scheme: dark) { html { background: #0b101b; } }
  body { margin: 0; min-height: 100vh; }
  .pv-bar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; background: var(--ud-surface); border: 1px solid var(--ud-hair); border-radius: 14px; padding: 12px 14px; margin-top: 4px; }
  .pv-bar h1 { font-size: 17px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-row label { font-size: 13px; font-weight: 700; }
  .pv-row select { min-height: 44px; max-width: 100%; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--ud-border); background: var(--ud-surface); color: var(--ud-text); }
  #pv-desk { padding: 0; background: transparent; }
  #pv-desk .ud-fixture-note { margin-top: 12px; }
</style>
</head>
<body>
<div class="ud-root" id="pv-shell">
  <section class="pv-bar" aria-label="Preview controls">
    <h1>Commissioner Desk: fixture preview</h1>
    <p class="ud-note">Sample cards with made-up numbers. No league data, no network, nothing is saved or sent. This is the page that ships dark in Phase 1.</p>
    <div class="pv-row">
      <label for="pv-gallery">Show a card state</label>
      <select id="pv-gallery"><option value="">Pick a card...</option></select>
      <label for="pv-theme">Theme</label>
      <select id="pv-theme"><option value="">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </div>
    <p class="ud-msg" id="pv-err" role="alert"></p>
  </section>
  <div id="pv-desk"></div>
</div>

<script>
/* UPS Commissioner Desk: pure card renderer.
 *
 * No DOM, no network, no globals read. renderCardHtml(card, opts) returns an HTML string.
 * Every dynamic string goes through esc(); the only markup that is not escaped text is
 * markup this file builds itself. Runs in the browser (window.UPSDeskRender) and in node.
 *
 * Contract: docs/ai_desk/DESK_CONTRACT.md "The card", docs/ai_desk/DESK_UX_SPEC.md.
 *   card = { state, lead_md, blocks[], facts_used[], cites[], gaps[], conflicts[], ruling_question,
 *            follow_ups[], facts{id -> {value, unit, display, grade, source, as_of, tool, call_id}},
 *            header{ai_generated, as_of, canon_sha, phase}, footer{tools[], cost_usd}, request_id }
 * Optional fields this renderer also reads (all escaped text): caveat, injection_note, question,
 *   header.league_record_version, fact.label, fact.inputs, fact.code_sha, fact.raw_url (https only),
 *   block.expand_question, footer.sources.
 */
(function (global) {
  "use strict";

  // ── Vocabulary ────────────────────────────────────────────────────────────────────────────
  var GRADE_INFO = {
    A: { text: "A", name: "MFL record" },
    B: { text: "B", name: "League document" },
    C: { text: "C", name: "Derived by code" },
    D: { text: "D", name: "Inferred" },
    NO_RECORD: { text: "NO RECORD", name: "Looked, found nothing" }
  };
  var GRADE_ORDER = ["A", "B", "C", "D", "NO_RECORD"];

  // tone: ok | grey | amber | blue | red | info. `copy` is the one-line banner text (short on purpose).
  var STATE_META = {
    answer: { label: "Answer", tone: "ok", copy: "" },
    answer_with_caveat: { label: "Answer, with a caveat", tone: "grey", copy: "" },
    answer_with_gap: { label: "Partly answered", tone: "amber", copy: "Some of this is not on record. The gaps are listed below." },
    partial: { label: "Partly answered", tone: "amber", copy: "Only part of this is covered. The gaps are listed below." },
    answer_with_conflict: { label: "Sources disagree", tone: "amber", copy: "Two sources give different answers. Both are shown. The desk does not pick one." },
    cite_and_abstain: { label: "Rules found, can't settle it", tone: "info", copy: "The rule text is cited below. The facts or the era can't be settled." },
    needs_ruling: { label: "Needs your ruling", tone: "blue", copy: "Canon is silent or unclear here. A draft question is below for you to edit." },
    abstain: { label: "Not determinable", tone: "grey", copy: "The records needed are not on file. The missing source is named below." },
    refuse_privacy: { label: "Can't share this", tone: "grey", copy: "This data is not available to the desk." },
    refuse_fairness: { label: "Declined", tone: "grey", copy: "The desk will not answer this one." },
    ignore_injection: { label: "Answer, with a notice", tone: "info", copy: "" },
    tool_failure: { label: "Couldn't verify", tone: "red", copy: "A check failed. No numbers were substituted." },
    stale_data: { label: "Stale data", tone: "red", copy: "A source is older than its limit. Treat any value here as out of date." },
    budget_exceeded: { label: "Paused: AI budget reached for this period", tone: "amber", copy: "No model call was made for this question." },
    out_of_scope: { label: "Outside the desk's scope", tone: "grey", copy: "The desk answers league questions. It never posts, sends or changes anything." },
    not_ready: { label: "Desk not ready", tone: "grey", copy: "The desk is not ready yet. Try again shortly." }
  };
  var UNKNOWN_META = { label: "Can't show this answer", tone: "red", copy: "This card has a state the page does not know. Nothing here is shown as fact." };

  var WHY_LABEL = {
    NO_RECORD: "No record",
    unsupported_as_of: "Not available for that date",
    partial_coverage: "Partly covered",
    stale: "Out of date",
    unverified_calculation: "Calculation not verified",
    conflict_in_canon: "Canon disagrees with itself"
  };

  var PHASE_LABEL = { P1: "Phase 1 · draft", P2: "Phase 2", P3: "Phase 3", P4: "Phase 4" };

  var TOKEN_RE = /\{\{([^{}]*)\}\}/g;
  var FACT_TOKEN_RE = /^\s*f\.(c\d{1,3}\.[a-z][a-z0-9_]{0,63})\s*$/;
  var NUMERIC_UNITS = { usd: 1, count: 1, pct: 1, rank: 1, years: 1, week: 1 };

  // ── Small helpers ─────────────────────────────────────────────────────────────────────────
  function str(v) { return v == null ? "" : String(v); }
  function esc(v) {
    return str(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function own(o, k) { return !!o && typeof o === "object" && Object.prototype.hasOwnProperty.call(o, k); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function plain(o) { return o && typeof o === "object" && !Array.isArray(o) ? o : {}; }
  function gradeKey(g) { var k = str(g).toUpperCase().replace(/[\s-]+/g, "_"); return own(GRADE_INFO, k) ? k : ""; }

  // Same deterministic formatting as worker/src/desk/contract.js formatFact; used only when a fact has no server display.
  function ordinal(n) {
    var m = n % 100; if (m >= 11 && m <= 13) return "th";
    return ({ 1: "st", 2: "nd", 3: "rd" })[n % 10] || "th";
  }
  function formatFact(fact) {
    if (!fact || typeof fact !== "object") return "";
    var v = fact.value, n;
    switch (fact.unit) {
      case "usd":
        n = Number(v); if (!isFinite(n)) return str(v);
        var a = Math.abs(n), sign = n < 0 ? "-" : "";
        return a >= 1000 && a % 1000 === 0 ? sign + "$" + (a / 1000) + "K" : sign + "$" + a.toLocaleString("en-US");
      case "pct": return Number(v) + "%";
      case "rank": n = Number(v); return isFinite(n) ? n + ordinal(n) : str(v);
      case "years": return Number(v) === 1 ? "1 year" : str(v) + " years";
      case "week": return "Week " + str(v);
      default: return str(v);
    }
  }
  function factDisplay(fact) {
    if (fact && typeof fact.display === "string" && fact.display !== "") return fact.display;
    if (fact && gradeKey(fact.grade) === "NO_RECORD" && (fact.value == null || fact.value === "")) return "No record";
    return formatFact(fact);
  }
  function getFact(card, id) { return card && own(card.facts, id) && card.facts[id] && typeof card.facts[id] === "object" ? card.facts[id] : null; }

  // The "what I checked" lookup: call id -> tool id.
  function toolByCall(card) {
    var m = {};
    arr(plain(card.footer).tools).forEach(function (t) { if (t && t.call_id != null) m[str(t.call_id)] = str(t.id); });
    return m;
  }

  // ── Grade chip and fact chip ──────────────────────────────────────────────────────────────
  function gradeBadge(g) {
    var k = gradeKey(g); if (!k) return "";
    var i = GRADE_INFO[k];
    return '<span class="ud-gr ud-g-' + k + '" title="' + esc("Grade " + i.text + ": " + i.name) + '"><span class="ud-sr">Evidence grade </span>' + esc(i.text) + "</span>";
  }

  function factChip(id, fact) {
    var k = gradeKey(fact.grade), i = k ? GRADE_INFO[k] : null;
    var disp = factDisplay(fact);
    var label = disp + (i ? ", evidence grade " + i.text + ", " + i.name : ", no evidence grade") + ". Show where it comes from.";
    return '<button type="button" class="ud-fact' + (k ? " ud-fg-" + k : "") + '" data-act="fact" data-fact="' + esc(id) + '" aria-haspopup="dialog" aria-label="' + esc(label) + '">' +
      '<span class="ud-fv">' + esc(disp) + "</span>" + (i ? '<span class="ud-gr ud-g-' + k + '" aria-hidden="true">' + esc(i.text) + "</span>" : "") + "</button>";
  }

  function missingMarker(shown) {
    return '<span class="ud-missing" role="note"><span class="ud-missing-t">Missing fact</span> <code>' + esc(shown) + "</code></span>";
  }

  function inlineText(s) {
    return esc(s).replace(/\*\*([^*\n]{1,200}?)\*\*/g, "<strong>$1</strong>");
  }

  // Fill {{f.cN.key}} tokens with fact chips. A token with no fact becomes a visible marker and is reported; never a guess.
  function fill(text, card, ctx) {
    var src = str(text), out = "", last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(src)) !== null) {
      out += inlineText(src.slice(last, m.index));
      last = m.index + m[0].length;
      var t = FACT_TOKEN_RE.exec(m[1]);
      var fact = t ? getFact(card, t[1]) : null;
      if (fact) out += factChip(t[1], fact);
      else {
        var shown = t ? t[1] : m[1].trim().slice(0, 40);
        if (ctx) { ctx.missing.push(shown); if (typeof ctx.onMissing === "function") { try { ctx.onMissing(shown); } catch (e) { /* logging must never break rendering */ } } }
        out += missingMarker(shown);
      }
    }
    return out + inlineText(src.slice(last));
  }

  // Every fact id a piece of text points at (for tests and the controller).
  function tokenIds(text) {
    var ids = [], m; TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(str(text))) !== null) { var t = FACT_TOKEN_RE.exec(m[1]); if (t) ids.push(t[1]); }
    return ids;
  }

  function paragraphs(text, card, ctx, cls) {
    var parts = str(text).split(/\n{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);
    return parts.map(function (p) { return '<p class="' + cls + '">' + fill(p, card, ctx).replace(/\n/g, "<br>") + "</p>"; }).join("");
  }

  // ── Blocks ────────────────────────────────────────────────────────────────────────────────
  function blockSource(block, card) {
    var calls = arr(block.tool_call_ids).map(str).filter(Boolean);
    if (!calls.length) return "";
    var map = toolByCall(card);
    var bits = calls.map(function (c) { return (map[c] ? "<code>" + esc(map[c]) + "</code> " : "") + "(call " + esc(c) + ")"; });
    return '<p class="ud-block-src">Checked by ' + bits.join(", ") + "</p>";
  }

  function cellHtml(cell, card, ctx) {
    if (cell == null || cell === "") return "—";
    return fill(cell, card, ctx);
  }
  function isNumericCell(cell, card) {
    var m = /^\s*\{\{([^{}]*)\}\}\s*$/.exec(str(cell)); if (!m) return false;
    var t = FACT_TOKEN_RE.exec(m[1]); var f = t ? getFact(card, t[1]) : null;
    return !!(f && own(NUMERIC_UNITS, f.unit));
  }

  function tableHtml(columns, rows, card, ctx, cls, caption) {
    var cols = arr(columns), body = arr(rows);
    var head = cols.length ? "<thead><tr>" + cols.map(function (c) { return '<th scope="col">' + fill(c, card, ctx) + "</th>"; }).join("") + "</tr></thead>" : "";
    var trs = body.map(function (r) {
      var cells = arr(r);
      return "<tr>" + cells.map(function (c, i) {
        var num = i > 0 && isNumericCell(c, card) ? ' class="ud-num"' : "";
        return i === 0 ? '<th scope="row">' + cellHtml(c, card, ctx) + "</th>" : "<td" + num + ">" + cellHtml(c, card, ctx) + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return '<div class="ud-scroll" tabindex="0" role="region" aria-label="' + esc(caption || "Table") + '"><table class="ud-table ' + cls + '"><caption class="ud-sr">' + esc(caption || "Table") + "</caption>" + head + "<tbody>" + trs + "</tbody></table></div>";
  }

  function titleHtml(block, fallback) {
    var t = str(block.title) || fallback;
    return t ? '<h3 class="ud-block-t">' + esc(t) + "</h3>" : "";
  }

  function timelineHtml(block, card, ctx) {
    var rows = arr(block.rows).map(function (r) {
      r = plain(r);
      var kind = r.kind === "gap" ? " ud-tl-gap" : r.kind === "final" ? " ud-tl-final" : "";
      var move = r.from != null || r.to != null ? '<span class="ud-tl-move">' + fill(r.from, card, ctx) + ' <span class="ud-arrow"><span aria-hidden="true">→</span><span class="ud-sr"> to </span></span> ' + fill(r.to, card, ctx) + "</span>" : "";
      var what = r.what != null && r.what !== "" ? '<span class="ud-tl-what">' + fill(r.what, card, ctx) + "</span>" : "";
      var det = arr(r.detail).length
        ? '<details class="ud-det ud-tl-det"><summary>What was exchanged</summary><ul>' + arr(r.detail).map(function (d) { return "<li>" + fill(d, card, ctx) + "</li>"; }).join("") + "</ul></details>" : "";
      var gr = r.kind === "gap" ? '<span class="ud-gap-tag">Gap</span>' : gradeBadge(r.grade);
      return '<li class="ud-tl-row' + kind + '"><span class="ud-tl-date">' + fill(r.date, card, ctx) + '</span><div class="ud-tl-main">' + move + what + det + '</div><span class="ud-tl-g">' + gr + "</span></li>";
    }).join("");
    return '<ol class="ud-timeline">' + rows + "</ol>";
  }

  function chartHtml(block, card, ctx) {
    var cols = arr(block.columns), rows = arr(block.rows);
    var pts = rows.map(function (r) {
      var cells = arr(r), label = str(cells[0]), raw = cells[1], v = NaN;
      var m = /^\s*\{\{([^{}]*)\}\}\s*$/.exec(str(raw)), t = m ? FACT_TOKEN_RE.exec(m[1]) : null, f = t ? getFact(card, t[1]) : null;
      if (f) v = Number(f.value); else if (!m && raw != null && raw !== "") v = Number(raw);
      return { label: label, v: v, disp: f ? factDisplay(f) : str(raw) };
    });
    var table = tableHtml(cols, rows, card, ctx, "ud-chart-table", str(block.title) + " (values)");
    var good = pts.filter(function (p) { return isFinite(p.v); });
    if (pts.length < 4 || good.length < 2) return '<p class="ud-note">A chart appears only for a trend across four or more seasons. The table has the values.</p>' + table;
    var W = 320, H = 156, padL = 6, padR = 6, padT = 30, padB = 26;
    var max = Math.max.apply(null, good.map(function (p) { return p.v; }).concat([0]));
    var min = Math.min.apply(null, good.map(function (p) { return p.v; }).concat([0]));
    var span = max - min || 1;
    var pw = (W - padL - padR) / pts.length;
    var y = function (v) { return padT + (max - v) / span * (H - padT - padB); };
    var y0 = y(0), svg = "";
    var every = pts.length > 8 ? 2 : 1;
    pts.forEach(function (p, i) {
      var x = padL + i * pw;
      if (isFinite(p.v)) {
        var top = Math.min(y(p.v), y0), h = Math.max(Math.abs(y(p.v) - y0), 1);
        svg += '<rect class="ud-bar" x="' + (x + pw * 0.15).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + (pw * 0.7).toFixed(1) + '" height="' + h.toFixed(1) + '"></rect>';
      }
      if (i % every === 0) svg += '<text class="ud-axis" x="' + (x + pw / 2).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(p.label) + "</text>";
    });
    arr(block.eras).forEach(function (e, ei) {
      e = plain(e);
      var idx = -1; pts.forEach(function (p, i) { if (idx < 0 && p.label === str(e.at)) idx = i; });
      if (idx < 0) return;
      var x = padL + idx * pw;
      svg += '<line class="ud-era" x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (padT - 6 - (ei % 2) * 11) + '" y2="' + (H - padB) + '"></line>';
      svg += '<text class="ud-era-t" x="' + (x + 3).toFixed(1) + '" y="' + (padT - 10 - (ei % 2) * 11) + '">' + esc(e.label) + "</text>";
    });
    svg += '<line class="ud-base" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y0.toFixed(1) + '" y2="' + y0.toFixed(1) + '"></line>';
    var aria = str(block.title) + ": " + good.length + " seasons from " + str(pts[0].label) + " to " + str(pts[pts.length - 1].label) + ". The table below has every value.";
    return '<figure class="ud-chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(aria) + '" preserveAspectRatio="xMidYMid meet">' + svg + "</svg></figure>" + table;
  }

  function branchHtml(block, card, ctx) {
    return '<div class="ud-branches">' + arr(block.branches).map(function (b) {
      b = plain(b); var rule = plain(b.rule);
      return '<section class="ud-branch"><h4 class="ud-branch-t">' + esc(b.label) + "</h4>" +
        (b.reading ? '<p class="ud-branch-r">' + fill(b.reading, card, ctx) + "</p>" : "") +
        (rule.anchor ? '<p class="ud-branch-rule"><span class="ud-anchor">' + esc("§ " + rule.anchor) + "</span> " + esc(rule.claim) + "</p>" : "") +
        (b.needs ? '<p class="ud-branch-needs"><strong>It would need:</strong> ' + fill(b.needs, card, ctx) + "</p>" : "") + "</section>";
    }).join("") + "</div>";
  }

  function blockHtml(block, idx, card, ctx) {
    block = plain(block);
    var type = str(block.type), inner = "";
    if (type === "table") inner = titleHtml(block, "") + tableHtml(block.columns, block.rows, card, ctx, "", block.title || "Table");
    else if (type === "comparison") inner = titleHtml(block, "Comparison") + tableHtml(block.columns, block.rows, card, ctx, "ud-compare", block.title || "Comparison") +
      (block.owner_registry === true ? "" : '<p class="ud-note">Franchise, not owner: these columns follow the franchise id until the owner registry exists.</p>');
    else if (type === "timeline") inner = titleHtml(block, "Timeline") + timelineHtml(block, card, ctx);
    else if (type === "chart") inner = titleHtml(block, "Trend") + chartHtml(block, card, ctx);
    else if (type === "branch") inner = titleHtml(block, "Readings") + branchHtml(block, card, ctx);
    else inner = '<p class="ud-note">This block type is not shown: ' + esc(type || "none") + ".</p>";
    var expand = block.expand_question
      ? '<button type="button" class="ud-btn ud-btn-ghost" data-act="expand" data-busy-off="1" data-block="' + idx + '">' + esc(block.expand_label || "Expand the next level") + "</button>" : "";
    return '<section class="ud-block ud-b-' + esc(type.replace(/[^a-z_]/g, "")) + '" data-block="' + idx + '">' + inner + blockSource(block, card) + expand + "</section>";
  }

  // ── Boxes ─────────────────────────────────────────────────────────────────────────────────
  function gapsBox(gaps, card, ctx) {
    if (!arr(gaps).length) return "";
    return '<section class="ud-box ud-box-amber" aria-labelledby="ud-gaps-h"><h3 id="ud-gaps-h" class="ud-box-t">Gaps: what is missing</h3><ul class="ud-list">' +
      arr(gaps).map(function (g) {
        g = plain(g);
        return "<li><strong>" + fill(g.what, card, ctx) + '</strong> <span class="ud-why">' + esc(own(WHY_LABEL, g.why) ? WHY_LABEL[g.why] : str(g.why)) + "</span>" +
          (g.source_needed ? '<span class="ud-need">Would settle it: ' + esc(g.source_needed) + "</span>" : "") + "</li>";
      }).join("") + "</ul></section>";
  }

  function conflictsBox(conflicts, card, ctx) {
    if (!arr(conflicts).length) return "";
    return '<section class="ud-box ud-box-amber" aria-labelledby="ud-conf-h"><h3 id="ud-conf-h" class="ud-box-t">Sources disagree</h3>' +
      arr(conflicts).map(function (c) {
        c = plain(c);
        var side = function (key, tag) {
          var f = getFact(card, str(key).replace(/^f\./, ""));
          var id = str(key).replace(/^f\./, "");
          if (!f) { if (ctx) { ctx.missing.push(id); if (typeof ctx.onMissing === "function") { try { ctx.onMissing(id); } catch (e) { /* ignore */ } } } return '<div class="ud-side"><span class="ud-side-t">' + tag + "</span>" + missingMarker(id) + "</div>"; }
          return '<div class="ud-side"><span class="ud-side-t">' + tag + "</span>" + factChip(id, f) + '<span class="ud-side-s">' + esc(f.source) + (f.label ? " · " + esc(f.label) : "") + "</span></div>";
        };
        return '<div class="ud-conflict"><div class="ud-sides">' + side(c.fact_a, "Source A") + side(c.fact_b, "Source B") + "</div>" + (c.note ? '<p class="ud-conflict-n">' + fill(c.note, card, ctx) + "</p>" : "") + "</div>";
      }).join("") + "</section>";
  }

  function rulingBox(card) {
    var q = str(card.ruling_question).trim();
    if (!q) return "";
    return '<section class="ud-box ud-box-blue" aria-labelledby="ud-rule-h"><h3 id="ud-rule-h" class="ud-box-t">Draft ruling question</h3>' +
      '<p class="ud-note">The desk drafts this. It never sends it or decides it. Edit it, then use it your way.</p>' +
      '<label class="ud-sr" for="ud-ruling-text">Draft ruling question, editable</label>' +

<script>
/* UPS Commissioner Desk: controller.
 *
 * Needs desk_render.js loaded first (window.UPSDeskRender). Talks to the Worker ONLY through one injected `api` object,
 * so the same code runs against the live Worker (commish_settings.html) or fixtures (desk_preview.html):
 *
 *   api.ask({question, as_of}, {onProgress})  -> Promise<{request_id, card}>
 *   api.history()                             -> Promise<{items:[{id, created_at, question, state}]}>
 *   api.question(id)                          -> Promise<{item:{id, created_at, question, state, card}}>
 *   api.report({id, note})                    -> Promise<{ok:true}>
 *   api.status()                              -> Promise<{enabled, live_model_enabled, budget}>   (optional here)

 * and the first goes to the desk's own private eval log through api.report.

(function (global) {

    if (code === "not_ready" || /not_ready/i.test(msg) || (err && err.status === 503)) return R.syntheticCard("not_ready");

      (options.banner ? '<p class="ud-fixture-note ud-caveat" role="note"></p>' : "") +

        '<label class="ud-label" for="' + id + '-q">Ask a league question</label>' +
        '<textarea id="' + id + '-q" class="ud-input" rows="2" maxlength="600" data-role="q" placeholder="For example: trace a pick, or what a rule says" enterkeyhint="send"></textarea>' +
        '<div class="ud-asof"><label for="' + id + '-a">Data as of</label>' +
          '<select id="' + id + '-a" class="ud-input" data-role="asof"><option value="current">Current data</option><option value="date">A past date</option></select>' +
          '<label class="ud-sr" for="' + id + '-d">Past date</label><input id="' + id + '-d" class="ud-input" type="date" data-role="asof-date" hidden></div>' +

        '<div class="ud-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="ud-drawer-t" tabindex="-1">' +
        '<button type="button" class="ud-btn ud-btn-ghost ud-drawer-x" data-act="close-drawer">Close</button><div data-role="drawer-body"></div></div></div>';

    }

<script id="pv-boot">
(function () {
  "use strict";
  var shell = document.getElementById("pv-shell"), host = document.getElementById("pv-desk");
  var gallery = document.getElementById("pv-gallery"), themeSel = document.getElementById("pv-theme"), err = document.getElementById("pv-err");
  var ctrl = null, fx = null;

  function start(data) {
    fx = data;
    var api = UPSDesk.makeFixtureApi({ questions: data.questions, cards: data.cards, fallback: data.fallback }, { delayMs: 1400 });
    ctrl = UPSDesk.mount(host, {
      api: api,
      banner: "Fixture preview: free text only matches the sample questions below.",
      suggestions: data.questions.map(function (q) { return { q: q.question, suggested: !!q.suggested }; })
    });
    Object.keys(data.cards).sort().forEach(function (name) {
      var o = document.createElement("option"); o.value = name; o.textContent = data.cards[name].state + " (" + name + ")"; gallery.appendChild(o);
    });
  }

  gallery.addEventListener("change", function () {
    if (!ctrl || !gallery.value || !fx) return;
    var c = JSON.parse(JSON.stringify(fx.cards[gallery.value]));
    ctrl.showCard(c, c.question);
  });
  themeSel.addEventListener("change", function () {
    [shell, host].forEach(function (n) { if (themeSel.value) n.setAttribute("data-theme", themeSel.value); else n.removeAttribute("data-theme"); });
    document.documentElement.style.background = themeSel.value === "dark" ? "#0b101b" : themeSel.value === "light" ? "#f4f6fa" : "";
  });

  if (window.UPS_DESK_FIXTURES) { start(window.UPS_DESK_FIXTURES); return; }
  // Source layout (served over http from this folder): load the fixture files next to the page.
  function getJson(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }); }
  getJson("fixtures/demo_questions.json").then(function (dq) {
    return Promise.all(dq.cards.map(function (n) { return getJson("fixtures/cards/" + n + ".json"); })).then(function (list) {
      var cards = {}; dq.cards.forEach(function (n, i) { cards[n] = list[i]; });
      start({ questions: dq.questions, cards: cards, fallback: dq.fallback });
    });
  }).catch(function () { err.textContent = "Fixtures did not load. Open desk_preview.single.html, or serve this folder over http."; });
})();
</script>
