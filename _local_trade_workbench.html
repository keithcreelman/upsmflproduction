<!doctype html>
<!-- ─────────────────────────────────────────────────────────────────
     Local Trade Workbench preview — verify PR #67 (CSS inline) works.

     This file is served over the same python http.server on port 8765
     that powers _local_roster_workbench.html.

     URL:
       http://localhost:8765/_local_trade_workbench.html
       http://localhost:8765/_local_trade_workbench.html?F=0001    ← swap teams

     Live data: production Cloudflare worker. Read-only by default
     (clicking Submit posts to MFL through the worker — read the orange
     banner at top before doing anything destructive).

     This file is NOT pushed to GitHub. Worktree-local review aid.
     ───────────────────────────────────────────────────────────── */ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UPS Trade Workbench — Local Review</title>
  <meta name="color-scheme" content="dark light">

  <style>
    body { margin: 0; background: #0b0f18; color: #d8e2f0;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .ups-local-banner {
      position: sticky; top: 0; z-index: 99999;
      background: linear-gradient(90deg, #ff8c00, #ffa840);
      color: #1a1a1a; font-weight: 700; font-size: 13px;
      padding: 8px 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.2px;
    }
    .ups-local-banner code {
      background: rgba(0, 0, 0, 0.15);
      padding: 1px 6px; border-radius: 4px; font-size: 12px;
    }
    iframe.twb-frame {
      width: 100%; height: calc(100vh - 50px); border: 0; display: block;
    }
  </style>
</head>
<body>

  <div class="ups-local-banner">
    🔍 <strong>LOCAL REVIEW — TRADE WAR ROOM (PR #67 inline-CSS)</strong>.
    Default <code>?F=0008</code> (Blake Bombers). NOT a sandbox — Submit hits production MFL.
  </div>

  <iframe id="twbFrame" class="twb-frame" title="UPS Trade War Room"></iframe>

  <script>
    (function () {
      var u = new URL(window.location.href);
      var fid = u.searchParams.get("F") || u.searchParams.get("FRANCHISE_ID") || "0008";
      var league = u.searchParams.get("L") || "74598";
      var year = u.searchParams.get("YEAR") || "2026";

      // Build the trade workbench URL pointing at the LOCAL file
      // (sibling at site/trades/trade_workbench.html on this branch =
      // PR #67 with inlined CSS) + the production worker as the API.
      var src = "site/trades/trade_workbench.html"
        + "?L=" + encodeURIComponent(league)
        + "&YEAR=" + encodeURIComponent(year)
        + "&F=" + encodeURIComponent(fid)
        + "&api=" + encodeURIComponent("https://upsmflproduction.keith-creelman.workers.dev/trade-workbench")
        + "&DIRECT_MFL=1"
        + "&embed=1";

      document.getElementById("twbFrame").src = src;
    })();
  </script>

</body>
</html>
